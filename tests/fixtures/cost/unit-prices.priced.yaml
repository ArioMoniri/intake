# TEST FIXTURE — not a price list (INT-190).
#
# The same components and budgets as infra/costs/unit-prices.yaml, with
# SYNTHETIC rates and limits so the cost arithmetic, the budget verdicts and
# the alert expressions have something to multiply in tests. The values are
# deliberately absurd (whole US dollars per character, per token, per audio
# second) so that no reader can mistake one for a vendor's price, and every row
# says so in its `source`. Nothing outside tests/ and the recorded console
# fixture reads this file.
#
# Two rows are left unpriced on purpose: `sms` and `gpu_host_team` exercise the
# "price not configured" path next to priced rows.
schema_version: 1
currency: USD

components:
  - component: asr
    vendor: self-hosted
    vendor_note: null
    unit: audio_second
    profiles: [residency_tr]
    usage:
      metric: voice_stt_audio_s
      aggregation: histogram_sum
      selector: {vendor: self-hosted}
    usage_note: null
    price: {usd_per_unit: 3, source: "synthetic test rate, not a price", as_of: 2026-09-26}

  - component: tts_dynamic
    vendor: self-hosted
    vendor_note: null
    unit: character
    profiles: [residency_tr]
    usage:
      metric: voice_tts_chars
      aggregation: histogram_sum
      selector: {vendor: self-hosted}
    usage_note: null
    price: {usd_per_unit: 2, source: "synthetic test rate, not a price", as_of: 2026-09-26}

  - component: llm_talker
    vendor: self-hosted
    vendor_note: null
