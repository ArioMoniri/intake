# SENTETİK TEST VERİSİ — INT-040 near-miss negative control.
# MUST FAIL VALIDATION: tighten_rule whose `when` root operator is && — the
# exact failure files/12 §4 fixed ("temp_c >= 38 && age > 65 silently removes
# the flag for everyone under 65"). A tightened rule must be a syntactic
# disjunction with one disjunct structurally identical to the parent.
kind: pack
id: specialty.synthetic_daraltici
layer: specialty
version: 1.0.0
schema_version: 2
maturity: L0
status: awaiting-clinical-review
language: tr
title_tr: "Sentetik daraltıcı paket"
extends: base.synthetic
ops:
  - op: tighten_rule
    parent_rule_id: rf.synthetic_kirmizi
    rule:
      id: rf.synthetic_kirmizi.dar
      label_tr: "Sentetik kural — daraltılmış"
      when: >-
        (renk_tercihi == 'kirmizi' || bekleme_suresi_asildi == true)
        && yas_grubu == 'ileri'
      tense: now
      tense_anchor: olay_zamani
      level: KIRMIZI_K2
      route: EMERGENCY_NOW
      register: ALERT
      notify_clinic: always
      status: active
      source:
        guideline_id: SYN-GUIDE-B
        guideline_title: "Sentetik kılavuz B"
        version_or_date: "sürüm iki"
        url: "https://example.invalid/syn-guide-b"
        retrieved_on: 2026-08-28
        quote: "daraltma sentetik alıntısı"
      action:
        REMOTE:
          primary: CALL_112
          show_112: true
          action_tr: "Hemen yardım isteyin."
        ON_SITE:
          primary: GO_TO_IN_HOUSE_ACIL
          show_112: false
          notify_staff_immediate: true
          action_tr: "Görevlilere haber verin ve bekleyin."
        UNKNOWN:
          ask_one_tr: "Şu anda hastanede misiniz?"
          on_yes: ON_SITE
          on_no: REMOTE
          on_no_answer: REMOTE
