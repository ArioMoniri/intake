# SENTETİK TEST VERİSİ — INT-040 golden fixture. Mechanism-only: every id,
# rule, slot and Turkish string in this file is invented for tests and has no
# clinical meaning. Nothing here is ever served (files/04 §7: packs and
# goldens contain synthetic data only).
kind: pack
id: base.synthetic
layer: base
version: 1.0.0
schema_version: 2
maturity: L0
status: awaiting-clinical-review
language: tr
title_tr: "Sentetik temel paket"
voice:
  allow_paraphrase: true
  backchannel_ok: true
  ack_style: brief
  pace: normal
sections:
  ornek_bolum:
    slots:
      renk_tercihi:
        type: code
        valueset: vs.synthetic_renk
        required: true
        must_ask: true
        ask_tr: "Örnek soru: hangi rengi seçersiniz?"
        follow_up_tr: "Bir renk adı söyleyebilir misiniz?"
        choices_tr: ["mavi", "yeşil"]
      bekleme_suresi:
        type: quantity
        unit: gun
        required: true
        ask_tr: "Örnek soru: ne kadar süredir bekliyorsunuz?"
        follow_up_tr: "Gün olarak yaklaşık söyleyebilir misiniz?"
      olay_zamani:
        type: date
        ask_tr: "Örnek soru: bu ne zaman oldu?"
red_flags:
  - id: rf.synthetic_kirmizi
    label_tr: "Sentetik kırmızı kural"
    when: "renk_tercihi == 'kirmizi' || bekleme_suresi_asildi == true"
    tense: now
    tense_anchor: olay_zamani
    level: KIRMIZI_K2
    route: EMERGENCY_NOW
    register: ALERT
    notify_clinic: always
    status: active
    source:
