- path: docs/PROGRESS.md
  kind: former_name
  line: '- Goal: make Vizite presentable as an embeddable SERVICE — a partner drops a "Start pre-visit" button into its own app, the branded intake runs for that partner''s patient, the note flows back. This is an ARCHITECTURE change, so ADR first (ADR-029) + a minimal, secure, fail-closed scaffold for ONE dev-tier synthetic partner tenant. Not a production build.'
  why: a PROGRESS entry written before INT-420; iteration history is not rewritten
- path: docs/PROGRESS.md
  kind: former_name
  line: '- THE SURFACE IS A SIGNED TICKET, NOT AN EMBEDDED UI, AND THAT IS THE DECISION EVERYTHING FOLLOWS FROM (ADR-029). An embedded Vizite UI in the partner''s origin would put a PHI surface in a third-party origin and make the partner page an injection surface. Instead: the partner BACKEND mints a launch ticket server-to-server (`POST /embed/v1/launch-tickets`), the patient device presents it (`POST /embed/v1/launch`), and only then does the branded intake start. HS256 over the stdlib `hmac` primitive `room_tokens` already uses — no token library — closed claim set `{tenant_id, nonce, iat, exp≤120s, purpose}`, no clinical or personal value in the token.'
  why: a PROGRESS entry written before INT-420; iteration history is not rewritten
- path: docs/PROGRESS.md
  kind: former_name
  line: '- NO NEW SERVICE, NO NEW TABLE, NO NEW PERSONAL-DATA FIELD. The routes live in services/api (already exposing /healthz /readyz /metrics /version — inv. 15 satisfied) under a new SEVENTH consent-scan marker `partner_embed` caged to `/embed` (the door has no Vizite data subject; consent is collected by Vizite''s own docs/legal flow afterwards, inv. 4/18). A partner-supplied patient identifier / note-back correlation is deliberately OUT of scope — linking it is a new personal-data category and recipient needing human sign-off, so the ticket carries no patient id and nothing is persisted or linked (inv. 17/18). The note flows back only through the existing connector path (ADR-026): the embed adds no new outbound PHI path.'
  why: a PROGRESS entry written before INT-420; iteration history is not rewritten
- path: docs/PROGRESS.md
  kind: former_name
  line: '- THE PARTNER BUTTON HOLDS NO SECRET. `packages/embed-sdk` (`@intake/embed-sdk`, TS strict) is a thin launcher: on a tap it calls the PARTNER''S own backend for the launch response and only ever opens an `https` Vizite URL — a non-https partner endpoint or launch URL is refused, so a tampered response cannot become an open-redirect or a `javascript:` sink.'
  why: a PROGRESS entry written before INT-420; iteration history is not rewritten
- path: docs/PROGRESS.md
  kind: former_name
  line: '- Tests added (with the near-miss negative for any safety rule): 43 — `apps/mobile/e2e/review_send.spec.ts` (27), `src/lib/intake/share.test.ts` (7), `src/lib/intake/csat.test.ts` (9). The safety rules carry negative controls and all three were proved non-vacuous by mutants that were inserted, watched to fail, and reverted: a `disabled` prop on the send CTA, a restored `router.replace`, and an invented `https://vizite.example/n/{visitId}` Doctor Link. Each fired exactly one control. The consent gate''s near-miss is a ledger with the satisfaction text loaded but not granted, and a ledger with a *different* purpose granted — both must refuse.'
  why: a PROGRESS entry written before INT-420; iteration history is not rewritten
- path: docs/PROGRESS.md
  kind: former_name
  line: '- Tests added (with the near-miss negative for any safety rule): 35 in `tests/engines/test_policyguard_locale.py`, six of them structural against the modules'' own `ast` parse (no locale-shaped parameter on the constructor, no default for `lexicon`, no `import re` and no `.compile(` anywhere in `policy_guard.py`, no shipped module constructing the guard outside its factory, no defaulted lexicon/locale/sign-off in the lexicon modules, and `SignedGuardLexicon` unconstructible outside the compiler). INT-248''s near-miss controls are re-pinned beside the five positives — *"Devam edin"*, *"Acil Servis''e gidin"*, *"Vizite tanı koymaz"*, *"…hekiminize ulaşsın"* — so a locale-aware guard that quietly re-broke them fails here too. Four perturbation runs are recorded in the evidence; one of them **found a real defect in this change**: the Turkish document filed under `ar` compiled cleanly and produced an Arabic guard running the Turkish arms, because every other check reads the document''s own locale and the document was honest. Fixed by validating the table at import.'
  why: a PROGRESS entry written before INT-420; iteration history is not rewritten
- path: docs/PROGRESS.md
  kind: former_name
  line: '- Decisions / ADRs / `00_STATE.md` rows: no ADR — this completes ADR-029''s mechanism (the launch "returns the id of the consent document set to show — Vizite then collects consent through its own docs/legal-bound flow"), it does not change the decided shape. Two choices worth the next person''s minute: (a) the `core` service consent is rendered from the SAME global consent catalogue a later `POST /v1/consents/grant` binds against — NOT a partner-branded copy — so what the patient reads and what a grant records can never drift (a per-tenant `core` copy would have failed the "grant against the text you showed" contract); the partner-specific delta is a separate `partner_processor` DISCLOSURE (aydınlatma, shown never granted), which is why it did not need a new files/06 §2 purpose. (b) the render always reads the tenant''s `legal_root`; `embed_disclosure_root` swaps the `docs/legal/` prefix for the dev-legal base (derived from `settings.legal_root.parent`), so one code path reads the committed counsel tree in prod and the dev tree locally.'
  why: a PROGRESS entry written before INT-420; iteration history is not rewritten
