# INT-420 — every tracked line that may still carry the old brand spelling.
#
# Read by tests/release/test_brand_name.py, which fails on any occurrence (any
# letter case, identifiers included) that is not listed here, and on any entry
# whose line is gone. Match is on the path plus the exact line, trimmed.
#
# kind:
#   common_noun — the Turkish word (vizit + -e, "to a visit"; vizite, "a
#                 doctor's visit"), used as a word. Never an identifier.
#   former_name — a dated record naming the product as it was called on its
#                 date (evidence, PROGRESS history, an audit), or INT-420's own
#                 title. A record is not rewritten.
#
# Adding an entry is a review decision: say why in `why`. The brand is Önvizit
# (ASCII `onvizit`); anything else goes, it does not get listed.

