# files/08 §4 rows that carry no metric id yet (prose KPIs; recorded here so
# they are not silently dropped — each enters the catalogue as an entry the
# moment the spec names its id):
# - group H, adoption & business: activation (fast intake within 7 days),
#   weekly intakes per clinic, notes delivered, branch coverage used,
#   companion-profile share, consent opt-in by layer, revocations honoured
#   under one minute.
# - group I, operations: RED/USE per service beyond the svc_* golden signals,
#   GPU utilisation and memory, Celery/Redis queue depth, DB replication lag,
#   storage growth, certificate expiry (sec_cert_expiry_days covers the
#   security view).
# - group J, cost: tokens/chars/audio-seconds by vendor, GPU hours, forecast
#   vs budget.
# - group K, compliance: consent coverage by version, vendor notifications
#   due/overdue, DSAR SLA, residency attestation per tenant, retention job
#   success (sec_audit_chain_ok covers the daily integrity check).
# - group L, learning loops: proposals opened/approved/rejected, canary
#   outcomes, rollback count, evidence-bundle completeness, k-anonymity
#   rejections, GEPA experiment deltas on held-out sets.
