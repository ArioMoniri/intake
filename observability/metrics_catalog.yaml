# observability/metrics_catalog.yaml — the closed registry of Prometheus
# series the platform emits or has committed to emit (INT-021, INT-025;
# CLAUDE.md inv. 13; files/03 §19; files/08 §4).
#
# A series served on /metrics — or constructed in code — but absent here
# fails CI (tests/observability/test_slo_files.py and
# tests/observability/test_metrics_catalog.py), and every docs/slo/<service>
# SLI may reference only names listed here. Label names are schema-checked
# against the PHI-risk denylist in intake_platform.slo (inv. 6): identifiers
# and enumerations only, never free text.
#
# Two kinds of entry (status):
# - live: real code emits it today. The two http_* families come from
#   intake_platform.metrics.mount_http_metrics; the process_*/python_*
#   families from the prometheus_client default collectors behind
#   intake_platform.health's /metrics endpoint.
# - planned: files/08 §4 names the id but the emitting service has not landed
#   yet. `id` preserves the spec's OTel dotted id; `name` is its Prometheus
#   form (dots become underscores). tests/observability/test_metrics_catalog.py
#   holds this file complete against 08 §4 and keeps `status` honest in both
#   directions: a live entry must be observably emitted, a planned entry must
#   not be.
metrics:
  # --- live series (INT-021) ---------------------------------------------------
  - name: http_requests_total
    type: counter
    labels: [service, method, route, status]
    owner: platform
    unit: "count"
    description: >-
      HTTP requests handled, by service, method, route template and status
      code. Emitted by intake_platform.metrics.mount_http_metrics; the
      route label is the template, never the raw path.
  - name: http_request_duration_seconds
    type: histogram
    labels: [service, method, route]
    owner: platform
    unit: "s"
    description: >-
      HTTP request duration in seconds, by service, method and route
      template. Emitted by intake_platform.metrics.mount_http_metrics;
      latency SLIs read the bucket series.
  - name: process_cpu_seconds_total
    type: counter
    labels: []
    owner: platform
    unit: "s"
    description: >-
      Total user and system CPU time spent by the process, in seconds
      (prometheus_client process collector).
  - name: process_resident_memory_bytes
    type: gauge
    labels: []
    owner: platform
    unit: "bytes"
    description: Resident memory size in bytes (prometheus_client process collector).
  - name: process_virtual_memory_bytes
    type: gauge
    labels: []
    owner: platform
    unit: "bytes"
    description: Virtual memory size in bytes (prometheus_client process collector).
  - name: process_start_time_seconds
    type: gauge
    labels: []
    owner: platform
    unit: "s"
    description: >-
      Start time of the process since the unix epoch, in seconds
      (prometheus_client process collector).
  - name: process_open_fds
    type: gauge
    labels: []
    owner: platform
    unit: "count"
    description: Number of open file descriptors (prometheus_client process collector).
  - name: process_max_fds
    type: gauge
    labels: []
    owner: platform
    unit: "count"
    description: Maximum number of open file descriptors (prometheus_client process collector).
  - name: python_gc_objects_collected_total
    type: counter
    labels: [generation]
    owner: platform
    unit: "count"
    description: Objects collected during garbage collection (prometheus_client gc collector).
  - name: python_gc_objects_uncollectable_total
    type: counter
    labels: [generation]
    owner: platform
    unit: "count"
    description: >-
      Uncollectable objects found during garbage collection
      (prometheus_client gc collector).
  - name: python_gc_collections_total
    type: counter
    labels: [generation]
    owner: platform
    unit: "count"
    description: Number of times each garbage-collector generation was collected.
  - name: python_info
    type: gauge
    labels: [implementation, major, minor, patchlevel, version]
    owner: platform
    unit: "info"
    description: Python interpreter build information (prometheus_client platform collector).
  - name: retention_destruction_runs_total
    type: counter
    labels: [kind, outcome]
    owner: platform
    unit: "count"
    description: >-
      Destruction runs by kind (periodic/dsar) and outcome
      (completed/refused_floor). Emitted by
      intake_platform.retention.engine.DestructionEngine — the sec_row
      `retention` signal: a destruction job failing silently is the threat,
      so completions and floor refusals are both counted (INT-036,
      DEST-2017).
  - name: retention_destroyed_items_total
    type: counter
    labels: [data_class]
    owner: platform
    unit: "count"
    description: >-
      Items destroyed by the retention engine, by files/06 §3 policy data
      class (closed DestroyableClass enumeration, never free text). Emitted
      by intake_platform.retention.engine.DestructionEngine (INT-036).
  - name: document_upload_pipeline
    type: counter
    labels: [outcome, reason]
    owner: records
    unit: "count"
    description: >-
      Upload pipeline outcomes (INT-120; files/10 §9 records signals).
      Emitted by intake_platform.uploads.UploadPipeline. outcome is one of
      promoted / rejected / already-processed / scan-unavailable; reason is
      the closed RejectReason code for rejections and "none" otherwise —
      enumerations only, never content (invariant 6).
  - name: llm_trace_spans_emitted_total
    type: counter
    labels: [kind, outcome]
    owner: platform
    unit: "count"
    description: >-
      LLM trace spans emitted to the self-hosted trace store, by SpanKind and
      SpanOutcome (INT-175; files/08 §7). Emitted by
      intake_platform.observability.spans.emit_llm_span. Both labels are
      closed enumerations; the span payload itself is ids, enums and counts —
      HB-L6 keeps content out of it entirely.
  - name: llm_trace_fields_refused_total
    type: counter
    labels: [field]
    owner: platform
    unit: "count"
    description: >-
      Span fields refused at the emission boundary because the value was not
      id-shaped (INT-175). The label is the FIELD NAME, never the value: a
      refusal counter carrying the refused string would be the leak it exists
      to prevent (invariant 6). A non-zero rate means a caller is trying to
      put narrative on a trace and should be found.
  - name: annotation_queue_enqueued_total
    type: counter
    labels: [queue]
    owner: platform
    unit: "count"
    description: >-
      Annotation-queue items enqueued, by queue (note_quality /
      hallucination_audit / false_red_review; INT-175, files/08 §3). An item
      is a pointer — ids, a span ref and a timestamp — so enqueueing carries
      no clinical content. Emitted by
      intake_platform.observability.annotation.enqueue.
  - name: annotation_content_reads_refused_total
    type: counter
    labels: [queue, blocker]
    owner: platform
    unit: "count"
    description: >-
      Staff attempts to read the clinical content behind an annotation-queue
      item, refused by an open blocker (INT-175; HB-L6). Today every attempt
      is refused, so this is the honest measure of demand for a read path
      that does not exist yet, and it feeds the same intrusion posture
      files/08 §2.5 puts on break-glass rate. Every attempt is audited before
      it is refused.
  - name: event_bus_consumer_lag
    type: gauge
    labels: [stream, group]
    owner: platform
    unit: "messages"
    description: >-
      Unprocessed messages for one consumer group on one Redis stream:
      entries past last-delivered-id plus delivered-but-unacknowledged
      entries, summed over the source stream and its group-local retry
      stream. Set by intake_platform.event_bus.Consumer.record_lag
      (INT-035); the alerting surface for a stalled or crash-looping
      consumer.
  - name: event_bus_retried_total
    type: counter
    labels: [stream, group]
    owner: platform
    unit: "count"
    description: >-
      Event deliveries requeued for retry after a handler failure, by source
      stream and consumer group; the exponential-backoff bookkeeping travels
      in the requeued message itself. Emitted by
      intake_platform.event_bus.Consumer (INT-035).
  - name: event_bus_dead_lettered_total
    type: counter
    labels: [stream, group, reason]
    owner: platform
    unit: "count"
    description: >-
      Events moved to the per-stream dead-letter stream after the retry cap
      (handler_error) or on a payload failing its event schema
      (schema_invalid). reason is the closed DeadLetterReason code — never
      exception text, which could carry PHI (invariant 6). Emitted by
      intake_platform.event_bus.Consumer (INT-035).
  # --- live series (INT-024): chaos harness + vendor degradation router ------
  - name: vendor_adapter_failures_total
    type: counter
    labels: [adapter]
    owner: platform
    unit: "count"
    description: >-
      Vendor adapter calls that failed, by adapter id. Emitted by
      intake_platform.chaos.DegradationRouter at the provider-agnostic
      adapter seam (AdapterProbe contract); the sec_row `resilience`
      failure signal.
  - name: vendor_adapter_fallbacks_total
    type: counter
    labels: [adapter, mode]
    owner: platform
    unit: "count"
    description: >-
      Fallback decisions handed to callers after a vendor adapter failure,
      by adapter id and fallback mode. mode is the closed RouteMode
      enumeration; `typed` is the degrade-to-text tier (ADR-010). Emitted
      by intake_platform.chaos.DegradationRouter (INT-024).
  - name: vendor_fallback_latency_seconds
    type: histogram
    labels: [adapter]
    owner: platform
    unit: "s"
    target: "<= 2 s (INT-024 acceptance bound)"
    description: >-
      Seconds from the failing vendor call's start to the fallback decision
      reaching the caller. Emitted by
      intake_platform.chaos.DegradationRouter; the vendor_kill experiment
      asserts the 2 s bound over this measurement.
  - name: chaos_experiment_runs_total
    type: counter
    labels: [experiment, outcome]
    owner: platform
    unit: "count"
    description: >-
      Chaos experiment executions, by experiment id and outcome (pass/fail).
      files/10 §7: chaos results are tracked as metrics. Emitted by
      intake_platform.chaos.run_vendor_kill via `make chaos
      EXPERIMENT=<id>` (INT-024).
  # --- live series (INT-100): per-vendor circuit breakers + speech-lane failover
  # files/10 §5 LLM10 "circuit breakers per vendor"; §9 voice row "vendor
  # errors". Not files/08 §4 ids, so no `id` (the INT-024 precedent). Label
  # values are registry component names, the closed BreakerState set, or
  # `typed` — never a session id or text (inv. 6).
  - name: vendor_breaker_state
    type: gauge
    labels: [component, state]
    owner: voice-runtime
    unit: "bool"
    description: >-
      Circuit breaker state per vendor component, one-hot: 1 on the current
      state (closed / open / half_open), 0 on the other two. Emitted by
      intake_voice_runtime.resilience.breaker.CircuitBreaker from the moment a
      lane is bound, so every speech lane's state is visible before it fails.
  - name: vendor_breaker_transitions_total
    type: counter
    labels: [component, from_state, to_state]
    owner: voice-runtime
    unit: "count"
    description: >-
      Circuit breaker state transitions by vendor component: closed -> open
      after consecutive failures, open -> half_open after the cooldown,
      half_open -> closed or open on the trial's outcome. Emitted by
      intake_voice_runtime.resilience.breaker.CircuitBreaker (INT-100).
  - name: vendor_failovers_total
    type: counter
    labels: [from_component, to_component]
    owner: voice-runtime
    unit: "count"
    description: >-
      Speech-lane failovers: a session left from_component for the next lane
      in the registry's fallback order, or for `typed` (the text lane) when no
      lane was left. Emitted by
      intake_voice_runtime.resilience.failover.FailoverSynthesizer (INT-100).
  # --- live series (INT-182): the Voice module — session routing, the kill
  # switch, speech-call errors. files/08 §3 "Voice runtime" asks for
  # per-profile metrics and a kill switch that works without a deploy; these
  # make both observable. Not files/08 §4 ids, so no `id` (the INT-100
  # precedent). Labels are tenant ids, closed enumerations and registry
  # component names — never a session id or text (inv. 6).
  - name: voice_session_routes_total
    type: counter
    labels: [tenant, profile, reason]
    owner: voice-runtime
    unit: "count"
    description: >-
      Session starts by tenant, the profile the runtime routed them to
      (residency_tr / typed) and why: default, canary, kill_switch, or
      control_unreadable (the control store could not answer, so the session
      started typed). Emitted by
      intake_voice_runtime.session_router.VoiceSessionRouter at every start.
  - name: voice_kill_switch_flips_total
    type: counter
    labels: [tenant, outcome]
    owner: voice-runtime
    unit: "count"
    description: >-
      Live voice sessions the kill switch's poll moved to typed (switched), or
      left in voice because they have no screen to fall back to (not_armed,
      counted once per session). Emitted by
      intake_voice_runtime.session_router.VoiceSessionRouter.poll.
  - name: voice_control_read_failures_total
    type: counter
    labels: [phase, code]
    owner: voice-runtime
    unit: "count"
    description: >-
      Per-tenant voice control reads that failed, by phase (start: the session
      went typed; poll: live sessions kept their last-known state) and machine
      code (voice_control_unreachable / voice_control_malformed). Emitted by
      intake_voice_runtime.session_router.VoiceSessionRouter.
  - name: voice_speech_calls_total
    type: counter
    labels: [component, kind, outcome]
    owner: voice-runtime
    unit: "count"
    description: >-
      ASR and TTS calls that reached a wire, by registry component, kind
      (asr / tts) and outcome (ok / failed) — the Voice module's error rate
      is failed over ok + failed. TTS is counted by the INT-100 failover
      ladder per lane dialled (a lane skipped behind an open breaker dialled
      nothing); ASR by intake_voice_runtime.adapters.asr.HttpTranscriber.
  # --- live series (INT-205): the SIEM scrub boundary (files/10 §7) ----------
  # Wazuh's and Falco's own liveness are probes, not error budgets (the
  # `wazuh-manager`, `wazuh-indexer` and `falco` rows of
  # observability/registry.yaml). What we own — and what a patient's privacy
  # rests on — is the boundary that turns a vendor alert into a SecurityAlert,
  # so that is what is instrumented. docs/slo/siem.yaml reads the first two.
  - name: siem_alerts_ingested_total
    type: counter
    labels: [source, signal, severity]
    owner: platform
    unit: "count"
    description: >-
      Detector alerts admitted to the console feed after scrubbing, by source
      (falco/wazuh), console signal (auth_anomaly/k8s_audit/container_runtime/
      unclassified) and runbook severity (SEV1-SEV4). Emitted by
      intake_platform.siem.normalise (INT-205). Every label is a closed
      enumeration; none carries a rule name, a host name or a path.
  - name: siem_alerts_refused_total
    type: counter
    labels: [source, reason]
    owner: platform
    unit: "count"
    description: >-
      Detector alerts refused at the scrub boundary, by source and a closed
      reason vocabulary (unknown_priority/unknown_level/no_rule/no_timestamp).
      Emitted by intake_platform.siem.normalise (INT-205). A rising rate means
      a detector is emitting a shape we cannot reduce safely, which is a
      detection gap rather than a nuisance.
  - name: siem_alert_fields_dropped_total
    type: counter
    labels: [source, field]
    owner: platform
    unit: "count"
    description: >-
      Fields dropped from a detector alert because they were not identifiers,
      by source and the vendor field name (hostname, container.id, fd.name,
      agent.id, agent.name, syscheck.path, time, timestamp, id). Emitted by
      intake_platform.siem.normalise (INT-205) — the visible edge of
      invariant 6 on the detection path: a spike means something started
      putting narrative where an id belongs.
  # --- files/08 §4 A. Availability & SLOs — planned until the SLO attainment pipeline lands
  - name: slo_api_availability
    id: slo.api_availability
    type: gauge
    labels: []
    owner: platform
    unit: "ratio"
    target: "99.9 %"
    status: planned
    description: API availability SLO attainment.
  - name: slo_voice_session_success
    id: slo.voice_session_success
    type: gauge
    labels: []
    owner: platform
    unit: "ratio"
    target: "99.5 %"
    status: planned
    description: Share of voice session starts that reach the first question.
  - name: slo_note_ready_within_60s
    id: slo.note_ready_within_60s
    type: gauge
    labels: []
    owner: platform
    unit: "ratio"
    target: "99 %"
    status: planned
    description: Share of notes ready within 60 seconds of wrap-up.
  - name: slo_doctor_link_open_p95
    id: slo.doctor_link_open_p95
    type: gauge
    labels: []
    owner: platform
    unit: "s"
    target: "< 2 s"
    status: planned
    description: p95 time for the doctor link to open.
  # --- files/08 §4 B. Voice runtime — per turn; 08 §4 fixes labels profile/tenant/branch/vendor
  - name: voice_eou_delay_ms
    id: voice.eou_delay_ms
    type: histogram
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "ms"
    status: planned
    description: End-of-utterance detection delay per turn (LiveKit EOUMetrics).
  - name: voice_transcription_delay_ms
    id: voice.transcription_delay_ms
    type: histogram
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "ms"
    status: planned
    description: Transcription delay per turn (LiveKit EOUMetrics).
  - name: voice_talker_ttft_ms
    id: voice.talker_ttft_ms
    type: histogram
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "ms"
    status: planned
    description: Talker LLM time to first token (LLMMetrics).
  - name: voice_talker_tokens
    id: voice.talker_tokens
    type: histogram
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "tokens"
    status: planned
    description: Talker LLM tokens per turn (LLMMetrics).
  - name: voice_prompt_cached_tokens
    id: voice.prompt_cached_tokens
    type: histogram
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "tokens"
    status: planned
    description: Prompt tokens served from cache per turn (LLMMetrics).
  - name: voice_tts_ttfb_ms
    id: voice.tts_ttfb_ms
    type: histogram
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "ms"
    status: planned
    description: TTS time to first byte per turn (TTSMetrics).
  - name: voice_tts_chars
    id: voice.tts_chars
    type: histogram
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "chars"
    description: >-
      Characters synthesised per turn (TTSMetrics). Emitted by
      intake_voice_runtime.metering's metered synthesizer (INT-101), which
      charges the string actually sent to the model — a clip-cache hit
      synthesises nothing, so this series and voice.clip_cache_hit_ratio move
      in opposite directions (CLAUDE.md invariant 10).
  - name: voice_stt_audio_s
    id: voice.stt_audio_s
    type: histogram
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "s"
    status: planned
    description: Audio seconds sent to STT per turn (STTMetrics).
  - name: voice_stt_duration_ms
    id: voice.stt_duration_ms
    type: histogram
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "ms"
    status: planned
    description: STT processing duration per turn (STTMetrics).
  - name: voice_round_trip_ms
    id: voice.round_trip_ms
    type: histogram
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "ms"
    target: "p50/p95 per files/02 §8"
    status: planned
    description: VAD end to first audio on the device, per turn.
  - name: voice_barge_in_stop_ms
    id: voice.barge_in_stop_ms
    type: histogram
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "ms"
    target: "<= 150 ms"
    status: live
    description: >-
      Time to stop agent playback after the patient started speaking. Emitted by
      intake_voice_runtime.talker.barge_in on every onset the path accepts
      (INT-291). Separate from preempt.red_latency_ms on purpose: one series per
      cause, so the 150 ms target stays readable (docs/evidence/INT-093.md).
  - name: voice_interruption_rate
    id: voice.interruption_rate
    type: gauge
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "ratio"
    target: "< 15 %"
    status: planned
    description: Share of turns the patient interrupts.
  - name: voice_silence_ratio
    id: voice.silence_ratio
    type: gauge
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "ratio"
    status: planned
    description: Silence share of session audio time.
  - name: voice_clip_cache_hit_ratio
    id: voice.clip_cache_hit_ratio
    type: gauge
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "ratio"
    target: ">= 0.6 in fast mode"
    status: planned
    description: Scripted-clip cache hit ratio.
  - name: voice_backchannel_count
    id: voice.backchannel_count
    type: counter
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "count"
    status: planned
    description: Backchannels produced.
  - name: voice_asr_confidence_mean
    id: voice.asr_confidence_mean
    type: gauge
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "ratio"
    status: planned
    description: Mean ASR confidence over sampled turns.
  - name: voice_asr_wer_proxy
    id: voice.asr_wer_proxy
    type: gauge
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "ratio"
    status: planned
    description: >-
      Disagreement between primary and shadow STT on sampled turns (word-
      error proxy, an internal measurement).
  - name: voice_profile_switches
    id: voice.profile_switches
    type: counter
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "count"
    status: planned
    description: Voice profile switches during sessions.
  - name: voice_typed_fallbacks
    id: voice.typed_fallbacks
    type: counter
    labels: [tenant, profile, branch, vendor]
    owner: voice-runtime
    unit: "count"
    status: planned
    description: Falls back to the typed profile.
  # --- files/08 §4 C. Two-layer runtime
  - name: work_queue_depth
    id: work.queue_depth
    type: gauge
    labels: [type]
    owner: voice-runtime
    unit: "count"
    status: live
    description: >-
      Backend Work queue depth by work type. Emitted by
      intake_voice_runtime.clinical_agent.work_queue (INT-092); the label
      domain is the closed WorkType enumeration.
  - name: work_latency_ms
    id: work.latency_ms
    type: histogram
    labels: [type]
    owner: voice-runtime
    unit: "ms"
    target: "extract_slots p50 < 3 s"
    status: live
    description: >-
      Backend Work latency by work type. Emitted by
      intake_voice_runtime.clinical_agent.work_queue (INT-092), measured from
      the moment the Work was claimed to the moment its receipt was written.
  - name: work_failed_total
    id: work.failed_total
    type: counter
    labels: [type]
    owner: voice-runtime
    unit: "count"
    status: live
    description: >-
      Failed Backend Work items by work type. Emitted by
      intake_voice_runtime.clinical_agent.work_queue (INT-092); a handler
      fault, a refused preempt provenance and an invariant-22 numeric pair all
      land here as receipts rather than as a crashed pump.
  # files/10 §9 observer-lane row: `lane.dropped_frames` is one of the signals
  # that row says lands with INT-110. files/03 §4.7.6 makes it a metric AND a
  # recorded field on every lane signal, so the same number appears here and on
  # LaneObservation.dropped_frames_in_window. A low value is not a target: a
  # lane that never drops a frame under load would be one that made speech wait.
  - name: lane_dropped_frames
    id: lane.dropped_frames
    type: counter
    labels: [lane]
    owner: voice-runtime
    unit: "count"
    status: live
    description: >-
      Audio frames dropped by an observer lane under backpressure, by lane.
      Emitted by intake_voice_runtime.observers.runtime (INT-110) when a lane's
      bounded ring evicts an older frame rather than making the audio path
      wait. The single label is the closed Lane enumeration; a lane that was
      never admitted has no child series at all, which is how a refused lane is
      told apart from an idle one.
  - name: work_restart_failures
    id: work.restart_failures
    type: counter
    labels: [type]
    owner: voice-runtime
    unit: "count"
    status: planned
    description: Backend Work restart failures by work type.
  - name: delivery_insertion_wait_ms
    id: delivery.insertion_wait_ms
    type: histogram
    labels: []
    owner: voice-runtime
    unit: "ms"
    target: "p50 <= 2 s"
    status: live
    description: >-
      Wait until a safe insertion window delivered Backend speech. Emitted by
      intake_voice_runtime.talker.insertion (INT-091).
  - name: delivery_retries
    id: delivery.retries
    type: counter
    labels: []
    owner: voice-runtime
    unit: "count"
    status: planned
    description: Backend speech delivery retries.
