  # --- INT-141 notifications (files/10 §9 row "Notifications / reminders":
  # "delivery/opt-out rates"). files/08 §4 names no metric id for this row, so
  # these carry no `id` — they are the §9 signals, catalogued here rather than
  # dropped. Every label is a closed enumeration; nothing free-text (inv. 6).
  - name: notification_dispatch_total
    type: counter
    labels: [channel, message_class, status]
    owner: platform
    unit: "count"
    description: >-
      Notification dispatch attempts by channel, message class and outcome
      (delivered, suppressed_opt_out, deferred_quiet_hours,
      refused_quiet_hours_unset, blocked_transport_unconfigured). The delivery
      rate and the opt-out rate are both read off the status label.
  - name: notification_preference_changed_total
    type: counter
    labels: [change]
    owner: platform
    unit: "count"
    description: >-
      Patient notification-preference changes by what changed (opt_out,
      opt_in, quiet_window_set, quiet_window_cleared).
  # --- INT-242 survey cadence. files/08 §4 group F names the two satisfaction
  # series (nps.monthly, clinician.pulse) but no id for the scheduling of
  # them, so this entry carries no `id` — the same posture as the INT-141 rows
  # above. Every label is a closed enumeration. The status label is the honest
  # record of why nothing is sent today: blocked_iys_consent_absent is the
  # 6563 gate, refused_schedule_unset the missing first-prompt value.
  - name: survey_invitation_total
    type: counter
    labels: [kind, channel, message_class, status]
    owner: experience
    unit: "count"
    description: >-
      Survey invitation decisions by kind (nps, clinician_pulse), channel
      (in_product, electronic_message), 6563 message class and outcome
      (issued, not_yet_due, suppressed_opt_out, blocked_iys_consent_absent,
      blocked_prompts_disabled, refused_schedule_unset, deferred_quiet_hours,
      refused_quiet_hours_unset).
  # --- INT-171: the k-anonymity gate on the de-identified analytics views.
  # files/10 §9 learning row names "k-anonymity refusals" as a console signal
  # and files/08 §4 group L repeats it as a prose KPI with no id; these are
  # the ids. Both label sets are deliberately minimal: a refusal labelled with
  # the branch or the week it withheld would publish that cell to Prometheus,
  # which retains it (inv. 6).
  - name: analytics_view_refused_total
    type: counter
    labels: [view, reason]
    owner: learning
    unit: "count"
    description: >-
      De-identified analytics views that refused to materialise, by view name
      and reason class (below_k, dimension_not_id_shaped,
      dimension_set_mismatch, measure_not_a_count). Emitted by
      intake_platform.analytics.k_anonymity; a below_k refusal covers both a
      cohort under the floor and an empty result, which the gate declines to
      tell apart.
  - name: analytics_view_materialised_total
    type: counter
    labels: [view]
    owner: learning
    unit: "count"
    description: >-
      De-identified analytics views that cleared their k-anonymity threshold
      and were served, by view name. Read against
      analytics_view_refused_total it is the refusal rate the learning loop is
      operating at.

  # --- INT-172: the Inspector -> Architect pipeline itself. files/10 §9's
  # learning row names "proposals, rejections, k-anonymity refusals,
  # rollbacks" as the console signals; the first two are here, the third is
  # analytics_view_refused_total above, and rollbacks arrive with INT-173's
  # canary controller. Label sets stay minimal for INT-171's reason: a
  # proposal labelled with the pack or the clinic it concerns would publish
  # that cohort to Prometheus, which retains it (inv. 6). `target` is a class
  # name from intake_learning.proposals.PROPOSAL_TARGETS — a closed set of
  # ten, not a pack id.
  - name: learning_findings_total
    type: counter
    labels: [signal]
    owner: learning
    unit: "count"
    description: >-
      Case-level findings written by a Loop 2 Inspector, by files/09 §4 signal
      (step_skip_rate, session_abandonment). Emitted by
      intake_learning.inspector; a finding is derived from a k-gated
      Measurement and never from a session row.
  - name: learning_proposals_total
    type: counter
    labels: [signal, target]
    owner: learning
    unit: "count"
    description: >-
      Loop 2 proposals the Architect emitted, by signal and proposal-target
      type. A proposal is data: this counts what was written down for a
      clinician to review, never what changed (CLAUDE.md invariant 12).
  - name: learning_proposals_refused_total
    type: counter
    labels: [signal, reason]
    owner: learning
    unit: "count"
    description: >-
      Findings the Architect declined to promote, by signal and reason class
      (not_recurring, below_effect_floor, below_subject_floor,
      below_tenant_floor, no_stated_target_mapping). This is files/10 §9's
      "rejections" signal; the reason is a class and never a cohort.
  - name: learning_evidence_bundles_total
    type: counter
    labels: [view, status]
    owner: learning
    unit: "count"
    description: >-
      Evidence bundles built for a Loop 2 proposal, by analytics view and
      completeness (complete/incomplete). files/08 §4 group L asks for
      evidence-bundle completeness; this is it. A bundle is incomplete while
      any artefact in intake_learning.evidence.REQUIRED_CHECKS is unavailable,
      and an incomplete bundle cannot open a pull request.
