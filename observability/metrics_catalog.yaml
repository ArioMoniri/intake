  # --- INT-173: the canary/rollback controller. files/10 §9's learning row
  # names "rollbacks" as a console signal and files/09 §4 sets the guardrails a
  # staged rollout reverts on (acceptance -5 pts, safety blocks +50 %,
  # completion -5 pts, CSAT -0.3). The controller (intake_learning.canary) is
  # pure rule and applies nothing; this counter is the only trace it leaves.
  # Labels stay minimal for INT-171's reason: `guardrail` is the closed
  # intake_learning.canary.Guardrail set and `stage` is one of 5/25/100 — never
  # a pack, a clinic or a cohort (inv. 6).
  - name: learning_rollbacks_total
    type: counter
    labels: [guardrail, stage]
    owner: learning
    unit: "count"
    description: >-
      Canary rollouts the INT-173 controller reverted, by the guardrail that
      moved (acceptance, safety_blocks, completion, csat, or missing_input when
      a KPI could not be read and the rollout failed closed) and the canary
      stage it moved at (5, 25, 100). files/10 §9's learning-row "rollbacks"
      signal; read against learning_proposals_total it is how often an approved
      proposal did not survive its own canary.
  # --- INT-170: Loop 1, the per-patient learning store. files/08 §4 names no
  # id for it (group L is prose), so the names are ours — the INT-171/INT-172
  # precedent. Label sets are minimal for the reason those two record: a label
  # carrying a fact key or a patient would publish that cohort to Prometheus,
  # which retains it (inv. 6). `source` is one of the three closed
  # LearnedFactSource members and `action` one of two verbs.
  - name: overlay_facts_confirmed_total
    type: counter
    labels: [source]
    owner: learning
    unit: "count"
    description: >-
      PatientOverlay facts committed after a patient or clinician confirmation,
      by confirmed provenance class (confirmed_intake_extraction,
      clinician_accepted_note, confirmed_imported_record). Emitted by
      intake_platform.overlay.store; an unconfirmed value has no provenance to
      label with and no row to be counted in (CLAUDE.md invariant 12).
  - name: overlay_facts_withdrawn_total
    type: counter
    labels: [action]
    owner: learning
    unit: "count"
    description: >-
      PatientOverlay facts a patient took back, by action (deleted, unshared).
      files/09 §3 gives the patient both verbs over anything the system learned
      about them; read against overlay_facts_confirmed_total it is how often
      the learning loop got it wrong enough to be corrected.
  # --- INT-230: the research export gate. Same posture as the INT-171 pair
  # above and for the same reason — a refusal labelled with the study cohort,
  # the window or a dimension value would publish to Prometheus exactly what
  # the refusal withheld, and Prometheus retains it (inv. 6). `spec` is the
  # extract spec's declared name, never a study id or a recipient; `reason` is
  # a closed class. Neither series counts subjects: a count of extracts is a
  # count of extracts. files/08 §4 names no id for either, so the names are
  # ours (the INT-171 precedent).
  - name: research_extract_refused_total
    type: counter
    labels: [spec, reason]
    owner: learning
    unit: "count"
    description: >-
      Research export requests refused, by extract spec name and reason class
      (unknown_study, approval_not_in_force, approval_lapsed,
      recipient_not_approved, retention_unset, value_not_id_shaped,
      value_carries_identifier, value_outside_vocabulary,
      dimension_set_mismatch, measure_not_a_count, order_statistic_measure,
      spec_field_not_id_shaped, below_k). Emitted by
      intake_platform.research.extract. Today every request refuses:
      study_registry.yaml is empty (HB-L1, HB-R1) and the research_extracts
      retention class is draft_needs_source (HB-I8).
  - name: research_extract_served_total
    type: counter
    labels: [spec]
    owner: learning
    unit: "count"
    description: >-
      Pseudonymised research extracts served, by extract spec name. A count of
      extracts, never of subjects — and pseudonymised rather than anonymised,
      because the subject key is a keyed derivation and remains personal data
      under KVKK (KSVY m.16(1)'s anonymisation route is not the one this
      pipeline takes).
  # --- connectors (INT-160; files/10 §9 `connectors` row) -----------------------
  - name: connector_push_total
    type: counter
    labels: [endpoint, outcome]
    owner: platform
    unit: "count"
    description: >-
      Connector pushes to a registered destination, by endpoint id and settled
      receipt state (delivered, rejected, failed, unresolved, refused,
      suppressed). Emitted by intake_connectors.sender. `refused` is a consent
      scope that did not stand and `suppressed` a replay the local ledger
      declined to repeat, so the share-refusal rate and the duplicate-send rate
      are both read off the outcome label. Both labels are closed sets — a
      registry id and a receipt state — so nothing a receiver or a patient
      supplies can widen the cardinality.
  - name: connector_push_duration_seconds
    type: histogram
    labels: [endpoint]
    owner: platform
    unit: "s"
    description: >-
      Wall time from the write-ahead receipt to its settlement, per registered
      endpoint. Covers the whole guarded path — consent, credentials, egress
      authorisation, the exchange — because a push that stalls before the wire
      is as much an endpoint error as one that stalls on it.
  - name: connector_receipts_unresolved_total
    type: counter
    labels: [endpoint]
    owner: platform
    unit: "count"
    description: >-
      Pushes settled as unresolved: a timeout, a dropped connection or a 5xx,
      where the bytes may or may not have reached the receiver. This is the
      cost of the write-ahead receipt made countable, and it is the series that
      decides whether a retry is safe — an endpoint whose DPA does not declare
      that it honours an Idempotency-Key parks these for a human instead.
  - name: connector_token_exchange_total
    type: counter
    labels: [endpoint, outcome]
    owner: platform
    unit: "count"
    description: >-
      SMART backend services token exchanges (INT-161), by endpoint id and
      bucketed outcome: granted, denied, unavailable, malformed,
      scope_not_granted, key_unusable, consent_expired. A failed exchange is a
      different fault from a failed push and has a different fix — a key, a
      client registration or an authorization-server outage rather than a
      bundle or a network — so files/10 §9's "endpoint errors" signal has to
      tell them apart. The outcome label is a closed set of OUR codes, never
      the receiver's status code: a label a receiver can choose is cardinality
      a receiver can choose. The precise code still lands in the receipt's
      outcome_code, which nothing indexes. A failed exchange never produces an
      unresolved receipt, because no clinical byte was ever in flight.
  - name: connector_inbound_messages_total
    type: counter
    labels: [source, outcome]
    owner: platform
    unit: "count"
    description: >-
      Inbound hospital-feed messages ingested for a registered source (INT-162),
      by settled outcome. Emitted by intake_connectors.metrics; the series only
      moves once a feed is contracted, exactly as the push series does. Both
      labels are closed sets — a registry source id and OUR outcome code — so
      nothing a sender or a patient supplies can widen the cardinality (invariant 6).
  # --- INT-351: the admin ops console's collector-fed series -------------------
  # files/08 §4 group I names "GPU utilisation and memory" as a prose KPI with
  # no id, so the GPU rows are catalogued under names of ours (the same move
  # INT-171/INT-172 made for group L). All seven are emitted by
  # intake_probes.ops_collector, a background loop in the probes service that
  # runs only when its environment configures a source; unconfigured, the
  # families are served empty and the console reads "unknown" (invariant 17).
  # A failed read CLEARS a family's children rather than writing a zero.
  - name: ops_gpu_host_up
    type: gauge
    labels: [host_id]
    owner: platform
    unit: "bool (0/1)"
    description: >-
      1 when the ops collector's nvidia-smi query on the GPU host it runs beside
      succeeded, 0 when it failed. host_id is the operator's id for the host,
      refused unless id-shaped — never an address (invariant 6).
  - name: ops_gpu_utilization_ratio
    type: gauge
    labels: [host_id, gpu_index]
    owner: platform
    unit: "ratio"
    description: >-
      GPU utilisation (0-1) per host and GPU index, from nvidia-smi. Cleared,
      not zeroed, when the host query fails.
  - name: ops_gpu_memory_used_bytes
    type: gauge
    labels: [host_id, gpu_index]
    owner: platform
    unit: "bytes"
    description: >-
      GPU memory in use per host and GPU index, from nvidia-smi. Cleared, not
      zeroed, when the host query fails.
  - name: ops_gpu_memory_total_bytes
    type: gauge
    labels: [host_id, gpu_index]
    owner: platform
    unit: "bytes"
    description: >-
      GPU memory visible to the host per GPU index — on a MIG slice or a shared
      pod, the memory quota the models on it share. From nvidia-smi.
  - name: ops_ci_last_run
    type: gauge
    labels: [workflow, branch, status, conclusion, head_sha]
    owner: platform
    unit: "bool (0/1)"
    description: >-
      1 for the newest GitHub Actions run of each workflow on the watched
      branch, its state carried in the labels: the workflow file stem, the
      branch, GitHub's closed status and conclusion vocabularies and the head
      commit sha. Read server-side with a read-only token from OpenBao through
      the egress guard; the actor and the commit message never become labels.
  - name: ops_ci_last_run_updated_seconds
    type: gauge
    labels: [workflow, branch]
    owner: platform
    unit: "s (unix time)"
    description: Unix time the newest CI run of each workflow was last updated.
  - name: ops_collector_source_up
    type: gauge
    labels: [source]
    owner: platform
    unit: "bool (0/1)"
    description: >-
      1 when the ops collector's last read of a source (gpu_host, ci) succeeded,
      0 when it failed — what lets the console tell "failing" from "not
      configured".
  # The offline scripted-clip build (ADR-028; make clips) counts its cache
  # hits and its syntheses on its own registry (voice_clips.metrics) and
  # writes them as a Prometheus textfile; the ops collector re-exports exactly
  # these four families from it. Every label is a closed set or a compiler id —
  # the script text never becomes one (invariant 6).
  - name: voice_clip_cache_lookups_total
    type: counter
    labels: [outcome]
    owner: voice-runtime
    unit: "count"
    description: >-
      Scripted-clip cache lookups during a clip build: hit (the stored clip is
      reused, no gateway called) or miss (synthesised). A forced rebuild asks
      the cache nothing and counts no lookup.
  - name: voice_clip_syntheses_total
    type: counter
    labels: [gateway, outcome]
    owner: voice-runtime
    unit: "count"
    description: >-
      Scripted-clip syntheses during a clip build, by gateway kind
      (self_hosted / recorded / elevenlabs / other) and outcome (ok / failed).
  - name: voice_clip_manifest_rows
    type: gauge
    labels: [pack, locale, voice]
    owner: voice-runtime
    unit: "count"
    description: >-
      Scripted-clip rows a compiled pack's clip manifest declares, per pack,
      locale and voice (all compiler ids), set by the clip build's coverage walk.
  - name: voice_clip_manifest_present
    type: gauge
    labels: [pack, locale, voice]
    owner: voice-runtime
    unit: "count"
    description: >-
      Manifest rows whose clip is in the cache, per pack, locale and voice. Below
      voice_clip_manifest_rows, a scripted turn would fall to dynamic TTS — the
