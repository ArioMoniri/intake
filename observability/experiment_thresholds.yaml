# observability/experiment_thresholds.yaml — the pass bar for the recorded
# simulator experiment (INT-175; files/08 §9 "eval gates"; CLAUDE.md inv. 1/20).
#
# `make langfuse-experiment` scores tests/fixtures/experiments/
# extraction_recorded_run.jsonl against these numbers and exits non-zero on
# any breach. Nothing here is an accuracy claim: these are gate thresholds
# over a named recorded corpus, and the measured values live in
# docs/evidence/INT-175.md with a date (invariant 20).
#
# Not listed here, because it is not a threshold: **invariant 1**. A recorded
# case in which the extractor produced a triage level fails the gate outright,
# whatever these numbers say. RED/YELLOW come from packages/protocols/triage
# alone and the LLM may reach `candidate_flag` at most.
#
# Thresholds only go up (the same rule as coverage floors, invariant 8).

# Fraction of cases whose output validated against its slot schema.
min_schema_valid_ratio: 0.90

# Required slots filled, summed over the corpus and divided by required slots
# asked. A missed slot is a question the clinician has to ask again.
min_slot_fill_ratio: 0.85

# PolicyGuard must pass on every case. 1.0 rather than 0.98 on purpose:
# invariant 2 is not a percentage, and a single diagnosis-shaped sentence in
# an eval is a defect to fix rather than a rate to tolerate.
min_policyguard_pass_ratio: 1.0

# Nearest-rank p95 of extraction latency. The Work-latency budget in
# files/08 §4 is 3 s; 5 s is the eval-harness bar, which runs unbatched on
# whatever host CI has.
max_latency_p95_ms: 5000
