  # Not booted here and the rows say so: HB-I1 (disk) and HB-I2 (container
  # memory) are both open, and files/05 sizes Wazuh alone at "12 GB + a
  # part-time SRE". The tier is scripted at full size rather than shrunk until
  # it fitted, so these stay `self_hosted_now: false` until a host runs them.

  - component: wazuh-manager
    self_hostable: true
    self_hosted_now: false
    host: "infra/docker-compose.siem.yml, profile `siem` — wazuh/wazuh-manager:4.14.7; API on loopback 127.0.0.1:55000, agent ports unpublished. Reads Falco events, the k8s audit log and our own security log; writes /var/ossec/logs/alerts, which intake_platform.siem.feed scrubs. Not booted here: HB-I1/HB-I2"
    license: "GPL-2.0-only + OpenSSL linking exception + an extended derivative-work clause (LICENSE blob verified @v4.14.7 — see licence_note; a one-word 'GPL-2.0' would be the laundered claim)"
    # No HTTP probe: the manager API answers 401 without a token, so a health
    # check would be indistinguishable from a broken one. tcp_connect is what
    # can be asserted without holding a credential.
    probe: tcp_connect
    budget_ms: 2000
    fallback: "none"
    # It reads every log on the PHI path by design. What it EMITS carries no
    # patient text — that is the scrub boundary in intake_platform.siem.normalise,
    # and tests/infra/test_siem_feed.py plants a Turkish symptom sentence in a
    # log line, a filename, a rule description and a container name to prove it
    # — but the component itself sits squarely on the PHI path.
    phi_path: true
    licence_verified_at: 2026-08-29
    licence_blob_url: "https://raw.githubusercontent.com/wazuh/wazuh/a42268a27c555d9348d5598fb8751eaf4c8e9024/LICENSE"
    licence_blob_sha256: "9136fd9ef577a45b1bcea8c8cd761e8c9c21e15cc2a09e7c139755e581bde00e"
    licence_note: >-
      Wazuh's licensing is four findings, not one word, and the blob was read at
      commit a42268a27c555d9348d5598fb8751eaf4c8e9024 (tag v4.14.7), 2026-08-29
      — 475 lines, sha256
      9136fd9ef577a45b1bcea8c8cd761e8c9c21e15cc2a09e7c139755e581bde00e.
      (a) GPL-2.0-**only**, not "or later": "under the terms of the GNU General
      Public License (version 2) as published by the FSF". A repo tagged
      "GPL-2.0" in a badge hides the -only.
      (b) An OpenSSL linking exception, stated twice — once in the preamble and
      once as the standard per-file exception paragraph — because GPLv2 and the
      old OpenSSL licence are otherwise incompatible.
      (c) An **extended derivative-work interpretation** listing four triggers
      including "Links to a library or executes a program that does any of the
      above" and "Includes/integrates Wazuh into a proprietary executable
      installer", with "This list is not exclusive". It is broader than stock
      GPLv2 and the file compares itself to Torvalds' kernel-module reading.
      Critically it also scopes itself: "These restrictions only apply if you
      actually redistribute Wazuh (or parts of it)." We self-host and
      redistribute nothing, so nothing is triggered — recorded here rather than
      assumed, because "ship it as an appliance to a hospital" is a decision
      someone could take without re-reading a licence.
      (d) "Note that this license applies to the source code, as well as
      **decoders, rules and any other data file** included with Wazuh". A
      ruleset derived from Wazuh's shipped decoders or rules is therefore a
      GPLv2 work. infra/security/wazuh/rules/intake_rules.xml is written from
      scratch against our own json fields and copies no vendor rule text, and
      every id sits in the documented 100000-119999 user range.
      Heritage worth knowing: "Based on work Copyright (C) 2003 - 2013 Trend
      Micro, Inc." — Wazuh is an OSSEC fork, so an OSSEC-era licence question
      is a Wazuh licence question. Re-verify the blob on every version bump.

