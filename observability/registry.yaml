# INT-022 — the self-hosting registry (CLAUDE.md invariants 13, 15, 19).
#
# Schema per acceptance, exactly these nine keys per row:
#   {component, self_hostable, self_hosted_now, host, license, probe,
#    budget_ms, fallback, phi_path}
# Validated by services/probes (intake_probes.registry): phi_path implies
# self_hostable (invariant 19), probe ids must exist in code, fallback is
# `none` | `component:<name>` (must resolve here) | `in-process:<module>`.
#
# "Enabled" for the release gate means self_hosted_now: true — a planned row
# binds the moment it runs, never before. scripts/release/release_gate.py
# blocks the release for every enabled phi_path row whose fallback is missing
# or unhealthy; today that is the true state of the stack and the gate says so.
#
# Licences here are findings, never claims: UNVERIFIED stays UNVERIFIED until
# a raw LICENSE blob has been read (files/03 §4.9.0 rule 3).
#
# EHRbase joined with INT-032, and not before: openEHR was cut from P0/P1 and
# kept as a P3 export tier (files/00_STATE.md §3 D8). Its row carries
# self_hosted_now: false because the container sits behind the compose
# `export` profile — the tier is built, licence-verified and probed, and is
# not running in any deployment.

components:
  - component: postgres
    self_hostable: true
    self_hosted_now: true
    host: "dev compose 127.0.0.1:5432 — pgvector/pgvector:pg16"
    license: "PostgreSQL Licence (PostgreSQL and pgvector both)"
    probe: postgres_select1
    budget_ms: 500
    fallback: "component:backups"
    phi_path: true

  - component: redis
    self_hostable: true
    self_hosted_now: true
    host: "dev compose 127.0.0.1:6379 — redis:7.4-alpine"
    license: "RSALv2 / SSPLv1 dual (source-available, not OSI; internal self-hosting permitted — re-verify before ever offering it as a service)"
    probe: redis_ping
    budget_ms: 200
    fallback: "none"
    # phi_path false TODAY: it holds rate-limit counters and idempotency keys
    # over tokenized principals only (INT-176/INT-177). The moment session or
    # clinical state lands in Redis this flips to true and the gate binds.
    phi_path: false

  - component: minio
    self_hostable: true
    self_hosted_now: true
    host: "dev compose 127.0.0.1:9000 — minio/minio:RELEASE.2024-01-16T16-07-38Z"
    license: "AGPL-3.0-only"
    probe: minio_ready
    budget_ms: 1000
    fallback: "component:backups"
    phi_path: true

  - component: hapi
    self_hostable: true
    self_hosted_now: true
    host: "dev compose 127.0.0.1:8091 — hapiproject/hapi:v7.2.0 (FHIR R4)"
    license: "Apache-2.0"
    probe: http_health
    budget_ms: 3000
    fallback: "component:backups"
    phi_path: true

  - component: ehrbase
    self_hostable: true
    # false on purpose: the container is behind the compose `export` profile
    # and no deployment runs it. INT-032 built the tier; nothing serves from
    # it yet, and the release gate must not treat it as enabled.
    self_hosted_now: false
    host: "dev compose 127.0.0.1:8092 — ehrbase/ehrbase:2.35.1 (openEHR CDR, profile `export`)"
    license: "Apache-2.0"
    probe: http_health
    # /rest/status is a JDBC round trip on a cold pool; HAPI's 3 s is the
    # nearest precedent and EHRbase is the heavier of the two.
    budget_ms: 5000
    fallback: "component:hapi"
    phi_path: true
    licence_verified_at: "2026-08-29"
    licence_blob_url: "https://raw.githubusercontent.com/ehrbase/ehrbase/v2.35.1/LICENSE"
    licence_blob_sha256: "58d1e17ffe5109a7ae296caafcadfdbe6a7d176f0bc4ab01e12a689b0499d8bd"
    licence_note: >-
      Read from the raw LICENSE blob at the v2.35.1 tag, not from a badge or a
      repository language tag (invariant 19): 11 357 bytes, the verbatim Apache
      License 2.0 text with the unfilled "Copyright [yyyy] [name of copyright
      owner]" appendix. Commercially usable, self-hostable, no field-of-use
      restriction. The same blob is served at master with an identical digest.
      The database image ehrbase/ehrbase-v2-postgres:16.2 is the vendor's
      preconfigured PostgreSQL 16.2 (PostgreSQL Licence); it carries no
      separate LICENSE blob of its own and is covered by the same repository.

  - component: openbao
    self_hostable: true
    self_hosted_now: true
    host: "dev compose 127.0.0.1:8200 — openbao/openbao:2.0.2 (dev mode, auto-unsealed)"
    license: "MPL-2.0"
    probe: openbao_seal_status
    budget_ms: 500
    fallback: "component:backups"
    phi_path: true

  - component: api
    self_hostable: true
    self_hosted_now: false
    host: "code landed (INT-197 dev-tier slice: dev-bearer auth, visits, notes, documents) — not yet wired into compose/systemd; flips true when the deployment issue runs it"
    license: "proprietary (repo LICENSE)"
    probe: http_health
    budget_ms: 800
    fallback: "none"
    phi_path: true

  - component: probes
    self_hostable: true
    self_hosted_now: false
    host: "this package (services/probes) — runner exists; the 60 s scheduler wiring (systemd/compose) lands with the deployment issues"
    license: "proprietary (repo LICENSE)"
    probe: http_health
    budget_ms: 800
    fallback: "none"
    # probes read health endpoints only — no PHI reaches this service
    phi_path: false

  - component: metrics
    self_hostable: true
    self_hosted_now: false
    host: "this package (services/metrics) — INT-240 lands the satisfaction rollups; the hourly scheduler and its Postgres wiring land with the deployment issues"
    license: "proprietary (repo LICENSE)"
    probe: http_health
    budget_ms: 800
    fallback: "none"
    # rollups are counts and scores over the PHI-free events column; the
    # patient's own words live in csat_texts, which this service never reads
    phi_path: false

  - component: voice-runtime
    self_hostable: true
    self_hosted_now: false
    host: "planned — LiveKit Agents worker; the LiveKit server+TURN dev tier lands with INT-090"
    license: "proprietary (repo LICENSE); LiveKit Agents Apache-2.0; livekit/turn-detector is proprietary (LiveKit Model License — knowingly adopted, files/03 §4.9.2(d))"
    probe: livekit_room_join
    budget_ms: 5000
    # the profile-level degraded mode is `typed` (ADR-010) — a mode of this
    # same service, not a separate component, so it cannot stand as `fallback`
    fallback: "none"
    phi_path: true

  - component: edge-tls
    self_hostable: true
    self_hosted_now: false
    host: "no TLS edge in the dev tier (compose binds loopback, plaintext); probe target comes from INTAKE_TLS_PROBE_TARGET once an edge terminator exists"
    license: "not chosen yet — recorded when the edge terminator lands"
    probe: cert_expiry_days
    budget_ms: 2000
    fallback: "none"
    phi_path: true

  - component: backups
    self_hostable: true
    self_hosted_now: false
    host: "INTAKE_BACKUP_DIR (default .cache/backups) — INT-202 wires the pgBackRest job and the restore drill (infra/backup/, scripts/backup/restore_drill.sh, `make backup-drill`); the drill has NOT run on this host, so nothing lands here yet: HB-I1 (disk) and HB-I2 (container memory) block it and HB-I8 owes the retention window. Until a drill runs, every fallback pointing here fails the release gate, by design"
    license: "n/a — our own artefacts"
    probe: backup_freshness
    budget_ms: 200
    fallback: "none"
    phi_path: true

  # --- INT-175: the self-hosted LLM-trace tier -------------------------------

  - component: langfuse
    self_hostable: true
    # the tier exists (infra/docker-compose.langfuse.yml) and is validated
    # statically; it has not been booted on this host — six containers
    # including ClickHouse is exactly what HB-I1 (disk) and HB-I2 (container
    # memory) record as unavailable. Flips true when a host runs it.
    self_hosted_now: false
    host: "infra/docker-compose.langfuse.yml, profile `langfuse` — langfuse/langfuse:4.24.0 + langfuse/langfuse-worker:4.24.0 on their own Postgres/ClickHouse/Redis/MinIO; web on loopback 127.0.0.1:3030, every backing store on the project network only. Not booted here: HB-I1/HB-I2"
    license: "MIT Expat (core, LICENSE blob verified @v4.24.0) — see licence_note for the ee/ carve-out, which is NOT MIT and is not licensed in"
    probe: http_health
    budget_ms: 2000
    fallback: "none"
    # phi_path FALSE, and this is a claim the tests hold rather than a hope.
    # files/08 §6 is right that a stock Langfuse is a transcript store: it
    # exists to keep prompts and completions verbatim, and the extraction
    # prompt IS the patient's transcript. What makes this row false is
    # upstream of Langfuse — intake_platform.observability.spans has no field
    # a transcript can occupy and no configuration that could grow one, and
    # tests/observability/test_langfuse_gate.py plants a Turkish symptom
    # sentence at every seam to prove it. The day a content-carrying mode is
    # built — which needs files/HUMAN_BLOCKERS.md HB-L6 answered first — this
    # flips to true and the release gate binds on it.
    phi_path: false
    licence_verified_at: 2026-08-29
    licence_blob_url: "https://raw.githubusercontent.com/langfuse/langfuse/0037ad19dac83b857201632ba9e37c06a1c7eacd/LICENSE"
    licence_blob_sha256: "fd09d42b5b16606ad2042cc1edf3a82da1c47743709f170c959c74758af229d6"
    licence_note: >-
      Langfuse is open CORE, not open source end to end, and "MIT" alone would
      be the laundered claim files/03 §4.9.0 rule 3 exists to catch. Both
      blobs were read at the pinned release commit
      0037ad19dac83b857201632ba9e37c06a1c7eacd (tag v4.24.0), 2026-08-29:
      (a) LICENSE — 25 lines, MIT Expat, sha256
      fd09d42b5b16606ad2042cc1edf3a82da1c47743709f170c959c74758af229d6. Its own
      preamble carves out "ee/", "web/src/ee/" and "worker/src/ee/".
      (b) ee/LICENSE — 50 lines, "Langfuse Enterprise license", sha256
      760f5202be4f31f9f8ca43a3c558bebaa5187fa7d7eccad6a32de8392cdccee6, which
      says the software "may only be used, if you ... have a valid Langfuse
      Enterprise License". The published Docker image CONTAINS that code.
      What we use is MIT: web/src/ee/features at that commit is admin-api,
      audit-log-viewer, billing, multi-tenant-sso, sfdc-sync, sso-settings,
      ui-customization and verified-domains — and annotation queues are NOT
      among them; they live at web/src/features/annotation-queues, under the
      MIT tree. The entitlement map
      (web/src/features/entitlements/constants/entitlements.ts) gives plan
      `oss` "annotation-queue-count": false, which in that file's own typing
      means unlimited. So the three acceptance queues are usable under MIT.
      No enterprise licence key is set anywhere in this repo, which keeps the
      ee/ paths inert; setting one without a signed agreement would be an
      unlicensed commercial use (invariant 19). Re-verify both blobs on every
      version bump: an open-core vendor moves the line, not the licence text.

  - component: langfuse-clickhouse
    self_hostable: true
    self_hosted_now: false
    host: "infra/docker-compose.langfuse.yml, profile `langfuse` — clickhouse/clickhouse-server:25.12.11.4, project network only, no published port. Langfuse's own analytics store; it holds the same id-only spans and nothing else"
    license: "Apache-2.0 (LICENSE blob verified @v25.12.11.4-stable — 203 lines, stock, no acceptable-use rider, no field-of-use restriction)"
    probe: http_health
    budget_ms: 1000
    fallback: "none"
    # same reasoning as the `langfuse` row: it stores what Langfuse ingests,
    # and what Langfuse ingests carries no patient content by construction
    phi_path: false
    licence_verified_at: 2026-08-29
    licence_blob_url: "https://raw.githubusercontent.com/ClickHouse/ClickHouse/7852f16b4962eb6e129cc446b2c889b91d702061/LICENSE"
    licence_blob_sha256: "e276e9cd356772864ed82575f081ef1b8225914c3ac39a03c9112821a7e33f62"
    licence_note: >-
      Read at commit 7852f16b4962eb6e129cc446b2c889b91d702061, which is what
      tag v25.12.11.4-stable dereferences to — the tag matching the pinned
      image. Stock Apache-2.0 with a ClickHouse, Inc. copyright line; the one
      grep hit for "addendum" is line 121 of the standard appendix
      ("or as an addendum to the NOTICE text"), boilerplate rather than a
      rider. ClickHouse acquired Langfuse in January 2026 (files/05 §"Langfuse
      is self-hostable with an MIT core"), so both licences now sit under the
      same owner and both are re-verified together on a version bump.

