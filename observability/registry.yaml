      release archive (archive sha256
      b96680b46e61287faae243e360db5de34e4f315e2a8ee105fedddc176e79b1e7, module
      sha256
      b59fd2266c03699da2de9d6d281ffc2a3e791eb6646069d2b9744543ccd90b1c), 11357
      bytes, the stock Apache-2.0 text, sha256
      c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4. Read
      from the artefact rather than from the repository, because the artefact
      is what runs. (c) The ruleset, OWASP CRS 4.0.0, embedded in that module
