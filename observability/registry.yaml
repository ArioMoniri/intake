  # INT-018 — the forward egress proxy (files/10 §4). Not on the PHI path in
  # the sense of *carrying* clinical data: the `phi` network in
  # infra/docker-compose.egress.yml is `internal: true` and this container is
  # deliberately not attached to it. It is on the PHI path in the sense that
  # matters for this registry — it is the boundary control that decides what
  # may leave the trust boundary at all, so a release that ships it broken
  # ships the boundary broken.
  - component: egress-proxy
    self_hostable: true
    self_hosted_now: false
    host: "infra/docker-compose.egress.yml, profile `egress` — ubuntu/squid:6.6-24.04_edge on loopback 127.0.0.1:3128; squid.conf GENERATED from infra/security/egress-allowlist.yaml by scripts/security/render_egress_proxy_conf.py. Not booted here: HB-I1/HB-I2 — validated statically by tests/infra/test_egress_proxy.py. INT-442: the same image, digest-pinned, is the synthetic AWS host's forward proxy (infra/staging/compose.yaml, service `egress-proxy`, config infra/staging/egress/squid.conf: hosted_model_inference rows only), booted there and probed by infra/staging/egress_probe.py"
    license: "GPL-2.0-or-later (COPYING blob verified @SQUID_6_6 — see licence_note; the blob alone would read GPL-2.0-only)"
    # No HTTP health endpoint: squid answers a proxy request or nothing, and a
    # forward proxy that returns 200 to an unauthenticated GET would be a
    # finding rather than a probe. tcp_connect is what can be asserted without
    # sending traffic through the boundary being tested.
    probe: tcp_connect
    budget_ms: 1000
    # A failed proxy means no egress, which is the correct failure direction:
    # dev tooling stops, nothing leaks. There is nothing to fall back TO
    # without reopening the boundary.
    fallback: "none"
    phi_path: true
    licence_verified_at: 2026-08-29
    licence_blob_url: "https://raw.githubusercontent.com/squid-cache/squid/e8118a7381213f5cfcdeb4cec1d2d854bfd261c8/COPYING"
    licence_blob_sha256: "8177f97513213526df2cf6184d8ff986c675afb514d4e68a404010521b880643"
    licence_note: >-
      Read at commit e8118a7381213f5cfcdeb4cec1d2d854bfd261c8 (tag SQUID_6_6),
      2026-08-29: 339 lines, the stock GNU GPL version 2 text, sha256
      8177f97513213526df2cf6184d8ff986c675afb514d4e68a404010521b880643. The
      blob says nothing about "or later" — reading only the blob would have
      recorded GPL-2.0-**only**, which is the laundered-claim shape files/03
      §4.9.0 rule 3 warns about, here in the direction that understates our
      rights. The "+" is in the per-file headers: every source file carries
      "Squid software is distributed under GPLv2+ license and includes
      contributions from numerous individuals and organizations. Please see
      the COPYING and CONTRIBUTORS files for details." (verified in src/main.cc
      at the same commit). GPLv2+ is a distribution licence and we do not
      distribute squid — it runs as an unmodified upstream container behind a
      config file of our own, which is data, not a derivative work. Re-read
      the blob AND a source header on every version bump: a project that
      states its "+" only in headers can drop it in a header sweep without
      touching COPYING at all. INT-442, 2026-10-03: the 6.6-24.04_edge tag
      ships squid 6.14 (the running binary's own banner on the synthetic
      host); re-read at tag SQUID_6_14 (commit
      a8c54a8f23f0dc41025097caab73ec445f49b78f): COPYING is byte-identical
      (same sha256) and src/main.cc carries the same GPLv2+ header.

  # INT-203 — the edge (files/10 §4 `Edge:`). Two components, one policy:
  # infra/security/edge/edge-policy.yaml renders Traefik's static and dynamic
  # configuration, CrowdSec's scenarios and acquisition, and the cert-manager
  # manifest, so the four enforcement points cannot drift
  # (scripts/security/render_edge_conf.py, `make edge-conf`).
  #
  # On the PHI path in the sense that matters here: the ingress decides what
  # reaches the API at all, and the API is where clinical data is. Unlike the
  # egress proxy this tier IS booted and exercised — `make edge-check` runs
  # tests/infra/test_edge_stack_integration.py against the real engine, which
  # is what lets the acceptance's "WAF blocks OWASP CRS suite" be a
  # measurement rather than a claim.
  #
  # The WAF is NOT a third row. Coraza runs as a wasm middleware inside the
  # Traefik process: it has no address, no endpoint and nothing to probe, and
  # a row whose `probe` had to be invented to satisfy the schema would be
  # worse than no row. Its pins and licences are machine-readable in
  # edge-policy.yaml, which is itself schema-validated
  # (intake_platform.edge.policy.WafPolicy), and are set out in licence_note
  # below.
  - component: edge-ingress
    self_hostable: true
    # `false`, on the EHRbase precedent in this file's header: the tier is
    # built, licence-verified, booted and exercised (`make edge-check` runs the
    # corpus through it), and it is not running in any deployment — it sits
    # behind the `edge` compose profile and there is no cluster to put it in
    # until INT-201. "Enabled" for the release gate means running, and a
    # boundary control whose only honest fallback is `none` would otherwise
    # block every release forever on a condition nothing can satisfy.
    self_hosted_now: false
    host: "infra/docker-compose.edge.yml, profile `edge` — traefik:v3.3.7 with the Coraza/OWASP-CRS middleware, on loopback 127.0.0.1:18080; traefik.yml and dynamic.yml GENERATED from infra/security/edge/edge-policy.yaml"
    license: "MIT (LICENSE.md blob verified @v3.3.7) + Apache-2.0 for the WAF middleware and its embedded ruleset — see licence_note"
    # Traefik's own `/ping`, served on the `metrics` entry point rather than on
    # either internet-facing one.
    probe: http_health
    budget_ms: 1000
    # A failed ingress means no traffic reaches the API, which is the correct
    # failure direction. There is nothing to fall back TO that is not "serve
    # the API with no WAF in front of it".
    fallback: "none"
    phi_path: true
    licence_verified_at: 2026-09-03
    licence_blob_url: "https://raw.githubusercontent.com/traefik/traefik/74bc93308b47a1a03b7dbaedd5ec2c0965f46e80/LICENSE.md"
    licence_blob_sha256: "4785e89fcc9a0f7ca3dca1aa6caa86b38db00043a669918fe932e1d87a68579b"
    licence_note: >-
      THREE licences, read separately on 2026-09-03, because three projects
      travel in this one process. (a) Traefik, at commit
      74bc93308b47a1a03b7dbaedd5ec2c0965f46e80 (tag v3.3.7): 20 lines, the
      stock MIT text, "Copyright (c) 2016-2020 Containous SAS; 2020-2025
      Traefik Labs" — the structured fields above. Traefik Labs sells
      Enterprise/Hub separately; nothing here enables either and no licence key
