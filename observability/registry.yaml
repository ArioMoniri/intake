  - component: voxcpm2-tts
    self_hostable: true
    self_hosted_now: true
    host: "openbmb/VoxCPM2@32279eff (voxcpm==2.0.3) — team GPU server, loopback 127.0.0.1:8805, supervised by bin/serve_voxcpm2_supervised.sh (dev/synthetic only; PHI-path in-country serving is contract-gated, files/00_STATE.md §3 D11). Serving on CPU today: the box is a shared MIG 3g.71gb slice with ~3.4 GiB free against this model's ~8 GiB, so the server's device ladder chose CPU (RTF ~4). That serves files/03 §4.9.1 row 10, the compile-time clip path, and NOT row 11, the dynamic 0.14 s-TTFT path, which stays VRAM-blocked — docs/evidence/INT-243.md"
    license: "Apache-2.0 (stock, unmodified — raw LICENSE blob read and hashed; see licence_blob_url and licence_note)"
    probe: http_health
    budget_ms: 3000
    # files/03 §4.9.1 row 12 stays serving on 8803 as the whole-session
    # fallback, so a failed VoxCPM2 rollout costs nothing
