    phi_path: true
    model_id: "openbmb/VoxCPM2"
    revision: "32279effe8c19989596f05d353d1447f51d9e915"
    weights_sha256:
      model.safetensors: "f7f964cfa9da23653baec6e6f7750719977ad944ed9f95fe52fe3a620506891d"
      audiovae.pth: "94b5d51e107e0507d4acc976cfdadb64edd6fd06d1f751dadbf2fd1594274bf1"
    licence_verified_at: 2026-08-29
    licence_blob_url: "https://raw.githubusercontent.com/OpenBMB/VoxCPM/272b8ffbf660b0cfd07e20fdef538f335a4f92ca/LICENSE"
    licence_blob_sha256: "4f10acc209addacfad28293315c74c4cd648f771ee1263a748f1781d1e0265e4"
    licence_note: >-
      The Hugging Face weights repo openbmb/VoxCPM2 carries NO LICENSE file at
      any revision — the path 404s, so there is no blob to read there, and the
      card tag would be exactly the badge that files/03 §4.9.0 rule 3 refuses.
      The grant recorded here was read from the vendor SOURCE repo instead:
      OpenBMB/VoxCPM at commit 272b8ffbf660b0cfd07e20fdef538f335a4f92ca, the
      same project that publishes the voxcpm==2.0.3 inference package used to
      serve these weights. The blob is stock unmodified Apache-2.0 — 200 lines,
      no addendum, no acceptable-use rider, no field-of-use restriction,
      irrevocable section 2 grant, commercial use permitted. It is vendored
      NEXT TO the mirrored weights on the serving host, at
      /data/intake/models/hf/hub/models--openbmb--VoxCPM2/ as LICENSE,
      SHA256SUMS and LICENCE_PROVENANCE.md, so the grant travels with the
      artefact instead of resting on a README the vendor can edit. Audited
      2026-08-29; supersedes the "NO licence blob — open finding" that the
      freya-tts row used to carry on VoxCPM2's behalf.

  - component: deid-tr-ner-v1
