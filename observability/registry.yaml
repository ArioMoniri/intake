# INT-022 — the self-hosting registry (CLAUDE.md invariants 13, 15, 19).
#
# Schema per acceptance, exactly these nine keys per row:
#   {component, self_hostable, self_hosted_now, host, license, probe,
#    budget_ms, fallback, phi_path}
# Validated by services/probes (intake_probes.registry): phi_path implies
# self_hostable (invariant 19), probe ids must exist in code, fallback is
# `none` | `component:<name>` (must resolve here) | `in-process:<module>`.
#
# "Enabled" for the release gate means self_hosted_now: true — a planned row
# binds the moment it runs, never before. scripts/release/release_gate.py
# blocks the release for every enabled phi_path row whose fallback is missing
# or unhealthy; today that is the true state of the stack and the gate says so.
#
# Licences here are findings, never claims: UNVERIFIED stays UNVERIFIED until
# a raw LICENSE blob has been read (files/03 §4.9.0 rule 3).
#
# EHRbase is intentionally absent: openEHR was cut from P0/P1 and kept as a
# P3 export tier (files/00_STATE.md §3 D8) — it joins this registry with
# INT-032, not before.

components:
  - component: postgres
    self_hostable: true
    self_hosted_now: true
    host: "dev compose 127.0.0.1:5432 — pgvector/pgvector:pg16"
    license: "PostgreSQL Licence (PostgreSQL and pgvector both)"
    probe: postgres_select1
    budget_ms: 500
    fallback: "component:backups"
    phi_path: true

  - component: redis
    self_hostable: true
    self_hosted_now: true
    host: "dev compose 127.0.0.1:6379 — redis:7.4-alpine"
    license: "RSALv2 / SSPLv1 dual (source-available, not OSI; internal self-hosting permitted — re-verify before ever offering it as a service)"
    probe: redis_ping
    budget_ms: 200
    fallback: "none"
    # phi_path false TODAY: it holds rate-limit counters and idempotency keys
    # over tokenized principals only (INT-176/INT-177). The moment session or
    # clinical state lands in Redis this flips to true and the gate binds.
    phi_path: false

  - component: minio
    self_hostable: true
    self_hosted_now: true
    host: "dev compose 127.0.0.1:9000 — minio/minio:RELEASE.2024-01-16T16-07-38Z"
    license: "AGPL-3.0-only"
    probe: minio_ready
    budget_ms: 1000
    fallback: "component:backups"
    phi_path: true

  - component: hapi
    self_hostable: true
    self_hosted_now: true
    host: "dev compose 127.0.0.1:8091 — hapiproject/hapi:v7.2.0 (FHIR R4)"
    license: "Apache-2.0"
    probe: http_health
    budget_ms: 3000
    fallback: "component:backups"
    phi_path: true

  - component: openbao
    self_hostable: true
    self_hosted_now: true
    host: "dev compose 127.0.0.1:8200 — openbao/openbao:2.0.2 (dev mode, auto-unsealed)"
    license: "MPL-2.0"
    probe: openbao_seal_status
    budget_ms: 500
    fallback: "component:backups"
    phi_path: true

  - component: api
    self_hostable: true
    self_hosted_now: false
    host: "code landed (INT-197 dev-tier slice: dev-bearer auth, visits, notes, documents) — not yet wired into compose/systemd; flips true when the deployment issue runs it"
    license: "proprietary (repo LICENSE)"
    probe: http_health
    budget_ms: 800
    fallback: "none"
    phi_path: true

  - component: probes
    self_hostable: true
    self_hosted_now: false
    host: "this package (services/probes) — runner exists; the 60 s scheduler wiring (systemd/compose) lands with the deployment issues"
    license: "proprietary (repo LICENSE)"
    probe: http_health
    budget_ms: 800
    fallback: "none"
    # probes read health endpoints only — no PHI reaches this service
    phi_path: false

  - component: voice-runtime
    self_hostable: true
    self_hosted_now: false
    host: "planned — LiveKit Agents worker; the LiveKit server+TURN dev tier lands with INT-090"
    license: "proprietary (repo LICENSE); LiveKit Agents Apache-2.0; livekit/turn-detector is proprietary (LiveKit Model License — knowingly adopted, files/03 §4.9.2(d))"
    probe: livekit_room_join
    budget_ms: 5000
    # the profile-level degraded mode is `typed` (ADR-010) — a mode of this
    # same service, not a separate component, so it cannot stand as `fallback`
    fallback: "none"
    phi_path: true

  - component: edge-tls
    self_hostable: true
    self_hosted_now: false
    host: "no TLS edge in the dev tier (compose binds loopback, plaintext); probe target comes from INTAKE_TLS_PROBE_TARGET once an edge terminator exists"
    license: "not chosen yet — recorded when the edge terminator lands"
    probe: cert_expiry_days
    budget_ms: 2000
    fallback: "none"
    phi_path: true

  - component: backups
    self_hostable: true
    self_hosted_now: false
    host: "INTAKE_BACKUP_DIR (default .cache/backups) — no backup job wired yet; until one runs, every fallback pointing here fails the release gate, by design"
    license: "n/a — our own artefacts"
    probe: backup_freshness
    budget_ms: 200
    fallback: "none"
    phi_path: true

  # --- model rows: pins mirror files/03 §4.9.1; licences are the verified
  # --- findings, carried verbatim (files/03 §4.9.0 rule 3) -------------------

  - component: qwen3.5-9b
    self_hostable: true
    self_hosted_now: true
    host: "Qwen/Qwen3.5-9B@c202236 — team GPU server, loopback 127.0.0.1:8801 (dev/synthetic only; PHI-path in-country serving is contract-gated, files/00_STATE.md §3 D11)"
    license: "Apache-2.0 (LICENSE blob verified @c202236)"
    probe: http_health
    budget_ms: 2000
    # no served fallback exists: files/03 §4.9.1 row 8 is a quality tier, not
    # a fallback, and scripted clips + `typed` are modes, not components. The
    # gate blocks on this row until a served fallback exists — by design.
    fallback: "none"
    phi_path: true

  - component: whisper-tr-medical
    self_hostable: true
    self_hosted_now: true
    host: "turkmedstt/whisper-large-v3-turkish-medical@0e74ec8 (CTranslate2 float16) — team GPU server, invoked per-run, no daemon yet (dev/synthetic only)"
    license: "UNVERIFIED (card tag apache-2.0, no blob)"
    probe: http_health
    budget_ms: 4000
    # it is itself the ASR fallback (files/03 §4.9.1 row 2); nothing stands
    # behind it
    fallback: "none"
    phi_path: true

  - component: freya-tts
    self_hostable: true
    # INT-240: flipped true. The owner approval this row was waiting on landed
    # and the daemon has been serving since INT-233 — /health on 8803 answers
    # {"model":"freyavoice/Freya-TTS","revision":"d124e07…","device":"cuda"}.
    # It matters beyond bookkeeping: voxcpm2-tts below names this row as its
    # fallback, and a fallback the release gate believes is not running is a
    # fiction.
    self_hosted_now: true
    host: "freyavoice/Freya-TTS@d124e07 (code pin 146d36c) — team GPU server, loopback 127.0.0.1:8803, CUDA, supervised by bin/serve_tts_supervised.sh (dev/synthetic only). files/03 §4.9.1 row 12: the whole-session TTS fallback, selected at session start"
    # INT-240: the trailing "VoxCPM2 VAE weights @32279eff have NO licence
    # blob — open finding" is REMOVED from this row. It was never Freya's
    # finding to carry, and it is now closed: VoxCPM2 has its own row below,
    # with the blob url and sha it was actually verified from.
    license: "Apache-2.0 (code LICENSE blob verified @d124e07)"
    probe: http_health
    budget_ms: 3000
    # the bottom of the TTS ladder (files/03 §4.9.1 row 12): nothing stands
    # behind it but `typed`, which is a profile mode, not a component. The
    # gate blocks on this row, by design.
    fallback: "none"
    phi_path: true

  - component: voxcpm2-tts
    self_hostable: true
    self_hosted_now: true
    host: "openbmb/VoxCPM2@32279eff (voxcpm==2.0.3) — team GPU server, loopback 127.0.0.1:8805, supervised by bin/serve_voxcpm2_supervised.sh (dev/synthetic only; PHI-path in-country serving is contract-gated, files/00_STATE.md §3 D11). Serving on CPU today: the box is a shared MIG 3g.71gb slice with ~3.4 GiB free against this model's ~8 GiB, so the server's device ladder chose CPU (RTF ~4). That serves files/03 §4.9.1 row 10, the compile-time clip path, and NOT row 11, the dynamic 0.14 s-TTFT path, which stays VRAM-blocked — docs/evidence/INT-240.md"
    license: "Apache-2.0 (stock, unmodified — raw LICENSE blob read and hashed; see licence_blob_url and licence_note)"
    probe: http_health
    budget_ms: 3000
    # files/03 §4.9.1 row 12 stays serving on 8803 as the whole-session
    # fallback, so a failed VoxCPM2 rollout costs nothing
    fallback: "component:freya-tts"
    phi_path: true
    model_id: "openbmb/VoxCPM2"
    revision: "32279effe8c19989596f05d353d1447f51d9e915"
    weights_sha256:
      model.safetensors: "f7f964cfa9da23653baec6e6f7750719977ad944ed9f95fe52fe3a620506891d"
      audiovae.pth: "94b5d51e107e0507d4acc976cfdadb64edd6fd06d1f751dadbf2fd1594274bf1"
    licence_verified_at: 2026-08-29
    licence_blob_url: "https://raw.githubusercontent.com/OpenBMB/VoxCPM/272b8ffbf660b0cfd07e20fdef538f335a4f92ca/LICENSE"
    licence_blob_sha256: "4f10acc209addacfad28293315c74c4cd648f771ee1263a748f1781d1e0265e4"
    licence_note: >-
      The Hugging Face weights repo openbmb/VoxCPM2 carries NO LICENSE file at
      any revision — the path 404s, so there is no blob to read there, and the
      card tag would be exactly the badge that files/03 §4.9.0 rule 3 refuses.
      The grant recorded here was read from the vendor SOURCE repo instead:
      OpenBMB/VoxCPM at commit 272b8ffbf660b0cfd07e20fdef538f335a4f92ca, the
      same project that publishes the voxcpm==2.0.3 inference package used to
      serve these weights. The blob is stock unmodified Apache-2.0 — 200 lines,
      no addendum, no acceptable-use rider, no field-of-use restriction,
      irrevocable section 2 grant, commercial use permitted. It is vendored
      NEXT TO the mirrored weights on the serving host, at
      /data/intake/models/hf/hub/models--openbmb--VoxCPM2/ as LICENSE,
      SHA256SUMS and LICENCE_PROVENANCE.md, so the grant travels with the
      artefact instead of resting on a README the vendor can edit. Audited
      2026-08-29; supersedes the "NO licence blob — open finding" that the
      freya-tts row used to carry on VoxCPM2's behalf.

  - component: deid-tr-ner-v1
    self_hostable: true
    self_hosted_now: true
    host: "in-process (intake_platform.deid) — pinned artefact .cache/deid-tr-ner-v1, sha256-verified by `make deid-model` (INT-015)"
    license: "own-trained: MIT base model + CC-BY-4.0 training data"
    # artefact presence via the freshness probe with no age bound — a pinned
    # model's mtime is its install time, not a health signal
    probe: backup_freshness
    budget_ms: 200
    fallback: "in-process:intake_platform.redaction"
    phi_path: true
