# osv-scanner configuration (INT-429). `make security` step [6/12] and the
# vulnerabilities job read it from beside pnpm-lock.yaml and uv.lock.
#
# Two entries, one advisory of one package each, and each one expires.
# tests/ci/test_security_gates.py pins the ids and the expiries, and counts
# them with the keycloak provider's own entry (pin 3). When an ignoreUntil
# passes, osv-scanner reports that advisory again, and the gate turns red
# until a fix ships or the dependency is gone.
# Removing an entry sooner is always correct.
#
# INT-508: the owner renewed both entries once, to 31 Dec 2026, because
# neither package had a fixed release on 16 Oct 2026 (docs/evidence/INT-501.md).

