reason = """\
RENEWED ONCE, by the owner's own commit of owner-508-renew-exceptions.patch \
(INT-508), from 1 Nov to 31 Dec 2026: node-forge 1.4.0 is still the newest \
release, its fix (digitalbazaar/forge#1152) is unmerged, and every @expo/cli \
through 58.1.9 depends on node-forge (docs/evidence/INT-501.md). \
OWNER-APPROVED, TIME-BOXED EXCEPTION for node-forge 1.4.0 only. The owner \
approved a narrow 30-day exception for just that package on 2 Oct 2026 \
(owner, in chat, 2 Oct 2026: "i approve node-forge ignore"; commit authorised in chat: "commit the node-forge exception files"). This is the advisory trivy reports as \
CVE-2026-85393 (aliases CVE-2026-33894), RSA PKCS#1 v1.5 signature forgery, \
with no fixed release: 1.4.0 is the newest node-forge on npm. node-forge is \
in pnpm-lock.yaml only under @expo/cli 57.0.19 and \
@expo/code-signing-certificates 0.0.6, which are Node developer tooling. \
@expo/cli loads it from utils/codesigning.js, which signs development \
manifests in the `expo start` dev server and is also reached from \
`expo logout`. It also loads it from run/ios/codeSigning/Security.js, which \
reads keychain certificates for `expo run:ios`. Neither runs during \
`expo export`, no app source imports node-forge, and the production iOS and \
Android `expo export` bundles carry no node-forge code \
(docs/evidence/INT-429.md)."""

