[project]
name = "intake-connectors"
version = "0.1.0"
description = "Connector framework (INT-160): registered per-tenant destinations, OpenBao credentials, derived idempotency keys, write-ahead receipts"
requires-python = ">=3.12"
dependencies = [
    # The egress guard is the enforcement engine this framework composes with
    # rather than reimplements (ADR-026): AllowlistEntry, EgressPolicy,
    # guarded_client, the hash-chained audit, the OpenBao client.
    "intake-platform",
    "pydantic>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # The receipt/replay counters. Every family here is catalogued in
    # observability/metrics_catalog.yaml (invariant 13).
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intake_connectors"]
