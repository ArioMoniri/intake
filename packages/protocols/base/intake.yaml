      model or learning-loop proposal may ever populate one (04 §4.1).
      Owner: physician of record plus counsel (HB-C1, HB-C8, HB-L2).
      INT-619 (CD-113): kept blocked, not written. C-SSRS is licence-BLOCKED
      (HB-L2) and the 04 §4.2 escalation policy does not exist (HB-C8).

