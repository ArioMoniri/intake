  - id: rf.suicidal_intent
    label_tr: "İntihar planı veya niyeti"
    when: 'TODO: the rf.suicidal_intent trigger requires clinical sign-off'
    tense: ever
    tense_anchor: onset_date
    level: YESIL
    route: EXPEDITE
    notify_clinic: never
    status: draft_needs_source
    source_gap: >-
      Unsupplied by any clinician: the trigger, the EK-4 acuity level, the route, the
