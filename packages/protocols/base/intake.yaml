# =====================================================================================
#  base.intake — the universal pre-visit protocol every session inherits
#  Spec: 04 §1 (sections, slots, voice fields, turn budget) · 04 §3 (the universal
#  red-flag families) · 13 §4 (ordering) · 13 §13 (delivery) · 12 §1 (directory layout)
#  Issue: INT-043. Unblocks 78 of 175.
# =====================================================================================
#
#  ⛔ STOP. NOTHING IN THIS FILE MAY BE SERVED TO A PATIENT.
#
#  maturity: L0 · status: awaiting-clinical-review · every red-flag family is
#  `draft_needs_source`. Per 09 §2 that means agent-drafted and unreviewed, review
#  queue only. The compiler refuses to emit a bundle for it, and the refusal list is
#  the point of this file rather than a defect in it.
#
#  WHAT IS AUTHORED HERE, AND WHAT IS NOT — the line is drawn in one place.
#
#  Authored in full: the eight sections of 04 §1, their slots, and the patient-facing
#  question copy (`ask_tr`, `confirm_tr`, `follow_up_tr`, `choices_tr[]`). Question
#  wording is product copy, constrained by PolicyGuard and by the B1/`siz` rules in
#  the 04 header — it is not a clinical determination, so an agent may write it.
#
#  NOT authored, and deliberately empty: every clinical value. Which symptoms
#  constitute a red flag, the EK-4 acuity each family carries, its route, its delivery
#  register and its three location action scripts are all clinical determinations that
#  a named licensed physician must make under CODEOWNERS (HUMAN_BLOCKERS HB-C1).
#  Each family therefore carries the ONE sanctioned pending form permitted by
#  CLAUDE.md invariant 17 in its `when`, and a `source_gap` naming exactly what is
#  owed. No threshold in this file was guessed. There is no plausible number anywhere
#  in it, because a plausible invented number is worse than a missing one: there is no
#  diff that makes it look wrong.
#
#  ⚠️ ON THE EK-4 LEVEL, because it is the least obvious of those refusals.
#  04 §3's table states RED or YELLOW per family. The colour-semantics correction
#  immediately below that table replaced the three-level scheme with EK-4's five, and
#  says in terms that **"a naïve three-to-three colour map systematically
#  under-triages"**. Reading §3's RED as KIRMIZI_K1 or as KIRMIZI_K2 is therefore the
#  named failure mode and not a transcription: K1 is *immediate* and K2 carries the
#  ten-minute target, and choosing wrongly in either direction is a patient-safety
#  defect. Every family below consequently sits at `YESIL` / `EXPEDITE` /
#  `notify_clinic: never` — the schema's floor, which asserts nothing, and the same
#  form INT-057's generator uses for the same reason. These are not the levels these
#  rules will carry. They are the absence of a level, written in the only way the
#  enum can express it, on a rule the compiler already refuses to serve.
#
#  ⚠️ ON `register` AND `location` (CLAUDE.md invariant 21). Both are required on a
#  RED rule with no permitted default, and no family here declares them — because no
#  family here is RED yet, and a register chosen by an engineer before the acuity
#  exists is exactly the default invariant 21 forbids (the paediatric-airway case in
#  02 §5.3 is where an ALERT default causes the deterioration). The gate is wired and
#  fails closed ahead of the content it will govern: the moment a family's level
#  becomes KIRMIZI the compiler demands a register and an action resolving for
#  REMOTE, ON_SITE and UNKNOWN. That is asserted against this pack in
#  tests/protocols/test_base_intake_pack.py::
#  test_a_family_promoted_to_red_must_declare_register_and_all_three_locations.
#
#  ⚠️ NO COMMITTED GUIDELINE SNAPSHOT EXISTS FOR ANY FAMILY. 04 §8.1 rule 3 requires
#  the `source.quote` to appear verbatim in a snapshot under
#  packages/protocols/sources/. That directory does not exist in this repository —
#  not for EK-4, not for NICE, not for anything — so no family here can carry a
#  source block, and every one is `draft_needs_source` with the gap written out.
#  This is rule 3 working, not an oversight.
#
#  ⚠️ THE FAST-MODE TURN BUDGET IS OVER-SUBSCRIBED AND AN AGENT MAY NOT FIX IT.
#  04 §1 sets fast mode at ≤ 18 turns. 02 §2 already records the same content list at
#  16–21 turns in the clean case with zero clarifications, and five of the six HB-C6
#  additions below cost a turn unconditionally as authored. Cutting content, raising
#  the budget or compounding questions is a clinical decision (HB-C5; 00 §5 Q8, owner
#  ClinicalAuthor). The arithmetic is in docs/evidence/INT-043.md and the collision is
#  measured in CI rather than asserted in prose, so it cannot be closed quietly.
# =====================================================================================

kind: pack
id: base.intake
layer: base                    # 03 §6 resolution order: base → cluster → specialty →
                               # visit_type → overlay → hospital. This is the root.
version: 0.1.0-draft
schema_version: 2
maturity: L0                   # 09 §2 — never served. INT-043 closes on HB-C1.
status: awaiting-clinical-review
language: tr                   # invariant 5: the tr key is the source of truth. The
                               # English mirror is base/intake.en.yaml, keyed by these
                               # keys, because the DSL has no English field.
title_tr: "Ön görüşme temel protokolü"

voice:
  # Nothing in the base pack is paraphrasable by default. 04 §1 allows paraphrase per
  # protocol/section; invariant 10 makes scripted text verbatim. Opening the default
  # would be a decision taken once, by an engineer, for every question written later.
  allow_paraphrase:
    tr: false
  backchannel_ok: true         # 13 §4: 82.9 % of interruptions are cooperative, and
                               # backchannels mask processing latency.
  ack_style: warm
  pace: normal

sections:

  # ===================================================================================
  # 04 §1 row 1 — identity_check. Who is speaking, and on whose behalf.
  # The consent RECAP is a turn this section owns but whose TEXT it does not: consent
  # copy renders only from docs/legal/ with hash binding (invariant 18), so the slot
  # confirms the recap and carries none of its wording.
  # ===================================================================================
  identity_check:
    delivery: voice
    slots:
      subject_role:
        type: code
        valueset: vs.subject_role
        required: true
        must_ask: true
        openehr_deferred_reason: >-
          subject role is a session fact, not a clinical entry; 03 §7 names no
          archetype that hosts it and the committed template carries roots only, so a
          binding here would resolve against a fabrication (12 §8.1).
        ask_tr:
          tr: "Bu görüşmeyi kendiniz için mi yapıyorsunuz, yoksa bir yakınınız adına mı?"
        choices_tr:
          tr: ["kendim için", "yakınım adına"]
        follow_up_tr:
          tr: "Kendiniz için mi, yoksa başka biri adına mı konuşuyorsunuz?"
      proxy_reported:
        type: boolean
        required: false
        must_ask: false
        ask_if: "subject_role != 'kendim'"
        openehr_deferred_reason: >-
          proxy provenance travels on the note (04 §5 PreVisitNote.screening.provenance),
          not as an openEHR entry; no archetype in 03 §7 hosts it.
        ask_tr:
          tr: "Hastanın adına konuştuğunuzu not ediyorum. Doğru mu?"
        follow_up_tr:
          tr: "Hastanın kendisi mi konuşuyor, yoksa siz mi anlatıyorsunuz?"
      consent_recap_confirmed:
        type: boolean
        required: true
        must_ask: true
        delivery: text_first
        openehr_deferred_reason: >-
          consent records live in the consent service with their own hash-bound legal
          text (invariant 18); the pack records only that the recap was shown.
        ask_tr:
          tr: "Ekranda gösterdiğim onam özetini onaylıyor musunuz?"
        follow_up_tr:
          tr: "Onaylıyorsanız evet, onaylamıyorsanız hayır diyebilirsiniz."

  # ===================================================================================
  # 04 §1 row 2 — reason_for_visit. 13 §4: open with a genuine uninterrupted turn.
  # Langewitz 2002 measures mean spontaneous talking time at ninety-two seconds and
  # 78 % finishing inside two minutes. The justification is agenda completeness and
  # step retirement (Marvel 1999), NOT symptom yield — Bent 2006 shows an open
  # question elicits far fewer items than a checklist, and claiming otherwise will
  # not survive a clinician's first challenge.
  # ===================================================================================
  reason_for_visit:
    delivery: voice
    slots:
      chief_complaint_text:
        type: string
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-EVALUATION.reason_for_encounter.v1]"
        ask_tr:
          tr: "Sizi bugün hekime getiren şeyi kendi sözlerinizle anlatır mısınız? Sözünüzü kesmeden dinleyeceğim."
        follow_up_tr:
          tr: "Sizi en çok rahatsız eden şeyi kısaca anlatabilirsiniz."
      patient_goals:
        type: string
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-EVALUATION.reason_for_encounter.v1]"
        ask_tr:
          tr: "Bu ziyaretten en çok ne bekliyorsunuz?"
        follow_up_tr:
          tr: "Bugün buradan ayrılırken en çok neyin çözülmüş olmasını istersiniz?"

  # ===================================================================================
  # 04 §1 row 3 — hpi. OLDCARTS/SOCRATES as a COVERAGE SCHEMA, never a sequence:
  # 13 §4 records that the mnemonics return zero validation studies between them, and
  # that the open turn above retires whichever of these steps it has already answered.
  # `aggravating` and `relieving` are two slots rather than one because "ne artırıyor,
  # ne azaltıyor" is two questions in one turn (invariant 2).
  # ===================================================================================
  hpi:
    delivery: voice
    slots:
      onset_date:
        type: date
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-OBSERVATION.symptom_sign.v1]"
        ask_tr:
          tr: "Bu şikâyetiniz ne zaman başladı?"
        follow_up_tr:
          tr: "Gün, hafta ya da ay olarak yaklaşık söyleyebilirsiniz."
      location_text:
        type: string
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-OBSERVATION.symptom_sign.v1]"
        ask_tr:
          tr: "Şikâyetinizi vücudunuzun neresinde hissediyorsunuz?"
        follow_up_tr:
          tr: "Elinizle gösterebileceğiniz bir yer varsa tarif edebilirsiniz."
      duration:
        type: duration
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-OBSERVATION.symptom_sign.v1]"
        ask_tr:
          tr: "Şikâyetiniz başladığından beri ne kadar sürüyor?"
        follow_up_tr:
          tr: "Sürekli mi, yoksa arada bir mi oluyor? Süresini yaklaşık söylemeniz yeterli."
      character_text:
        type: string
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-OBSERVATION.symptom_sign.v1]"
        ask_tr:
          tr: "Bu şikâyetiniz nasıl bir his veriyor?"
        follow_up_tr:
          tr: "Örneğin baskı, yanma, zonklama ya da batma gibi tarif edebilirsiniz."
      aggravating_factors:
        type: string
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-OBSERVATION.symptom_sign.v1]"
        ask_tr:
          tr: "Şikâyetinizi ne artırıyor?"
        follow_up_tr:
          tr: "Hareket, yemek ya da nefes almak artırıyor mu?"
      relieving_factors:
        type: string
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-OBSERVATION.symptom_sign.v1]"
        ask_tr:
          tr: "Şikâyetinizi ne rahatlatıyor?"
        follow_up_tr:
          tr: "Dinlenmek ya da pozisyon değiştirmek işe yarıyor mu?"
      radiation_text:
        type: string
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-OBSERVATION.symptom_sign.v1]"
        ask_tr:
          tr: "Şikâyetiniz başka bir yere yayılıyor mu?"
        follow_up_tr:
          tr: "Yayıldığı bir yer varsa neresi olduğunu söyleyebilirsiniz."
      timing_pattern:
        type: code
        valueset: vs.timing_pattern
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-OBSERVATION.symptom_sign.v1]"
        ask_tr:
          tr: "Şikâyetiniz günün belli bir saatinde mi artıyor?"
        choices_tr:
          tr: ["sabahları", "akşamları", "geceleri", "belli bir saati yok"]
        follow_up_tr:
          tr: "Belli bir saatte artmıyorsa belli bir saati yok diyebilirsiniz."
      severity_nrs:
        type: integer
        required: true
        must_ask: true
        # 13 §5.1: spoken rating scales show PRIMACY, so reading the low end first
        # biases toward it. 13 §5.3: verbally anchoring the midpoint recovers 66 % of
        # the item nonresponse a long spoken numeric scale produces. Both anchors and
        # the midpoint are therefore in the follow-up, in words — invariant 22 keeps
        # every numeral out of anything a TTS model will ever see.
        confirm_required: true
        openehr_path: "/content[openEHR-EHR-OBSERVATION.symptom_sign.v1]"
        ask_tr:
          tr: "Şikâyetinizin şiddetini sıfır ile on arasında bir sayıyla söyler misiniz?"
        confirm_tr:
          tr: "Söylediğiniz şiddeti ekranda gösteriyorum; doğru mu?"
        follow_up_tr:
          tr: "Sıfır hiç yok, beş orta, on dayanılmaz demek. Aradan bir sayı söyleyebilirsiniz."
      trajectory:
        type: code
        valueset: vs.trajectory
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-OBSERVATION.symptom_sign.v1]"
        ask_tr:
          tr: "Başladığından beri şikâyetiniz nasıl gidiyor?"
        choices_tr:
          tr: ["daha kötü", "aynı", "daha iyi"]
        follow_up_tr:
          tr: "Daha kötü, aynı ya da daha iyi diyebilirsiniz."
      prior_similar_episode:
        type: boolean
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-OBSERVATION.story.v1]"
        ask_tr:
          tr: "Daha önce buna benzer bir şikâyetiniz oldu mu?"
        follow_up_tr:
          tr: "Benzer bir durum yaşadıysanız evet diyebilirsiniz."
      treatments_tried:
        type: string
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-OBSERVATION.story.v1]"
        ask_tr:
          tr: "Bu şikâyet için şimdiye kadar ne denediniz?"
        follow_up_tr:
          tr: "İlaç, dinlenme ya da başka bir yöntem denediyseniz söyleyebilirsiniz."
      time_last_known_well:
        # HB-C6 addition 6 of 6. Without it rf.stroke_fast has no tense_anchor and,
        # per 12 §2.4, cannot fire on an undated symptom.
        # ⚠️ FINDING for the DSL owner, not a defect of this pack: SlotType v2 has no
        # `datetime` and no `time`. A stroke window is measured in hours, so `date`
        # would lose the hour; `duration` ("ne kadar süre önce") is the only member
        # that keeps it, and it is what a patient answers with anyway. If the served
        # rule needs a wall-clock instant, the DSL needs a member first.
        type: duration
        required: false
        must_ask: false
        openehr_path: "/content[openEHR-EHR-OBSERVATION.symptom_sign.v1]"
        ask_tr:
          tr: "En son ne zaman kendinizi tamamen normal hissettiniz?"
        follow_up_tr:
          tr: "Saat ya da gün olarak yaklaşık söylemeniz yeterli."

  # ===================================================================================
  # 04 §1 row 4 — red_flags. One layperson-answerable probe per family of 04 §3.
  #
  # ⚠️ EVERY PROBE IS DELIBERATELY UNASKABLE TODAY: no `ask_tr`, no `choices_tr`.
  # The wording of a red-flag probe IS the trigger — "sudden face droop / arm weakness
  # / speech difficulty" is the rule, phrased for a patient — so writing it is the
  # clinical determination HB-C1 is waiting on, and 04 §8.1 rule 1 additionally binds
  # every trigger to be answerable by a layperson about themselves or a person in
  # front of them. The slots exist so the families have declared subjects
  # (`no_rule_references_an_undeclared_slot`) and so the shape is ready; they carry no
  # content, and an engine cannot fill them. That is HUMAN_BLOCKERS Rule 2 applied:
  # build the mechanism, wire the gate, make it fail closed, leave the content empty.
  #
  # The two suicidality probes are `text_only` (13 §13): safeguarding content is never
  # spoken, and 13 §13's finding is that a voice agent which cannot respond may
  # SUPPRESS the disclosure it is trying to elicit.
  # ===================================================================================
  red_flags:
    delivery: voice
    slots:
      rf_chest_pain_acute:
        type: boolean
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          the trigger is unsigned (HB-C1), so which archetype hosts this probe is not
          yet determinable; a binding chosen now would have to be re-chosen.
      rf_stroke_fast:
        type: boolean
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          the trigger is unsigned (HB-C1), so which archetype hosts this probe is not
          yet determinable; a binding chosen now would have to be re-chosen.
      rf_dyspnoea_rest:
        type: boolean
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          the trigger is unsigned (HB-C1), so which archetype hosts this probe is not
          yet determinable; a binding chosen now would have to be re-chosen.
      rf_anaphylaxis:
        type: boolean
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          the trigger is unsigned (HB-C1), so which archetype hosts this probe is not
          yet determinable; a binding chosen now would have to be re-chosen.
      rf_severe_bleeding:
        type: boolean
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          the trigger is unsigned (HB-C1), so which archetype hosts this probe is not
          yet determinable; a binding chosen now would have to be re-chosen.
      rf_suicidal_intent:
        type: boolean
        required: false
        must_ask: false
        delivery: text_only
        openehr_deferred_reason: >-
          safeguarding content is text_only with no extraction attempted (13 §13) and
          the escalation policy of 04 §4.2 does not exist yet (HB-C8); nothing about
          its storage shape is settled.
      rf_sepsis_like:
        type: boolean
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          the trigger is unsigned (HB-C1), so which archetype hosts this probe is not
          yet determinable; a binding chosen now would have to be re-chosen.
      rf_thunderclap_headache:
        type: boolean
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          the trigger is unsigned (HB-C1), so which archetype hosts this probe is not
          yet determinable; a binding chosen now would have to be re-chosen.
      rf_pregnancy_bleeding_pain:
        type: boolean
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          the trigger is unsigned (HB-C1) and the pregnancy rule set does not exist at
          all (HB-C4); no binding can be chosen ahead of the rule.
      rf_fever_high_persistent:
        type: boolean
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          the trigger is unsigned (HB-C1), so which archetype hosts this probe is not
          yet determinable; a binding chosen now would have to be re-chosen.
      rf_weight_loss_unintentional:
        type: boolean
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          the trigger is unsigned (HB-C1), so which archetype hosts this probe is not
          yet determinable; a binding chosen now would have to be re-chosen.
      rf_new_neuro_deficit_subacute:
        type: boolean
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          the trigger is unsigned (HB-C1), so which archetype hosts this probe is not
          yet determinable; a binding chosen now would have to be re-chosen.
      rf_suicidal_ideation_passive:
        type: boolean
        required: false
        must_ask: false
        delivery: text_only
        openehr_deferred_reason: >-
          safeguarding content is text_only with no extraction attempted (13 §13) and
          the escalation policy of 04 §4.2 does not exist yet (HB-C8); nothing about
          its storage shape is settled.

  # ===================================================================================
  # base.life_threat read-sections — INT-432 / HB-C6, decision CD-01
  # (docs/clinical/decisions/CD-01.md; packages/protocols/decisions/CD-01.yaml).
  #
  # The two ACTIVE life-threat rules (rf.chest_pain_cardiac_features,
  # rf.chest_pain_no_cardiac_history) read `chest_pain.*`, `associated.*` and
  # `trauma.*` — section-qualified references in the `gate:` namespace (12 §2.4).
  # Until these sections existed no session could fill those reads, every read was
  # Unknown, and neither rule could ever fire (12 §1.1; 04 §8.2
  # `no_rule_references_an_undeclared_slot`). The life-threat set is NOT touched:
  # it is a sibling set nothing may extend (12 §1), so the slots are declared here,
  # under the names its rules already read.
  #
  # Owner decision D18 (files/00_STATE.md §3): question copy and choices are
  # agent-authored from NICE CG95, EK-4 and openEHR CKM, agent-verified, for
  # simulated-patient stress testing only. A licensed physician's review is
  # required before any real patient; the pack stays L0 and is never served.
  #
  # Turn cost: the screen is asked of every session (the set is evaluated on every
  # session, 04 §8); the six follow-ups open only on its yes. Against the fast-mode
  # budget that is HB-C5's arithmetic, measured by
  # test_the_fast_mode_turn_budget_is_over_subscribed, not decided here.
  # ===================================================================================
  chest_pain:
    delivery: voice
    slots:
      present:
        # NICE CG95 1.2.1.1: check whether the person currently has chest pain and,
        # if pain free, when the last episode was; CG95 counts discomfort as pain.
        # PROXY STOP-GAP (CD-01 `proxy_until_dsl_selects_copy`): the DSL holds one
        # ask_tr per slot, and this copy asks about the SPEAKER's chest. In a proxy
        # session the screen is skipped rather than let the speaker's own pain fill
        # the patient's rule-gate slot; the six follow-ups then never open, stay
        # NOT_ASKED and count as missing must-ask coverage ("Sorulmadı"), and CD-01
        # requires a CD-08 clinic-inbox item (kind proxy_chest_pain_screen_unasked).
        # CD-01 carries the proxy copy for when the DSL can select it.
        type: boolean
        required: true
        must_ask: true
        skip_if: "identity_check.subject_role == 'yakınım adına'"
        openehr_deferred_reason: >-
          CD-01 binds this probe to openEHR-EHR-OBSERVATION.symptom_sign_screening.v1
          rev 1.0.7 at0005 'Presence?'; the pinned template carries roots only and
          not that archetype (HB-C12), so a path here would resolve against a
          fabrication (12 §8.1).
        ask_tr:
          tr: "Göğsünüzde şu anda ya da yakın zamanda ağrı veya rahatsızlık oldu mu?"
        follow_up_tr:
          tr: "Göğsünüzde herhangi bir ağrı ya da rahatsızlık hissettiniz mi?"
      character:
        # The first three choices are the literals rf.chest_pain_cardiac_features
        # tests; `yanma` is CKM at0189's burning character (finding F6: outside the
        # rule's cardiac set); `başka bir his` keeps an answer for every other word,
        # which hpi.character_text records verbatim. `bilmiyorum` is not a value: it
        # is the UNCLEAR answer state (CD-04).
        type: code
        valueset: vs.chest_pain_character
        required: true
        must_ask: true
        ask_if: "chest_pain.present == true"
        openehr_deferred_reason: >-
          CD-01 binds this slot to openEHR-EHR-CLUSTER.symptom_sign.v2 rev 2.1.4
          at0189 'Character'; the pinned template carries roots only and not that
          CLUSTER (HB-C12).
        ask_tr:
          tr: "Göğsünüzdeki bu his en çok hangisine benziyor: baskı, sıkışma, ağırlık, yanma ya da başka bir his?"
        choices_tr:
          tr: ["baskı", "sıkışma", "ağırlık", "yanma", "başka bir his"]
        follow_up_tr:
          tr: "Baskı, sıkışma, ağırlık, yanma ya da başka bir his diyebilirsiniz; hangisi size daha yakın?"
      radiation:
        # kol/çene/sırt are the K2 rule's literals (NICE CG95 1.2.1.3: arms, back,
        # jaw); boyun/omuz are CG95 1.3.3.1 sites outside the rule's set (finding
        # F5); `yok` is the literal the SARI rule requires. More than one site may
        # be named: the slot holds one value, so an answer naming several sites is
        # CONTESTED carrying every named site, which triage evaluates in the
        # escalating world (12 §7.3) — never one site chosen for the patient.
        type: code
        valueset: vs.chest_pain_radiation
        required: true
        must_ask: true
        ask_if: "chest_pain.present == true"
        openehr_deferred_reason: >-
          CD-01 binds this slot to openEHR-EHR-CLUSTER.symptom_sign.v2 rev 2.1.4
          at0151 'Body site'; the pinned template carries roots only and not that
          CLUSTER (HB-C12).
        ask_tr:
          tr: "Bu ağrı ya da rahatsızlık kolunuza, çenenize, sırtınıza, boynunuza, omzunuza ya da başka bir yere yayılıyor mu?"
        choices_tr:
          tr: ["kol", "çene", "sırt", "boyun", "omuz", "başka bir yer", "yok"]
        follow_up_tr:
          tr: "Yayılmıyorsa yok diyebilirsiniz; yayılıyorsa nerelere yayıldığını söyler misiniz?"
      onset_at:
        # The tense anchor of both active rules. It holds the MOST RECENT episode
        # (or "ongoing now"), not the first onset (finding F7; NICE CG95 1.2.1.1),
        # and is answered only by a closed choice; each choice resolves to an ISO
        # date against the session reference time as decided in CD-05 — never by
        # narrative, a document or the council (CD-02, CD-05).
        type: date
        required: true
        must_ask: true
        ask_if: "chest_pain.present == true"
        openehr_deferred_reason: >-
          CD-01 binds this slot to openEHR-EHR-OBSERVATION.symptom_sign_screening.v1
          rev 1.0.7 at0037 'Timing'; the pinned template carries roots only and not
          that archetype (HB-C12).
        ask_tr:
          tr: "Göğsünüzdeki bu ağrı ya da rahatsızlık en son ne zaman oldu?"
        choices_tr:
          tr: ["şu anda var", "son on iki saat içinde", "on iki saatten önce ama son üç gün içinde", "üç günden daha önce"]
        follow_up_tr:
          tr: "Şu anda var, son on iki saat içinde, on iki saatten önce ama son üç gün içinde ya da üç günden daha önce diyebilirsiniz; hangisi doğru?"

  associated:
    delivery: voice
    slots:
      diaphoresis:
        # NICE CG95 1.2.1.3: chest pain with "marked sweating".
        type: boolean
        required: true
        must_ask: true
        ask_if: "chest_pain.present == true"
        openehr_deferred_reason: >-
          CD-01 binds this probe to openEHR-EHR-OBSERVATION.symptom_sign_screening.v1
          rev 1.0.7 at0005 'Presence?'; the pinned template carries roots only and
          not that archetype (HB-C12).
        ask_tr:
          tr: "Bu ağrı ya da rahatsızlık sırasında çok terlediniz mi?"
        follow_up_tr:
          tr: "Ağrı olduğu sırada normalden çok daha fazla terleme oldu mu?"
      dyspnoea:
        # NICE CG95 1.2.1.3: chest pain with breathlessness.
        type: boolean
        required: true
        must_ask: true
        ask_if: "chest_pain.present == true"
        openehr_deferred_reason: >-
          CD-01 binds this probe to openEHR-EHR-OBSERVATION.symptom_sign_screening.v1
          rev 1.0.7 at0005 'Presence?'; the pinned template carries roots only and
          not that archetype (HB-C12).
        ask_tr:
          tr: "Bu ağrı ya da rahatsızlık sırasında nefes almakta zorlandınız mı?"
        follow_up_tr:
          tr: "Ağrı sırasında nefesiniz daraldı mı?"

  trauma:
    delivery: voice
    slots:
      recent:
        # EK-4 places simple chest injuries without chest pain or breathing
        # difficulty in a separate arm; the SARI rule requires trauma.recent ==
        # false. Recency is anchored to the episode, not to a number of days: no
        # retrieved source states one (CD-01).
        type: boolean
        required: true
        must_ask: true
        ask_if: "chest_pain.present == true"
        openehr_deferred_reason: >-
          CD-01 binds this probe to openEHR-EHR-OBSERVATION.symptom_sign_screening.v1
          rev 1.0.7 at0005 'Presence?'; the pinned template carries roots only and
          not that archetype (HB-C12).
        ask_tr:
          tr: "Bu ağrı ya da rahatsızlık başlamadan önce göğsünüz bir darbe ya da kaza sonucu yaralandı mı?"
        follow_up_tr:
          tr: "Düşme, çarpma ya da kaza gibi bir nedenle göğsünüze bir şey oldu mu?"

  # ===================================================================================
  # 04 §1 row 5 — meds_allergies. `anticoagulant_use` is HB-C6 addition 4 of 6, and it
  # lives here rather than in an overlay on purpose: `overlay.anticoagulated` exists,
  # but overlays may only add or tighten (04 §2.3), so the BASE slot must exist or the
  # bleeding and head-injury rules have nothing universal to gate on.
  # ===================================================================================
  meds_allergies:
    delivery: voice
    slots:
      meds_confirmed:
        type: boolean
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-ACTION.medication.v1]"
        ask_tr:
          tr: "İlaç listenizi ekranda gösteriyorum. Liste doğru mu?"
        follow_up_tr:
          tr: "Listede eksik ya da fazla bir şey varsa söyleyebilirsiniz."
      meds_new_or_stopped:
        type: string
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-ACTION.medication.v1]"
        ask_tr:
          tr: "Bu listede olmayan ya da bıraktığınız bir ilaç var mı?"
        follow_up_tr:
          tr: "Yeni başladığınız veya bıraktığınız ilaçların adını söyleyebilirsiniz."
      otc_herbal:
        type: string
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-ACTION.medication.v1]"
        ask_tr:
          tr: "Reçetesiz ya da bitkisel bir ürün kullanıyor musunuz?"
        follow_up_tr:
          tr: "Vitamin, bitki çayı ve takviyeler de bu gruba girer."
      anticoagulant_use:
        type: code
        valueset: vs.anticoagulant_use
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-ACTION.medication.v1]"
        ask_tr:
          tr: "Kan sulandırıcı bir ilaç kullanıyor musunuz?"
        choices_tr:
          tr: ["evet", "hayır", "bilmiyorum"]
        follow_up_tr:
          tr: "İlaç kutusundaki adı okuyabilirseniz çok yardımcı olur."
      allergies:
        type: string
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-EVALUATION.adverse_reaction_risk.v1]"
        ask_tr:
          tr: "Bilinen bir ilaç ya da madde alerjiniz var mı?"
        follow_up_tr:
          tr: "Bilinen bir alerjiniz yoksa yok diyebilirsiniz."
      allergy_reaction:
        type: string
        required: false
        must_ask: false
        openehr_path: "/content[openEHR-EHR-EVALUATION.adverse_reaction_risk.v1]"
        ask_tr:
          tr: "Alerjiniz olduğunda neler oluyor?"
        follow_up_tr:
          tr: "Döküntü, şişme ya da nefes darlığı gibi tarif edebilirsiniz."

  # ===================================================================================
  # 04 §1 row 6 — pmh_fh_sh (delta). Four of the six HB-C6 additions live here.
  #
  # ⚠️ ORDERING FINDING, for the DSL owner. 13 §4 asks for pregnancy/LMP and
  # immunosuppression EARLY and UNIVERSALLY — ruptured ectopic classically presents in
  # a woman who does not know she is pregnant, NG255 scopes sepsis to pregnant or
  # recently pregnant people of any age, and neutropenic sepsis is a one-hour
  # emergency that must not depend on an overlay which may not exist. 13 §14 item 13
  # goes further and promotes both to class-1 GATEKEEPERS with a compiler assertion
  # that each precedes every step whose gate references it. **The INT-040 DSL has no
  # priority-class field**, so section order is the only ordering this pack can
  # express, and 04 §1's own table puts these in row 6. The gatekeeper promotion needs
  # a DSL change, not a pack edit; it is recorded here rather than silently dropped.
  # ===================================================================================
  pmh_fh_sh:
    delivery: voice
    slots:
      new_diagnoses_since_last_visit:
        type: string
        required: true
        must_ask: true
        openehr_path: "/content[openEHR-EHR-EVALUATION.problem_diagnosis.v1]"
        ask_tr:
          tr: "Son görüşmenizden bu yana sağlığınızda yeni bir gelişme oldu mu?"
        follow_up_tr:
          tr: "Yeni bir tanı aldıysanız ya da hastaneye yattıysanız söyleyebilirsiniz."
      pregnancy_status:
        # HB-C6 addition 1 of 6. Gates every pregnancy rule and the sepsis routing of
        # NG255. text_first per 13 §13 (pregnancy/LMP are named there explicitly).
        type: code
        valueset: vs.pregnancy_status
        required: true
        must_ask: true
        delivery: text_first
        openehr_deferred_reason: >-
          03 §7 names no archetype for pregnancy status, and EVALUATION.problem_diagnosis
          would file a physiological state as a problem; deferred to INT-032 rather
          than bound to the nearest-looking root.
        ask_tr:
          tr: "Şu anda gebe olma ihtimaliniz var mı?"
        choices_tr:
          tr: ["evet", "hayır", "emin değilim"]
        follow_up_tr:
          tr: "Emin değilseniz emin değilim diyebilirsiniz."
      lmp_date:
        # HB-C6 addition 2 of 6, and the ONLY one of the six the DSL can gate today.
        type: date
        required: false
        must_ask: false
        delivery: text_first
        ask_if: "pregnancy_status != 'hayir'"
        openehr_deferred_reason: >-
          03 §7 names no archetype for menstrual history; deferred to INT-032.
        ask_tr:
          tr: "Son âdet kanamanız ne zaman başladı?"
        follow_up_tr:
          tr: "Gün ve ay olarak yaklaşık söylemeniz yeterli."
      immunosuppression:
        # HB-C6 addition 3 of 6. Gates neutropenic fever and the sepsis-like family.
        type: code
        valueset: vs.immunosuppression
        required: true
        must_ask: true
        openehr_deferred_reason: >-
          the concept spans a treatment, a diagnosis and a transplant history; 03 §7
          names no single root that carries all three, and splitting it across roots
          is a modelling decision for INT-032.
        ask_tr:
          tr: "Bağışıklığınızı baskılayan bir tedavi görüyor musunuz?"
        choices_tr:
          tr: ["evet", "hayır", "bilmiyorum"]
        follow_up_tr:
          tr: "Kemoterapi, biyolojik ilaç, kortizon tedavisi ya da organ nakli bu gruba girer."
      weight_kg:
        # HB-C6 addition 5 of 6. `confirm_required` is not decoration: invariant 22
        # says no numeric slot value is spoken without a matching inline render on the
        # same work_id, and 00 §2 records a TTS normaliser that can mis-verbalise a
        # weight or dose by ten times. The confirm step is where that is caught.
        type: quantity
        unit: kg
        required: false
        must_ask: false
        confirm_required: true
        openehr_deferred_reason: >-
          body weight belongs to an OBSERVATION.body_weight archetype that 03 §7 does
          not name and the committed template does not carry; inventing the root would
          resolve the binding against a fabrication (12 §8.1).
        ask_tr:
          tr: "Kilonuzu biliyorsanız söyler misiniz?"
        confirm_tr:
          tr: "Söylediğiniz kiloyu ekranda gösteriyorum; doğru mu?"
        follow_up_tr:
          tr: "Yaklaşık bir değer de yeterli olur."
      smoking_status:
        type: code
        valueset: vs.smoking_status
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          social history has no root in 03 §7's list; deferred to INT-032.
        ask_tr:
          tr: "Sigara kullanıyor musunuz?"
        choices_tr:
          tr: ["evet", "bıraktım", "hiç kullanmadım"]
        follow_up_tr:
          tr: "Bıraktıysanız bıraktım diyebilirsiniz."
      alcohol_use:
        type: code
        valueset: vs.alcohol_use
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          social history has no root in 03 §7's list; deferred to INT-032.
        ask_tr:
          tr: "Alkol kullanıyor musunuz?"
        choices_tr:
          tr: ["hiç", "ara sıra", "düzenli"]
        follow_up_tr:
          tr: "Hiç, ara sıra ya da düzenli diyebilirsiniz."
      occupation:
        type: string
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          social history has no root in 03 §7's list; deferred to INT-032.
        ask_tr:
          tr: "Ne iş yapıyorsunuz?"
        follow_up_tr:
          tr: "Çalışmıyorsanız bunu da söyleyebilirsiniz."
      living_situation:
        type: string
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          social history has no root in 03 §7's list; deferred to INT-032.
        ask_tr:
          tr: "Evde kiminle yaşıyorsunuz?"
        follow_up_tr:
          tr: "Yalnız yaşıyorsanız yalnız diyebilirsiniz."
      caregiver_present:
        type: boolean
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          social history has no root in 03 §7's list; deferred to INT-032.
        ask_tr:
          tr: "Günlük işlerinizde size yardım eden biri var mı?"
        follow_up_tr:
          tr: "Yardım eden biri varsa evet diyebilirsiniz."

  # ===================================================================================
  # 04 §1 row 7 — screening. `text_only` per 13 §13, and that is load-bearing:
  # "text_only must mean text only: no clip, no speech_tr, ever", enforced by the
  # compiler, so nothing here can be accidentally spoken. 02 §2 (corrected) also moves
  # PHQ-2/GAD-2 OUT of the spoken flow entirely — they are offered after the note is
  # assembled, so declining costs the patient nothing and the note is complete either
  # way. Neither costs a fast-mode turn, which is why the turn arithmetic below cannot
  # be balanced by dropping them: that lever is already spent.
  #
  # ⛔ C-SSRS IS NOT REFERENCED. 04 §1 lists a `cssrs_screen` slot, so the slot exists
  # and the cascade has somewhere to land — but the instrument is licence-BLOCKED
  # (HB-L2: Clario holds the exclusive RFMH electronic licence, and the only Turkish
  # validation is adolescents twelve to eighteen). A pack referencing a non-GO
  # instrument must fail the build, so the reference is absent, the slot is unaskable,
  # and the gate fails closed. WHO-5 is likewise absent (HB-L3).
  # Instrument ITEM text is not authored here: the verbatim Turkish items belong to
  # the instrument engine (INT-116), and an item reworded by anyone is no longer the
  # instrument its validation refers to (04 header, instrument fidelity).
  # ===================================================================================
  screening:
    delivery: text_only
    questionnaires: ["PHQ-2", "GAD-2", "PHQ-9", "GAD-7"]
    voice:
      allow_paraphrase:
        tr: false
    slots:
      phq2:
        type: integer
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          PHQ-2 is the first two PHQ-9 items but is not the PHQ-9; filing its score
          under OBSERVATION.phq9 would misreport the instrument administered.
      gad2:
        type: integer
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          GAD-2 is not GAD-7; filing its score under OBSERVATION.gad7 would misreport
          the instrument administered.
      phq9:
        type: integer
        required: false
        must_ask: false
        openehr_path: "/content[openEHR-EHR-OBSERVATION.phq9.v1]"
      gad7:
        type: integer
        required: false
        must_ask: false
        openehr_path: "/content[openEHR-EHR-OBSERVATION.gad7.v1]"
      cssrs_screen:
        type: boolean
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          C-SSRS is licence-BLOCKED (HB-L2) and 04 §4.2's escalation policy does not
          exist (HB-C8); nothing may be stored because nothing may be administered.

  # ===================================================================================
  # 04 §1 row 8 — expectations_wrapup.
  # ⚠️ ONE EVIDENCE CAVEAT, stated rather than quietly inherited. 13 §4's cheapest
  # verified win is the English wording contrast "is there SOMETHING else" versus
  # "anything else" (Heritage 2007: OR 0.154, p = .001). Turkish renders both as
  # "başka bir şey", so the contrast has no Turkish form and the finding does not
  # transfer. The wording below claims none of that effect; whether an equivalent
  # Turkish lever exists is an open question for the clinician, not something to
  # assert by translating an English result.
  # ===================================================================================
  expectations_wrapup:
    delivery: voice
    slots:
      open_questions:
        type: string
        required: true
        must_ask: true
        openehr_deferred_reason: >-
          patient questions travel on the PatientSummary (04 §5), not as an openEHR
          entry; 03 §7 names no root for them.
        ask_tr:
          tr: "Doktorunuza sormak istediğiniz bir şey var mı?"
        follow_up_tr:
          tr: "Aklınıza gelen soruları şimdi söyleyebilirsiniz."
      anything_else:
        type: string
        required: true
        must_ask: true
        openehr_deferred_reason: >-
          a free wrap-up turn has no archetype; whatever it elicits is filed under the
          entry its content belongs to, which is a runtime decision.
        ask_tr:
          tr: "Eklemek istediğiniz başka bir şey var mı?"
        follow_up_tr:
          tr: "Küçük gibi görünen bir ayrıntı da önemli olabilir."
      summary_confirmed:
        type: boolean
        required: true
        must_ask: true
        openehr_deferred_reason: >-
          patient confirmation of a section is note metadata (04 §5
          patient_confirmed_sections), not a clinical entry.
        ask_tr:
          tr: "Özeti ekranda gösteriyorum. Her şey doğru mu?"
        follow_up_tr:
          tr: "Düzeltmek istediğiniz bir yer varsa söyleyebilirsiniz."
      bring_list_ack:
        type: boolean
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          the bring list is PatientSummary content (04 §5), not a clinical entry.
        ask_tr:
          tr: "Randevunuza getirmeniz gerekenleri ekranda gösteriyorum. Gördünüz mü?"
        follow_up_tr:
          tr: "Listeyi görmediyseniz tekrar gösterebilirim."

# =====================================================================================
#  THE UNIVERSAL RED-FLAG FAMILIES — 04 §3, all thirteen, none added, none dropped.
#
#  Read the header before editing one of these. Every field below that could carry a
#  clinical determination carries the absence of one instead:
#
#    when:          the sole sanctioned pending form (invariant 17). NOT a predicate.
#    level:         YESIL — the floor. NOT the acuity this family will carry.
#    route:         EXPEDITE — the floor. NOT the route this family will carry.
#    notify_clinic: never — the floor. Every RED is `always`, unconditionally and
#                   time-bound (04 §4.2 defect 1), the moment one of these becomes RED.
#    register:      absent, because the family is not RED yet and a register chosen
#                   before the acuity is the default invariant 21 forbids.
#    action:        absent, for the same reason. All three locations become mandatory
#                   at KIRMIZI and the compiler enforces it.
#    source:        absent. packages/protocols/sources/ does not exist, so there is no
#                   committed snapshot any quote could be checked against — for EK-4
#                   or for anything else. 04 §8.1 rule 3: never an invented citation.
#    tense:         ever — the widest tense, under which acuity is lowest (04 §8.1
#                   rule 4 makes acuity non-increasing as the tense recedes).
#    tense_anchor:  the dated slot the family would key off. Structural, not clinical;
#                   the physician may replace it with a family-specific dated slot.
#
#  The goldens are in tests/protocols/goldens/base/red_flag_families.yaml — a true
#  positive and a NEAR-MISS negative for each family, carried and not executed while
#  the trigger is unsigned. The negative is the more important of the two: a positive
#  can only detect under-triggering and keeps passing under every loosening of a gate,
#  while over-triggering is invisible to it and surfaces months later as clinicians
#  who have learned to ignore the alert.
# =====================================================================================
red_flags:

  - id: rf.chest_pain_acute
    label_tr: "Akut göğüs ağrısı"
    when: 'TODO: the rf.chest_pain_acute trigger requires clinical sign-off'
    tense: ever
    tense_anchor: onset_date
    level: YESIL
    route: EXPEDITE
    notify_clinic: never
    status: draft_needs_source
    source_gap: >-
      Unsupplied by any clinician: the trigger, the EK-4 acuity level, the route, the
      delivery register and the action scripts for REMOTE, ON_SITE and UNKNOWN.
      04 §3's plain-language condition is "chest pain/pressure now or under twenty-four
      hours with dyspnoea/sweating/radiation", and 04 §4 records that EK-4 splits chest
      pain across THREE levels, so a single chest-pain token is the wrong shape and the
      split must be authored before an acuity is chosen. No committed snapshot exists
      under packages/protocols/sources/ — the directory is absent — so the EK-4 text
      cannot be quoted from this repository even though it is binding law.
      Owner: physician of record (HB-C1, HB-C2, HB-C7).

  - id: rf.stroke_fast
    label_tr: "İnme düşündüren ani nörolojik bulgu"
    when: 'TODO: the rf.stroke_fast trigger requires clinical sign-off'
    tense: ever
    tense_anchor: time_last_known_well
    level: YESIL
    route: EXPEDITE
    notify_clinic: never
    status: draft_needs_source
    source_gap: >-
      Unsupplied by any clinician: the trigger, the EK-4 acuity level, the route, the
      delivery register and the action scripts for REMOTE, ON_SITE and UNKNOWN.
      04 §3's plain-language condition is "sudden face droop / arm weakness / speech
      difficulty / vision loss". The tense_anchor is the HB-C6 slot time_last_known_well,
      which now exists — but see the DSL finding on that slot: the window this family
      turns on is measured in hours and SlotType v2 has no datetime member. No committed
      snapshot exists under packages/protocols/sources/.
      Owner: physician of record (HB-C1, HB-C2, HB-C7).

  - id: rf.dyspnoea_rest
    label_tr: "İstirahatte nefes darlığı"
    when: 'TODO: the rf.dyspnoea_rest trigger requires clinical sign-off'
    tense: ever
    tense_anchor: onset_date
    level: YESIL
    route: EXPEDITE
    notify_clinic: never
    status: draft_needs_source
    source_gap: >-
      Unsupplied by any clinician: the trigger, the EK-4 acuity level, the route, the
      delivery register and the action scripts for REMOTE, ON_SITE and UNKNOWN.
      04 §3's plain-language condition is "breathlessness at rest or speaking in short
      sentences". 04 §8.1 rule 1 forbids a respiratory-rate count as a trigger, so the
      layperson-answerable form has to be authored rather than derived. No committed
      snapshot exists under packages/protocols/sources/.
      Owner: physician of record (HB-C1, HB-C2, HB-C7).

  - id: rf.anaphylaxis
    label_tr: "Anafilaksi düşündüren tablo"
    when: 'TODO: the rf.anaphylaxis trigger requires clinical sign-off'
    tense: ever
    tense_anchor: onset_date
    level: YESIL
    route: EXPEDITE
    notify_clinic: never
    status: draft_needs_source
    source_gap: >-
      Unsupplied by any clinician: the trigger, the EK-4 acuity level, the route, the
      delivery register and the action scripts for REMOTE, ON_SITE and UNKNOWN.
      04 §3's plain-language condition is "lip/tongue swelling + breathing difficulty
      after exposure". 04 §8.1 rule 6 makes the do-not list part of the action script,
      and it is unwritten. No committed snapshot exists under packages/protocols/sources/.
      Owner: physician of record (HB-C1, HB-C2, HB-C7).

  - id: rf.severe_bleeding
    label_tr: "Ağır kanama"
    when: 'TODO: the rf.severe_bleeding trigger requires clinical sign-off'
    tense: ever
    tense_anchor: onset_date
