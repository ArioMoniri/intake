      guideline_title: >-
        Yataklı Sağlık Tesislerinde Acil Servis Hizmetlerinin Uygulama Usul ve Esasları
        Hakkında Tebliğ, EK-4
      version_or_date: "RG 13/9/2022 s. 31952 (amended RG 13/5/2023 s. 32189; RG 11/10/2024 s. 32689)"
      url: "https://www.resmigazete.gov.tr/eskiler/2022/09/20220913-5-1.pdf"
      retrieved_on: 2026-10-02
      quote: "Akut hemiparazi/disfazi"
      quote_snapshot: packages/protocols/sources/TR-EK4-2022.txt
      note: >-
        CD-109. Trigger: NICE NG128 1.1.1 (FAST, face / arm / speech, in people with
        sudden onset of neurological symptoms), snapshot NICE-NG128. Level: EK-4
        Kırmızı Kategori 2. The probe asks about a deficit that began suddenly and is
        present now, so tense ever only requires the symptom to be dated; a deficit that
        has resolved (NG128 1.1.5, suspected TIA, seen within twenty-four hours) is a
        different action and is not written here. Vision loss (04 §3) is not in FAST or
        in EK-4's line and is not part of the trigger.
    action:
      REMOTE:
        primary: CALL_112
        show_112: true
        action_tr:
          tr: "Hemen yüz on iki Acil Çağrı Merkezi'ni arayın."
        do_nots_tr:
          tr:
            - "Randevuyu beklemeyin."
        why_tr:
          tr: >-
            Verilen cevaplara göre beklemeden değerlendirme gerekiyor. Yüz on iki
            ambulansıyla getirilen hastalar, acil serviste ayrıca öncelik sırası için
            bekletilmez.
      ON_SITE:
        primary: GO_TO_IN_HOUSE_ACIL
        show_112: false
        notify_staff_immediate: true
        action_tr:
          tr: "**Acil Servis'e gidin[ — {{tenant.acil_location_tr}}].** Randevuyu beklemeyin. Görevlilere haber verildi."
        do_nots_tr:
          tr:
            - "Poliklinik sırasında beklemeyin."
            - "Tek başınıza gitmeyin; bir görevliden yardım isteyin."
        why_tr:
          tr: >-
            Verilen cevaplara göre beklemeden değerlendirme gerekiyor. Acil serviste
            hastaların önceliği girişte belirlenir ve en öncelikli hastalar bekletilmeden
            içeri alınır.
      UNKNOWN:
        ask_one_tr:
          tr: "Şu anda hastanede misiniz?"
        on_yes: ON_SITE
        on_no: REMOTE
        on_no_answer: REMOTE

  - id: rf.dyspnoea_rest
    label_tr: "İstirahatte nefes darlığı"
    when: 'TODO: the rf.dyspnoea_rest trigger requires clinical sign-off'
    tense: ever
    tense_anchor: onset_date
    level: YESIL
    route: EXPEDITE
    notify_clinic: never
    status: draft_needs_source
    source_gap: >-
      Unsupplied by any clinician: the trigger, the EK-4 acuity level, the route, the
      delivery register and the action scripts for REMOTE, ON_SITE and UNKNOWN.
      04 §3's plain-language condition is "breathlessness at rest or speaking in short
      sentences". 04 §8.1 rule 1 forbids a respiratory-rate count as a trigger, so the
      layperson-answerable form has to be authored rather than derived.
      Owner: physician of record (HB-C1, HB-C2, HB-C7).
      INT-619 (CD-110): still draft. EK-4 prints serious breathlessness in Kırmızı
      Kategori 2 only through accessory-muscle use or a pulse-oximetry value below
      ninety per cent, both observed by staff, and no committed source states the
      layperson form (breathless at rest, unable to finish a sentence) for every
      cause; asthma grading is condition-specific. The trigger itself is what is
      owed.

  - id: rf.anaphylaxis
    label_tr: "Anafilaksi düşündüren tablo"
    # INT-619, CD-111 (D18: agent-sourced, simulated patients only; a licensed
    # physician signs before any real patient, HB-C1). Action copy: the CD-24
    # generic RED script, with 112 spelled out because a chain pack's scripts carry
