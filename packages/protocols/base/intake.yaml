    when: "red_flags.rf_anaphylaxis == true"
    tense: ever
    tense_anchor: red_flags.rf_anaphylaxis_onset
    level: KIRMIZI_K2
    route: EMERGENCY_NOW
    register: ALERT
    distress_sensitive: false
    notify_clinic: always
    status: active
    source:
      guideline_id: TR-EK4-2022
      guideline_title: >-
        Yataklı Sağlık Tesislerinde Acil Servis Hizmetlerinin Uygulama Usul ve Esasları
        Hakkında Tebliğ, EK-4
      version_or_date: "RG 13/9/2022 s. 31952 (amended RG 13/5/2023 s. 32189; RG 11/10/2024 s. 32689)"
      url: "https://www.resmigazete.gov.tr/eskiler/2022/09/20220913-5-1.pdf"
      retrieved_on: 2026-10-02
      quote: "Şiddetli stridor veya yutkunma güçlüğü ile beraber olan havayolu tıkanıklığı riski"
      quote_snapshot: packages/protocols/sources/TR-EK4-2022.txt
      note: >-
        CD-111. Trigger: RCUK 2021 §3 ("exposed to a trigger (allergen) develops a sudden
        illness") and §3.2 Airway problems ("throat and tongue swelling causing
        difficulty in breathing/swallowing"), snapshot RCUK-ANAPHYLAXIS-2021. Level: the
        EK-4 Kırmızı Kategori 2 line that names swallowing difficulty with airway
        obstruction risk; EK-4's Kategori 1 line "Havayolu tıkanıklığı riski" is the
        reading a physician may prefer, and raising K2 to K1 is a tightening the
        physician can make. Do-not and ON_SITE branch: RCUK §4.4.
    action:
      REMOTE:
        primary: CALL_112
        show_112: true
        action_tr:
          tr: "Hemen yüz on iki Acil Çağrı Merkezi'ni arayın."
        do_nots_tr:
          tr:
            - "Randevuyu beklemeyin."
            - "Ayağa kalkmayın ve yürümeyin."
        why_tr:
          tr: >-
            Verilen cevaplara göre beklemeden değerlendirme gerekiyor. Yüz on iki
            ambulansıyla getirilen hastalar, acil serviste ayrıca öncelik sırası için
            bekletilmez.
      ON_SITE:
        primary: STAY_IN_PLACE_STAFF_NOTIFIED
        show_112: false
        notify_staff_immediate: true
        action_tr:
          tr: "**Olduğunuz yerde kalın.** Görevlilere haber verildi. Yanınızdaki birinden hemen bir görevli çağırmasını isteyin."
        do_nots_tr:
          tr:
            - "Ayağa kalkmayın ve yürümeyin."
        why_tr:
          tr: >-
            Verilen cevaplara göre beklemeden değerlendirme gerekiyor. Bu durumda ayağa
            kalkmak ya da yürümek tehlikeli olabilir.
        note: >-
          CD-111: RCUK 2021 §4.4, "Patients must not walk or stand during acute
          reactions", so the ON_SITE branch keeps the patient where they are and the
          staff notification (notify_staff_immediate) brings help, rather than sending
          them on foot to the acil servis as the generic ON_SITE copy does.
      UNKNOWN:
        ask_one_tr:
          tr: "Şu anda hastanede misiniz?"
        on_yes: ON_SITE
        on_no: REMOTE
        on_no_answer: REMOTE

