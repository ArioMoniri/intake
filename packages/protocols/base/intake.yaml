  - id: rf.pregnancy_bleeding_pain
    label_tr: "Gebelikte kanama veya şiddetli ağrı"
    when: 'TODO: the rf.pregnancy_bleeding_pain trigger requires clinical sign-off'
    tense: ever
    tense_anchor: onset_date
    level: YESIL
    route: EXPEDITE
    notify_clinic: never
    status: draft_needs_source
    source_gap: >-
      Unsupplied by any clinician: the trigger, the EK-4 acuity level, the route, the
      delivery register and the action scripts for REMOTE, ON_SITE and UNKNOWN. The
      whole pregnancy rule set is absent (HB-C4) and needs obstetric input, not a
      general physician's signature. The base slots pregnancy_status and lmp_date now
      exist to gate it (HB-C6).
      Owner: clinician with obstetric input, then physician of record (HB-C1, HB-C4).
      INT-619 (CD-116): still draft. The one committed obstetric source, NICE NG126,
      covers early pregnancy only, and its A&E criterion ("significant concern about
      the degree of pain or bleeding") is a clinician's judgement, not a
      layperson-answerable trigger; EK-4 has no pregnancy line. HB-C4 stays open.

  - id: rf.fever_high_persistent
    label_tr: "Bağışıklığı baskılayan tedavi alan hastada ateş"
    # INT-619, CD-117 (D18; HB-C1). The sourced arm of the 04 §3 row only: fever in a
    # patient on immunosuppressive treatment. The general persistence arm ("≥ 39 °C
    # > 3 d") is not written, because no committed source states it for an adult;
    # adding it later as a disjunct is a tightening (invariant 7).
    when: "red_flags.fever_now == true && pmh_fh_sh.immunosuppression == 'evet'"
    tense: ever
    tense_anchor: red_flags.fever_onset
    level: SARI_K1
    route: SAME_DAY_ACIL
    notify_clinic: always
    status: active
    source:
      guideline_id: TR-EK4-2022
      guideline_title: >-
        Yataklı Sağlık Tesislerinde Acil Servis Hizmetlerinin Uygulama Usul ve Esasları
        Hakkında Tebliğ, EK-4
      version_or_date: "RG 13/9/2022 s. 31952 (amended RG 13/5/2023 s. 32189; RG 11/10/2024 s. 32689)"
      url: "https://www.resmigazete.gov.tr/eskiler/2022/09/20220913-5-1.pdf"
      retrieved_on: 2026-10-02
      quote: "Ateş yüksekliği olan onkoloji hastası veya steroid kullanan hasta"
      quote_snapshot: packages/protocols/sources/TR-EK4-2022.txt
      note: >-
        CD-117. EK-4 Sarı Kategori 1 names fever in an oncology patient or a patient on
        steroids, with no temperature. The pack's immunosuppression slot answers "evet"
        for chemotherapy, a biologic, cortisone or a transplant (its follow_up_tr), so
        the gate is wider than EK-4's two groups, which is the over-including direction.
        A SARI rule carries no action script (the engine renders one for KIRMIZI only),
        so the same-day route reaches the clinic, not the patient's screen.

  - id: rf.weight_loss_unintentional
    label_tr: "İstemsiz kilo kaybı"
    # INT-619, CD-118 (D18; HB-C1).
    when: "red_flags.rf_weight_loss_unintentional == true && red_flags.age_sixty_or_over == true"
    tense: ever
    tense_anchor: hpi.onset_date
    level: SARI_K2
    route: EXPEDITE
    notify_clinic: always
    status: active
    source:
      guideline_id: NICE-NG12
      guideline_title: "Suspected cancer: recognition and referral"
      version_or_date: "NICE guideline NG12; published 23 June 2015; last updated 15 April 2026"
      url: "https://www.nice.org.uk/guidance/ng12/chapter/Recommendations-organised-by-site-of-cancer"
      retrieved_on: 2026-10-03
      quote: "For people aged 60 and over with unexplained weight loss (greater than 5% mean weight loss within a 6-month period)"
      quote_snapshot: packages/protocols/sources/NICE-NG12.txt
      note: >-
        CD-118. NG12 1.13.2 (amended April 2026) states the age bound, the five per cent
        and the six months; the probe carries all three as words. NG12's
        "unexplained" means not explained after a primary-care assessment, which a
        patient cannot report; the probe asks for loss without trying, which is the
        pack's proxy. The level is EK-4 Sarı Kategori 2 ("Orta ve uzamış dönem
        belirtileri olan ve ciddiyet potansiyeli taşıyan durumlar"), the pack's
        mapping of NG12's urgent investigation onto the five-level scale; route
        EXPEDITE keeps the appointment. The tense anchor is the complaint's onset
        date, the dated slot every session asks: the six-month window is in the
        probe itself.

  - id: rf.new_neuro_deficit_subacute
    label_tr: "Günler içinde ilerleyen nörolojik bulgu"
    when: 'TODO: the rf.new_neuro_deficit_subacute trigger requires clinical sign-off'
    tense: ever
    tense_anchor: onset_date
    level: YESIL
    route: EXPEDITE
    notify_clinic: never
    status: draft_needs_source
    source_gap: >-
      Unsupplied by any clinician: the trigger, the EK-4 acuity level, the route, the
      delivery register and the action scripts for REMOTE, ON_SITE and UNKNOWN.
      04 §3's plain-language condition is "progressive weakness/numbness over days", and
      how it is separated from rf.stroke_fast is part of the same judgment — the
      separation is a tense boundary, and 04 §8.1 rule 4 requires a genuinely different
      action script per tense.
      Owner: physician of record (HB-C1, HB-C2, HB-C7).
      INT-619 (CD-119): still draft. No committed source states the urgency of
      weakness or numbness progressing over days; CG150's "new-onset neurological
      deficit" is a headache feature, and EK-4's "Akut hemiparazi/disfazi" is the
      acute arm rf.stroke_fast already carries.

  - id: rf.suicidal_ideation_passive
    label_tr: "Pasif intihar düşüncesi"
    when: 'TODO: the rf.suicidal_ideation_passive trigger requires clinical sign-off'
    tense: ever
    tense_anchor: onset_date
    level: YESIL
    route: EXPEDITE
    notify_clinic: never
    status: draft_needs_source
    source_gap: >-
      Unsupplied by any clinician: the trigger, the EK-4 acuity level, the route, the
      delivery register and the action scripts for REMOTE, ON_SITE and UNKNOWN.
      04 §3 states the trigger as a PHQ-9 item-nine score with C-SSRS negative for plan,
      and C-SSRS is licence-BLOCKED (HB-L2), so the trigger cannot be written in those
      terms. 04 §4.2 records the structural problem underneath it: the cascade puts the
      suicide gate behind two thresholds, so passive ideation in someone scoring low on
      PHQ-2 is never asked about — which is a design question for the clinician, not a
      wording one. The escalation policy is still missing (HB-C8).
      Owner: physician of record plus counsel (HB-C1, HB-C8, HB-L2).
      INT-619 (CD-120): kept blocked, not written. Its trigger is a PHQ-9 item with
      a C-SSRS negative, and C-SSRS is licence-BLOCKED (HB-L2); the escalation
      policy does not exist (HB-C8).
