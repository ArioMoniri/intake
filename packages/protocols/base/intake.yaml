      rf_thunderclap_headache:
        # INT-619 (CD-115): NICE CG150 1.1.1 'sudden-onset headache reaching maximum intensity
        # within 5 minutes', with EK-4 Kırmızı Kategori 2 'Herhangi bir nedenle olan
        # ciddi ağrı'. Present tense, as the EK-4 line describes pain now.
        type: boolean
        required: false
        must_ask: false
        openehr_deferred_reason: >-
          the trigger is agent-sourced under D18 (CD-115) and unsigned (HB-C1), so which
          archetype hosts this probe is a modelling decision for INT-032; a binding
          chosen now would have to be re-chosen.
        ask_tr:
          tr: "Şu anda, birden başlayıp en fazla beş dakika içinde en ağır hâline ulaşan çok şiddetli bir baş ağrınız var mı?"
        follow_up_tr:
