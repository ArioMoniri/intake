# L1 — QUESTIONS authored; TRIAGE deferred. AI-assembled from guidelines in
# docs/evidence/proposals/asi.md, clinician-DIRECTED (Dr. A. Moniri), to be
# double-verified. Symptom-capture prompts only (inv 2/10) — not diagnosis, not
# triage. Acuity is EK-4 LAW (RG 13/9/2022) + physician of record (HB-C1); NOT
# fabricated. RED/life-threat stays in base.life_threat (inv 7).
kind: pack
id: specialty.asi
layer: specialty
version: 0.2.0
schema_version: 2
maturity: L1
status: questions-authored-guideline-sourced-clinician-directed; triage-deferred-HB-C1
language: tr
title_tr: Aşı ön görüşme protokolü
extends: cluster.allied_and_reports
visit_types:
- first
- followup
- preop
- report
- pregnancy_followup
- chronic_review
- post_discharge
- screening
- second_opinion
- teleconsult
sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugün hangi aşıyı yaptırmayı planlıyorsunuz? Kısaca yazabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Daha önce yaptırdığınız aşılarla ilgili bize iletmek istediğiniz bir konu var mı?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Daha önce bir aşı olduktan sonra ciddi bir alerjik tepki yaşadınız mı? Örneğin yüzde şişme ya da soluk almada zorluk.
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Yumurta, jelatin ya da bir ilaca karşı ciddi bir alerjiniz olduğu size söylendi mi?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Bugün kendinizi hasta hissediyor musunuz ya da ateşiniz var mı?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Bağışıklık sisteminizi zayıflatan bir rahatsızlığınız olduğu size söylendi mi?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Bağışıklık sisteminizi baskılayan bir tedavi görüyor musunuz? Örneğin yüksek doz kortizon ya da kemoterapi.
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Şu anda hamile misiniz ya da bebeğinizi emziriyor musunuz?
red_flags:
- id: rf.asi_l0_taslak
  label_tr: Aşı ön görüşme protokolü — branşa özgü kırmızı bayrak taslağı (klinik onay bekliyor)
  when: 'TODO: asi branch-specific red-flag trigger requires clinical sign-off'
  tense: ever
  tense_anchor: sikayet_suresi
  level: YESIL
  route: EXPEDITE
  notify_clinic: never
  status: draft_needs_source
  source_gap: 'Trigger, EK-4 level and route await clinical sign-off (invariant 17 pending-value literal). Guideline-sourced candidates recorded in docs/evidence/proposals/asi.md; acuity bound by EK-4 law (RG 13/9/2022 sayı 31952), snapshot absent. RED/life-threat stays in base.life_threat (invariant 7). Owner: physician of record (HB-C1, HB-C2, HB-C7).'
