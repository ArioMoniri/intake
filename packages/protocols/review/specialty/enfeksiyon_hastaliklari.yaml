kind: pack
id: specialty.enfeksiyon_hastaliklari
layer: specialty
version: 0.2.0
schema_version: 2
maturity: L1
status: questions-authored-guideline-sourced-clinician-directed; triage-deferred-HB-C1
language: tr
title_tr: Enfeksiyon Hastalıkları ön görüşme protokolü
extends: cluster.medical
visit_types:
- first
- followup
- preop
- report
- pregnancy_followup
- chronic_review
- post_discharge
- screening
- second_opinion
- teleconsult
sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugün sizi kliniğe getiren en önemli şikâyetinizi kendi cümlelerinizle kısaca anlatır mısınız?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zaman başladı? Yaklaşık olarak gün ya da hafta olarak söyleyebilir misiniz?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Ateşiniz oldu mu? Olduysa kaç gündür sürdüğünü ve çok yüksek hissedip hissetmediğinizi söyleyebilir misiniz?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Ateşle birlikte titreme, üşüme ya da kendinizi çok kötü, güçten düşmüş hissetme oldu mu?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda kendinizde ya da yakınlarınızın fark ettiği bir bilinç bulanıklığı, aşırı uyku hali veya kafa karışıklığı oldu mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Şiddetli baş ağrınızla birlikte boynunuzu öne eğmekte zorlanma ya da ense sertliği fark ettiniz mi?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Cildinizde, üzerine bardakla ya da parmakla bastırdığınızda solmayan (kaybolmayan) kırmızı veya mor döküntü fark ettiniz mi?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: İshaliniz var mı? Varsa dışkınızda gözle görülür kan fark ettiniz mi?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Geçmeyen ya da sık sık tekrarlayan kusmanız oluyor mu?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda yurt dışına ya da başka bir şehre seyahat ettiniz mi, veya benzer şikâyeti olan biriyle yakın temasınız oldu mu?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Bağışıklık sisteminizi etkileyen bir durumunuz ya da daha önce konulmuş süregen bir hastalık tanınız var mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Şu anda düzenli kullandığınız ilaçlar var mı? Son bir ay içinde antibiyotik kullandınız mı?
