# L1 — QUESTIONS authored; TRIAGE deferred. AI-assembled from guidelines in
# docs/evidence/proposals/cematem.md, clinician-DIRECTED (Dr. A. Moniri), to be
# double-verified. Symptom-capture prompts only (inv 2/10) — not diagnosis, not
# triage. Acuity is EK-4 LAW (RG 13/9/2022) + physician of record (HB-C1); NOT
# fabricated. RED/life-threat stays in base.life_threat (inv 7).
kind: pack
id: specialty.cematem
layer: specialty
version: 0.2.0
schema_version: 2
maturity: L1
status: questions-authored-guideline-sourced-clinician-directed; triage-deferred-HB-C1
language: tr
title_tr: ÇEMATEM ön görüşme protokolü
extends: cluster.mental_health
visit_types:
- first
- followup
- preop
- report
- pregnancy_followup
- chronic_review
- post_discharge
- screening
- second_opinion
- teleconsult
sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugün çocuğunuz için sizi buraya getiren konu nedir? Hangi konuda destek almak istersiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Fark ettiklerinizi kendi sözlerinizle, rahat hissettiğiniz kadar anlatabilir misiniz?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Bugün çocuğunuzla ilgili hangi madde ya da alışkanlık konusunda konuşmak istersiniz?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda çocuğunuzun evdeki, okuldaki ya da arkadaşlarıyla ilişkilerindeki bir değişikliği fark ettiniz mi?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Bildiğiniz kadarıyla, son zamanlarda bu ne sıklıkla oluyor?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Bu durumun çocuğunuzun günlük yaşamını ya da sağlığını etkilediğini düşündüğünüz, yardım almak istediğiniz bir yön var mı?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Okuldan ya da çevrenizden biri bu konuda size endişesini dile getirdi mi?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz daha önce bu konuda bir destek aldı mı, ya da bilmemizi istediğiniz başka bir sağlık durumu var mı?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun şu anda düzenli olarak kullandığı herhangi bir ilaç var mı?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun herhangi bir ilaca karşı alerjisi ya da daha önce yaşadığı ciddi bir yan etki oldu mu?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Bu görüşmeden ve önümüzdeki süreçten en çok ne elde etmeyi umuyorsunuz?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Bu süreçte size ve çocuğunuza destek olan kişiler var mı?
red_flags:
- id: rf.cematem_l0_taslak
  label_tr: ÇEMATEM ön görüşme protokolü — branşa özgü kırmızı bayrak taslağı (klinik onay bekliyor)
  when: 'TODO: cematem branch-specific red-flag trigger requires clinical sign-off'
  tense: ever
  tense_anchor: sikayet_suresi
  level: YESIL
  route: EXPEDITE
  notify_clinic: never
  status: draft_needs_source
  source_gap: 'Trigger, EK-4 level and route await clinical sign-off (invariant 17 pending-value literal). Guideline-sourced candidates recorded in docs/evidence/proposals/cematem.md; acuity bound by EK-4 law (RG 13/9/2022 sayı 31952), snapshot absent. RED/life-threat stays in base.life_threat (invariant 7). Owner: physician of record (HB-C1, HB-C2, HB-C7).'
