sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Çocuğunuzu bugün getiren temel konu nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu durum ne zaman başladı ve o günden bu yana nasıl bir seyir izledi?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Bebeğinizin doğduğunda yapılan topuk kanı taramasında herhangi bir hastalık şüphesi bildirildi mi?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Ailenizde kalıtsal bir metabolizma hastalığı öyküsü ya da anne-baba arasında akrabalık var mı?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz son zamanlarda sık sık kusuyor ya da beslenmeyi reddediyor mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz alışılmadık şekilde uykulu, halsiz ya da zor uyandırılır hâle geldi mi?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Bu belirtiler çocuğunuz hastalandığında, ateşlendiğinde ya da uzun süre aç kaldığında ortaya çıkıyor veya artıyor mu?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz daha önce yapabildiği şeyleri (oturma, yürüme, konuşma gibi) yapmakta zorlanmaya başladı ya da gelişimi yavaşladı mı?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun daha önce konmuş bir metabolizma hastalığı tanısı var mı?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz özel bir diyet ya da özel bir mama (metabolik formül) kullanıyor mu?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun düzenli kullandığı ilaç ya da takviye (örneğin vitamin veya karnitin) var mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun bilinen bir ilaç alerjisi ya da ilaca karşı gelişmiş bir tepkisi var mı?
