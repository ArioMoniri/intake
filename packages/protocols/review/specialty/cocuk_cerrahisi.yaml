sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Çocuğunuzu bugün getiren temel şikâyet nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu şikâyet ne zaman başladı ve o günden bu yana nasıl bir seyir izledi?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun karın ağrısı oluyor mu?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Karın ağrısı zaman zaman gelip geçiyor ve bu sırada çocuğunuz soluyor ya da huzursuzlanıyor mu?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz son zamanlarda kustu mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Kusmuğun rengi yeşil ya da koyu sarı-yeşil (safra gibi) miydi?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun dışkısında kan ya da reçel kıvamında koyu kırmızı bir görünüm fark ettiniz mi?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun testis ya da kasık bölgesinde aniden başlayan şiddetli bir ağrı oldu mu?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun kasığında ya da testis torbasında şişlik veya elle içeri gitmeyen bir sertlik fark ettiniz mi?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuza daha önce cerrahi bir tanı kondu mu? Örneğin inmemiş testis, kasık fıtığı ya da başka bir durum.
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun düzenli kullandığı ilaçlar var mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun bilinen bir ilaç alerjisi ya da ilaca karşı gelişmiş bir tepkisi var mı?
