sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugünkü görüşmede çocuğunuzla ilgili sizi en çok düşündüren konu nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu şikâyet ne zaman başladı ve o günden bu yana nasıl bir seyir izledi?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz son bir yıl içinde dört ya da daha fazla kez kulak enfeksiyonu geçirdi mi?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz son bir yıl içinde iki ya da daha fazla kez zatürre (akciğer enfeksiyonu) ya da ağır sinüzit geçirdi mi?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun enfeksiyonları, uzun süreli ya da damardan verilen antibiyotiklere rağmen zor mu geçiyor?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzda kilo alamama ya da beklenen şekilde büyüyememe, ya da ağızda geçmeyen pamukçuk veya tekrarlayan cilt apseleri fark ettiniz mi?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzda belirli bir yiyeceği yedikten kısa süre sonra döküntü, kaşıntı ya da dudak-yüz şişmesi gibi tepkiler oldu mu?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzda daha önce nefes darlığı, yaygın döküntü ya da baygınlıkla giden ağır bir alerjik tepki oldu mu?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun uzak durması gereken, bilinen bir besin, ilaç ya da arı sokması alerjisi var mı?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Ailenizde bağışıklık sistemiyle ilgili kalıtsal bir hastalık tanısı alan biri oldu mu?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuza daha önce bir adrenalin oto-enjektör (örneğin kalem şeklinde acil iğne) reçete edildi mi ve yanında bulunduruyor mu?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun şu anda düzenli olarak kullandığı ilaçlar var mı?
