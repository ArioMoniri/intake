        type: string
        required: false
        ask_tr:
          tr: Görüşmeden önce doktorun bilmesini istediğiniz bir şey var mı? Paylaşmak istemiyorsanız bu bölümü boş bırakabilirsiniz.
      soru_2:
        type: string
        required: false
        ask_tr:
