      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Randevuya sizinle birlikte gelmesini istediğiniz, güvendiğiniz biri var mı?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Boynunuza baskı uygulanan bir olaydan sonra ses kısıklığı ya da yutkunmada zorlanma fark ettiniz mi?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Doktorun bilmesi gereken, süregelen bir hastalığınız var mı?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Şu anda düzenli olarak kullandığınız ilaçlar var mı?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Herhangi bir ilaca ya da maddeye karşı alerjiniz olduğunu biliyor musunuz?
