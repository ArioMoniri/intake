sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Çocuğunuzu bugün hekime getiren en önemli konu nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun bir ya da birden fazla ekleminde şişlik fark ettiniz mi?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Bu eklem şişliği ne zamandır sürüyor? Birkaç gün mü, yoksa uzun süredir mi devam ediyor?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz sabahları ya da uzun süre hareketsiz kaldıktan sonra eklemlerinde tutukluk veya ağrı yaşıyor mu?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz günlük hareketlerinde, örneğin yürürken, giyinirken ya da oyun oynarken zorlanıyor mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz aksıyor, ayağına basmaktan kaçınıyor ya da bir kolunu veya bacağını kullanmak istemiyor mu?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun ağrısı geceleri onu uyandırıyor mu ya da ağrı kesiciye rağmen geçmiyor mu?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun eklem şikâyetleriyle birlikte uzun süredir devam eden ya da tekrarlayan ateşi oldu mu?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Şu sıralarda çocuğunuzun bir eklemi aniden çok ağrılı, sıcak ve kızarık hâle gelip hareket ettiremediğiniz bir durum oldu mu?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzda son zamanlarda kilo kaybı, iştahsızlık, solukluk ya da alışılmadık bir hâlsizlik fark ettiniz mi?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun eklem şikâyetleriyle birlikte ciltte döküntü ortaya çıktı mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuza daha önce romatizmal ya da bağışıklık sistemiyle ilgili bir hastalık tanısı kondu mu?
