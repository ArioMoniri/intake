kind: pack
id: specialty.cocuk_romatolojisi
layer: specialty
version: 0.2.0
schema_version: 2
maturity: L1
status: questions-authored-guideline-sourced-clinician-directed; triage-deferred-HB-C1
language: tr
title_tr: Çocuk Romatolojisi ön görüşme protokolü
extends: cluster.child_health
