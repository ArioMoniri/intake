sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugünkü görüşmede sizi en çok rahatsız eden konu nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zaman başladı ve o günden bu yana nasıl bir seyir izledi?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Son günlerde ateşiniz oldu mu?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Son aylarda, beslenmenizde bir değişiklik olmadığı hâlde, istemeden kilo verdiniz mi?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Öksürürken balgamınızda ya da tükürüğünüzde kan fark ettiniz mi?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Yemek ya da içecekleri yutarken takılma veya zorlanma yaşıyor musunuz?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Dışkınızda ya da tuvalete gittikten sonra kan fark ettiniz mi?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Vücudunuzun herhangi bir yerinde, sebebini bilmediğiniz yeni bir şişlik ya da ele gelen bir kitle fark ettiniz mi?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Adet dönemleriniz tamamen sona erdikten sonra herhangi bir kanamanız oldu mu?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Daha önce doktorunuzun koyduğu, süregelen bir hastalığınız var mı? Örneğin şeker hastalığı ya da yüksek tansiyon.
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Şu anda düzenli olarak kullandığınız ilaçlar var mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Herhangi bir ilaca ya da maddeye karşı alerjiniz olduğunu biliyor musunuz?
