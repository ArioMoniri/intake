sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugünkü randevunuzda sizi hekime getiren asıl şikâyetiniz nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu şikâyetiniz nasıl başladı ve o zamandan bu yana nasıl seyretti? Biraz anlatır mısınız?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Yüzünüzde ya da ağız tabanınızda şişlikle birlikte nefes almakta veya yutkunmakta zorlanıyor musunuz?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Yüzünüzdeki ya da çenenizdeki şişliğe ateş de eşlik ediyor mu?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Ağzınızı açmakta son zamanlarda zorlanıyor musunuz ya da eskisi kadar açamıyor musunuz?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Ağzınızda ya da dudağınızda üç haftadan uzun süredir iyileşmeyen bir yara var mı?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Ağzınızda, dudağınızda ya da boynunuzda geçmeyen bir şişlik veya kitle fark ettiniz mi?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Ağzınızın içinde geçmeyen kırmızı ya da kırmızı-beyaz bir leke fark ettiniz mi?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Kanı sulandıran (pıhtılaşmayı önleyen) bir ilaç kullanıyor musunuz? Örneğin aspirin, varfarin ya da benzeri bir ilaç.
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Daha önce bir diş çekimi ya da yaralanma sonrasında olağandan uzun süre kanamanız oldu mu?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Kemik erimesi ya da başka bir durum için kemikle ilgili iğne veya hap şeklinde bir ilaç kullanıyor musunuz ya da yakın zamanda kullandınız mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Herhangi bir ilaca, uyuşturucu (lokal anestezi) iğnesine ya da lateks gibi bir maddeye karşı alerjiniz var mı?
