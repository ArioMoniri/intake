sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugün sizi kliniğe getiren en önemli şikâyetinizi kendi cümlelerinizle kısaca anlatır mısınız?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zaman başladı? Yaklaşık olarak gün ya da hafta olarak söyleyebilir misiniz?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Karnınızda şiddetli ya da geçmeyen bir ağrı var mı? Varsa dokunmakla arttığını fark ediyor musunuz?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Hiç kan kustuğunuz ya da dışkınızın siyah, katran gibi olduğunu fark ettiğiniz oldu mu?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Dışkınızda ya da tuvalet kâğıdında kırmızı renkte kan gördünüz mü?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Yiyecekleri veya sıvıları yutarken takılma ya da güçlük yaşıyor musunuz?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda, özellikle çabalamadığınız hâlde kilo verdiğinizi fark ettiniz mi?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Cildinizde ya da gözlerinizin akında sararma fark ettiniz mi?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda tuvalete çıkma düzeninizde (örneğin ishal ya da kabızlık yönünde) bir değişiklik oldu mu?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Geçmeyen kusmayla birlikte gaz ve dışkı çıkışınızın durduğunu ya da karnınızda şişkinlik olduğunu fark ettiniz mi?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Daha önce mideniz, bağırsağınız veya karaciğerinizle ilgili bir tanı aldınız mı ya da karın bölgenizden ameliyat oldunuz mu?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Şu anda düzenli kullandığınız ilaçlar var mı? Özellikle ağrı kesici (romatizma ilacı) veya kan sulandırıcı kullanıyor musunuz?
