sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugünkü görüşmede sizi hekime getiren en önemli konu nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu durumu ilk ne zaman ve nasıl fark ettiğinizi kendi sözlerinizle anlatabilir misiniz?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Vücudunuzun herhangi bir yerinde yeni fark ettiğiniz bir şişlik ya da elle hissedilen bir sertlik oldu mu?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda istemediğiniz hâlde kilo verdiğinizi fark ettiniz mi?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda beklenmedik bir kanama fark ettiniz mi? Örneğin dışkıda, idrarda ya da başka bir şekilde.
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Yemek ya da içecekleri yutarken güçlük yaşıyor musunuz?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Bağırsak ya da idrar alışkanlığınızda son zamanlarda geçmeyen bir değişiklik oldu mu?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Geçmeyen ya da giderek artan bir ağrınız var mı?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Daha önce bir kanser tanısı aldınız mı ya da bununla ilgili bir ameliyat, ışın ya da ilaç tedavisi gördünüz mü?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Şu anda düzenli olarak kullandığınız ilaçlar var mı? Kan sulandırıcı bir ilaç kullanıyorsanız da belirtebilir misiniz?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Herhangi bir ilaca ya da maddeye karşı alerjiniz veya daha önce yaşadığınız ciddi bir yan etkiniz var mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Ailenizde kanser tanısı almış yakın akrabalarınız var mı?
