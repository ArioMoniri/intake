sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugün sizi doktora getiren en önemli şikâyetiniz nedir?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu şikâyetiniz başladığından beri zamanla nasıl bir değişim gösterdi?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Son aylarda diyet yapmadan kilo verdiğinizi fark ettiniz mi?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda nedenini bilmediğiniz bir ateşiniz oldu mu?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Geceleri sizi uyandıracak kadar çok terlediğiniz oldu mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Uzun süredir devam eden bir yorgunluk ya da halsizlik hissediyor musunuz?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Dışkınızda kan ya da dışkılamadan sonra kan geldiğini fark ettiniz mi?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Yemek yerken lokmanın boğazınızda ya da göğsünüzde takıldığını hissediyor musunuz?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda aşırı susama ya da çok sık idrara çıkma fark ettiniz mi?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Doktorunuzun daha önce söylediği uzun süreli bir rahatsızlığınız var mı? Örneğin şeker hastalığı, yüksek tansiyon ya da böbrek rahatsızlığı.
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Şu anda düzenli olarak kullandığınız ilaçlar var mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Herhangi bir ilaca karşı alerjiniz ya da kötü bir tepkiniz oldu mu?
