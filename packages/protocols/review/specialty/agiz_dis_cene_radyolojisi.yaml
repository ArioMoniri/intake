sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugünkü görüntüleme randevunuza sizi yönlendiren asıl sebep nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Hangi bölgenizle ilgili bir şikâyetiniz olduğu için görüntüleme isteniyor? Biraz anlatır mısınız?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır sürüyor? Yaklaşık olarak gün ya da hafta olarak söyleyebilir misiniz?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Şu anda hamile olma ihtimaliniz var mı? Bunu, görüntüleme sırasında size uygun ek korumanın uygulanabilmesi için soruyoruz.
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda başka bir yerde ağzınızın, dişlerinizin ya da çenenizin filmi çekildi mi?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Ağzınızda ya da dudağınızda üç haftadan uzun süredir iyileşmeyen bir yara var mı?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Ağzınızda, çenenizde ya da boynunuzda elinize gelen bir şişlik veya kitle fark ettiniz mi?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Ağzınızın içinde geçmeyen kırmızı ya da kırmızı-beyaz bir leke fark ettiniz mi?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Yüzünüzdeki ya da çenenizdeki şişlikle birlikte nefes almakta veya yutkunmakta zorlanıyor musunuz?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Kemik erimesi ya da kemikle ilgili başka bir durum için iğne veya hap şeklinde düzenli bir ilaç kullanıyor musunuz?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda yüzünüze ya da çenenize bir darbe veya yaralanma oldu mu?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Herhangi bir ilaca ya da görüntülemede kullanılan bir maddeye karşı alerjiniz ya da daha önce yaşadığınız bir tepki oldu mu?
