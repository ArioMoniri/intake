sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Çocuğunuzu bugün getiren temel konu nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu durum ne zaman başladı ve o günden bu yana nasıl bir seyir izledi?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz son zamanlarda her zamankinden daha sık ve daha bol idrara çıkıyor ya da yeniden altını ıslatmaya başladı mı?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz alışılmadık şekilde çok su içiyor ya da sürekli susuyor mu?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz iyi beslenmesine rağmen son zamanlarda kilo kaybetti ya da zayıfladı mı?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz son zamanlarda alışılmadık şekilde yorgun ya da halsiz mi?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Bu belirtilere bulantı, kusma ya da karın ağrısı da eşlik ediyor mu?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun böbrek üstü bezi yetmezliği gibi bir tanısı ya da düzenli kullandığı bir kortizon (hidrokortizon) tedavisi var mı?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Böyle bir tanısı varsa; şu anda kusuyor, ilacını alamıyor ya da belirgin şekilde halsiz mi?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun boyu, büyümesi ya da ergenlik gelişimi yaşıtlarına göre sizi endişelendiriyor mu?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun düzenli kullandığı ilaçlar (örneğin insülin ya da kortizon) var mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun bilinen bir ilaç alerjisi ya da ilaca karşı gelişmiş bir tepkisi var mı?
