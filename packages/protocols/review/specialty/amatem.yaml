# L1 — QUESTIONS authored; TRIAGE deferred. AI-assembled from guidelines in
# docs/evidence/proposals/amatem.md (WHO ASSIST/AUDIT topics, NICE CG115 — supportive,
# non-judgemental), clinician-DIRECTED (Dr. A. Moniri), to be double-verified.
# Supportive, person-first symptom-capture prompts only (inv 2/10) — not diagnosis,
# not triage. Crisis/self-harm is NOT here — it stays in base.life_threat (inv 7).
# Acuity is EK-4 LAW + physician of record (HB-C1); NOT fabricated.
kind: pack
id: specialty.amatem
layer: specialty
version: 0.2.0
schema_version: 2
maturity: L1
status: questions-authored-guideline-sourced-clinician-directed; triage-deferred-HB-C1
language: tr
title_tr: AMATEM ön görüşme protokolü
extends: cluster.medical
visit_types:
- first
- followup
- report
- chronic_review
- post_discharge
- second_opinion
- teleconsult
sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugün burada olmanıza yol açan konu nedir? Hangi konuda destek almak istersiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu durumu ne zamandır yaşıyorsunuz? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Yaşadıklarınızı kendi sözlerinizle, rahat hissettiğiniz kadar anlatabilir misiniz?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Bugün hangi madde ya da alışkanlıkla ilgili konuşmak istersiniz?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Son üç ay içinde bunu ne sıklıkla kullandığınızı paylaşmak ister misiniz?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Bazen kullanmak için güçlü bir istek ya da dürtü hissediyor musunuz?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Bu durumun günlük yaşamınızı ya da sağlığınızı etkilediğini ve yardım almak istediğiniz bir yönü olduğunu düşünüyor musunuz?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Yakınlarınızdan biri bu konuda size endişesini dile getirdi mi?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Daha önce azaltmayı ya da bırakmayı denediniz mi? Denediyseniz size ne iyi geldi?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Bu görüşmeden ve önümüzdeki süreçten en çok ne elde etmeyi umuyorsunuz?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Daha önce bu konuda bir destek aldınız mı, ya da bilmemizi istediğiniz başka bir sağlık durumunuz var mı?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Şu anda düzenli olarak kullandığınız herhangi bir ilaç var mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Bu süreçte yanınızda olan, size destek olan kişiler var mı?
red_flags:
- id: rf.amatem_l0_taslak
  label_tr: AMATEM — branşa özgü kırmızı bayrak taslağı (klinik onay bekliyor)
  when: 'TODO: amatem branch-specific red-flag trigger requires clinical sign-off'
  tense: ever
  tense_anchor: sikayet_suresi
  level: YESIL
  route: EXPEDITE
  notify_clinic: never
  status: draft_needs_source
  source_gap: 'Trigger, EK-4 level and route await clinical sign-off (invariant 17). Crisis / self-harm is deliberately NOT modelled here — it belongs to base.life_threat (invariant 7; HB-L2). Supportive candidates recorded in docs/evidence/proposals/amatem.md; acuity bound by EK-4 law (RG 13/9/2022 sayı 31952), snapshot absent. Owner: physician of record (HB-C1, HB-C2, HB-C7).'
