sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugün çocuğunuz için sizi buraya getiren konu nedir? Hangi konuda destek almak istersiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Fark ettiklerinizi kendi sözlerinizle, rahat hissettiğiniz kadar anlatabilir misiniz?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda çocuğunuzun keyfinde ya da eskiden sevdiği şeylere ilgisinde bir değişiklik fark ettiniz mi?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz sık sık endişeli, kaygılı ya da korkulu göründüğü zamanlar oluyor mu?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun dikkatini toplamakta ya da hareketliliğinde zorlandığını hem evde hem de okulda fark ediyor musunuz?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun uyku düzeninde bir değişiklik var mı? Örneğin uykuya dalmakta güçlük ya da sık uyanma.
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Bu durumun çocuğunuzun okuldaki ya da günlük yaşamındaki işlerini etkilediğini düşünüyor musunuz?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun arkadaşlarıyla ya da ailesiyle ilişkilerinde son zamanlarda bir değişiklik oldu mu?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Bu değişiklikleri ilk ne zaman fark ettiniz ve o günden bu yana nasıl bir seyir izledi?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz daha önce bu konuda bir destek aldı mı, ya da bilmemizi istediğiniz başka bir sağlık ya da gelişim durumu var mı?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun şu anda düzenli olarak kullandığı herhangi bir ilaç var mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun herhangi bir ilaca karşı alerjisi ya da daha önce yaşadığı ciddi bir yan etki oldu mu?
