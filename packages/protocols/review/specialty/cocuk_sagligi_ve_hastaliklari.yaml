sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Çocuğunuzu bugün hekime getiren en önemli konu nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun ateşi var mı? Varsa yaklaşık ne zamandır sürüyor?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz her zamankinden daha uykulu, güç uyandırılan ya da size karşı tepkisiz mi görünüyor?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun nefesi çok hızlandı mı ya da nefes alırken göğsü içeri çekiliyor veya inler gibi bir ses çıkarıyor mu?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun cildinde, dudaklarında ya da dilinde solukluk, benekli bir görünüm veya morarma fark ettiniz mi?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun cildinde, üzerine bastırınca solmayan kırmızı ya da mor renkli döküntüler oldu mu?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun boynunu öne eğmekte zorlanması, bıngıldağının kabarması ya da havale geçirmesi gibi bir durum oldu mu?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz normalde olduğu kadar beslenip sıvı alıyor mu, bezini/tuvaletini her zamanki gibi ıslatıyor mu?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun bir kol ya da bacağında şişlik var mı, ya da bir uzvunu kullanmaktan/ona basmaktan kaçınıyor mu?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun bilinen süregelen bir hastalığı ya da daha önce konmuş önemli bir tanısı var mı?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz şu anda düzenli olarak kullandığı bir ilaç var mı?
