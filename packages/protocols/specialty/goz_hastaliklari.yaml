    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugün göz polikliniğine gelme nedeninizi kısaca anlatır mısınız?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Görmenizde son zamanlarda bir azalma ya da bulanıklık fark ettiniz mi?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Kısa sürüp geçse bile gözünüzde ani bir görme kaybı ya da kararma oldu mu?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Gözünüzün önünde uçuşan noktalar ya da benekler görüyor musunuz?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Gerçekte ışık yokken gözünüzde ışık çakması ya da şimşek gibi parlamalar görüyor musunuz?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Görüşünüzün bir kısmını perde ya da gölge kapatıyormuş gibi bir his oldu mu?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Gözünüzde ya da göz çevresinde ağrı var mı?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Gözünüzde ya da göz çevresindeki deride kızarıklık var mı?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Işıkların çevresinde renkli halkalar görüyor musunuz?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Nesneleri çift görüyor musunuz?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Kontakt lens kullanıyor musunuz?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Size daha önce şeker hastalığı tanısı konuldu mu?
