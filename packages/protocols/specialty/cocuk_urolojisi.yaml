sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Çocuğunuzu bugün getiren temel şikâyet nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu şikâyet ne zaman başladı ve o günden bu yana nasıl bir seyir izledi?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz idrar yaparken yanma, ağrı ya da rahatsızlık hissediyor mu?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: İdrar şikâyetleriyle birlikte çocuğunuzun ateşi de oluyor mu?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Gündüz vakti çocuğunuzda idrar kaçırma, ani sıkışma hissi ya da çok sık tuvalete gitme oluyor mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz gece uykusunda altını ıslatıyor mu?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun bağırsak alışkanlıklarında, örneğin kabızlık, bir sorun var mı?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun testis ya da kasık bölgesinde, bulantı veya kusmanın eşlik ettiği, aniden başlayan şiddetli bir ağrı oldu mu?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun testis torbasında şişlik ya da kızarıklık, veya torbada elle hissedemediğiniz bir testis fark ettiniz mi?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun idrarında kan ya da olağandışı bir renk fark ettiniz mi?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun düzenli olarak kullandığı ilaçlar var mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun bilinen bir ilaç alerjisi ya da ilaca karşı gelişmiş bir tepkisi var mı?
