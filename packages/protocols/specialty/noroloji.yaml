# L1 — QUESTIONS authored; TRIAGE deferred. Provenance (honest):
# Pre-visit QUESTIONS below are AI-assembled from guidelines (Türk Nöroloji
# Derneği "İnme" booklet; NICE NG128 stroke/TIA; NG228 SAH/thunderclap; NG217
# first seizure; SNNOOP10 — verbatim citations in docs/evidence/proposals/
# noroloji.md), clinician-DIRECTED by the physician of record (Dr. A. Moniri)
# under explicit in-session instruction, to be double-verified. Symptom-capture
# prompts only (invariant 2/10) — not diagnosis, not triage.
#
# TRIAGE IS NOT AUTHORED HERE and is NOT fabricated. IMPORTANT: the acute
# life-threats these questions touch (stroke/FAST, thunderclap headache,
# meningitis pattern, first seizure) are owned by base.life_threat, which is
# NOT extended here (invariant 7). Q3/Q4 (one-sided weakness, speech), Q5
# (thunderclap), Q6 (headache+fever), Q7 (seizure) supply INPUTS the existing
# base gates read; the RED determination stays in base.life_threat + the rules
# engine. Red-flag acuity is bound by EK-4 (RG 13/9/2022 sayı 31952) — binding
# Turkish LAW, no snapshot committed — and owned by the physician of record
# (HB-C1/C2/C7). The red_flags stub stays draft_needs_source (excluded, inv 17).
kind: pack
id: specialty.noroloji
layer: specialty
version: 0.2.0
schema_version: 2
maturity: L1
status: questions-authored-guideline-sourced-clinician-directed; triage-deferred-HB-C1
language: tr
title_tr: Nöroloji ön görüşme protokolü
extends: cluster.medical
visit_types:
- first
- followup
- preop
- report
- pregnancy_followup
- chronic_review
- post_discharge
- screening
- second_opinion
- teleconsult
sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugün nöroloji bölümüne gelme nedeninizi kendi cümlelerinizle kısaca anlatır mısınız?
      baslangic_sekli:
        type: string
        required: false
        ask_tr:
          tr: Sizi en çok rahatsız eden bu durum aniden mi yoksa zamanla yavaş yavaş mı başladı?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  norolojik_belirtiler:
    slots:
      tek_tarafli_gucsuzluk:
        type: boolean
        required: false
        ask_tr:
          tr: Yüzünüzün, kolunuzun veya bacağınızın tek tarafında güçsüzlük ya da uyuşma fark ettiniz mi?
      konusma_guclugu:
        type: boolean
        required: false
        ask_tr:
          tr: Son zamanlarda konuşurken ya da söylenenleri anlarken zorlandığınız oldu mu?
      ani_siddetli_bas_agrisi:
        type: boolean
        required: false
        ask_tr:
          tr: Saniyeler ya da birkaç dakika içinde en şiddetli hâline ulaşan, ani ve çok şiddetli bir baş ağrınız oldu mu?
      bas_agrisi_ates:
        type: boolean
        required: false
        ask_tr:
          tr: Baş ağrınıza ateş de eşlik ediyor mu?
      nobet_bilinc_kaybi:
        type: boolean
        required: false
        ask_tr:
          tr: Yakın zamanda bilincinizi kaybettiğiniz ya da vücudunuzda istemsiz kasılma-titreme olan bir atak yaşadınız mı?
      ani_gorme_kaybi:
        type: boolean
        required: false
        ask_tr:
          tr: Gözlerinizde ani görme kaybı veya çift görme oldu mu?
  ilac_ve_gecmis:
    slots:
      kullanilan_ilaclar:
        type: string
        required: false
        ask_tr:
          tr: Şu anda düzenli olarak kullandığınız ilaçlar var mı?
      norolojik_tani:
        type: string
        required: false
        ask_tr:
          tr: Daha önce bir doktor tarafından konmuş nörolojik bir hastalığınız var mı? Örneğin geçirilmiş inme veya sara hastalığı.
red_flags:
- id: rf.noroloji_l0_taslak
