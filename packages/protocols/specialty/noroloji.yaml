  when: 'TODO: noroloji branch-specific red-flag trigger requires clinical sign-off'
  tense: ever
  tense_anchor: sikayet_suresi
  level: YESIL
  route: EXPEDITE
  notify_clinic: never
  status: draft_needs_source
  source_gap: 'Rule set not yet authored: trigger, EK-4 level and route await clinical sign-off. The `when` field carries the sole permitted pending-value literal (CLAUDE.md invariant 17). The acute life-threats (stroke/FAST, thunderclap SAH, meningitis pattern, first seizure) belong to base.life_threat and are NOT authored here (invariant 7); this pack only supplies the intake questions that feed those base gates. Guideline-sourced candidates recorded in docs/evidence/proposals/noroloji.md; acuity is bound by EK-4 law (RG 13/9/2022 sayı 31952), no snapshot committed. Owner: physician of record (HB-C1, HB-C2, HB-C7).'
