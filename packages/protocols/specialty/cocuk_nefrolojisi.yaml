sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Çocuğunuzu bugün getiren temel konu nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu durum ne zaman başladı ve o günden bu yana nasıl bir seyir izledi?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun göz çevresinde, yüzünde, bacaklarında ya da karnında şişlik fark ettiniz mi?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun idrarının rengi koyulaştı, kırmızı-kahverengi bir renk aldı ya da içinde kan gördünüz mü?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz idrar yaparken yanma, ağrı ya da rahatsızlık hissettiğini söylüyor mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz her zamankinden daha sık idrara çıkıyor, yeniden altını ıslatmaya başladı ya da idrarını tutmakta zorlanıyor mu?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzda ateşle birlikte karın ya da yan (bel) ağrısı da var mı?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun idrar miktarı belirgin şekilde azaldı ya da neredeyse hiç idrar yapmıyor mu?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun daha önce böbrek ya da idrar yolu ile ilgili bir tanısı oldu mu? Örneğin idrar kaçağı (reflü), böbrekte genişleme ya da tekrarlayan idrar yolu enfeksiyonu.
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun düzenli kullandığı ilaçlar var mı?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun bilinen bir ilaç alerjisi ya da ilaca karşı gelişmiş bir tepkisi var mı?
