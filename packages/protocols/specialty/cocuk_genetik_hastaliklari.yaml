kind: pack
id: specialty.cocuk_genetik_hastaliklari
layer: specialty
version: 0.2.0
schema_version: 2
maturity: L1
status: questions-authored-guideline-sourced-clinician-directed; triage-deferred-HB-C1
language: tr
title_tr: Çocuk Genetik Hastalıkları ön görüşme protokolü
extends: cluster.child_health
visit_types:
- first
- followup
- preop
- report
- pregnancy_followup
- chronic_review
- post_discharge
- screening
- second_opinion
- teleconsult
sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Çocuğunuzun bugün genetik bölümüne yönlendirilmesinin sebebini kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz yaşıtlarına göre oturma, yürüme ya da konuşma gibi gelişim basamaklarında geride kaldı mı?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz daha önce yapabildiği bir beceriyi, örneğin yürümeyi ya da konuşmayı, sonradan kaybetti mi?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun yüz görünümünde ya da vücut yapısında size farklı gelen bir özellik fark ettiniz mi?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Ailenizde kalıtsal ya da genetik bir hastalık tanısı almış bir kişi var mı?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: 'Bu soruyu yalnızca sağlık değerlendirmesi için soruyorum: anne ile baba arasında akrabalık var mı?'
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Ailenizde tekrarlayan düşük, ölü doğum ya da bebeklik döneminde açıklanamayan bir kayıp yaşandı mı?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun yenidoğan döneminde yapılan topuk kanı taramasında şüpheli ya da anormal bir sonuç çıktı mı?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Şu sıralarda çocuğunuz alışılmadık şekilde halsiz ya da uykuya meyilli mi, ya da tekrarlayan kusma veya beslenememe var mı?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuza daha önce genetik bir test, örneğin kromozom ya da DNA testi, yapıldı mı?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz şu anda düzenli olarak kullandığı bir ilaç var mı?
