sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Çocuğunuzu bugün hekime getiren en önemli konu nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun öksürüğü var mı? Varsa yaklaşık ne zamandır sürüyor?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz öksürürken balgam ya da sümük çıkarıyor mu?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz nefes alıp verirken hırıltı ya da ıslık gibi bir ses çıkarıyor mu?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz oyun oynarken ya da koşarken yaşıtlarına göre daha çabuk yoruluyor veya nefesi daralıyor mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Şu sıralarda çocuğunuzun nefesi çok hızlandı mı ya da nefes alırken göğsü içeri çekiliyor, inler gibi bir ses çıkarıyor mu?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun dudaklarında ya da dilinde morarma fark ettiniz mi?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun nefesinin bir an durduğu ya da kesildiği oldu mu?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz sık sık zatürre ya da göğüs enfeksiyonu geçirdi mi?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz beslenirken öksürüyor ya da tıkanıyor mu?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuza daha önce astım ya da kistik fibrozis gibi bir solunum tanısı kondu mu?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz şu anda solunumu için düzenli kullandığı bir ilaç ya da nefes açıcı kullanıyor mu?
