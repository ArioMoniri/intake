sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugünkü görüşmede sizi en çok rahatsız eden konu nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu durum ne zaman başladı ve o günden bu yana nasıl bir seyir izledi?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda her zamankinden daha sık idrara çıkıyor ya da gece idrara kalkıyor musunuz?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Alışılmadık şekilde çok su içiyor ya da ağzınızda kuruluk hissediyor musunuz?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Beslenmenizde bir değişiklik olmadığı hâlde son zamanlarda kilo verdiniz mi?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda alışılmadık şekilde halsiz ya da çabuk yoruluyor musunuz?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Gözlerinizde son zamanlarda bulanık görme fark ettiniz mi?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Kan şekeriniz düştüğünde titreme, soğuk terleme, çarpıntı ya da ani açlık gibi belirtiler yaşıyor musunuz?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Bu belirtilere bulantı, kusma, karın ağrısı ya da derin ve hızlı nefes alma eşlik ediyor mu?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Daha önce şeker hastalığı (diyabet) tanısı aldınız mı? Aldıysanız ne zamandır takip ediliyorsunuz?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Şu anda şekeriniz için düzenli kullandığınız ilaçlar (örneğin insülin ya da ağızdan alınan haplar) var mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Bilinen bir ilaç alerjiniz ya da bir ilaca karşı gelişmiş bir tepkiniz var mı?
