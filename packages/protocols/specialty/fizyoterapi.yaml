# fabricated. RED/life-threat stays in base.life_threat (inv 7).
kind: pack
id: specialty.fizyoterapi
layer: specialty
version: 0.2.0
schema_version: 2
maturity: L1
status: questions-authored-guideline-sourced-clinician-directed; triage-deferred-HB-C1
language: tr
title_tr: Fizyoterapi ön görüşme protokolü
extends: cluster.allied_and_reports
visit_types:
- first
- followup
- preop
- report
- pregnancy_followup
- chronic_review
- post_discharge
- screening
- second_opinion
- teleconsult
sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugünkü görüşmede sizi fizik tedaviye getiren en önemli şikâyetiniz nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Ağrınız ya da rahatsızlığınız vücudunuzun en çok hangi bölgesinde ve ne zaman başladı?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Bu ağrı günlük hareketlerinizi (yürümek, oturmak, eğilmek gibi) etkiliyor mu?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Şikâyetiniz son zamanlarda değişti mi ya da daha önce olmayan yeni belirtiler eklendi mi?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Sırt ya da bel ağrınız geceleri sizi uykudan uyandırıyor mu veya dinlenince hiç geçmiyor mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Bu ağrı bir düşme, çarpma ya da kaza sonrasında mı başladı?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda bacaklarınızda ya da kollarınızda yeni bir güçsüzlük veya yürümekte zorlanma fark ettiniz mi?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: İdrarınızı yapmakta yeni bir zorluk, tutamama ya da makat–kalça bölgesinde uyuşma yaşadınız mı?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Sırt ya da bel ağrınızla birlikte ateşiniz de oluyor mu?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Sebebini bilmediğiniz kilo kaybı ya da kendinizi genel olarak halsiz hissetme durumunuz var mı?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Daha önce kas–iskelet sisteminizle ilgili bir tanı aldınız mı ya da ameliyat oldunuz mu?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Şu anda düzenli olarak kullandığınız ilaçlar var mı? Örneğin kan sulandırıcı ya da kortizon içeren ilaçlar.
