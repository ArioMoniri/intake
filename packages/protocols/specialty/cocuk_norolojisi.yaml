sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Çocuğunuzu bugün getiren temel konu nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu durum ne zaman başladı ve o günden bu yana nasıl bir seyir izledi?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz bilincini kaybettiği ya da vücudunda istemsiz kasılma-titreme olan bir atak (nöbet) geçirdi mi?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Bu nöbet sırasında çocuğunuzun ateşi de var mıydı?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun son zamanlarda yeni başlayan ya da giderek kötüleşen bir baş ağrısı oldu mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun baş ağrısına ateş de eşlik ediyor mu?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun yürüme, konuşma ya da diğer gelişim basamaklarında yaşıtlarına göre geriden geldiğini ya da önceden kazandığı bir beceriyi kaybettiğini fark ettiniz mi?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun daha önce konmuş nörolojik bir tanısı var mı? Örneğin epilepsi (sara) ya da serebral palsi.
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun düzenli kullandığı ilaçlar (örneğin nöbet ilacı) var mı?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun bilinen bir ilaç alerjisi ya da ilaca karşı gelişmiş bir tepkisi var mı?
