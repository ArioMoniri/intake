kind: pack
id: specialty.cocuk_gastroenterolojisi
layer: specialty
version: 0.2.0
schema_version: 2
maturity: L1
status: questions-authored-guideline-sourced-clinician-directed; triage-deferred-HB-C1
language: tr
title_tr: Çocuk Gastroenterolojisi ön görüşme protokolü
extends: cluster.child_health
visit_types:
- first
- followup
- preop
- report
- pregnancy_followup
- chronic_review
- post_discharge
- screening
- second_opinion
- teleconsult
sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugün çocuğunuzu kliniğe getiren en önemli sindirim şikâyetini kendi cümlelerinizle kısaca anlatır mısınız?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun bu şikâyeti ne zaman başladı? Yaklaşık olarak gün, hafta ya da ay olarak söyleyebilir misiniz?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun kusmuğunda yeşil ya da sarı-yeşil renk fark ettiniz mi?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun kustuğunda içinde kan ya da kahve telvesi gibi koyu bir madde gördünüz mü?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz iki aylıktan küçükse, beslendikten sonra giderek artan ya da fışkırır tarzda kuvvetli kusması oluyor mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun dışkısında ya da bezinde kırmızı kan veya siyah, katran gibi bir renk fark ettiniz mi?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun sık sık ve bol miktarda sulu ishali oluyor mu?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun ağzı kuru, gözleri çökük, ağladığında gözyaşı az ya da bezini her zamankinden daha az mı ıslatıyor?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz sık sık kusuyor ve ağızdan verdiğiniz sıvıları içinde tutamıyor mu?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz son zamanlarda beklendiği gibi kilo alamadı ya da kilo kaybetti mi?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz yenidoğan döneminde ilk kakasını (mekonyum) doğumdan sonraki ilk iki gün içinde çıkardı mı, yoksa gecikti mi? Kabızlığı yaşamının ilk haftalarında mı başladı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuza daha önce mide, bağırsak ya da karaciğerle ilgili bir hastalık tanısı konuldu mu? Şu anda düzenli kullandığı bir ilaç var mı?
