sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugünkü görüşmede sizi en çok rahatsız eden konu nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu durum ne zaman başladı ve o günden bu yana nasıl bir seyir izledi?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Beslenmenizde belirgin bir değişiklik olmadığı hâlde son zamanlarda kilo verdiniz ya da kilo aldınız mı?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda sıcağa ya da soğuğa karşı alışılmadık şekilde duyarlı hâle geldiniz mi?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Kalbinizin hızlı ya da düzensiz çarptığını fark ettiniz mi?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Ellerinizde ince bir titreme ya da alışılmadık bir gerginlik, huzursuzluk hissediyor musunuz?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda alışılmadık şekilde yorgun ya da halsiz mi hissediyorsunuz?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Boynunuzda bir şişlik ya da yutkunurken zorlanma, ses kısıklığı fark ettiniz mi?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Böbrek üstü bezi yetmezliği tanınız ya da düzenli kullandığınız bir kortizon (hidrokortizon) tedaviniz var mı; varsa şu anda kusuyor ya da belirgin şekilde halsiz misiniz?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Açlık hâlinde ya da öğün atladığınızda titreme, soğuk terleme, çarpıntı ya da zihinsel bulanıklık yaşıyor musunuz?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Şu anda düzenli kullandığınız ilaçlar (örneğin tiroid ilacı, kortizon ya da insülin) var mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Bilinen bir ilaç alerjiniz ya da bir ilaca karşı gelişmiş bir tepkiniz var mı?
