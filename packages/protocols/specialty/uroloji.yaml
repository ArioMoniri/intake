sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugün üroloji bölümüne gelme nedeninizi kendi cümlelerinizle kısaca anlatır mısınız?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: İdrarınızda gözle görülen kan ya da pembe-kırmızı bir renk fark ettiniz mi?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: İdrar yolu enfeksiyonu tedavisinden sonra idrarınızda kan yeniden görüldü mü?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: İdrar yaparken yanma ya da ağrı hissediyor musunuz?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: İdrarınızı yapmak istediğiniz hâlde hiç yapamadığınız bir durum oldu mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: İdrar akışınızın zayıfladığını ya da kesik kesik geldiğini fark ettiniz mi?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Gece idrar yapmak için uykunuzdan uyanmanız gerekiyor mu?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Aniden gelen ve bekletemediğiniz bir idrar yapma isteği oluyor mu?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Testislerinizde aniden başlayan şiddetli bir ağrı oldu mu?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Bu ağrıyla birlikte bulantı ya da kusma oldu mu?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Belinizin yan tarafında, kaburgalarınızın altında keskin bir ağrı oldu mu?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: İdrar şikâyetlerinizle birlikte ateşiniz oldu mu?
