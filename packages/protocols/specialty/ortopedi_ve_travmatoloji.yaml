sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugün ortopedi bölümüne gelme nedeninizi kendi cümlelerinizle kısaca anlatır mısınız?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Şikâyetiniz bir düşme, çarpma ya da kaza sonrasında mı başladı?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Yaralanan bölgede gözle görülür bir şekil bozukluğu fark ettiniz mi?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Yaralanan bölgeyi hareket ettirmekte ya da üzerine basmakta zorlanıyor musunuz?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Yaralanan bölgede şişlik ya da morarma oldu mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Kolunuzdaki ya da bacağınızdaki ağrı, yaralanmaya göre beklediğinizden çok daha şiddetli mi?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Kolunuzda, bacağınızda ya da parmaklarınızda yeni uyuşma, solukluk veya soğukluk var mı?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Eklemlerinizden birinde aniden başlayan şişlik, kızarıklık ve sıcaklık oldu mu?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Eklem şikâyetinizle birlikte ateş ya da belirgin halsizlik oldu mu?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: İç uyluklarınızda, genital bölgenizde ya da makat çevrenizde yeni uyuşma var mı?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Bel ya da bacak ağrınız başladıktan sonra idrar yapmakta yeni bir zorluk var mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Bacak ağrınız son günlerde her iki bacağınıza birden yayıldı mı?
