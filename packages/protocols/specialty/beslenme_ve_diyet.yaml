kind: pack
id: specialty.beslenme_ve_diyet
layer: specialty
version: 0.2.0
schema_version: 2
maturity: L1
status: questions-authored-guideline-sourced-clinician-directed; triage-deferred-HB-C1
language: tr
title_tr: Beslenme ve Diyet ön görüşme protokolü
extends: cluster.allied_and_reports
visit_types:
- first
- followup
- preop
- report
- pregnancy_followup
- chronic_review
- post_discharge
- screening
- second_opinion
- teleconsult
sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugün beslenme ve diyet bölümüne gelme nedeninizi kendi cümlelerinizle kısaca anlatır mısınız?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Beslenmenizle ilgili en çok değiştirmek istediğiniz şey nedir? Biraz anlatabilir misiniz?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Son aylarda, özellikle bunun için çaba göstermediğiniz hâlde kilo verdiniz mi? Örneğin giysileriniz size daha bol gelmeye başladı mı?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda iştahınızda azalma oldu mu ya da eskisine göre daha az mı yiyorsunuz?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Yemek yerken ya da sıvı içerken yutmakta zorlanıyor musunuz veya boğazınızda takılma hissi oluyor mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda yemenizi etkileyen bulantı, kusma, ishal ya da kabızlık gibi bir sorun yaşıyor musunuz?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Beslenmenizi etkileyebilecek, bir doktor tarafından konmuş bir hastalığınız var mı? Örneğin şeker hastalığı ya da böbrek rahatsızlığı.
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Şu anda düzenli olarak kullandığınız bir ilaç ya da takviye (vitamin, mineral veya bitkisel ürün) var mı?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Herhangi bir besine karşı alerjiniz ya da tahammülsüzlüğünüz var mı? Örneğin süt ya da gluten.
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Sağlık, inanç ya da tercih nedeniyle yemediğiniz besinler var mı? Kısaca anlatır mısınız?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Sıradan bir gününüzde genellikle neler yiyip içtiğinizi kısaca anlatabilir misiniz?
