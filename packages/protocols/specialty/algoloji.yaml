# L1 — QUESTIONS authored; TRIAGE deferred. AI-assembled from guidelines in
# docs/evidence/proposals/algoloji.md (NICE NG59, RCEMLearning, WHO cancer-pain),
# clinician-DIRECTED (Dr. A. Moniri), to be double-verified. Symptom-capture
# prompts only (inv 2/10) — not diagnosis, not triage. Acuity is EK-4 LAW + the
# physician of record (HB-C1); NOT fabricated. RED/life-threat (cauda equina,
# progressive deficit) stays in base.life_threat (inv 7) — only fed here.
kind: pack
id: specialty.algoloji
layer: specialty
version: 0.2.0
schema_version: 2
maturity: L1
status: questions-authored-guideline-sourced-clinician-directed; triage-deferred-HB-C1
language: tr
title_tr: Algoloji ön görüşme protokolü
extends: cluster.medical
visit_types:
- first
- followup
- report
- chronic_review
- post_discharge
- second_opinion
- teleconsult
sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugünkü görüşmede sizi en çok rahatsız eden ağrı nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Ağrınızın ne zaman ve nasıl başladığını kendi sözlerinizle anlatabilir misiniz?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Ağrıyı en çok vücudunuzun hangi bölgesinde hissediyorsunuz?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Bu ağrı ne kadar süredir devam ediyor ve gün içinde artıp azalıyor mu?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Ağrınız geceleri ya da dinlenirken de oluyor mu, uykunuzu bölüyor mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Son zamanlarda istemediğiniz halde kilo verdiniz mi ya da kendinizi genel olarak halsiz hissettiniz mi?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Son günlerde idrarınızı ya da bağırsağınızı kontrol etmekte zorluk yaşadınız mı, ya da oturduğunuz bölgede uyuşma fark ettiniz mi?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Bacaklarınızda giderek artan güçsüzlük ya da uyuşma hissediyor musunuz?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Ağrınız günlük işlerinizi, çalışmanızı ya da uykunuzu ne ölçüde etkiliyor?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Daha önce kanser ya da başka önemli bir hastalık tanısı aldınız mı?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Şu anda ağrınız için düzenli olarak kullandığınız ilaç var mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Herhangi bir ilaca karşı alerjiniz ya da daha önce yaşadığınız kötü bir ilaç tepkiniz oldu mu?
red_flags:
- id: rf.algoloji_l0_taslak
  label_tr: Algoloji — branşa özgü kırmızı bayrak taslağı (klinik onay bekliyor)
  when: 'TODO: algoloji branch-specific red-flag trigger requires clinical sign-off'
  tense: ever
  tense_anchor: sikayet_suresi
  level: YESIL
  route: EXPEDITE
  notify_clinic: never
  status: draft_needs_source
  source_gap: 'Trigger, EK-4 level and route await clinical sign-off (invariant 17 pending-value literal). Guideline-sourced candidates (cauda equina, progressive leg weakness, weight loss — NICE NG59) recorded in docs/evidence/proposals/algoloji.md; acuity bound by EK-4 law (RG 13/9/2022 sayı 31952), snapshot absent. RED/life-threat stays in base.life_threat (invariant 7). Owner: physician of record (HB-C1, HB-C2, HB-C7).'
