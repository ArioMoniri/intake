kind: pack
id: specialty.cocuk_enfeksiyon_hastaliklari
layer: specialty
version: 0.2.0
schema_version: 2
maturity: L1
status: questions-authored-guideline-sourced-clinician-directed; triage-deferred-HB-C1
language: tr
title_tr: Çocuk Enfeksiyon Hastalıkları ön görüşme protokolü
extends: cluster.child_health
visit_types:
- first
- followup
- preop
- report
- pregnancy_followup
- chronic_review
- post_discharge
- screening
- second_opinion
- teleconsult
sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugün çocuğunuzu kliniğe getiren en önemli şikâyeti kendi cümlelerinizle kısaca anlatır mısınız?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun bu şikâyeti ne zaman başladı? Yaklaşık olarak gün ya da hafta olarak söyleyebilir misiniz?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun ateşi oldu mu? Olduysa kaç gündür sürdüğünü, örneğin beş günden uzun mu, söyleyebilir misiniz?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz her zamanki gibi emebiliyor ya da su içebiliyor mu, yoksa ağızdan alamıyor mu?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz ağızdan aldığı her şeyi kusuyor mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz bu hastalık sırasında havale (nöbet) geçirdi mi?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz aşırı uykulu ya da halsiz mi; uyandırmakta zorlanıyor musunuz?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun cildinde, üzerine bardakla ya da parmakla bastırdığınızda solmayan (kaybolmayan) kırmızı veya mor döküntü fark ettiniz mi?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun nefes alışverişinde zorlanma ya da her zamankinden hızlı soluma fark ettiniz mi?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun daha önce konulmuş bir hastalık tanısı, örneğin bağışıklık sistemini etkileyen süregen bir hastalığı var mı?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun aşıları ulusal aşı takvimine göre tamamlandı mı, yoksa eksik aşısı var mı?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz şu anda düzenli bir ilaç kullanıyor mu? Son bir ay içinde antibiyotik kullandı mı?
