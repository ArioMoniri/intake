sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugünkü görüşmede çocuğunuzla ilgili sizi en çok düşündüren konu nedir? Kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu şikâyet ne zaman başladı ve o günden bu yana nasıl bir seyir izledi?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun vücudunda, nedeni belli olmayan ya da küçük darbelerle beklenenden kolay oluşan morluklar fark ettiniz mi?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzda nedeni belli olmayan burun ya da diş eti kanaması, veya ciltte iğne başı büyüklüğünde kırmızı-mor noktacıklar oldu mu?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz son zamanlarda her zamankinden solgun görünüyor mu ya da geçmeyen bir yorgunluk yaşıyor mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzda nedeni açıklanamayan, uzun süren ateş ya da sık tekrarlayan enfeksiyonlar oldu mu?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuz, özellikle geceleri uykudan uyandıran ya da geçmeyen bir kemik veya eklem ağrısından yakınıyor mu?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun boyun, koltuk altı ya da kasık bölgesinde, geçmeyen bir şişlik ya da ele gelen bir bez fark ettiniz mi?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun karnında şişlik, dolgunluk ya da elinize gelen sert bir kitle fark ettiniz mi?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun göz bebeğinde, özellikle fotoğraflarda beyaz bir parlama ya da normal kırmızı yansımanın kaybolduğunu fark ettiniz mi?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuza daha önce kanla ilgili bir hastalık tanısı kondu mu ve şu anda bunun için düzenli bir tedavi görüyor mu?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Çocuğunuzun şu anda düzenli olarak kullandığı ilaçlar var mı?
