sections:
  ziyaret_baglami:
    slots:
      basvuru_nedeni:
        type: string
        required: true
        ask_tr:
          tr: Bugünkü randevunuzda sizi en çok rahatsız eden cilt sorununu kısaca anlatabilir misiniz?
      sikayet_suresi:
        type: duration
        required: false
        ask_tr:
          tr: Bu şikâyetiniz ne zamandır var? Yaklaşık olarak söyleyebilir misiniz?
  sorular:
    slots:
      soru_1:
        type: string
        required: false
        ask_tr:
          tr: Bu şikâyetiniz nasıl başladı ve o zamandan bu yana nasıl değişti? Biraz anlatır mısınız?
      soru_2:
        type: string
        required: false
        ask_tr:
          tr: Bu cilt şikâyetiniz ne zamandır var? Gün ya da hafta olarak yaklaşık söyleyebilir misiniz?
      soru_3:
        type: string
        required: false
        ask_tr:
          tr: Bir beniniz ya da lekeniz son zamanlarda boyut, şekil veya renk olarak değişti mi?
      soru_4:
        type: string
        required: false
        ask_tr:
          tr: Bu ben ya da lekeden kanama, sıvı sızması ya da kabuklanma oldu mu?
      soru_5:
        type: string
        required: false
        ask_tr:
          tr: Bu ben ya da lekede kaşıntı, kızarıklık ya da his değişikliği fark ettiniz mi?
      soru_6:
        type: string
        required: false
        ask_tr:
          tr: Cildinizde uzun süredir iyileşmeyen bir yara ya da kabuk var mı?
      soru_7:
        type: string
        required: false
        ask_tr:
          tr: Cildinizde yeni çıkan ya da büyüyen bir kabartı veya leke fark ettiniz mi?
      soru_8:
        type: string
        required: false
        ask_tr:
          tr: Genital bölgenizde yara, döküntü ya da olağandışı bir akıntı gibi bir şikâyetiniz var mı?
      soru_9:
        type: string
        required: false
        ask_tr:
          tr: Daha önce cildinizle ilgili bir tanı aldınız mı ya da bir cilt hastalığı için tedavi gördünüz mü?
      soru_10:
        type: string
        required: false
        ask_tr:
          tr: Şu anda düzenli kullandığınız ilaçlar var mı? Yakın zamanda yeni başladığınız bir ilaç oldu mu?
      soru_11:
        type: string
        required: false
        ask_tr:
          tr: Herhangi bir ilaca ya da cildinize sürdüğünüz bir ürüne karşı alerjiniz olduğunu fark ettiniz mi?
