# INTAKE branch taxonomy — the source of truth named by files/09 §1
# ("packages/protocols/taxonomy/branches.yaml, seeded from the MHRS branch
# registry"). Every branch below is copied from the files/09 §1 cluster
# table, never invented; the nine clusters are that table's nine rows.
#
# verify_live_list (HB-A11): the seed derives from the MoH statement of
# 26 Nov 2025 ("79 registered branches", Memişoğlu via Anadolu Ajansı) as
# transcribed in files/09 §1; the live MHRS/SKRS clinic list is synced at
# onboarding and on each release. The flag stays `true` until the owner
# confirms the live list from an e-Devlet/MHRS login — an unbooked branch is
# a silently unrouted patient. Confirming HB-A11 is what removes the flag.
#
# Expansion notes (documented, not invented):
# - Slash-joined items in the files/09 §1 table are seeded as their
#   separately bookable clinics: "Diyabet / Obezite / Sigara Bırakma / Uyku /
#   Yaşlı Sağlığı poliklinikleri" (medical row; hospital-specific clinics per
#   the §1 lead-in) and "AMATEM/ÇEMATEM" (mental_health row).
# - The child_health row's yan dal shorthand "(Kardiyoloji, Nöroloji, …)"
#   expands to the booked "Çocuk …" branch names; the live sync corrects any
#   naming drift (verify_live_list above).
# - Parenthetical visit annotations become visit_types: "Anesteziyoloji
#   (preop polikliniği)" → [preop]; "Sağlık Kurulu (rapor)" and "Adli Tıp
#   (rapor)" → [report]. "Nükleer Tıp (konsültasyon)" is a naming note in
#   files/09 §1, not a visit-type restriction.
# - Visit types are orthogonal to branch (files/09 §1), so every other
#   branch carries the full ten-value set (&all_visit_types below).
# - Acil Tıp (cluster `excluded`) books no pre-visit intake at all — RED
#   routing only (files/09 §1; files/12 §1 `cluster.excluded`) — so it
#   carries no visit types and its cluster binds no intake pack.
#
# Resolution (files/03 §6, files/09 §1-2; CLAUDE.md invariant 13): a branch
# serves its own L1+ pack `specialty.<branch_id>` when one exists, else its
# cluster's pack below — a real, reviewed protocol, not a fallback. L0 packs
# are never served; no patient ever runs on bare base.intake.

verify_live_list: true

clusters:
  # files/09 §1 "Clusters (9)" — ids verbatim from the table's first column.
  - {id: medical, pack: cluster.medical}
  - {id: surgical, pack: cluster.surgical}
  - {id: sensory, pack: cluster.sensory}
  - {id: womens_health, pack: cluster.womens_health}
  - {id: child_health, pack: cluster.child_health}
  - {id: mental_health, pack: cluster.mental_health}
  - {id: dental, pack: cluster.dental}
  - {id: allied_and_reports, pack: cluster.allied_and_reports}
  # "Acil Tıp (pre-visit intake is never used for emergencies; RED routing
  # only)" — no intake pack exists or may exist for this cluster.
  - {id: excluded, intake: false}

# files/09 §1: "Visit types (orthogonal to branch): first, followup, preop,
# report (sağlık kurulu), pregnancy_followup, chronic_review, post_discharge,
# screening, second_opinion, teleconsult."
_all_visit_types: &all_visit_types
  - first
  - followup
  - preop
  - report
  - pregnancy_followup
  - chronic_review
  - post_discharge
  - screening
  - second_opinion
  - teleconsult

