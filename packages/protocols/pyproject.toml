[project]
name = "intake-protocols"
version = "0.1.0"
description = "Protocol DSL v2 (INT-040): schema/loader/validator, branch taxonomy and coverage CLI (INT-042), deterministic compiler to FHIR/openEHR/Pydantic/TS/clips (INT-041)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    # RedRegister/RedLocation are shared with the INT-031 clinical schemas so
    # the DSL and TriageResult can never disagree about the RED axes.
    "intake-clinical-schemas",
]

[project.scripts]
# One CLI, one namespace: `coverage` (INT-042, behind `make coverage-matrix`),
# `generate-l0` (INT-057) and `compile` (INT-041, behind `make protocols-compile`).
protocols = "protocols.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protocols"]

[tool.uv.sources]
intake-clinical-schemas = { workspace = true }
