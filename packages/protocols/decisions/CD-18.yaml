# INT-432 clinical decision CD-18. Agent-authored under owner decision D18
# (2 Oct 2026): simulated-patient stress testing only; a licensed physician's
# review is required before any real patient. Every source quote below appears
# verbatim in the named snapshot; spec_basis quotes appear verbatim in the named
# committed file. Not a pack: nothing here is compiled or served.
kind: clinical_decision
id: CD-18
title: "Clinician parts of V-A-2 (respiratory-infection postponement window) and V-GC-4 (whole-body sweating)"
question: >-
  V-A-2: anesteziyoloji Q3d records a recent cold or febrile illness before surgery; does
  the pre-visit ever rule on a postponement window? V-GC-4: göğüs cerrahisi Q11c asks
  whether excessive sweating is also all over the body; is that item clinically right,
  and how is it read?
decision: >-
  V-A-2 (anaesthesiology): no. The pre-visit never rules on postponing or proceeding.
  Q3d stays a planning fact for the anaesthesiologist and the surgeon: it raises no
  rule, no flag and no patient-facing advice. The current Turkish source is TARD's
  February 2025 paediatric preoperative guideline. It lists a current or recent upper
  respiratory infection as a risk factor, and it puts the decision to proceed or
  postpone with the anaesthesiologist and the surgeon, through risk stratification and
  family-centred decision-making. It suggests at least two weeks for a child with a
  severe infection, graded on findings the clinician assesses, and it states that clear
  evidence on how long to postpone is still lacking. TARD's February 2025 adult guideline
  has no statement on postponing after a respiratory infection. The one-month figure in
  the proposal came from TARD's 2015 preoperative document, which TARD Akademi's current
  list replaces with the two February 2025 guidelines, so it is not used. Telling a
  patient to postpone an operation is treatment language, which PolicyGuard forbids in
  patient copy. Q3d's wording stays as it is (author-owned), and its source line moves
  to the 2025 paediatric guideline. The adult window stays draft_needs_source, and
  nothing reads it.
  V-GC-4 (thoracic surgery): Q11c is confirmed. NICE HTG339 defines primary
  hyperhidrosis of the upper limb as excessive sweating of the palms or axillae. It
  limits endoscopic thoracic sympathectomy to severe, debilitating primary hyperhidrosis
  that has not responded to other treatments. Sweating all over the body is the fact a
  patient can report that separates generalised sweating from that focal pattern, which
  is why it bears on surgical candidacy. It is read as context, never as an eligibility
  rule. HTG339 also says that sweating elsewhere on the body is usual after the
  procedure, a sympathectomy. Q8 records any previous chest surgery and does not
  identify the procedure, so a Q11c "evet" is shown beside the Q8 answer. It is never
  read as post-sympathectomy sweating unless the patient names a previous
  sympathectomy. The same HTG339 recommendation makes earlier
  treatment part of candidacy, and the pack does not ask about it. One gated item is
  added: Q11d, whether antiperspirants, tablets or injections were tried.
status: active
scope: simulated_patient_stress_testing
author_role: "anaesthesiology and thoracic surgery physician (agent)"
