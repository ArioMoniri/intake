source_gap: >-
  V-A-2: no current Turkish or retrieved guideline sets a postponement window for an
  adult after a respiratory infection. TARD's February 2025 adult guideline has no such
  statement, and the one-month figure came from TARD's 2015 document, which TARD's
  current list replaces. The pre-visit does not rule on a window, so nothing reads this
  value.
