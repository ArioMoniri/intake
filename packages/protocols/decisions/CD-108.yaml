# physician's review is required before any real patient. Every source quote appears verbatim in the
# named snapshot and every spec_basis quote in the named file.
kind: clinical_decision
id: CD-108
title: 'rf.chest_pain_acute: the EK-4 Kırmızı Kategori 2 chest-pain arm, on the life-threat rule''s own
  slots'
question: Which current source states the trigger, level and urgency of acute chest pain for the base.intake
  family, and can it be written on existing slots?
decision: 'Write rf.chest_pain_acute as KIRMIZI_K2 / EMERGENCY_NOW / ALERT on the chest_pain and associated
  slots that the active life-threat rule rf.chest_pain_cardiac_features already reads, with the same disjunction
  (pressing, squeezing or heavy pain, spread to arm, jaw or back, sweating, or breathlessness), tense
  now, anchored on chest_pain.onset_at. EK-4 prints ''Kardiyak ağrıya benzer göğüs ağrısı'' in Kırmızı
  Kategori 2, the ten-minute category. Reusing the life-threat gate means the family and the served rule
  cannot disagree under the lattice max. The action is the CD-24 generic RED script with 112 spelled out.
  04 §3''s ''or under twenty-four hours'' arm is not written: SlotType v2 has no datetime and tense now
  is the reference day.'
status: active
scope: simulated_patient_stress_testing
scope_note: 'Owner decision D18 (2 Oct 2026), and the owner''s instruction of 18 Nov 2026 (''yes write
  the 13 red flag rules''): agent-sourced content for the synthetic host and simulated patients only.
  A licensed physician''s review is required before any real patient. No clinical_signoff field is touched
  (D17), the pack stays L0, and HB-C1 stays open.'
question_origin: 'Owner, 18 Nov 2026, in chat: ''yes write the 13 red flag rules''. INT-619.'
author_role: emergency medicine physician (agent)
inference_disclosure: The feature disjunction is the pack's operationalisation of EK-4's 'kardiyak ağrıya
  benzer'; EK-4 enumerates no features. Recorded the same way on rf.chest_pain_cardiac_features.
