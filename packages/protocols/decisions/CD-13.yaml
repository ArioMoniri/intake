spec_basis:
  - file: CLAUDE.md
    section: "Non-negotiable invariants, 7"
    quote: "`base.life_threat` is a sibling set outside the inheritance chain and nothing may extend it."
    supports: rules.base_life_threat.never_by_extension
  - file: files/04_CLINICAL_PROTOCOLS.md
    section: "§8, The problem this fixes"
    quote: "and patients do not present according to their booking"
    supports: rules.base_life_threat
  - file: files/04_CLINICAL_PROTOCOLS.md
    section: "§8, The fix is structural"
    quote: "sibling rule set evaluated on every session regardless of branch"
    supports: rules.base_life_threat
  - file: files/04_CLINICAL_PROTOCOLS.md
    section: "§8, The fix is structural"
    quote: "the deny-list makes it unreachable from any pack operation — so composition is monotone by construction"
    supports: rules.base_life_threat.never_by_extension
  - file: files/protocols/base.life_threat.yaml
    section: "header, kind: life_threat_set"
    quote: "Nothing may extend it."
    supports: rules.base_life_threat.never_by_extension
  - file: files/HUMAN_BLOCKERS.md
    section: "HB-C2"
    quote: "Named as missing: cauda equina, testicular torsion, limb ischaemia, acute angle-closure, neutropenic fever, GCA, `rf.sah_ottawa`, `rf.meningitis_pattern`, `rf.ectopic_possible`, `rf.thunderclap_headache`, `rf.sepsis_like`"
    supports: "placements bvsc-1, ftr-1, bvsc-3"
  - file: files/protocols/base.life_threat.yaml
    section: "remaining_adult_rules, known_named_gaps"
    quote: "rf.stroke_fast, rf.dyspnoea_rest, rf.anaphylaxis, rf.severe_bleeding,"
    supports: "placements bvsc-4 (sudden arm), gc-1, gc-3"
  - file: files/04_CLINICAL_PROTOCOLS.md
    section: "§8.2 Reachability gates"
    quote: "`every_RED_rule_is_reachable_from_every_branch` · `must_cover_ids_all_present` · `no_rule_references_an_undeclared_slot`"
    supports: rules.base_life_threat.trigger_slots_declared_at_base
  - file: files/04_CLINICAL_PROTOCOLS.md
    section: "§3 Universal red-flag rules"
    quote: "rf.new_neuro_deficit_subacute | progressive weakness/numbness over days"
    supports: "rules.base_universal_family; placements bvsc-4 and ftr-4 (subacute arm)"
  - file: packages/protocols/base/intake.yaml
    section: "red_flags"
    quote: "id: rf.weight_loss_unintentional"
    supports: "rules.base_universal_family; placement hm-4 (weight-loss arm)"
  - file: files/04_CLINICAL_PROTOCOLS.md
    section: "§3 Universal red-flag rules"
    quote: "rf.severe_bleeding | large-volume bleeding, melena with dizziness"
    supports: "placements gc-1, gh-A1 and hm-A1 (heavy bleeding stays base)"
  - file: files/04_CLINICAL_PROTOCOLS.md
    section: "§8.1 rule 1"
    quote: "Every trigger must be answerable by a layperson"
    supports: "rules.unsourced_time_criticality; placement nf-1"
value:
  rules:
    base_life_threat:
      when: "the source sets an emergency, immediate or same-day action AND the presentation does not depend on the booked branch"
      authored_in: files/protocols/base.life_threat.yaml
      author: "HB-C2 clinician author"
      never_by_extension: "never through extends:, an overlay op or a department pack"
      trigger_slots_declared_at_base: "a base.life_threat rule reads base.intake slots or base probes only; the department items stay gate inputs and are rebound to the base id once it exists"
    base_universal_family:
      when: "a universal, non-emergency arm that matches a family already declared in base.intake red_flags (files/04 §3)"
      families: [rf.new_neuro_deficit_subacute, rf.weight_loss_unintentional]
      effect: "the department arm merges into the base family; the department authors no copy"
    department_stub:
      when: "the source sets an urgent or routine referral (an NG12 pathway, a specialist referral or a very urgent blood count), or the anchor needs a laboratory value"
      authored_in: "the department's own draft_needs_source stub"
    unsourced_time_criticality:
      when: "no retrieved source sets an emergency or same-day action for a layperson-reportable trigger"
      placement: department_stub
      status: draft_needs_source
      moves_to: "base.life_threat once such a source is snapshotted"
  placements:
    - {key: gh-1, proposal: gogus_hastaliklari, proposed_id: rf.gogus_hastaliklari_uzayan_oksuruk, placement: department_stub, basis: "persistent-cough referral (tuberculosis or lung-cancer work-up); no emergency action", note: "GH-S7 is the superseded 2019 Scottish guide; re-source"}
    - {key: gh-2, proposal: gogus_hastaliklari, proposed_id: rf.gogus_hastaliklari_tekrarlayan_balgamda_kan, placement: department_stub, basis: "NG12 1.1.1 suspected cancer pathway", note: "GH-S7 superseded; heavy haemoptysis stays rf.severe_bleeding (base)"}
    - {key: gh-3, proposal: gogus_hastaliklari, proposed_id: rf.gogus_hastaliklari_balgam_degisikligi, placement: department_stub, status: draft_needs_source, basis: "NG114 1.1.2 is a treatment criterion, not a referral or triage criterion"}
