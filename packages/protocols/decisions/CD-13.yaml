    - {key: gh-A1, proposal: gogus_hastaliklari, proposed_id: rf.gogus_hastaliklari_balgamda_kan, placement: department_stub, basis: "NG12 1.1.1 suspected cancer pathway", note: "heavy haemoptysis stays rf.severe_bleeding (base)"}
