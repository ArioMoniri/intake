# INT-432 clinical decision CD-13. Agent-authored under owner decision D18
# (2 Oct 2026): simulated-patient stress testing only; a licensed physician's
# review is required before any real patient. Every source quote below appears
# verbatim in the named snapshot; spec_basis quotes appear verbatim in the named
# committed file. Not a pack: nothing here is compiled or served.
kind: clinical_decision
id: CD-13
title: "Placement of the INT-427 red-flag proposals: base.life_threat, base universal families or the department stub"
question: >-
  HB-C1 placement: where does each red-flag proposal row in the seven INT-427
  verification documents (göğüs hastalıkları, beyin ve sinir cerrahisi, hematoloji,
  nefroloji, fiziksel tıp ve rehabilitasyon, göğüs cerrahisi, anesteziyoloji) live?
  Universal time-critical patterns such as cauda equina, thunderclap headache and a
  focal neurological deficit go to base.life_threat; the rest go to the department's
  own draft_needs_source stub.
decision: >-
  Placement follows files/04 §8: patients do not present according to their booking,
  so a time-critical pattern that any patient can present with must be evaluated on
  every session. Four placements apply.
  (1) base.life_threat takes a pattern whose source sets an emergency, immediate or
  same-day action and whose presentation does not depend on the booked branch. The
  HB-C2 author writes it in files/protocols/base.life_threat.yaml itself; it is never
  reached through extends: or an overlay op. Its trigger slots must be declared at
  base level, because a department slot does not exist in a session booked elsewhere.
  The department items stay gate inputs and are rebound to the base id once it
  exists.
  (2) A universal but non-emergency arm that matches a family already declared in
  base.intake's universal red_flags (files/04 §3) merges into that family:
  rf.new_neuro_deficit_subacute and rf.weight_loss_unintentional.
  (3) A referral signal whose source sets an urgent or routine referral (a NICE NG12
  pathway, a specialist referral, a very urgent blood count) stays in the department's
  own draft_needs_source stub.
  (4) A pattern whose time-criticality no retrieved source establishes stays in the
  department stub as draft_needs_source. It moves to base.life_threat only when a
  source states an emergency or same-day action for a trigger a layperson can report.
  Applying this: cauda equina (beyin ve sinir cerrahisi row 1 and fiziksel tıp row 1,
  one rule), thunderclap headache (bvsc row 3), sudden focal deficit (bvsc row 4,
  sudden arm), head injury on anticoagulant or antiplatelet treatment (bvsc row 2,
  CD-12), metastatic spinal cord compression (bvsc row 6, and fiziksel tıp row 3's
  known-cancer arm), massive haemoptysis (göğüs cerrahisi row 1) and acute chest pain
  or breathlessness (göğüs cerrahisi row 3) go to base.life_threat. The subacute
  deficit arms (bvsc row 4, fiziksel tıp row 4) go to rf.new_neuro_deficit_subacute,
  and hematoloji row 4's weight-loss arm goes to rf.weight_loss_unintentional
  (CD-14). Every NG12-pathway, specialist-referral and lab-anchored row stays in its
  department stub. Spinal infection, fracture, raised-pressure headache and reduced
  urine stay in their department stubs as draft_needs_source until sourced as
  time-critical.
  One source-currency finding is recorded. The Scottish quick reference guide of
  January 2019, cited as GH-S7 and H-S4, was replaced by the Scottish Referral
  Guidelines for Suspected Cancer 2025 (published 6 August 2025). Every row that
  cites it must be re-sourced before it can be signed.
status: active
