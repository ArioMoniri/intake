kind: clinical_decision
id: CD-114
title: 'rf.sepsis_like: fever with lethargy, any age, at EK-4 Kırmızı Kategori 2'
question: Which current source states a layperson-answerable sepsis-like trigger and its urgency?
decision: 'Write rf.sepsis_like as KIRMIZI_K2 / EMERGENCY_NOW / ALERT on two slots: fever now (fever_now,
  reported, not measured) and, after a yes, sleepiness and weakness severe enough to make staying awake
  hard (the layperson rendering of ''letarji''). EK-4 Kırmızı Kategori 2 prints ''Letarji ile birlikte
  ateş (her yaş)'', so the rule needs no age or pregnancy routing. Confusion, very low blood pressure
  and rigors in the immunosuppressed (04 §3) are not EK-4''s line and are not written; NICE NG253, NG254
  and NG255 are not snapshotted and carry updates in progress.'
status: active
scope: simulated_patient_stress_testing
scope_note: 'Owner decision D18 (2 Oct 2026), and the owner''s instruction of 18 Nov 2026 (''yes write
  the 13 red flag rules''): agent-sourced content for the synthetic host and simulated patients only.
  A licensed physician''s review is required before any real patient. No clinical_signoff field is touched
  (D17), the pack stays L0, and HB-C1 stays open.'
