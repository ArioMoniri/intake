kind: clinical_decision
id: CD-115
title: 'rf.thunderclap_headache: very severe headache peaking within five minutes, present now, at EK-4
  Kırmızı Kategori 2'
question: Which current source states a layperson-answerable thunderclap-headache trigger and its urgency?
decision: 'Write rf.thunderclap_headache as KIRMIZI_K2 / EMERGENCY_NOW / ALERT on one probe: a very severe
  headache, present now, that began suddenly and reached its worst within five minutes (NICE CG150 1.1.1).
  CG150 itself asks only for evaluation and consideration of investigation or referral; the urgency is
  EK-4 Kırmızı Kategori 2''s ''Herhangi bir nedenle olan ciddi ağrı'', which is why the probe asks for
  very severe pain present now. The relation to rf.sah_ottawa (04 §8.3) is not decided here.'
