# INT-447 clinical decision CD-22. Agent-authored under owner decision D18
# (2 Oct 2026, INT-432): simulated-patient stress testing only; a licensed
# physician's review is required before any real patient. Every source quote
# below appears verbatim in the named snapshot; spec_basis quotes appear
# verbatim in the named committed file. Not a pack: nothing here is compiled
# or served. The Turkish of each line is byte-equal to its catalogue key.
kind: clinical_decision
id: CD-22
title: 'INT-414 delivery lines: instrument and sensitive framing (rows 27-32, 39-40)'
question: INT-414 (#726) adds conversational delivery lines around each question. Do the instrument introductions,
  the sensitive-section transitions and cadence lines, and the family-history transitions pass PolicyGuard
  (no diagnosis, treatment, prognosis, reassurance or minimising), stay B1 plain Turkish in the siz register,
  ask nothing, carry no numeral, and fit the moment they are said?
decision: 'Seven pass unchanged and one is reworded. sensitiveLead.b opened with the interrogative word
  ''Nasıl'', which only the conditional ''-sanız'' resolves at the third word, so it began like a question
  right before the turn''s one real question. It becomes ''Size rahat gelen şekilde yanıtlayabilirsiniz.'',
  with the same meaning, the same register and no promise about skipping. ''Anket'' is kept over ''ölçek''
  in the instrument lines because it is the everyday word. These lines are transitions: they are not the
  files/04 §4.2 pre-brief required before the suicide-pathway items, which is owed separately and is not
  discharged here. The new line is in the catalogue, the server allow-list and the HB-C1 table on #726
  (INT-414). Each line below is its own entry with its six checks, the author''s verdict and the verifier''s
  verdict; the Turkish is byte-equal to the catalogue key it names.'
status: active
scope: simulated_patient_stress_testing
scope_note: 'Owner decision D18 (INT-432): agent sign-off for simulated-patient testing only. A licensed
  physician''s review is required before any real patient; that requirement is unchanged by this record.'
question_origin: 'INT-447 (#758), split from INT-432 (#735): the HB-C1 table in docs/evidence/INT-414.md
