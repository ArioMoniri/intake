      status: active
    - item: "docs/evidence/INT-353.md#L304"
      ref: "INT-353 rebind row: child construct choice and overlaps"
      packets: [cluster_child_health, cocuk_enfeksiyon_hastaliklari, cocuk_sagligi_ve_hastaliklari]
      deciders: [HB-C3, paediatrician]
      question: "Which feeding construct does child_health ask, and does the cluster item stay where a specialty asks its own vomiting, growth or breathing item?"
      outcome: change
      change: >-
        (1) Feeding, the same reconciliation as CD-103 item cluster-wave-b.md#L75: both
        constructs are kept. beslenme_sivi_alimi becomes az_beslenme as CD-100 T9 decides
        it ("Çocuğunuz her zamankinden daha az besleniyor ya da içiyor mu?", ungated), and
        the cluster adds the WHO danger sign as a separate ungated item, "Çocuğunuz hiçbir
        şey içemez ya da ememez hâle geldi mi?" · gen: slot=icemez_ememez; type=boolean.
        cocuk_sagligi_ve_hastaliklari and cocuk_enfeksiyon_hastaliklari drop
        beslenme_sivi_alimi and emebiliyor_icebiliyor and inherit both; neonatoloji's
        beslenmede_azalma takes az_beslenme with its own infant text and inherits
        icemez_ememez. (2) Vomiting: her_seyi_kusma stays in every child chain unchanged;
        sivi_tutamama, kusma_beslenme_reddi and tekrarlayan_kusma_beslenememe stay as their
        packs' own items. (3) Growth: buyume_endisesi stays; yavas_kilo_alma,
        buyume_geriligi and kilo_alamama stay as their packs' own items;
        buyume_ergenlik_endisesi is decided by CD-100 T46, which narrows it to
        ergenlik_endisesi. (4) Breathing: inleme and gogus_icine_cekilme stay in neonatoloji
        beside its own nefes_zorlanmasi.
      clinical_basis: "The WHO danger sign and NG143's poor feeding have different thresholds, so both are asked and neither is merged into the other; vomiting everything is a WHO general danger sign and is never replaced by a narrower specialty item, while not tolerating fluids, feed refusal and recurrent vomiting are separate risk constructs; grunting and chest indrawing are separate high-risk NG143 features; the remaining growth items each add a construct (peers, weight loss), so no item is merged and the worst case is a near repeat."
      sources: [WHO-POCKETBOOK-2013, NICE-NG143, NICE-CG84, openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
    - item: "docs/evidence/INT-353.md#L306"
      ref: "INT-353 rebind row: klinik_psikoloji_poliklinigi Q8"
      packets: [klinik_psikoloji_poliklinigi]
      deciders: [HB-C1, clinician, psychiatrist]
      question: "Does klinik psikoloji Q8 (regular sessions with a psychologist or psychiatrist) adopt the cluster's onceki_ruh_sagligi_destegi, or keep its own id?"
      outcome: change
      change: >-
        Made generator-valid, as CD-101 T81 (a) to (c). (a) The klinik psikoloji proposal
        re-declares the cluster's item before Q8, with the cluster text verbatim: "Daha önce
        ruh sağlığınızla ilgili bir hekimden ya da psikologdan destek aldınız mı?" (gen:
        slot=onceki_ruh_sagligi_destegi; type=boolean). The same id replaces the cluster
        slot in place, and the cluster's gated onceden_iyi_gelen still reads it. (b) Q8
        keeps its id and text and becomes its detail: "Daha önce bir psikolog ya da
        psikiyatristle düzenli görüşmeler yaptınız mı?" (gen: slot=onceki_psikoterapi;
        type=boolean; ask_if=onceki_ruh_sagligi_destegi == true). (c) Answer mapping for
        onceki_ruh_sagligi_destegi in this chain, under CD-04's per-slot rule: a hedged yes
        ("galiba", "bir ara gitmiştim") is present-qualified and opens the detail.
        "Hatırlamıyorum" is UNCLEAR, its follow-up is asked once (CD-04), and if it stays
        UNCLEAR the detail is not asked. That loses only a detail item, never a safety
        input.
      clinical_basis: "NICE NG222 asks about any past treatment and the response to it, which is the cluster's broader support item and what opens 'what helped'; regular psychotherapy is a narrower detail, so asking it only after a yes keeps both facts without letting the narrower answer close the broader one. A specialty gate may read only base slots and the pack's own earlier slots, which is why the cluster item is re-declared in the pack."
      sources: [NICE-NG222]
      spec_basis_ref: ["scripts/dev/gen_specialty_packs.py build_pack", "packages/protocols/review/cluster/mental_health.yaml sorular.onceki_ruh_sagligi_destegi", "packages/protocols/decisions/CD-04.yaml decision"]
      status: active
