      question: "Does cocuk_enfeksiyon Q8 uyandirma_zorlugu stay separate from uykulu_tepkisiz, and is the fever ask 'var mı' or 'oldu mu'?"
      outcome: change
      change: >-
        (1) Q8 uyandirma_zorlugu stays a separate item, text and gen line unchanged. (2) Q2
        → "Çocuğunuzun son günlerde ateşi oldu mu?" · gen: slot=ates_var_mi; type=boolean,
        and Q3 → "Çocuğunuzun ateşi şimdiye kadar ne kadar sürdü?" · gen: slot=ates_suresi;
