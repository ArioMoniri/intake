inference_disclosure: >-
  The sources fix the constructs. Which id carries which fact, keeping two facts apart,
  turning a narrower item into a gated detail, the new slot ids, and the Turkish wording
  of the reworded neck-lump, eye-redness and health-effect items are this author's choices
  made on those sources. Where two items differ by recall window or construct, they stay
  apart: the cost is a repeated-sounding question, while a wrong merge loses a window or a
  construct without a trace.
value:
  packet_commit: 151cf34f
  items:
    - item: "docs/evidence/INT-353.md#L286"
      ref: "INT-353 rebind row: ic_hastaliklari Q4, Q5"
      packets: [ic_hastaliklari]
      deciders: [HB-C1, clinician]
      question: "Do ic_hastaliklari Q4 (unexplained fever) and Q5 (night sweats) adopt the cluster's text and ids son_gunlerde_ates and gece_terlemesi, or keep their own?"
      outcome: change
      change: >-
        Q5 adopts the cluster's verified text verbatim under the cluster id: "Son
        zamanlarda geceleri çarşafınızı ıslatacak kadar terlediniz mi?" · gen:
        slot=gece_terlemesi; type=boolean. Q4 stays apart from son_gunlerde_ates under a
        semantic id, text unchanged: "Son zamanlarda nedenini bilmediğiniz bir ateşiniz
        oldu mu?" · gen: slot=nedenini_bilmedigi_ates; type=boolean. The patient's report
        is recorded as such and is never asserted as NG12's clinician-defined "unexplained"
        (CD-14). Same decision as CD-102 item cluster-wave-a.md#L243.
      clinical_basis: "The cluster asks drenching night sweats in a recent window, the form haematology referral guidance names, while ic Q5 has no window and a lower threshold; ic Q4 asks a fever whose cause the patient does not know, close to NG12's unexplained fever (a clinician's finding after assessment), while the cluster asks any recent fever, so it stays apart."
      sources: [SCOT-SRG-2025, NICE-NG12, openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
    - item: "docs/evidence/INT-353.md#L287"
      ref: "INT-353 rebind row: el_cerrahisi Q2"
      packets: [cluster_surgical, el_cerrahisi]
      deciders: [HB-C1, clinician]
      question: "Should el_cerrahisi Q2 keep its applied rebind to travma_sonrasi_basladi?"
      outcome: accept
      clinical_basis: "Yes: an injury before the complaint is one precipitating-factor fact whichever body site the booking names, and the hand-specific mechanism stays in el_cerrahisi's own kesik_isirik_delici_yaralanma item (same as CD-102 item cluster-wave-a.md#L244)."
      sources: [openEHR-EHR-CLUSTER.symptom_sign.v2]
      status: active
    - item: "docs/evidence/INT-353.md#L289"
      ref: "INT-353 rebind row: kulak_burun_bogaz_hastaliklari Q5, Q7"
      packets: [kulak_burun_bogaz_hastaliklari]
      deciders: [HB-C1, clinician]
      question: "Do KBB Q5 (vertigo, no recall window) and Q7 (persistent neck lump, 'kitle') adopt the cluster's donme_hissi and boyunda_sislik, or keep their own ids?"
      outcome: change
      change: >-
        Q5 adopts the cluster's verified text verbatim under the cluster id: "Son
        zamanlarda kendinizin ya da çevrenizin döndüğü hissini yaşadınız mı?" · gen:
        slot=donme_hissi; type=boolean; follow_up=Hareket etmediğiniz hâlde dönme ya da
        sallanma hissi oldu mu? Q7 stays apart under a semantic id and loses the
        unexplained "kitle": "Boynunuzda kendiliğinden geçmeyen bir şişlik ya da sertlik var
        mı?" · gen: slot=boyunda_gecmeyen_sislik; type=boolean.
      clinical_basis: "NICE NG127's vertigo actions concern recent, sudden vertigo, which the cluster's recency frame captures and KBB's unframed recall does not; NG12 makes a persistent neck lump and an unexplained new one separate referral constructs, so the persistent lump stays apart in plain words."
      sources: [NICE-NG127, NICE-NG12, openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
    - item: "docs/evidence/INT-353.md#L291"
      ref: "INT-353 rebind row: goz_hastaliklari Q2, Q3, Q4, Q5, Q8"
      packets: [goz_hastaliklari]
      deciders: [HB-C1, clinician]
      question: "How do göz Q2, Q3, Q4, Q5 and Q8 pair with the sensory cluster's vision, flashes-and-floaters and redness items?"
      outcome: change
      change: >-
        Q2 (soru_1) adopts the cluster's verified text verbatim under the cluster id:
        "Görmenizde yeni bir azalma ya da değişiklik oldu mu?" · gen:
        slot=gorme_degisikligi; type=boolean; follow_up=Gelip geçse bile görmenizde
        bulanıklık ya da kararma oldu mu? (the cluster's sudden-onset and one-eye follow-ups
        then open in the göz chain). Q3 (soru_2, transient sudden loss) stays apart, text
        unchanged · gen: slot=gecici_ani_gorme_kaybi; type=boolean. Q4 (soru_3, floaters)
        and Q5 (soru_4, flashes) stay apart, texts unchanged · gen: slot=ucusan_noktalar;
        type=boolean and gen: slot=isik_cakmasi; type=boolean; the cluster's combined
        isik_cakmasi_ucusan_cisim is still asked. Q8 (soru_7) narrows to the skin around the
        eye, because the cluster's goz_kizarikligi asks eye redness: "Gözünüzün çevresindeki
        deride kızarıklık var mı?" · gen: slot=goz_cevresi_kizariklik; type=boolean.
      clinical_basis: "One question per construct: the cluster's broader new-vision-change item replaces göz's narrower one; a transient episode that has resolved, floaters alone and flashes alone are separate facts the combined cluster item cannot carry under one id; and eye redness and redness of the skin around the eye differ by body site, so each is asked once."
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1, openEHR-EHR-CLUSTER.symptom_sign.v2]
      status: active
    - item: "docs/evidence/INT-353.md#L292"
      ref: "INT-353 rebind row: odyoloji Q5"
      packets: [cluster_sensory, odyoloji]
      deciders: [HB-C1, clinician]
      question: "Should odyoloji's dizziness-or-imbalance item merge with the cluster's spinning item donme_hissi?"
      outcome: accept
      clinical_basis: "Keep them apart, unchanged: NICE NG127 names rotational vertigo, dizziness and new unsteadiness separately and makes imbalance what turns dizziness into a concern, so a merge loses one of them (same as CD-102 item cluster-wave-a.md#L247)."
      sources: [NICE-NG127]
      status: active
    - item: "docs/evidence/INT-353.md#L300"
