# INT-448 clinical decision CD-104: the sign-off packet items (#642, packet commit
# 151cf34f) that come from docs/evidence/INT-353.md (the sibling slot-id rebinds left
# awaiting-human). Agent-authored under owner decision D18 (2 Oct 2026). It covers
# simulated-patient stress testing only, and a licensed physician's review is required
# before any real patient. Every source quote below appears verbatim in the named
# snapshot, and every spec_basis quote appears verbatim in the named committed file.
# This is not a pack: the lead applies the item changes to the review-queue proposals and
# moves the pinned rows in tests/protocols/test_gen_specialty_packs.py with them. No
# triage level, route, register, location or red-flag rule is created, relaxed or
# removed here.
kind: clinical_decision
id: CD-104
title: "#642 packet items: INT-353 sibling rebinds left awaiting-human"
question: >-
  For each rebind INT-353 left to a clinician, paediatrician, psychiatrist or the owner,
  does the branch item take the cluster's id and text, stay apart under its own id, or
  change, on what current source, and which part stays with the owner?
decision: >-
  Twenty-two items. Accepted (5): el_cerrahisi keeps travma_sonrasi_basladi; odyoloji's
  dizziness-or-imbalance item stays apart; cocuk_gogus_hastaliklari keeps the WHO
  chest-indrawing text; the four opposite-polarity hydration twins follow CD-10; the
  pedodonti proxy airway text is right if the owner keeps the airway ask. Changed (13):
  ic_hastaliklari adopts the cluster night-sweat question and keeps its fever-of-unknown-
  cause item apart as nedenini_bilmedigi_ates (the patient's report, never asserted as
  NG12's "unexplained"); KBB adopts the cluster vertigo question and keeps a
  persistent neck lump apart, without "kitle"; göz adopts the cluster vision-change
  question, keeps transient sudden loss, floaters and flashes apart, and narrows its
  redness item to the skin around the eye; the child fever ask becomes "oldu mu" and
  uyandirma_zorlugu stays separate; the child chains keep both feeding constructs, the
  feeding-less item az_beslenme (CD-100 T9) and the WHO danger sign icemez_ememez
  (CD-103), and neonatoloji's infant item takes az_beslenme; klinik psikoloji
  re-declares the cluster's support item (onceki_ruh_sagligi_destegi, cluster text
  verbatim) before its psychotherapy item, which becomes that item's gated detail, with
  a per-slot answer mapping (CD-101 T81); AMATEM's two-fact item splits into the
  cluster's functioning item and a
  health-effect item. Four items are owner questions (ÇEMATEM and Çocuk ve Ergen Ruh
  Sağlığı, the dental radiology airway id, the held sağlık kurulu item, and the FTR fever
  near-twin). Where the owner reverted a rebind on 27 Sep 2026, that decision already
  re-applies it once the clinician chooses, which this decision does.
status: active
scope: simulated_patient_stress_testing
scope_note: >-
  Owner decision D18 (2 Oct 2026): agent-only sign-off, for simulated-patient stress
  testing only. A licensed physician's review is required before any real patient. D18
  does not reach the owner parts recorded under owner_part.
question_origin: >-
  INT-448 (GitHub #759): items of the #642 sign-off packets (docs/signoff/*.md at
  151cf34f) whose row lives in docs/evidence/INT-353.md (sections "Finding → proposal →
  id" and "Review fixes").
author_role: "internal medicine, ENT, ophthalmology, paediatrics, psychiatry and dentistry physician (agent)"
