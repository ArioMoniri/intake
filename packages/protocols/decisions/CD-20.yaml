    siz_register: siz throughout; no sen; no doubled-polite imperative; warmth from -elim/-alım and -ebilirsiniz
    not_a_question: no '?', no mı/mi/mu/mü, no interrogative opening a listener hears as a question
    no_numerals: no digit in tr or en (invariant 22)
