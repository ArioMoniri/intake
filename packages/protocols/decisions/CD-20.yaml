kind: clinical_decision
id: CD-20
title: 'INT-414 delivery lines: cadence, silence, repair and pain lead-ins (rows 10-13, 21-26)'
question: INT-414 (#726) adds conversational delivery lines around each question. Do the cadence lead-ins,
  the silence lines, the repair lines (INT-293's line reused as variant a) and the pain lead-ins pass
  PolicyGuard (no diagnosis, treatment, prognosis, reassurance or minimising), stay B1 plain Turkish in
  the siz register, ask nothing, carry no numeral, and fit the moment they are said?
decision: 'All ten pass unchanged. The cadence lines carry warmth in the -elim/-alım mood and point at
  the question that follows without asking one. The silence lines are true to behaviour: the skipped question
  stays asked and comes back on the screen. The repair lines put the misunderstanding on the system, never
  on the patient. The pain lead-ins show interest in the pain without grading, explaining or reassuring
  it. Each line below is its own entry with its six checks, the author''s verdict and the verifier''s
  verdict; the Turkish is byte-equal to the catalogue key it names.'
status: active
scope: simulated_patient_stress_testing
scope_note: 'Owner decision D18 (INT-432): agent sign-off for simulated-patient testing only. A licensed
  physician''s review is required before any real patient; that requirement is unchanged by this record.'
question_origin: 'INT-447 (#758), split from INT-432 (#735): the HB-C1 table in docs/evidence/INT-414.md
  and the approval:human-clinical label on #726.'
author_role: family medicine physician, patient communication and health literacy (agent; medical author)
