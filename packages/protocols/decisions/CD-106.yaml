inference_disclosure: >-
  The sources fix the constructs and which items are alarm inputs. Removing the reorder op
  once its reason is gone, the single overlap rule for the sweep, and the diyabet recall
  frame are this author's choices made on those sources. Keeping overlapping items apart
  costs a near repeat; merging them would lose a window, a context or a named sign.
value:
  packet_commit: 151cf34f
  items:
    - item: "docs/evidence/verification/reorder-op-582.md#L38"
      ref: "reorder-op A-4 (kadın op order)"
      packets: [kadin_hastaliklari_ve_dogum]
      deciders: [HB-C1]
      question: "Should the kadın reorder op keep its order, which moves four obstetric alarm items from early to 18th-21st, or take the move-the-gate-forward correction?"
      outcome: change
      change: >-
        (1) With CD-100 T4 applied, gebelik_durumu leaves the kadın pack and its five
        readers gate on base pregnancy_status, which base asks before every pack item, so
        no reader precedes its gate: remove the INT-353 reorder op from the kadın candidate,
        and the cluster's authored order stands, with gebelikte_kanama,
        bebek_hareketlerinde_azalma, gebelikte_siddetli_bas_agrisi and
        gebelikte_gorme_bozuklugu early again. (2) Until T4 is applied (it waits on the base
        owner's confirmation), the op takes the review's correction: in ask_order, when a
        reader precedes its gate slot, move the gate slot and its own gate closure to
        directly before the earliest reader, giving the order the review lists, and the two
        unit tests' expected orders change with it. Either way no gate or op names a slot
        that has been removed.
      clinical_basis: "Bleeding, reduced movements, severe headache and visual disturbance in pregnancy are alarm inputs that NICE sends for prompt assessment (A&E for significant bleeding or pain, a healthcare professional immediately for pre-eclampsia symptoms, maternity services at any time of day or night for reduced movements), and the budget governor drops late DETAIL items first, so they keep their early place; what the patient hears today does not change."
      sources: [NICE-NG133, NICE-NG126, NICE-NG201]
      status: active
    - item: "docs/evidence/verification/reorder-op-582.md#L42"
      ref: "reorder-op A-8 (gebelik_sonrasi_ates against kadın ates_var_mi)"
      packets: [cluster_womens_health, kadin_hastaliklari_ve_dogum]
      deciders: [HB-C1]
      question: "Is postpartum fever against recent fever a DISTINCT pair, as the sweep called it?"
      outcome: accept
      clinical_basis: "Accept the correction: the two are an overlap (same construct, different window and scope), recorded as T100, OVERLAP, LOW, code C, and both items stay, because fever since a pregnancy ended is its own alarm context that a recent-fever answer does not carry; the sweep's counts are the lead's bookkeeping."
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
    - item: "docs/evidence/verification/reorder-op-582.md#L43"
      ref: "reorder-op A-9 (borderline calls)"
      packets: [cocuk_enfeksiyon_hastaliklari, cocuk_kardiyolojisi, gebe_poliklinigi, kadin_hastaliklari_ve_dogum, neonatoloji]
      deciders: [HB-C1, HB-C3]
      question: "Are pregnancy bleeding against out-of-period bleeding, and grunting or fast breathing against a generic breathing-difficulty ask, DISTINCT or OVERLAP?"
      outcome: change
      change: >-
        Add one named rule to the sweep's §D: a specific named sign asked beside a generic
        ask that would also capture it is OVERLAP, not DISTINCT, and both items stay.
        (1) gebelikte_kanama against adet_disi_kanama in gebe_poliklinigi and kadın:
        OVERLAP (HB-C1); both stay, adet_disi_kanama ungated as CD-102 decides. (2) In
        cocuk_kardiyolojisi, cocuk_enfeksiyon_hastaliklari and neonatoloji, hizli_nefes and
        inleme against nefes_darligi, nefes_zorlanma or nefes_zorlanmasi: OVERLAP, as chest
        indrawing already is (T47, T56, T86) (HB-C3); every item stays.
      clinical_basis: "Grunting, fast breathing and chest indrawing are each named NICE features, and a parent who sees any of them may also answer a general breathing-difficulty question, so they overlap in the same way; a pregnant woman's bleed is also outside her periods, and the pregnancy item is the alarm input, so neither is merged."
      sources: [NICE-NG143, NICE-NG126, openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
    - item: "docs/evidence/verification/reorder-op-582.md#L44"
      ref: "reorder-op A-10 (sweep T5 cis_miktari)"
      packets: [cluster_child_health, cocuk_endokrinolojisi]
      deciders: [HB-C3]
      question: "How is the non-directional 'as much urine as usual' item fixed?"
      outcome: accept
      clinical_basis: "CD-10 decided it: the item is az_cis, 'Çocuğunuz her zamankinden daha az çiş yapıyor mu?', with 'evet' as the alarm, so a polyuric child answers it 'hayır' and cocuk_endokrinolojisi's sik_bol_idrar 'evet' (as CD-100 T5)."
      sources: [NICE-NG143, NICE-CG84]
      status: active
    - item: "docs/evidence/verification/sibling-rebinds-582.md#L54"
      ref: "sibling-rebinds klinik_psikoloji Q8"
      packets: [klinik_psikoloji_poliklinigi]
      deciders: [psychiatrist]
      question: "With klinik psikoloji Q8 bound to onceki_ruh_sagligi_destegi, the narrower answer opens 'what helped'; how is that fixed?"
      outcome: change
      change: >-
        As CD-104 INT-353.md#L306 (CD-101 T81 (a) to (c)): klinik psikoloji re-declares
        onceki_ruh_sagligi_destegi before Q8 with the cluster text verbatim, Q8 keeps
        onceki_psikoterapi gated ask_if=onceki_ruh_sagligi_destegi == true, and the per-slot
        answer mapping applies.
      clinical_basis: "Past support of any kind and its response is the assessment fact that opens 'what helped'; regular psychotherapy is its detail, asked after a yes."
      sources: [NICE-NG222]
      status: active
    - item: "docs/evidence/verification/sibling-rebinds-582.md#L57"
      ref: "sibling-rebinds göz Q2, Q3, Q4, Q5, Q8"
      packets: [goz_hastaliklari]
      deciders: [HB-C1, clinician]
      question: "How do the unassigned göz items pair with the sensory cluster, and what happens to göz Q6 and Q10?"
      outcome: change
      change: >-
        As CD-104 INT-353.md#L291: Q2 adopts the cluster's gorme_degisikligi text; Q3
        (gecici_ani_gorme_kaybi), Q4 (ucusan_noktalar) and Q5 (isik_cakmasi) stay apart; Q8
        narrows to the skin around the eye (goz_cevresi_kizariklik). Q6 (curtain or shadow)
        and Q10 (double vision) have no cluster twin and stay as göz's own items.
      clinical_basis: "One question per construct: a resolved transient loss, floaters alone, flashes alone and periocular redness are separate facts, and the curtain and double-vision items ask facts the cluster does not."
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1, openEHR-EHR-CLUSTER.symptom_sign.v2]
      status: active
    - item: "docs/evidence/verification/sibling-rebinds-582.md#L60"
      ref: "sibling-rebinds widened or narrowed rebinds"
      packets: [cocuk_enfeksiyon_hastaliklari, cocuk_genetik_hastaliklari, cocuk_metabolizma_hastaliklari, diyabet_poliklinigi, neonatoloji, odyoloji]
      deciders: [clinician]
      question: "Do any of the widened or narrowed rebinds need a change?"
      outcome: change
      change: >-
        One change: diyabet_poliklinigi Q5 takes the cluster's verified text verbatim, "Son
        aylarda istemeden kilo verdiniz mi?" · gen: slot=istemsiz_kilo_kaybi; type=boolean,
        not the diet-premise wording (a dieting patient who lost more than intended would
        answer that one "hayır"; CD-101 T62 already split that construct). The rest stand: uykulu_tepkisiz with "halsiz" keeps the waking item uyandirma_zorlugu
        apart (CD-104 L300); the fever texts follow CD-103 cluster-wave-b.md#L79, with
        neonatoloji's own text; the narrower suregen_tani, the endodontic
        dis_hassasiyeti, and the broader islem_sonrasi_uzun_kanama and ses_kisikligi keep
        the cluster's fact; KBB's blockage half is the cluster's isitme_azalmasi_tikaniklik
        (CD-101 T82).
      clinical_basis: "Unintentional weight loss is judged over months, so 'son zamanlarda' is too vague a frame for the shared id, and the cluster's 'istemeden' asks unintended loss without a diet premise; the other differences keep the same fact within each pack's scope and lose no alarm input."
      sources: [NICE-NG12, openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
    - item: "docs/evidence/verification/sibling-rebinds-582.md#L61"
      ref: "sibling-rebinds fiziksel_tip_ve_rehabilitasyon ates_var_mi"
      packets: [cluster_medical, fiziksel_tip_ve_rehabilitasyon]
      deciders: [owner]
      question: "fiziksel_tip_ve_rehabilitasyon's ates_var_mi near-twins cluster medical son_gunlerde_ates, so the fever is asked twice; who resolves it?"
      outcome: owner_question
      clinical_basis: "Not decided here: CD-101 T68 already gives the clinical answer (fiziksel tıp Q7 is removed and the chain asks the cluster's son_gunlerde_ates once), which leaves only the routing to its owner, as CD-104 INT-353.md#L432."
      status: owner_question
      owner_part: >-
        Cluster-wave-a owner: decide whether fiziksel_tip_ve_rehabilitasyon's ates_var_mi
        rebinds to son_gunlerde_ates so the fever is asked once in that chain, or route it
        to a clinician item.
    - item: "docs/evidence/verification/sibling-rebinds-582.md#L118"
      ref: "sibling-rebinds §C nefes_yutkunma_guclugu override"
      packets: [agiz_dis_ve_cene_cerrahisi]
      deciders: [owner]
      question: "If the owner releases the dental airway item gated, the two ungated re-declarations override the gate in their chains; is that intended?"
      outcome: owner_question
      clinical_basis: "Not decided here; it follows the owner's dental airway posture (CD-103 cluster-wave-b.md#L103)."
      status: owner_question
      owner_part: >-
        Owner: when choosing the dental airway posture, decide whether agiz_dis_ve_cene
        cerrahisi and agiz_dis_cene_radyolojisi keep their ungated nefes_yutkunma_guclugu or
        take the cluster's gate.
