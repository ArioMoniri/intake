# INT-448 clinical decision CD-106: the sign-off packet items (#642, packet commit
# 151cf34f) that come from docs/evidence/verification/sibling-rebinds-582.md and
# reorder-op-582.md. Agent-authored under owner decision D18 (2 Oct 2026). It covers
# simulated-patient stress testing only, and a licensed physician's review is required
# before any real patient. Every source quote below appears verbatim in the named
# snapshot, and every spec_basis quote appears verbatim in the named committed file. This
# is not a pack: the lead applies the item changes to the review-queue proposals. Where
# an item was already settled (CD-10, the feeding ruling, CD-100 to CD-105), this decision
# points to it rather than deciding again. No triage level, route, register, location or
# red-flag rule is created, relaxed or removed here.
kind: clinical_decision
id: CD-106
title: "#642 packet items: sibling rebinds and reorder op"
question: >-
  For each open item that the #642 sign-off packets route from the PR #582 sibling-rebind
  review and the reorder-op review, what is the clinical decision, on what current source,
  and which part stays with the owner?
decision: >-
  Nine items. Accepted (2): postpartum fever and recent fever are an overlap, and both
  items stay; the urine-output item follows CD-10. Changed (5): the kadın reorder op
  loses its reason once CD-100 T4 gates the pregnancy items on base pregnancy_status, so
  the op is removed and the obstetric alarm items keep their authored early place, and
  until T4 is applied the op takes the review's move-the-gate-forward correction; one
  overlap rule covers grunting, fast breathing and chest indrawing against a generic
  breathing-difficulty ask, and a pregnancy bleed against an out-of-period bleed, with all
  items kept; klinik psikoloji follows CD-104 L306 (CD-101 T81); göz follows CD-104 L291;
  of the widened or narrowed rebinds only diyabet's weight-loss window changes, to "son
  aylarda", and the rest stand as settled. Two items are owner questions (the FTR fever
  near-twin, and the dental airway override side effect).
status: active
scope: simulated_patient_stress_testing
scope_note: >-
  Owner decision D18 (2 Oct 2026): agent-only sign-off, for simulated-patient stress
  testing only. A licensed physician's review is required before any real patient. D18
  does not reach the owner parts recorded under owner_part.
