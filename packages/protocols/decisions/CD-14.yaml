source_gap: >-
  V-NF-2: no retrieved current guideline states an action for the combination of
  swelling, fluid weight gain and foamy urine. NICE NG203's referral criteria are
  laboratory values (ACR, eGFR), the NIDDK nephrotic-syndrome page (N-S4) is a lay
  description without an action, and NICE CKS (nephrotic syndrome) returned HTTP 403 on
  2026-10-03 and was not bypassed. V-HM-1: the method for capturing a percentage of body
  weight lost over a period without free numeric entry, and the Turkish routes for both
  arms, are not set by any retrieved source.
