kind: clinical_decision
id: CD-14
title: "Source anchoring for V-HM-1 (B symptoms), V-NF-2 (swelling, weight gain and foamy urine) and V-FTVR-4 (NG59 decompression)"
question: >-
  HB-C1 source anchoring for three rows. V-HM-1: hematoloji red-flag row 4
  (rf.hematoloji_b_belirtileri) is anchored on a lymphoma staging definition and a CLL
  treatment-start criterion; what referral source should anchor it? V-NF-2: nefroloji
  row 4 (rf.nefroloji_sislik_kilo_kopuk) rests on a lay symptom list with no action;
  does any source state an action for the combination? V-FTVR-4: fiziksel tıp Q15a and
  Q15b cite NICE NG59 through an NHS commissioning policy; what is the spinal
  decompression recommendation's number and wording in the primary text?
decision: >-
  V-HM-1 (haematology): row 4 is split into two arms, and neither is anchored on H-S3.
  The weight-loss arm is anchored on NICE NG12 1.13.2 (a 2026 recommendation): people
  aged 60 and over with unexplained weight loss of more than 5% within six months get
  urgent investigation, a suspected cancer pathway referral or a non-specific symptoms
  pathway referral. That arm belongs to the universal base family
  rf.weight_loss_unintentional (CD-13), not to the hematoloji stub. How the percentage
  is captured stays draft_needs_source, because no item can capture it without free
  numeric entry. The night-sweats arm is anchored on the Scottish Referral Guidelines
  for Suspected Cancer 2025: an adult with unexplained drenching night sweats is
  considered for urgent clinical assessment including a full blood count. The arm
  stays in the hematoloji stub, triggered by gece_terlemesi asked in its drenching
  form; no duration threshold is part of the trigger, because the source sets none.
  NG12 lists night sweats only as an associated symptom of lymphadenopathy. That
  combination is row 3, which gains 1.10.6 beside 1.10.8. H-S3 stays as provenance for
  Q10a and Q11a only. The verifier's suggested H-S4 anchor is not used: it is the
  January 2019 Scottish guide, which the 2025 guidelines replaced. "Unexplained" is a
  clinician's finding in NG12's own definition, so the pre-visit records the report
  and never asserts it.
  V-NF-2 (nephrology): stays draft_needs_source. No retrieved current source states an
  action for swelling with weight gain and foamy urine. NICE NG203 1.5.5 refers on
  laboratory values (ACR), the NIDDK page is a lay description without an action, and
  the NICE CKS nephrotic-syndrome page returned HTTP 403 and was not bypassed. Row 4
  stays a candidate that is not compiled, and the three items stay symptom capture for
  the note.
  V-FTVR-4 (physical medicine and rehabilitation): confirmed. The recommendation is NICE
  NG59 1.3.8, verbatim on nice.org.uk (NG59 published 30 November 2016, last updated 29
  July 2026; 1.3.8 is marked [2016] and the July 2026 update did not touch it). Q15a
  and Q15b now cite the primary text; the commissioning-policy reproduction (S5) is
  retired as their source. NG59 is never cited for cauda equina (files/04 §8.2).
status: active
scope: simulated_patient_stress_testing
author_role: "haematology, nephrology and physical medicine and rehabilitation physician (agent)"
