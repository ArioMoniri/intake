      deciders: [HB-C3]
      question: "Cluster beslenme_sivi_alimi (feeding as usual) against çocuk enfeksiyon Q4 emebiliyor_icebiliyor (able to breastfeed or drink, the IMCI danger sign): which construct?"
      outcome: change
      change: >-
        Remove emebiliyor_icebiliyor; the chain inherits az_beslenme and
        icemez_ememez. Both constructs are asked, ungated, under CD-10's
        true_is_concern: the cluster's az_beslenme, "Çocuğunuz her zamankinden daha
        az besleniyor ya da içiyor mu?" (T9), and CD-103's icemez_ememez, "Çocuğunuz
