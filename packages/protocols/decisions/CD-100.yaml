value:
  packet_commit: 151cf34f
  trail: docs/evidence/verification/near-twin-sweep-582.md
  outcome_meaning:
    accept: "the twin is real; both slots stay unchanged under their own ids because each records a fact the other does not"
    change: "apply the exact change given; the lead edits the proposal and regenerates the candidate"
    owner_question: "every decider is the owner or the base owner; recorded, not decided (D18)"
  renaming_rule: "a narrowed slot takes a new id whenever its old id names the part removed; generated soru_N ids after a removed item are pinned with explicit slot= names so no other id moves"
  items:
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L94"
      ref: T1
      packets: [kadin_hastaliklari_ve_dogum]
      deciders: [HB-C1, base owner]
      question: "Base lmp_date and kadın hastalıkları ve doğum Q2 son_adet_tarihi ask the same LMP date; which stays, and for whom?"
      outcome: change
      change: >-
        One LMP date, under base pmh_fh_sh.lmp_date (the id of record). In the
        kadin_hastaliklari_ve_dogum chain it is asked of every patient, not only
        when pregnancy_status != 'hayir'. Order of work: first, base lmp_date is
        asked without that gate in this chain (owner_part). Then remove proposal Q2
        (gen: slot=son_adet_tarihi; type=date) from
        docs/evidence/proposals/kadin_hastaliklari_ve_dogum.md, and remove
        son_adet_tarihi from the order list of the candidate's INT-353 reorder op
        (ops[0], pointer /sections/sorular/slots, at 151cf34f), wherever the
        candidate carries that op. Until the first step lands,
        son_adet_tarihi stays unchanged, so no patient loses the LMP ask. No Turkish
        text changes.
      clinical_basis: >-
        A woman of reproductive age may be pregnant even when her symptoms are
        non-specific and she does not expect it (NG126 1.4.5), and a missed period is
        a common symptom of ectopic pregnancy (NG126 1.4.3). So the gynaecology chain
        needs the LMP date whatever the pregnancy answer, asked once.
      sources: [NICE-NG126]
      spec_basis_ref: ["packages/protocols/base/intake.yaml pmh_fh_sh.lmp_date"]
      status: active
      owner_part: >-
        Base owner: base lmp_date carries ask_if pregnancy_status != 'hayir'. The
        generator writes branch slots only in sorular, so a branch item cannot replace
        or re-gate the base slot by its id (§C code B). Will
        base ask lmp_date without that gate in the women's-health chains (or in every
        chain), or will base offer a chain-level way to widen it? The clinical
        requirement is that every patient in this chain is asked.
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L95"
      ref: T2
      packets: [_cross-cutting]
      deciders: [base owner, owner]
      question: "The generator's fixed ziyaret_baglami.basvuru_nedeni re-asks base chief_complaint_text in all 91 chains; which goes?"
      outcome: owner_question
      clinical_basis: "Not decided here: every decider is non-clinical, which D18 does not reach (§C code F)."
      status: owner_question
      owner_part: >-
        Owner and base owner: the reason for the visit is asked twice in every chain,
        by the generator's fixed slot ziyaret_baglami.basvuru_nedeni and by base
        chief_complaint_text. Should the generator drop the fixed reason slot where
        base already asks it (the reason-dedup requirement, cluster-wave-b §E-7), or
        should base change?
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L96"
      ref: T3
      packets: [_cross-cutting]
      deciders: [base owner, owner]
      question: "The generator's fixed ziyaret_baglami.sikayet_suresi re-asks base duration in all 91 chains; which goes?"
      outcome: owner_question
      clinical_basis: "Not decided here: every decider is non-clinical, which D18 does not reach (§C code F)."
      status: owner_question
      owner_part: >-
        Owner and base owner: complaint duration is asked twice in every chain, by
        the generator's fixed slot ziyaret_baglami.sikayet_suresi and by base
        duration. Should the generator omit the fixed duration slot where base asks
        it (duration=omit, cluster-wave-b §E-4), or should base change?
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L97"
      ref: T4
      packets: [kadin_hastaliklari_ve_dogum]
      deciders: [HB-C1, base owner]
      question: "Base pregnancy_status (evet/hayır/emin değilim) and kadın Q3 gebelik_durumu (boolean) ask the same thing, and the boolean gates five pregnancy items; which is the gate?"
      outcome: change
      change: >-
        (a) Remove proposal Q3 (gebelik_durumu) from
        docs/evidence/proposals/kadin_hastaliklari_ve_dogum.md, and remove
        gebelik_durumu from the order list of the candidate's INT-353 reorder op
        (ops[0], pointer /sections/sorular/slots, at 151cf34f), wherever the
        candidate carries that op. (b) The five items now gated on
        gebelik_durumu == true (gebelikte_kanama, gebelikte_siddetli_bas_agrisi,
        gebelikte_gorme_bozuklugu, bebek_hareketlerinde_azalma, gebelikte_su_gelmesi)
        are gated instead on ask_if=pregnancy_status != 'hayir', the gate the
        cluster's gebelik_dogrulandi already reads. "emin değilim" now opens them.
        (c) Answer mapping for pmh_fh_sh.pregnancy_status, a per-slot entry beside
        CD-04's '*' rows: "bilmiyorum" and any hedge (for example "sanmıyorum",
        "galiba", "olabilir", "bilemiyorum") are recorded as the "emin değilim"
        choice, never as UNCLEAR and never as "hayır". Only a plain "hayır" is
        "hayır". UNCLEAR would make pregnancy_status != 'hayir' Unknown, and an
        Unknown gate opens nothing (files/13 §9.2), so an unsure woman would never
        hear the five items. The answer is still the patient's direct answer to the
        scripted question (CD-02). Steps (b) and (c) widen the gate and add askers,
        so they only tighten (invariant 7). No red-flag rule and no Turkish text
        change.
      clinical_basis: >-
        A woman who is unsure whether she is pregnant must be treated as possibly
        pregnant (NG126 1.4.5). Ectopic pregnancy must be excluded even without risk
        factors (NG126 1.4.8). The boolean drops the unsure answer that base keeps,
        and an unsure or "bilmiyorum" answer must open the pregnancy items rather
        than leave them unasked.
      sources: [NICE-NG126]
      spec_basis_ref: ["packages/protocols/base/intake.yaml pmh_fh_sh.pregnancy_status", "packages/protocols/review/cluster/womens_health.yaml sorular.gebelik_dogrulandi", "files/13_QUESTION_FLOW.md §9.2", "packages/protocols/decisions/CD-04.yaml decision"]
      status: active
      owner_part: >-
        Base owner: confirm that base pregnancy_status, with its "emin değilim"
        answer, is the pregnancy gate of record that branch items may read. Confirm
        that it is asked before every branch item gated on it (the gatekeeper
        ordering the base pack records the DSL cannot yet express). Then the INT-353
        reorder op in this candidate can be re-examined.
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L98"
      ref: T5
      packets: [cluster_child_health, cocuk_endokrinolojisi]
      deciders: [HB-C3]
      question: "Cluster cis_miktari ('as much urine as usual') is answered 'hayır' for less and for more urine, so a polyuric child reads in the reduced-urine alarm direction next to cocuk_endokrinolojisi sik_bol_idrar; what fixes it?"
      outcome: change
      change: >-
        CD-10's change, already applied on this branch: the cluster's cis_miktari is
        az_cis, "Çocuğunuz her zamankinden daha az çiş yapıyor mu?" (gen: slot=az_cis;
        type=boolean). cocuk_endokrinolojisi sik_bol_idrar stays unchanged. A polyuric
        child now answers az_cis "hayır" and sik_bol_idrar "evet".
      clinical_basis: >-
        Decreased urine output is a dehydration finding (CG84 1.2.1.1; NG143 1.2.6).
        Polyuria is a separate sign of the opposite direction (NG18 1.1.1). One
        directional item each keeps them apart.
      sources: [NICE-CG84, NICE-NG143, NICE-NG18, openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L99"
      ref: T6
      packets: [cluster_medical, ic_hastaliklari]
      deciders: [HB-C1, clinician]
      question: "İç hastalıkları Q4 (unexplained fever, 'son zamanlarda') overlaps cluster son_gunlerde_ates (any fever, 'son günlerde'); merge or keep?"
      outcome: accept
      clinical_basis: >-
        Unexplained fever over the recent weeks is its own referral feature (NG12
        1.10.1), not the same fact as any fever in the last days. Both stay under
        their own ids; merging would lose the 'unexplained' qualifier or the window.
        Q4's id is the one CD-102 (cluster-wave-a.md#L243) gives it,
        nedenini_bilmedigi_ates (soru_3 at 151cf34f), a non-asserting name.
        "Unexplained" is the clinician's finding in NG12's own definition, so the
        patient's "nedenini bilmediğiniz" answer is recorded as the patient's report
        and never asserted as NG12's term (as CD-14).
      sources: [NICE-NG12]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L100"
      ref: T7
      packets: [cluster_child_health, cocuk_gastroenterolojisi]
      deciders: [HB-C3, paediatrician]
      question: "Cluster cis_miktari and cocuk_gastroenterolojisi az_cis have opposite polarity; which polarity, and is the fact asked once?"
      outcome: change
      change: >-
        CD-10's change, already applied on this branch: true_is_concern. The
        cluster's item is az_cis, "Çocuğunuz her zamankinden daha az çiş yapıyor
        mu?". cocuk_gastroenterolojisi's az_cis has the same id and text, so its
        re-declaration replaces the cluster slot and the fact is asked once.
      clinical_basis: >-
        The sources state the finding in its abnormal direction and ask whether it is
        present (CG84 1.2.1.1; NG143 1.2.6). "Evet" records it (symptom_sign_screening
        Presence).
      sources: [NICE-CG84, NICE-NG143, openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L101"
      ref: T8
      packets: [cluster_child_health, cocuk_nefrolojisi]
      deciders: [HB-C3]
