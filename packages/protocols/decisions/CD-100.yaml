        separate, narrower item (marked reduction or near-absence) with the same
        polarity.
      clinical_basis: >-
        Decreased urine output is the screening finding (CG84 1.2.1.1). Marked
        reduction is a narrower threshold that a renaming would erase.
      sources: [NICE-CG84, NICE-NG143]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L102"
      ref: T9
      packets: [cluster_child_health, neonatoloji]
      deciders: [HB-C3]
      question: "Cluster beslenme_sivi_alimi ('feeding as usual', false is the concern) and neonatoloji beslenmede_azalma ('feeding less', true is the concern) are an opposite-polarity twin; which construct and polarity?"
      outcome: change
      change: >-
        Feeding construct, under CD-10's true_is_concern. (a) cluster.child_health
        and cocuk_sagligi_ve_hastaliklari: beslenme_sivi_alimi becomes az_beslenme,
        "Çocuğunuz her zamankinden daha az besleniyor ya da içiyor mu?" (gen:
        slot=az_beslenme; type=boolean). (b) neonatoloji: beslenmede_azalma takes the
        shared id and keeps its own infant text, "Bebeğiniz son günlerde her
        zamankinden daha az mı besleniyor?" (gen: slot=az_beslenme; type=boolean). Its
        re-declaration replaces the cluster slot, so the fact is asked once. Both
        stay ungated. (c) The IMCI general danger sign is asked directly and ungated
        by icemez_ememez (CD-103, cluster-wave-b.md#L75: "Çocuğunuz hiçbir şey içemez
        ya da ememez hâle geldi mi?") beside az_beslenme. No stopped-completely
        follow-up is added: beslenmeyi_birakma, proposed in round 1, is withdrawn
        and superseded by icemez_ememez, in every pack including neonatoloji
        (verifier's feeding-construct ruling, round 2). (d) Answer semantics for
        az_beslenme: an answer that the child is not feeding or drinking at all
        ("hiç içmiyor", "hiçbir şey almıyor", "emmiyor", "hiç yemiyor"), even when it
        starts with "hayır", is az_beslenme = evet (ASKED_PRESENT), never "hayır".
      clinical_basis: >-
        Poor feeding in infants is an intermediate-risk feature (NG143 1.2.6). Not
        being able to drink or breastfeed is an IMCI general danger sign for children
        aged two months up to five years. The two are different thresholds, not
        twins, so both are asked: icemez_ememez asks the danger sign, and under two
        months az_beslenme is itself IMCI's young-infant "Not feeding well" sign. An
        infant who stopped breastfeeding during the illness is at increased risk (CG84
        1.2.1.2). A child who takes nothing at all is feeding less than usual, so that
        answer to az_beslenme can never read as "hayır".
      sources: [NICE-NG143, WHO-IMCI-CHART-2014, NICE-CG84, openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L103"
