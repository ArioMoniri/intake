        so the fact is asked once.
      clinical_basis: >-
        Fewer wet nappies is decreased urine output in a nappy-wearing infant (CG84
        1.2.1.1; NG143 1.2.6). It is one fact with one polarity.
      sources: [NICE-CG84, NICE-NG143]
      status: active
