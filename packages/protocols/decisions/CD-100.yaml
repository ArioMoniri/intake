    - item: "docs/evidence/verification/near-twin-sweep-582.md#L109"
      ref: T16
      packets: [agiz_dis_ve_cene_cerrahisi]
      deciders: [HB-C1]
      question: "Ağız, diş ve çene cerrahisi Q12 re-asks drug allergy (base allergies) and adds local anaesthetic and latex; drop or narrow?"
      outcome: change
      change: >-
        Narrow proposal Q12 to the substances base does not name: "Diş uyuşturma
        iğnesine ya da lateks eldivene alerjiniz var mı?" (gen:
        slot=lokal_anestezik_lateks_alerjisi; type=boolean), a yes/no ask with the
        same id, type and text as diş hekimliği and endodonti (T23). The id changes
        because the old id names the drug half that was removed.
      clinical_basis: >-
        Base allergies is the one record for every substance class (adverse_reaction_risk
        v2), and it records drug-allergy status (CG183 1.2.1). Latex is a substance of
        that same record, and the dental anaesthetic is a lay prompt this procedure
        needs.
      sources: [openEHR-EHR-EVALUATION.adverse_reaction_risk.v2, NICE-CG183]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L110"
      ref: T17
      packets: [_cross-cutting]
      deciders: [base owner]
      question: "Base onset_date and base duration are both must_ask and record when the complaint began (date against duration); keep both?"
      outcome: owner_question
      clinical_basis: "Not decided here: the only decider is the base owner, which D18 does not reach (base-internal, §C code B)."
      status: owner_question
      owner_part: >-
        Base owner: onset_date ("Bu şikâyetiniz ne zaman başladı?") and duration
        ("Şikâyetiniz başladığından beri ne kadar sürüyor?") are both base must_ask and
        record the same fact. Should base keep both, or ask one and derive the other?
        Note: onset_date is the tense_anchor of the base red-flag rules, so any change
        keeps a date.
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L111"
      ref: T18
      packets: [anesteziyoloji]
      deciders: [HB-C1]
      question: "Anesteziyoloji Q4 re-asks drug allergy (base allergies) and adds latex; drop or narrow?"
      outcome: change
      change: >-
        Narrow proposal Q4 to latex: "Lateks eldivene alerjiniz var mı?" (gen:
        slot=lateks_alerjisi; type=boolean), a yes/no ask. The id changes because the
        old id names the drug half that was removed. The drug, including any
        anaesthetic drug, is captured by base allergies.
      clinical_basis: >-
        Drug-allergy status is one record (CG183 1.2.1; adverse_reaction_risk v2),
        which base allergies asks. Latex is a named substance of that record, and
        operating theatres use it, so the prompt stays.
      sources: [openEHR-EHR-EVALUATION.adverse_reaction_risk.v2, NICE-CG183]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L112"
      ref: T19
      packets: [asi]
      deciders: [HB-C1]
      question: "Aşı Q4 asi_bileseni_alerjisi (serious allergy to egg, gelatin or a drug) overlaps base allergies; drop or keep?"
      outcome: accept
      clinical_basis: >-
        A confirmed anaphylactic reaction to a component of the relevant vaccine is a
        contraindication to that vaccine (Green Book chapter 6). The chapter names egg,
        gelatine and neomycin, streptomycin or polymyxin B as components. So this is
        vaccine contraindication screening, not the general allergy list, and both
        stay.
      sources: [UKHSA-GREENBOOK-CH6-2017, openEHR-EHR-EVALUATION.adverse_reaction_risk.v2]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L113"
      ref: T20
      packets: [beslenme_ve_diyet]
      deciders: [HB-C1]
      question: "Beslenme ve diyet Q9 besin_alerjisi (food that disagrees or causes allergy) overlaps base allergies ('madde'); drop or keep?"
      outcome: accept
      clinical_basis: >-
        Food is a substance class of the same allergy record (adverse_reaction_risk v2),
        but base names only drugs and 'madde'. The dietitian needs the foods avoided
        and why (CG116 1.1.3), including intolerance ('dokunan'). Both stay.
      sources: [openEHR-EHR-EVALUATION.adverse_reaction_risk.v2, NICE-CG116]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L114"
      ref: T21
      packets: [cocuk_immunolojisi_ve_alerjisi]
      deciders: [HB-C3]
      question: "Çocuk immünolojisi ve alerjisi Q12 bilinen_tetikleyici (the child's food, drug or sting allergy) overlaps base allergies; drop or narrow?"
      outcome: accept
      clinical_basis: >-
        Base allergies asks the speaker about themselves ("alerjiniz"). In a child chain
        it therefore does not reliably ask about the child, and the branch item is the
        only ask for the child's allergens to avoid (CG116 1.1.3). Food and venom are
        substances of the same record (adverse_reaction_risk v2). Both stay. Its drug
        half can be dropped once proxy copy exists, which is the owner's self/proxy
        decision.
      sources: [NICE-CG116, openEHR-EHR-EVALUATION.adverse_reaction_risk.v2]
      spec_basis_ref: ["packages/protocols/base/intake.yaml chest_pain.present (proxy stop-gap)"]
      status: active
