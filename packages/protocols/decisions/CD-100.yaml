  # Round 4: amendments after the round-3 verdict. Each keeps the item it amends
  # unchanged above (its history) and says what now applies. The independent
  # verifier's round-4 verdict is recorded in each entry's `verification` and in
  # `verifier`.
  amendments:
    - round: 4
      date: 2026-10-16
      issue: "INT-519 (GitHub #885) item 4"
      item: "docs/evidence/verification/near-twin-sweep-582.md#L94"
      ref: T1
      amends: owner_part
      premise_corrected: >-
        T1's owner part assumed base lmp_date carried pregnancy_status != 'hayir' and so
        closed on a plain "hayır". It never closed: 'hayir' matched no answer, and since
        INT-441 the gate names the three authored answers. Base asks the LMP after every
        answer to pregnancy_status, in every chain.
      re_read: >-
        The base step T1 asked for ("base lmp_date is asked without that gate in this
        chain") is met for every patient who answers pregnancy_status. The three-answer
        gate stays and is never narrowed to != 'hayır': a woman who answers "hayır" may
        still be pregnant (NG126 1.4.5), and a missed period is a common ectopic symptom
        (NG126 1.4.3). The remaining gap is a pregnancy_status that is unanswered,
        declined or UNCLEAR (an off-choice answer that T4(c)'s hedge mapping does not
        reach). Every term of the three-answer gate is then Unknown, an Unknown gate opens
        nothing (files/13 §9.2), and the LMP is not asked.
      decision: >-
        The gap is closed by CD-110's population guard (PR #804, INT-470), re-spelled as
        an extra OR term on the three-answer gate (gate_shape), never on != 'hayır' or
        'hayir'. The guard decides only when pregnancy_status is Unknown, so it only ever
        adds askers and never removes the LMP after any of the three answers. This keeps
        what CD-110's gate does as written ('hayir' matches no answer, so its first term
        is true after every answer). It does not carry CD-110's prose reading that a
        plain "hayır" from a recorded male sex at birth or a recorded age outside the
        bounds skips the LMP: under the corrected premise that would ask fewer patients
        than base asks today, and its age bounds are draft_needs_source in CD-110. While
        those bounds are draft, the age atom is left out, because it can only narrow
        (gate_shape_while_age_bounds_draft). The atoms are bound as CD-110 says: two-valued,
        from recorded demographics, false when nothing is recorded, never through the slot
        lookup.
      gate_shape: "pregnancy_status == 'evet' || pregnancy_status == 'hayır' || pregnancy_status == 'emin değilim' || (recorded_male_sex_at_birth == false && recorded_age_outside_bounds == false)"
      gate_shape_while_age_bounds_draft: "pregnancy_status == 'evet' || pregnancy_status == 'hayır' || pregnancy_status == 'emin değilim' || (recorded_male_sex_at_birth == false)"
      applies_when: "CD-110 (PR #804, INT-470) has landed and its guard prerequisites exist (the GuardExpr function sex_at_birth and the two-valued atom binding); until then base keeps the three-answer gate and the gap stays open"
      kadin_q2: "son_adet_tarihi (proposal Q2) leaves the kadın chain once the OR term is applied; until then it stays, because it is the only ask that reaches a woman whose pregnancy_status is Unknown"
      respelling: "whichever of INT-519 and INT-470 merges second re-spells CD-110's gate_shape and opens_on to this form, and CD-110's and CD-100.md's quotes to the authored literals"
      paediatric_note: "no paediatric extrapolation: every under-18 session is refused (INT-223, HB-L20), so no child is asked the LMP through this gate until the guardian path and its proxy copy exist, and the age atom's bounds stay CD-110's open literal"
      safety_direction: "never fewer askers than today: every answer still opens the LMP, and the guard adds the patients whose pregnancy answer is missing or UNCLEAR unless a recorded fact excludes them"
      red_flag_gate_input: "lmp_date gates the pregnancy family (rf.pregnancy_bleeding_pain, HB-C6), so applying the OR term runs the goldens with near-miss controls and make safety in the same change (CD-110 T1 (5))"
      sources: [NICE-NG126]
      status: active
      verification:
        round: 4
        date: 2026-10-16
        head: 9034f8b9
        reviewer: "independent D18 clinical verifier (agent; EM/IM/O&G/psychiatry)"
        verdict: agree
        findings: >-
          Agree, including the author's departure to leave the age atom out while CD-110's
          age bounds are draft. The corrected premise holds: base intake.yaml lmp_date
          reads the three authored answers, so every answer opens it today. Under Kleene
          logic the OR term decides only when pregnancy_status is Unknown, so the gate can
          only add askers; without the age atom the term is true for everyone not recorded
          male at birth, which asks more and never fewer. NICE NG126 1.4.5 ('they may be
          pregnant') and 1.4.3 ('amenorrhoea or missed period' among the common symptoms)
          were re-read on the live NICE page on 2026-10-16. Note for whoever adds the age
          atom once CD-110's bounds are sourced: that step narrows against this shape, so
          it is a decision of its own, and CD-110 T1 (4)'s condition applies again to the
          kadın chain (son_adet_tarihi stays while an age bound would leave a woman in the
          chain unasked); kadin_q2 above holds for the atom-free shape. Today's
          behaviour of asking the LMP after a recorded male's plain 'hayır' is kept;
          dropping it would be a narrowing and is not decided here.
    - round: 4
      date: 2026-10-16
      issue: "INT-519 (GitHub #885) item 3"
      item: "docs/evidence/verification/near-twin-sweep-582.md#L97"
      ref: T4
      amends: "change (b)"
      decision: "T4 (b)'s five items are gated on pregnancy_status != 'hayır', the authored literal CD-112 item 3 decides; the 'hayir' spelling in change (b) above is the pre-INT-441 one and is history"
      gate: "pregnancy_status != 'hayır'"
      decided_in: CD-112
      sources: [NICE-NG126]
      status: active
      verification:
        round: 4
        date: 2026-10-16
        head: 9034f8b9
        reviewer: "independent D18 clinical verifier (agent; EM/IM/O&G/psychiatry)"
        verdict: agree
        findings: >-
          Agree. 'hayır' is a member of vs.pregnancy_status and 'hayir' is not, so the
          authored literal gives change (b) the reading T4 decided ('emin değilim' opens
          the five items, a plain 'hayır' closes them). No triage rule reads any of the
          five items, and a woman who answers 'hayır' is still asked the LMP (T1 round 4)
          and the ungated adet_disi_kanama and alt_karin_agrisi that both the
          women's-health cluster and the kadın chain carry.
verifier:
  verdict: agree
