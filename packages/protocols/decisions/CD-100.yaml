# INT-448 clinical decision CD-100 (GitHub #759). Agent-authored under owner
# decision D18 (2 Oct 2026): simulated-patient stress testing only; a licensed
# physician's review is required before any real patient. Every source quote
# below appears verbatim in the named snapshot; spec_basis quotes appear verbatim
# in the named committed file. Not a pack: the lead applies each change to the
# proposal (docs/evidence/proposals/<slug>.md) and regenerates the candidates.
# No triage level, route, register, location or red-flag rule is created,
# changed or removed here. The only gate change (T4) asks more patients, never
# fewer (invariant 7).
kind: clinical_decision
id: CD-100
title: "#642 packet items: near-twin sweep T1–T50"
question: >-
  For each of the fifty near-twin rows T1–T50 of the near-twin sweep
  (docs/evidence/verification/near-twin-sweep-582.md at 151cf34f, filed in the
  #642 sign-off packets), where two slots in one extends chain ask the same or an
  overlapping fact, which slot stays, which is dropped or narrowed, and with what
  Turkish text, or which part belongs to the owner?
decision: >-
  Each row gets one outcome. accept means the twin is real but both slots stay
  unchanged under their own ids, because each records a fact the other does not
  (the §C "keep under its own id" path). change means the exact slot, text or gate
  change given in the row. owner_question means every decider is the owner or the
  base owner, which D18 does not reach, so the row is recorded as a question and
  not decided. Outcomes: 10 accept, 32 change, 8 owner_question, 0 reject,
  0 draft_needs_source. Four rules decide most rows. (1) A base must_ask slot is
  the id of record and cannot be suppressed, so a branch item that re-asks it
  word for word (course since onset, complaint location, what was tried) is
  removed, and one whose extra half is clinically distinct keeps only that half:
  the base allergy item is one record for every substance class
  (openEHR adverse_reaction_risk), so dental, anaesthesia and dermatology items
  keep only the procedure-relevant substances; drug intolerance is a separate
  record from drug allergy (NICE CG183 1.2.5), so the diabetes, endocrinology and
  internal-medicine items keep only the non-allergic reaction; and the
  anticoagulant half of a medicine item goes to base anticoagulant_use. (2) A
  branch umbrella that names a cluster item drops what the cluster asks: the
  family-medicine chronic-disease umbrella asks only for other diseases, the
  pain-clinic impact item keeps work and sleep (NICE NG193 1.1.8), and the AMATEM
  item keeps health harm (NICE CG115 1.2.2.6). (3) Hydration and feeding items in
  child_health follow CD-10's true_is_concern polarity. The urine rows are CD-10's
  change, already applied. The feeding construct CD-10 left open is decided here:
  one shared az_beslenme ask for feeding or drinking less than usual (NICE NG143
  "poor feeding in infants"), asked ungated beside CD-103's icemez_ememez, which
  asks the IMCI general danger sign directly (the verifier's ruling: different
  thresholds, not twins). An answer that the child takes nothing at all is a yes,
  never "hayır". Under two months a yes is itself IMCI's young-infant "not feeding
  well" sign. (4) Kept pairs are distinct constructs on a
  source: unexplained against recent fever (NG12 1.10.1), vaccine-component
  allergy and acute illness on the day of vaccination (Green Book chapter 6), the
  child allergen list while base is self-addressed, food intolerance for the
  dietitian, any vomiting against vomiting everything, a new lump anywhere
  against a lump in the complaint area, faltering weight against growth concern,
  prior substance-use treatment against prior mental-health support, and
  breathing effort against chest indrawing. In women's health the LMP and the
  pregnancy gate are each asked once under the base id. The pregnancy-gated items
  open on pregnancy_status != 'hayir', so "emin değilim" now opens them (NICE
  NG126 1.4.5). On pregnancy_status, "bilmiyorum" and every hedge are recorded as
  "emin değilim", never UNCLEAR, because an Unknown gate opens nothing (files/13
  §9.2). This asks more patients, never fewer. The removed slots also leave the
  INT-353 reorder op's order list. The base-side mechanics of the LMP and the
  pregnancy gate are owner parts. Renamed slots take a new id whenever the old id names the part
  removed, so a stale reader fails at compile time instead of misreading. Generated
  soru_N ids after a removed item are pinned with explicit slot= names so no other
  id moves. Round 4 amendment (INT-519 item 4, 16 Oct 2026), T1 re-read on the
  corrected premise. Base lmp_date never closed on a plain "hayır": its 'hayir'
  literal matched no answer, and since INT-441 its gate names the three authored
  answers. So base already asks the last menstrual period after every answer to
  pregnancy_status, in every chain, and the base step T1 asked for is met for every
  patient who answers. The three-answer gate stays and is never narrowed to
  != 'hayır'. The remaining gap is a pregnancy_status that is unanswered, declined or
  UNCLEAR: every term of the gate is then Unknown and the LMP is not asked. CD-110's
  population guard (PR #804) closes it as an extra OR term on the three-answer gate,
  so the guard only ever adds askers. While CD-110's age bounds are draft, the age
  atom, which can only narrow, is left out. The kadın Q2 son_adet_tarihi goes once
  that OR term is applied. CD-112 item 3 gives the T4(b) gate its authored literal,
  pregnancy_status != 'hayır'.
status: active
scope: simulated_patient_stress_testing
scope_note: >-
  Owner decision D18 (2 Oct 2026): agent-only sign-off, for simulated-patient
  stress testing only. A licensed physician's review is required before any real
  patient. D18 does not reach the owner and base-owner parts; they are recorded
  as owner questions in owner_part and in the eight owner_question rows.
question_origin: >-
  #642 sign-off packets at 151cf34f; docs/evidence/verification/near-twin-sweep-582.md
  §A rows T1–T50 and §C resolution codes B, C, F, P and S (at 151cf34f, not on main).
author_role: "internal medicine, obstetrics and gynaecology, paediatrics, psychiatry, anaesthesiology, dentistry and family medicine physician (agent)"
inference_disclosure: >-
  The sources fix each construct. The Turkish wording, the choice to narrow
  rather than drop an item, and the new slot ids are this author's
  representation decisions. Every
  new Turkish string is ≤ B1, uses siz, has one question mark and no digits, and
  names no diagnosis. NICE CG116 is scoped to under 19s. It is cited for the
  dietitian item only as the source that names food avoidance as a history
  element. CG115 covers alcohol, and AMATEM also sees other substances.
