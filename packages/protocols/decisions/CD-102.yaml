# INT-448 clinical decision CD-102: the sign-off packet items (#642, packet commit
# 151cf34f) that come from docs/evidence/verification/cluster-wave-a.md. Agent-authored
# under owner decision D18 (2 Oct 2026). It covers simulated-patient stress testing only,
# and a licensed physician's review is required before any real patient.
# Every source quote below appears verbatim in the named snapshot, and every spec_basis
# quote appears verbatim in the named committed file. This is not a pack: the lead applies
# the item changes to the review-queue proposals. No triage level, route, register,
# location or red-flag rule is created, relaxed or removed here.
kind: clinical_decision
id: CD-102
title: "#642 packet items: cluster wave A verification"
question: >-
  For each open item that the #642 sign-off packets route from the cluster wave A
  verification (medical, surgical, sensory and women's health clusters), what is the
  clinical decision, on what current source, and which part stays with the owner?
decision: >-
  Thirteen items. Accepted (4): the women's health heavy-period and between-period
  bleeding items stay ungated for pregnant patients; the sensory cluster takes no domain
  gates, because sudden hearing loss and sudden dizziness with new deafness or
  unsteadiness are time-critical whatever the booking; el_cerrahisi keeps its rebind to
  travma_sonrasi_basladi; odyoloji's dizziness-or-imbalance item stays apart from the
  cluster's spinning item. Changed (4): surgical Q9 keeps its reworded text, its source
  anchors move to the TARD 2025 comorbidity sections, and a stroke or transient stroke
  history item is added because TARD postpones elective surgery after one; cluster.medical
  gains the ungated hyperglycaemia-with-vomiting input, because TEMD 2026 records DKA as
  the first sign of diabetes in many patients (a note input only; a DKA rule, when
  written, sits in base.life_threat on a base-level slot); the pregnancy swelling item
  returns to NICE NG133's sudden swelling of the face, hands or feet; ic_hastaliklari
  adopts the cluster's night-sweat question and keeps its fever-of-unknown-cause item
  apart as nedenini_bilmedigi_ates, recorded as the patient's report and never asserted
  as NG12's "unexplained".
  Rejected (1): the base fever, weight-loss and pregnancy-bleeding probes do not take the
  cluster ids and are never filled from a cluster answer, because each probe carries a
  severity criterion the screen does not ask; the mechanics are the base owner's.
  Three items stay draft_needs_source: the base red-flag probe wording, inputs for six
  surgical and sensory patterns, and the fast-mode turn budget (HB-C5). One item is an
  owner question (D3 text_first prerequisites).
status: active
scope: simulated_patient_stress_testing
scope_note: >-
  Owner decision D18 (2 Oct 2026): agent-only sign-off, for simulated-patient stress
  testing only. A licensed physician's review is required before any real patient. D18
  does not reach the owner and base-owner parts recorded under owner_part.
question_origin: >-
  INT-448 (GitHub #759): items of the #642 sign-off packets (docs/signoff/*.md at
  151cf34f) whose row lives in docs/evidence/verification/cluster-wave-a.md.
author_role: "internal medicine, general surgery and anaesthesiology, obstetrics and gynaecology, and ENT/ophthalmology physician (agent)"
