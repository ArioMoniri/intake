    - item: "docs/evidence/verification/cluster-wave-a.md#L113"
      ref: "cluster-wave-a §A medical (hyperglycaemia with vomiting)"
      packets: [cluster_medical, diyabet_poliklinigi]
      deciders: [clinician]
      question: "Should cluster.medical carry an input item for hyperglycaemia symptoms with vomiting, and should it be gated on a known diabetes diagnosis?"
      outcome: change
      change: >-
        Append to cluster_medical §3 after Q18: "Q19 — Hyperglycaemia symptoms with vomiting"
        · archetype OBSERVATION.symptom_sign.v1 · source TEMD 2026 PDF p. 70 and p. 181
        (Tablo 12.1) · "Çok susama ya da sık idrara çıkmayla birlikte bulantı, kusma veya
        karın ağrısı oluyor mu?" · gen: slot=hiperglisemi_bulanti_kusma; type=boolean.
        Ungated. Same text and id as diyabet_poliklinigi Q8, so that pack's re-declaration
        replaces it. Input only: no level, no rule, no candidate flag. A DKA rule, when
        written, is placed in base.life_threat with a base-level trigger slot (CD-13 rule 1);
        this cluster item is a note input only and never that rule's gate slot. Re-anchor
        MED-S3 on the 2026 edition (TEMD-DM-2026).
      clinical_basis: "TEMD 2026 names thirst, polyuria, nausea, vomiting and abdominal pain as DKA symptoms and records DKA as the first sign of diabetes in most children with type 1 and in some adults, so a gate on a known diagnosis would close the item for the new-onset patients it exists for."
      sources: [TEMD-DM-2026]
      status: active
    - item: "docs/evidence/verification/cluster-wave-a.md#L115"
      ref: "cluster-wave-a §A medical Q12, Q13; women's health Q4"
      packets: [cluster_medical, cluster_womens_health]
      deciders: [HB-C1, base owner]
      question: "Are son_gunlerde_ates, istemsiz_kilo_kaybi and gebelikte_kanama the same facts as the base probes rf_fever_high_persistent, rf_weight_loss_unintentional and rf_pregnancy_bleeding_pain, so that one may stand for the other?"
      outcome: reject
      clinical_basis: >-
        No. Each cluster item is a broader screen and each probe carries a severity
        criterion the screen does not ask: fever height and duration, or fever on
        chemotherapy; weight-loss magnitude over a window (NG12 1.13.2); and the degree of
        pain or bleeding in pregnancy (NG126 1.4.1, while bleeding without pain is managed
        expectantly, 1.4.10). So the probes keep their own ids, a cluster answer never fills
        a probe, and a screen's yes may only lead to its probe as the detail question.
      sources: [NICE-NG126, NICE-NG12, openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
      owner_part: >-
        Base owner: with the probes keeping their own ids, choose how base and the medical
        and women's health clusters avoid asking the screen and the probe back to back (for
        example the probe follows its screen in the same session), given that a base slot
        cannot read a cluster slot in other clusters' sessions; whether a screen's plain
        "hayır" may skip a probe is not decided here. HB-C1 still owns the probe wording.
