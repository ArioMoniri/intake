  The sources fix the clinical constructs. The representation choices are this author's
  and are made on those sources: which id carries which fact, keeping two facts apart, a
  restating follow-up, and the Turkish wording of the added stroke item and the reworded
  swelling item. The stroke item asks history only; the one-month window TARD sets for
  postponing surgery is left to the clinician at the visit and is not asked, so no number
  enters patient copy.
