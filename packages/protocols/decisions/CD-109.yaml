kind: clinical_decision
id: CD-109
title: 'rf.stroke_fast: FAST signs of sudden onset, present now, at EK-4 Kırmızı Kategori 2'
question: Which current source states a layperson-answerable stroke trigger and its urgency?
decision: 'Write rf.stroke_fast as KIRMIZI_K2 / EMERGENCY_NOW / ALERT on one probe: face droop, arm weakness
  or speech difficulty that began suddenly and is still present (NICE NG128 1.1.1, FAST, in people with
  sudden onset of neurological symptoms). EK-4 prints ''Akut hemiparazi/disfazi'' in Kırmızı Kategori
  2. The probe opens a dated onset slot, rf_stroke_fast_onset, as the tense anchor, because the HB-C6
  slot time_last_known_well is a duration and the engine cannot anchor on it. Tense ever: the probe carries
  ''şu anda sürüyor'', so the anchor only proves the symptom is dated. A resolved deficit is NG128 1.1.5''s
  suspected TIA, to be seen within twenty-four hours, which is a different action and is not written.
  Vision loss is not in FAST or EK-4''s line.'
status: active
scope: simulated_patient_stress_testing
scope_note: 'Owner decision D18 (2 Oct 2026), and the owner''s instruction of 18 Nov 2026 (''yes write
  the 13 red flag rules''): agent-sourced content for the synthetic host and simulated patients only.
  A licensed physician''s review is required before any real patient. No clinical_signoff field is touched
  (D17), the pack stays L0, and HB-C1 stays open.'
question_origin: 'Owner, 18 Nov 2026, in chat: ''yes write the 13 red flag rules''. INT-619.'
author_role: emergency medicine and neurology physician (agent)
inference_disclosure: Rendering FAST as a self-report ('ağzınızın bir yanı düşüyorsa…') is the pack's;
  FAST is an observer's screen.
