kind: clinical_decision
id: CD-21
title: 'INT-414 delivery lines: acknowledgements (rows 14-20)'
question: INT-414 (#726) adds conversational delivery lines around each question. Do the acknowledgements
  (thanks, 'don't know' and correction) pass PolicyGuard (no diagnosis, treatment, prognosis, reassurance
  or minimising), stay B1 plain Turkish in the siz register, ask nothing, carry no numeral, and fit the
  moment they are said?
decision: All seven pass unchanged and stay within the five-word acknowledgement bound (files/03 §4.2).
  The thanks judge nothing about the answer. The 'don't know' lines accept not knowing, not remembering,
  not being sure or preferring not to say as an answer, with no pressure and no reassurance, and they
  do not minimise what was not said. The correction lines credit the patient and never imply they were
  wrong. Each line below is its own entry with its six checks, the author's verdict and the verifier's
  verdict; the Turkish is byte-equal to the catalogue key it names.
