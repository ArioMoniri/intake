inference_disclosure: >-
  The sources fix the constructs: do not drive yourself; the call handler advises what to
  do; aspirin by mouth while help is awaited, after an allergy check; rest; someone stays
  with the person; escort to the acil servis; silence may be someone who can no longer
  communicate. These choices are this author's, made on those sources: narrowing the
  driving line from "your own vehicle" to driving oneself, which leaves being driven by
  someone else not ruled out by the device (the call handler, not the device, decides any
  other transport; a physician weighs this before any real patient); rendering "stay with
  the person" for the patient as a conditional prohibition, so a patient alone is not
  given an instruction they cannot keep or sent to look for someone instead of resting;
  removing the nil-by-mouth line without a replacement; the concern that a blanket
  nil-by-mouth line in the hospital could make a patient decline aspirin offered by the
  acil servis, which is this author's reasoning, not a source's; and the late-answer
  switch. The Turkish wording of the two changed lines is this author's B1 rendering,
  PolicyGuard-clean.
fail_closed_while_draft: >-
  While no_answer_wait is draft, the device's constant (UNSIGNED_LOCATION_NO_ANSWER_WAIT_MS
  on #796) stays an unsigned engineering value, recorded as such (CD-24); on expiry the
  branch is REMOTE with 112 shown, never silence, and the clinic notification fires in
  every case.
