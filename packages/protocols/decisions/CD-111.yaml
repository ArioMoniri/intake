      from: "Tek başınıza gitmeyin — yanınızdaki kişiden ya da bir görevliden yardım isteyin."
      outcome: accept
      to: "Tek başınıza gitmeyin — yanınızdaki kişiden ya da bir görevliden yardım isteyin."
      clinical_basis: "A walk-in patient in danger of life is taken to the acil servis escorted by health personnel, and first aid has someone stay with the person; staff are already notified (notify_staff_immediate)."
      sources: [TR-EK4-2022, RCUK-ERC-FIRST-AID-2025]
      status: active
    - location: ON_SITE
      from: "Bir şey yiyip içmeyin."
      outcome: remove
      to: null
      clinical_basis: "A clinician offers aspirin as soon as possible for a suspected ACS, and the first-aid guideline gives it chewed or dissolved by mouth; no retrieved source supports nil by mouth for suspected acute coronary syndrome, in or out of the hospital."
