# INT-619 clinical decision CD-111: rf.anaphylaxis
# (owner, 18 Nov 2026: "yes write the 13 red flag rules").
# Agent-authored under owner decision D18 for simulated-patient stress testing only; a licensed
# physician's review is required before any real patient. Every source quote appears verbatim in the
# named snapshot and every spec_basis quote in the named file.
kind: clinical_decision
id: CD-111
title: 'rf.anaphylaxis: sudden tongue or throat swelling, breathing or swallowing difficulty after a trigger,
  at EK-4 Kırmızı Kategori 2'
question: Which current source states a layperson-answerable anaphylaxis trigger, its urgency and its
  do-nots?
decision: 'Write rf.anaphylaxis as KIRMIZI_K2 / EMERGENCY_NOW / ALERT on one probe: present now, after
  something such as a food, a drug or an insect sting, a sudden difficulty breathing or a throat swelling
  that makes swallowing hard (RCUK 2021 §3, §3.1, §3.2 Airway problems). Swelling alone is not asked for,
  because RCUK does not count angioedema without an airway or breathing problem as anaphylaxis. Level:
  EK-4 Kırmızı Kategori 2''s ''yutkunma güçlüğü ile beraber olan havayolu tıkanıklığı riski''. EK-4''s
  Kategori 1 ''Havayolu tıkanıklığı riski'' is the reading a physician may prefer; raising K2 to K1 is
  a tightening they can make. Do-not: ''Ayağa kalkmayın ve yürümeyin'' (RCUK §4.4). ON_SITE does not send
  the patient walking to the acil servis: it keeps them in place with staff notified (STAY_IN_PLACE_STAFF_NOTIFIED).
  Self-injected adrenaline is not scripted: it is a treatment instruction and no committed passage states
  it for a patient; the physician decides whether the REMOTE script names a prescribed auto-injector.'
status: active
scope: simulated_patient_stress_testing
scope_note: 'Owner decision D18 (2 Oct 2026), and the owner''s instruction of 18 Nov 2026 (''yes write
  the 13 red flag rules''): agent-sourced content for the synthetic host and simulated patients only.
  A licensed physician''s review is required before any real patient. No clinical_signoff field is touched
  (D17), the pack stays L0, and HB-C1 stays open.'
question_origin: 'Owner, 18 Nov 2026, in chat: ''yes write the 13 red flag rules''. INT-619.'
author_role: emergency medicine and allergy physician (agent)
inference_disclosure: The probe joins RCUK's exposure, suddenness and airway or breathing problem into
  one self-report; skin changes are left out because RCUK says they may be absent and are not a sign of
  anaphylaxis alone. The probe's examples (food, medicine, insect sting) illustrate RCUK's 'trigger (allergen)';
  the committed excerpt names food and insect sting, and medication as a trigger is RCUK Table 2, which
  the excerpt omits.
