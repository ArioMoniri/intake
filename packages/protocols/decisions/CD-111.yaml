# INT-472 clinical decision CD-111: the do-not lines of the cardiac RED rule
# (rf.chest_pain_cardiac_features, REMOTE and ON_SITE) and the wait before an unanswered
# "Şu anda hastanede misiniz?" resolves to REMOTE. Agent-authored under owner decision
# D18; simulated-patient stress testing only, and a licensed physician's review is
# required before any real patient. It fills no clinical_signoff (D17) and does not close
# HB-C1. Every quote below appears verbatim in the named snapshot, and every spec_basis
# quote verbatim in the named committed file. This is a decision record, not a pack edit:
# the change applies through files/protocols/base.life_threat.yaml, routed into the
# INT-465 branch (#796) that already edits the same action block. The rule's gate, tense,
# level, route, register and location branches are untouched; nothing extends
# base.life_threat.
kind: clinical_decision
id: CD-111
title: "Cardiac RED do-not lines and the unanswered location wait"
question: >-
  Which of the cardiac RED rule's do-not lines are kept, changed or removed, on what
  current source, and does a blanket "Bir şey yiyip içmeyin." conflict with the care a
  112 call handler or the acil servis gives? And what wait, if any source states one,
  applies before an unanswered location question resolves to REMOTE with 112?
decision: >-
  REMOTE: "Kendi aracınızla yola çıkmayın." changes to the sourced "Hastaneye kendiniz
  araba kullanarak gitmeyin."; "Bir şey yiyip içmeyin." is removed; "Tek başınıza
  kalmayın; yanınızdaki kişiye durumu söyleyin." changes to "Yanınızda biri varsa durumu
  ona söyleyin ve sizinle kalmasını isteyin.". ON_SITE: "Poliklinik sırasında
  beklemeyin." and "Tek başınıza gitmeyin — yanınızdaki kişiden ya da bir görevliden
  yardım isteyin." are kept; "Bir şey yiyip içmeyin." is removed. The nil-by-mouth line
  contradicts current care: chest-pain first aid and NICE CG95 give aspirin by mouth
  while help is awaited, and the 999 call handler gives the advice on what to do. Nothing
  replaces it: a medicine instruction is the call handler's or the clinician's to give,
  after an allergy check the device cannot make. The wait: no current source states a
  number, so it stays draft_needs_source with the invariant-17 literal, and the device's
  constant stays an unsigned engineering value; the qualitative rule is decided: an
  unanswered question resolves to REMOTE with 112 shown (silence may be a person who can
  no longer communicate), a late "evet" switches to ON_SITE, and CD-24's ask-first
  verdict stands.
status: active
scope: simulated_patient_stress_testing
scope_note: >-
  Owner decision D18 (2 Oct 2026): agent-only sign-off for simulated-patient stress
  testing only. A licensed physician's review is required before any real patient.
question_origin: >-
  INT-472 (GitHub #805), from the INT-465 (#796) clinical re-review of 3 Oct 2026: CD-24
  kept the generic do-nots and the no-answer wait draft_needs_source, and the served
  cardiac rule carries the three do-not lines with no source.
