      deciders: [HB-C1, clinician]
      question: "May review-queue candidates declare maturity L1 and a clinician-directed header without the HB-C1 sign-off?"
      outcome: accept
      clinical_basis: "Accept the finding: every candidate in the review queue declares L0, only the promotion step writes L1 after the physician of record signs, and no header names a physician other than the HB-C1 signer; D18 promotes no pack past L0."
      spec_basis_ref: ["files/00_STATE.md §3 D18", "files/HUMAN_BLOCKERS.md HB-C1", "files/04_CLINICAL_PROTOCOLS.md §2 maturity model"]
      status: active
