# INT-448 clinical decision CD-105: the sign-off packet items (#642, packet commit
# 151cf34f) that come from the specialty-wave verification reports (waves 1-3, 4-5, 6, 7,
# 8 and 9). Agent-authored under owner decision D18 (2 Oct 2026). It covers
# simulated-patient stress testing only, and a licensed physician's review is required
# before any real patient. Every source quote below appears verbatim in the named
# snapshot, and every spec_basis quote appears verbatim in the named committed file. This
# is not a pack: the lead applies the item changes to the review-queue proposals. No
# triage level, route, register, location or red-flag rule is created, relaxed or
# removed here; where an item asks where a rule belongs, it is placed by CD-13's rules and
# left to the base owner or the HB-C2 author.
kind: clinical_decision
id: CD-105
title: "#642 packet items: specialty wave verification"
question: >-
  For each open item that the #642 sign-off packets route from the specialty-wave
  verification reports (waves 1-3, 4-5, 6, 7, 8 and 9), what is the clinical decision, on
  what current source, and which part stays with the owner?
decision: >-
  Thirty-eight items. Accepted (16): the AMATEM ASSIST-shaped items stay as unscored
  history with no window and no instrument path; the avulsed-tooth item stays as a
  history input; candidates stay L0 until the physician of record signs; the hematoloji
  heavy-period item keeps its conditional lead-in with an answer mapping for people who
  do not menstruate; the mood-elevation, nükleer tıp, getat, halk sağlığı and yaşlı
  hearing items stand as the verifier left them; the pregnancy fetal-movement split
  stands, with an answer mapping that keeps the gate open on any report of movement; the
  antenatal duration lines stand; the incontinence items keep voice delivery; pedodonti
  keeps cluster.dental as its parent. Changed (8): biomass wood ("odun") returns to the
  göğüs item once the lexicon false positive is fixed; preparation, counselling and
  periodic-review visits drop the complaint duration ask; the flu-vaccine ask uses a
  one-year window; ortodonti gains proxy variants; spor gains the exertional fainting and
  chest-discomfort items; odyoloji gains the sudden hearing loss item; the iş ve meslek
  skin item gets dryness back from its own source. Rejected (3): the day-of-surgery
  fasting times leave the pre-visit pack; the adli tıp safety, companion and
  strangulation items stay held; the göğüs and hematoloji weight-loss screens are not
  removed in favour of the base probe. Four placement items stay draft_needs_source where
  no snapshot states an action, with the sourced parts placed by CD-13. Seven items are
  owner questions.
status: active
scope: simulated_patient_stress_testing
scope_note: >-
  Owner decision D18 (2 Oct 2026): agent-only sign-off, for simulated-patient stress
  testing only. A licensed physician's review is required before any real patient. D18
  does not reach the owner and base-owner parts recorded under owner_part, and it does not
  close HB-C1 or promote any pack past L0.
question_origin: >-
  INT-448 (GitHub #759): items of the #642 sign-off packets (docs/signoff/*.md at
  151cf34f) whose row lives in docs/evidence/verification/specialty-wave*.md.
author_role: "anaesthesiology, forensic medicine, psychiatry, dentistry, haematology, women's health, paediatrics, geriatrics, sports medicine, ENT and occupational medicine physician (agent)"
