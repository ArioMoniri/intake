    - item: "docs/evidence/verification/specialty-wave6-internal-mental.md#L57"
      ref: "wave 6 hematoloji Q7"
      packets: [hematoloji]
      deciders: [HB-C6, base owner]
      question: "Can the heavy-period item keep its conditional lead-in when no slot can gate it?"
      outcome: accept
      clinical_basis: >-
        Yes, with a per-slot answer mapping on yogun_uzun_adet_kanamasi, whose entries are
        tested before any plain negative (CD-04). Any report of bleeding or spotting after
        periods have stopped ("menopozdayım ama kanamam oldu", "adetim kesildi ama lekelenme
        oluyor") records PRESENT_QUALIFIED (qualifier bleeding_after_periods_stopped), is
        carried into the note and never records ASKED_ABSENT, because unexplained
        post-menopausal bleeding is a NICE NG12 referral feature at any age; no level is set
        here. Only a plain "adet görmüyorum", "menopozdayım" or "adetlerim kesildi" with no
        bleeding reported, or a plain "hayır", records ASKED_ABSENT; "bilmiyorum" records
        UNCLEAR. The item is otherwise a menstrual-bleeding history question (NICE NG88),
        and the lead-in lets a person who does not menstruate answer no without a gate.
      sources: [NICE-NG88, NICE-NG12, openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
      owner_part: >-
        Base owner: add a sex or menstrual-status slot to base (HB-C6 family) so that this
        and similar items can be gated instead of carrying a conditional lead-in.
