  items:
    - item: "docs/evidence/verification/specialty-wave1-3.md#L67"
      ref: "wave 1-3 finding 19 (anesteziyoloji Q9)"
      packets: [anesteziyoloji]
      deciders: [clinician]
      question: "Should the pre-visit pack ask when the patient last ate and drank before surgery?"
      outcome: reject
      clinical_basis: "Fasting intervals are counted in hours before the operation, so a time reported at a pre-visit days earlier carries no information and could be mistaken for a fasting record; son_kati_gida and son_sivi leave the anesteziyoloji pre-visit pack, no gate or op names them, and the team asks them on the day of surgery."
      source_note: "The TARD 2025 adult preoperative guideline was searched first; its text layer sets no fasting interval (it mentions the usual fasting period once, in a medicines paragraph on PDF p. 26), so the ESAIC guideline is cited for how fasting is timed."
      sources: [ESAIC-FASTING-2011]
      status: active
    - item: "docs/evidence/verification/specialty-wave1-3.md#L69"
      ref: "wave 1-3 finding 21 (adli_tip Q3-Q5)"
      packets: [adli_tip]
      deciders: [clinician]
      question: "May adli tıp ask, before the visit, whether the patient feels safe, whether a trusted person will come along, and about symptoms after neck compression?"
      outcome: reject
      clinical_basis: >-
        No; all three stay held (Q3 su_an_guvende and Q5 boyun_baski_sonrasi_belirti gain a
        hold line like Q4's). Each is a safeguarding enquiry that NICE PH50 places with
        trained staff, in private and one to one; inviting a companion works against seeing
        the person alone; and the answers sit on a device the abuser may share. The
        strangulation symptoms are asked by the clinician at the visit, and their placement
        as a time-critical pattern is the HB-C2 author's under CD-13.
      sources: [NICE-PH50]
      status: active
    - item: "docs/evidence/verification/specialty-wave1-3.md#L72"
      ref: "wave 1-3 finding 24 (amatem Q4, Q5, Q7, Q8)"
      packets: [amatem]
      deciders: [clinician]
      question: "Should the ASSIST-shaped AMATEM items keep the three-month window, or should ASSIST be delivered verbatim through the instrument path?"
      outcome: accept
      clinical_basis: "Accept the candidate as it stands: the window is gone ('son zamanlarda'), the items are unscored history of use, craving, others' concern and attempts to cut down, which NICE CG115 assesses as history, and no ASSIST delivery is set up because no licence or Turkish validation record exists for it."
      sources: [NICE-CG115]
      status: active
    - item: "docs/evidence/verification/specialty-wave1-3.md#L75"
      ref: "wave 1-3 finding 27 (dis_hekimligi Q8)"
      packets: [dis_hekimligi]
      deciders: [clinician]
      question: "Does a pre-visit ask about a recently knocked-out permanent tooth help at all?"
      outcome: accept
      clinical_basis: "Keep kalici_dis_cikti as a history input only: the emergency step, replantation, belongs at the place of the accident and no pre-visit reaches it in time, but a replanted tooth needs follow-up for years, so the dentist needs the history at the visit; any first-aid script is a time-critical pattern for the HB-C2 author under CD-13, not a pack item."
      sources: [IADT-AVULSION-2020]
      status: active
