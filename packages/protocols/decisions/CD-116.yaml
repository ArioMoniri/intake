kind: clinical_decision
id: CD-116
title: 'rf.pregnancy_bleeding_pain stays draft: obstetric input (HB-C4) and no layperson-answerable source'
question: Which current source states a layperson-answerable trigger for bleeding or severe pain in pregnancy
  and its urgency?
decision: Keep rf.pregnancy_bleeding_pain draft_needs_source. The one committed obstetric source, NICE
  NG126, covers early pregnancy only, and its A&E criterion is a clinician's judgement ('significant concern
  about the degree of pain or bleeding'). EK-4 has no pregnancy line. The pregnancy rule set needs obstetric
  input (HB-C4).
