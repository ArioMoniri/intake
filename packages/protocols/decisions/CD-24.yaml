kind: clinical_decision
id: CD-24
title: "Generic RED escalation copy (base.generic_red.remote / on_site / unknown)"
question: "When a RED fires but its own pre-positioned script cannot be addressed (more than one rule fired with none named, or the pack holds no script for the named RED at that location), what does the device show and say under REMOTE, ON_SITE and UNKNOWN, given that the copy must be correct for any adult RED of either EK-4 KIRMIZI category and may not name a condition? Under UNKNOWN, is 112 shown before the location question or only after it? And which register delivers the generic: always ALERT, or the engine result's own register?"
decision: "The generic copy states the action and the service, never the patient's condition, so it holds for any KIRMIZI rule whichever register delivers it. Register: the generic trigger carries the engine result's own register rather than a fixed ALERT, because CLAUDE.md invariant 21 permits no default register and the base.life_threat schema refuses ALERT for distress_sensitive, subject_is_child and consent-independent crisis rules; register decides how the patient is told and location decides what they are told to do (files/02 §5.3). ALERT delivers the scripts below with the ALERT presentation; CALM delivers the same scripts with no alarm colour, soft speech, no alert sound and no attention-grabbing interrupt; DEFERRED_CLINICIAN never reaches the device. What a SILENT generic should say, and which register applies when the fired rules declare different registers, stay draft_needs_source; meanwhile a SILENT generic shows the same text in the flow of the session with no audio, and mixed sets take the most restrictive register present (SILENT over CALM over ALERT), never ALERT when any fired rule is CALM or SILENT. REMOTE: primary CALL_112, show112 true; 'Hemen 112 Acil Çağrı Merkezi'ni arayın.' (the Tebliğ names the 112 acil çağrı merkezi as the place emergency health calls are answered and ambulances dispatched, and files/04 §4.1 fixes 112 as the national emergency number); one do-not, 'Randevuyu beklemeyin.' (EK-4 takes KIRMIZI Kategori 1 in without waiting and Kategori 2 within ten minutes, so waiting for a booked appointment contradicts both); and a why line that says only that the answers call for assessment without waiting and that patients brought by a 112 ambulance are not kept waiting for a separate priority order (Tebliğ MADDE 8(5), with triage defined in MADDE 4(1)(p) as the determination of medical priority). ON_SITE: primary GO_TO_IN_HOUSE_ACIL, show112 false, notify_staff_immediate true; the exemplar action line with the tenant location segment, 'Randevuyu beklemeyin' and 'Görevlilere haber verildi'; two do-nots, 'Poliklinik sırasında beklemeyin.' and 'Tek başınıza gitmeyin; bir görevliden yardım isteyin.' (MADDE 8(3): a walk-in patient judged to be in danger of life is taken to the area escorted by health personnel, a service fact that holds for any KIRMIZI condition, and notify_staff_immediate already summons staff); and a why line that says priority is set at the acil servis entrance and the most urgent patients are taken in without waiting (MADDE 8(3), EK-4 Kategori 1). No 112 appears anywhere in the ON_SITE script. UNKNOWN: exactly one question, 'Şu anda hastanede misiniz?', branching on_yes ON_SITE, on_no REMOTE, on_no_answer REMOTE. Verdict on UNKNOWN: ask first; the 112 affordance appears only after 'hayır' or no answer, because showing it first is a guess that the patient is at home, and files/02 §5.3 and files/04 §8.1 rule 7 forbid resolving UNKNOWN by guessing. The 112 numeral is written as a bare token followed by a space so the compiler expands it to 'yüz on iki'; the exemplar's \"**112**'yi\" form is refused by the expander (finding G1). Under REMOTE the generic do-nots that the chest-pain exemplars carry (not driving oneself, not being alone, not eating or drinking) are not generalised: the only retrieved source for transport and accompaniment outside the hospital is the head-injury guideline, and no retrieved source states any of them for every KIRMIZI condition. Under ON_SITE the escort line is adopted from MADDE 8(3). What stays draft_needs_source: whether to add such generic do-nots, the wait before an unanswered location question resolves to REMOTE, the SILENT copy, and the register for a fired set with mixed registers."
status: active
scope: simulated_patient_stress_testing
scope_note: "Owner decision D18 (2 Oct 2026): agent-only sign-off, for simulated-patient stress testing only. A licensed physician's review is required before any real patient."
question_origin: "INT-453 (PR #773): services/voice-runtime talker/red_path.py publishes a generic red_trigger (register ALERT, scriptId base.generic_red.{remote,on_site,unknown}) when a RED's own script cannot be addressed; the device catalog entry for that scriptId has no copy."
author_role: "emergency medicine and internal medicine/cardiology physician (agent)"
inference_disclosure: "Every sentence is this author's B1 Turkish rendering of a service fact, not a quotation. 'öncelik sırası' (REMOTE) and 'önceliği … belirlenir' (ON_SITE) render the Tebliğ's triyaj through its own definition (tıbbi önceliklerin belirlenmesi) to avoid unexplained jargon; 'ayrıca … bekletilmez' renders 'ayrıca triyaj uygulaması yapılmaz' as its consequence for the patient. 'Randevuyu beklemeyin' and 'Poliklinik sırasında beklemeyin' are the author's reading of EK-4's KIRMIZI timing as a prohibition on waiting for a booked slot, and 'Tek başınıza gitmeyin; bir görevliden yardım isteyin' is the author's reading of MADDE 8(3)'s escort by health personnel as a do-not. The copy is worded without a grammatical subject for the patient ('Verilen cevaplara göre …', 'Randevuyu …') so that it also reads correctly in a proxy session, except the files/02 location question, which is kept verbatim. Suppressing the attention-grabbing interrupt for every CALM generic is the author's reading of files/04 §8.1 rule 6: the generic cannot tell a distress_sensitive CALM rule from another CALM rule, and suppression is the only choice that never breaks rule 6. The most-restrictive ordering for mixed registers (SILENT over CALM over ALERT) is the author's meanwhile rule, not a source's."
