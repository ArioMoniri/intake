kind: clinical_decision
id: CD-16
title: "Göğüs cerrahisi Q12b: regurgitation is asked of every patient, not only after a swallowing complaint"
question: >-
  V-GC-5: should food or saliva coming back up (Q12b yiyecek_geri_gelmesi) be asked of
  every thoracic-surgery patient, or only after a swallowing complaint (the current gate
  yutma_guclugu == true)?
decision: >-
  Ask it of every patient: the gate is removed. The UEG and ESNM European achalasia
  guideline lists regurgitation as a symptom of achalasia in its own right, next to
  dysphagia, chest pain and weight loss, and calls it a hallmark of achalasia and poor
  oesophageal emptying. A patient with regurgitation and no perceived swallowing
  difficulty is therefore a patient the thoracic-surgery pack exists to see (TGCD lists
  achalasia surgery among its consent forms, TOR-S7). The current gate encodes a
  clinical association, not a presupposition, and it would hide exactly that patient.
  NICE NG12 1.2.1 points the same way: its second arm refers people aged 55 and over
  with weight loss and reflux, without dysphagia. The caveat is that NICE's word is
  reflux; the item's wording is achalasia-type regurgitation, and the pre-visit never
  maps one onto the other. The item stays symptom capture: no red flag is proposed on
  regurgitation alone, and the dysphagia rule (row 4) keeps its own trigger. The cost is
  one extra yes/no turn for patients without a swallowing complaint. The verifier's
  scratch run with the gate removed passed check_proposal and verify_chain.
status: active
scope: simulated_patient_stress_testing
author_role: "thoracic surgery physician (agent)"
