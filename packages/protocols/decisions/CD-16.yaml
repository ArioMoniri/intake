    quote: "Achalasia is a primary motility disorder in which insufficient relaxation of the lower oesophageal sphincter (LOS) and absent peristalsis result in stasis of ingested foods and subsequently, lead to oesophageal symptoms of dysphagia, regurgitation, chest pain or weight loss."
