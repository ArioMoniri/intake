source_gap: >-
  sla, out_of_hours.coverage, failure_path.escalation_role and
  failure_path.escalation_after: NICE NG143 1.3.4 leaves the urgency of
  follow-up for an intermediate-risk finding identified remotely to the
  clinical judgement of the assessing professional and sets a time only for red
  features (1.3.3), which a YELLOW_REVIEW can never carry (invariant 1). The
  Tebliğ's EK-4 states one numeric time target, for KIRMIZI Kategori 2
  (files/04 §3), and a YELLOW_REVIEW is not an EK-4 level (files/12). No Turkish
  regulation found sets a response time, out-of-hours cover or an escalation
  chain for a pre-visit clinic inbox. Any value written here would be invented.
value:
  applies_to:
    - yellow_review_candidate
    - late_landing_rf_addendum
    - armed_probe_unanswered_at_session_end
    - chest_pain_arms_unresolved
    - proxy_chest_pain_screen_unasked
  item_kind_notes:
    chest_pain_arms_unresolved: "raised under CD-04 when a CD-01 chest-pain slot is still UNCLEAR after its follow-up, which can leave both chest-pain arms Unknown; pinned to the note, never dropped"
    proxy_chest_pain_screen_unasked: "raised under CD-01 (value.proxy_unasked_inbox_item) when a proxy session (identity_check.subject_role 'yakınım adına') leaves the seven chest-pain slots unasked until the DSL can select proxy copy, and only when the subject is in the adult age band of rf.chest_pain_cardiac_features and rf.chest_pain_no_cardiac_history or the subject's age is unknown; never raised for a subject known to be outside that band (for example a child intake), where neither chest-pain rule applies; pinned to the note, never dropped. The item makes the gap visible to a clinician but does not close it: until the DSL selects proxy copy neither chest-pain RED rule can fire in a proxy session (CD-01 finding F13), and in simulated stress testing a proxy persona with chest pain is reported as unscreened, never as negative"
  recipient_role:
    role_id: tenant_clinic_triage_trained_clinician
    definition: >-
      A clinician of the tenant facility who holds the in-service triage
      training Tebliğ MADDE 8(2) requires, rostered by the tenant to the booked
      clinic's inbox.
    eligible_titles: [tabip, hemşire, ebe, acil tıp teknikeri, acil tıp teknisyeni]
    excluded_titles: [eczacı, eczane teknikeri, tıbbi protez ve ortez teknisyeni/teknikeri, hemşire yardımcısı, ebe yardımcısı, sağlık bakım teknisyeni, tıbbi sekreter]
    competency: in_service_triage_training
    named_person_allowed: false
    not_the_acil_triage_desk: true
    sets_follow_up_urgency: true
    inference_disclosure: >-
      The Tebliğ's sağlık personeli list includes non-clinical and assistant
      titles and does not itself say which of them may triage. Restricting the
      recipient to the five clinical titles above is this author's tightening,
      not the regulation's text.
