fail_closed_while_draft: >-
  Every clinic-inbox item is still delivered to the inbox and pinned to the
  pre-visit note while the SLA and escalation stay draft; a missing SLA never
  drops or delays delivery. The tenant configuration reports the inbox as not
  ready (no stated SLA, no escalation role) instead of inventing one.
