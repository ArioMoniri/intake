source_gap: >-
  sla, out_of_hours.coverage, failure_path.escalation_role and
  failure_path.escalation_after: NICE NG143 1.3.4 leaves the urgency of
  follow-up for an intermediate-risk finding identified remotely to the
  clinical judgement of the assessing professional and sets a time only for red
  features (1.3.3), which a YELLOW_REVIEW can never carry (invariant 1). The
  Tebliğ's EK-4 states one numeric time target, for KIRMIZI Kategori 2
  (files/04 §3), and a YELLOW_REVIEW is not an EK-4 level (files/12). No Turkish
  regulation found sets a response time, out-of-hours cover or an escalation
  chain for a pre-visit clinic inbox. Any value written here would be invented.
  Round 4 (INT-554), re-searched 2026-10-17: the one current Royal College text
  found on following up clinical notifications that were not read, acknowledged
  and acted upon (AoMRC, Alerts and notification of imaging reports, October
  2022) ties the time frame to the acuity of the finding and leaves the
  escalation interval, 48 hours for imaging alerts, to agreement by the
  healthcare organisation. A clinic-inbox item has no acuity of its own (its
  reviewer sets the urgency of any follow-up), so no source gives a value for
  any tenant; each of the four is a value the tenant's clinical governance
  agrees (value.tenant_agreed), and what is missing is that statement from each
  tenant.
value:
  applies_to:
    - yellow_review_candidate
    - late_landing_rf_addendum
    - armed_probe_unanswered_at_session_end
    - chest_pain_arms_unresolved
    - proxy_chest_pain_screen_unasked
  item_kind_notes:
    chest_pain_arms_unresolved: "raised under CD-04 when a CD-01 chest-pain slot is still UNCLEAR after its follow-up, or is left without an answer when the session closes (CD-04 value.unresolved_at_close), which can leave both chest-pain arms Unknown; pinned to the note, never dropped"
    proxy_chest_pain_screen_unasked: "raised under CD-01 (value.proxy_unasked_inbox_item) when a proxy session (identity_check.subject_role 'yakınım adına') leaves the seven chest-pain slots unasked until the DSL can select proxy copy, and only when the subject is in the adult age band of rf.chest_pain_cardiac_features and rf.chest_pain_no_cardiac_history or the subject's age is unknown; never raised for a subject known to be outside that band (for example a child intake), where neither chest-pain rule applies; pinned to the note, never dropped. The item makes the gap visible to a clinician but does not close it: until the DSL selects proxy copy neither chest-pain RED rule can fire in a proxy session (CD-01 finding F13), and in simulated stress testing a proxy persona with chest pain is reported as unscreened, never as negative"
  recipient_role:
    role_id: tenant_clinic_triage_trained_clinician
    definition: >-
      A clinician of the tenant facility who holds the in-service triage
      training Tebliğ MADDE 8(2) requires, rostered by the tenant to the booked
      clinic's inbox.
    eligible_titles: [tabip, hemşire, ebe, acil tıp teknikeri, acil tıp teknisyeni]
    excluded_titles: [eczacı, eczane teknikeri, tıbbi protez ve ortez teknisyeni/teknikeri, hemşire yardımcısı, ebe yardımcısı, sağlık bakım teknisyeni, tıbbi sekreter]
    competency: in_service_triage_training
    named_person_allowed: false
    not_the_acil_triage_desk: true
    sets_follow_up_urgency: true
    inference_disclosure: >-
      The Tebliğ's sağlık personeli list includes non-clinical and assistant
      titles and does not itself say which of them may triage. Restricting the
      recipient to the five clinical titles above is this author's tightening,
      not the regulation's text.
  channel: clinic_inbox
  sla: "TODO: acknowledgement SLA per clinic-inbox item kind requires clinical sign-off"
  out_of_hours:
    coverage: "TODO: out-of-hours clinic-inbox coverage requires clinical sign-off"
    constraints:
      - never_shown_to_patient
      - never_a_patient_facing_urgency_path
      - never_dropped_or_expired_out_of_hours
      - shown_in_pre_visit_note_if_unreviewed_at_visit_start
      # Round 4 (INT-554 item D4): an out-of-hours contact exists before the inbox
      # is ready; how the tenant covers the hours stays tenant-agreed.
      - out_of_hours_contact_named_by_tenant
  failure_path:
    escalation_role: "TODO: escalation role for an unacknowledged clinic-inbox item requires clinical sign-off"
    escalation_after: "TODO: escalation window for an unacknowledged clinic-inbox item requires clinical sign-off"
    constraints:
      - never_auto_cleared
      - closes_only_on_recorded_clinician_outcome
      - inbox_delivery_failure_counts_as_sla_breach
      - sla_breach_is_an_emitted_event
      - never_lowers_or_replaces_a_rules_engine_level
    # Round 4 (INT-554 item D3): what "a recorded clinician outcome" is. The words
    # are the AoMRC's: read, acknowledged and acted upon (or plan to act); act or
    # redirect.
    outcome:
      acknowledgement_closes: false
      acknowledgement_records: "that the item was received and read: the role-holder id and the time, audited; it closes nothing and is never read as an outcome"
      codes:
        action_taken: "the reviewer has acted on the item; what was done is documented in the patient's record"
        plan_to_act: "the reviewer has recorded a plan, at the urgency the reviewer sets by clinical judgement (NICE NG143 1.3.4); a review at the booked visit is such a plan"
        redirected: "the reviewer has sent the item to the clinic now responsible for the patient, being clear that the redirect is safe and appropriate"
      closes_on: [action_taken, plan_to_act]
      redirect_code: redirected
      redirect_closes: false
      redirect_effect: "the item is re-addressed to the named clinic and stays open there"
      content: "the item carries the code, the role-holder id and the time only; the clinical content of the action or the plan is documented in the patient's record, never in the item (invariant 6)"
      note_shows: "a closed item shows its code in the pre-visit note; an item acknowledged but without an outcome is shown open"
      while_outcome_unrecordable: "an item whose outcome the console cannot yet record stays open and pinned to the note; acknowledgement is never taken as its close"
  # Round 4 (INT-554 item D4): who states the four values that stay open.
  tenant_agreed:
    keys: [sla, out_of_hours.coverage, failure_path.escalation_role, failure_path.escalation_after]
    stated_by: "the tenant's clinical governance, in the tenant configuration, per clinic-inbox item kind"
    register_value: "the invariant-17 literal above stays; the register holds no platform-wide value for any of the four"
    why: >-
      The AoMRC's recommendations tie a time frame to the acuity of the finding and
      leave the escalation interval to agreement by the healthcare organisation. A
      clinic-inbox item carries no acuity of its own: its reviewer sets the urgency
      of any follow-up (NICE NG143 1.3.4). Each value also depends on the tenant's
      opening hours, staffing and organisation, which differ by tenant.
    nearest_published_interval:
      text: "AoMRC 2022: a 48-hour interval before escalating an imaging alert not reviewed and acted upon (or plan to act)"
      adopted: false
      why_not: "it is set for imaging alerts (a new cancer diagnosis or a significant addendum), not for a pre-visit clinic inbox, and the same sentence leaves it to agreement by the healthcare organisation"
    until_stated: "the inbox reports not ready (built_route_conformance.inbox_not_ready_report), and every item is still delivered and pinned to the note"
    real_patient_note: "D18 scope: before any real patient, the licensed physician's review covers the values each tenant states"
  # Round 4 (INT-554 item D5): whether the built route satisfies this decision.
  built_route_conformance:
    tenant_safety_queue:
      is_the_booked_clinics_inbox: only_when_condition_holds
      condition: "each entry names the booked clinic, and only the clinicians the tenant rosters to that clinic as tenant_clinic_triage_trained_clinician list it and record its outcome"
      why: "the item goes to the clinical team caring for the patient; an organisation-wide queue may route to that team and follow up what nobody has acted on, but does not replace it"
      while_condition_unmet: interim_delivery_path
      interim_delivery_path: "items are still delivered to the tenant Safety queue and never dropped, and the tenant configuration reports the clinic inbox not ready"
    tenant_clinical_responsible:
      is_the_recipient_role: false
      why: "files/08 defines it as clinical governance, held by the medical director or delegate; its definition requires neither an eligible clinical title nor the in-service triage training this decision's recipient role requires"
      may_record_outcome_when: "its holder is also a tenant_clinic_triage_trained_clinician (an eligible title and in-service triage training, attested when the account is provisioned)"
      escalation_role: "not decided here: whether it is the escalation role is the tenant's to agree (tenant_agreed)"
    inbox_not_ready_report:
      required: true
      not_ready_while_unset: [booked_clinic_routing, rostered_recipient, sla, out_of_hours.coverage, out_of_hours_contact, failure_path.escalation_role, failure_path.escalation_after]
      effect: "reported to the tenant and the platform; never drops, delays or holds an item"
  # Round 4: what changed, item by item. Rounds 1 to 3 above are unchanged except
  # where an item says so. The independent verifier's round-4 verdict is recorded
  # in `verifier`.
  amendments:
    - round: 4
      date: 2026-10-17
      issue: "INT-554 (GitHub #938) items D1, D3, D4 and D5"
      origin: "#931/#932 clinical review, 17 Oct 2026; the reviewers' recommendations were inputs, not decisions"
      items:
        - item: D1
          question: "Does the arms item need both chest-pain arms to read Unknown, as the decision's 'that leaves both chest-pain arms Unknown' says, or is it raised whenever the slot is unresolved?"
          decision: >-
            Whenever the slot is unresolved. The decision now reads "which can leave
            both chest-pain arms Unknown", as item_kind_notes, CD-04's decision and
            CD-08.md already said, and as the build reads CD-04's trigger, which
            names no condition on the arms. An unresolved slot is missing information
            for the clinician even when another feature has fired a rule, and
            computing the arms' state before raising would make a clinician-only item
            depend on rule evaluation. The same sentence now also names the close
            (CD-04 round 4, INT-554 item D2).
          was: "a chest-pain slot still UNCLEAR after its follow-up that leaves both chest-pain arms Unknown"
          now: "a chest-pain slot still UNCLEAR after its follow-up, or left without an answer when the session closes, which can leave both chest-pain arms Unknown"
          value_changed: false
          keys: [decision, item_kind_notes.chest_pain_arms_unresolved]
          spec_basis_ref: ["packages/protocols/decisions/CD-04.yaml value.unresolved_after_follow_up.trigger"]
          status: active
        - item: D3
          question: "closes_only_on_recorded_clinician_outcome has no outcome vocabulary: decide a code set, or accept acknowledgement as an interim close?"
          decision: >-
            A code set; acknowledgement is not accepted as a close, interim or not.
            Acknowledging records receipt and reading (who and when, audited). An
            item closes on action_taken or plan_to_act; the reviewer sets the urgency
            of any follow-up, and a review at the booked visit is a plan. redirected
            re-addresses the item to the clinic now responsible and leaves it open.
            The item carries the code, the role-holder id and the time; the clinical
            content is documented in the patient's record. Until the console can
            record an outcome, an acknowledged item stays open and is shown open in
            the pre-visit note.
          keys: [failure_path.outcome]
          safety_direction: "never closes on a click that records no decision; an item that cannot yet be closed stays visible at the visit"
          sources: [AOMRC-IMAGING-ALERTS-2022, NICE-NG143]
          status: active
        - item: D4
          question: "CD-08's SLA, out-of-hours cover, escalation role and escalation window."
          decision: >-
            All four stay open in the invariant-17 form. They are values each tenant's
            clinical governance agrees, per item kind, in the tenant configuration; no
            guideline found sets one for a pre-visit clinic inbox, and the register
            holds no platform-wide value. The AoMRC's 48-hour interval for imaging
            alerts is recorded as the nearest published interval and not adopted. One
            constraint is added: the tenant names an out-of-hours contact before the
            inbox is ready.
          keys: [tenant_agreed, out_of_hours.constraints]
          what_is_missing: "each tenant's statement of the four values, per item kind; the D18 lane cannot supply it"
          sources: [AOMRC-IMAGING-ALERTS-2022, NICE-NG143]
          status: active
        - item: D5
          question: "Do the tenant Safety queue and tenant_clinical_responsible satisfy the recipient role and 'the booked clinic's named inbox'?"
          decision: >-
            Not as built. The queue is the booked clinic's inbox only when each entry
            names the booked clinic and only the clinicians the tenant rosters to that
            clinic list it and record its outcome; until then it is an interim delivery
            path, items are never dropped, and the inbox reports not ready.
            tenant_clinical_responsible is not the recipient role; its holder records
            an outcome only when also a tenant_clinic_triage_trained_clinician. The
            not-ready report is required.
          keys: [built_route_conformance]
          sources: [AOMRC-IMAGING-ALERTS-2022, TR-ACIL-TEBLIG-2022]
          status: active
