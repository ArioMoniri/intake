# INT-432 clinical decision CD-08. Agent-authored under owner decision D18
# (2 Oct 2026): simulated-patient stress testing only; a licensed physician's
# review is required before any real patient. Every source quote below appears
# verbatim in the named snapshot; spec_basis quotes appear verbatim in the named
# committed file. Not a pack: nothing here is compiled or served.
kind: clinical_decision
id: CD-08
title: "YELLOW_REVIEW routing: recipient role, channel, SLA and failure path"
question: >-
  Who receives a YELLOW_REVIEW (an LLM candidate flag, capped at YELLOW_REVIEW
  and visible to clinicians only), through which channel, within what response
  time, what happens out of hours, and what happens when nobody responds?
decision: >-
  A YELLOW_REVIEW goes, unconditionally, to the booked clinic's named inbox
  (channel clinic_inbox, files/04 §4.2). Its recipient is a role, never a
  person: a clinician of the tenant facility (tabip, hemşire, ebe, acil tıp
  teknikeri or acil tıp teknisyeni, titles taken from the Tebliğ's definition of
  sağlık personeli) who holds the in-service triage training that Tebliğ MADDE
  8(2) requires of anyone performing triage, rostered by the tenant to that
  inbox. The reviewer sets the urgency of any follow-up by clinical judgement,
  as NICE NG143 1.3.4 leaves the urgency of an intermediate-risk finding
  identified remotely to the assessing healthcare professional. The acil servis
  triage desk is not the recipient: regulatory triage is defined for patients
  presenting to the acil servis, and a YELLOW_REVIEW is not an EK-4 level.
  A YELLOW_REVIEW is never shown to the patient and never stands in for a
  patient-facing action; patient-facing urgency comes only from the rules engine.
  It never expires and is never auto-cleared; it closes only on a clinician's
  recorded outcome, and if the visit starts first it is shown in the pre-visit
  note. The response SLA, out-of-hours coverage, and the escalation role and
  window stay draft_needs_source: no current guideline or Turkish regulation
  sets them for a pre-visit clinic inbox. The same inbox, role and constraints
  carry the other clinician-only items the INT-432 decisions route here: a
  red-flag-relevant result that lands after the session (review design change
  6); a scripted probe armed but left unanswered at session end (CD-03); a
  chest-pain slot still UNCLEAR after its follow-up that leaves both chest-pain
  arms Unknown (CD-04, kind chest_pain_arms_unresolved); and a proxy session
  whose seven chest-pain slots stay unasked until the DSL can select proxy copy,
  for a subject in the chest-pain rules' adult age band or of unknown age
  (CD-01, kind proxy_chest_pain_screen_unasked). Each item kind is labelled and
  pinned to the note, never dropped, and its SLA may differ; all stay draft.
  The proxy item only makes the gap visible to a clinician; it does not close
  it (CD-01 finding F13).
status: draft_needs_source
