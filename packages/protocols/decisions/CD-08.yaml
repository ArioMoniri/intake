  YELLOW_REVIEW recipient and its SLA), against files/04 §4.2 defect 1; the
  late-landing addendum of the same review's design change 6; and the
  unanswered armed probe that sibling decision CD-03 defers to physician
  decision 7; and the two chest-pain item kinds raised under sibling decisions
  CD-01 and CD-04. Round 4: INT-554 (GitHub #938) items D1, D3, D4 and D5, from
  the #931/#932 clinical review of 17 Oct 2026, whose recommendations were
  inputs, not decisions.
