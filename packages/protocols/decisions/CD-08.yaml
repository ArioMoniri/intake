  pre-visit note while the SLA and escalation stay draft; a missing SLA never
  drops or delays delivery. The tenant configuration reports the inbox as not
  ready (no stated SLA, no escalation role) instead of inventing one. Round 4
  (INT-554): the report also names a missing escalation window, out-of-hours
  cover or out-of-hours contact, and an item not routed to the booked clinic's
  rostered clinicians (value.built_route_conformance.inbox_not_ready_report).
