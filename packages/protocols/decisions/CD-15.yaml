kind: clinical_decision
id: CD-15
title: "Neurosurgery pre-visit scope: known cancer, an existing brain shunt and a first seizure"
question: >-
  V-BVSC-6: should the beyin ve sinir cerrahisi pre-visit ask about a known cancer, an
  existing brain shunt and a first-ever seizure?
decision: >-
  Known cancer: yes. NICE NG234 makes a past or current diagnosis of cancer the first
  factor in recognising spinal metastases or metastatic spinal cord compression. It
  tells clinicians to contact the MSCC coordinator immediately, as an oncological
  emergency, when such a person has cord-compression symptoms, and within 24 hours when
  they have spinal pain with the listed features. Without the cancer fact, red-flag
  row 6 has no input. The item reuses cerrahi onkoloji's id and wording
  (onceki_kanser_tanisi, "Daha önce size kanser tanısı konuldu mu?"), ungated, which
  also gives one audio clip. The rule it feeds is placed in base.life_threat (CD-13),
  so that rule needs a base-level cancer slot; the neurosurgery item is its gate input
  until then.
  First seizure: yes. NICE NG217 1.1.1 refers adults urgently, for an appointment within
  two weeks, after a first suspected seizure. The item is a clinician-only note item,
  never a RED rule: an ongoing or prolonged seizure is a separate emergency pattern,
  and a seizure after a head injury is NG232's own emergency-ambulance criterion
  (CD-12). The item is ungated. Its lay follow-up describes a seizure without naming a
  diagnosis and keeps "first" and "recently", so a person with known epilepsy or an old
  faint does not answer yes to it.
  Existing brain shunt: stays draft_needs_source. No retrieved current guideline says
  what a pre-visit should ask a person with a cerebrospinal fluid shunt, or which shunt
  symptoms need which action. One sourced part is recorded: NICE NG232 lists "any
  previous brain surgery" as a head-injury referral risk factor, and Q14 already
  records brain or spine surgery, which includes a shunt insertion. Q14 mixes brain and
  spine surgery, so it cannot feed that head-injury factor as it stands. Splitting it
  belongs to the HB-C2 author together with the base head-injury rule. No shunt item is
  added.
