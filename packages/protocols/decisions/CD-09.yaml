fail_closed_while_draft: >-
  While the floor and margin stay draft, and while the real-speech golden set
  does not exist (HB-C10), the evidence gate cannot pass, so no lane or model
  swap reaches the PHI path. The synthetic deployment may still swap lanes for
  simulated-patient stress testing on the regression gate alone, and those runs
  are tagged synthetic and refused as files/04 §8.3 evidence.
