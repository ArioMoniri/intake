# INT-432 clinical decision CD-09. Agent-authored under owner decision D18
# (2 Oct 2026): simulated-patient stress testing only; a licensed physician's
# review is required before any real patient. Every source quote below appears
# verbatim in the named snapshot; spec_basis quotes appear verbatim in the named
# committed file. Not a pack: nothing here is compiled or served. A floor here is
# a release gate, never a statement about the product (invariant 20).
kind: clinical_decision
id: CD-09
title: "Extraction-sensitivity floor and the golden set for lane and model swaps"
question: >-
  What per-rule extraction sensitivity must a lane or model swap reach before
  it may carry red-flag extraction, by what non-inferiority margin may it trail
  the lane it replaces on red-flag false negatives, and what golden set must
  that be measured on?
decision: >-
  A lane or model swap is gated twice. The regression gate applies in every
  deployment: every red-flag extraction golden (one true positive and one
  near-miss negative per rule), the Turkish negation adversarial set, and the
  RED goldens with the council on and off (identical results) must pass for the
  exact provider, model@revision, prompt and decoding parameters being swapped
  in; a failure stops or reverts the swap. The evidence gate applies only to the
  PHI path: per-rule extraction sensitivity, measured on a clinician-labelled
  golden set of real Turkish ASR output from the intended population, must meet
  the sensitivity floor, and red-flag false negatives must be non-inferior to
  the current lane within the margin. The floor and the margin stay
  draft_needs_source: no current guideline or regulation sets either number,
  and the regulators' own principle is that performance goals are derived from
  the product's clinical benefits and risks. Until both are set, and until the
  real-speech golden set exists, no PHI-path swap can pass. Synthetic-patient
  runs and hosted-lane runs never count as files/04 §8.3 evidence; they may only
  serve the regression gate. Measured values are recorded in docs/evidence/
  with a date and a named corpus and are never described as properties of the
  product.
status: draft_needs_source
scope: simulated_patient_stress_testing
scope_note: >-
  Owner decision D18 (2 Oct 2026): agent-only sign-off, for simulated-patient
  stress testing only. A licensed physician's review is required before any real
  patient.
question_origin: >-
  INT-428/INT-430 strict medical review (2 Oct 2026), required design change 12
  and physician decision 8 (the extraction-sensitivity floor and the golden set
  required for lane swaps); INT-428/INT-430 AI/ML review, must-have evals (golden
  set from clinician-labelled real ASR output; non-inferiority on red-flag false
  negatives with the margin set by the clinical owner; RED goldens identical
  with the council on or off).
author_role: "emergency medicine operations / clinical informatics physician (agent)"
