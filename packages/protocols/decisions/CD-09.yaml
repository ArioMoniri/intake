source_gap: >-
  sensitivity_floor, non_inferiority_margin,
  swap_gates.evidence_gate.per_rule_minimum_labelled_cases_and_acceptance_statistic
  and golden_set.labelling.labellers_and_adjudication: no current guideline or
  regulation, Turkish or international, sets a numeric extraction-sensitivity
  floor, a non-inferiority margin, a minimum labelled sample per rule, an
  acceptance statistic, or a labeller count for a symptom-extraction
  component feeding a deterministic triage engine. The FDA/Health Canada/MHRA
  guiding principles (GMLP 2021 principle 6; PCCP 2023 principle 3) place the
  derivation of performance goals and acceptance criteria on the manufacturer's
  clinical benefit-risk analysis, which is a clinical-owner decision. The
  harmonised successor text (IMDRF/AIML WG/N88 FINAL:2025) was not reachable
  from this host at retrieval and is not cited. Any number written here would be
  invented.
value:
  sensitivity_floor: "TODO: per-rule red-flag extraction sensitivity floor for a lane or model swap requires clinical sign-off"
  non_inferiority_margin: "TODO: non-inferiority margin on red-flag extraction false negatives requires clinical sign-off"
  golden_set:
    required_components:
      - id: clinician_labelled_real_asr_output
        definition: >-
          Transcripts produced by the pinned ASR from real Turkish clinical
          speech of the intended population, each red-flag slot labelled by
          clinicians as PRESENT, ABSENT or UNCLEAR.
      - id: true_positive_per_rule
        definition: "At least one labelled true positive for every red-flag rule."
      - id: near_miss_negative_per_rule
        definition: "At least one labelled near-miss negative for every red-flag rule."
      - id: turkish_negation_adversarial_set
        definition: "The files/04 §8.2 negation, hedging and double-negation set."
      - id: red_goldens_identical_council_on_off
        definition: "The RED golden set yields identical results with the council on and off."
    labelling:
      reference_standard: clinician_labelled
      unit: red_flag_slot_answer_state
      labels: [PRESENT, ABSENT, UNCLEAR]
      labellers_and_adjudication: "TODO: the clinician labeller count and adjudication rule for the golden set requires clinical sign-off"
      audio: >-
        Labels are made on ASR transcripts. Audio is used only from a consented
        research corpus under its own ethics route (HB-C10); production audio is
        never retained (invariant 3), so it is never a labelling source.
    independence: never_used_for_prompt_or_model_tuning
    bound_to: [provider, model_at_revision, prompt_hash, decoding_parameters]
    synthetic_runs_count_as_evidence: false
    hosted_runs_count_as_evidence: false
  swap_gates:
    regression_gate:
      applies_to: every_deployment
      requires: [true_positive_per_rule, near_miss_negative_per_rule, turkish_negation_adversarial_set, red_goldens_identical_council_on_off]
    evidence_gate:
      applies_to: phi_path_only
      requires: [clinician_labelled_real_asr_output, sensitivity_floor, non_inferiority_margin, per_rule_minimum_labelled_cases_and_acceptance_statistic]
      per_rule_minimum_labelled_cases_and_acceptance_statistic: "TODO: the per-rule minimum labelled sample and acceptance statistic for the sensitivity floor and non-inferiority margin requires clinical sign-off"
    failure_action: stop_or_revert_swap
  evidence_recording: docs_evidence_dated_named_corpus_never_a_product_property
