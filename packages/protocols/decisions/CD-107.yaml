# INT-615 clinical decision CD-107: sourcing the draft rules of base.life_threat
# (owner, 17 Nov 2026: "yes source the 15 red flag rules"). Agent-authored under
# owner decision D18 (2 Oct 2026). It covers simulated-patient stress testing only,
# and a licensed physician's review is required before any real patient. Every
# source quote below appears verbatim in the named snapshot, and every spec_basis
# quote appears verbatim in the named committed file. Not a pack: nothing here is
# compiled or served, and files/protocols/base.life_threat.yaml is unchanged.
kind: clinical_decision
id: CD-107
title: "Sourcing the two draft rules of base.life_threat: the airway trigger set is sourced, and both rules stay draft"
question: >-
  The owner asked for the draft red-flag rules of base.life_threat to be sourced. For
  each draft rule, which current guideline states its trigger, threshold and level,
  quoted from a committed snapshot? Can the rule leave draft_needs_source without
  relaxing it (CLAUDE.md invariant 7)?
decision: >-
  The pack holds four rules. Two are active (the EK-4 chest-pain pair) and two are
  draft_needs_source: rf.paediatric_airway_obstruction and
  rf.crisis_disclosure_signposting. The fifteen the owner was told about is the
  compiler's count. `protocols compile --pack base.intake --life-threat
  files/protocols/base.life_threat.yaml` refuses fifteen draft rules: these two, and
  the thirteen red_flags families of packages/protocols/base/intake.yaml. Those
  thirteen are skeletons, not unsourced values. Each has a pending trigger and a
  placeholder level, and no register or action scripts. Each names its own blockers
  (HB-C2 and HB-C7; HB-C4 for pregnancy; HB-L2 and HB-C8 for the two suicide
  families). Sourcing them means authoring them, which is new red-flag semantics and
  outside the life-threat brief, so INT-615 does not author them.
  rf.paediatric_airway_obstruction: its trigger set now has a paediatric source. The
  RCH Melbourne guideline on acute upper airway obstruction (PIC endorsed, last updated
  March 2021) names each of the four parent-reportable features. It lists stridor
  under moderate obstruction and sniffing or tripod position under severe to complete
  obstruction. Drooling and dysphagia appear among the features of retropharyngeal
  abscess and epiglottitis, and muffled voice among those of quinsy and epiglottitis.
  Its key point, letting the child keep a position of their choice and avoiding
  distress, also supports the rule's CALM delivery. EK-4 is the binding Turkish triage
  table. It names airway obstruction risk in Kırmızı Kategori 1 and severe stridor or
  swallowing difficulty with airway obstruction risk in Kategori 2. The rule still
  stays draft_needs_source, for three reasons no committed source settles. (1) Level:
  the rule is KIRMIZI_K1, but EK-4 prints the two features it names, stridor and
  swallowing difficulty, in Kategori 2. Lowering the rule to K2 would relax it, which
  invariant 7 forbids an agent to do. Keeping K1 on EK-4's general Kategori 1 line is
  a reading, not a quote. The level stays as authored and the choice is the
  physician's. (2) Age band: the gate reads subject.age_years < 18, and neither RCH nor
  EK-4 states an upper age bound. The WHO IMCI chart already committed covers 2 months
  up to 5 years, and adopting it would narrow the rule. (3) Stridor qualifier: RCH
  lists intermittent stridor under mild obstruction, and EK-4 says severe stridor. The
  gate fires on any reported stridor, which is the more sensitive reading. Qualifying
  it would narrow the rule, and that is a physician's call that LT-03-N already guards.
  rf.crisis_disclosure_signposting stays draft_needs_source. No guideline supplies a
  Turkish crisis lexicon: it has to be authored by a clinician (HB-C17), and the
  escalation policy it hands off to does not exist (HB-C8). The rule file's own record
  that 112 is the single number is already cited there (files/04 §4.1).
  files/protocols/base.life_threat.yaml is deliberately not edited. No rule changes
  status, and an edit would void the D23 synthetic signature with no rule to show for
  it. Narrowing the airway source_gap text to the three items above is folded into
  the one re-sign that follows the physician's sign-off.
status: active
scope: simulated_patient_stress_testing
scope_note: "Owner decision D18 (2 Oct 2026): agent-only sign-off, for simulated-patient stress testing only. A licensed physician's review is required before any real patient. No clinical_signoff field is touched (D17), and HB-C1 stays open; a paediatrician signs the airway rule."
question_origin: "Owner, 17 Nov 2026, in chat: 'yes source the 15 red flag rules'. INT-615."
