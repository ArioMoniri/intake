inference_disclosure: "Reading drooling and muffled voice as triggers of airway obstruction rests on RCH's differential-diagnoses table for acute upper airway obstruction, where they are features of named causes (retropharyngeal abscess, quinsy, epiglottitis) rather than graded severity signs; that reading is this author's. Mapping a parent's report onto the guideline's clinician-observed features is the pack's own split (files/04 §8.1 rule 2), already disclosed on the rule."
