    section: "Non-negotiable invariants, 7"
    quote: "Red-flag rules are monotonic across protocol inheritance: children/overlays add or tighten, never remove or relax."
    supports: "level, age_band, stridor_qualifier (why the agent keeps the authored values)"
  - file: files/HUMAN_BLOCKERS.md
    section: "HB-C17"
    quote: "Author the Turkish crisis lexicon, and decide what it triggers."
    supports: crisis_rule
  - file: files/protocols/base.life_threat.yaml
    section: "rf.paediatric_airway_obstruction source_gap"
    quote: "What is still missing is a citable Turkish or international paediatric emergency source for the TRIGGER SET itself"
    supports: trigger_set
source_gap: >-
  Level: EK-4 prints severe stridor and swallowing difficulty in Kırmızı Kategori 2 and
  airway obstruction risk in Kategori 1, so whether a parent-reported feature is K1 or
  K2 is not stated, and the agent may not lower the authored K1. Age band: no committed
  paediatric source states an upper age bound for the rule. Stridor qualifier: RCH
  grades intermittent stridor as mild and EK-4 qualifies it as severe, while the gate
  fires on any reported stridor. Crisis rule: the lexicon must be authored by a
  clinician (HB-C17), and the escalation policy does not exist (HB-C8).
fail_closed_while_draft: "Both rules stay draft_needs_source in files/protocols/base.life_threat.yaml and are never compiled into a served pack. The D23 served list stays the two chest-pain rules."
