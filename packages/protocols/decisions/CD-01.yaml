kind: clinical_decision
id: CD-01
title: "Chest-pain slots the two active RED rules read (HB-C6)"
question: "Which slots, with which scripted Turkish questions and closed choices, must base.intake declare so that rf.chest_pain_cardiac_features and rf.chest_pain_no_cardiac_history can evaluate, and which patients are asked each one?"
decision: "Declare three sections and seven slots: chest_pain {present, character, radiation, onset_at}, associated {diaphoresis, dyspnoea} and trauma {recent}. chest_pain.present is asked of every session as one direct scripted question that names pain or discomfort, now or recently, because NICE CG95 counts discomfort as chest pain and requires an immediate check of current pain and, when pain free, of the last episode. The other six are asked only when chest_pain.present is true. All seven are must_ask: the K2 rule can fire on chest_pain.present, one positive feature and the anchor with the others unanswered (T or U is T), but the SARI rule fires only when all seven are answered, so leaving any of them unasked silently removes the SARI arm. Every code slot offers a closed choice containing each literal the rules test, spelled exactly. character adds 'yanma' (a pain character the CKM Symptom/Sign archetype names) and 'başka bir his' (the archetype's free character phrase); radiation adds 'boyun' and 'omuz' (NICE CG95 1.3.3.1) and 'başka bir yer'. An answer naming more than one site or more than one character word is recorded CONTESTED with every named value and evaluated on their union (files/12 §7.3); it is never stored as a list (a list reads Unknown) and never reduced to one value, and 'yok' is exclusive. The associated symptoms are asked as occurring with the chest pain (NICE CG95 1.2.1.3: marked sweating, breathlessness). trauma.recent is anchored to the current chest-pain episode rather than to a numeric window, because no retrieved source states a window. onset_at holds the time of the most recent episode, not the first onset (NICE CG95 1.2.1.1), and is answered from the four-band closed choice of CD-05. Each slot also carries a proxy form, spoken when identity_check.subject_role is 'yakınım adına', because the CKM Symptom/Sign archetype records symptoms as reported by a parent, care-giver or other party; the DSL holds one ask_tr per slot, so until it can select the proxy form the proxy stop-gap below applies, and the under-triage gap it leaves is recorded as finding F13. Disagreements between the sources and the two rules are recorded as findings and are not applied to base.life_threat. Round 4 amendment (INT-554, 17 Oct 2026). identity_check.subject_role is asked, and bound to one of its authored choices, before any of the seven slots is asked, and no chest-pain slot is asked ahead of it. If the subject role binds 'yakınım adına' after a chest-pain slot was answered, every chest-pain answer given before the binding is invalidated, as files/13 §11.3 invalidates an answer whose premise has changed: it is discarded rather than stored as the patient's, the slots read NOT_ASKED, and the proxy item is raised. A level the rules engine has already determined from those answers is never lowered, because the person who answered reported it, and an invalidated answer never removes a RED it would fire, during the session or at its close: it is kept on the session's triage record, labelled answered_before_role_bound, and the rules are evaluated under files/13 §11.2's worst-case union of the patient's slots and those answers. The subject's age is bound only from the subject's own recorded date of birth, never from a slot answer and never from the speaker's identity; with none, or while the rules' adult band states no lower bound, it is unknown, so the proxy item is raised as it is today."
status: active
scope: simulated_patient_stress_testing
author_role: "emergency medicine and internal medicine/cardiology physician (agent)"
inference_disclosure: "The proxy wording, the CONTESTED recording of multi-value answers and the proxy stop-gap are this author's operationalisation; no cited guideline words a proxy question or a multi-site answer. The character/radiation/associated feature split itself is the rule author's, as base.life_threat's own inference_disclosure says. Round 4 (INT-554): binding the subject role strictly before the chest-pain slots, and invalidating a chest-pain answer given before a proxy binding, are this author's operationalisation of the stop-gap's purpose; that a second-person question answered before the role is known is about the speaker is the structural reading of the copy (it asks about 'Göğsünüzde'), not a clinical source. Keeping a level already determined, and evaluating the invalidated answers under the worst-case union so that no RED they would fire is removed, apply files/13 §11.2's monotonic rule and worst-case union to an invalidation, which that section does not itself name."
