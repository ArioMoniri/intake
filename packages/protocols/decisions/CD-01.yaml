spec_basis:
  - file: files/12_DSL_V2_AND_RUNTIME_SPEC.md
    section: "§7.3 Slot supersession, and triage leaves the queue"
    quote: "triage evaluates on the *union* of head and superseded values and takes `max` acuity."
    supports: "sections.chest_pain.radiation.multi_select, sections.chest_pain.character.multi_select"
  - file: packages/protocols/src/protocols/triage/context.py
    section: "canonical_scalar docstring"
    quote: "for JSON null and for collections. Those are inside the carrier and simply do not compare in this grammar, so a predicate over them reads Unknown and a rule does not fire."
    supports: "multi_select: never stored as a list"
  - file: files/protocols/base.life_threat.yaml
    section: "RULE SCHEMA, gate"
    quote: "`T ∨ U = T`, everything else with U is U."
    supports: "must_ask_reason (K2 can fire with features unanswered; the SARI conjunction cannot)"
  - file: packages/protocols/base/intake.yaml
    section: "identity_check.subject_role choices_tr"
    quote: "tr: [\"kendim için\", \"yakınım adına\"]"
    supports: "proxy_selection"
  - file: files/protocols/base.life_threat.yaml
    section: "RULE SCHEMA, age_band"
    quote: "age_band:           adult | paediatric | both"
    supports: "proxy_unasked_inbox_item.raised_when (both chest-pain rules carry age_band: adult)"
  - file: files/13_QUESTION_FLOW.md
    section: "§9.1 Nine priority classes, one total order"
    quote: "universal facts other *rules* depend on"
    supports: "amendments round 4 (INT-554 item D7) subject_role_first: the subject role is the fact the chest-pain stop-gap, and so both chest-pain rules, depend on"
  - file: files/13_QUESTION_FLOW.md
    section: "§11.3 The ask-ahead race that is currently a fabricated-data path"
    quote: "the answer rather than storing it, record nothing for that slot."
    supports: "amendments round 4 (INT-554 item D7) answered_before_proxy_binding: an answer whose premise changed is discarded, not stored"
  - file: files/13_QUESTION_FLOW.md
    section: "§11.2 Contradiction — and it can never lower triage"
    quote: "Monotonic: a contradiction can never lower a level"
    supports: "amendments round 4 (INT-554 item D7) answered_before_proxy_binding.level_already_determined"
  - file: files/13_QUESTION_FLOW.md
    section: "§11.2 Contradiction — and it can never lower triage"
    quote: "if either value would fire a rule, the rule fires."
    supports: "amendments round 4 (INT-554 item D7, author revision) answered_before_proxy_binding.worst_case_union"
  - file: packages/protocols/decisions/CD-05.yaml
    section: "value.never_asked_at_close"
    quote: "evaluated_as: reference_day"
    supports: "amendments round 4 (INT-554 item D7, author revision) answered_before_proxy_binding.at_close"
  - file: packages/protocols/decisions/CD-100.yaml
    section: "value.amendments round 4, T1 decision"
    quote: "from recorded demographics, false when nothing is recorded, never through the slot lookup."
    supports: "amendments round 4 (INT-554 item D7) subject_age: the same binding rule for a demographic fact"
value:
  proxy_selection: "proxy_ask_tr / proxy_follow_up_tr are spoken instead of ask_tr / follow_up_tr whenever identity_check.subject_role is 'yakınım adına'; a proxy answer fills the patient's slot with proxy-reported provenance"
  proxy_until_dsl_selects_copy: "The DSL holds one ask_tr per slot. Until it can select proxy copy, the self-worded copy of these seven slots is not spoken in a proxy session and the seven slots stay NOT_ASKED (rendered 'Sorulmadı'). This stop-gap avoids filling the patient's slots with the speaker's own answers, but it is not fail-closed: meanwhile neither chest-pain RED rule can fire in a proxy session, a known under-triage gap recorded as finding F13 that blocks any real patient. In simulated stress testing a proxy persona with chest pain is reported as unscreened, never as negative."
  proxy_unasked_inbox_item:
    kind: proxy_chest_pain_screen_unasked
    decision_ref: CD-08
    raised_when: "identity_check.subject_role is 'yakınım adına' and the subject is in the adult age band of rf.chest_pain_cardiac_features and rf.chest_pain_no_cardiac_history (both age_band: adult), or the subject's age is unknown"
    not_raised_when: "the subject is known to be outside that adult age band (for example a child intake), where neither chest-pain rule applies"
    pinned_to_note: true
  considered_proxy_alternative:
    wording_tr: "Şu anda ya da yakın zamanda göğüste ağrı veya rahatsızlık oldu mu?"
    adopted: false
    reason: "Without a possessor the question does not say whose chest is meant, so in a proxy session the speaker can answer about their own chest and fill the patient's rule-gate slot with the wrong subject, which is the hazard the stop-gap exists to avoid; no cited source supports subject-neutral wording, and the self copy is pinned by base.intake's test. Recorded as considered, not adopted."
  sections:
    chest_pain:
      present:
        type: boolean
        valueset: null
        choices_tr: []
        ask_tr: "Göğsünüzde şu anda ya da yakın zamanda ağrı veya rahatsızlık oldu mu?"
        follow_up_tr: "Göğsünüzde herhangi bir ağrı ya da rahatsızlık hissettiniz mi?"
        proxy_ask_tr: "Yakınınızın göğsünde şu anda ya da yakın zamanda ağrı veya rahatsızlık oldu mu?"
        proxy_follow_up_tr: "Yakınınızın göğsünde herhangi bir ağrı ya da rahatsızlık oldu mu?"
        ask_if: null
        must_ask: true
        required: true
        must_ask_reason: "Both active rules gate on chest_pain.present == true. NICE CG95 1.2.1.1 requires an immediate check of current chest pain and, when pain free, of the last episode, so the question covers now and recently; the CG95 definition counts discomfort as chest pain, so the question names both. Asked of every session because base.life_threat is evaluated on every session regardless of branch (files/04 §8); its cost against the fast-mode turn budget is HB-C5, not this decision."
        sources: [NICE-CG95, TR-EK4-2022, openEHR-EHR-CLUSTER.symptom_sign.v2]
        openehr_archetype:
          archetype_id: openEHR-EHR-OBSERVATION.symptom_sign_screening.v1
          revision: "1.0.7"
          element: "at0005 Presence?"
      character:
        type: code
        valueset: vs.chest_pain_character
        choices_tr: ["baskı", "sıkışma", "ağırlık", "yanma", "başka bir his"]
        ask_tr: "Göğsünüzdeki bu his en çok hangisine benziyor: baskı, sıkışma, ağırlık, yanma ya da başka bir his?"
        follow_up_tr: "Baskı, sıkışma, ağırlık, yanma ya da başka bir his diyebilirsiniz; hangisi size daha yakın?"
        proxy_ask_tr: "Yakınınızın göğsündeki bu his en çok hangisine benziyor: baskı, sıkışma, ağırlık, yanma ya da başka bir his?"
        proxy_follow_up_tr: "Baskı, sıkışma, ağırlık, yanma ya da başka bir his diyebilirsiniz; yakınınızın anlattığına hangisi daha yakın?"
        ask_if: "chest_pain.present == true"
        must_ask: true
        required: true
        multi_select: "more than one word is recorded CONTESTED carrying every named value and evaluated on their union (files/12 §7.3); never stored as a list (a list reads Unknown in context.py) and never reduced to one value"
        must_ask_reason: "rf.chest_pain_cardiac_features reads character in {baskı, sıkışma, ağırlık} as one disjunct of four, and rf.chest_pain_no_cardiac_history requires its negation; NICE CG95 1.2.4.3 and 1.3.2.1 require the characteristics of the pain to be recorded."
        choice_basis:
          "baskı": "literal tested by both rules (rule-required)"
          "sıkışma": "literal tested by both rules; NICE CG95 1.3.3.1 'constricting discomfort'"
          "ağırlık": "literal tested by both rules (rule-required)"
          "yanma": "CKM CLUSTER.symptom_sign.v2 at0189 Character names 'burning' as a pain character; not in the rules' cardiac set (finding F6)"
          "başka bir his": "CKM at0189 Character is a free word or short phrase; the patient's own word is kept verbatim in hpi.character_text"
        unanswerable: "'bilmiyorum' is not a choice; it maps to the UNCLEAR answer state (CD-04), never to a value"
        sources: [TR-EK4-2022, NICE-CG95, openEHR-EHR-CLUSTER.symptom_sign.v2]
        openehr_archetype:
          archetype_id: openEHR-EHR-CLUSTER.symptom_sign.v2
          revision: "2.1.4"
          element: "at0189 Character"
      radiation:
        type: code
        valueset: vs.chest_pain_radiation
        choices_tr: ["kol", "çene", "sırt", "boyun", "omuz", "başka bir yer", "yok"]
        ask_tr: "Bu ağrı ya da rahatsızlık kolunuza, çenenize, sırtınıza, boynunuza, omzunuza ya da başka bir yere yayılıyor mu?"
        follow_up_tr: "Yayılmıyorsa yok diyebilirsiniz; yayılıyorsa nerelere yayıldığını söyler misiniz?"
        proxy_ask_tr: "Bu ağrı ya da rahatsızlık yakınınızın koluna, çenesine, sırtına, boynuna, omzuna ya da başka bir yere yayılıyor mu?"
        proxy_follow_up_tr: "Yayılmıyorsa yok diyebilirsiniz; yayılıyorsa nerelere yayıldığını söyler misiniz?"
        ask_if: "chest_pain.present == true"
        must_ask: true
        required: true
        multi_select: "a multi-site answer is recorded CONTESTED carrying every named site and evaluated on their union (files/12 §7.3); never stored as a list (a list reads Unknown in context.py) and never reduced to one site; 'yok' is exclusive of every other choice"
        must_ask_reason: "rf.chest_pain_cardiac_features reads radiation in {kol, çene, sırt} as one disjunct of four; rf.chest_pain_no_cardiac_history requires radiation == 'yok', so without an explicit 'yok' the SARI arm can never fire. NICE CG95 1.2.1.3 names the arms, back or jaw."
        choice_basis:
          "kol": "literal tested by the K2 rule; NICE CG95 1.2.1.3 'the arms'"
          "çene": "literal tested by the K2 rule; NICE CG95 1.2.1.3 'jaw'"
          "sırt": "literal tested by the K2 rule; NICE CG95 1.2.1.3 'back'"
          "boyun": "NICE CG95 1.3.3.1 'neck'; not in the rules' set (finding F5)"
          "omuz": "NICE CG95 1.3.3.1 'shoulders'; not in the rules' set (finding F5)"
          "başka bir yer": "CKM at0151 Body site records the distal site of radiation as reported"
          "yok": "literal tested by the SARI rule"
        sources: [TR-EK4-2022, NICE-CG95, openEHR-EHR-CLUSTER.symptom_sign.v2]
        openehr_archetype:
          archetype_id: openEHR-EHR-CLUSTER.symptom_sign.v2
          revision: "2.1.4"
          element: "at0151 Body site"
      onset_at:
        type: date
        valueset: null
        choices_tr: ["şu anda var", "son on iki saat içinde", "on iki saatten önce ama son üç gün içinde", "üç günden daha önce"]
        ask_tr: "Göğsünüzdeki bu ağrı ya da rahatsızlık en son ne zaman oldu?"
        follow_up_tr: "Şu anda var, son on iki saat içinde, on iki saatten önce ama son üç gün içinde ya da üç günden daha önce diyebilirsiniz; hangisi doğru?"
        proxy_ask_tr: "Yakınınızın göğsündeki bu ağrı ya da rahatsızlık en son ne zaman oldu?"
        proxy_follow_up_tr: "Şu anda var, son on iki saat içinde, on iki saatten önce ama son üç gün içinde ya da üç günden daha önce diyebilirsiniz; hangisi doğru?"
        ask_if: "chest_pain.present == true"
        must_ask: true
        required: true
        semantics: "the time of the most recent episode (or 'ongoing now'), not the first onset; the four bands do not overlap, and each resolves to an ISO date against the session reference time as decided in CD-05"
        numerals_note: "the choices spell twelve hours and three days in words because NICE CG95's bands are defined in hours; no numeral reaches TTS (invariant 22)"
        must_ask_reason: "Both rules are tense-qualified on chest_pain.onset_at and cannot fire on an undated symptom; NICE CG95 1.2.1.1 requires checking when the last episode of pain was."
        sources: [NICE-CG95, openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
        openehr_archetype:
          archetype_id: openEHR-EHR-OBSERVATION.symptom_sign_screening.v1
          revision: "1.0.7"
          element: "at0037 Timing"
    associated:
      diaphoresis:
        type: boolean
        valueset: null
        choices_tr: []
        ask_tr: "Bu ağrı ya da rahatsızlık sırasında çok terlediniz mi?"
        follow_up_tr: "Ağrı olduğu sırada normalden çok daha fazla terleme oldu mu?"
        proxy_ask_tr: "Bu ağrı ya da rahatsızlık sırasında yakınınız çok terledi mi?"
