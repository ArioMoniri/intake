  findings:
    - id: F1
      finding: "The rules' evidence quotes are written with a lower-case 'kardiyak'; EK-4 prints both entries with a capital 'K', so a case-sensitive verbatim check of the rules' quotes against this snapshot fails. Not changed here."
      quote: "Kardiyak ağrıya benzer göğüs ağrısı"
      guideline_id: TR-EK4-2022
    - id: F2
      finding: "Both rules cite https://www.resmigazete.gov.tr/eskiler/2022/09/20220913-6.htm, which returned HTTP 404 on 2026-10-02. The Tebliğ is item 20220913-5.htm of the 13/9/2022 Resmî Gazete and EK-4 is in its scanned annex 20220913-5-1.pdf. Not changed here."
      quote: "YATAKLI SAĞLIK TESİSLERİNDE ACİL SERVİS HİZMETLERİNİN"
      guideline_id: TR-EK4-2022
    - id: F3
      finding: "NICE CG95 1.2.1.3 lists nausea and vomiting with chest pain; the K2 rule's associated disjunction reads only diaphoresis and dyspnoea, and no nausea or vomiting slot exists. Adding a disjunct is a rule change for the signing clinician."
      quote: "chest pain associated with nausea and vomiting, marked sweating, breathlessness, or particularly a combination of these"
      guideline_id: NICE-CG95
    - id: F4
      finding: "NICE CG95 1.2.1.3 lists pain lasting longer than fifteen minutes; neither rule reads a duration, and hpi.duration is not read by any rule."
      quote: "pain in the chest and/or other areas (for example, the arms, back or jaw) lasting longer than 15 minutes"
      guideline_id: NICE-CG95
    - id: F5
      finding: "NICE CG95 1.3.3.1 places anginal discomfort in the neck and shoulders as well as the jaw and arms. The K2 radiation set is {kol, çene, sırt}; a patient whose pain spreads only to the neck or shoulder, with no other feature, satisfies neither rule (not in the K2 set, and not 'yok' for the SARI rule), so no rule fires."
      quote: "constricting discomfort in the front of the chest, or in the neck, shoulders, jaw or arms"
      guideline_id: NICE-CG95
    - id: F6
      finding: "The CKM archetype names burning as a pain character. The K2 character set omits 'yanma', so burning chest pain with no other feature routes to the SARI arm rather than K2. Whether burning belongs to the cardiac set stays draft_needs_source here: the ESC 2023 ACS guideline section 3.1.1 primary text could not be retrieved by this author (publisher site behind a bot check)."
      quote: "pain could be described as 'gnawing', 'burning', or 'like an electric shock'"
      guideline_id: openEHR-EHR-CLUSTER.symptom_sign.v2
    - id: F7
      finding: "Both rules anchor on chest_pain.onset_at, but the NICE windows run from the last episode. If onset_at held the first onset, a pain that began days ago and is present now would fail tense: now. This decision defines onset_at as the most recent episode; renaming the slot is for the rule author."
      quote: "If they are pain free, check when their last episode of pain was"
      guideline_id: NICE-CG95
    - id: F8
      finding: "NICE CG95 1.2.1.8 sends a last episode twelve to seventy-two hours old for urgent same-day assessment. The K2 rule carries tense: now only and there is no same-day cardiac-features arm, so a final resolution of that band either over-triages to EMERGENCY_NOW or fires nothing (CD-05 keeps it draft_needs_source and states the while-draft behaviour)."
      quote: "the last episode of pain was 12 to 72 hours ago."
      guideline_id: NICE-CG95
    - id: F9
      finding: "Three-valued gap, with chest_pain.present true and no feature reading True. If any of character, radiation, diaphoresis or dyspnoea is UNCLEAR, the K2 disjunction reads Unknown (False or Unknown is Unknown) and the SARI conjunction reads Unknown. If only trauma.recent is UNCLEAR, the K2 disjunction reads False (K2 does not read trauma) and the SARI conjunction reads Unknown. In both cases neither rule fires, although EK-4 names chest pain by row in KIRMIZI Kategori 2 and SARI Kategori 1 (and chest injury without chest pain in SARI Kategori 2). CD-04 routes an UNCLEAR that survives the follow-up to a clinic-inbox item so it is never dropped."
      quote: "Kardiyak öykü ile uyumlu olmayan göğüs ağrısı"
      guideline_id: TR-EK4-2022
    - id: F10
      finding: "Chest pain with trauma.recent true and no K2 feature fires nothing: K2 needs a feature, the SARI_K1 rule's own gate requires trauma.recent == false (a condition EK-4's SARI Kategori 1 row does not itself state), and EK-4's SARI Kategori 2 row covers a simple chest injury WITHOUT chest pain or breathing difficulty. Writing that third arm (CI gate ek4_chest_pain_split_is_three_way) therefore does not close this gap; it needs a decision on painful chest injury."
      quote: "Göğüs ağrısı ve solunum sıkıntısı olmayan basit göğüs yaralanmaları"
      guideline_id: TR-EK4-2022
    - id: F11
      finding: "The Tebliğ defines triage as performed by the duty health personnel, with in-service triage training. An EK-4 level computed before arrival is therefore signposting toward triage, not triage under MADDE 8; this belongs in the regulatory file."
      quote: "Triyaj yapacak personele hizmet içi eğitim verilmiş olmalıdır."
      guideline_id: TR-EK4-2022
    - id: F12
      finding: "EK-4 KIRMIZI Kategori 2 also lists severe pain of any cause. Neither chest-pain rule reads hpi.severity_nrs, so severe chest pain without a K2 feature lands at SARI_K1, or fires nothing under F9."
      quote: "Herhangi bir nedenle olan ciddi ağrı"
      guideline_id: TR-EK4-2022
    - id: F13
      finding: "Until the DSL can select proxy copy, none of the seven chest-pain slots is asked in a proxy session (subject_role 'yakınım adına'), so neither chest-pain RED rule can fire for an adult patient spoken for by a relative: the immediate check NICE CG95 asks for is not performed. This is a known under-triage gap that blocks any real patient. In simulated stress testing a proxy persona with chest pain is reported as unscreened, never as negative; a subject-neutral wording was considered and not adopted (value.considered_proxy_alternative)."
      quote: "Check immediately whether people currently have chest pain."
      guideline_id: NICE-CG95
  # Round 4: what changed. Rounds 1 to 3 above are unchanged. The independent
  # verifier's round-4 verdict is recorded in `verification` below and in
  # `verifier`.
  amendments:
    - round: 4
      date: 2026-10-17
      issue: "INT-554 (GitHub #938) item D7"
      origin: "#931/#932 clinical review, 17 Oct 2026, and the INT-525 residual 2; the reviewers' recommendations were inputs, not decisions"
      verification:
        round: 4
        date: 2026-10-17
        head: ca99030a
        reviewer: "independent D18 clinical verifier (agent; EM/IM/O&G)"
        verdict: revise
        findings: >-
          One clause needs a revision; the rest agrees. Agree: the subject role is
          asked and bound before any chest-pain slot (files/13 §9.1 GATEKEEPER, and
          §11.3 bars ask-ahead at priority ≤ 1); a speaker's answer is never filed as
          the patient's (files/13 §11.3); a late "kendim için" keeps the answers; and
          the subject's age binds from the subject's own record only and stays unknown
          while the band states no lower bound, so the proxy item is raised as today.
          The CKM symptom_sign v2 phrase "as reported by the individual, parent,
          care-giver or other party" was re-read in the ADL CKM serves today, and CG95
          1.2.1.1 on the live NICE page. Revise: "a level the rules engine has already
          determined ... is never lowered" protects only a level that has already
          fired. Take a late proxy binding after chest_pain.present and one feature
          were affirmed and before the onset anchor was asked. No level is determined
          yet. With those answers kept, CD-05's never_asked_at_close evaluates the
          anchor as the reference day at close, and rf.chest_pain_cardiac_features
          fires KIRMIZI_K2. Once they are invalidated, chest_pain.present reads
          NOT_ASKED, CD-05 does not apply, and no RED fires. The decision's own reason
          (whoever answered reported that chest pain, and the RED script reaches
          whoever is at the device) and files/13 §11.2's worst-case union ("if either
          value would fire a rule, the rule fires") both say the invalidation must not
          remove a RED those answers would fire, now or at close. The revision must
          state that an answer invalidated by a late proxy binding leaves the
          patient's slots but never removes a RED it would fire during the session or
          at its close. How the record carries that answer is the author's to decide,
          for example evaluated under the worst-case union and labelled as answered
          before the role bound. It also needs a golden whose near miss is the same
          answers with no late binding.
        per_item:
          D7: "revise (see findings). subject_role_first, the invalidation of the patient's record, the late 'kendim için' and subject_age agree"
      # The author's answer to the round-4 verification, for verifier round 2.
      author_revision:
        date: 2026-10-17
        in_response_to: "verification round 4 (revise): 'never lowered' covered only a level already fired"
        changes:
          - "an answer invalidated by a late proxy binding never removes a RED it would fire, during the session or at its close: it is kept on the session's triage record (answered_before_role_bound), evaluated under files/13 §11.2's worst-case union with the patient's slots, and closed as the patient's would have been, so CD-05's never_asked_at_close still fires the close-time K2 (answered_before_proxy_binding.red_it_would_fire, kept_as, evaluated_under, at_close)"
          - "a golden and its near miss (answered_before_proxy_binding.golden), evaluated against the life-threat rules by tests/safety/test_int554_late_proxy_golden.py"
          - "subject_role_first, the late 'kendim için' and subject_age are unchanged"
        decisions_changed: "D7 clarified; the patient's record still never holds a speaker's answer"
      verification_round_2:
        round: 2
        date: 2026-10-17
        head: edead8b4
        reviewer: "independent D18 clinical verifier (agent; EM/IM/O&G)"
        verdict: agree
        findings: >-
          Agree; the D7 finding is resolved and the rest of D7 is unchanged. An
          answer invalidated by a late proxy binding still leaves the patient's
          slots (NOT_ASKED, never shown as the patient's). It now stays on the
          session's triage record, labelled answered_before_role_bound, and the
          rules run under files/13 §11.2's worst-case union. At close the kept
          answers are closed as the patient's would have been, so CD-05's
          never_asked_at_close still reads their unasked anchor as the reference
          day and the close-time K2 fires. Both chest-pain rules read only the seven
          CD-01 slots, so evaluating the kept set beside the patient's set loses no
          rule. The two new spec_basis sentences are verbatim (files/13 §11.2;
          CD-05 never_asked_at_close). tests/safety/test_int554_late_proxy_golden.py
          evaluates the golden against the life-threat rules as the golden suite
          builds them. The kept answers (present "evet", character "baskı", anchor
          at the reference day) fire rf.chest_pain_cardiac_features KIRMIZI_K2, and
          the patient's slots alone are GREEN. The near miss, the same answers bound
          "kendim için" first, fires the same K2 with no proxy item. Note for the
          legal lane, not a clinical change: answers kept and attributed to a
          speaker who may not be the patient are data about that speaker. The
          runtime that keeps them needs the invariant-18 inventory annotation and a
          stated basis and retention.
        per_item:
          D7: "agree. No invalidation removes a RED its answers would fire, now or at close; the patient's record never holds a speaker's answer; subject_role_first, the late 'kendim için' and subject_age unchanged"
      items:
        - item: D7
          question: "Proxy item: wire SubjectAge when a verified age fact exists; a screen answered before subject_role binds keeps the speaker's own answer and raises no item. Should the engine ask subject_role strictly first?"
          decision: >-
            Yes. identity_check.subject_role is asked, and bound to one of its
            authored choices, before any of the seven slots is asked, and no
            chest-pain slot is asked ahead of it while the role is unbound. If the
            role nonetheless binds 'yakınım adına' after a chest-pain slot was
            answered, every chest-pain answer given before the binding is
            invalidated: discarded rather than stored as the patient's, the slots
            read NOT_ASKED, and the proxy item is raised. A level the rules engine has
            already determined from those answers is never lowered: whoever answered
            reported that chest pain, and the RED script reaches whoever is at the
            device. Nor does the invalidation remove a RED those answers would fire
            later, during the session or at its close. They leave the patient's slots
            but stay on the session's triage record, attributed to the speaker and
            labelled answered_before_role_bound, never shown as the patient's
            answers. The rules are evaluated under files/13 §11.2's worst-case union
            of the patient's slots and those answers: if either would fire a rule,
            the rule fires, and a RED fired from them carries the label. At close the
            kept answers are closed as the patient's would have been, so CD-05's
            never_asked_at_close reads their never-asked anchor as the reference day
            when their chest_pain.present reads true. A role that binds 'kendim
            için' late keeps the answers. The
            subject's age binds only from the subject's own recorded date of birth
            (the booked patient's record), never from a slot answer and never from
            the speaker's identity or account in a proxy session; without one it is
            unknown. Placing a recorded age in or outside the adult band needs the
            band's lower bound, which neither chest-pain rule states (age_band:
            adult); until one is stated every subject's age is unknown for this
            item, which raises the item exactly as today.
          subject_role_first:
            gatekeeper: identity_check.subject_role
            precedes: [chest_pain.present, chest_pain.character, chest_pain.radiation, chest_pain.onset_at, associated.diaphoresis, associated.dyspnoea, trauma.recent]
            bound_means: "the direct answer binds one of the authored choices of vs.subject_role"
            ask_ahead_before_bound: false
          answered_before_proxy_binding:
            when: "identity_check.subject_role binds the proxy choice after any of the seven slots was answered"
            proxy_choice: "yakınım adına"
            answers: invalidated
            slots_read: NOT_ASKED
            level_already_determined: never_lowered
            # Author revision (after the verifier's round-4 D7 finding).
            red_it_would_fire: never_removed
            kept_as: answered_before_role_bound
            kept_where: "the session's triage record, attributed to the speaker; never in the patient's slots and never shown as the patient's answer"
            evaluated_under: worst_case_union
            worst_case_union: "the rules are evaluated on the patient's slots and on the kept answers as they stood; if either would fire a rule, the rule fires (files/13 §11.2)"
            at_close: "the kept answers are closed as the patient's would have been: CD-05's never_asked_at_close reads their never-asked anchor as the reference day when their chest_pain.present reads true"
            red_label: answered_before_role_bound
            raises: proxy_chest_pain_screen_unasked
            self_choice_late: "a role that binds 'kendim için' after the answers keeps them"
            golden:
              id: late-proxy-binding-keeps-the-close-k2
              answered_before_role_bound:
                chest_pain.present: true
                chest_pain.character: "baskı"
              role_binds_after: "yakınım adına"
              anchor: never_asked
              patient_slots: NOT_ASKED
              fires_at_close: [rf.chest_pain_cardiac_features]
              level: KIRMIZI_K2
              red_label: answered_before_role_bound
              clinic_items: [proxy_chest_pain_screen_unasked]
              near_miss:
                id: no-late-binding-same-answers
                role_binds_before: "kendim için"
                patient_slots: the_same_answers
                fires_at_close: [rf.chest_pain_cardiac_features]
                level: KIRMIZI_K2
                proxy_item: false
          subject_age:
            binds_from: "the subject's own recorded date of birth (the booked patient's record)"
            never_from: [slot_answer, speaker_identity]
            absent_or_unverified: unknown
            band_lower_bound: "not stated by either chest-pain rule (age_band: adult); it is the rule author's to state"
            while_band_bound_unstated: unknown
            effect_today: "none: every proxy session that skips the screen raises the item, as it does now"
          keys: [subject_role_first, answered_before_proxy_binding, subject_age]
          safety_direction: "never a speaker's answer filed as the patient's, never a lowered level, never a RED removed by an invalidation (now or at close), and never fewer proxy items"
          sources: [openEHR-EHR-CLUSTER.symptom_sign.v2, NICE-CG95]
          status: active
verifier:
  verdict: agree
  role: "independent D18 clinical verifier (agent; EM/IM/O&G)"
  verified_on: 2026-10-17
  notes: "Independent verification: round 1 agree_with_changes; round 2 agree_with_changes (proxy stop-gap scope and F13); round 3 agree. Every quote re-checked against the live source; the verifier saw only the committed output and the sources, never the authors' reasoning. Round 4 (INT-554 item D7, head ca99030a): revise, by the independent D18 clinical verifier (agent; EM/IM/O&G), 2026-10-17. The subject role first, the invalidation of the patient's record and the subject's age agree. 'Never lowered' covers only a level already fired. An answer invalidated by a late proxy binding must never remove a RED it would fire, including CD-05's close-time K2 (amendments[0].verification). The verdict stays pending until the author's revision is re-verified. Author revision (17 Oct 2026): an invalidated answer never removes a RED it would fire, now or at close, under the worst-case union, with a golden and a near miss (amendments[0].author_revision); verifier round 2 (2026-10-17, head edead8b4) agree: the kept answers fire the close-time K2 under the worst-case union, the golden and its near miss pass, and the patient's record never holds a speaker's answer; one note for the legal lane on the kept answers' basis and retention (amendments[0].verification_round_2). Rounds 1 to 3 were by the independent clinical verifier (agent; EM/IM/paediatrics). Scope D18: simulated-patient stress testing only; a licensed physician's review is required before any real patient."
