    docs/legal/strings.yaml and the authoring blocker HB-L27, because INT-210 shipped the mechanism; (3)
    the rows 4-5 shared note lists barge-in, which orientVoice.a does not state. The verifier saw only
    the committed output, the two source snapshots, the repository rules and the INT-414 code, never the
    author''s reasoning; it re-fetched both sources and found every quote verbatim. Scope D18: simulated-patient
    stress testing only; a licensed physician''s review is required before any real patient.'
