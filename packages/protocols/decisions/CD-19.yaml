# INT-447 clinical decision CD-19. Agent-authored under owner decision D18
# (2 Oct 2026, INT-432): simulated-patient stress testing only; a licensed
# physician's review is required before any real patient. Every source quote
# below appears verbatim in the named snapshot; spec_basis quotes appear
# verbatim in the named committed file. Not a pack: nothing here is compiled
# or served. The Turkish of each line is byte-equal to its catalogue key.
kind: clinical_decision
id: CD-19
title: 'INT-414 delivery lines: opening and resume (rows 1-9)'
question: INT-414 (#726) adds conversational delivery lines around each question. Do the opening and resume
  lines (three welcomes, two voice orientations, two typed orientations, two resume lines) pass PolicyGuard
  (no diagnosis, treatment, prognosis, reassurance or minimising), stay B1 plain Turkish in the siz register,
  ask nothing, carry no numeral, and fit the moment they are said?
decision: 'All nine pass unchanged. They greet, say what will happen and state only the affordances the
  product really has, in short sentences of everyday words and the siz register, and none of them asks
  anything or carries a numeral. None says where the answers go: that wording renders only from docs/legal/
  (invariant 18), and docs/legal/strings.yaml is not authored yet (HB-L27). Each line below is its own
  entry with its six checks, the author''s verdict and the verifier''s verdict; the Turkish is byte-equal
  to the catalogue key it names.'
status: active
scope: simulated_patient_stress_testing
scope_note: 'Owner decision D18 (INT-432): agent sign-off for simulated-patient testing only. A licensed
  physician''s review is required before any real patient; that requirement is unchanged by this record.'
question_origin: 'INT-447 (#758), split from INT-432 (#735): the HB-C1 table in docs/evidence/INT-414.md
  and the approval:human-clinical label on #726.'
author_role: family medicine physician, patient communication and health literacy (agent; medical author)
