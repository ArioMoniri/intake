value:
  line_count: 9
  changed: []
  checks:
    policyguard: 'PolicyGuard.filter(text, scripted=False) on the dynamic path: no violation, nothing
      dropped, no bridge; and by reading, no diagnosis, treatment, prognosis, reassurance or minimising'
    b1_plain_language: at most two sentences of at most fifteen words, everyday words, no medical jargon
      (Sağlık Bakanlığı plain-language aim)
    siz_register: siz throughout; no sen; no doubled-polite imperative; warmth from -elim/-alım and -ebilirsiniz
    not_a_question: no '?', no mı/mi/mu/mü, no interrogative opening a listener hears as a question
    no_numerals: no digit in tr or en (invariant 22)
    fits_context: true to what the product does at that moment, and right for the slot, the delivery context
      and the lane
