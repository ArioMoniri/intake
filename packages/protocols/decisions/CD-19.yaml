    en: Welcome. Before your examination, I will ask you some questions.
    checks:
      policyguard: pass
      b1_plain_language: pass
      siz_register: pass
      not_a_question: pass
      no_numerals: pass
      fits_context: pass
    author_verdict: approve
    note: 'Greets and says what will happen. ''Muayene'' and ''bazı sorular'' promise no count, no length
      and no outcome. Says nothing about where answers go: invariant 18 keeps that to docs/legal/.'
