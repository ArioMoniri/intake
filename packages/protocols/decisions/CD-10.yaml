      current_ask_tr: "Çocuğunuz her zamanki kadar çiş yapıyor mu?"
      type: boolean
      current_polarity: false_is_concern
      target_polarity: true_is_concern
      action: rename_and_reword
      gen_line: "gen: slot=az_cis; type=boolean"
    - pack: specialty.cocuk_sagligi_ve_hastaliklari
