spec_basis:
  - file: docs/evidence/verification/cluster-wave-b.md
    section: "A.1, row Q5, Q7"
    quote: "Polarity: `false` is the alarm direction, unlike every other symptom slot in the pack."
    supports: question
  - file: docs/evidence/verification/cluster-wave-b.md
    section: "F, child_health"
    quote: "An opposite-polarity twin must not be renamed until the paediatrician fixes one polarity; a rename would invert it."
    supports: "slots ordering: polarity first, rename second"
  - file: docs/evidence/verification/specialty-wave1-3.md
    section: "cocuk_gastroenterolojisi, R Q8 (soru_7) (b)"
    quote: "(b) \"Çocuğunuz her zamankinden daha az çiş yapıyor mu?\" [boolean]"
    supports: "slots[*].ask_tr for az_cis (independently verified text)"
inference_disclosure: >-
  The sources fix the construct and state it in its abnormal direction; none of
  them is a data-model standard that mandates a boolean polarity. Choosing
  true_is_concern for every hydration item, renaming cis_miktari to az_cis, and
  folding the neonatal nappy item into az_cis are this author's representation
  decisions made on that basis. The Turkish wording is the author's and repeats
  a text already verified for cocuk_gastroenterolojisi. NG143 and CG84 are
  scoped to children under five; the polarity rule does not depend on age, but
  whether their features apply above five stays the paediatric applicability
  question recorded in cluster_child_health.md §4 gap 2.
