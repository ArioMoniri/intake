      current_ask_tr: "Çocuğunuz her zamankinden daha az çiş yapıyor mu?"
      type: boolean
      current_polarity: true_is_concern
      target_polarity: true_is_concern
      action: none
      gen_line: "gen: slot=az_cis; type=boolean"
    - pack: specialty.cocuk_nefrolojisi
      file: packages/protocols/review/specialty/cocuk_nefrolojisi.yaml
      proposal: docs/evidence/proposals/cocuk_nefrolojisi.md (gen line slot=idrar_azalmasi)
      slot: idrar_azalmasi
      target_slot: idrar_azalmasi
      ask_tr: "Çocuğunuzun idrar miktarı belirgin şekilde azaldı ya da neredeyse hiç idrar yapmıyor mu?"
      current_ask_tr: "Çocuğunuzun idrar miktarı belirgin şekilde azaldı ya da neredeyse hiç idrar yapmıyor mu?"
      type: boolean
      current_polarity: true_is_concern
      target_polarity: true_is_concern
      action: keep_distinct_narrower_construct
      gen_line: "gen: slot=idrar_azalmasi; type=boolean"
  pending_construct_choice:
    rule: >-
      These feeding and drinking items fall under the same convention
      (NG143 Table 2 puts poor feeding in infants in the circulation and
      hydration row), but which construct the cluster asks (CH-S1's inability to
      drink or breastfeed against feeding as usual) is a separate paediatric
      decision. Until it is made, each keeps its id and text, and none is
      renamed onto another's id, because a rename across opposite polarities
      inverts the answer. When the construct is chosen, its ask follows
      true_is_concern.
    slots:
      - {pack: cluster.child_health, slot: beslenme_sivi_alimi, current_polarity: false_is_concern, target_polarity: true_is_concern}
      - {pack: specialty.cocuk_sagligi_ve_hastaliklari, slot: beslenme_sivi_alimi, current_polarity: false_is_concern, target_polarity: true_is_concern}
      - {pack: specialty.cocuk_enfeksiyon_hastaliklari, slot: emebiliyor_icebiliyor, current_polarity: false_is_concern, target_polarity: true_is_concern}
      - {pack: specialty.neonatoloji, slot: beslenmede_azalma, current_polarity: true_is_concern, target_polarity: true_is_concern}
