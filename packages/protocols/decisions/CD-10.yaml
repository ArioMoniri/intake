# INT-432 clinical decision CD-10 (HB-C3, paediatrics). Agent-authored under
# owner decision D18 (2 Oct 2026): simulated-patient stress testing only; a
# licensed physician's review is required before any real patient. Every source
# quote below appears verbatim in the named snapshot; spec_basis quotes appear
# verbatim in the named committed file. Not a pack: the review-queue candidates
# are changed by the lead from the slots list below. No triage level, route,
# register, location or red-flag rule is created or changed here.
kind: clinical_decision
id: CD-10
title: "One polarity for child_health hydration items; the urine-output question"
question: >-
  The cluster question "Çocuğunuz her zamanki kadar çiş yapıyor mu?"
  (cis_miktari) makes false the alarm direction, unlike every other symptom slot
  in the pack, while the specialty twins (neonatoloji islak_bez_azalmasi and
  beslenmede_azalma, cocuk_gastroenterolojisi az_cis, cocuk_nefrolojisi
  idrar_azalmasi) record the concern as true. Which single polarity do hydration
  items use across child_health, what is the Turkish question for the
  urine-output item, and on what source?
decision: >-
  Every boolean hydration item in the child_health packs uses
  true_is_concern: the ask names the abnormal finding and "evet" records that
  the finding is present. This follows the sources, which state the finding in
  its abnormal direction ("reduced urine output", "decreased urine output",
  "İdrar çıkışı ... Azalmış") and, in NICE CG84 1.2.1.1, tell the assessor to
  ask whether the child "has decreased urine output"; it also matches the
  openEHR symptom/sign screening model, where "Yes" records that the named
  symptom or sign is present. The urine-output item becomes az_cis with the ask
  "Çocuğunuz her zamankinden daha az çiş yapıyor mu?" (B1, siz, one question,
  no numerals, no double negative; the same text the independent wave 1-3
  verification prescribed for cocuk_gastroenterolojisi). The id changes with
  the polarity on purpose: a polarity flip under the old id cis_miktari would
  silently invert any reader of that id, whereas a removed id fails loudly at
  compile time. Neonatoloji's nappy item is the same fact for nappy-wearing
  infants and takes the id az_cis while keeping its own text, so the fact is
  asked once. Cocuk_nefrolojisi's idrar_azalmasi already follows the convention
  and asks a narrower construct (marked reduction or near-absence), so it stays
  a separate item. The feeding and drinking items share the convention but
  their construct choice is a separate paediatric decision, so they are listed
  as pending and none of them is renamed across polarities.
