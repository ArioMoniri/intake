kind: clinical_decision
id: CD-117
title: 'rf.fever_high_persistent: fever in a patient on immunosuppressive treatment, at EK-4 Sarı Kategori
  1'
question: Which current source states the fever thresholds and level of 04 §3's high or persistent fever
  row?
decision: 'Write the sourced arm only: fever now in a patient who answers yes to immunosuppressive treatment,
  SARI_K1 / SAME_DAY_ACIL, notify always. EK-4 Sarı Kategori 1 prints ''Ateş yüksekliği olan onkoloji
  hastası veya steroid kullanan hasta'' with no temperature, so no threshold is asked. The immunosuppression
  slot''s yes covers chemotherapy, a biologic, cortisone or a transplant, which is wider than EK-4''s
  two groups (the over-including direction). The fever is patient-reported: EK-4 prints ''ateş yüksekliği''
  with no number, so no measurement is required. Not written: 04 §3''s ''≥ 39 °C > 3 d'' arm, because
  no committed source states it for an adult (NICE NG143 is under fives); adding it later as a disjunct
  is a tightening. A SARI rule carries no action script, so the same-day route reaches the clinic and
  not the patient''s screen. The label is narrowed to what the rule does.'
