# INT-432 clinical decision CD-11. Agent-authored under owner decision D18
# (2 Oct 2026): simulated-patient stress testing only; a licensed physician's
# review is required before any real patient. Every source quote below appears
# verbatim in the named snapshot; spec_basis quotes appear verbatim in the named
# committed file. Not a pack: nothing here is compiled or served.
kind: clinical_decision
id: CD-11
title: "Göğüs hastalıkları occupational items: D3 coverage and the current-exposure gate"
question: >-
  Does owner decision D3's occupational-exposure approval, delivered text_first,
  cover göğüs hastalıkları Q10 mesleki_toz_duman_gaz and Q10a is_disinda_azalma
  (V-GH-2)? And is a current-exposure gate in front of Q10a clinically supported,
  given that Q10 asks about any job ever held while Q10a assumes the patient still
  works there (V-GH-1)?
decision: >-
  Two parts, with different deciders.
  The D3 reading is the owner's to confirm (V-GH-2 names the owner as decider). D18
  delegates clinical decisions only, and CLAUDE.md sends any decision to persist new
  categories of personal data to the human. This decision therefore records a
  recommended reading, not a ruling, and V-GH-2 stays open with the owner. The
  recommended reading is that D3 approves by data category: its object is
  "specialty questions that would collect new sensitive-data categories", its
  approved list is a list of categories, and its delivery rule binds "each such
  item". On that reading, the departments in parentheses record where a category was
  found on 26 September and do not limit the approval. Q10 (dust, fume or gas inhaled
  in any job held) and Q10a (symptoms easing away from work) both collect "employer /
  occupational exposure", so both would be covered as review-queue candidates. Until
  the owner confirms, the items stay text_first and not servable. In any case the four
  items D3 lists as not decided (storage register, envelope encryption, counsel's
  basis per category, slot data-category tag) close before L1.
  Clinically (pulmonology and occupational medicine), Q10a must not be asked of a
  patient who no longer does that work. NICE NG245 1.4.1 looks for an occupational
  component by asking whether symptoms are the same, better or worse on days away
  from work and on holiday. Both questions presuppose current work, and NG245 asks
  that all answers be recorded for later review. The fix-round wording puts a
  condition inside a yes/no question ("Hâlâ böyle bir işte çalışıyorsanız, …"), so a
  retired patient's answer cannot be read: their "hayır" looks like "no occupational
  component" to red-flag row 4. The fix is a separate current-exposure gate item.
  Q10a is reworded without the condition and asked only after a yes to the gate. A
  patient who answers no to the gate is never asked Q10a, and is_disinda_azalma stays
  unanswered rather than "no".
  Row 4's exposure arm (current exposure and symptoms easing away from work) follows
  1.4.1, and its action anchor is NG245 1.4.2 (refer to an occupational asthma
  specialist). Both recommendations concern people with asthma, though, and the
  population arm stays draft_needs_source. The candidates are cluster.medical
  astim_koah_tanisi, which also covers COPD, and the pack's own hisiltili_solunum, a
  reported wheeze, which NG245 1.1.1 checks in suspected asthma and which 1.1.2 does
  not let confirm asthma. The Turkish referral route also stays draft_needs_source.
status: active
scope: simulated_patient_stress_testing
author_role: "pulmonology and occupational medicine physician (agent)"
