value:
  owner_question:
    finding: V-GH-2
    decider: owner
    question: "Does D3's occupational-exposure approval, delivered text_first, cover göğüs hastalıkları Q10 and Q10a?"
    open: false
    owner_answer:
      quote: "yes for workplace"
      answered_on: 2026-10-03
      channel: "owner, in chat, relayed by the INT-432 coordinator"
      reading: >-
        Workplace exposure is approved as a data category (`occupational`) for
        göğüs hastalıkları Q10 and Q10a. The new current-exposure gate below asks
        about the same workplace exposure and falls in the same category.
      applied:
        - "docs/legal/data-categories.yaml: the occupational row's purpose names göğüs hastalıkları; every counsel field stays null, so the compiler still refuses to serve these slots (INT-349)"
        - "docs/evidence/proposals/gogus_hastaliklari.md Q10: gen data_category=occupational and delivery=text_first; the review pack regenerated"
        - "Q10a, Q10b and the new gate take data_category=occupational with the CD-11 apply_after_737_merges entries, since those items arrive with PR #737"
      not_decided_by_this_answer:
        - "the counsel fields of the occupational row: basis, retention, recipients, consent scope (INT-349)"
        - "storage per category and envelope encryption of sensitive slots (D3, Not decided by D3)"
    recommended_reading:
      answer: "yes, as review-queue candidates only"
      approval_unit: data_category
      department_lists: "descriptive (where the category was found on 26 September), not restrictive"
      covered_items:
        - item: Q10
          slot: mesleki_toz_duman_gaz
          category: "employer / occupational exposure"
        - item: "Q10a (new current-exposure gate, below)"
          slot: mesleki_maruziyet_suruyor
          category: "employer / occupational exposure"
        - item: "Q10b (the current Q10a, reworded below)"
          slot: is_disinda_azalma
          category: "employer / occupational exposure"
    in_force_meanwhile:
      delivery: text_first
      servable: false
    still_open_before_l1:
      - storage_register_per_category
      - envelope_encryption_of_sensitive_slots
      - counsel_basis_retention_recipients_verbis_and_consent_scope_per_category
      - slot_data_category_tag
  current_exposure_gate:
    required: true
    reason: "NG245 1.4.1's questions about days away from work and holidays presuppose current work; a yes/no answer to a question with an embedded condition cannot be read for a patient who no longer does that work"
    gate_item:
      slot: mesleki_maruziyet_suruyor
      type: boolean
      ask_tr: "Şu anda da toz, duman ya da gaz soluduğunuz bir işte çalışıyor musunuz?"
      ask_if: "mesleki_toz_duman_gaz == true"
      delivery: text_first
    reworded_item:
      slot: is_disinda_azalma
      type: boolean
      ask_tr: "Şikâyetleriniz işe gitmediğiniz günlerde ya da tatilde azalıyor mu?"
      ask_if: "mesleki_maruziyet_suruyor == true"
      delivery: text_first
  answer_semantics:
    gate_answer_no: "is_disinda_azalma is never asked and stays unanswered; it is never stored as hayır and row 4 reads Unknown, not False"
    reworded_item_hayir: "symptoms not better away from work (the same or worse). NG245 asks a three-way question; the boolean keeps the 'better' arm, which is the only arm row 4 reads. The patient's own words, when given, are kept with the answer for the clinician, as NG245 asks that all answers be recorded."
    past_exposure_only: "a patient with past exposure and no current exposure keeps Q10 = evet in the note as occupational history; no occupational-component inference is made"
  red_flag_row_4:
    proposed_id: rf.gogus_hastaliklari_mesleki_bilesen
    exposure_arm: "mesleki_toz_duman_gaz == true && mesleki_maruziyet_suruyor == true && is_disinda_azalma == true"
    population_arm: "TODO: asthma population condition for the occupational-component rule requires clinical sign-off"
    population_candidates:
      - slot: astim_koah_tanisi
        source_pack: cluster.medical
        limit: "asks about asthma or COPD together, which is wider than NG245's population"
      - slot: hisiltili_solunum
        source_pack: specialty.gogus_hastaliklari
        limit: "a reported wheeze, which NG245 1.1.1 checks in suspected asthma; under 1.1.2 it does not confirm asthma"
    trigger: "exposure_arm && population_arm"
    action_anchor: "NICE NG245 1.4.2: refer to an occupational asthma specialist (non-emergency)"
    placement: "göğüs hastalıkları draft_needs_source stub (CD-13)"
    route: "TODO: Turkish referral route for a suspected occupational component requires clinical sign-off"
    status: draft_needs_source
    source_gap: "NG245 1.4.1 and 1.4.2 apply to people with asthma, and no pack slot captures asthma alone: astim_koah_tanisi includes COPD, and a reported wheeze is a symptom, not a diagnosis. NG245 1.4.2 also names a UK occupational asthma specialist, and no retrieved Turkish regulation or guideline maps that referral to a Turkish service (for example an iş ve meslek hastalıkları clinic) or sets its urgency."
  apply_after_737_merges:
    - file: docs/evidence/proposals/gogus_hastaliklari.md
      where: "§3, directly after the Q10 block"
      change: insert_item
      text: |-
        **Q10a — Still working with that exposure** · archetype: `OBSERVATION.story.v1` (narrative only) · source: GH-S9 (NG245 rec 1.4.1, "Are symptoms the same, better or worse on days away from work?")
        > "Şu anda da toz, duman ya da gaz soluduğunuz bir işte çalışıyor musunuz?"
        gen: slot=mesleki_maruziyet_suruyor; type=boolean; ask_if=mesleki_toz_duman_gaz == true; delivery=text_first; data_category=occupational
        CANDIDATE — clinician to approve wording. Current-exposure gate for Q10b (CD-11).
    - file: docs/evidence/proposals/gogus_hastaliklari.md
      where: "§3, the current Q10a block (slot is_disinda_azalma)"
      change: relabel_reword_regate
      heading: "**Q10b — Symptoms ease away from work**"
      ask_tr: "Şikâyetleriniz işe gitmediğiniz günlerde ya da tatilde azalıyor mu?"
      gen: "gen: slot=is_disinda_azalma; type=boolean; ask_if=mesleki_maruziyet_suruyor == true; delivery=text_first; data_category=occupational"
    - file: docs/evidence/verification/gogus_hastaliklari.md
      where: "§1 red-flag row 4 (rf.gogus_hastaliklari_mesleki_bilesen)"
      change: trigger_and_when
      trigger: "`mesleki_toz_duman_gaz == true` and `mesleki_maruziyet_suruyor == true` and `is_disinda_azalma == true`, and an asthma population condition pending sign-off (candidates `astim_koah_tanisi`, `hisiltili_solunum`)"
      when: "TODO: asthma population condition and Turkish referral route for a suspected occupational component requires clinical sign-off"
      status: draft_needs_source
      source_gap: "This instruction writes a proposal row whose `when` stays the invariant-17 literal because red_flag_row_4.population_arm and red_flag_row_4.route are draft_needs_source in this decision."
    - file: docs/evidence/proposals/gogus_hastaliklari.md
      where: "§6 change log"
      change: add_rows
      rows:
        - "Q10a `mesleki_maruziyet_suruyor` | added (CD-11): current-exposure gate | `mesleki_toz_duman_gaz == true` | GH-S9"
        - "Q10b `is_disinda_azalma` | relabelled from Q10a, reworded, regated (CD-11) | `mesleki_maruziyet_suruyor == true` | GH-S9"
