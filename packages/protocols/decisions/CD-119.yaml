kind: clinical_decision
id: CD-119
title: 'rf.new_neuro_deficit_subacute stays draft: no source states the urgency of weakness progressing
  over days'
question: Which current source states a layperson-answerable trigger for weakness or numbness progressing
  over days and its urgency?
decision: Keep rf.new_neuro_deficit_subacute draft_needs_source. CG150's 'new-onset neurological deficit'
  is a feature of a headache presentation and states no urgency; EK-4's 'Akut hemiparazi/disfazi' is the
  acute arm rf.stroke_fast carries. No committed source states the subacute arm or the tense boundary
  between the two.
