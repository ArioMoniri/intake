author_role: "emergency medicine operations / clinical informatics physician (agent)"
sources:
  - kind: guideline
    guideline_id: NICE-NG143
    title: "Fever in under 5s: assessment and initial management"
    version_or_date: "NICE guideline NG143; published 07 November 2019; last updated 26 November 2021; minor changes July 2022, October 2022, March 2024 and November 2025"
    url: "https://www.nice.org.uk/guidance/ng143/chapter/Recommendations"
    retrieved_on: 2026-10-03
    quote: "First, healthcare professionals should identify any immediately life‑threatening features, including compromise of the airway, breathing or circulation, and decreased level of consciousness."
    snapshot: packages/protocols/sources/NICE-NG143.txt
    supports: safety_questions_exempt_from_turn_budget
    caveat: >-
      Recommendation 1.2.1 orders a clinician's assessment of a febrile child
      under five. It is cited for the principle that life-threat features are
      identified first, ahead of anything else, not as a rule written for intake
      software or for adults.
  - kind: guideline
    guideline_id: NICE-CG84
    title: "Diarrhoea and vomiting caused by gastroenteritis in under 5s: diagnosis and management"
    version_or_date: "Clinical guideline CG84; published 22 April 2009; minor changes January 2019 and October 2022"
    url: "https://www.nice.org.uk/guidance/cg84/chapter/Recommendations"
    retrieved_on: 2026-10-03
    quote: "If in doubt, manage as if there are symptoms and/or signs with red flags."
    snapshot: packages/protocols/sources/NICE-CG84.txt
    supports: confirm_yes_never_clears_red_flag
    caveat: >-
      Written for dehydration and shock in gastroenteritis under five. It is
      cited for the direction in which doubt resolves (towards the red flag),
      which is why an acquiescent "evet" to a confirmation of absence is
      treated as doubt and answered with the positive question.
  - kind: openehr_ckm
    archetype_id: "openEHR-EHR-OBSERVATION.symptom_sign_screening.v1"
    revision: "1.0.7"
    url: "https://ckm.openehr.org/ckm/archetypes/1013.1.4432"
    retrieved_on: 2026-10-03
    quote: "--- Do you have headaches? Yes, No, Unknown."
    snapshot: packages/protocols/sources/openEHR-EHR-OBSERVATION.symptom_sign_screening.v1.txt
    supports: bilmiyorum_maps_to
  - kind: openehr_ckm
    archetype_id: "openEHR-EHR-OBSERVATION.symptom_sign_screening.v1"
    revision: "1.0.7"
    url: "https://ckm.openehr.org/ckm/archetypes/1013.1.4432"
    retrieved_on: 2026-10-03
    quote: 'text = <"Unknown">'
    snapshot: packages/protocols/sources/openEHR-EHR-OBSERVATION.symptom_sign_screening.v1.txt
    supports: bilmiyorum_maps_to
    note: >-
      The archetype's "Presence?" element (at0005) carries Unknown (at0027) as a
      value distinct from No (at0024); "bilmiyorum" is that Unknown, which the
      engine's answer states name UNCLEAR. The value set also carries Unsure
      (at0041), the state of a hedged answer, whose Turkish surface forms are
      sibling decision CD-04's table; CD-04 maps "bilmiyorum" to UNCLEAR too.
