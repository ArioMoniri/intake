# INT-432 clinical decision CD-07. Agent-authored under owner decision D18
# (2 Oct 2026): simulated-patient stress testing only; a licensed physician's
# review is required before any real patient. Every source quote below appears
# verbatim in the named snapshot; spec_basis quotes appear verbatim in the named
# committed file. Not a pack: nothing here is compiled or served.
kind: clinical_decision
id: CD-07
title: "Confirmation ceiling and what a confirmation may change"
question: >-
  How many confirmation steps may one intake session contain; what wins when
  confirmations and safety questions compete for the turn budget; and what may
  a patient's "evet" to a confirmation, a backchannel, or "bilmiyorum" change?
decision: >-
  Confirmations are capped per session, but the cap itself stays
  draft_needs_source: no guideline, regulation or archetype states a number, and
  the fast-mode turn budget the cap would share is itself open (HB-C5). Safety
  questions are never cut for budget: steps of priority class SAFETY_SCRIPT,
  GATEKEEPER and RF_PROBE_ARMED (files/13 §9.1), any step that fills a CD-02
  rule_gate_slots or tense_anchors slot whatever its class (today the engine
  mints the chest-pain slots as MUST_ASK and their follow-ups as REENTRY), and
  the positive re-ask of a red-flag question, are exempt from the turn budget and
  do not count toward the confirmation cap; when the budget runs out, the budget yields, not the safety
  set. An "evet" to a confirmation never clears a red flag: a red-flag or gate
  slot reaches ASKED_ABSENT only through a direct answer to its positively
  phrased scripted question, so where a narrative suggests absence the engine
  re-asks the positive question ("...var mı?") instead of asking the patient to
  confirm an absence ("...yok, doğru mu?"). A backchannel (a listener token such
  as "hı hı", "tamam" or "evet" spoken during system speech, or any token that
  is not a reply in a confirmation turn) is never a confirmation. "bilmiyorum"
  maps to UNCLEAR and never to ABSENT. Facts taken from documents are confirmed
  on the review screen, not in the voice flow, and any non-safety confirmation
  beyond the cap is shown there unconfirmed rather than silently accepted.
status: draft_needs_source
scope: simulated_patient_stress_testing
scope_note: >-
  Owner decision D18 (2 Oct 2026): agent-only sign-off, for simulated-patient
  stress testing only. A licensed physician's review is required before any real
  patient.
question_origin: >-
