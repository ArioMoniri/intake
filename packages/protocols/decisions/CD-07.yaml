inference_disclosure: >-
  Three keys are this author's safe-direction design choices rather than
  quotations of a source. backchannel_is_confirmation is false because no
  retrieved guideline defines a confirmation turn: treating a listener token as
  no answer can only cost a repeated question, while treating it as a
  confirmation could record a value the patient never gave.
  rf_positive_reask_counts_toward_cap is false because the re-ask is how
  confirm_yes_never_clears_red_flag works; counting it against a cap would let
  the cap suppress a red-flag question, and keeping it out can only add turns.
  safety_question_slots extends the exempt set by slot rather than by class;
  that is the author's reading of the CD-02 never-silently-filled list against
  the classes the engine mints today (plan.py), and it widens the exemption,
  never narrows it.
source_gap: >-
  max_confirmations_per_session: no current guideline, regulation or openEHR
  archetype states a maximum number of confirmation steps for a
  patient-completed intake, in Turkish or otherwise. The cap would share the
  fast-mode turn budget, whose reconciliation is itself an open clinician
  decision (HB-C5: 16-21 turns of content against an 18-turn budget), so any
  number written now would be invented. Every other key in this decision is
  active.
