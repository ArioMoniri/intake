kind: clinical_decision
id: CD-110
title: 'rf.dyspnoea_rest stays draft: EK-4''s serious-breathlessness criteria are staff-observed'
question: Which current source states a layperson-answerable trigger for breathlessness at rest and its
  urgency?
decision: Keep rf.dyspnoea_rest draft_needs_source. EK-4 prints serious breathlessness in Kırmızı Kategori
  2 only through accessory-muscle use or a pulse-oximetry value below ninety per cent, both observed by
  staff, and moderate distress in Sarı Kategori 1 through the absence of accessory-muscle use. 04 §8.1
  rule 1 forbids staff measurements as triggers, and no committed source states the layperson form (breathless
  at rest, cannot finish a sentence) for breathlessness of any cause; asthma severity grading is condition-specific.
