inference_disclosure: >-
  The sources fix the constructs: one opening question, a timing fact recorded as a date,
  a symptom history that details a present symptom, the airway checked within painful or
  swollen dental infections, and the facts a disability board records. These choices are
  this author's, made on those sources: dropping the generators' fixed slots rather than
  changing base; deriving duration from the onset date; keeping onset_date asked of
  everyone because it anchors the base red-flag families; gating the rest of the history
  on one presence screen and mapping hedges to present; the dental gate terms (tooth or
  gum pain, face, jaw or sublingual swelling; neck swelling is not a separate term because
  the presentations that bring it bring tooth pain, and the cluster has no acute
  neck-swelling item); taking the four ungated dental re-declarations to the cluster's
  gate, which in those L0 candidates stops asking a patient with neither pain nor swelling
  (a capture-only item no rule reads, so no red-flag rule is relaxed); and the ids of the
  three re-homed Q1 items and the üreme item. None of it is a clinical number.
fail_closed_while_draft: >-
  The lmp_date population guard's age bounds are draft_needs_source. Until they are
  sourced and the guard grammar exists, base keeps lmp_date's current gate and kadın
  hastalıkları ve doğum keeps Q2 son_adet_tarihi (CD-100 T1's interim), so no woman in that
  chain loses the last-period question and nobody outside the population is asked it.
value:
  packet_commit: 151cf34f
  rule: "one fact, one id, one ask: where two slots record the same fact, the parent layer's id stays and the twin goes; where they differ in referent, window or subject, both stay"
  resolutions:
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L95"
      ref: T2
      record: CD-100
      resolves: owner_question
      question: "The generator's fixed ziyaret_baglami.basvuru_nedeni re-asks base chief_complaint_text in all 91 chains; which goes?"
      outcome: change
      change: >-
        The generators' fixed slot goes; base chief_complaint_text ("Sizi bugün hekime
        getiren şeyi kendi sözlerinizle anlatır mısınız? …") is the one reason-for-visit
        question and the id of record in every chain. (1) scripts/dev/gen_specialty_packs.py
        and the generate-l0 emitter (protocols.authoring) stop emitting
        ziyaret_baglami.basvuru_nedeni, so a proposal's Q1 is no longer a slot and the guard
        that skips a pack whose Q1 is refused or held goes with it. (2) A Q1 that asks a
        narrower fact about the contact is not a twin and stays as an ordinary proposal
        item under its own id, asked after the base reason: anesteziyoloji Q1 "Hangi
        ameliyat ya da işlem için anestezi görüşmesine geldiniz?" · gen:
        slot=planlanan_islem; type=string; aşı Q1 "Bugün hangi aşıyı yaptırmayı
        planlıyorsunuz?" · gen: slot=planlanan_asi; type=string; sağlık kurulu Q1 "Kurulda
        değerlendirilecek sağlık sorunlarınız nedir?" · gen: slot=kurul_saglik_sorunlari;
        type=string. Every other Q1 at 151cf34f asks the reason for the visit in the pack's
        own words and is dropped. No Turkish text changes and no rule reads basvuru_nedeni.
      clinical_basis: "One opening question, then listening and screening for further problems, is the interview's structure; asking the reason twice costs a turn in every chain and splits one presenting-problem record across two ids. A planned operation, a planned vaccine and the conditions a board will assess are facts about the contact, not the reason restated, so they stay."
      sources: [CALGARY-CAMBRIDGE-GUIDE, openEHR-EHR-EVALUATION.reason_for_encounter.v1]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L96"
      ref: T3
      record: CD-100
      resolves: owner_question
      question: "The generator's fixed ziyaret_baglami.sikayet_suresi re-asks base duration in all 91 chains; which goes?"
      outcome: change
      change: >-
        The generators' fixed slot goes in every chain: scripts/dev/gen_specialty_packs.py
        and the generate-l0 emitter stop emitting ziyaret_baglami.sikayet_suresi, and the
        proposals' pack: duration_ask and duration_follow_up lines are dropped. The
        complaint's timing is asked once, by base onset_date (T17, near-twin-sweep-582.md#L110).
        The draft branch red-flag stub the generator writes re-anchors from sikayet_suresi
        to base onset_date; it stays draft_needs_source and is never compiled. One pack line
        asks a different fact and stays as an ordinary item: üreme endokrinolojisi ve
        infertilite "Ne zamandır korunmadan gebe kalmayı deniyorsunuz?" · gen:
        slot=korunmasiz_deneme_suresi; type=duration; follow_up=Ay ya da yıl olarak
        yaklaşık söyleyebilir misiniz? The parent-addressed and neutral pack lines ("Bu
        durumu ne zamandır fark ediyorsunuz?", "Bu konu ne zamandır devam ediyor?", "Bu
        durumu ne zamandır biliyorsunuz?") go with the slot; how base onset_date is worded
        for a parent is the proxy mechanism of owner decision D24 (1Y).
      clinical_basis: "Time since onset is calculated from the onset date for an ongoing episode, so a second duration ask records nothing the date does not. The time trying to conceive is the interval a fertility clinic defines infertility by, a separate fact from when a complaint began."
      sources: [openEHR-EHR-CLUSTER.symptom_sign.v2, CALGARY-CAMBRIDGE-GUIDE, NICE-NG257]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L110"
      ref: T17
      record: CD-100
      resolves: owner_question
      question: "Base onset_date and base duration are both must_ask and record when the complaint began (date against duration); keep both?"
      outcome: change
      change: >-
        Keep one. Base onset_date ("Bu şikâyetiniz ne zaman başladı?", a date, the
        tense_anchor of every base red-flag family) stays asked, must_ask and ungated. Base
        hpi.duration is no longer asked: the slot and its en mirror keys leave
        base/intake.yaml, and the note's oldcarts duration is computed from onset_date and
        the session date while the complaint is ongoing. onset_date's follow-up already
        accepts a relative answer ("Gün, hafta ya da ay olarak yaklaşık
        söyleyebilirsiniz."), so a patient who cannot name a date still answers. duration's
        follow-up probe ("Sürekli mi, yoksa arada bir mi oluyor?") had no slot to store its
        answer, because duration is type duration, so no recorded fact is lost. No rule
        reads hpi.duration, so no red-flag rule changes.
      clinical_basis: "One timing fact, recorded as a date: the date sets the sequence of events the history needs and anchors the red-flag tense guard, and the time since onset follows from it."
      sources: [openEHR-EHR-CLUSTER.symptom_sign.v2, CALGARY-CAMBRIDGE-GUIDE]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L185"
      ref: T92
      record: CD-101
      resolves: owner_question
      question: "The generator's fixed ziyaret_baglami.sikayet_suresi ('ne zamandır var', a duration) and base onset_date ('ne zaman başladı', a date) record the same fact in all 91 chains; which goes?"
      outcome: change
