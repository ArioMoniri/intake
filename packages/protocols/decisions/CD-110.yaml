    - item: "docs/evidence/verification/near-twin-sweep-582.md#L94"
      ref: "T1 (base-owner part)"
      record: CD-100
      resolves: owner_part
      question: "Will base ask lmp_date without its pregnancy_status != 'hayir' gate in the women's-health chains, in every chain, or through a chain-level widening?"
      outcome: change
      change: >-
        In every chain, by base, and not through a chain-level widening (no pack op may
        rewrite an inherited gate). (1) lmp_date's gate becomes the population the
        pregnancy questions are for, people of reproductive age whose sex at birth is
        female, and stops reading the pregnancy answer, so a "hayır" to pregnancy_status no
        longer closes it; pregnancy_status and lmp_date carry the same population guard.
        (2) The guard needs the GuardExpr functions sex_at_birth and age_years, which the
        runtime refuses at build today, and its age bounds are draft_needs_source (below).
        Until both exist, base keeps today's gate and kadın hastalıkları ve doğum keeps Q2
        son_adet_tarihi unchanged (CD-100 T1's interim), so no woman in that chain loses the
        last-period question and nobody outside the population is asked it. (3) When the
        guard lands, base drops the pregnancy_status != 'hayir' gate in the same change, and
        CD-100 T1's removal of kadın Q2 follows. No Turkish text and no red-flag rule
        changes.
      population_guard:
        status: draft_needs_source
        source_gap: >-
          No committed snapshot states age bounds for asking pregnancy status and the last
          menstrual period in a general pre-visit intake; NG126 1.4.5 says "women of
          reproductive age" without bounds.
        pending_value: "TODO: reproductive-age bounds for the pregnancy_status and lmp_date population guard requires clinical sign-off"
      clinical_basis: "A woman who does not think she is pregnant may be, a missed period is a common ectopic symptom, and ectopic pregnancy imitates gastrointestinal and urinary conditions that any chain sees, so the last-period date is asked whatever the pregnancy answer and in every chain, of the people it applies to."
      sources: [NICE-NG126]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L97"
      ref: "T4 (base-owner part)"
      record: CD-100
      resolves: owner_part
      question: "Is base pregnancy_status, with its 'emin değilim' answer, the pregnancy gate of record that branch items may read, and is it asked before every branch item gated on it?"
      outcome: accept
      clinical_basis: "Yes to both. pregnancy_status keeps the unsure answer that a boolean drops, an unsure woman is treated as possibly pregnant, and branch items read it, never a branch twin (CD-100 T4). Precedence holds today by construction: the resolver merges base sections before any cluster or branch section, so pmh_fh_sh.pregnancy_status precedes every sorular item. The class-1 gatekeeper assertion of files/13 §14 item 13 is the guarantee that survives a later reorder, and the lead pins it with a test (below); CD-106's removal of the kadın reorder op (reorder-op-582.md#L38) follows once CD-100 T4 is applied."
      pins: "every slot whose ask_if reads pregnancy_status follows pmh_fh_sh.pregnancy_status in the merged order of every chain (near miss: a slot moved ahead of it fails)"
      sources: [NICE-NG126]
      status: active
    - item: "docs/evidence/verification/cluster-wave-b.md#L103"
      ref: "cluster-wave-b §A.3 dental Q10"
      record: CD-103
      resolves: owner_question
      question: "Which airway posture does the dental cluster take: ask gated on pain or swelling, ask ungated, or leave it to base.life_threat?"
      outcome: change
      change: >-
        Ask, gated on pain or swelling, as cluster_dental Q10 drafts it. Release Q10 by
        dropping its hold=: "Nefes almakta ya da yutkunmakta zorlanıyor musunuz?" · gen:
        slot=nefes_yutkunma_guclugu; type=boolean; ask_if=yuz_cene_sisligi == true ||
        dis_agrisi == true. It is not gated on trismus. It is not left to base.life_threat,
        which has no adult airway rule and whose probes carry no ask, so no layer would ask
        it. The item is a capture-only input: no rule reads it and nothing extends
        base.life_threat.
      clinical_basis: "Airway compromise in dental practice is a complication of dental infection, and the guidance checks the airway in the initial management of the painful or swollen presentations (acute apical abscess, pericoronitis, acute periodontal conditions), whose key signs are pain and swelling of the gum, face or neck. Ludwig's angina typically brings tooth pain and usually no trismus, so the gate is pain (tooth or gum) or swelling (face, jaw or under the tongue), never trismus. A recall, orthodontic or prosthetic visit with neither has no odontogenic airway risk to ask about, and breathlessness of any cause stays with base."
      sources: [SDCEP-MADP-2026, RCEM-LEARNING-DENTAL-2023]
      status: active
    - item: "docs/evidence/verification/cluster-wave-b.md#L104"
      ref: "cluster-wave-b §A.3 dental Q10 in pedodonti"
      record: CD-103
      resolves: owner_question
      question: "If the owner keeps dental Q10, must pedodonti re-declare the airway slot with the proxy text before any under-18 path opens?"
      outcome: change
      change: >-
        Yes. Pedodonti re-declares the item for the child, with CD-104 L315's accepted text
        and a gate on pedodonti's own child-addressed slots, placed after Q4: "Çocuğunuz
        nefes almakta ya da yutkunmakta zorlanıyor mu?" · gen: slot=nefes_yutkunma_guclugu;
        type=boolean; ask_if=dis_agrisi == true || dis_eti_sisligi == true. Pedodonti Q2
        (dis_agrisi, the child's toothache) and Q4 (dis_eti_sisligi, the child's gum
        swelling) are declared earlier in the pack, as the generator's gate rule requires;
        the cluster's self-addressed yuz_cene_sisligi is not read, because in a proxy
        session it asks the parent about their own face. Latent: pedodonti opens only once
        the proxy mechanism of owner decision D24 (1Y) exists and an under-18 path opens.
      legal_part: "routed to the legal lane (D25, INT-471 #800): HB-L20, the conditions on which any under-18 path opens"
      clinical_basis: "The parent reports the child's sign, so the ask names the child; the gate is the child's tooth pain or gum swelling, the key signs of the dental infections (pericoronitis includes erupting teeth in children) whose initial management checks the airway."
      sources: [SDCEP-MADP-2026, openEHR-EHR-CLUSTER.symptom_sign.v2]
      status: active
    - item: "docs/evidence/verification/cluster-wave-b.md#L116"
      ref: "cluster-wave-b §A.4 allied §0 minimal HPI"
      record: CD-103
      resolves: owner_question
      question: "How can base's must_ask HPI be made conditional for report-only visits, given that suppress_slot on a must_ask slot is a compile error?"
      outcome: change
      change: >-
        A base-level gate on a symptom-presence screen; not a visit-type rule, and not
        unconditional. (1) Base hpi gains one screen, directly after onset_date:
        guncel_saglik_sikayeti, type boolean, required and must_ask, ask "Şu anda sizi
        rahatsız eden bir sağlık şikâyetiniz var mı?" (the verified allied cluster Q7 text),
        follow-up "Bir belirti ya da rahatsızlık varsa evet, yoksa hayır diyebilirsiniz."
        (2) location_text, character_text, aggravating_factors, relieving_factors,
        radiation_text, timing_pattern, severity_nrs, trajectory, prior_similar_episode and
        treatments_tried stay must_ask and gain ask_if: guncel_saglik_sikayeti == true.
        (3) onset_date stays asked of everyone and ungated, because it anchors the base
        red-flag families and a rule whose anchor is never asked stays Unknown;
        time_last_known_well, every red_flags probe and the chest_pain, associated and
        trauma sections are untouched, so no rule's inputs change. (4) Answer mapping, a
        per-slot entry beside CD-04's '*' rows: a hedge ("bilmiyorum", "biraz", "galiba",
        "pek sayılmaz", "emin değilim") records true, never UNCLEAR and never false; only a
        plain "hayır" or "yok" closes the history, because an Unknown gate opens nothing.
        (5) The open turn may answer the screen only as present (a symptom named in
        chief_complaint_text retires it as true); it never infers absence. (6) The allied
        cluster's Q7 and is_ve_meslek_hastaliklari's item of the same id leave their
        proposals, since base asks it and a second slot of that name would make every gate
        on it ambiguous; is ve meslek's three gated items then read the base slot. Base
        hpi.duration is gone under T17. In a proxy session the screen is worded for the
        patient or skipped, like every self-addressed base item (owner decision D24, 1Y).
      clinical_basis: "The symptom history records a symptom that is present, and a screening answer that finds one opens its details; report, vaccination, counselling and recall visits often have none, and those with one keep the full history. A visit-type rule would close the history for report visits that carry the clinical findings the report must record (an injury before Adli Tıp, a functional loss before a board)."
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1, openEHR-EHR-CLUSTER.symptom_sign.v2, TR-ERISKIN-ENGELLILIK-2019]
      status: active
