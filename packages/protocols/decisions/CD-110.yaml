# INT-470 clinical decision CD-110: the owner questions INT-448 (CD-100..CD-106) left open
# because a packet named the owner or the base owner as decider, decided under owner
# decision D18 as restated on 3 Oct 2026 (clinical and interview-design questions are
# decided by sourced medical agents with an independent verifier, never sent back to the
# owner). It covers simulated-patient stress testing only, and a licensed physician's
# review is required before any real patient. It fills no clinical_signoff, promotes no
# pack past L0 and does not close HB-C1.
#
# The INT-448 rows keep their history: each stays as recorded and gains a pointer here
# (resolved_by, or owner_part_resolved_by where INT-448 decided the clinical part and
# left a base-owner part). Every quote below appears verbatim in the named snapshot, and
# every spec_basis quote appears verbatim in the named committed file. This is not a
# pack: the lead applies the changes through the proposals and the generators, never by
# hand-editing a served pack. No red-flag rule, level, route, register or location is
# created, relaxed or removed here, and nothing extends base.life_threat.
kind: clinical_decision
id: CD-110
title: "INT-448 owner questions decided under D18: history-taking twins, dental airway, report visits, sağlık kurulu Q8, FTR fever"
question: >-
  For each INT-448 owner question that is a clinical or interview-design question
  (GitHub #798), and for the base-owner parts of five rows INT-448 decided clinically,
  what is the decision, on what current source, and what follow-through is routed away
  rather than decided?
decision: >-
  Eighteen resolutions: thirteen owner questions and five base-owner parts. History
  taking: the reason for the visit is asked once, by base chief_complaint_text, and the
  generators stop emitting the fixed basvuru_nedeni (three Q1s that ask a narrower
  contact fact stay as items); the complaint's timing is asked once, by base onset_date,
  so the fixed sikayet_suresi and base duration are no longer asked (üreme
  endokrinolojisi keeps its time-trying-to-conceive item); lmp_date is gated by the
  population it applies to rather than by the pregnancy answer, in every chain, once a
  population guard exists (its age bounds stay draft_needs_source); pregnancy_status is
  confirmed as the gate of record and precedes every item it gates. Dental airway: one
  posture for every dental chain, asked and gated on tooth or gum pain or face, jaw or
  sublingual swelling, never on trismus; the ungated re-declarations drop their own item;
  pedodonti re-declares it for the child on the child's pain or gum swelling. Report-only
  visits: a base symptom-presence screen gates the symptom-detail history, while
  onset_date stays asked as the red-flag tense anchor. sağlık kurulu Q8 leaves its
  proposal, because the chain already asks the cluster's sourced mobility-aid item. The
  FTR fever twin is resolved by applying CD-101 T68.
status: active
scope: simulated_patient_stress_testing
scope_note: >-
  Owner decision D18 (2 Oct 2026), restated by the owner on 3 Oct 2026 for clinical
  questions whose packet decider was the owner or the base owner: agent-decided,
  independently agent-verified, for simulated-patient stress testing only. A licensed
  physician's review is required before any real patient. The product and data owner
  questions of INT-448 are answered by owner decision D24 (files/00_STATE.md §3), not
  here; their legal and data follow-through goes to the legal lane.
question_origin: >-
  INT-470 (GitHub #798), split from INT-448 (#759, PR #777): the owner_question rows and
  base-owner parts of CD-100..CD-106 whose question is clinical or interview design. Trail
  rows are read at the #642 packet commit 151cf34f.
author_role: "family medicine and internal medicine, obstetrics and gynaecology, oral and maxillofacial surgery and paediatric dentistry, and physical medicine and rehabilitation physician (agent)"
