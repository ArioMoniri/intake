# INT-619 clinical decision CD-112: rf.severe_bleeding
# (owner, 18 Nov 2026: "yes write the 13 red flag rules").
# Agent-authored under owner decision D18 for simulated-patient stress testing only; a licensed
# physician's review is required before any real patient. Every source quote appears verbatim in the
# named snapshot and every spec_basis quote in the named file.
kind: clinical_decision
id: CD-112
title: 'rf.severe_bleeding: bleeding now with cold, clammy skin, at EK-4 Kırmızı Kategori 2'
question: Which current source states a layperson-answerable trigger for severe bleeding and its urgency?
decision: 'Write rf.severe_bleeding as KIRMIZI_K2 / EMERGENCY_NOW / ALERT on one probe: bleeding now with
  cold sweating, cold and wet skin. EK-4 Kırmızı Kategori 2 ''Dolaşım bozukluğu'' prints ''Nemli, soğuk
  deri, perfüzyon bozukluğu'', its one layperson-answerable sign. The conjunction with bleeding is the
  pack''s. Not written: EK-4 Sarı Kategori 1 ''Herhangi bir nedenle orta derecede kan kaybı'' and 04 §3''s
  ''large-volume bleeding'' and ''melena with dizziness'', because no committed source states a volume
  a patient can report, and dizziness is not EK-4''s sign.'
status: active
scope: simulated_patient_stress_testing
scope_note: 'Owner decision D18 (2 Oct 2026), and the owner''s instruction of 18 Nov 2026 (''yes write
  the 13 red flag rules''): agent-sourced content for the synthetic host and simulated patients only.
  A licensed physician''s review is required before any real patient. No clinical_signoff field is touched
  (D17), the pack stays L0, and HB-C1 stays open.'
question_origin: 'Owner, 18 Nov 2026, in chat: ''yes write the 13 red flag rules''. INT-619.'
author_role: emergency medicine physician (agent)
inference_disclosure: EK-4 states the circulation sign for any cause; requiring bleeding with it narrows
  EK-4's line to this family. The family was at the YESIL floor, so this is not a relaxation.
