# INT-519 clinical decision CD-112 (GitHub #885), items 1 to 3. Agent-authored under
# owner decision D18 (2 Oct 2026). It covers simulated-patient stress testing only, and
# a licensed physician's review is required before any real patient. Every source quote
# below appears verbatim in the named snapshot, and every spec_basis quote appears
# verbatim in the named committed file. This is not a pack: it decides three gate
# literals that INT-441 (GitHub #750) found and left to the D18 lane, and the lead
# applies them in an engineering change (docs/evidence/INT-519.md lists it). No triage
# level, route, register, location or red-flag rule is created, relaxed or removed here,
# and no rule reads any of the gated items.
kind: clinical_decision
id: CD-112
title: "Review-queue cluster gate literals: self-report, immunosuppression and pregnancy gates"
question: >-
  INT-441 found three gates in the review-queue cluster packs that compare a base code
  slot against a string no authored answer holds. cluster.mental_health gates
  diger_madde_kullanimi and baskalarinin_duymadigi_sesler on subject_role == 'kendim',
  which never opens. cluster.medical gates bagisiklik_tedavisinde_enfeksiyon on
  immunosuppression != 'hayir', and cluster.womens_health gates gebelik_dogrulandi on
  pregnancy_status != 'hayir'; both open after every answer, a plain "hayır" included.
  For each gate: which authored literal says what the gate is for, which way does the
  change move who is asked, and how is a hedged answer to the gating slot recorded so
  that the gate does not read Unknown? (INT-519 items 1, 2 and 3.)
decision: >-
  Item 1. The two mental-health items are self-report history. They are asked only when
  the patient answers for themselves. They are never put, as worded, to a relative in a
  proxy session: the second-person question would file the speaker's own substance use
  or experiences in the patient's record, and NICE CG178 1.1.4.2 makes how information
  about the service user is shared with carers something negotiated with the service
  user, which a pre-visit app cannot do. The self-report literal is
  subject_role == 'kendim için', the authored self choice of vs.subject_role. The change
  applies only once ADR-040 (PR #833, INT-483) has landed. Until then the gate stays as
  it is: it opens for nobody, and the INT-441 value-set check refuses it before the
  cluster can be promoted. It is held so that the items cannot open before the proxy
  path that guarantees a relative never hears them. ADR-040's proxy compiler refuses a
  patient-addressed slot whose gate reads the subject role (PROXY_GATED_ON_SUBJECT_ROLE),
  so on landing the self-report reading is carried by proxy: {skip: true} on both slots
  and the subject-role gate is dropped. The self document asks them; the proxy document
  records them NOT_ASKED_PROXY and shows the gap. Any subject-role gate kept anywhere
  for these items reads 'kendim için'. Item 2. bagisiklik_tedavisinde_enfeksiyon asks
  about infection during immunosuppressive treatment, so its gate is
  immunosuppression != 'hayır'. It opens on "evet" and on "bilmiyorum" and closes on a
  plain "hayır", which denies the treatment the question presupposes. On
  pmh_fh_sh.immunosuppression, "bilmiyorum", every CD-04 hedge that reads on any slot
  and any unmatched hedge record the authored "bilmiyorum" choice, never UNCLEAR and
  never "hayır", and so does an answer that still fits no choice after the slot's
  follow-up, labelled as mapped. Only a plain negative to the question itself is
  "hayır". UNCLEAR would
  make the gate Unknown, and an Unknown gate opens nothing (files/13 §9.2). A sepsis rule
  that reads the slot would also read Unknown. Yet NICE NG253 1.2.1 lists impaired immune
  function because of illness or medical treatment among the factors that may increase
  the risk of sepsis or of sepsis not being identified promptly, and 1.1.4 asks for extra
  care where the history is hard to take. On this slot the mapping is read before CD-04's
  '*' entries, the same per-slot precedence CD-100 T4(c) set for pregnancy_status. Item
  3. gebelik_dogrulandi, and the five items CD-100 T4(b) moves onto the same gate, open
  on pregnancy_status != 'hayır', which is CD-100 T4's decided reading in the authored
  literal. "evet" and "emin değilim" open them (NICE NG126 1.4.5); a plain "hayır"
  closes them. Hedges stay CD-100 T4(c)'s: they record "emin değilim". Safety direction.
  Items 2 and 3 ask fewer patients than the gates do today, because 'hayir' matches no
  answer and so they open after a plain "hayır" too. The patients no longer asked are
  exactly those whose answer denies the question's premise, and no rule reads either
  gated item. The safety net for an unknown pregnancy is the last menstrual period,
  which base asks after every pregnancy answer (CD-100 round 4). Against the intent
  recorded when the gates were written (the proposals and CD-100 T4), nothing is
  narrowed. Once it applies, item 1 asks more patients than today, because the items
  never open today, and it never asks a relative.
status: active
scope: simulated_patient_stress_testing
scope_note: >-
  Owner decision D18 (2 Oct 2026): agent-only sign-off, for simulated-patient stress
  testing only. A licensed physician's review is required before any real patient. The
  three clusters are review-queue L0 packs, not servable, so no patient meets any gate
  here before HB-C1 is signed. Who may answer for a minor is the legal lane's (HB-L20,
  INT-223), not decided here.
question_origin: >-
  docs/evidence/INT-441.md "For the D18 lane (not decided here)" (the table of four
  cluster gates); INT-519 (GitHub #885) items 1, 2 and 3, with the INT-441 clinical
  reviewer's recommendations, which were inputs and not decisions.
author_role: "internal medicine, emergency medicine, obstetrics and gynaecology and psychiatry physician (agent)"
inference_disclosure: >-
  Item 1: that a relative who hears a second-person question answers about themselves is
  ADR-040's structural reading (the ADR is on PR #833, not yet on main), not a clinical
  source. NICE CG178 covers adults with psychosis or schizophrenia; it is cited for the
  direction that what a carer is told or asked about the service user is negotiated
  with the service user and involves the carer "if appropriate", not as a pre-visit
  source. Skipping both items in a proxy session, rather than rewording them for the
  relative, is this author's conservative choice: collateral history of substance use
  or hallucinatory experiences belongs to the clinician. Holding the change until #833
  lands is sequencing, not a clinical source. Item 2: recording every hedge on
  immunosuppression as the authored "bilmiyorum" choice is this author's
  operationalisation, the same as CD-100 T4(c) for pregnancy_status. Extending it to an
  answer still unresolved after the follow-up is also this author's: the patient has not
  said yes or no, "bilmiyorum" is the authored record of exactly that, and the label
  keeps the record honest about how it got there. NICE NG253 1.1.4
  gives language and communication challenges as its examples of a history that is hard
  to take. It is cited for the direction NICE takes when the history is uncertain. NG253
  covers people aged 16 or over. In a child chain the mapping keeps the same direction on
  the strength of the CKM presence value set alone (Unknown is not No); NICE NG254
  (under 16s) was not retrieved, and nothing here extrapolates an adult threshold to a
  child. Item 3: as CD-100 T4.
