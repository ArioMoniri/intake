value:
  value_sets: packages/protocols/base/valuesets.yaml
  literal_rule: "a gate literal is a member of its slot's committed value set, compared byte for byte (INT-441); a prefix, a case change or an ASCII folding is not a member"
  gates:
    - item: 1
      issue_item: "INT-519 item 1 (GitHub #885)"
      pack: cluster.mental_health
      file: packages/protocols/review/cluster/mental_health.yaml
      slots: [sorular.diger_madde_kullanimi, sorular.baskalarinin_duymadigi_sesler]
      valueset: vs.subject_role
      gate_today: "subject_role == 'kendim'"
      opens_today: never
      reading: self_report_only
      gate_decided: "subject_role == 'kendim için'"
      literal: "kendim için"
      proxy_session: not_asked
      applies_when: "ADR-040 (PR #833, INT-483; branch int-483-self-proxy at d5943fd7) has landed on main"
      until_applied: "no change: the gate stays as it is, opens for nobody, and the INT-441 value-set check refuses it before the cluster can be promoted"
      encoding_once_applied:
        gate: none
        proxy: {skip: true}
      encoding_note: >-
        ADR-040's proxy compiler refuses a patient-addressed slot whose gate reads the
        subject role (PROXY_GATED_ON_SUBJECT_ROLE), and the self document serves only
        sessions whose role is 'kendim için'. So the gate is dropped and the proxy skip
        carries the reading: asked in the self document, NOT_ASKED_PROXY with a note gap
        in the proxy document. A subject-role gate kept anywhere for these items reads
        gate_decided.
      safety_direction: >-
        More patients than today once applied (the items never open today); never a
        relative. Neither item is a red-flag probe, and no rule reads either.
      not_decided_here: >-
        A proxy rewording of either item (collateral history stays the clinician's), the
        held Q17 and Q18 of the proposal, and any under-18 path (HB-L20, INT-223).
      sources: [NICE-CG178]
      status: active
    - item: 2
      issue_item: "INT-519 item 2 (GitHub #885)"
      pack: cluster.medical
      file: packages/protocols/review/cluster/medical.yaml
      slots: [sorular.bagisiklik_tedavisinde_enfeksiyon]
      valueset: vs.immunosuppression
      gate_today: "immunosuppression != 'hayir'"
      opens_today: "after every answer, 'hayır' included"
      gate_decided: "immunosuppression != 'hayır'"
      literal: "hayır"
      opens_on: ["evet", "bilmiyorum"]
      closes_on: ["hayır"]
      hedge_mapping:
        slot: pmh_fh_sh.immunosuppression
        records_choice: "bilmiyorum"
        reads: "'bilmiyorum', every CD-04 entry that reads on '*', and any unmatched hedge"
        never: [UNCLEAR, "hayır"]
        plain_negative_only: "hayır"
        plain_negative_is: "a plain negative to the scripted question itself (CD-04: 'hayır', 'yok', 'olmadı')"
        precedence: "on this slot the mapping is read before CD-04's '*' entries (as CD-100 T4(c) for pregnancy_status)"
        unresolved_after_follow_up: "an answer that still fits no choice after the slot's follow_up_tr also records 'bilmiyorum', labelled mapped_from_unresolved, so once the question has been asked the gate never reads Unknown"
        record_label_by_source:
          hedge: mapped_from_hedge
          unresolved: mapped_from_unresolved
        rule_reading: "a rule that reads this slot as a risk factor reads it as != 'hayır', so 'bilmiyorum' counts with 'evet'; the rule itself still needs its own source and sign-off (HB-C1)"
      safety_direction: >-
        Fewer patients than today: a plain "hayır" no longer opens the item, and that
        answer denies the treatment the item presupposes. No rule reads the item. The
        hedge mapping widens: a hedge opens the item instead of closing it as UNCLEAR
        would.
      sources: [NICE-NG253, openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
    - item: 3
      issue_item: "INT-519 item 3 (GitHub #885)"
      pack: cluster.womens_health
      file: packages/protocols/review/cluster/womens_health.yaml
      slots: [sorular.gebelik_dogrulandi]
      valueset: vs.pregnancy_status
      gate_today: "pregnancy_status != 'hayir'"
      opens_today: "after every answer, 'hayır' included; it gates Q3 to Q9 of the cluster through gebelik_dogrulandi"
      gate_decided: "pregnancy_status != 'hayır'"
      literal: "hayır"
      opens_on: ["evet", "emin değilim"]
      closes_on: ["hayır"]
      hedges: "CD-100 T4(c): 'bilmiyorum' and every hedge record 'emin değilim', never UNCLEAR, never 'hayır'"
      also_applies_to:
        record: CD-100
        ref: "T4 (b)"
        gate: "pregnancy_status != 'hayır'"
        slots: [gebelikte_kanama, gebelikte_siddetli_bas_agrisi, gebelikte_gorme_bozuklugu, bebek_hareketlerinde_azalma, gebelikte_su_gelmesi]
      safety_direction: >-
        Fewer patients than today: a plain "hayır" no longer opens gebelik_dogrulandi or
        the items behind it. That is CD-100 T4's decided reading. The last menstrual
        period, asked after every pregnancy answer (CD-100 round 4), keeps a possible
        pregnancy on record for a woman who answers "hayır". No rule reads the gated
        items.
      sources: [NICE-NG126]
      status: active
