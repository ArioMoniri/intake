# INT-432 clinical decision CD-12. Agent-authored under owner decision D18
# (2 Oct 2026): simulated-patient stress testing only; a licensed physician's
# review is required before any real patient. Every source quote below appears
# verbatim in the named snapshot; spec_basis quotes appear verbatim in the named
# committed file. Not a pack: nothing here is compiled or served.
kind: clinical_decision
id: CD-12
title: "Head injury on anticoagulant or antiplatelet treatment: NICE NG232 basis, route and recency"
question: >-
  V-BVSC-4: should the beyin_ve_sinir_cerrahisi proposal for a recent head injury in a
  patient on an anticoagulant or a non-aspirin antiplatelet be re-based on NICE NG232
  (the referral recommendation the INT-427 verifier names as 1.2.4), which
  recommendation number and wording apply, where does it route, and within what
  recency of the injury?
decision: >-
  Yes. It is re-based on the primary NICE NG232 text (published 18 May 2023; minor
  changes up to March 2025), retrieved from nice.org.uk on 2026-10-03. The secondary
  RCEM reproduction (S8) stays as provenance only. The verifier's number is right:
  1.2.4 is the recommendation for community health services, and its wording matches
  the reproduction. The neighbouring recommendation 1.2.3 is the one for remote advice
  services, the setting nearest to a remote pre-visit intake. Both list "current
  anticoagulant or antiplatelet (except aspirin monotherapy) treatment" as a risk
  factor, and both send the person to a hospital emergency department. The July 2023
  update confirms that either treatment counts. NG232 does not put this risk factor
  in 1.2.2, the list that sends the person by emergency ambulance. The route is
  therefore SAME_DAY_ACIL, not EMERGENCY_NOW. Seizure, focal deficit or reduced
  consciousness since the injury belong to the 1.2.2 list and to their own rules. The
  drug classes come from 1.5.13: vitamin K antagonists, DOACs, heparin and low
  molecular weight heparins, and any antiplatelet regimen except aspirin alone.
  Aspirin with a second antiplatelet is not monotherapy. NG232 sets no recency. Its
  definition of a head injury has no time limit, and its risk factors run "since the
  injury". Its only time window, the eight hours in 1.5.13, is a CT-timing rule inside
  the emergency department that extends beyond eight hours ("within the hour if they
  present more than 8 hours after the injury"). The recency window therefore stays
  draft_needs_source, with one sourced constraint: whatever window is signed must not
  be the 1.5.13 eight hours. Against today's base slot the class cannot be applied.
  meds_allergies.anticoagulant_use asks "Kan sulandırıcı bir ilaç kullanıyor musunuz?"
  with evet, hayır or bilmiyorum, records no drug class, and CD-02 forbids filling it
  from a drug name. Until a class-level answer exists, any "evet" fires the rule: the
  aspirin-monotherapy exclusion is not applied, which over-triages and fails closed. A
  "bilmiyorum" is UNCLEAR and resolves to the more acute reading, so it fires too. How
  the class is captured stays draft_needs_source. So does whether patients understand
  "kan sulandırıcı" to include clopidogrel, prasugrel or ticagrelor; that question is
  left to the HB-C6 base-slot author. The action scripts are still unwritten, but one
  constraint on them is active and carries no time value: NG232 refers straight to the
  emergency department and 1.5.13 times the scan from the injury. The REMOTE action
  must therefore send the patient to the acil servis without waiting for a later time
  of day. They travel accompanied by a competent adult, and they are driven or use
  public transport rather than driving themselves (1.2.6, 1.2.7). The action must not
  reuse the SARI chest-pain action's "Bugün içinde" wording. The rule is placed in
  base.life_threat (CD-13), not in the neurosurgery stub. The EK-4 level, the register
  and the three location scripts stay draft_needs_source.
status: active
scope: simulated_patient_stress_testing
author_role: "neurosurgery and emergency medicine physician (agent)"
