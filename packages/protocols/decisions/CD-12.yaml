source_gap: >-
  NICE NG232 sets no recency window for referring a person with a head injury on
  anticoagulant or antiplatelet treatment. Its risk factors run "since the injury" and its
  head-injury definition has no time limit; its one time window (1.5.13) is a CT-timing rule
  in the emergency department that does not end at eight hours. EK-4 names no
  anticoagulant modifier. No retrieved Turkish regulation or guideline sets either value.
  The register and the REMOTE, ON_SITE and UNKNOWN action scripts are authored with the
  base.life_threat rule (HB-C2) and are not written here. The base anticoagulant_use slot
  records no drug class, and no retrieved source says whether patients understand "kan
  sulandırıcı" to include antiplatelet drugs.
