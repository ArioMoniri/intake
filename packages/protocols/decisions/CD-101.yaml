    - item: "docs/evidence/verification/near-twin-sweep-582.md#L182"
      ref: T89
      packets: [cluster_surgical, el_cerrahisi, plastik_rekonstruktif_ve_estetik_cerrahi]
      deciders: [HB-C1]
      question: "Plastik cerrahi Q2 soru_1 (onset after an injury, burn or operation) overlaps cluster travma_sonrasi_basladi (onset after a fall, blow or injury), the pattern el cerrahisi was rebound on; merge or narrow?"
      outcome: change
      change: >-
        Narrow plastik Q2 to the factors the cluster does not name: "Şikâyetiniz bir
        yanık ya da ameliyattan sonra mı başladı?" (gen:
        slot=yanik_ameliyat_sonrasi_basladi; type=boolean). It replaces soru_1.
