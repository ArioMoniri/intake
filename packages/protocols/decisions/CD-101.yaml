    - item: "docs/evidence/verification/near-twin-sweep-582.md#L185"
      ref: T92
      packets: [_cross-cutting]
      deciders: [base owner, owner]
      question: "The generator's fixed ziyaret_baglami.sikayet_suresi ('ne zamandır var', a duration) and base onset_date ('ne zaman başladı', a date) record the same fact in all 91 chains; which goes?"
      outcome: owner_question
      clinical_basis: "Not decided here: every decider is non-clinical, which D18 does not reach (§C code F)."
      status: owner_question
      owner_part: >-
        Owner and base owner: the generator's fixed sikayet_suresi asks how long the
        complaint has lasted, and base onset_date asks when it began, in every chain.
        Should the generator omit the fixed slot where base asks the onset (with
        CD-100 T3's duration=omit question), or should base change? onset_date is the
        tense anchor of the base red-flag rules, so a date must stay.
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L186"
      ref: T93
      packets: [agiz_dis_cene_radyolojisi]
      deciders: [HB-C1]
      question: "Ağız-diş-çene radyolojisi Q8 yuz_cene_sisligi (swelling of the face, jaw or under the tongue) and Q6 agiz_cene_boyun_sislik (a palpable swelling or hardness in the mouth, jaw or neck) share jaw swelling; keep both or drop one?"
      outcome: accept
      clinical_basis: >-
        An acute facial or floor-of-mouth swelling and a palpable lump in the mouth or
        neck are different constructs. A lump on the lip or in the oral cavity (NG12
        1.8.3) and a persistent neck lump (1.8.2) are referral constructs of their
        own. Both stay. Whether the airway item is asked here is CD-104's owner
        question (INT-353.md#L314).
      sources: [NICE-NG12]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L187"
      ref: T94
      packets: [agiz_dis_ve_cene_cerrahisi]
      deciders: [HB-C1]
      question: "Ağız, diş ve çene cerrahisi Q2 yuz_cene_sisligi (swelling of the face, jaw or under the tongue) and Q8 agiz_dudak_boyun_sislik (a swelling or hardness in the mouth, lip or neck that does not go away) overlap; keep both or drop one?"
      outcome: accept
      clinical_basis: >-
        One item is an acute swelling and gates its own fever follow-up. The other is
        a persistent lump, a referral construct of its own (NG12 1.8.2, 1.8.3). Both
        stay.
      sources: [NICE-NG12]
      spec_basis_ref: ["packages/protocols/review/specialty/dis_hekimligi.yaml sorular.sislik_ile_ates"]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L188"
