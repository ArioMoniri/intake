      clinical_basis: >-
        The precipitating event is one element of the symptom record (symptom_sign v2
        Precipitating factor). An injury, a burn and an operation are different
        factors, and the plastic surgeon needs burn and operation, which the cluster
        does not ask.
      sources: [openEHR-EHR-CLUSTER.symptom_sign.v2]
      spec_basis_ref: ["packages/protocols/review/cluster/surgical.yaml sorular.travma_sonrasi_basladi"]
