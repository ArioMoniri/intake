      change: >-
        Remove KBB Q3 (soru_2) from
        docs/evidence/proposals/kulak_burun_bogaz_hastaliklari.md. The cluster's
        isitme_azalmasi_tikaniklik asks blockage. So that no other id moves, pin the
        remaining generated ids: Q4 slot=soru_3, Q6 slot=soru_5, Q10 slot=soru_9, Q11
        slot=soru_10. Q2 (ani_isitme_azalmasi) and Q8 (ses_kisikligi) keep their
        applied ids. Q5 is donme_hissi (T83), Q7 is boyunda_gecmeyen_sislik (T85), and
        Q9 is gecmeyen_bogaz_agrisi (T84). Nothing reads soru_2.
      clinical_basis: >-
        Blockage and fullness are one presence answer (symptom_sign_screening), which
        the cluster asks with a recency frame. Its gated sudden-onset item opens from
        that answer.
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      spec_basis_ref: ["scripts/dev/gen_specialty_packs.py build_pack"]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L176"
