    change: "apply the exact change given; the lead edits the proposal and regenerates the candidate"
    owner_question: "every decider is the owner or the base owner; recorded, not decided (D18)"
  renaming_rule: "a narrowed slot takes a new id whenever its old id names the part removed; generated soru_N ids after a removed item are pinned with explicit slot= names so no other id moves"
  related_decisions:
    feeding_ruling: "the verifier's ruling on CD-100 T9/T48 and CD-103 cluster-wave-b.md#L75: az_beslenme and icemez_ememez are different thresholds, both asked ungated; beslenmeyi_birakma is withdrawn"
    shared_ids: "suregelen_baska_hastalik ('Süregelen başka bir hastalığınız var mı?', type boolean) is the same id, text and type as CD-100 T37 in aile_hekimligi"
  items:
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L144"
      ref: T51
      packets: [cluster_child_health, cocuk_gastroenterolojisi]
      deciders: [HB-C3]
      question: "Çocuk gastroenteroloji Q9 sivi_tutamama (vomiting often and cannot keep fluids down) overlaps cluster her_seyi_kusma (vomits everything); merge or keep?"
      outcome: accept
      clinical_basis: >-
        Vomiting everything is an IMCI general danger sign, while not tolerating
        fluids is its own dehydration risk factor (CG84 1.2.1.2). These are different
        thresholds, and both stay.
      sources: [WHO-IMCI-CHART-2014, NICE-CG84]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L145"
      ref: T52
      packets: [cluster_child_health, cocuk_genetik_hastaliklari]
      deciders: [HB-C3]
      question: "Çocuk genetik Q10 tekrarlayan_kusma_beslenememe (repeated vomiting or cannot feed) overlaps cluster beslenme_sivi_alimi (feeding as usual, opposite polarity); merge or keep?"
      outcome: accept
      clinical_basis: >-
        Under the verifier's feeding ruling, the cluster's feeding-as-usual item
        becomes two ungated items with true_is_concern: az_beslenme, feeding less
        than usual (NG143 1.2.6, CD-100 T9), and icemez_ememez, the IMCI inability
        to drink or breastfeed (CD-103). The branch item is the pack's own combined
        screen, repeated vomiting or not feeding. It is answered yes by either half,
        so it is a different construct from both cluster thresholds, and it stays.
        Its polarity is already true_is_concern. The worst case is a near repeat.
      sources: [NICE-NG143, WHO-IMCI-CHART-2014]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L146"
      ref: T53
      packets: [cluster_child_health, cocuk_genetik_hastaliklari]
      deciders: [HB-C3]
      question: "Çocuk genetik Q10 tekrarlayan_kusma_beslenememe (repeated vomiting) overlaps cluster her_seyi_kusma (vomits everything); merge or keep?"
      outcome: accept
      clinical_basis: >-
        Vomiting everything is the IMCI danger sign, and repeated vomiting below it
        still matters (CG84 1.2.1.2). These are two thresholds, and both stay, as in
        CD-100 T45.
      sources: [WHO-IMCI-CHART-2014, NICE-CG84]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L147"
      ref: T54
      packets: [cluster_child_health, cocuk_hematolojisi_ve_onkolojisi]
      deciders: [HB-C3]
      question: "Çocuk hematoloji Q4 ciltte_kirmizi_mor_nokta (pin-point red or purple spots) and cluster solmayan_dokuntu (non-blanching red or purple rash) describe one sign two ways; merge or keep?"
      outcome: accept
      clinical_basis: >-
        The cluster describes the sign by the pressure test, which identifies a
        non-blanching rash (NG143 Table 2). The haematology item describes it by size,
        which a parent who has not pressed the skin can still report. Unexplained
        petechiae are the leukaemia referral feature in children (NG12 1.10.2). A
        parent may not call pin-point spots a rash, so both descriptions stay.
      sources: [NICE-NG143, NICE-NG12]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L148"
      ref: T55
      packets: [cluster_child_health, cocuk_immunolojisi_ve_alerjisi]
      deciders: [HB-C3]
      question: "Çocuk immünoloji Q7 buyume_geriligi (growth or weight gain behind peers) overlaps cluster buyume_endisesi (concern about height or weight gain); merge or keep?"
      outcome: accept
      clinical_basis: >-
        Faltering growth is defined on observed weight change (NG75 1.2.1). Growth
        lagging behind peers is that observation, while the cluster records a parent's
        concern, including height. Both stay, as in CD-100 T50.
      sources: [NICE-NG75]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L149"
      ref: T56
      packets: [cluster_child_health, cocuk_kardiyolojisi]
      deciders: [HB-C3]
      question: "Çocuk kardiyoloji Q7 nefes_darligi (difficulty breathing) overlaps cluster gogus_icine_cekilme (chest indrawing); merge or keep?"
      outcome: accept
      clinical_basis: >-
        IMCI asks about difficult breathing and then looks for chest indrawing, and
        indrawing is its own high-risk sign (NG143 1.2.5). Both stay, as in CD-100 T47.
      sources: [WHO-IMCI-CHART-2014, NICE-NG143]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L150"
      ref: T57
      packets: [cluster_child_health, cocuk_kardiyolojisi]
      deciders: [HB-C3]
      question: "Çocuk kardiyoloji Q5 yavas_kilo_alma (slow weight gain or growth) overlaps cluster buyume_endisesi (concern about height or weight gain); merge or keep?"
      outcome: accept
      clinical_basis: >-
        Slow weight gain is the observed faltering construct (NG75 1.2.1), which the
        cardiology pack reads beside its feeding-fatigue and sweating items. The
        cluster records a parent's concern, including height. Both stay.
      sources: [NICE-NG75]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L151"
      ref: T58
      packets: [cluster_child_health, cocuk_metabolizma_hastaliklari]
      deciders: [HB-C3]
      question: "Çocuk metabolizma Q5 kusma_beslenme_reddi (frequent vomiting or refusing feeds) overlaps cluster beslenme_sivi_alimi (feeding as usual, opposite polarity); merge or keep?"
      outcome: accept
      clinical_basis: >-
        Under the feeding ruling, the cluster asks feeding less than usual
        (az_beslenme) and inability to drink or breastfeed (icemez_ememez), both
        ungated. The metabolism item is the pack's combined decompensation screen, and
        its yes opens hastalik_aclikla_artis. Narrowing it to vomiting would close
        that follow-up for a child who refuses feeds, so it stays as its own item.
        The thresholds differ (NG143 1.2.6; IMCI), and the worst case is a near
        repeat.
      sources: [NICE-NG143, WHO-IMCI-CHART-2014]
      spec_basis_ref: ["packages/protocols/review/specialty/cocuk_metabolizma_hastaliklari.yaml sorular.hastalik_aclikla_artis"]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L152"
      ref: T59
      packets: [cluster_child_health, cocuk_metabolizma_hastaliklari]
      deciders: [HB-C3]
      question: "Çocuk metabolizma Q5 kusma_beslenme_reddi (frequent vomiting) overlaps cluster her_seyi_kusma (vomits everything); merge or keep?"
      outcome: accept
      clinical_basis: "As T53: vomiting everything (IMCI) against frequent vomiting (CG84 1.2.1.2) are two thresholds, and both stay."
      sources: [WHO-IMCI-CHART-2014, NICE-CG84]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L153"
      ref: T60
      packets: [cluster_medical, deri_ve_zuhrevi_hastaliklari]
      deciders: [HB-C1]
      question: "Deri Q6 iyilesmeyen_yara (any long-standing non-healing skin wound or crust) contains cluster ayak_yarasi (non-healing foot wound, asked only after a diabetes diagnosis); merge or keep?"
      outcome: accept
      clinical_basis: >-
        The records differ by body site and population (symptom_sign v2 Body site).
        The cluster item is the diabetic foot, asked only of people with diabetes,
        while the dermatology item asks any site in every patient. Neither replaces
        the other, and both stay.
      sources: [openEHR-EHR-CLUSTER.symptom_sign.v2]
      spec_basis_ref: ["packages/protocols/review/cluster/medical.yaml sorular.ayak_yarasi"]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L154"
      ref: T61
      packets: [cluster_surgical, el_cerrahisi]
      deciders: [HB-C1]
      question: "Cluster surgical suregelen_rahatsizlik (a chronic-condition umbrella naming diabetes) overlaps el cerrahisi Q14 diyabet_tanisi; merge or keep?"
      outcome: accept
      clinical_basis: >-
        Each diagnosis is one record (problem_diagnosis v1). A yes to the cluster's
        umbrella does not say which condition. Hand surgery needs diabetes itself, and
        the umbrella is shared by every surgical chain, so both stay.
      sources: [openEHR-EHR-EVALUATION.problem_diagnosis.v1]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L155"
      ref: T62
      packets: [cluster_medical, endokrinoloji_ve_metabolizma]
      deciders: [HB-C1]
      question: "Endokrinoloji Q3 aciklanamayan_kilo_degisimi (weight loss or gain without a diet change) contains cluster istemsiz_kilo_kaybi (unintended weight loss); merge or narrow?"
      outcome: change
      change: >-
        Narrow endokrinoloji Q3 to weight gain: "Beslenmenizde belirgin bir
        değişiklik olmadığı hâlde son zamanlarda kilo aldınız mı?" (gen:
        slot=diyet_degismeden_kilo_artisi; type=boolean). The weight-loss half is the
        cluster's istemsiz_kilo_kaybi. The id changes because the old id names the
        removed half and asserts "unexplained", which is the clinician's finding (as
        CD-14). Nothing reads the old id.
      clinical_basis: >-
        One presence record per named symptom (symptom_sign_screening). Weight loss is
        already asked once, by the cluster item, and weight gain is the half only this
        item asks.
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L156"
      ref: T63
      packets: [cluster_medical, enfeksiyon_hastaliklari]
      deciders: [HB-C1]
      question: "Enfeksiyon Q14 suregen_hastalik (any long-term diagnosis) contains cluster bobrek_hastaligi_tanisi; merge or narrow?"
      outcome: change
      change: >-
        Narrow enfeksiyon Q14 to other chronic diseases: "Süregelen başka bir
        hastalığınız var mı?" (gen: slot=suregelen_baska_hastalik; type=boolean). This
        is the same id, text and type as CD-100 T37. The cluster's five diagnosis
        items are asked before it in this chain. The same change closes T64–T67.
      clinical_basis: >-
        Each diagnosis is one record (problem_diagnosis v1). The cluster's named items
        gate their own follow-ups and stay, and the umbrella asks only for the rest.
      sources: [openEHR-EHR-EVALUATION.problem_diagnosis.v1]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L157"
      ref: T64
      packets: [cluster_medical, enfeksiyon_hastaliklari]
      deciders: [HB-C1]
      question: "Enfeksiyon Q14 suregen_hastalik contains cluster tiroit_hastaligi_tanisi; merge or narrow?"
      outcome: change
      change: "The T63 change: enfeksiyon Q14 becomes \"Süregelen başka bir hastalığınız var mı?\" (gen: slot=suregelen_baska_hastalik; type=boolean); tiroit_hastaligi_tanisi stays."
      clinical_basis: "As T63: one record per diagnosis (problem_diagnosis v1)."
      sources: [openEHR-EHR-EVALUATION.problem_diagnosis.v1]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L158"
      ref: T65
      packets: [cluster_medical, enfeksiyon_hastaliklari]
      deciders: [HB-C1]
      question: "Enfeksiyon Q14 suregen_hastalik contains cluster diyabet_tanisi; merge or narrow?"
      outcome: change
      change: "The T63 change: enfeksiyon Q14 becomes \"Süregelen başka bir hastalığınız var mı?\" (gen: slot=suregelen_baska_hastalik; type=boolean); diyabet_tanisi stays and keeps gating its follow-ups."
      clinical_basis: "As T63: one record per diagnosis (problem_diagnosis v1)."
      sources: [openEHR-EHR-EVALUATION.problem_diagnosis.v1]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L159"
      ref: T66
      packets: [cluster_medical, enfeksiyon_hastaliklari]
      deciders: [HB-C1]
      question: "Enfeksiyon Q14 suregen_hastalik contains cluster yuksek_tansiyon_tanisi; merge or narrow?"
      outcome: change
      change: "The T63 change: enfeksiyon Q14 becomes \"Süregelen başka bir hastalığınız var mı?\" (gen: slot=suregelen_baska_hastalik; type=boolean); yuksek_tansiyon_tanisi stays and keeps gating its follow-up."
      clinical_basis: "As T63: one record per diagnosis (problem_diagnosis v1)."
      sources: [openEHR-EHR-EVALUATION.problem_diagnosis.v1]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L160"
      ref: T67
      packets: [cluster_medical, enfeksiyon_hastaliklari]
      deciders: [HB-C1]
      question: "Enfeksiyon Q14 suregen_hastalik contains cluster astim_koah_tanisi; merge or narrow?"
      outcome: change
      change: "The T63 change: enfeksiyon Q14 becomes \"Süregelen başka bir hastalığınız var mı?\" (gen: slot=suregelen_baska_hastalik; type=boolean); astim_koah_tanisi stays and keeps gating its follow-up."
      clinical_basis: "As T63: one record per diagnosis (problem_diagnosis v1)."
      sources: [openEHR-EHR-EVALUATION.problem_diagnosis.v1]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L161"
      ref: T68
      packets: [cluster_medical, fiziksel_tip_ve_rehabilitasyon]
      deciders: [HB-C1]
      question: "Fiziksel tıp Q7 ates_var_mi ('son zamanlarda') and cluster son_gunlerde_ates ('son günlerde') differ only by the recall word; merge or keep?"
      outcome: change
      change: >-
        Remove fiziksel tıp Q7 (gen: slot=ates_var_mi; type=boolean) from
        docs/evidence/proposals/fiziksel_tip_ve_rehabilitasyon.md. The chain inherits
        the cluster's verified son_gunlerde_ates, "Son günlerde ateşiniz oldu mu?", so
        the fever is asked once. Nothing in the candidate reads ates_var_mi; any
        draft fiziksel tıp rule input that named it reads son_gunlerde_ates. This is
        the clinical answer to the routing question CD-104 records (INT-353.md#L432),
        and it leaves that routing to its owner.
      clinical_basis: >-
        Fever is one presence record (symptom_sign_screening). NG59 1.1.1 requires
        infection to be excluded as a cause of back pain but sets no window, so the
        window is a representation choice. The cluster's verified form keeps one id
        across medical chains. The chain still asks the other infection and cancer
        inputs: night or rest pain, weight loss, malaise and night sweats.
      sources: [NICE-NG59, openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L162"
      ref: T69
      packets: [cluster_medical, fiziksel_tip_ve_rehabilitasyon]
      deciders: [HB-C1]
      question: "Fiziksel tıp Q4 soru_3 (how much the problem affects daily tasks, walking and self-care) overlaps cluster gunluk_islev_kisitlanmasi (difficulty with daily tasks, yes/no); merge or keep?"
      outcome: change
      change: >-
        CD-17's change: Q4 adopts the cluster's id, type, ask and follow-up verbatim
        (gen: slot=gunluk_islev_kisitlanmasi; type=boolean; follow_up=Yemek, giyinme
        ya da ev işleri gibi günlük işlerde zorlanıyor musunuz?). The rehabilitation
        detail becomes CD-17's gated Q4a, "Yürümek, giyinmek ya da kendinize bakmak
        gibi en çok hangi işlerde zorlanıyorsunuz?" (gen: slot=zorlanilan_gunluk_isler;
        type=string; ask_if=gunluk_islev_kisitlanmasi == true). Q4a reads a slot
        declared earlier in the same pack, so the generator accepts the gate. CD-100
        T29 removes Q3, so no generated id after it moves.
      clinical_basis: >-
        Function is one outcome fact, asked once (NG59 1.3.8, "pain or function"), and
        the detail is asked only after a yes (CD-17).
      sources: [NICE-NG59]
      spec_basis_ref: ["packages/protocols/decisions/CD-17.yaml decision"]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L163"
      ref: T70
      packets: [cluster_sensory, goz_hastaliklari]
      deciders: [HB-C1]
      question: "Göz Q2 soru_1 (reduced or blurred vision 'son zamanlarda') overlaps cluster gorme_degisikligi (new reduction or change in vision); merge or keep?"
      outcome: change
      change: >-
        As CD-104 decides (INT-353.md#L291): Q2 adopts the cluster's verified text
        verbatim under the cluster id, "Görmenizde yeni bir azalma ya da değişiklik
        oldu mu?" (gen: slot=gorme_degisikligi; type=boolean; follow_up=Gelip geçse
        bile görmenizde bulanıklık ya da kararma oldu mu?). The cluster's
        sudden-onset and one-eye follow-ups then open in the göz chain.
      clinical_basis: >-
        It is one symptom with one presence answer (symptom_sign_screening). The
        cluster's broader new-change item carries reduction and blur, and its gated
        follow-ups add the onset and laterality the eye clinic needs.
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L164"
      ref: T71
      packets: [cluster_sensory, goz_hastaliklari]
      deciders: [HB-C1]
      question: "Göz Q3 soru_2 (sudden visual loss, even if transient) overlaps cluster ani_gorme_degisikligi (the change began suddenly); merge or keep?"
      outcome: change
      change: >-
        As CD-104: Q3 stays apart with its text unchanged, typed under a semantic id
        (gen: slot=gecici_ani_gorme_kaybi; type=boolean). It replaces soru_2, and
        nothing reads soru_2.
      clinical_basis: >-
        A transient episode that has resolved is recorded as a resolved episode
        (symptom_sign v2 resolution), apart from a current change. The cluster's
        sudden-onset item is asked only after a current change, so it cannot carry a
        loss that has already passed.
      sources: [openEHR-EHR-CLUSTER.symptom_sign.v2]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L165"
      ref: T72
      packets: [cluster_sensory, goz_hastaliklari]
      deciders: [HB-C1]
      question: "Göz Q8 soru_7 (redness in or around the eye) overlaps cluster goz_kizarikligi (new eye redness); merge or narrow?"
      outcome: change
      change: >-
        As CD-104: Q8 narrows to the skin around the eye, "Gözünüzün çevresindeki
        deride kızarıklık var mı?" (gen: slot=goz_cevresi_kizariklik; type=boolean).
        Eye redness is the cluster's goz_kizarikligi.
      clinical_basis: "Eye redness and redness of the skin around the eye differ by body site (symptom_sign v2 Body site), so each is asked once."
      sources: [openEHR-EHR-CLUSTER.symptom_sign.v2]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L166"
      ref: T73
      packets: [cluster_sensory, goz_hastaliklari]
      deciders: [HB-C1]
      question: "Göz Q4 soru_3 (floaters) is the floaters half of cluster isik_cakmasi_ucusan_cisim (new flashes or floaters); merge or keep?"
      outcome: change
      change: >-
        As CD-104: Q4 stays apart with its text unchanged, typed under a semantic id
        (gen: slot=ucusan_noktalar; type=boolean). It replaces soru_3. The cluster's
        combined item is still asked.
      clinical_basis: >-
        Floaters alone is a separate presence answer (symptom_sign_screening) that the
        combined cluster item cannot carry under one id. The eye clinic needs to know
        which of the two the patient has.
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L167"
      ref: T74
      packets: [cluster_sensory, goz_hastaliklari]
      deciders: [HB-C1]
      question: "Göz Q5 soru_4 (flashes) is the flashes half of cluster isik_cakmasi_ucusan_cisim; merge or keep?"
      outcome: change
      change: >-
