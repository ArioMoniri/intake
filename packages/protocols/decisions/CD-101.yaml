value:
  packet_commit: 151cf34f
  trail: docs/evidence/verification/near-twin-sweep-582.md
  candidate_state: "slot ids are those of the review candidates at 151cf34f (after the #582 rebinds and the INT-353 revert of the five LOW rebinds)"
  outcome_meaning:
