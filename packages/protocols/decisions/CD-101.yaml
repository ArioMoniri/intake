    - item: "docs/evidence/verification/near-twin-sweep-582.md#L174"
      ref: T81
      packets: [cluster_mental_health, klinik_psikoloji_poliklinigi]
      deciders: [HB-C1, clinician, psychiatrist]
      question: "Klinik psikoloji Q8 onceki_psikoterapi (regular sessions with a psychologist or psychiatrist) overlaps cluster onceki_ruh_sagligi_destegi (any prior support), and the narrower answer would open onceden_iyi_gelen; merge or keep?"
      outcome: change
      change: >-
        As CD-104 decides (INT-353.md#L306, #L428), made generator-valid. (a) The
        klinik psikoloji proposal re-declares the cluster's item before Q8, with the
        cluster text verbatim: "Daha önce ruh sağlığınızla ilgili bir hekimden ya da
        psikologdan destek aldınız mı?" (gen: slot=onceki_ruh_sagligi_destegi;
        type=boolean). The same id replaces the cluster slot in place, and the
        cluster's gated onceden_iyi_gelen still reads it. (b) Q8 keeps its id and text
        and becomes its detail (gen: slot=onceki_psikoterapi; type=boolean;
        ask_if=onceki_ruh_sagligi_destegi == true). (c) Answer mapping for
        onceki_ruh_sagligi_destegi in this chain, under CD-04's per-slot rule: a
        hedged yes ("galiba", "bir ara gitmiştim") is present-qualified and opens the
        detail. "Hatırlamıyorum" is UNCLEAR, its follow-up is asked once (CD-04), and
        if it stays UNCLEAR the detail is not asked. That loses only a detail item,
        never a safety input.
      clinical_basis: >-
        Any past treatment and the response to it is the assessment fact (NG222
        1.2.7), which the cluster's broader item asks and which opens "what helped".
        Regular psychotherapy is a narrower detail, asked only after a yes. A
        specialty gate may read only base slots and the pack's own earlier slots,
        which is why the cluster item is re-declared in the pack.
      sources: [NICE-NG222]
      spec_basis_ref: ["scripts/dev/gen_specialty_packs.py build_pack", "packages/protocols/review/cluster/mental_health.yaml sorular.onceki_ruh_sagligi_destegi", "packages/protocols/decisions/CD-04.yaml decision"]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L175"
      ref: T82
      packets: [cluster_sensory, kulak_burun_bogaz_hastaliklari]
      deciders: [HB-C1]
      question: "KBB Q3 soru_2 (new ear blockage or fullness) is the blockage half of cluster isitme_azalmasi_tikaniklik (hearing reduction or ear blockage); merge or keep?"
