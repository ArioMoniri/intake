      packets: [amatem, cematem]
      deciders: [HB-C1, psychiatrist]
      question: "At AMATEM and ÇEMATEM the visit reason (basvuru_nedeni: 'which topic do you want support with') and Q3 konusulacak_madde (which substance or habit) overlap; keep both or drop one?"
      outcome: accept
      clinical_basis: >-
        The substance is the first area of the assessment (CG115 1.2.2.6, which
        includes other drug misuse), so the item naming it stays in both packs.
        Whether the generator's fixed reason slot is asked beside it is the owner's
        question for every chain (CD-100 T2).
      sources: [NICE-CG115]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L189"
      ref: T96
      packets: [beslenme_ve_diyet]
      deciders: [HB-C1]
      question: "Beslenme ve diyet Q5 yutma_guclugu (difficulty swallowing food or drink) and Q6 lokma_takilmasi (food sticking in the throat) are two dysphagia items in one pack; keep both or drop one?"
      outcome: change
      change: >-
        Remove Q6 (gen: slot=lokma_takilmasi; type=boolean) from
        docs/evidence/proposals/beslenme_ve_diyet.md. Q5 yutma_guclugu is the one
        dysphagia item. Nothing reads lokma_takilmasi, and the pack has no generated
