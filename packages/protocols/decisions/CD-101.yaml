      clinical_basis: >-
        Dysphagia is one feature (NG12 1.2.1 names it once), and food sticking is a
        form of it. The dietitian needs to know whether swallowing is difficult, and
        the type of dysphagia is the clinician's examination.
      sources: [NICE-NG12]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L190"
      ref: T97
      packets: [cocuk_enfeksiyon_hastaliklari]
      deciders: [HB-C3]
      question: "Çocuk enfeksiyon Q7 uykulu_tepkisiz (sleepier or more tired than usual) and Q8 uyandirma_zorlugu (hard to wake) split the cluster's one item; keep both or drop one?"
      outcome: accept
      clinical_basis: >-
        NG143 grades waking difficulty on its own: a child who wakes only with
        prolonged stimulation (amber) or does not wake (red), apart from decreased
        activity. The pack's sleepiness text no longer asks about waking, so both
        stay, as in CD-104 (INT-353.md#L300).
      sources: [NICE-NG143]
      status: active
    - item: "docs/evidence/verification/near-twin-sweep-582.md#L191"
      ref: T98
      packets: [deri_ve_zuhrevi_hastaliklari]
      deciders: [HB-C1]
      question: "Deri Q2 endiselendiren_ben_leke (a worrying mole or spot, which gates the checklist follow-ups) and Q7 yeni_buyuyen_kabarti (a new or growing lump or spot) overlap; keep both or drop one?"
      outcome: accept
      clinical_basis: >-
        A worrying existing mole opens the melanoma checklist items, such as change in
        size (NG12 1.7.1). A new or growing raised lesion is the separate
        squamous-cell construct (NG12 1.7.4), and a patient may not call it a mole.
        Both stay.
      sources: [NICE-NG12]
      status: active
