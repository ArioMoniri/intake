# INT-448 clinical decision CD-101 (GitHub #759). Agent-authored under owner
# decision D18 (2 Oct 2026): simulated-patient stress testing only; a licensed
# physician's review is required before any real patient. Every source quote
# below appears verbatim in the named snapshot; spec_basis quotes appear verbatim
# in the named committed file. Not a pack: the lead applies each change to the
# proposal (docs/evidence/proposals/<slug>.md) and regenerates the candidates.
# Slot ids are read from the candidates at 151cf34f, the packets' state. No
# triage level, route, register, location or red-flag rule is created, changed
# or removed here.
kind: clinical_decision
id: CD-101
title: "#642 packet items: near-twin sweep T51–T100"
question: >-
  For each near-twin row T51–T99 of the near-twin sweep
  (docs/evidence/verification/near-twin-sweep-582.md at 151cf34f), and its §D
  named-site row, filed in the #642 sign-off packets, two slots in one extends
  chain ask the same or an overlapping fact: which slot stays, which is dropped,
  narrowed or renamed, with what Turkish text, or which part belongs to the owner?
decision: >-
  Each row gets one outcome: 21 accept, 28 change and 1 owner_question, with no
  reject and no draft_needs_source. accept means the twin is real but both slots
  stay, because each records a fact the other does not (§C "keep under its own
  id"); change gives the exact slot, text or gate change; owner_question means
  every decider is the owner or the base owner, which D18 does not reach. Four
  rules decide the rows. (1) Thresholds are kept apart. Vomiting everything (an
  IMCI general danger sign) against recurrent or frequent vomiting or not
  tolerating fluids; chest indrawing against breathing difficulty; waking
  difficulty against sleepiness; dizziness or imbalance against spinning vertigo;
  and a new lump anywhere against an acute facial swelling are each two facts, so
  both stay. The feeding rows follow the verifier's ruling on CD-100 and CD-103:
  feeding less than usual (az_beslenme) and inability to drink or breastfeed
  (icemez_ememez) are different thresholds, and the metabolic and genetic packs'
  combined vomiting-or-not-feeding screens stay as their own items. (2) An
  umbrella that names a cluster item drops what the cluster asks: the infectious
  diseases and internal medicine chronic-disease umbrellas become the same
  "another chronic disease" item CD-100 gave family medicine, the cardiology
  umbrella drops hypertension, and the medical ecology heart-or-lung item excludes
  asthma and COPD. A combined branch item keeps only its other half: weight gain
  (endocrinology), persistent throat pain (ENT), effortful breathing without
  grunting (neonatology), and onset after a burn or an operation (plastic
  surgery). (3) Where the cluster's verified text is the better form of the same
  symptom, the branch adopts it under the cluster id (vision change, night sweats,
  spinning, recent fever in physical medicine, the function item per CD-17), or
  drops a duplicate (ear blockage, food sticking for the dietitian). (4) These
  rows already decided in CD-102 or CD-104 (the göz, iç hastalıkları Q5, KBB Q5
  and Q7, klinik psikoloji Q8 and odyoloji pairs) are decided the same way here.
  The klinik psikoloji gate is made readable by re-declaring the cluster's
  support item in that pack, because a specialty gate may read only base slots
  and the pack's own earlier slots. Site-specific surgical-history items stay
  ungated. The generator's fixed duration slot against base onset_date is an
  owner question. Renamed slots take a new id whenever the old id names the part
  removed, and generated soru_N ids after a removed item are pinned so no other id
  moves.
status: active
scope: simulated_patient_stress_testing
scope_note: >-
  Owner decision D18 (2 Oct 2026): agent-only sign-off, for simulated-patient
  stress testing only. A licensed physician's review is required before any real
  patient. D18 does not reach the owner parts; they are recorded in owner_part and
  in the owner_question row.
question_origin: >-
  #642 sign-off packets at 151cf34f; docs/evidence/verification/near-twin-sweep-582.md
  §A rows T51–T99, the §D named-site row and the §C resolution codes C, K and F
  (at 151cf34f, not on main).
author_role: "paediatrics, internal medicine, ophthalmology, otorhinolaryngology, psychiatry, surgery, dermatology, dentistry, physical medicine and rehabilitation and dietetics physician (agent)"
inference_disclosure: >-
  The sources fix each construct. The Turkish wording, the choice to narrow
  rather than drop an item, the new slot ids and the pins are this author's
  representation decisions. Every new Turkish string is ≤ B1, uses siz, has one
  question mark and no digits, and names no diagnosis to the patient. NICE NG127
  and NG222 cover adults; NG143, CG84 and the IMCI chart cover children under five
  (IMCI: two months up to five years, and the young infant up to two months).
  They are cited for constructs, never for thresholds asked of the patient.
