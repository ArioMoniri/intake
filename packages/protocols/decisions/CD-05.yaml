kind: clinical_decision
id: CD-05
title: "Tense anchor per RED rule and the scripted anchor question"
question: "For each RED rule, which slot anchors its tense, how is the anchor asked as a scripted closed choice, how does each choice resolve against the session reference time, and how do NICE CG95's twelve-hour and seventy-two-hour windows map onto the engine's calendar-day tenses?"
decision: "Only the two active chest-pain rules are evaluable; both anchor on chest_pain.onset_at, which holds the time of the most recent episode (NICE CG95 1.2.1.1 asks when the last episode was). The paediatric-airway and crisis rules are draft and their anchors stay draft_needs_source. The anchor is asked as one scripted closed choice whose four non-overlapping bands are NICE's own: 'şu anda var', 'son on iki saat içinde', 'on iki saatten önce ama son üç gün içinde', 'üç günden daha önce'. The illustrative calendar words of the physician review (şu an / bugün / bu hafta / daha önce) are not used, because 'bugün' cannot express a twelve-hour band that crosses midnight and 'bu hafta' changes meaning with the weekday. The engine's tense windows are calendar days, with now and today both equal to the reference day (context.py temporal_within). 'şu anda var' and 'son on iki saat içinde' resolve to the reference day: NICE refers both for emergency assessment when an ECG is not available, which is every pre-visit session, so the now-tensed K2 rule may fire even when the twelve hours began the previous calendar day. 'üç günden daha önce' resolves to the reference day minus three, the most acute day consistent with 'more than seventy-two hours ago'; neither active rule fires, matching NICE 1.2.1.10, which sends that patient to detailed clinical assessment rather than emergency or same-day referral. The final resolution of 'on iki saatten önce ama son üç gün içinde' (twelve to seventy-two hours) stays draft_needs_source: NICE 1.2.1.8 asks for urgent same-day assessment, the K2 rule has only tense now (resolving to the reference day sends the patient to 112 for a pain one or two days old, the over-alarm files/04 §8.1 rule 4 warns against), resolving to an earlier day fires nothing (under-triage against NICE), and the Tense enum has no seventy-two-hour member. While it is draft the band is never left Unknown: it resolves to the reference day, accepting over-triage as the fail-closed direction inside D18's simulated scope, and the record labels the resolution as the while-draft one. An answer that fits no choice, or 'bilmiyorum', is recorded UNCLEAR and resolved to the more acute reading, the reference day. The council never fills an anchor and a document never feeds one."
status: active
scope: simulated_patient_stress_testing
author_role: "emergency medicine and internal medicine/cardiology physician (agent)"
inference_disclosure: "Resolving an ambiguous or unknown anchor to the more acute band is a design rule from the 2 Oct 2026 physician pre-review (design change 4), which is not a committed repository file; NICE CG84's 'if in doubt' sentence is cited as the nearest NICE statement of the same direction, from a guideline on gastroenteritis in children under five, not as a chest-pain source. Mapping each band onto calendar days (reference_day for both twelve-hour bands, reference day minus three for 'more than seventy-two hours') and resolving the twelve-to-seventy-two-hour band to the reference day while it is draft are this author's operationalisation; the latter accepts over-triage only within D18's simulated scope."
spec_basis:
  - file: packages/protocols/src/protocols/triage/context.py
    section: "temporal_within docstring"
    quote: "``today``   — the reference day itself"
    supports: "engine_calendar"
  - file: files/04_CLINICAL_PROTOCOLS.md
    section: "§8.1 rule 4"
    quote: "is a false alarm clinicians learn to ignore."
    supports: "choices (twelve-to-seventy-two-hour band): why the final resolution stays draft"
  - file: CLAUDE.md
    section: "How we work"
    quote: "build the mechanism, wire the gate, make it fail closed, leave the content empty."
    supports: "choices (twelve-to-seventy-two-hour band): while_draft"
