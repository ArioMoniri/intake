value:
  anchors:
    - rule: rf.chest_pain_cardiac_features
      tense: now
      anchor: chest_pain.onset_at
      anchor_semantics: "most recent episode, or ongoing now"
      status: active
      sources: [NICE-CG95]
    - rule: rf.chest_pain_no_cardiac_history
      tense: today
      anchor: chest_pain.onset_at
      anchor_semantics: "most recent episode, or ongoing now"
      status: active
      sources: [NICE-CG95]
    - rule: rf.paediatric_airway_obstruction
      tense: now
      anchor: airway.onset_at
      anchor_question: "TODO: the airway anchor question and how it resolves requires clinical sign-off"
      status: draft_needs_source
      source_gap: "The rule itself is draft_needs_source (no paediatric source for its trigger set) and needs a paediatrician's signature (HB-C1); no anchor can be resolved for a rule that cannot be served."
    - rule: rf.crisis_disclosure_signposting
      tense: now
      anchor: transcript.utterance_at
      anchor_question: "TODO: whether a system utterance timestamp is an acceptable anchor for the crisis rule requires clinical sign-off"
      status: draft_needs_source
      source_gap: "The rule is draft_needs_source and blocked on the files/04 §4.2 escalation policy (HB-C8). Its anchor is a system timestamp of the utterance, not a patient answer, so the closed choice below does not apply to it."
  anchor_question_tr: "Göğsünüzdeki bu ağrı ya da rahatsızlık en son ne zaman oldu?"
  engine_calendar: "temporal_within compares calendar days against reference_time.date(): now and today are both the reference day; within_7d and within_30d count days back; an undated or future anchor reads Unknown"
  choices:
    - choice_tr: "şu anda var"
      nice_band: "current chest pain (CG95 1.2.1.7, emergency referral)"
      resolves_to: reference_day
      status: active
      sources: [NICE-CG95]
    - choice_tr: "son on iki saat içinde"
      nice_band: "pain free now, chest pain in the last twelve hours, ECG not available (CG95 1.2.1.7, emergency referral)"
      resolves_to: reference_day
      note: "deliberately the reference day even when the episode fell on the previous calendar day, so the twelve-hour band is not split at midnight; the record keeps the patient's choice beside the resolved date"
      status: active
      sources: [NICE-CG95]
    - choice_tr: "on iki saatten önce ama son üç gün içinde"
      nice_band: "last episode twelve to seventy-two hours ago (CG95 1.2.1.8, urgent same-day assessment)"
      resolves_to: "TODO: resolving a last episode twelve to seventy-two hours old onto the calendar-day tenses requires clinical sign-off"
      while_draft:
        resolves_to: reference_day
        basis: "ambiguity: more_acute; over-triage is the fail-closed direction within D18's simulated scope, and Unknown would leave the band silent"
        record_label: "while_draft_resolution"
        never_unknown: true
      status: draft_needs_source
      source_gap: "NICE CG95 1.2.1.8 gives this band urgent same-day assessment. rf.chest_pain_cardiac_features has only tense now, so a final resolution to the reference day routes the patient to EMERGENCY_NOW (the over-alarm files/04 §8.1 rule 4 warns against), and resolving to any earlier day fires neither active rule (under-triage against NICE). Closing it needs a same-day cardiac-features arm and a tense member for seventy-two hours, both rule and DSL changes for the signing clinician."
      sources: [NICE-CG95]
    - choice_tr: "üç günden daha önce"
      nice_band: "last episode more than seventy-two hours ago (CG95 1.2.1.10, detailed clinical assessment; referral by clinical judgement)"
      resolves_to: reference_day_minus_3
      note: "the most acute calendar day consistent with 'more than seventy-two hours'; neither active rule fires, and a draft within_7d rule would still read True"
      status: active
      sources: [NICE-CG95]
  unresolved_answer:
    applies_to: "an answer matching no choice, or 'bilmiyorum'"
    answer_state: UNCLEAR
    resolves_to: reference_day
    basis: "more-acute rule of the 2 Oct 2026 physician pre-review (inference_disclosure); NICE CG84's 'if in doubt' direction, cited with its paediatric-scope caveat"
    status: active
    sources: [NICE-CG84, NICE-CG95]
  ambiguity: more_acute
  document_may_feed_anchor: false
  council_may_fill: false
