value:
  anchors:
    - rule: rf.chest_pain_cardiac_features
      tense: now
      anchor: chest_pain.onset_at
      anchor_semantics: "most recent episode, or ongoing now"
      status: active
      sources: [NICE-CG95]
    - rule: rf.chest_pain_no_cardiac_history
      tense: today
      anchor: chest_pain.onset_at
      anchor_semantics: "most recent episode, or ongoing now"
      status: active
      sources: [NICE-CG95]
    - rule: rf.paediatric_airway_obstruction
      tense: now
      anchor: airway.onset_at
      anchor_question: "TODO: the airway anchor question and how it resolves requires clinical sign-off"
      status: draft_needs_source
      source_gap: "The rule itself is draft_needs_source (no paediatric source for its trigger set) and needs a paediatrician's signature (HB-C1); no anchor can be resolved for a rule that cannot be served."
    - rule: rf.crisis_disclosure_signposting
      tense: now
      anchor: transcript.utterance_at
      anchor_question: "TODO: whether a system utterance timestamp is an acceptable anchor for the crisis rule requires clinical sign-off"
      status: draft_needs_source
      source_gap: "The rule is draft_needs_source and blocked on the files/04 §4.2 escalation policy (HB-C8). Its anchor is a system timestamp of the utterance, not a patient answer, so the closed choice below does not apply to it."
  anchor_question_tr: "Göğsünüzdeki bu ağrı ya da rahatsızlık en son ne zaman oldu?"
  engine_calendar: "temporal_within compares calendar days against reference_time.date(): now and today are both the reference day; within_7d and within_30d count days back; an undated or future anchor reads Unknown"
  choices:
    - choice_tr: "şu anda var"
      nice_band: "current chest pain (CG95 1.2.1.7, emergency referral)"
      resolves_to: reference_day
      status: active
      sources: [NICE-CG95]
    - choice_tr: "son on iki saat içinde"
      nice_band: "pain free now, chest pain in the last twelve hours, ECG not available (CG95 1.2.1.7, emergency referral)"
      resolves_to: reference_day
      note: "deliberately the reference day even when the episode fell on the previous calendar day, so the twelve-hour band is not split at midnight; the record keeps the patient's choice beside the resolved date"
      status: active
      sources: [NICE-CG95]
    - choice_tr: "on iki saatten önce ama son üç gün içinde"
      nice_band: "last episode twelve to seventy-two hours ago (CG95 1.2.1.8, urgent same-day assessment)"
      resolves_to: "TODO: resolving a last episode twelve to seventy-two hours old onto the calendar-day tenses requires clinical sign-off"
      while_draft:
        resolves_to: reference_day
        basis: "ambiguity: more_acute; over-triage is the fail-closed direction within D18's simulated scope, and Unknown would leave the band silent"
        record_label: "while_draft_resolution"
        never_unknown: true
      status: draft_needs_source
      source_gap: "NICE CG95 1.2.1.8 gives this band urgent same-day assessment. rf.chest_pain_cardiac_features has only tense now, so a final resolution to the reference day routes the patient to EMERGENCY_NOW (the over-alarm files/04 §8.1 rule 4 warns against), and resolving to any earlier day fires neither active rule (under-triage against NICE). Closing it needs a same-day cardiac-features arm and a tense member for seventy-two hours, both rule and DSL changes for the signing clinician. Round 3 (INT-519 item 6): the route is sourced (urgent same-day assessment is the product's SAME_DAY_ACIL), but the arm's EK-4 level and register are not: EK-4 grades chest pain at the acil door by its character ('Kardiyak ağrıya benzer göğüs ağrısı'), with no time since the last episode, and no committed Turkish or NICE source sets a level for a pain-free patient whose last episode was twelve to seventy-two hours ago. That choice belongs to the signing clinician (HB-C1), with goldens."
      # Round 3 (INT-519 item 6): what closing the band needs, so the open literal
      # above says exactly what is missing rather than only that something is.
      final_route: SAME_DAY_ACIL
      final_resolution_needs:
        - "a Tense member covering seventy-two hours; the nearest past today is within_7d (a DSL change)"
        - "a cardiac-features arm for this band with route SAME_DAY_ACIL (NICE CG95 1.2.1.8), as a new base.life_threat rule with goldens and a near-miss control at both band edges (invariant 7; make safety; CODEOWNER)"
        - "that arm's EK-4 level and register, which no committed source fixes (EK-4 has no time axis): the signing clinician's choice (HB-C1)"
        - "a representation in which the now (K2) and today (K1) arms do not both read this band as the reference day: while the rules read one calendar day, any day either fires K2 or neither cardiac arm, and moving off the reference day also stops K1 for a non-cardiac pain in the band; so the band reaches the rules as a band, or K2's window is set in hours"
      sources: [NICE-CG95, TR-EK4-2022]
    - choice_tr: "üç günden daha önce"
      nice_band: "last episode more than seventy-two hours ago (CG95 1.2.1.10, detailed clinical assessment; referral by clinical judgement)"
      resolves_to: reference_day_minus_3
      note: "the most acute calendar day consistent with 'more than seventy-two hours'; neither active rule fires, and a draft within_7d rule would still read True"
      status: active
      sources: [NICE-CG95]
  unresolved_answer:
    # Round 3 (INT-519 items 9 and 11): the first line is rounds 1 and 2; the rest
    # name each case it already covered or now covers, by the cause the runtime
    # records (INT-540 UnclearCause).
    applies_to:
      - "an answer matching no choice, or 'bilmiyorum'"
      - "a CD-04 hedge, alone or beside a choice: resolved at once, with no follow-up (cause hedge; CD-04 round 3, INT-519 items 5 and 8)"
      - "an answer that binds no choice and that no CD-04 entry reads, a plain 'yok' or 'olmadı' among them, after its one follow-up (cause no_choice; INT-519 item 9); it never retracts chest_pain.present"
      - "the anchor question asked and never answered when the session closes (cause session_closed; INT-519 item 11)"
    causes: [hedge, no_choice, session_closed]
    record_label_by_cause:
      hedge: hedge
      no_choice: no_choice
      session_closed: session_closed
    answer_state: UNCLEAR
    resolves_to: reference_day
    basis: "more-acute rule of the 2 Oct 2026 physician pre-review (inference_disclosure); NICE CG84's 'if in doubt' direction, cited with its paediatric-scope caveat"
    status: active
    sources: [NICE-CG84, NICE-CG95]
  # Round 3 (INT-519 item 10): the anchor the session never reached.
  never_asked_at_close:
    applies_to: "an active anchor still NOT_ASKED when the session closes (end, abandonment or time-out) while chest_pain.present reads true, qualified or not"
    answer_state: NOT_ASKED
    rendered: "Sorulmadı"
    evaluated_as: reference_day
    evaluated_when: "once, at close, by the rules engine only (invariant 1); nothing is bound to the slot"
    record_label: never_asked_at_close
    inbox_item:
      decision_ref: CD-08
      kind: chest_pain_arms_unresolved
      pinned_to_note: true
      never_dropped: true
    not_applied_when: "chest_pain.present is absent, not asked or UNCLEAR: no chest-pain rule can fire, and CD-04's own trigger covers an UNCLEAR present"
    patient_delivery: "a RED that fires at close takes the existing RED path (INT-540 close_session); notify_clinic is always for both chest-pain rules; this decision changes no RED delivery"
    basis: "NICE CG95 1.2.1.1 asks first whether the pain is current, and an unasked anchor cannot exclude it; the more-acute rule of unresolved_answer, applied to the case of least information (inference_disclosure)"
    status: active
    sources: [NICE-CG95, NICE-CG84]
  # Round 3 (INT-519 item 7): an answer that fits two bands.
  straddle:
    applies_to: "an answer that fits two or more of the authored bands and binds none, for example 'iki üç gün önce' across the seventy-two-hour edge"
    answer_state: UNCLEAR
    follow_up_cause: no_choice
    tie_break: more_acute
    order: "by NICE CG95 referral urgency: 'şu anda var' and 'son on iki saat içinde' (1.2.1.7, emergency), then 'on iki saatten önce ama son üç gün içinde' (1.2.1.8, urgent same-day), then 'üç günden daha önce' (1.2.1.10, clinical judgement)"
    resolves_to: "the day of the more acute of the bands the answer still fits after its one follow-up"
    fallback: unresolved_answer
    fallback_when: "the build cannot tell which bands the answer fits"
    record_label: straddle_more_acute
    note: "while the twelve-to-seventy-two-hour band resolves to the reference day, every straddle resolves to the reference day, the same day as the fallback; the tie-break first changes an outcome when that band's final resolution lands"
    status: active
    sources: [NICE-CG95, NICE-CG84]
  ambiguity: more_acute
  document_may_feed_anchor: false
  council_may_fill: false
  # Round 3: what changed, item by item. The verifier's round-3 verdict is pending
  # until the independent verifier records it in `verifier`.
  amendments:
    - round: 3
      date: 2026-10-16
      issue: "INT-519 (GitHub #885)"
      origin: "INT-522 (#888) and INT-540 (#913) clinical reviews; the reviewers' recommendations were inputs, not decisions"
      items:
        - item: 5
          decision: "the anchor's follow-up bound is CD-04's tense_anchor_follow_up_tr_asks: none for a hedge, one for a no-choice answer; unresolved_answer then resolves it"
          keys: [unresolved_answer.applies_to, unresolved_answer.causes]
          sources: [NICE-CG95, NICE-CG84]
          status: active
        - item: 6
          decision: "not decided: the band's final resolution stays the invariant-17 literal under draft_needs_source, and its while-draft resolution (the reference day, labelled while_draft_resolution) is unchanged. Recorded now: the route it needs (SAME_DAY_ACIL, NICE CG95 1.2.1.8) and exactly what else is missing (final_resolution_needs), chiefly the arm's EK-4 level and register, which no committed source fixes."
          keys: [choices.final_route, choices.final_resolution_needs]
          safety_direction: "unchanged while draft: over-triage (K2 can fire for this band), accepted only within D18's simulated scope"
          sources: [NICE-CG95, TR-EK4-2022]
          status: draft_needs_source
          source_gap: "the EK-4 level and register of a same-day cardiac arm for a pain-free patient whose last episode was twelve to seventy-two hours ago: EK-4 has no time axis and no committed NICE, ESC or Turkish source sets one; it is the signing clinician's (HB-C1), with the rule and DSL changes in final_resolution_needs"
        - item: 7
          decision: "an answer that fits two bands takes the no-choice follow-up and, if it still fits two, resolves to the more acute of them; where the build cannot tell which bands it fits, unresolved_answer applies (straddle)"
          keys: [straddle]
          safety_direction: "never less acute than any band the answer fits, and never less acute than the fallback the build has today"
          sources: [NICE-CG95, NICE-CG84]
          status: active
        - item: 9
          decision: "a plain 'yok' or 'olmadı' to the onset question is UNCLEAR with cause no_choice under unresolved_answer, never ASKED_ABSENT, and never retracts chest_pain.present (CD-04 round 3)"
          keys: [unresolved_answer.applies_to]
          sources: [NICE-CG95]
          status: active
        - item: 10
          decision: "an anchor never asked when the session closes, while chest_pain.present reads true, stays NOT_ASKED, is evaluated once at close as the reference day (label never_asked_at_close) and raises a CD-08 chest_pain_arms_unresolved inbox item (never_asked_at_close)"
          keys: [never_asked_at_close]
          safety_direction: "more acute than today, where the anchor stays Unknown and neither chest-pain rule can fire; over-triages an affirmed pain that was long past, and the qualifier travels with the label"
          sources: [NICE-CG95, NICE-CG84]
          status: active
        - item: 11
          decision: "an anchor question asked and never answered when the session closes is named in unresolved_answer.applies_to and recorded with the label session_closed; CD-04's anchor_trigger raises the inbox item at close"
          keys: [unresolved_answer.applies_to, unresolved_answer.record_label_by_cause]
          sources: [NICE-CG95, NICE-CG84]
          status: active
verifier:
  verdict: pending
  role: "independent clinical verifier (agent; EM/IM/paediatrics)"
  verified_on: 2026-10-03
  notes: "Round 1 (2026-10-03) agree_with_changes; round 2 (2026-10-03) agree. Every quote re-checked against the live source; the verifier saw only the committed output and the sources, never the authors' reasoning. Round 3 (INT-519 amendment, items 5, 6, 7, 9, 10 and 11, 16 Oct 2026): pending the independent verifier. Scope D18: simulated-patient stress testing only; a licensed physician's review is required before any real patient."
