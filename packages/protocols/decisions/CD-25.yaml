fail_closed_while_draft: "Nothing in this decision is draft. Before any real patient, the physician of record rules on HB-C12b; until then the rule is served only on the synthetic host under D23, and every real tenant keeps the HB-C1 interlock."
verifier:
  verdict: agree
  role: "independent clinical verifier (agent; EM/IM)"
  verified_on: 2026-10-03
  notes: "Round 1 agree. All six quotes verbatim in TR-EK4-2022.txt, each supporting the sentence it is attached to; neither line names a condition or carries diagnosis, treatment or prognosis language; B1, no 'triyaj'; the ON_SITE line carries no 112 and no ambulance line; no new number or advice; HB-C12b stays open. The verifier saw only the committed decision, the snapshot, CD-24, the rule and HB-C12b, never the author's reasoning. Scope D18: simulated-patient stress testing only; a licensed physician's review is required before any real patient. A second verification is run separately by the coordinator."
