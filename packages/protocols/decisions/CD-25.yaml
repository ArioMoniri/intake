kind: clinical_decision
id: CD-25
title: "rf.chest_pain_cardiac_features why_tr (REMOTE and ON_SITE): the action and the service, never the patient's condition"
question: "The two why_tr lines of rf.chest_pain_cardiac_features say 'Anlattığınız belirtiler kalple ilgili olabilir', which tells the patient something about their own condition (HB-C12b; CLAUDE.md invariant 2; the pack's own rule that why_tr is never a diagnosis). The REMOTE line also uses 'triyaj', an unexplained term above B1. What do the REMOTE and ON_SITE why_tr lines say instead, for simulated-patient stress testing on the synthetic host, so that they describe the action and the service without characterising the patient's condition?"
decision: "Both lines are replaced by the service-fact why lines CD-24 already decided and had independently verified for the generic RED, sentence for sentence, because they hold for any KIRMIZI rule of either EK-4 category and name no condition. REMOTE: 'Verilen cevaplara göre beklemeden değerlendirme gerekiyor. 112 ambulansıyla getirilen hastalar, acil serviste ayrıca öncelik sırası için bekletilmez.' The first sentence states the KIRMIZI outcome as a need for assessment without waiting (EK-4 Kategori 2, the category this rule's level is, takes the patient for assessment and treatment within ten minutes). The second keeps the old line's MADDE 8(5) service fact and replaces 'triyaj' with the Tebliğ's own definition of it in MADDE 4(1)(p), 'öncelik sırası'. ON_SITE: 'Verilen cevaplara göre beklemeden değerlendirme gerekiyor. Acil serviste hastaların önceliği girişte belirlenir ve en öncelikli hastalar bekletilmeden içeri alınır.' It keeps the old line's door-triage service fact (MADDE 8(3): registration and triage together at the walk-in entrance) and does not reuse the MADDE 8(5) ambulance line, because the patient is not travelling. 'durumunuz' (your condition) and 'Bu belirtilerde' (with these symptoms) go with the condition sentence. Nothing else in the rule changes: the gate, level, route, register, action_tr, do_nots_tr and the UNKNOWN question are untouched. HB-C12b stays open: this is an agent decision for simulated patients (D18), and the physician of record rules on the wording before any real patient."
status: active
scope: simulated_patient_stress_testing
scope_note: "Owner decision D18 (2 Oct 2026): agent-only sign-off, for simulated-patient stress testing only. A licensed physician's review is required before any real patient. HB-C12b stays open for the physician of record."
question_origin: "INT-465 (PR #796) clinical review, blocker 1: files/protocols/base.life_threat.yaml rf.chest_pain_cardiac_features action.REMOTE.why_tr and action.ON_SITE.why_tr; HUMAN_BLOCKERS HB-C12b."
author_role: "emergency medicine physician (agent)"
inference_disclosure: "No new sentence is authored here. Both lines are CD-24's verified why lines, reused because they are statements about the service that hold for any KIRMIZI rule. Reading 'beklemeden değerlendirme' as fitting a Kategori 2 rule (assessment within ten minutes) is CD-24's own reading of EK-4, carried over; this author adds no time figure, because a numeral in a RED line would also have to be expanded for speech (invariant 22) and the ten minutes is a service target, not an instruction to the patient."
