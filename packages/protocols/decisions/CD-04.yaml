kind: clinical_decision
id: CD-04
title: "Turkish hedge to answer-state table"
question: "When the answer to a scripted red-flag question is hedged, qualified, double-negated or 'bilmiyorum', which answer state does it take, per rule, given that it may never become ASKED_ABSENT?"
decision: "A hedged or qualified answer to a scripted rule question is UNCLEAR or PRESENT_QUALIFIED, never ASKED_ABSENT; only a plain negative ('hayır', 'yok', 'olmadı') to the scripted question itself is ASKED_ABSENT, and the matcher tests every entry below before it tests a plain negative, so 'yok gibi' never reads as 'yok'. PRESENT_QUALIFIED is not an eighth answer state: it is ASKED_PRESENT carrying the qualifier as an annotation, so it evaluates as present for the rule and the qualifier is carried into the note. UNCLEAR reads Unknown and triggers the slot's follow_up_tr once; an UNCLEAR on any CD-01 feature slot that survives the follow-up raises a labelled CD-08 clinic-inbox item (kind chest_pain_arms_unresolved), pinned to the note and never dropped, because under three-valued logic it can leave both chest-pain arms silent. The CKM screening archetype's presence value set (Yes / No / Unknown / Unsure) is the basis for keeping 'bilmiyorum' and every hedge out of No. For chest pain the NICE CG95 definition (pain or discomfort) makes a qualified pain or a discomfort present, and NICE CG95 1.2.1.1 and 1.2.1.7 make a pain that has passed still clinically present, to be dated by the anchor question (CD-05). The mapping is per rule and per slot: 'biraz' affirms breathlessness, which NICE names without a qualifier. On associated.diaphoresis NICE names marked sweating, so 'biraz' does not match the guideline feature, yet it is still PRESENT_QUALIFIED (qualifier mild_not_marked): as UNCLEAR it would leave both arms silent when no other feature is present, while a plain 'hayır' fires SARI_K1, so admitting a little sweating would be treated as less acute than denying it. That monotonicity argument is this author's (inference_disclosure), not NICE's. Two of the three files/04 §8.2 adversarial strings concern syncope and bleeding probes that no active rule reads; they take the UNCLEAR floor (which still arms the probe, CD-03) and whether they should be PRESENT_QUALIFIED stays draft_needs_source. An unmatched hedge is UNCLEAR."
status: active
scope: simulated_patient_stress_testing
author_role: "emergency medicine and internal medicine/cardiology physician (agent)"
inference_disclosure: "The Turkish surface readings (double negation, hedges, 'biraz') are this author's linguistic operationalisation. Mapping 'biraz terledim' to PRESENT_QUALIFIED although NICE names marked sweating is the author's monotonicity choice: an answer that admits some of a feature must never evaluate as less acute than a plain denial of it. Raising a clinic-inbox item for an unresolved UNCLEAR is a fail-closed design choice, not a clinical source."
spec_basis:
  - file: files/13_QUESTION_FLOW.md
    section: "§9.3 Seven answer states"
    quote: "`NOT_ASKED` · `ASKED_PENDING` (ask-ahead bookkeeping) · `ASKED_PRESENT`"
    supports: "present_qualified_is"
  - file: files/protocols/base.life_threat.yaml
    section: "RULE SCHEMA, gate"
    quote: "`T ∨ U = T`, everything else with U is U."
    supports: "unresolved_after_follow_up (an UNCLEAR feature can leave both arms Unknown)"
  - file: CLAUDE.md
    section: "How we work"
    quote: "build the mechanism, wire the gate, make it fail closed, leave the content empty."
    supports: "unresolved_after_follow_up"
