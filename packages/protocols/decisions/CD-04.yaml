value:
  plain_negative_to_scripted_question: ASKED_ABSENT
  present_qualified_is: "ASKED_PRESENT carrying the qualifier as an annotation; not an eighth AnswerState"
  unresolved_after_follow_up:
    applies_to: [chest_pain.present, chest_pain.character, chest_pain.radiation, chest_pain.onset_at, associated.diaphoresis, associated.dyspnoea, trauma.recent]
    trigger: "the slot is still UNCLEAR after its follow_up_tr has been asked once"
    action: clinic_inbox_item
    decision_ref: CD-08
    kind: chest_pain_arms_unresolved
    never_dropped: true
    pinned_to_note: true
    note: "for chest_pain.onset_at the anchor is also resolved by CD-05's more-acute rule; the inbox item still records that the patient could not date the episode"
    # Round 3 (INT-519 item 5): with no follow-up for a hedge on the anchor, the
    # inbox item would otherwise never be raised for the commonest unresolved
    # anchor, so the anchor's trigger is the spent bound for its cause.
    anchor_trigger: "chest_pain.onset_at is still UNCLEAR once the follow-up bound for its cause (tense_anchor_follow_up_tr_asks) is spent; for a hedge the bound is zero, so the item is raised when the hedge is read, and an anchor left UNCLEAR by the session's close (CD-05 cause session_closed) raises it at close"
  match_order: "hedge entries first (longest surface first), plain negatives last"
  present_qualified_evaluates_as: present
  unclear_evaluates_as: unknown
  # The decision's "triggers the slot's follow_up_tr once", machine-readable
  # (INT-540): how many times an UNCLEAR answer's follow_up_tr is asked before
  # the slot stays UNCLEAR. A restatement, not a new value.
  unclear_follow_up_tr_asks: 1
  # Round 3 (INT-519 item 5): the bound for a CD-05 tense anchor, by the cause the
  # runtime records (INT-540 UnclearCause). hedge: an entry below reads UNCLEAR on
  # the anchor, alone or beside a choice. no_choice: no authored choice bound and
  # no entry read (a narrative, a plain 'yok' or 'olmadı', an unmatched hedge, an
  # answer fitting two bands). Every other scripted slot keeps
  # unclear_follow_up_tr_asks.
  tense_anchor_follow_up_tr_asks:
    hedge: 0
    no_choice: 1
  # Round 3 (INT-519 item 9): plain_negative_to_scripted_question covers a
  # yes-or-no scripted question. The onset question asks when, so a plain
  # negative to it fits no choice.
  plain_negative_on_tense_anchor: UNCLEAR
  plain_negative_on_tense_anchor_cause: no_choice
  plain_negative_on_tense_anchor_retracts_present: false
  # Round 3 (INT-519 item 8): a hedge beside a choice on the anchor.
  hedge_with_choice_on_tense_anchor:
    answer_state: UNCLEAR
    cause: hedge
    resolves: "at once, by CD-05 unresolved_answer"
    choice_recorded_as: hedged_choice
    choice_bound: false
  entries:
    - surface_tr: "ağrım yok değil hani"
      gloss_en: "it is not that I have no pain, you know (double negation affirms the pain)"
      answer_state: PRESENT_QUALIFIED
      qualifier: double_negation
      slots: [chest_pain.present]
      rules: [rf.chest_pain_cardiac_features, rf.chest_pain_no_cardiac_history]
      status: active
      sources: [NICE-CG95, openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
    - surface_tr: "bayılmadım ama bayılacak gibi oldum"
      gloss_en: "I did not faint, but I felt as if I would"
      answer_state: UNCLEAR
      qualifier: near_faint
      slots: ["*"]
      slot_note: "whichever syncope probe was asked; no active rule reads one today"
      rules: ["*"]
      status: draft_needs_source
      present_qualified_upgrade: "TODO: whether a near-faint answer counts as present for a syncope probe requires clinical sign-off"
      source_gap: "No retrieved current guideline states whether a reported near-faint satisfies a syncope trigger. The NICE CG109 recommendations page carries no definition of it, and the ESC syncope guideline text was not retrievable by this author. The UNCLEAR floor is sourced (CKM presence value set: Unknown and Unsure are distinct from No) and arms the probe (CD-03); the upgrade to PRESENT_QUALIFIED is not."
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
    - surface_tr: "kanama yoktu, sadece siyahtı"
      gloss_en: "there was no bleeding, it was just black (black stool reported as not-bleeding)"
      answer_state: UNCLEAR
      qualifier: black_stool_denied_as_bleeding
      slots: ["*"]
      slot_note: "whichever bleeding probe was asked; no active rule reads one today"
      rules: ["*"]
      status: draft_needs_source
      present_qualified_upgrade: "TODO: whether black stool described this way counts as present for a bleeding probe requires clinical sign-off"
      source_gap: "No retrieved current guideline snapshot defines black stool as a bleeding finding for a layperson-answerable bleeding trigger (EK-4 lists no melaena entry; the NICE CG141 recommendations page does not define it). The UNCLEAR floor is sourced (CKM presence value set) and arms the probe (CD-03); the upgrade to PRESENT_QUALIFIED is not."
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
    - surface_tr: "bilmiyorum"
      gloss_en: "I do not know"
      answer_state: UNCLEAR
      qualifier: unknown
      slots: ["*"]
      rules: ["*"]
      status: active
      note: "for a tense anchor the answer is recorded UNCLEAR and the anchor is resolved by CD-05's more-acute rule"
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
    - surface_tr: "emin değilim"
      gloss_en: "I am not sure"
      answer_state: UNCLEAR
      qualifier: unsure
      slots: ["*"]
      rules: ["*"]
      status: active
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
    - surface_tr: "sanmıyorum"
      gloss_en: "I do not think so (hedged negative)"
      answer_state: UNCLEAR
      qualifier: hedged_negative
      slots: ["*"]
      rules: ["*"]
      status: active
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
    - surface_tr: "pek sayılmaz"
      gloss_en: "not really, hardly counts (hedged negative)"
      answer_state: UNCLEAR
      qualifier: hedged_negative
      slots: ["*"]
      rules: ["*"]
      status: active
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
    - surface_tr: "yok gibi"
      gloss_en: "sort of none, as if there is none (hedged negative)"
      answer_state: UNCLEAR
      qualifier: hedged_negative
      slots: ["*"]
      rules: ["*"]
      status: active
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
    - surface_tr: "şu an yok ama vardı"
      gloss_en: "none now, but there was (resolved episode)"
      answer_state: PRESENT_QUALIFIED
      qualifier: resolved
      slots: [chest_pain.present]
      rules: [rf.chest_pain_cardiac_features, rf.chest_pain_no_cardiac_history]
      status: active
      note: "also 'geçti' (it has passed); the anchor question (CD-05) then dates the last episode"
      sources: [NICE-CG95]
    - surface_tr: "ağrı değil de bir sıkıntı var"
      gloss_en: "it is not pain, it is a discomfort / oppression"
      answer_state: PRESENT_QUALIFIED
      qualifier: discomfort_not_pain
      slots: [chest_pain.present]
      rules: [rf.chest_pain_cardiac_features, rf.chest_pain_no_cardiac_history]
      status: active
      sources: [NICE-CG95]
    - surface_tr: "arada bir oluyor"
      gloss_en: "it happens now and then (intermittent)"
      answer_state: PRESENT_QUALIFIED
      qualifier: intermittent
      slots: [chest_pain.present]
      rules: [rf.chest_pain_cardiac_features, rf.chest_pain_no_cardiac_history]
      status: active
      sources: [NICE-CG95]
    - surface_tr: "eskiden vardı"
      gloss_en: "I used to have it (past episode)"
      answer_state: PRESENT_QUALIFIED
      qualifier: past
      slots: [chest_pain.present]
      rules: [rf.chest_pain_cardiac_features, rf.chest_pain_no_cardiac_history]
      status: active
      note: "present for the gate; the anchor question (CD-05) decides whether any tense window is met"
      sources: [NICE-CG95]
    - surface_tr: "biraz"
      gloss_en: "a little (as in 'biraz nefesim daralıyor')"
      answer_state: PRESENT_QUALIFIED
      qualifier: mild
      slots: [associated.dyspnoea]
      rules: [rf.chest_pain_cardiac_features, rf.chest_pain_no_cardiac_history]
      status: active
      note: "NICE names breathlessness without a severity qualifier; consistent with golden LT-02-N, which expects 'biraz nefesim daralıyor' to land in the K2 arm"
      sources: [NICE-CG95]
    - surface_tr: "biraz"
      gloss_en: "a little (as in 'biraz terledim')"
      answer_state: PRESENT_QUALIFIED
      qualifier: mild_not_marked
      slots: [associated.diaphoresis]
      rules: [rf.chest_pain_cardiac_features, rf.chest_pain_no_cardiac_history]
      status: active
      note: "NICE names marked sweating, so 'a little' is below the guideline feature; it is still PRESENT_QUALIFIED so that admitting some sweating never evaluates as less acute than 'hayır' (which fires SARI_K1). The qualifier mild_not_marked is carried into the note (inference_disclosure)."
      sources: [NICE-CG95]
  unmatched_hedge: UNCLEAR
  # Round 4 (INT-554 item D2): the trigger's slots at the session's close. The
  # tense anchor is CD-05's (never_asked_at_close, session_closed) and
  # unresolved_after_follow_up.anchor_trigger's; these are the other six.
  unresolved_at_close:
    slots: [chest_pain.present, chest_pain.character, chest_pain.radiation, associated.diaphoresis, associated.dyspnoea, trauma.recent]
    asked_unanswered:
      state_at_close: ASKED_PENDING
      trigger: "the slot was asked (its ask_tr or its follow_up_tr spoken) and holds no answer when the session closes, whether or not its follow_up_tr has been asked"
      records: UNCLEAR
      label: session_closed
    unclear_bound_unspent:
      state_at_close: UNCLEAR
      trigger: "the slot is already UNCLEAR when the session closes and its follow_up_tr has not yet been asked: the close spends the bound"
      records: UNCLEAR
      label: session_closed
    never_asked_gate_open:
      slots: [chest_pain.character, chest_pain.radiation, associated.diaphoresis, associated.dyspnoea, trauma.recent]
      gate: "chest_pain.present == true"
      state_at_close: NOT_ASKED
      trigger: "the slot's gate reads TRUE and the slot is still NOT_ASKED when the session closes (end, abandonment or time-out)"
      records: NOT_ASKED
      rendered: "Sorulmadı"
      label: never_asked_at_close
    not_reached_by_this_decision: "chest_pain.present never asked at close: it has no gate, and a session that ends before the screen gave no answer about chest pain; a proxy session's skipped screen is CD-01's item"
    action: clinic_inbox_item
    kind: chest_pain_arms_unresolved
    decision_ref: CD-08
    once_per_session: true
    pinned_to_note: true
    never_dropped: true
    evaluates_as: unknown
    changes_triage: false
    sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1, NICE-CG95]
    status: active
  # Round 4 (INT-554 item D6): which slots the decision-wide "once" governs.
  follow_up_bound_scope:
    once_slots: [chest_pain.present, chest_pain.character, chest_pain.radiation, associated.diaphoresis, associated.dyspnoea, trauma.recent]
    asks: unclear_follow_up_tr_asks
    tense_anchors_read: tense_anchor_follow_up_tr_asks
    outside_this_decision: "a scripted slot no served red-flag rule reads keeps files/13 §11.1's bound; this decision does not reach it"
    # Round 4 author revision (INT-554, after the verifier's D6 finding): what the
    # once counts, and what it never takes from.
    once_counts: follow_up_tr_after_unclear
    once_never_counts: [council_reask_positive, council_confirm_back]
