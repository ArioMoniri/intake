# or served. The Turkish of each line is byte-equal to its catalogue key.
kind: clinical_decision
id: CD-23
title: 'INT-414 delivery lines: topic transitions and closing (rows 33-38, 41-48)'
question: INT-414 (#726) adds conversational delivery lines around each question. Do the topic transitions
  (allergies, medicines, health history, daily life, measurements, wrap-up) and the closing lines pass
  PolicyGuard (no diagnosis, treatment, prognosis, reassurance or minimising), stay B1 plain Turkish in
  the siz register, ask nothing, carry no numeral, and fit the moment they are said?
decision: All fourteen pass unchanged. Each topic line names the coming section in everyday words ('sağlık
  geçmişi', 'günlük yaşam', not 'özgeçmiş' or 'sosyal öykü') and asks nothing. The closing lines thank
  the patient and say nothing about where the answers go or what happens next. Each line below is its
  own entry with its six checks, the author's verdict and the verifier's verdict; the Turkish is byte-equal
  to the catalogue key it names.
