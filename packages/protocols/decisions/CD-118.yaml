kind: clinical_decision
id: CD-118
title: 'rf.weight_loss_unintentional: more than five per cent in six months, aged sixty and over (NICE
  NG12 1.13.2)'
question: Which current source states the weight-loss threshold, window and urgency?
decision: 'Write rf.weight_loss_unintentional as SARI_K2 / EXPEDITE, notify always, on two slots: weight
  loss without trying of more than five per cent in six months, and, after a yes, aged sixty or over.
  NICE NG12 1.13.2 (amended April 2026) states all three values and asks for urgent investigation or a
  suspected cancer or non-specific symptoms pathway referral. Level: EK-4 Sarı Kategori 2''s moderate
  and prolonged symptoms with potential seriousness, the pack''s mapping of an outpatient urgency onto
  the five-level scale. The anchor is the complaint''s onset date, the dated slot every session asks;
  the window is in the probe. Age is asked as a yes or no on NG12''s bound, not as free numeric entry
  (invariant 22).'
