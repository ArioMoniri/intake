kind: clinical_decision
id: CD-06
title: "Staleness windows per document class"
question: "For each document class (lab result, imaging report, discharge summary, medication list or prescription, ECG, vaccination record, pathology report), how old may an item be and still be eligible to inform a slot, and is an undated item ever eligible?"
decision: "No retrieved current guideline states a recency window for any of the seven classes as a criterion for using a prior document, so every window stays draft_needs_source and no number is supplied. Until a window is signed, a document of that class can only arm a probe and be shown to the clinician with its date (CD-02, CD-03); it never fills a slot. One part is decided: an undated item is never slot-eligible, because a value whose time is unknown cannot be placed against a rule's tense window (the engine reads an undated anchor as Unknown) and NICE CG95 makes the time since the event part of interpreting a result. For the ECG class one boundary is also recorded: NICE CG95's ECG criterion refers to the resting 12-lead ECG of the current assessment, taken as soon as possible, so a stored ECG document can never stand in for it, whatever window is later signed."
status: draft_needs_source
scope: simulated_patient_stress_testing
author_role: "emergency medicine and internal medicine/cardiology physician (agent)"
source_gap: "None of the retrieved sources (NICE CG95, NICE NG5, EK-4, the two CKM archetypes) states how old a lab result, imaging report, discharge summary, medication list, ECG, vaccination record or pathology report may be when reused at a later encounter. NICE NG5 1.3.3 sets a time to carry out medicines reconciliation after discharge, which is a task deadline, not a staleness window, and is deliberately not used as one."
sources:
  - kind: guideline
    guideline_id: NICE-CG95
    title: "Recent-onset chest pain of suspected cardiac origin: assessment and diagnosis"
    version_or_date: "CG95, published 24 March 2010, last updated 30 November 2016; minor changes January 2020, August 2020, November 2020 and October 2022"
    url: "https://www.nice.org.uk/guidance/cg95/chapter/Recommendations"
    retrieved_on: 2026-10-02
    quote: "take into account the length of time since the suspected ACS when interpreting the troponin level."
    snapshot: packages/protocols/sources/NICE-CG95.txt
  - kind: guideline
    guideline_id: NICE-CG95
    title: "Recent-onset chest pain of suspected cardiac origin: assessment and diagnosis"
    version_or_date: "CG95, published 24 March 2010, last updated 30 November 2016; minor changes January 2020, August 2020, November 2020 and October 2022"
    url: "https://www.nice.org.uk/guidance/cg95/chapter/Recommendations"
    retrieved_on: 2026-10-02
    quote: "Take the ECG as soon as possible, but do not delay transfer to hospital."
    snapshot: packages/protocols/sources/NICE-CG95.txt
  - kind: guideline
    guideline_id: NICE-NG5
    title: "Medicines optimisation: the safe and effective use of medicines to enable the best possible outcomes"
    version_or_date: "NG5, published 04 March 2015; minor changes September 2019, June 2021 and October 2021"
    url: "https://www.nice.org.uk/guidance/ng5/chapter/Recommendations"
    retrieved_on: 2026-10-03
    quote: "This should happen as soon as is practically possible, before a prescription or new supply of medicines is issued and within 1 week of the GP practice receiving the information."
    snapshot: packages/protocols/sources/NICE-NG5.txt
