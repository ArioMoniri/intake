# INT-448 clinical decision CD-103: the sign-off packet items (#642, packet commit
# 151cf34f) that come from docs/evidence/verification/cluster-wave-b.md. Agent-authored
# under owner decision D18 (2 Oct 2026). It covers simulated-patient stress testing only,
# and a licensed physician's review is required before any real patient.
# Every source quote below appears verbatim in the named snapshot, and every spec_basis
# quote appears verbatim in the named committed file. This is not a pack: the lead applies
# the item changes to the review-queue proposals. No triage level, route, register,
# location or red-flag rule is created, relaxed or removed here.
kind: clinical_decision
id: CD-103
title: "#642 packet items: cluster wave B verification"
question: >-
  For each open item that the #642 sign-off packets route from the cluster wave B
  verification (child health, mental health, dental, and allied and reports clusters),
  what is the clinical decision, on what current source, and which part stays with the
  owner?
decision: >-
  Fifteen items. Accepted (3): the chest-indrawing ask "kaburgalarının altı ya da arası"
  names the WHO lower chest wall sign and adds intercostal indrawing; the non-blanching
  rash item stays ungated; the vaccination item stays boolean, because "bilmiyorum" is
  recorded as UNCLEAR (CD-04, CKM Unknown). Changed (2): hydration polarity is CD-10's
  true_is_concern, and the cluster keeps both feeding constructs because their thresholds
  differ: feeding or drinking less than usual (az_beslenme, CD-100 T9; NG143's poor
  feeding, kept and not merged) and, as a separate ungated item beside it, the IMCI
  general danger sign of inability to drink or breastfeed (new id icemez_ememez);
  beslenme_sivi_alimi and emebiliyor_icebiliyor retire into these two, and neonatoloji's
  infant item takes az_beslenme with its own text;
  the child fever ask becomes "oldu mu" with a recency frame, and its duration follow-up
  no longer presumes an ongoing fever. Rejected (2): the persecutory-ideation item and the
  risk-to-others item stay held and are not asked before the visit, because a pre-visit
  yes/no cannot do what NICE puts with trained staff in private (PH50) or in a verified,
  multidisciplinary risk assessment (NG10, CG115); the category questions go to the
  owner. Eight items are owner questions (guardian answers to base items, the psychosis
  item's category, the dental airway posture and two pedodonti items, the forensic report
  scope, the base HPI gate, and carer answers in Evde Sağlık).
status: active
scope: simulated_patient_stress_testing
scope_note: >-
  Owner decision D18 (2 Oct 2026): agent-only sign-off, for simulated-patient stress
  testing only. A licensed physician's review is required before any real patient. D18
  does not reach the owner and base-owner parts recorded under owner_part.
question_origin: >-
  INT-448 (GitHub #759): items of the #642 sign-off packets (docs/signoff/*.md at
  151cf34f) whose row lives in docs/evidence/verification/cluster-wave-b.md.
