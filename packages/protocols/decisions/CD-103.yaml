inference_disclosure: >-
  The sources fix the constructs. Asking the danger sign as its own item beside the
  feeding-less item (az_beslenme, whose text is CD-100's), the new slot id, and the
  Turkish wording of the danger-sign and fever items are this author's choices made on
  those sources. The feeding ask puts the question
  particle on a positive verb ("hâle geldi mi") so that "evet" means the danger sign is
  present and no negative-question ambiguity arises. NG143 and the WHO pocket book are
  written for young children; whether their features apply above five years stays the
  paediatric applicability question recorded in cluster_child_health.md §4 gap 2.
value:
  packet_commit: 151cf34f
  items:
    - item: "docs/evidence/verification/cluster-wave-b.md#L72"
      ref: "cluster-wave-b §A.1 child Q10"
      packets: [cluster_child_health, cocuk_gogus_hastaliklari, cocuk_sagligi_ve_hastaliklari]
      deciders: [paediatrician]
      question: "Does 'Nefes alırken çocuğunuzun kaburgalarının altı ya da arası içeri çekiliyor mu?' describe the chest-indrawing sign its source names, in the cluster and in both sibling packs?"
      outcome: accept
      clinical_basis: "WHO defines lower chest wall indrawing as the lower chest wall going in on inspiration and excludes indrawing of the soft tissue between the ribs alone; 'altı' names the WHO sign and 'arası' adds intercostal indrawing, so the parent of a child with either answers yes, and since grading is a forbidden trigger the item is a presence input only."
      sources: [WHO-POCKETBOOK-2013, NICE-NG143]
      status: active
    - item: "docs/evidence/verification/cluster-wave-b.md#L73"
      ref: "cluster-wave-b §A.1 child Q13"
      packets: [cluster_child_health, cocuk_hematolojisi_ve_onkolojisi]
      deciders: [paediatrician]
      question: "Should the non-blanching rash item be gated on the parent first reporting a rash?"
      outcome: accept
      clinical_basis: "No gate, as the candidate stands: a non-blanching rash is a red NG143 feature that parents are taught to check for directly, and a parent who calls pin-point spots 'nokta' would answer no to a rash screen and close the item."
      sources: [NICE-NG143]
      status: active
    - item: "docs/evidence/verification/cluster-wave-b.md#L75"
      ref: "cluster-wave-b §A.1 child Q5, Q7"
      packets: [cluster_child_health]
      deciders: [clinician, paediatrician]
      question: "Which polarity do the child hydration items use, and which construct does the cluster's feeding item ask: inability to drink or breastfeed, or feeding as usual?"
      outcome: change
      change: >-
        (1) Polarity: CD-10 decided it (true_is_concern; Q7 is az_cis) and this item
        accepts that. (2) Construct: both constructs are kept, because their thresholds
        differ. Q5 beslenme_sivi_alimi becomes az_beslenme as CD-100 T9 decides it ("Çocuğunuz
        her zamankinden daha az besleniyor ya da içiyor mu?", ungated, true_is_concern).
        Beside it the cluster adds a separate ungated item, the IMCI general danger sign in
        the concern direction: "Çocuğunuz hiçbir şey içemez ya da ememez hâle geldi mi?" ·
        gen: slot=icemez_ememez; type=boolean. The ids change with the construct and the
        polarity (CD-10: no rename across polarities), so beslenme_sivi_alimi leaves the
        cluster. cocuk_sagligi_ve_hastaliklari drops its beslenme_sivi_alimi re-declaration
        and inherits both; cocuk_enfeksiyon_hastaliklari removes emebiliyor_icebiliyor and
        inherits both; neonatoloji's beslenmede_azalma takes az_beslenme with its own infant
        text and inherits icemez_ememez.
      clinical_basis: "The WHO general danger sign, inability to drink or breastfeed, needs the most urgent response, while NG143's poor feeding is an intermediate-risk sign at a lower threshold; asking 'as usual' merges the two so the record cannot tell which one an answer means, so each is asked as its own item and NG143's poor feeding is kept, not merged into the danger sign."
      sources: [WHO-POCKETBOOK-2013, NICE-NG143]
      status: active
    - item: "docs/evidence/verification/cluster-wave-b.md#L77"
      ref: "cluster-wave-b §A.1 child §0 guardian proxy"
      packets: [cluster_child_health]
      deciders: [base owner]
      question: "How do base's self-addressed must_ask items (pregnancy_status, the HPI items, weight_kg, smoking_status, alcohol_use) avoid recording the guardian's own answers in a child's record?"
      outcome: owner_question
      clinical_basis: "Not decided here; D18 does not reach a base-owner question."
      status: owner_question
      owner_part: >-
        Base owner, with the self/proxy ADR (wave 8 §E-4): give base's self-addressed
        must_ask items a proxy form or a subject_role gate in child_health sessions, so that
        a guardian's own pregnancy, smoking, alcohol, weight or complaint never enters the
        child's record (D3 open item 3).
    - item: "docs/evidence/verification/cluster-wave-b.md#L79"
      ref: "cluster-wave-b §A.1 child Q2"
      packets: [cluster_child_health, cocuk_enfeksiyon_hastaliklari]
      deciders: [paediatrician]
      question: "Should the child fever ask be 'var mı' or 'oldu mu'?"
      outcome: change
      change: >-
        Q2 → "Çocuğunuzun son günlerde ateşi oldu mu?" · gen: slot=ates_var_mi;
        type=boolean (id unchanged). Q3 → "Çocuğunuzun ateşi şimdiye kadar ne kadar
        sürdü?" · gen: slot=ates_suresi; type=duration; ask_if=ates_var_mi == true.
        cocuk_sagligi_ve_hastaliklari and cocuk_enfeksiyon_hastaliklari take the same two
        texts in their re-declarations. neonatoloji keeps its own past-tense text.
      clinical_basis: "NICE NG143 takes a parent's report of fever as valid, says a fall in temperature after antipyretics does not separate serious from non-serious illness, and needs fever duration for the five-day Kawasaki check, so a fever that settled today or was brought down by medicine must still be captured and timed."
      sources: [NICE-NG143]
      status: active
    - item: "docs/evidence/verification/cluster-wave-b.md#L80"
      ref: "cluster-wave-b §A.1 child Q14"
      packets: [cluster_child_health]
      deciders: [paediatrician]
      question: "Does the vaccination item need a coded answer that can store 'bilmiyorum'?"
      outcome: accept
      clinical_basis: "No new type: 'bilmiyorum' is already recorded as UNCLEAR by the answer-state table (CD-04), which matches the CKM screening value set's Unknown, and the item's follow-up points the parent to the vaccination card, so the boolean stays."
      sources: [openEHR-EHR-OBSERVATION.symptom_sign_screening.v1]
      status: active
    - item: "docs/evidence/verification/cluster-wave-b.md#L88"
      ref: "cluster-wave-b §A.2 mental Q17"
      packets: [cluster_mental_health]
      deciders: [psychiatrist, owner]
      question: "Can any lay wording ask about persecutory ideation without eliciting a safeguarding disclosure, so that Q17 can be released?"
      outcome: reject
      clinical_basis: >-
        No. A truthful yes from someone under real threat and a yes from persecutory
        ideation read the same, so the item is a safeguarding enquiry, which NICE PH50
        places with trained staff, in private and one to one, with a referral pathway;
        a pre-visit form can guarantee none of these. Q17 stays held and is not asked
        before the visit; persecutory ideation is explored at the clinical interview.
      sources: [NICE-PH50]
      status: active
      owner_part: >-
        Owner: decide whether the product asks any persecutory-ideation item at all, and
        under which data category, since D3 approves forensic and personal safety only for
        adli_tip's own design.
    - item: "docs/evidence/verification/cluster-wave-b.md#L89"
      ref: "cluster-wave-b §A.2 mental Q18"
      packets: [cluster_mental_health]
      deciders: [clinician, psychiatrist, owner]
      question: "Should the cluster ask the 'safety of others' item, given that no rule reads its answer?"
      outcome: reject
      clinical_basis: >-
        No. NICE puts risk to others inside a clinician's assessment that informs the care
        plan (CG115) and asks for a multidisciplinary, objective assessment carried out
        with the person (NG10); a pre-visit yes/no can be neither verified nor answered,
        and base.life_threat has no rule that responds to it. Q18 stays held and is not
        asked before the visit.
      sources: [NICE-NG10, NICE-CG115]
      status: active
      owner_part: >-
        Owner: decide whether the app asks about harm to others at all, and in which data
        category, since aggression and risk to others is not a D3 category.
    - item: "docs/evidence/verification/cluster-wave-b.md#L90"
      ref: "cluster-wave-b §A.2 mental Q16"
      packets: [cluster_mental_health]
      deciders: [owner]
      question: "Is Q16 (hearing voices others do not hear) ordinary special-category health data that may be released text_first, as the verifier reads it?"
      outcome: owner_question
      clinical_basis: "Not decided here; the category reading is the owner's under D3."
      status: owner_question
      owner_part: >-
        Owner: confirm or overrule the verifier's reading that Q16 is ordinary
        special-category health data released text_first and gated to self-report, or hold
        it.
    - item: "docs/evidence/verification/cluster-wave-b.md#L103"
      ref: "cluster-wave-b §A.3 dental Q10"
      packets: [cluster_dental, ortodonti, pedodonti, periodontoloji, protetik, restoratif]
      deciders: [owner]
      question: "Which airway posture does the dental cluster take: ask gated on pain or swelling, ask ungated, or leave it to base.life_threat?"
      outcome: owner_question
      clinical_basis: "Not decided here; the posture is the open owner decision of wave 8 §A decision 1."
      status: owner_question
      owner_part: >-
        Owner: choose one of the three gen lines in cluster-wave-b §C for dental Q10 (ask
        gated, ask ungated, or delete and leave it to base.life_threat).
    - item: "docs/evidence/verification/cluster-wave-b.md#L104"
      ref: "cluster-wave-b §A.3 dental Q10 in pedodonti"
      packets: [cluster_dental, pedodonti]
      deciders: [owner]
      question: "If the owner keeps dental Q10, must pedodonti re-declare the airway slot with the proxy text before any under-18 path opens?"
      outcome: owner_question
      clinical_basis: "Not decided here; it is conditional on the owner's airway posture. CD-104 records the paediatric view of the proxy text (INT-353 L315)."
      status: owner_question
      owner_part: >-
