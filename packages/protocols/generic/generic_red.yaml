    - kind: guideline
      guideline_id: TR-EK4-2022
      title: "Yataklı Sağlık Tesislerinde Acil Servis Hizmetlerinin Uygulama Usul ve Esasları Hakkında Tebliğ, EK-4"
      version_or_date: "RG 13/9/2022 sayı 31952"
      url: "https://www.resmigazete.gov.tr/eskiler/2022/09/20220913-5-1.pdf"
      retrieved_on: 2026-10-02
      quote: "Kategori 2: Hayatı tehdit etme olasılığı yüksek olan ve 10 dakika içerisinde değerlendirilip tedavi edilmesi gerekli durumlar."
      snapshot: "packages/protocols/sources/TR-EK4-2022.txt"
      supports: "do_nots_tr, why_tr"
    - kind: guideline
      guideline_id: TR-EK4-2022
      title: "Yataklı Sağlık Tesislerinde Acil Servis Hizmetlerinin Uygulama Usul ve Esasları Hakkında Tebliğ (MADDE 8(5))"
      version_or_date: "RG 13/9/2022 sayı 31952 (MADDE 8(1)-(5) unchanged by the 2023 and 2024 amendments)"
      url: "https://www.resmigazete.gov.tr/eskiler/2022/09/20220913-5.htm"
      retrieved_on: 2026-10-02
      quote: "(5) 112 acil ambulanslarıyla sağlık tesisine getirilen hastalara ayrıca triyaj uygulaması yapılmaz."
      snapshot: "packages/protocols/sources/TR-EK4-2022.txt"
      supports: why_tr
    - kind: guideline
      guideline_id: TR-EK4-2022
      title: "Yataklı Sağlık Tesislerinde Acil Servis Hizmetlerinin Uygulama Usul ve Esasları Hakkında Tebliğ (MADDE 4(1)(p))"
      version_or_date: "RG 13/9/2022 sayı 31952"
      url: "https://www.resmigazete.gov.tr/eskiler/2022/09/20220913-5.htm"
      retrieved_on: 2026-10-02
      quote: "tıbbi önceliklerinin ve yönlendirilecekleri tedavi birimlerinin belirlenmesi işlemini"
      snapshot: "packages/protocols/sources/TR-EK4-2022.txt"
      supports: why_tr
    spec_basis:
    - file: "files/04_CLINICAL_PROTOCOLS.md"
      section: "§4.1 Turkish crisis resources (the closed number table)"
      quote: "single national emergency number since 1 Feb 2018; psychiatric emergencies including suicide risk are in remit"
      supports: "action_tr, primary, show_112"
    - file: "files/02_PRODUCT_SPEC.md"
      section: "§5.3 The EMERGENCY_NOW persuasion line is location-specific"
      quote: "Both are statements about the service rather than about the patient's condition, so both are safe in every register."
      supports: why_tr
    - file: "files/04_CLINICAL_PROTOCOLS.md"
      section: "§8.1 rule 6"
      quote: "Action scripts carry the do-nots."
      supports: do_nots_tr
    - file: CLAUDE.md
      section: "Clinical content rules, patient copy"
      quote: "Invert inside RED, where the bare imperative plural (Tutun · Arayın · Bakmayın) is correct because ambiguity is the harm."
      supports: "action_tr, do_nots_tr"
