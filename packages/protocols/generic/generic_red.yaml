# The generic RED escalation (INT-453; activated by INT-465): what the device
# shows when a RED's own pre-positioned script cannot be addressed.
#
# Source of truth: CD-24 in the INT-432 clinical-decisions register,
# packages/protocols/decisions/CD-24.yaml (docs/clinical/decisions/CD-24.md).
# An emergency medicine and internal medicine/cardiology physician agent
# authored it, and an independent clinical verifier agent agreed on
# 2026-10-03. Scope is D18: simulated-patient stress testing only. A licensed
# physician's review is required before any real patient.
#
# Everything below is copied from CD-24's record: the copy is
# value.scripts.base.generic_red verbatim, and every source block and spec
# sentence is one CD-24 cites. Each block's supports names only the fields
# CD-24's own supports line gives it, for this location.
# tests/protocols/test_generic_red.py proves all three, and every guideline
# quote is checked verbatim against its committed snapshot at load.
#
# Register: carry_engine_register (CD-24 register_policy). The generic trigger
# carries the engine result's own register and is never fixed at ALERT.
#
# The ON_SITE action line keeps its authoring markup, as CD-24 wrote it.
# protocols.red_render expands it before any screen or TTS sees it: the bold
# markers are removed, and the [ — {{tenant.acil_location_tr}}] segment takes
# the tenant's value or is dropped when unset (files/04 §8.2: never defaulted).
#
# Still draft in CD-24, and so not here:
# - the SILENT copy (meanwhile the same text is shown in flow, with no audio);
# - the register when fired rules declare different registers;
# - the wait before an unanswered location question resolves to REMOTE;
# - generic driving, accompaniment and nil-by-mouth do-nots for REMOTE.
#
# This file's bytes are covered by the synthetic-only test-key signature in
# packages/protocols/signing/red_rule_set.synthetic.json. Any edit voids it
# until it is re-signed (docs/runbooks/red-rule-set-signing.md).
kind: generic_red
decision: CD-24
scope: simulated_patient_stress_testing
status: active
register_policy: carry_engine_register
scripts:
  REMOTE:
    location: REMOTE
    script_id: base.generic_red.remote
    register: carry_engine_register
    sources:
    - kind: guideline
      guideline_id: TR-ACIL-TEBLIG-DEG-2024
      title: "Yataklı Sağlık Tesislerinde Acil Servis Hizmetlerinin Uygulama Usul ve Esasları Hakkında Tebliğde Değişiklik Yapılmasına Dair Tebliğ"
      version_or_date: "RG 11/10/2024 sayı 32689"
      url: "https://www.resmigazete.gov.tr/eskiler/2024/10/20241011-3.htm"
      retrieved_on: 2026-10-02
      quote: "İllerde 112 acil çağrı merkezi bünyesinde acil sağlık çağrılarının karşılandığı ve ambulansların sevk ve idare edildiği birimi"
      snapshot: "packages/protocols/sources/TR-ACIL-TEBLIG-DEG-2024.txt"
      supports: action_tr
    - kind: guideline
      guideline_id: TR-EK4-2022
      title: "Yataklı Sağlık Tesislerinde Acil Servis Hizmetlerinin Uygulama Usul ve Esasları Hakkında Tebliğ, EK-4"
      version_or_date: "RG 13/9/2022 sayı 31952 (EK-4 unchanged by RG 13/5/2023 sayı 32189 and RG 11/10/2024 sayı 32689)"
      url: "https://www.resmigazete.gov.tr/eskiler/2022/09/20220913-5-1.pdf"
      retrieved_on: 2026-10-02
      quote: "Kategori 1: Hayatı tehdit eden ve hızlı agresif yaklaşım ve acil olarak eş zamanlı değerlendirme ve tedavi gerektiren durumlar. Bu durumlarda hasta hiç bekletilmeden kırmızı alana alınır."
      snapshot: "packages/protocols/sources/TR-EK4-2022.txt"
