    - file: CLAUDE.md
      section: "Non-negotiable invariant 21"
      quote: "Under ON_SITE the 112 affordance is absent, not de-emphasised."
      supports: ask_one_tr
    - file: "files/02_PRODUCT_SPEC.md"
      section: "§5.3 Axis 3, location table (UNKNOWN row)"
      quote: "Never guess: a guess is wrong in one of the two directions above, and both of those are harms."
      supports: ask_one_tr
    - file: "files/04_CLINICAL_PROTOCOLS.md"
      section: "§8.1 rule 7"
      quote: "It is never resolved by guessing"
