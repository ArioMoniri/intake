[project]
name = "intake-platform"
version = "0.1.0"
description = "Shared platform library: health endpoints, OTel, security, tokenization clients (filled by INT-010..016)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "cryptography>=43.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    # Declared, not de facto: intake_platform.wait_times has imported the
    # event schemas since INT-197 and intake_platform.db.models imports the
    # closed LearnedFactSource vocabulary since INT-170. clinical-schemas
    # depends on pydantic alone, so the edge is one-way and acyclic.
    "intake-clinical-schemas",
    "minio>=7.2.9",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "prometheus-client>=0.20",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "redis>=5.0",
    "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
# The NER de-identification tier (INT-015). Required wherever egress
# de-identification runs; pattern-only consumers stay lean without it.
ner = [
    "torch>=2.4",
    "transformers>=4.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intake_platform"]
