value:
  is_a_time_limit_under_sc_2_2_1: true
  level: A
  turn_off_adjust_extend: "not acceptable: each would hold back emergency guidance from a patient who may be unable to answer"
  other_exceptions: "the Real-time and 20 Hour exceptions do not apply"
  classification: essential_exception_conditional
  essential_part: "advancing to the rule's no-answer branch (REMOTE, with the 112 control) when the wait ends"
  no_conforming_alternative_for_the_advance: "showing REMOTE and 112 at once would guess the location, which CD-24 refuses, and ON_SITE has no 112 affordance at all"
  condition:
    late_location_answer_honoured: true
    meaning: "after the wait ends the location question stays answerable, and a late answer is taken"
  if_condition_unmet: "the closure is not essential, the exception does not cover the timer, and SC 2.2.1 (BK13) cannot be reported as supported"
  wait_length: "not part of this decision; a clinical value (CD-24 no_answer_wait)"
  late_answer_display: "the clinical lane's (CD-24 on_yes branch)"
  turkish_rule:
    instrument: "Cumhurbaşkanlığı Genelgesi 2025/10, on the basis of Law 5378"
    requirement: "private hospitals' web sites and mobile applications conform to the Kontrol Listesi A Seviyesi and WCAG 2.2"
    deadline: "within one year"
    applies_to_sc_2_2_1: true
    addressee_for_a_vendor_app: "not decided"
