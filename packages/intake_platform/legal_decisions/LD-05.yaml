kind: legal_decision
id: LD-05
title: "WCAG 2.2 SC 2.2.1: classification of the RED no-answer wait"
question: "Under a RED with UNKNOWN location the device asks one question ('Şu anda hastanede misiniz?') and, when no answer comes within a wait, takes the rule's no-answer branch: REMOTE, with the 112 control (PR #796, apps/mobile/src/lib/red/noAnswerClock.ts). The accessibility audit registers that wait as a WCAG 2.2 SC 2.2.1 Essential Exception. Is that classification right, and does a Turkish accessibility rule apply? The length of the wait is a clinical value decided elsewhere and is not part of this question."
outcome: "The wait is a time limit set by the content under SC 2.2.1 (Level A): the Understanding document counts the expiration of a window of opportunity to react to a request for input as a time limit, and that is what the wait ends. Turn off, Adjust and Extend are not acceptable here, because each would hold back emergency guidance from a patient who may be unable to answer; the Real-time and 20 Hour exceptions do not fit. The Essential Exception holds, but only for one part of what the timer does and only on one condition. WCAG calls something essential when removing it would fundamentally change the functionality and the functionality cannot be achieved in another way that would conform. Advancing to the no-answer branch passes both limbs: extending the wait would invalidate the activity, which is getting an action in front of a patient who cannot answer, and the obvious other way — showing REMOTE and 112 at once — is closed to the product, because CD-24 asks the location first rather than guess that the patient is at home, and under ON_SITE the 112 affordance is absent (CLAUDE.md invariant 21). Closing the question fails the second limb: the same guidance can advance while the location question stays answerable, which takes nothing from the patient; the Understanding document says content on a timer need not be adjustable where an alternative not relying on the timer exists, and its own essential example moves as much of the process as possible out of the timed stage. So the classification is: Essential Exception, conditional on a late location answer being honoured. As built in PR #796 the condition is not met: the store ignores any location answer once the wait has resolved the question to no answer (see the inference disclosure). Until the question stays answerable, the classification fails and SC 2.2.1 (BK13) cannot be reported as supported for this timer. What the device shows when a late 'evet' arrives after REMOTE guidance — CD-24's on_yes branch, the ON_SITE script — is the clinical lane's to decide; this decision says only that the answer must be accepted. The Turkish rule: Cumhurbaşkanlığı Genelgesi 2025/10 grounds web and mobile accessibility in Law 5378 and requires, among others, private hospitals to bring their web sites and mobile applications into line with the Ministry's Kontrol Listesi A Seviyesi and WCAG 2.2 within one year; SC 2.2.1 is a Level A criterion. Whether the Genelge binds the product itself or the hospital whose patients use it is not decided; either way the product's own target already contains Level A."
legal_basis: "W3C WCAG 2.2 (Recommendation, 12 December 2024) SC 2.2.1 and the glossary definition of 'essential'; Understanding SC 2.2.1 (informative); Cumhurbaşkanlığı Genelgesi 2025/10 (RG 21/6/2025, 32933)."
status: proposed
scope: synthetic_test_only
scope_note: "Owner decision D25 (3 Oct 2026): agent-decided and agent-verified legal items, for synthetic and test use only. A licensed Turkish lawyer countersigns before any real patient."
question_origin: "PR #796 (INT-465): 'The a11y audit registers it as a WCAG 2.2.1 Essential Exception; the owner should confirm that classification.' Under D25 that question comes to this lane first."
author_role: "Turkish accessibility and health-technology regulatory lawyer (agent)"
inference_disclosure: "Splitting the timer into an essential advance and a non-essential closure is this author's application of WCAG's definition of 'essential' together with the informative Understanding text; W3C does not discuss emergency guidance. The finding about PR #796 reads its store code as of 3 Oct 2026 (answerLocation returns early unless the answer is still 'unanswered', apps/mobile/src/lib/red/store.ts), which is not on main, is not a committed source here, and may change before it merges; the orchestrator relays it to #796. That the Genelge reaches a vendor-provided patient app only through the hospital is not assumed either way."
