legal_gap: "One part is not answered by any retrieved text: whether the Genelge 2025/10 binds a patient app that a vendor provides to a private hospital, or only the hospital's own web sites and mobile applications. The Aile ve Sosyal Hizmetler Bakanlığı's implementing procedures for the İzleme and İnceleme Komisyonları, not snapshotted here, would settle it."
