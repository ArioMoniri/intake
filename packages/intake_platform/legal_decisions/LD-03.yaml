kind: legal_decision
id: LD-03
title: "KVKK inventory rows: family history, relatives' health and consanguinity; the hearing-voices item (Q16)"
question: "What are the KVKK inventory rows {category, purpose, basis, retention, recipients} for (a) the one sensitive, text_first section that asks about family health history, relatives' illnesses and parental consanguinity, whose relatives are data subjects too, and (b) the mental-health cluster's hearing-voices item Q16 (baskalarinin_duymadigi_sesler)? On what ground are the relatives' data processed, and what notice do they get?"
outcome: "(a) Family history, relatives' health and consanguinity. Category: special-category personal data under KVKK m.6(1), which names health and genetic data; the INT-349 register row is relatives_health. Consanguinity is not named in m.6(1); it is processed with the same special-category protections because it is asked only for the patient's genetic risk. Purpose: the patient's own diagnosis and care, a specific, explicit and legitimate purpose limited to what it needs (KVKK m.4(2)(c), (ç)). Basis for the patient: açık rıza under the files/06 §2 consent scope (KVKK m.6(3)(a)), as for every other answer the patient gives about their own health; in the hospital deployment the ground is the controller's choice between açık rıza and m.6(3)(e), and the product's consent model takes açık rıza. Which files/06 §2 consent scope the section rides is not decided. Basis for the relatives: their açık rıza is not available, because açık rıza is the data subject's own freely given consent (KVKK m.3(1)(a)) and the patient cannot give it for them; the ground is m.6(3)(e), processing necessary for medical diagnosis, treatment and care by persons under a duty of secrecy or by authorised institutions. That ground belongs to the health service provider, so it holds in the hospital deployment, where the hospital is the controller (KVKK m.3(1)(ı)) and the product processes on its behalf (KVKK m.3(1)(ğ); files/06 §0.1). In the consumer deployment the company is the controller and is neither a health professional under a statutory duty of secrecy nor an authorised health institution, so whether any ground exists there is not decided and the section must not be served there. Nothing enforces that today: filling the register row opens serving in both deployments, so a deployment-role gate on household, relatives_health and partner_fertility must come first (follow-up INT-474). Notice to the relatives: KVKK m.10 requires notice when data are obtained, and where data are not obtained from the person concerned the Tebliğ fixes the time — within a reasonable time of collection, at the first contact, or at the latest at the first transfer (Aydınlatma Tebliği m.6(1)); KVKK m.28(2) gives no exemption that fits, and how a controller that never contacts a patient's relatives discharges the duty is not decided. Recipients: the tenant's clinicians giving this visit's care, through the consented share, and only as far as that care requires (read from Kişisel Sağlık Verileri Hakkında Yönetmelik m.6(1); see the inference disclosure). Measures: the Kurul's adequate measures for special-category data apply (KVKK m.6(4)). Retention is not decided. Delivery: one sensitive section, text_first (D24 answer 2Y). (b) Hearing voices, Q16. Category: the patient's own health data, special category under KVKK m.6(1); an ordinary symptom item, so the register category is general_health and no INT-349 row is needed (D24 answer 3Y). Purpose and basis: the patient's own diagnosis and care under açık rıza (KVKK m.6(3)(a)), as the slots.value inventory annotation already states. Recipients: as in (a). It is asked of the patient only (self-report), text_first, and never scored. Retention and consent scope are not decided. Serving: the data-category compiler never refuses a general_health slot, so for Q16 only the pack's unserved L0 status (HB-C1) keeps it from a patient. For (a), the served register docs/legal/data-categories.yaml keeps its counsel fields empty: an agent fills no counsel field (D25), so the compiler keeps refusing relatives_health slots."
legal_basis: "KVKK 6698 m.3(1)(a), (ç), (ğ), (ı); m.4(2)(c), (ç); m.6(1), m.6(3)(a), m.6(3)(e), m.6(4); m.10(1); m.28(2); Aydınlatma Yükümlülüğünün Yerine Getirilmesinde Uyulacak Usul ve Esaslar Hakkında Tebliğ m.6(1); Kişisel Sağlık Verileri Hakkında Yönetmelik m.2(1), m.6(1)."
status: active
scope: synthetic_test_only
scope_note: "Owner decision D25 (3 Oct 2026): agent-decided and agent-verified legal items, for synthetic and test use only. A licensed Turkish lawyer countersigns before any real patient; until then docs/legal/data-categories.yaml keeps its counsel fields empty."
question_origin: "INT-349 and owner decision D3 (docs/evidence/verification/owner-decisions-2026-09-26.md): counsel must decide, per category, the KVKK m.6 basis and a separate basis and notice where another person is the data subject. The owner's D24 answers 2Y and 3Y put family history, relatives' health and consanguinity in one sensitive text_first section and confirmed Q16 as ordinary health data."
author_role: "Turkish data-protection (KVKK) and health-law lawyer (agent)"
inference_disclosure: "Treating consanguinity as special-category data is this author's choice of the more protective reading; m.6(1) does not name it. That m.6(3)(e) is the health service provider's ground and not the software company's is this author's reading of 'sır saklama yükümlülüğü altında bulunan kişiler veya yetkili kurum ve kuruluşlarca': a contractual confidentiality undertaking is not read as the statutory duty the provision means, and that reading is exactly what stays open for the consumer deployment. The controller and processor roles are the product's own design (files/06 §0.1), not a legal finding. Kişisel Sağlık Verileri Hakkında Yönetmelik m.2(1) limits that regulation to activities in processes the Ministry of Health runs, so applying its m.6(1) access limit to a vendor's pre-visit record is this author's inference; the recipients rule also follows from KVKK m.4(2)(ç)'s limitation principle on its own. For counsel: where m.6(3)(e) applies in the hospital deployment, Kurul practice is reported to disfavour açık rıza as a fallback, and refusing consent must not gate the core intake; no Kurul text is snapshotted here, so this is recorded, not decided."
