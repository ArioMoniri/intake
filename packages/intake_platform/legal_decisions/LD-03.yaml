kind: legal_decision
id: LD-03
title: "KVKK inventory rows: family history, relatives' health and consanguinity; the hearing-voices item (Q16)"
question: "What are the KVKK inventory rows {category, purpose, basis, retention, recipients} for (a) the one sensitive, text_first section that asks about family health history, relatives' illnesses and parental consanguinity, whose relatives are data subjects too, and (b) the mental-health cluster's hearing-voices item Q16 (baskalarinin_duymadigi_sesler)? On what ground are the relatives' data processed, and what notice do they get?"
outcome: "(a) Family history, relatives' health and consanguinity. Category: special-category personal data under KVKK m.6(1), which names health and genetic data; the INT-349 register row is relatives_health. Consanguinity is not named in m.6(1); it is processed with the same special-category protections because it is asked only for the patient's genetic risk. Purpose: the patient's own diagnosis and care, a specific, explicit and legitimate purpose limited to what it needs (KVKK m.4(2)(c), (ç)). Basis for the patient: açık rıza under the files/06 §2 consent scope (KVKK m.6(3)(a)), as for every other answer the patient gives about their own health. Basis for the relatives: their açık rıza is not available, because açık rıza is the data subject's own freely given consent (KVKK m.3(1)(a)) and the patient cannot give it for them; the ground is m.6(3)(e), processing necessary for medical diagnosis, treatment and care by persons under a duty of secrecy or by authorised institutions. That ground belongs to the health service provider. It is therefore available in the hospital deployment, where the hospital is the controller and the product processes on its behalf (KVKK m.3(1)(ğ), (ı); files/06 §0.1). In the consumer deployment the company is the controller and is neither a health professional under a statutory duty of secrecy nor an authorised health institution, so whether any ground exists there is not decided, and the section is not served in that deployment. Notice to the relatives: KVKK m.10 requires notice when data are obtained, and where data are not obtained from the person concerned the Tebliğ fixes the time — within a reasonable time of collection, at the first contact, or at the latest at the first transfer (Aydınlatma Tebliği m.6(1)); how a controller that never contacts a patient's relatives discharges that duty is not decided. Recipients: the tenant's clinicians giving this visit's care, through the consented share, and only as far as that care requires (Kişisel Sağlık Verileri Hakkında Yönetmelik m.6(1)). Measures: the Kurul's adequate measures for special-category data apply (KVKK m.6(4)). Retention is not decided. Delivery: one sensitive section, text_first (D24 answer 2). (b) Hearing voices, Q16. Category: the patient's own health data, special category under KVKK m.6(1); it is an ordinary symptom item, so the register category is general_health and no new INT-349 row is needed (D24 answer 3 confirmed the verifier's reading). Purpose and basis: the patient's own diagnosis and care under açık rıza (KVKK m.6(3)(a)), as the slots.value inventory annotation already states. No other person is a data subject. Recipients: as in (a). It is asked only of the patient (self-report), text_first, and never scored. Retention is not decided. The served register docs/legal/data-categories.yaml keeps its counsel fields empty: an agent fills no counsel field (D25), so the compiler still refuses to serve these slots for a real patient."
legal_basis: "KVKK 6698 m.3(1)(a), (ç), (ğ), (ı); m.4(2)(c), (ç); m.6(1), m.6(3)(a), m.6(3)(e), m.6(4); m.10(1); Aydınlatma Yükümlülüğünün Yerine Getirilmesinde Uyulacak Usul ve Esaslar Hakkında Tebliğ m.6(1); Kişisel Sağlık Verileri Hakkında Yönetmelik m.6(1)."
status: proposed
scope: synthetic_test_only
scope_note: "Owner decision D25 (3 Oct 2026): agent-decided and agent-verified legal items, for synthetic and test use only. A licensed Turkish lawyer countersigns before any real patient; until then docs/legal/data-categories.yaml keeps its counsel fields empty."
question_origin: "INT-349 and owner decision D3 (docs/evidence/verification/owner-decisions-2026-09-26.md): counsel must decide, per category, the KVKK m.6 basis and a separate basis and notice where another person is the data subject. The owner's D24 answers 2 and 3 (INT-470, recorded in files/00_STATE.md §3 by a separate PR) put family history, relatives' health and consanguinity in one sensitive text_first section and confirmed Q16 as an ordinary health item."
author_role: "Turkish data-protection (KVKK) and health-law lawyer (agent)"
inference_disclosure: "Treating consanguinity as special-category data is this author's choice of the more protective reading; m.6(1) does not name it. That m.6(3)(e) is the health service provider's ground and not the software company's is this author's reading of 'sır saklama yükümlülüğü altında bulunan kişiler veya yetkili kurum ve kuruluşlarca': a contractual confidentiality undertaking is not read as the statutory duty the provision means, and that reading is exactly what stays open for the consumer deployment. The controller and processor roles are the product's own design (files/06 §0.1), not a legal finding."
