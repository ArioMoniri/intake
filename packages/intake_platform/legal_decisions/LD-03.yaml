legal_gap: "Three parts are not answered by any retrieved text. Consumer-deployment ground for relatives' data: whether a company that is the controller but not a health institution can rely on KVKK m.6(3)(e), or on any ground, for data about people who never consented; a Kurul decision on third-party health data in patient-reported family history, or counsel's opinion, would settle it. Notice mechanism for relatives: the Tebliğ m.6(1) gives the timing but no way to reach people the controller never contacts and no exemption for them, and KVKK m.28 lists none that fits; a Kurul decision or counsel would settle it. Retention for both rows: no retrieved text sets how long a pre-visit answer is kept; the hospital medical-record retention rules and the Kişisel Verilerin Silinmesi, Yok Edilmesi veya Anonim Hale Getirilmesi Hakkında Yönetmelik, neither snapshotted here, would settle it."
