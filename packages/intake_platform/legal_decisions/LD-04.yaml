kind: legal_decision
id: LD-04
title: "Occupational items: work-related sick leave, job tenure and household tuberculosis contact — category and basis"
question: "Under which KVKK category and on what ground are three released items processed: iş ve meslek hastalıkları Q17 (isle_ilgili_rapor, a health report taken for a work-related health problem), Q18 (is_suresi, time in the current job) and halk sağlığı Q11 (evde_verem_temasi, someone in the household recently diagnosed with tuberculosis)?"
outcome: "Q17, work-related sick leave: whether the patient took a health report for a health problem is the patient's own health data, special category under KVKK m.6(1); a sağlık raporu is by definition the record of a person's health status (Sağlık Raporları Yönetmeliği Madde 4(1)(m)). The INT-349 register row is occupational, as D3 and the owner's D24 answer 4 read it. Ground: the patient's açık rıza under the files/06 §2 consent scope (KVKK m.6(3)(a)). The employment and occupational-safety ground of m.6(3)(f) is not ours: it covers what a legal obligation in those fields makes necessary, and a pre-visit intake discharges no such obligation. Q18, job tenure: how long the patient has worked in the current job is not among the categories m.6(1) lists, so it is ordinary personal data; its ground is the patient's açık rıza (KVKK m.5(1)) under the same consent scope, it sits in the occupational row, and it keeps the protections of the record it is stored in. Q11, household tuberculosis contact: the answer says something about two people. For the patient it is health data about their own exposure (m.6(1)), processed on açık rıza (m.6(3)(a)). For the household member it is that person's health data, a diagnosis, and that person gave no consent; the ground is m.6(3)(e), processing necessary for protecting public health, preventive medicine and medical diagnosis by persons under a duty of secrecy or authorised institutions. As in LD-03, that ground is the health service provider's: it holds in the hospital deployment and is not decided for the consumer deployment, where the item is not served. The INT-349 register row is household (D3's household contacts). The household member's notice follows the Tebliğ timing (Aydınlatma Tebliği m.6(1)); the mechanism is not decided. Recipients for all three: the tenant's clinicians giving this visit's care, through the consented share, only as far as that care requires (Kişisel Sağlık Verileri Hakkında Yönetmelik m.6(1)); an employer is not a person giving the health service and never receives these answers. Retention is not decided for any of the three."
legal_basis: "KVKK 6698 m.5(1); m.6(1); m.6(3)(a), (e), (f); Aydınlatma Tebliği m.6(1); Kişisel Sağlık Verileri Hakkında Yönetmelik m.6(1); Sağlık Raporları Yönetmeliği Madde 4(1)(m)."
status: proposed
scope: synthetic_test_only
scope_note: "Owner decision D25 (3 Oct 2026): agent-decided and agent-verified legal items, for synthetic and test use only. A licensed Turkish lawyer countersigns before any real patient; until then docs/legal/data-categories.yaml keeps its counsel fields empty."
question_origin: "docs/evidence/verification/specialty-wave9-occupational-public.md (line 88) read Q17 and Q18 as within D3's employer and occupational line and released halk sağlığı Q11 under D3's household contacts; docs/clinical/decisions/CD-105.md left the reading as an owner question, which the owner answered in D24 answer 4 (INT-470, recorded in files/00_STATE.md §3 by a separate PR). This decision supplies the category and basis that D3 left to counsel."
author_role: "Turkish data-protection (KVKK) and occupational-health-law lawyer (agent)"
inference_disclosure: "That m.6(3)(f) does not cover a pre-visit intake is this author's reading: the ground is tied to 'hukuki yükümlülüklerin yerine getirilmesi', and the intake fulfils none. That an employer never receives the answers is this author's application of KSVY m.6(1), which limits access to people giving the health service. Treating the household member's diagnosis under m.6(3)(e) and leaving the consumer deployment open follows LD-03's reading of who may use that ground."
