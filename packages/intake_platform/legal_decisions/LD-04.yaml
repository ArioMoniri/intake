legal_gap: "Three parts are not answered by any retrieved text. Consumer-deployment ground for the household member's diagnosis: the same open question as LD-03 (whether a controller that is not a health institution may rely on KVKK m.6(3)(e)); a Kurul decision or counsel's opinion would settle it. Notice mechanism for the household member: the Tebliğ m.6(1) gives the timing, not a way to reach someone the controller never contacts; a Kurul decision or counsel would settle it. Retention for all three items: no retrieved text sets it; the hospital medical-record retention rules and the deletion regulation, neither snapshotted here, would settle it."
