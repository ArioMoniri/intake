kind: legal_decision
id: LD-06
title: 'Admin metrics and telemetry for research and improvement: purpose, anonymisation, cell size, retention'
question: 'The owner asks for admin metrics and telemetry about users and questions, for research and
  enhancement, as far as the law allows. In scope: aggregate, de-identified metrics per question and protocol
  version — completion and drop-off, time-to-answer, repeat and clarify rate, typed versus voice share,
  ASR quality bands, the share of sessions reaching RED, YELLOW or GREEN, device and locale — and user
  funnels invited, started, finished, shared; small cells suppressed; no free text, no identifiers, no
  per-patient drill-down. (a) Do improvement analytics fall under the existing service purpose? (b) Is
  research use a separate purpose that needs explicit consent? (c) Anonymised or pseudonymised: what may
  the admin analytics hold? (d) What minimum cell size must a count reach before it shows? (e) How long
  may the data be kept?'
outcome: '(a) Improving the service is a purpose of its own, not the patient''s care, so it does not ride
  the care purpose (KVKK m.4(2)(c)-(ç)). It needs no ground and no consent of its own as long as only
  anonymised aggregates come out: the Law does not apply to personal data processed for research, planning
  and statistics by being anonymised (m.28(1)(b)), and anonymised data cannot be associated with an identified
  or identifiable person even when matched with other data (m.3(1)(b)). Anonymisation is the condition:
  a figure that is not anonymous loses this route. In the hospital deployment the vendor processes on
  the hospital''s authority and on its behalf (m.3(1)(ğ)), so producing aggregates for the vendor''s own
  improvement needs the hospital''s authorisation in the DPA; the hospital itself may analyse its own
  service for planning and management under m.6(3)(e), where that is necessary. (b) Research on anonymised
  aggregates follows the same route (m.28(1)(b)); the Ministry''s own regulation allows scientific work
  on health data the controller has anonymised (KSVY m.16(1)). Research on record-level or pseudonymised
  data is a separate purpose (m.4(2)(c)) on special-category data. The product never does it without the
  patient''s açık rıza under the existing research purpose (m.6(3)(a); files/06''s research rule) — a
  floor, not a finding that açık rıza is enough. HB-L26 stays with counsel in full: which limb of KSVY
  m.16 a consented, pseudonymised research export rides — m.16(1), scientific work on data the controller
  has anonymised (KVKK m.28(1)(b)), or m.16(2), scientific processing under KVKK m.28(1)(c) so long as
  it does not violate privacy or personality rights or constitute a crime — whether it may ride either
  at all, and whether açık rıza is even an available basis or m.28 displaces it. None of it reaches the
  admin panel. (c) The admin analytics hold anonymised aggregates only. Anonymisation means no one can
  be identified even by reversal or by matching with other data, by the controller or any recipient (Yönetmelik
  m.10(1)-(2)); a keyed or hashed per-person or per-session row can be reversed by whoever holds the key,
  so pseudonymised rows remain personal data — health data — and are never admin analytics. Following
  the Kurum''s guide, indirect identifiers count too, and every combination of dimensions the panel can
  show is a cell of its own. (d) No retrieved text sets a number. The legal test is the outcome in Yönetmelik
  m.10(2); the Kurum''s guide names k-anonymity as a method that strengthens anonymisation without fixing
  a k. The product floor of ten distinct people per cell (files/06 §8; the INT-171 gate), counted per
  person and all-or-nothing within each view, is a product rule; whether it is enough for a given set
  of dimensions is not decided. (e) The session data the aggregates are computed from are deleted, destroyed
  or anonymised once the reason to process them ends (m.7(1)); a controller that must register with VERBİS
  keeps a retention and destruction policy (Yönetmelik m.5(1)) and destroys at intervals of at most six
  months (m.11(2)). Anonymised aggregates are not personal data, so the Law''s retention rules do not
  bind them. The retention periods themselves — for aggregates and for raw telemetry — are not decided.
  Stop-and-ask: consent scope, the retention periods and the DPA''s controller-authorisation term are
  the owner''s under CLAUDE.md; this lane gave one recommendation, on consent scope, and the owner accepted
  it as written on 16 Oct 2026 (D28). The retention periods and the DPA term stay open.'
legal_basis: KVKK 6698 m.3(1)(a), (b), (ğ); m.4(2)(c)-(ç); m.6(3)(a), (e); m.7(1); m.28(1)(b); Kişisel
  Verilerin Silinmesi, Yok Edilmesi veya Anonim Hale Getirilmesi Hakkında Yönetmelik m.5(1), m.10(1)-(2),
  m.11(2); the Kurum's anonymisation guide (Kasım 2017) §3.1 and §3.1.3; KSVY m.16(1)-(2).
status: active
scope: synthetic_test_only
scope_note: 'Owner decision D25 (3 Oct 2026): agent-decided and agent-verified legal items, for synthetic
  and test use only. A licensed Turkish lawyer countersigns before any real patient.'
question_origin: 'INT-484 (GitHub #827). Owner request, 4 Oct 2026, in chat: “the admin should have metrics
  and telemetry of users and questions as legal agent allows for research and enhancement purposes”. Step
  1 of INT-484 is this decision; the build is step 2.'
author_role: Turkish data-protection (KVKK) and health-data research law lawyer (agent)
inference_disclosure: Three readings are this author's. First, m.28(1)(b) is read as two limbs — official
  statistics, and processing for research, planning and statistics by anonymisation — and product-improvement
  statistics as 'planlama ve istatistik'; the Kurul's later practice should be checked by counsel. Second,
  that a processor needs the controller's authorisation to compute aggregates for its own purposes is
  this author's reading of m.3(1)(ğ) ('onun adına'); the anonymising step is itself processing of the
  controller's data. Third, that an opt-out is not açık rıza follows from m.3(1)(a)'s 'özgür iradeyle
  açıklanan'. KSVY m.2(1) limits that regulation to processes the Ministry runs, so its m.16 is cited
  for how the Ministry reads m.28 for health data, not as binding a vendor. The Kurum's guide illustrates
  k-anonymity with small groups in its examples; examples are not a threshold.
