legal_gap: 'Six parts are not answered by any retrieved text. The legal minimum cell size: no Turkish
  text sets a number, and the Kurum''s guide names the method without a k; a Kurul decision on aggregate
  health statistics, or counsel''s opinion for the panel''s actual dimensions, would settle whether the
  product floor of ten is enough. The retention periods for the aggregates and for raw telemetry: a data-retention
  decision for the owner, settled in the controller''s retention and destruction policy (Yönetmelik m.5-6).
  The DPA wording that authorises aggregates for the vendor''s own improvement: a vendor-contract term
  for the owner and counsel. The record-level research route and whether açık rıza suffices for it — two
  parts, both HB-L26: which limb of KSVY m.16 a consented, pseudonymised research export rides — m.16(1),
  scientific work on data the controller has anonymised (KVKK m.28(1)(b)), or m.16(2), scientific processing
  under KVKK m.28(1)(c) so long as it does not violate privacy or personality rights or constitute a crime
  — whether it may ride either at all, and whether açık rıza is even an available basis or m.28 displaces
  it; counsel.'
value:
  improvement:
    rides_the_care_purpose: false
    anonymised_aggregates_need_a_ground_or_consent: false
    anonymisation_is_the_condition: the aggregates must be anonymous in the sense of KVKK m.3(1)(b) and
      Yönetmelik m.10; data that are not anonymous lose the m.28(1)(b) route and need a ground of their
      own
    hospital_deployment_needs_controller_authorisation: true
    controller_authorisation_wording: not decided (a vendor-contract term)
    hospital_own_service_planning: the hospital, as controller, may analyse its own service for planning
      and management under m.6(3)(e), where that is necessary (gerekli olması); that ground is the hospital's,
      not the vendor's
  research:
    anonymised_aggregates_need_consent: false
    record_level:
      separate_purpose: true
      never_without_acik_riza: true
      floor_not_sufficiency: the product never uses record-level data for research without the patient's
        açık rıza under the existing research purpose and an ethics approval; this is a floor, not a finding
        that açık rıza suffices
      acik_riza_suffices: not decided (HB-L26)
      in_admin_analytics: false
      m28_1_c_route: not decided (HB-L26)
  admin_analytics:
    may_hold: anonymised_aggregates_only
    pseudonymised_rows: personal_data_never_admin_analytics
    conditions:
      no_identifiers_free_text_or_drill_down: no identifier, direct or indirect, no free text, no join
        key and no per-patient or per-session drill-down
      every_combination_is_a_cell: every combination of dimensions the panel can show (question, protocol
        version, device, locale, tenant, period) is a cell and passes the threshold on its own
      subjects_not_rows: a cell counts distinct people, not rows or sessions
      whole_views_only: within a view, all its cells show or none do, so no cell of that view can be recovered
        by subtraction from the others
      across_views: a withheld cell can still be recovered by subtraction from a wider aggregate over
        the same population, so step 2 needs fixed, non-overlapping period buckets, no free-form filters
        and a check across views
  cell_size:
    legal_minimum: not decided
    legal_test: no one can be identified from the shown figures, even by reversal or by matching with
      other data, by the controller or by any recipient
    k_anonymity_named_by_the_kurum: the Kurum's guide names k-anonymity among the statistical methods
      that strengthen anonymisation
    product_floor_subjects: 10
  retention:
    personal_inputs: the session data the aggregates are computed from are deleted, destroyed or anonymised
      once the reason to process them ends
    policy_required: a retention and destruction policy is required, because the controller must register
      with VERBİS
    periodic_destruction_max_months: 6
    anonymised_aggregates_are_not_personal_data: true
    aggregates: not decided
    raw_telemetry_current_spec: 'files/06 §3: 30 days hot, 1 year cold, PHI-free by construction'
    raw_telemetry: not decided
  consent_scope:
    stop_and_ask: true
    current_spec: files/06 §2 lists learning:service_improvement as de-identified aggregates under an
      opt-out
    opt_out_is_not_acik_riza: 'an opt-out is not açık rıza: açık rıza is consent declared by free will
      on a specific subject after information'
    decision: 'accepted: the owner adopted owner_recommendation as written (D28, 16 Oct 2026); consent
      scope is settled for synthetic and test use'
    owner_recommendation: 'Keep the admin panel to anonymised aggregates only (KVKK m.28(1)(b); Yönetmelik
      m.10) and add no consent purpose for it; the learning:service_improvement opt-out may stay as a
      courtesy but is not the legal ground. Anything record-level or pseudonymised is used only under
      opt-in açık rıza and never under an opt-out, subject to HB-L26: for research, the existing research
      purpose; for improvement, a consent whose text names that purpose, because açık rıza is given on
      a specific subject and consents are unbundled.'
    owner_answer:
      owner_decision: D28
      outcome: accepted
      quote: orb=lens O2N O3N O4N O5N O6N O7N O8N O9N FIXY P1N P2N P3N P4N P5N LD6Y
      answered_on: 2026-10-16
      channel: orchestrator → main conversation → owner in chat
      reading: 'LD6Y adopts LD-06''s consent-scope recommendation as written. The reply''s other tokens
        answer questions outside LD-06 and are not read here. The answer came after the reviewer''s verdict
        and changes no legal value: it settles consent_scope.decision only.'
  stop_and_ask_items: consent scope (this lane's recommendation, accepted by the owner under D28), the
    retention periods, and the controller-authorisation term in the hospital DPA
