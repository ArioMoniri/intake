kind: legal_decision
id: LD-02
title: "Minors and proxy answers (HB-L20) in synthetic and test sessions"
question: "In synthetic and test sessions, who may answer intake questions for a child or for a dependent adult, at which ages, and on what consent footing under Turkish law (Türk Medeni Kanunu velâyet and vesayet, Hasta Hakları Yönetmeliği, KVKK açık rıza)? Which of HB-L20's nine questions can the texts answer?"
outcome: "Age: a person is a minor until the eighteenth birthday; marriage makes a person of age, and a court may declare a minor of fifteen or over of age at the minor's own request with the parent's consent (TMK m.11, m.12). For a person born on 29 February, the eighteen years run out on 28 February in a year with no 29 February: TMK m.5 applies the general provisions of the Borçlar Kanunu to all private-law relations as far as they fit, and TBK m.92 ends a period counted in years on the matching day of the last month or, when that month has no such day, on its last day. In law, who may act for whom: for a minor, a parent holding velâyet or a vasi, because the parents are the child's legal representatives toward third parties and a vasi represents the person under vesayet in every legal transaction (TMK m.335, m.342, m.403, m.448); for an adult under kısıtlama, the vasi, or the parents where the court left a restricted adult child under their velâyet (TMK m.335, m.448); an adult with discernment who is not restricted has full capacity and answers for themselves (TMK m.10); an adult without discernment and without a court-appointed representative has nobody who can act in their name, because a person without discernment cannot act with legal effect and has no capacity (TMK m.14, m.15). The Ministry's report procedure follows the same line: for a person under eighteen the veli or vasi completes the personal health form, and a restricted person applies with the vasi (Sağlık Raporları Yönetmeliği Madde 6(1)-(2)). A minor is heard and involved as far as the minor understands, even where the representative's consent suffices (HHY m.24). Carers: the law gives a carer, relative or companion with no legal representation no power to act in the patient's name, and the Hasta Hakları Yönetmeliği lets another person be informed in the patient's place only on the patient's signed written request (HHY m.18); it does not bar a clinician in the hospital deployment from taking history from a relative, which KVKK m.6(3)(e) covers. That the carer answers for no one in a synthetic session is the owner's product rule (D24 answer 1Y), not the law, and it differs from files/06's rule that companion or proxy answers are taken and flagged proxy_reported — a point for the files/06 owner. Consent footing: an adult with capacity consents for themselves (KVKK m.6(3)(a)); for a child without discernment the legal representative acts (TMK m.14, m.15, m.342; HHY m.24 for medical interventions); whether a minor with discernment gives açık rıza for their own health data alone, because consent is a strictly personal right (TMK m.16), or needs the representative is not decided. Product consequence inside the synthetic scope: the child path and the carer path stay closed, and proxy items are reworded for the representative or skipped (D24 answer 1Y). Of HB-L20's nine questions, two are answered: the legal effect of emancipation (a married or court-emancipated minor is of age, so the guardian requirement ends in law) and the leap-day birthday; which evidence of emancipation to accept, and the other seven, stay draft. Nothing here relaxes INT-223's fail-closed defaults."
legal_basis: "TMK 4721 m.5, m.10, m.11, m.12, m.14, m.15, m.16, m.335, m.342, m.403, m.448; TBK 6098 m.92; Hasta Hakları Yönetmeliği m.18, m.24; Sağlık Raporları Yönetmeliği Madde 6(1)-(2); KVKK 6698 m.3(1)(a), m.6(3)(a), m.6(3)(e)."
status: proposed
scope: synthetic_test_only
scope_note: "Owner decision D25 (3 Oct 2026): agent-decided and agent-verified legal items, for synthetic and test use only. A licensed Turkish lawyer countersigns before any real patient; HB-L20 stays open for that lawyer."
question_origin: "files/HUMAN_BLOCKERS.md HB-L20 (nine minor and guardian questions, INT-223). The owner's D24 answer 1Y set the product direction: proxy rewording or skip, and the child and carer paths closed until it exists."
author_role: "Turkish family-law and health-law lawyer (agent)"
inference_disclosure: "No retrieved text addresses a pre-visit questionnaire answered by someone other than the patient. That only a legal representative may act for a minor or a restricted adult is this author's application of TMK representation (m.342, m.448) and HHY m.24 to answering health questions in the patient's name. Applying TBK m.92, a rule for the time of performance, to the computation of age through TMK m.5's 'uygun düştüğü ölçüde' is this author's reading; no court decision on a 29 February birthday was retrieved. The Sağlık Raporları Yönetmeliği Madde 6 lines are cited as the Ministry applying the same rule to health declarations, not as a rule that binds a pre-visit intake."
