legal_gap: "Eight HB-L20 questions and one evidence rule are not answered by any retrieved text. adolescent_self_consent: KVKK names no age and TMK m.16 exempts strictly personal rights from the representative's consent while HHY m.24 asks the veli for medical interventions; a Kurul decision or settled Yargıtay case law on açık rıza by a minor with discernment would settle it. unverified_dob, dob_collection_mandatory and guardian_relationship_proof: no text says which evidence of age or of velâyet a pre-visit service must hold; a Ministry rule on e-Nabız or MHRS identity, or counsel's opinion, would settle them. emancipation_evidence: TMK m.11 and m.12 give the effect, not the evidence (a court decision or a marriage record, and how it is checked). leap_day_maturity: TMK m.11 counts years and says nothing about 29 February; a Yargıtay decision or the nüfus practice would settle it. adolescent_private_guardian_default, guardian_link_basis and jurisdiction_tr_only: no retrieved text addresses them; counsel's opinion under KVKK m.5 and m.6 and the product's market scope would settle them."
