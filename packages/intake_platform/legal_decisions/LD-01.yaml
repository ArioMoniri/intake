kind: legal_decision
id: LD-01
title: "Adli Tıp: the report-purpose item, and whether the Sağlık Raporları Yönetmeliği governs forensic reports"
question: "The allied-and-reports cluster carries Q3, the report purpose (rapor_amaci), to seven allied branches including Adli Tıp. May it be carried to Adli Tıp, where the purpose is forensic? Does the Sağlık Raporları Yönetmeliği (the cluster's source AL-S1) govern forensic reports at all, and does its Madde 8(5) bar on stating a report's purpose reach Adli Tıp?"
outcome: "The Sağlık Raporları Yönetmeliği governs forensic reports issued by health service providers. It covers every public and private provider (Madde 2(1)), and its Eighth Part, Adli Hekimlik Hizmetleri, runs from Madde 39 until the Ninth Part opens at Madde 53 and regulates how adli raporlar are drawn up. It is not the only governing text: for an examination connected with a crime, Madde 40(1) sends the examination and the report to 5271 sayılı Ceza Muhakemesi Kanunu and its implementing rules. The report-purpose item is not carried to Adli Tıp. As a rule (esastır), a forensic examination and report are made on the proper request of a competent official authority (Madde 40(4)), and the report must answer the questions that authority asked (Madde 50(4)); the purpose of an adli rapor is therefore set by the requesting authority, in its request. The report rests wholly on the examining physician's own findings, consultations and test results (Madde 50(1)), and no report is drawn up on another person's statement (Madde 48(1)); neither provision bars the examined person's own account. Madde 52(5) bars referring a person to a private health service provider for an adli rapor. Whether Madde 8(5) reaches an adli rapor is moot for the product: Madde 8(5) is written for health reports in general, the content of an adli rapor is set by Madde 50, and the product sends no intake answer into an adli rapor (a product rule, stricter than the text; see the inference disclosure). The companion-invitation item held in the adli tıp pack stays held: as a rule, the physician and the person examined are alone during a forensic examination (Madde 48(3)). As built today, the Adli Tıp pack still inherits rapor_amaci — the branch taxonomy routes adli_tip to the allied_and_reports cluster, the adli_tip pack extends that cluster, and the cluster declares the slot — and only the pack's unserved L0 status (HB-C1) keeps it from a patient. Removing it from the resolved adli_tip pack is follow-up INT-473 (with sağlık kurulu keeping it as the near miss); this decision changes no pack. What an Adli Tıp pre-visit intake may ask in place of Q3 is not decided here."
legal_basis: "Sağlık Raporları Yönetmeliği (RG 19/5/2026, 33258) Madde 2(1), 39(1), 40(1), 40(4), 48(1), 48(3), 50(1), 50(4), 52(5) and the Dokuzuncu Bölüm heading; Madde 8(5) read against Madde 50."
status: proposed
scope: synthetic_test_only
scope_note: "Owner decision D25 (3 Oct 2026): agent-decided and agent-verified legal items, for synthetic and test use only. A licensed Turkish lawyer countersigns before any real patient."
question_origin: "docs/evidence/verification/cluster-wave-b.md §A.4 (row Q3, line 115): the legal-reviewer is asked whether AL-S1 governs forensic reports and whether the Madde 8(5) export bar covers Adli Tıp. The owner's D24 answer 4Y keeps Adli Tıp out of the report-purpose item until this review."
author_role: "Turkish health-law and forensic-medicine-procedure lawyer (agent)"
inference_disclosure: "Two readings here are this author's, not the text's. First, that the purpose of an adli rapor is the requesting authority's: Madde 40(4) and 50(4) together point there, but neither says a person may not state a purpose. Second, the product rule that no pre-visit intake answer, a purpose included, ever enters an adli rapor: the text bars only a report drawn up on another person's statement (Madde 48(1)) and makes the physician's own findings the report's basis (Madde 50(1)); it does not bar the examined person's own account, so the product rule is stricter than the law. Applying Madde 48(3), which governs the forensic examination itself, to a pre-visit companion-invitation item is also this author's extension. Whether a private-hospital tenant should run a forensic pre-visit intake at all is not decided; Madde 52(5) is cited only for referrals made to obtain an adli rapor."
