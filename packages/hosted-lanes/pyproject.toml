[project]
name = "intake-hosted-lanes"
version = "0.1.0"
description = "INT-428 / ADR-035: hosted provider adapters for the model lanes — SYNTHETIC deployment image only"
requires-python = ">=3.12"
# Nothing on the PHI deployment's closure depends on this package (a test
# holds it): it ships only in the synthetic deployment's image, which puts it
# on the path explicitly (infra/staging/Dockerfile.api). The platform sees it
# through intake_platform.model_lanes.hosted's Protocol, never by import.
dependencies = [
    "intake-platform",
    # INT-443: the hosted clip lane is a voice_clips TtsGateway (the PHI-path
    # package it implements; the dependency points away from the PHI closure)
    "intake-voice-clips",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intake_hosted_lanes"]
