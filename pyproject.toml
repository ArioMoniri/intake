[project]
name = "intake"
version = "0.1.0"
description = "INTAKE workspace root (virtual): Turkish-first, patient-owned pre-visit intelligence"
requires-python = ">=3.12"
dependencies = [
    "intake-platform[ner]",
    "intake-probes",
    "intake-clinical-schemas",
    "intake-api",
    "intake-protocols",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/intake_platform",
    "packages/clinical-schemas",
    "packages/protocols",
    "services/probes",
    "services/api",
]

[tool.uv.sources]
intake-platform = { workspace = true }
intake-probes = { workspace = true }
intake-clinical-schemas = { workspace = true }
intake-api = { workspace = true }
intake-protocols = { workspace = true }
# CI/linux gets CPU torch (the default PyPI wheel drags the full CUDA stack);
# macOS falls back to PyPI, which is CPU-only there anyway.
torch = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6.9",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "pre-commit>=3.8",
    "httpx>=0.27",
    "fakeredis[lua]>=2.23",
    "psycopg[binary]>=3.2",
    # INT-031 roundtrip tests validate exported JSON Schemas; MIT (LICENSE
    # blob verified in docs/evidence/INT-031.md), test-only, never on the
    # PHI path.
    "jsonschema>=4.23",
    # the services/api unit lane carries the INT-030 schema on SQLite
    "aiosqlite>=0.20",
    # INT-033 roundtrip property tests ("hypothesis roundtrip" is in the
    # acceptance). MPL-2.0 (LICENSE.txt blob verified in
    # docs/evidence/INT-033.md), test-only, never on the PHI path.
    "hypothesis>=6.112",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["files", ".claude/skills"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S105", "S106"]  # asserts + fixture credentials are the point of tests
# gh CLI invocations with fixed argv from our own backlog file — the "untrusted
# input"/partial-path findings do not apply; gh is resolved from PATH by design.
"scripts/backlog/**" = ["S603", "S607"]
"packages/*/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = [
    "packages/intake_platform/src",
    "packages/clinical-schemas/src",
    "packages/protocols/src",
    "services/probes/src",
    "services/api/src",
]

[[tool.mypy.overrides]]
# optional exporter, imported only when OTEL_EXPORTER_OTLP_ENDPOINT is set;
# the package is deliberately not a dependency (local-only default posture)
module = "opentelemetry.exporter.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# optional crash-reporter SDK (GlitchTip speaks the sentry protocol),
# imported only when INTAKE_GLITCHTIP_DSN is set AND the error_reporting
# flag is on (INT-023); guarded exactly like the OTLP exporter above
module = "sentry_sdk.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: needs the docker-compose dev tier (its own CI job; 05 §3)",
]

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs Core through greenlet_spawn; without the
# greenlet tracer every line the API executes past its first awaited DB call
# vanishes from the report (measured under-count, not a real gap — INT-197).
concurrency = ["thread", "greenlet"]
