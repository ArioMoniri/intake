# INT-439 / D19 — the owner's "make limit 80 dollars" (3 Oct 2026). A calendar
# month (UTC) of ELECTIVE model spend: council verifier members and hosted model
# lanes. Elective work is refused once the month-to-date spend reaches the
# limit and warns at warn_ratio of it; obligatory work (the first extraction of
# an answer the patient has just given) is counted and never refused.
spend_caps:
  - cap_id: elective-models-month
    covers: elective_model_spend
    period: calendar_month_utc
    limit:
      usd: 80
      source: "owner decision in chat, 3 Oct 2026: 'make limit 80 dollars' (HB-O8; 00_STATE §3 D19)"
      as_of: 2026-10-03
    warn_ratio: 0.8

# Which priced component each measure of a model lane's use is charged at. A
# rate holds no number: it points at components above, so one figure lives in
# one place.
model_rates:
  - rate_id: self-hosted-g6-2xlarge
    route: self_hosted
    provider: aws
    model: g6.2xlarge
    charges: {busy_seconds: gpu_host_onvizit_api}
    note: >-
      every self-hosted lane on an AWS g6.2xlarge host is charged for the host
      seconds the call occupied, at the on-demand host-hour price
  - rate_id: hosted-elevenlabs-multilingual-v2
    route: hosted
    provider: elevenlabs
    model: eleven_multilingual_v2
    charges: {characters: clip_synthesis}
    note: charged per character synthesised, at the published v2 Multilingual rate
  - rate_id: hosted-openai-gpt-4o-mini
    route: hosted
    provider: openai
    model: gpt-4o-mini
    charges: {input_tokens: hosted_llm_input, output_tokens: hosted_llm_output}
    note: the INT-428 hosted llm lane, charged per input and output token
  - rate_id: hosted-openai-gpt-4o-mini-transcribe
    route: hosted
    provider: openai
    model: gpt-4o-mini-transcribe
    charges: {input_tokens: hosted_asr_input, output_tokens: hosted_asr_output}
    note: the INT-428 hosted asr lane, charged per input and output token
