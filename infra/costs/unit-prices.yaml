# infra/costs/unit-prices.yaml — the cost module's only source of money (INT-190).
#
# OWNER-FILLED. A price or a limit is set only with a `source` (who said so: an
# invoice, a contract, a quote reference, or — since the owner's decision of
# 3 Oct 2026, 00_STATE §3 D19 — a vendor's published price page, whose `url` is
# then recorded and whose `as_of` is the day it was retrieved) and an `as_of`
# date. No agent writes a number that has no such source: a plausible invented
# price is worse than a missing one, because no diff makes it look wrong
# (files/HUMAN_BLOCKERS.md rule 1). HB-O8 is closed by D19 (INT-439).
#
# What an empty field does — it fails closed, never to zero:
# - a component with no price renders "price not configured" on the admin
#   console. Its cost is unknown, not 0, and every total it belongs to is
#   withheld rather than shown partial;
# - a budget with no limit renders "budget not configured", and
#   infra/observability/cost-rules.yaml carries a CostBudgetNotConfigured alert
#   for it that fires until the limit is set.
#
# Shape:
# - `currency` is pinned to USD because observability/metrics_catalog.yaml
#   denominates cost_per_session in USD.
# - `components`: one row per thing that costs money.
#   - `usage` names the CATALOGUED series that meters the component (CLAUDE.md
#     invariant 13) and how a quantity is read off it. `usage: null` means no
#     catalogued series meters it yet; `usage_note` says why.
#   - `profiles` lists the voice profiles a directly attributed component
#     spends in (invariant 19: residency_tr and typed are the only two). An
#     empty list means the component is shared, and the console allocates it
#     evenly across every session metered in the window.
#   - `vendor: null` means no vendor has been chosen; `vendor_note` says why.
#     Such a component counts toward the all-vendor budgets only.
#   - `price.usd_per_unit` is USD per ONE `unit`. The unit must agree with the
#     usage series' catalogued unit (tests/admin/test_cost_module.py holds it).
# - `budgets`: per vendor and for all vendors together, per day (rolling 1d)
#   and per month (rolling 30d, inside files/06 §3's 30 d hot telemetry window).
#
# After an edit, re-emit the alert rules and the console fixtures:
#   uv run python scripts/observability/cost_rules.py --emit infra/observability/cost-rules.yaml
#   uv run python scripts/dev/record_cost_fixture.py
# tests/observability/test_cost_rules.py and tests/admin/test_cost_module.py
# fail on drift.
schema_version: 1
currency: USD

components:
  - component: asr
    vendor: self-hosted
    vendor_note: null
    unit: audio_second
    profiles: [residency_tr]
    usage:
      metric: voice_stt_audio_s
      aggregation: histogram_sum
      selector: {vendor: self-hosted}
    usage_note: null
    price: {usd_per_unit: null, source: null, as_of: null}

  - component: tts_dynamic
    vendor: self-hosted
    vendor_note: null
    unit: character
    profiles: [residency_tr]
    usage:
      metric: voice_tts_chars
      aggregation: histogram_sum
      selector: {vendor: self-hosted}
    usage_note: null
    price: {usd_per_unit: null, source: null, as_of: null}

  - component: llm_talker
    vendor: self-hosted
    vendor_note: null
    unit: token
    profiles: [residency_tr, typed]
    usage:
      metric: voice_talker_tokens
      aggregation: histogram_sum
      selector: {vendor: self-hosted}
    usage_note: null
    price: {usd_per_unit: null, source: null, as_of: null}

  - component: llm_extraction
    vendor: self-hosted
    vendor_note: null
    unit: token
    profiles: [residency_tr, typed]
    usage: null
    usage_note: >-
      the INT-101 session ledger counts extract_slots tokens per session, and
      no catalogued series exports them (docs/evidence/INT-101.md F1)
    price: {usd_per_unit: null, source: null, as_of: null}

  - component: clip_synthesis
    vendor: elevenlabs
    vendor_note: null
    unit: character
    profiles: []
    usage: null
    usage_note: >-
      the offline scripted-clip build (ADR-028, make clips) has no catalogued
      synthesis series on main
    # eleven_multilingual_v2, the model packages/voice-clips pins: "v2
    # Multilingual" at $0.08 per 1K characters, the same in every plan column.
    price:
      usd_per_unit: 0.00008
      source: "ElevenLabs API pricing page, v2 Multilingual, $0.08 per 1K characters (owner decision D19)"
      as_of: 2026-10-03
      url: https://elevenlabs.io/pricing/api

  - component: sms
    vendor: null
    vendor_note: >-
      no SMS provider has been chosen: notification dispatch reports
      blocked_transport_unconfigured for the sms channel
    unit: message
    profiles: []
    usage:
      metric: notification_dispatch_total
      aggregation: counter_increase
      selector: {channel: sms, status: delivered}
    usage_note: null
    price: {usd_per_unit: null, source: null, as_of: null}

  - component: gpu_host_onvizit_api
    vendor: aws
    vendor_note: null
    unit: host_hour
    profiles: []
    usage: null
    usage_note: >-
      the dedicated AWS host of INT-352; no catalogued host-uptime series
      exists on main
    # g6.2xlarge (NVIDIA L4), us-east-1, Linux, shared tenancy, on-demand — the
    # instance type of both AWS hosts (onvizit-api and the qwen model server).
    price:
      usd_per_unit: 0.9776
      source: "AWS Price List API (AmazonEC2, US East (N. Virginia), g6.2xlarge Linux on-demand, publicationDate 2026-09-25T17:45:21Z; owner decision D19)"
      as_of: 2026-10-03
      url: https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonEC2/current/us-east-1/index.json

  - component: gpu_host_team
    vendor: null
    vendor_note: >-
      the team GPU server that serves the dev and synthetic model lanes
      (observability/registry.yaml); no provider or billing is recorded for it
    unit: host_hour
    profiles: []
    usage: null
    usage_note: no catalogued host-uptime series exists on main
    price: {usd_per_unit: null, source: null, as_of: null}

  # INT-428 / ADR-035: the hosted model lanes (synthetic tenants only, until
  # the GPU lanes are healthy). Metered by the catalogued model_lane_* series
  # the routed gateways emit; priced by the owner from the provider's invoice
  # or price list, with its source and date — empty until then.
  - component: hosted_llm_input
    vendor: openai
    vendor_note: null
    unit: token
    profiles: []
    usage:
      metric: model_lane_tokens_total
      aggregation: counter_increase
      selector: {lane: llm, provider: openai, direction: input}
    usage_note: null
    price:
      usd_per_unit: 0.00000015
      source: "OpenAI API pricing page, gpt-4o-mini input, $0.15 per 1M tokens, standard tier (owner decision D19)"
      as_of: 2026-10-03
      url: https://developers.openai.com/api/docs/pricing

  - component: hosted_llm_output
    vendor: openai
    vendor_note: null
    unit: token
    profiles: []
    usage:
      metric: model_lane_tokens_total
      aggregation: counter_increase
      selector: {lane: llm, provider: openai, direction: output}
    usage_note: null
    price:
      usd_per_unit: 0.0000006
      source: "OpenAI API pricing page, gpt-4o-mini output, $0.60 per 1M tokens, standard tier (owner decision D19)"
      as_of: 2026-10-03
      url: https://developers.openai.com/api/docs/pricing

  - component: hosted_asr_input
    vendor: openai
    vendor_note: null
    unit: token
    profiles: []
    usage:
      metric: model_lane_tokens_total
      aggregation: counter_increase
      selector: {lane: asr, provider: openai, direction: input}
    usage_note: null
    price:
      usd_per_unit: 0.00000125
      source: "OpenAI API pricing page, gpt-4o-mini-transcribe input, $1.25 per 1M tokens, standard tier (owner decision D19)"
      as_of: 2026-10-03
      url: https://developers.openai.com/api/docs/pricing

  - component: hosted_asr_output
    vendor: openai
    vendor_note: null
    unit: token
    profiles: []
    usage:
      metric: model_lane_tokens_total
      aggregation: counter_increase
      selector: {lane: asr, provider: openai, direction: output}
    usage_note: null
    price:
      usd_per_unit: 0.000005
      source: "OpenAI API pricing page, gpt-4o-mini-transcribe output, $5.00 per 1M tokens, standard tier (owner decision D19)"
      as_of: 2026-10-03
      url: https://developers.openai.com/api/docs/pricing

  - component: hosted_tts
    vendor: openai
    vendor_note: null
    unit: character
    profiles: []
    usage:
      metric: model_lane_characters_total
      aggregation: counter_increase
      selector: {lane: tts, provider: openai}
    usage_note: >-
      the speech route reports no usage; characters sent are what is metered,
      so the owner's per-character price is derived from the provider's
      invoice for the same period. gpt-4o-mini-tts has no per-character list
      price (only text-input and audio-output tokens, which the route does not
      report), so this row stays empty and the hosted TTS lane is refused under
      the monthly cap until it is priced (INT-439)
    price: {usd_per_unit: null, source: null, as_of: null}

