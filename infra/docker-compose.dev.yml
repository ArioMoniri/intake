# P0 dev tier (INT-001). EHRbase is NOT here: openEHR is a P3 export (00 §3 D8).
# OpenBao (INT-017), the observability profile (INT-023) and the security stack
# (infra/security) join with their own issues. Ports bind to loopback only.
name: intake-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intake-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-intake}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-intake} -d $${POSTGRES_DB:-intake}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  hapi:
    # HAPI FHIR JPA starter. The image is distroless (no shell/curl), so the
    # healthcheck is a single-file Java probe (JEP 330) mounted read-only.
    image: hapiproject/hapi:v7.2.0
    environment:
      hapi.fhir.fhir_version: R4
    ports:
      # host 8091: 8080 is commonly taken on dev machines (and was, on the
      # owner's). In-container stays 8080; the probe checks the container side.
      - "127.0.0.1:8091:8080"
    volumes:
      - ./hapi/HealthProbe.java:/probe/HealthProbe.java:ro
    healthcheck:
      test: ["CMD", "java", "/probe/HealthProbe.java"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-intake-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-intake-dev-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # this MinIO image ships no curl; `mc ready local` is the vendor check
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  openbao:
    # Dev-mode server (in-memory, auto-unsealed). .env carries only the
    # address/token pointer; scripts/security/openbao_dev_setup.sh configures
    # the database engine (24h roles) and per-service policies (INT-017).
    image: openbao/openbao:2.0.2
    command: server -dev -dev-root-token-id=${OPENBAO_TOKEN:-intake-dev-root} -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 12

  clamav:
    # INT-120: the upload pipeline's malware verdict. Behind a profile — the
    # image ships the whole signature database (hundreds of MB), and the unit
    # lane never needs it (an in-test fake clamd covers the protocol).
    # `make check-integration` activates the profile. Freshclam is disabled:
    # dev/CI scans fixtures against the baked-in database and must not hammer
    # the signature CDN on every boot. The -debian variant is the multi-arch
    # one (the alpine-based default tags publish amd64 only — no arm64 dev
    # machines otherwise).
    image: clamav/clamav:1.4.6-debian
    profiles: ["clamav"]
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    ports:
      - "127.0.0.1:3310:3310"
    healthcheck:
      # clamdcheck.sh ships in the image (it backs the image's own HEALTHCHECK)
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  livekit:
    # INT-090: LiveKit SFU + embedded TURN (UDP), dev tier. Behind a profile
    # like clamav — the unit lane never boots it (tests/voice/ validates the
    # config and this service statically); start it explicitly when driving a
    # real voice session: `docker compose -f infra/docker-compose.dev.yml
    # --profile livekit up -d`. v1.13.6 verified to exist on Docker Hub and
    # via `docker manifest inspect` (multi-arch, alpine-based — busybox wget
    # backs the healthcheck). Recording is structurally impossible here: no
    # egress/ingress/recorder service exists in this file, the container
    # mounts nothing writable, and livekit-dev.yaml carries no redis/webhook
    # block (invariant 3; tests/voice/test_audio_retention_guard.py).
    image: livekit/livekit-server:v1.13.6
    profiles: ["livekit"]
    command: --config /etc/livekit/livekit-dev.yaml
    environment:
      # dev-only pair, env-overridable; the prod pair comes from OpenBao and
      # never enters a committed file (invariant 14). Format: "key: secret".
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-intake-dev-key}: ${LIVEKIT_API_SECRET:-intake-livekit-dev-only-secret-0001}"
    ports:
      - "127.0.0.1:7880:7880" # websocket signalling + RoomService API
      - "127.0.0.1:7881:7881" # ICE over TCP (UDP-blocked networks)
      - "127.0.0.1:3478:3478/udp" # embedded TURN, UDP only (dev tier)
      - "127.0.0.1:50700-50720:50700-50720/udp" # RTC media (narrow dev range)
    volumes:
      - ./livekit/livekit-dev.yaml:/etc/livekit/livekit-dev.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  miniodata:
