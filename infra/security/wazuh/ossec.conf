<!--
  INT-205 - the Wazuh manager configuration (files/10 §6, §7; CLAUDE.md
  inv. 6, 13, 14, 15, 19).

  Licence note (invariant 19): Wazuh is GPL-2.0-only with an OpenSSL linking
  exception, and its LICENSE says in terms that it covers "decoders, rules and
  any other data file included with Wazuh". This file is ours and reuses no
  Wazuh decoder or rule text; see the `wazuh-manager` row of
  observability/registry.yaml for the blob, its sha256 and the full finding.

  Three sources are ingested and all three are json, so the manager decodes
  fields instead of scraping a line with a regex. That matters here more than
  usual: a line this manager reads may be a log line from a service on the PHI
  path, and a regex that captures "the rest of the line" would put it in an
  alert (invariant 6).

    /var/log/falco/events.json      Falco, over the shared volume
    /var/log/kubernetes/audit.log   the k8s audit log (INT-201 stands the
                                    cluster up; the stanza is here so the
                                    manager is ready rather than edited later)
    /var/log/intake/security.json   our own services' security events, which
                                    files/10 §6 routes here by name

  Deliberately absent, each for a reason:

    a log-rotation   no retention window for the alert store exists. files/06
    block            §3's matrix has no row for it; INT-212 owns the answer and
                     intake_platform.siem refuses to deploy without one. Until
                     then the store expires nothing, which loses no evidence.
                     The rotation element and its size bound are deliberately
                     not written anywhere in this file so the check can be a
                     plain substring scan.
    email_notification  a mail relay is an egress path out of the PHI network
                     and there is no allow-list entry for one.
    update_check     Wazuh checks cti.wazuh.com for updates on start. That is a
                     vendor call from inside the PHI network (files/08 §9: "no
                     vendor network").
    vulnerability-detection  it downloads CTI feeds. Vulnerability scanning is
                     already a CI gate (Trivy/OSV, files/10 §8) where it needs
                     no egress from production.
    <cluster>        one manager. A cluster key would be a secret in this file.
-->
<ossec_config>

  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <update_check>no</update_check>
  </global>

  <alerts>
    <!-- Level 3 and up reach alerts.json. Wazuh's own scale: 0-2 are ignored
         and system-low notifications, 3 is the first level that names an
         event. This is the vendor's floor, not a threshold of ours. -->
    <log_alert_level>3</log_alert_level>
  </alerts>

  <!-- Falco, over the volume both containers mount. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/falco/events.json</location>
  </localfile>

  <!-- The k8s audit log. INT-201 lands the cluster and the audit policy; this
       stanza is what it mounts into. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/kubernetes/audit.log</location>
  </localfile>

  <!-- Our own services' security events (files/10 §6: "security events to
       Wazuh"). The emitting side is bound by invariant 6 and the runtime PHI
       scan; this side reads ids only, and the feed drops anything else. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/intake/security.json</location>
  </localfile>

  <!-- The manager's own log, in the same shape as everything it reads. -->
  <logging>
    <log_format>json</log_format>
  </logging>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <vulnerability-detection>
    <enabled>no</enabled>
  </vulnerability-detection>

  <!-- File integrity on the detection stack's own configuration. Falco covers
       the write syscall; this covers the case where the write happened while
       Falco was not running. -->
  <syscheck>
    <disabled>no</disabled>
    <directories check_all="yes" realtime="yes">/var/ossec/etc</directories>
    <directories check_all="yes" realtime="yes">/etc/falco</directories>
  </syscheck>

  <rootcheck>
    <disabled>no</disabled>
  </rootcheck>

</ossec_config>
