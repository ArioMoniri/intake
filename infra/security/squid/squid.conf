# --- listener ----------------------------------------------------------------
http_port 3128
visible_hostname intake-forward-proxy

# --- who may ask -------------------------------------------------------------
acl intake_clients src 10.0.0.0/8
acl intake_clients src 172.16.0.0/12
acl intake_clients src 192.168.0.0/16
acl intake_clients src fc00::/7
acl CONNECT method CONNECT

# --- ports the allow-list names ----------------------------------------------
acl port_443 port 443

# --- denied before anything else ----------------------------------------------
# An open relay, the proxy's own manager interface, and the two destination
# classes files/10 §4 names outright: loopback and link-local (which is where
# 169.254.169.254 lives). A bare IP destination matches no dstdomain rule and
# falls through to `deny all` regardless.
http_access deny !intake_clients
http_access deny manager
http_access deny to_localhost
http_access deny to_linklocal
http_access deny !CONNECT

# --- the allow-list, tier `dev` ---
# pytorch-wheel-index — CPU torch wheels for the deid NER tier (uv index, pyproject)
#   basis: no-personal-data; public package registry pull
acl vendor_pytorch_wheel_index dstdomain download.pytorch.org
http_access allow CONNECT intake_clients vendor_pytorch_wheel_index port_443
# pypi — Python package index metadata (uv/pip resolution)
#   basis: no-personal-data; public package registry pull
acl vendor_pypi dstdomain pypi.org
http_access allow CONNECT intake_clients vendor_pypi port_443
# pypi-files — Python package artefact downloads
#   basis: no-personal-data; public package registry pull
acl vendor_pypi_files dstdomain files.pythonhosted.org
http_access allow CONNECT intake_clients vendor_pypi_files port_443
# npm-registry — Node package downloads (pnpm workspaces)
#   basis: no-personal-data; public package registry pull
acl vendor_npm_registry dstdomain registry.npmjs.org
http_access allow CONNECT intake_clients vendor_npm_registry port_443
# github — git fetch/push of this repository
#   basis: no-personal-data; source code only (invariant 6 keeps PHI out of the repo)
acl vendor_github dstdomain github.com
http_access allow CONNECT intake_clients vendor_github port_443
# github-objects — GitHub release/LFS artefact downloads
#   basis: no-personal-data; build artefact pull
acl vendor_github_objects dstdomain objects.githubusercontent.com
http_access allow CONNECT intake_clients vendor_github_objects port_443
# github-api — gh CLI (issues/PR sync per LOOP.md)
#   basis: no-personal-data; issue metadata only
acl vendor_github_api dstdomain api.github.com
http_access allow CONNECT intake_clients vendor_github_api port_443
# huggingface-hub — model weight pulls, pinned by model_id@revision + sha256 (invariant 14)
#   basis: no-personal-data; open-weights model pull (invariant 19)
acl vendor_huggingface_hub dstdomain huggingface.co
http_access allow CONNECT intake_clients vendor_huggingface_hub port_443
# huggingface-lfs-cdn — model weight LFS payloads for huggingface-hub pulls
#   basis: no-personal-data; open-weights model pull (invariant 19)
acl vendor_huggingface_lfs_cdn dstdomain cdn-lfs.huggingface.co
http_access allow CONNECT intake_clients vendor_huggingface_lfs_cdn port_443
# huggingface-lfs-cdn-regional — regional LFS CDN (cdn-lfs-*.hf.co) for huggingface-hub pulls
#   basis: no-personal-data; open-weights model pull (invariant 19)
acl vendor_huggingface_lfs_cdn_regional dstdom_regex -i ^.+\.hf\.co$
http_access allow CONNECT intake_clients vendor_huggingface_lfs_cdn_regional port_443

# --- the vendor-transfer register feed (files/10 §5; TRANSFER-2024) -----------
# {ts, host, port, decision, bytes_out} and nothing else. %>rd and %>rP are the
# destination host and port; the path-bearing codes (%ru, %rp and their
# variants) and every client-identity code are absent by construction —
# invariant 6, and a query string is exactly where an identifier would leak.
# Purpose and legal basis are joined per host from the allow-list row.
logformat intake_transfer ts=%ts.%03tu host=%>rd port=%>rP decision=%Ss bytes_out=%>st reason=%err_code
access_log stdio:/dev/stdout intake_transfer
cache_log stdio:/dev/stderr

# --- the proxy stores nothing and identifies nobody ---------------------------
# A caching egress proxy is a store of response bodies, and a forwarded client
# identity is a record of who inside asked. Neither belongs on the PHI path.
cache deny all
forwarded_for delete
via off
httpd_suppress_version_string on

# --- default deny --------------------------------------------------------------
http_access deny all
