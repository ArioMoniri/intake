# INT-018 — vendor egress allow-list (files/10 §4; CLAUDE.md invariants 14 & 19).
#
# This file is DATA, not code, and it is the ONLY source both enforcement
# points read: `intake_platform.egress` loads and validates it in process, and
# `scripts/security/render_egress_proxy_conf.py` renders it into the dev
# forward proxy's squid.conf (infra/docker-compose.egress.yml, profile
# `egress`). One CI test fails when the rendered config is stale; another
# decides a table of hosts through both paths, so the two cannot drift.
# Default deny — a host absent from the active tier is unreachable. Globs
# match only when an entry says `glob: true`, and only in the leading
# "*.label" form.
#
# `purpose_id` is a closed vocabulary (intake_platform.egress.EgressPurpose),
# not prose: a caller declares the purpose it is calling for, and an
# allow-listed host addressed for a different purpose is refused as firmly as
# an unlisted one. The prose `purpose:` line stays as the human and KVKK
# statement of the same thing, and `basis:` as the lawful basis.
#
# Every change here is a security-relevant change: files/10 §4 makes the list
# tier-2 configuration, files/10 §5 pages on egress-allow-list changes, and
# the file is hook-protected (07 §3.8) so it changes only deliberately. The
# `purpose_id` column was added under ADR-025.
version: 1
tiers:
  # Dev/build tooling: package and model registries. None of these ever sees
  # personal data — phi_allowed stays false on every row, enforced by test,
  # which is also what refuses a PHI-classed call to any of them.
  dev:
    - name: pytorch-wheel-index
      host: download.pytorch.org
      port: 443
      protocol: https
      purpose_id: package_registry
      purpose: CPU torch wheels for the deid NER tier (uv index, pyproject)
      phi_allowed: false
      basis: no-personal-data; public package registry pull
    - name: pypi
      host: pypi.org
      port: 443
      protocol: https
      purpose_id: package_registry
      purpose: Python package index metadata (uv/pip resolution)
      phi_allowed: false
      basis: no-personal-data; public package registry pull
    - name: pypi-files
      host: files.pythonhosted.org
      port: 443
      protocol: https
      purpose_id: package_registry
      purpose: Python package artefact downloads
      phi_allowed: false
      basis: no-personal-data; public package registry pull
    - name: npm-registry
      host: registry.npmjs.org
      port: 443
      protocol: https
      purpose_id: package_registry
      purpose: Node package downloads (pnpm workspaces)
      phi_allowed: false
      basis: no-personal-data; public package registry pull
    - name: github
      host: github.com
      port: 443
      protocol: https
      purpose_id: source_control
      purpose: git fetch/push of this repository
      phi_allowed: false
      basis: no-personal-data; source code only (invariant 6 keeps PHI out of the repo)
    - name: github-objects
      host: objects.githubusercontent.com
      port: 443
      protocol: https
      purpose_id: source_control
      purpose: GitHub release/LFS artefact downloads
      phi_allowed: false
      basis: no-personal-data; build artefact pull
    - name: github-api
      host: api.github.com
      port: 443
      protocol: https
      purpose_id: issue_tracking
      purpose: gh CLI (issues/PR sync per LOOP.md)
      phi_allowed: false
      basis: no-personal-data; issue metadata only
    - name: huggingface-hub
      host: huggingface.co
      port: 443
      protocol: https
      purpose_id: model_weights
      purpose: model weight pulls, pinned by model_id@revision + sha256 (invariant 14)
      phi_allowed: false
      basis: no-personal-data; open-weights model pull (invariant 19)
    - name: huggingface-lfs-cdn
      host: cdn-lfs.huggingface.co
      port: 443
      protocol: https
      purpose_id: model_weights
      purpose: model weight LFS payloads for huggingface-hub pulls
      phi_allowed: false
      basis: no-personal-data; open-weights model pull (invariant 19)
    - name: huggingface-lfs-cdn-regional
      host: "*.hf.co"
      glob: true
      port: 443
      protocol: https
      purpose_id: model_weights
      purpose: regional LFS CDN (cdn-lfs-*.hf.co) for huggingface-hub pulls
      phi_allowed: false
      basis: no-personal-data; open-weights model pull (invariant 19)
    # ADR-035 (owner decision, 2 Oct 2026); INT-428, INT-442, INT-443. The
    # hosted lanes' vendors, for the SYNTHETIC deployment only. phi_allowed
    # stays false, so a PHI-classed call is refused here as well as by the
    # ADR-035 guard. The synthetic host's forward proxy
    # (infra/staging/egress/squid.conf) renders these two rows and nothing
    # else; the build proxy never renders them. Removed when ADR-035 reverts.
    - name: openai-api
      host: api.openai.com
      port: 443
      protocol: https
      purpose_id: hosted_model_inference
      purpose: hosted LLM, ASR and TTS lanes for synthetic tenants only (ADR-035)
      phi_allowed: false
      basis: no-personal-data; synthetic deployment only (ADR-035)
    - name: elevenlabs-api
      host: api.elevenlabs.io
      port: 443
      protocol: https
      purpose_id: hosted_model_inference
      purpose: hosted TTS of scripted catalogue text, synthetic deployment only (ADR-035, INT-443)
      phi_allowed: false
      basis: no-personal-data; scripted non-patient text, synthetic deployment only (ADR-035)

  # The PHI path is self-hosted end to end (invariant 19 / 00_STATE D11, and
  # 07 §F: "no external model or speech vendor on the list at all"): every
  # model and service that touches clinical data runs inside our boundary, so
  # there is NO vendor host a PHI-path service may reach and this list stays
  # empty. infra/docker-compose.egress.yml says the same thing in the only
  # language Docker enforces — the `phi` network is `internal: true` and the
  # proxy is not attached to it, so an empty tier is a topology fact rather
  # than a promise. Adding a row here requires a phi_exception_approval
  # naming a recorded human decision AND INTAKE_ALLOW_PHI_EGRESS=explicit-yes
  # at runtime AND a deliberate change to that topology — and never one of the
  # anthropic/openai/google API hosts, which assert_dev_only_vendors()
  # refuses outright.
  phi_path: []
