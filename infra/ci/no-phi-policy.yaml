# INT-206 — the no-PHI-in-CI policy, as data (CLAUDE.md invariant 6; files/06
# §5 "CI: no PHI, synthetic fixtures, TR-DC runners"; files/10 §8).
#
# The engine is intake_platform.ci; this file is everything it refuses to
# infer. Six surfaces are checked — fixtures, env, logs, artefacts, cache and
# runners — and each list below is the whole of what is permitted on one of
# them. A list that is empty means the surface is closed, not unchecked.
#
# WHAT A DECLARATION COSTS. A corpus row is pinned by sha256, so a new
# identifier can only reach CI's fixture inputs through a reviewed change to
# this file. Re-declaring a corpus after editing it is a deliberate act with a
# diff, which is the entire control: the previous shape of this gate — "scan
# fixtures for patterns" — proves only that we can author clean fixtures
# (files/10 §3, invariant 36 makes the same point about the runtime scan).
#
# Scope is CI's data inputs, on purpose. The runtime PHI scan over live
# responses is invariant 36 and belongs to the admin console; the full
# security gate set (gitleaks, Semgrep, Trivy, cosign, and `make security`
# itself) is INT-019. This file is neither of those.

# The trees CI reads as data. Everything under them is scanned; a file that
# carries an identifier-shaped value must appear in synthetic_corpora below.
scanned_trees:
  - tests/fixtures

# Every file in a scanned tree that legitimately carries identifier-shaped
# values, with where it came from, what licence it carries, and what it
# hashed to when a human read it.
synthetic_corpora:
  - path: tests/fixtures/deid/pattern_corpus.jsonl
    origin: authored
    provenance: >-
      Authored for INT-015 as the pattern tier's span-labelled gate corpus.
      Every TC Kimlik in it is checksum-valid and belongs to nobody; the
      phones, IBANs and e-mails are constructed the same way, alongside
      distractor strings that are deliberately NOT identifiers.
    licence: proprietary (repo LICENSE)
    sha256: c6bc35e7ba1dc03acf23c7f7a3a6d2bbcd6036ddff3780c3db16a1c8870065b3

  - path: tests/fixtures/deid/vendor/pii_corpus.jsonl
    origin: vendored
    provenance: >-
      Hugging Face dataset fevziegeyurtsevenler/turkish-pii-corpus, revision
      2e770a8321133c6cc135f6cb3f8cd2212ea76604 — fully synthetic, checksum-valid,
      span-labelled Turkish PII. Recorded in tests/fixtures/deid/vendor/ATTRIBUTION.md,
      whose stated sha256 is the one pinned here.
    licence: Apache-2.0
    sha256: eadadcb559c1f14dac1e5878cf33433aca7eacf9608af88d5530b139cfb9a31a

  - path: tests/fixtures/deid/vendor/btx24_test_sample400.jsonl
    origin: vendored
    provenance: >-
      First 400 rows of the test split of Hugging Face dataset
      BTX24/turkish-privacy-pii-ner, revision
      45a8e18edb57224b14368c910f701e064dbb1326 — machine-generated synthetic,
      no real persons, held out from the NER model's training split. Recorded in
      tests/fixtures/deid/vendor/ATTRIBUTION.md, whose stated sha256 is pinned here.
    licence: CC-BY-4.0
    sha256: 903e7616732539e01ea0f21848657bf4bd25422504339399a454ff677dae243a

  - path: tests/fixtures/logs/app_lines.txt
    origin: authored
    provenance: >-
      Authored for INT-011 as the redaction pipeline's fixture log. It carries the
      canonical synthetic TC Kimlik this repo uses everywhere for scrub tests, a
      constructed TR mobile and a constructed IBAN, plus an 11-digit order id that
      must survive redaction untouched. The identifiers are not repeated here: a
      declaration that quotes what it declares becomes a second copy of it.
    licence: proprietary (repo LICENSE)
    sha256: a1d1f7fb6eabb87453f01abb422dc295905ab290fe0c7c82af38235929f06eb9

# Paths a workflow may hand to actions/cache. A cache outlives the job and is
# restorable by any later job on the repository, so what may enter one is a
# closed list rather than a convenience.
cache_paths:
  # INT-015's pinned de-identification NER artefact: model weights, fetched
  # from this repo's own release and verified against a pinned sha256.
  - .cache/deid-tr-ner-v1

# Paths a workflow may hand to actions/upload-artifact. An artefact is
# downloadable for its whole retention window by anyone with read access to
# the repository, which is a wider audience than the job log.
artefact_paths:
  # INT-019's release SBOM and the cosign bundle that signs it. Publishing the
  # SBOM is the point of invariant 14, so the question is only whether it can
  # carry PHI. It cannot: syft derives it from the dependency tree, and the
  # generated document names zero paths under tests/fixtures or docs/ (checked
  # on the real artefact, 1487 packages / 751 files, docs/evidence/INT-019.md).
  # Read honestly: the SBOM does contain one 11-digit run that satisfies the
  # TCKN checksum, and it is a decimal substring of a package's SHA1 — which is
  # what a coincidence looks like at this scale, not an identifier.
  - intake-sbom.spdx.json
  - intake-sbom.spdx.json.cosign.bundle

# Repository or organisation secrets a workflow may reference. CI carries no
# secrets by design (.github/workflows/ci.yml header; CLAUDE.md "never call
# paid/live APIs in tests or CI"), and `github.token` is not one of these — it
# is the ephemeral, permission-scoped job token, declared per workflow.
permitted_secrets: []
