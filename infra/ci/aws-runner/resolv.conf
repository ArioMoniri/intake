# INT-467 — /etc/resolv.conf for jobs, bound read-only into intake-aws-ci-job@.
# A job runs in its runner's detached network namespace, where the host's
# resolver (127.0.0.53) does not exist; slirp4netns's forwarder answers here
# and resolves through the host's resolvers, which the egress chain allows.
nameserver 10.0.2.3
