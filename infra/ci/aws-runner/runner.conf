# INT-463, INT-467 — fixed settings for the pool of intake-aws-ci GitHub Actions
# runners on the AWS host (i-0e489e48739f5de98). Every script in this directory
# sources it. No secret lives here. The admin token lives in SSM
# (REGISTRAR_PARAM) and is read only by the root supervisor; a one-hour fallback
# token, if any, is root-only under SECRET_DIR. Neither enters the repository.

# The runners in the pool. Each instance N is its own runner, and guard.sh
# instance_env derives everything that must not be shared from N:
#   user          ghrunnerN, unprivileged, its own subordinate id range
#                 (SUBID_BASE + (N-1) x SUBID_COUNT; ubuntu holds 100000:65536)
#   name          intake-aws-ci-N, also its network namespace (/run/netns/...)
#   CI root       CI_ROOT_BASE-N on the NVMe volume
#   Docker        a rootless daemon under DOCKER_RUN_BASE-N
#   egress chain  NET_CHAIN_BASE-N, matched on ghrunnerN
#   units         intake-aws-ci-{runner,job,dockerd,diskwatch}@N
# All of them share the one intake-aws-ci.slice ceiling.
POOL_INSTANCES="1 2 3"
RUNNER_USER_PREFIX=ghrunner
RUNNER_NAME_PREFIX=intake-aws-ci-
SUBID_BASE=165536
SUBID_COUNT=65536

REPO_SLUG=ArioMoniri/intake
REPO_URL=https://github.com/ArioMoniri/intake
# Each runner keeps its default labels (self-hosted, Linux, X64) and adds this
# one. Workflows select [self-hosted, linux, intake-aws-ci], so any idle runner
# of the pool takes the next job. Labels match case-insensitively, and the GPU
# runner (intake-gpu) never carries this one.
RUNNER_LABELS=intake-aws-ci

# The registrar: the owner's fine-grained token (this repository only,
# Administration: read and write), a SecureString the instance role can read.
REGISTRAR_PARAM=/intake/staging/gh_runner_admin_pat
REGISTRAR_REGION=us-east-1

# actions/runner, pinned. The sha256 is the release page's linux-x64 value,
# and it matches the asset digest the GitHub API reports.
RUNNER_VERSION=2.337.0
RUNNER_SHA256=70920811a4f8ad4328818682bca5c6469c1c942fab52448868071d0063816613
# gh CLI, which `make deid-model` needs (gh release download). The sha256
# matches both the release checksums file and the asset digest.
GH_VERSION=2.102.0
GH_SHA256=bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386

# Everything a runner writes lives on the instance-store NVMe volume, never on
# the root disk. The units mount the root file system read-only for the runner
# (ProtectSystem=strict), so the root disk cannot be filled by a job.
NVME_MOUNT=/opt/dlami/nvme
CI_ROOT_BASE=/opt/dlami/nvme/intake-aws-ci
LIB_DIR=/usr/local/lib/intake-aws-ci-runner
SECRET_DIR=/etc/intake-aws-ci-runner
DOCKER_RUN_BASE=/run/intake-aws-ci
NET_CHAIN_BASE=INTAKE-AWS-CI-OUT

# Disk guard thresholds, in GiB and percent. The volume is shared, so every
# runner checks the same free space before it takes a job.
MIN_FREE_CI_GB=40
MIN_FREE_ROOT_GB=15
PRUNE_ABOVE_USED_PCT=60
WATCH_FLOOR_CI_GB=20
WATCH_FLOOR_ROOT_GB=8

# Paths the runner user must never read or traverse. The guard denies each one
# with an ACL entry, then proves the denial as that user before a job may
# start. A glob is expanded at check time, so new release directories are
# covered too.
SENSITIVE_PATHS="/opt/intake /opt/intake.* /opt/onvizit-releases /etc/intake-staging /etc/intake-aws-ci-runner /var/lib/intake-ci /var/lib/docker /var/lib/containerd /var/lib/amazon /var/log/amazon /var/lib/cloud /home/ubuntu /root"
# Every other runner's CI root and Docker run directory, the single-runner tree
# included while it exists. The guard denies them the same way; a runner's own
# two are left out at check time.
PEER_PATHS="$CI_ROOT_BASE $CI_ROOT_BASE-* $DOCKER_RUN_BASE $DOCKER_RUN_BASE-*"

# The INT-463 single-runner layout, which install.sh removes before it creates
# instance 1: that runner takes the old user's subordinate id range.
LEGACY_RUNNER_USER=ghrunner
LEGACY_CI_ROOT=/opt/dlami/nvme/intake-aws-ci
LEGACY_NET_CHAIN=INTAKE-AWS-CI-OUT

# The isolation probe (probe.sh): every runner publishes this port at once from
# this image, pinned by its registry digest (Renovate keeps it current).
PROBE_IMAGE="docker.io/library/busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e"
PROBE_PORT=15432
