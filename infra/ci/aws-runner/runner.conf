# INT-463 — fixed settings for the intake-aws-ci GitHub Actions runner on the
# AWS host (i-0e489e48739f5de98). Every script in this directory sources it.
# No secret lives here. The registration credential is root-only, under
# SECRET_DIR on the host, and never enters the repository.

# The dedicated unprivileged user every job runs as. It is in no
# sudo/docker/adm group, and its home, work and temp live on CI_ROOT.
RUNNER_USER=ghrunner
# The subordinate uid/gid range for rootless Docker (ubuntu holds 100000:65536).
SUBID_START=165536
SUBID_COUNT=65536

REPO_SLUG=ArioMoniri/intake
REPO_URL=https://github.com/ArioMoniri/intake
# The runner keeps its default labels (self-hosted, Linux, X64) and adds this
# one. Workflows select [self-hosted, linux, intake-aws-ci]. Labels match
# case-insensitively, and the GPU runner (intake-gpu) never carries this one.
RUNNER_LABELS=intake-aws-ci
RUNNER_NAME=intake-aws-ci-1

# actions/runner, pinned. The sha256 is the release page's linux-x64 value,
# and it matches the asset digest the GitHub API reports.
RUNNER_VERSION=2.337.0
RUNNER_SHA256=70920811a4f8ad4328818682bca5c6469c1c942fab52448868071d0063816613
# gh CLI, which `make deid-model` needs (gh release download). The sha256
# matches both the release checksums file and the asset digest.
GH_VERSION=2.102.0
GH_SHA256=bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386

# Everything the runner writes lives on the instance-store NVMe volume, never
# on the root disk. The units mount the root file system read-only for the
# runner (ProtectSystem=strict), so the root disk cannot be filled by a job.
NVME_MOUNT=/opt/dlami/nvme
CI_ROOT=/opt/dlami/nvme/intake-aws-ci
LIB_DIR=/usr/local/lib/intake-aws-ci-runner
SECRET_DIR=/etc/intake-aws-ci-runner
DOCKER_RUN_DIR=/run/intake-aws-ci

# Disk guard thresholds, in GiB and percent.
MIN_FREE_CI_GB=40
MIN_FREE_ROOT_GB=15
PRUNE_ABOVE_USED_PCT=60
WATCH_FLOOR_CI_GB=20
WATCH_FLOOR_ROOT_GB=8

# Paths the runner user must never read or traverse. The guard denies each one
# with an ACL entry, then proves the denial as that user before a job may
# start. A glob is expanded at check time, so new release directories are
# covered too.
SENSITIVE_PATHS="/opt/intake /opt/intake.* /opt/onvizit-releases /etc/intake-staging /etc/intake-aws-ci-runner /var/lib/intake-ci /var/lib/docker /var/lib/containerd /var/lib/amazon /var/log/amazon /var/lib/cloud /home/ubuntu /root"
