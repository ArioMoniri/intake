# infra/observability/security-rules.yaml — security countdown alerts
# (INT-367; files/10 §3 "key rotation quarterly", §6 "docs/runbooks/ linked
# from every alert", §7 "secret-rotation and certificate-expiry countdowns").
#
# Hand-written, not generated: each rule is pinned by the test named beside
# it, and every series it reads is catalogued in
# observability/metrics_catalog.yaml (CLAUDE.md invariant 13).
groups:
- name: security-countdowns
  rules:
  # tests/security/test_rotation_schedule.py. The scheduled rotation
  # (intake_platform.key_rotation) re-arms the countdown whenever it rotates
  # a key, so the gauge goes below zero only when a due rotation did not
  # happen: the rotate failed, or nothing ran the job.
  - alert: SecretRotationOverdue
    expr: sec_secret_rotation_due_days < 0
    labels:
      severity: ticket
    annotations:
      summary: 'tenant KEK {{ $labels.key }} is past its quarterly rotation'
      description: >-
        The key's latest Transit version is more than a quarter old (files/10
        §3). Every ciphertext still decrypts; the rotation is late, not
        destructive.
      runbook: docs/runbooks/key-rotation.md#overdue
  # tests/observability/test_alert_rules.py (INT-021 close-out). files/08 §5
  # pages on "audit-chain verification failure". The INT-016 daily verifier
  # (intake_platform.audit_verifier) sets the gauge to 0 on a broken chain AND
  # when no external anchor was supplied (HB-I12): a chain checked only
  # against itself is not a verified chain, so both page. Until the close-out
  # nothing read the gauge, although the job's own docstring said it paged.
  - alert: AuditChainVerificationFailed
    expr: sec_audit_chain_ok == 0
    labels:
      severity: page
    annotations:
      summary: 'the daily audit-chain verification did not verify the chain'
      description: >-
        Either the hash chain does not hold (exit 2) or no externally anchored
        head was supplied to check it against (exit 3). Neither is copied to
        the WORM bucket.
      runbook: docs/runbooks/audit-chain.md#verification-failed
- name: admin-access
  rules:
  # tests/admin/test_access_review.py. files/08 §2.7: "a review older than
  # 100 days downgrades every platform_owner and tenant_admin session to
  # read-only and pages". Every API replica computes the age from the audit
  # chain at scrape time; `min` across replicas, so one replica that has not
  # re-read the chain since a countersignature cannot page alone. +Inf (never
  # countersigned, or the chain unread) is above 100 and pages.
  - alert: AccessReviewOverdue
    expr: min(admin_access_review_age_days) > 100
    labels:
      severity: page
    annotations:
      summary: 'the console access review is more than 100 days old'
      description: >-
        platform_owner and tenant_admin sessions are read-only until the
        platform_owner and console_roles sections are signed and countersigned
        again (files/08 §2.7).
      runbook: docs/runbooks/access-review.md#overdue
  # tests/admin/test_offboarding.py. files/08 §2.4: one action revokes every
  # console account. An offboarding that ends with a failed step or a manual
  # step awaiting confirmation is counted complete="false"; someone has to
  # close it.
  - alert: OffboardingIncomplete
    expr: increase(admin_offboarding_total{complete="false"}[1h]) > 0
    labels:
      severity: ticket
    annotations:
      summary: 'an offboarding ended with a system still open'
      description: >-
        A revocation failed or a manual step (Grafana, Langfuse, Unleash)
        awaits confirmation. The review lists it under pending_offboardings.
      runbook: docs/runbooks/access-review.md#incomplete
