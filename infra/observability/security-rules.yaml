# infra/observability/security-rules.yaml — security countdown alerts
# (INT-367; files/10 §3 "key rotation quarterly", §6 "docs/runbooks/ linked
# from every alert", §7 "secret-rotation and certificate-expiry countdowns").
#
# Hand-written, not generated: each rule is pinned by the test named beside
# it, and every series it reads is catalogued in
# observability/metrics_catalog.yaml (CLAUDE.md invariant 13).
groups:
- name: security-countdowns
  rules:
  # tests/security/test_rotation_schedule.py. The scheduled rotation
  # (intake_platform.key_rotation) re-arms the countdown whenever it rotates
  # a key, so the gauge goes below zero only when a due rotation did not
  # happen: the rotate failed, or nothing ran the job.
  - alert: SecretRotationOverdue
    expr: sec_secret_rotation_due_days < 0
    labels:
      severity: ticket
    annotations:
      summary: 'tenant KEK {{ $labels.key }} is past its quarterly rotation'
      description: >-
        The key's latest Transit version is more than a quarter old (files/10
        §3). Every ciphertext still decrypts; the rotation is late, not
        destructive.
      runbook: docs/runbooks/key-rotation.md#overdue
  # tests/observability/test_alert_rules.py (INT-021 close-out). files/08 §5
  # pages on "audit-chain verification failure". The INT-016 daily verifier
  # (intake_platform.audit_verifier) sets the gauge to 0 on a broken chain AND
  # when no external anchor was supplied (HB-I12): a chain checked only
  # against itself is not a verified chain, so both page. Until the close-out
  # nothing read the gauge, although the job's own docstring said it paged.
  - alert: AuditChainVerificationFailed
    expr: sec_audit_chain_ok == 0
    labels:
      severity: page
    annotations:
      summary: 'the daily audit-chain verification did not verify the chain'
      description: >-
        Either the hash chain does not hold (exit 2) or no externally anchored
        head was supplied to check it against (exit 3). Neither is copied to
        the WORM bucket.
      runbook: docs/runbooks/audit-chain.md#verification-failed
- name: admin-access
  rules:
  # tests/admin/test_access_review.py. files/08 §2.7: "a review older than
  # 100 days downgrades every platform_owner and tenant_admin session to
  # read-only and pages". Every API replica computes the age from the audit
  # chain at scrape time; `min` across replicas, so one replica that has not
  # re-read the chain since a countersignature cannot page alone. +Inf (never
  # countersigned, or the chain unread) is above 100 and pages.
  - alert: AccessReviewOverdue
    expr: min(admin_access_review_age_days) > 100
    labels:
      severity: page
    annotations:
      summary: 'the console access review is more than 100 days old'
      description: >-
        platform_owner and tenant_admin sessions are read-only until the
        platform_owner and console_roles sections are signed and countersigned
        again (files/08 §2.7).
      runbook: docs/runbooks/access-review.md#overdue
  # tests/admin/test_offboarding.py. files/08 §2.4: one action revokes every
  # console account. An offboarding that ends with a failed step or a manual
  # step awaiting confirmation is counted complete="false"; someone has to
  # close it.
  - alert: OffboardingIncomplete
    expr: increase(admin_offboarding_total{complete="false"}[1h]) > 0
    labels:
      severity: ticket
    annotations:
      summary: 'an offboarding ended with a system still open'
      description: >-
        A revocation failed or a manual step (Grafana, Langfuse, Unleash)
        awaits confirmation. The review lists it under pending_offboardings.
      runbook: docs/runbooks/access-review.md#incomplete
- name: sms-abuse
  rules:
  # tests/security/test_sms_pumping.py (INT-577). The kill switch latches when
  # the global day send cap is reached and stays engaged until an operator
  # releases it, so while it is up no patient receives a code: page.
  - alert: SmsSpendKillSwitchEngaged
    expr: max(sms_spend_kill_switch_engaged) == 1
    labels:
      severity: page
    annotations:
      summary: 'the SMS spend kill switch is engaged: no OTP SMS is being sent'
      description: >-
        The global day send cap was reached, or an operator engaged the
        switch. Sign-ins by SMS code are refused until it is released.
      runbook: docs/runbooks/sms-abuse.md#the-kill-switch-is-engaged
  # tests/security/test_sms_pumping.py (INT-577). The same definition as the
  # ops console's sms tile (intake_api.sms_spend.is_spike): the last hour over
  # 3 x the day's own hourly rate, and over 20, so a quiet night's few
  # requests never page.
  - alert: OtpRequestSpike
    expr: >-
      sum(increase(sec_otp_requests_total[1h])) > 3 * (sum(increase(sec_otp_requests_total[1d])) / 24)
      and sum(increase(sec_otp_requests_total[1h])) > 20
    labels:
      severity: ticket
    annotations:
      summary: 'OTP requests in the last hour are far above the day''s rate'
      description: >-
        A pumping attempt spreads requests over many numbers, devices and
        addresses so that each stays inside its own budget. The per-dimension
        blocks are in sec_otp_abuse_blocks.
      runbook: docs/runbooks/sms-abuse.md#an-otp-request-spike
  # tests/security/test_otp_enumeration.py (INT-579, security review of 28 Oct
  # 2026). The code is sent after the request's 202, so a vendor refusal or a
  # failed transport no longer shows on the route: the patient is told the
  # code was sent and none arrives. Over half the last 30 minutes' sends not
  # accepted, and at least 3 of them, so one unreachable number at night never
  # pages. Engineering defaults (docs/evidence/INT-579.md).
  - alert: OtpSmsDeliveryFailing
    expr: >-
      sum(increase(otp_sms_delivery_total{outcome!="accepted"}[30m]))
      / sum(increase(otp_sms_delivery_total[30m])) > 0.5
      and sum(increase(otp_sms_delivery_total{outcome!="accepted"}[30m])) >= 3
    for: 5m
    labels:
      severity: page
    annotations:
      summary: 'most OTP SMS sends in the last 30 minutes were not accepted'
      description: >-
        Patients asking for a code are told it was sent and none arrives, so
        sign-in by SMS is down. The refusal reasons are the outcome label of
        otp_sms_delivery_total.
      runbook: docs/runbooks/sms-abuse.md#otp-sms-is-not-being-delivered
- name: account-takeover
  rules:
  # tests/security/test_device_sessions.py (INT-583). A patient pressed "Bu
  # girişi ben yapmadım" on the sessions screen: a sign-in to their account was
  # not theirs. That is a presumed account takeover, so it pages, and the KVKK
  # 72-hour clock to the Board starts when we learn of it, which is now.
  - alert: SignInDisowned
    expr: sum(increase(sec_sign_in_disowned_total[5m])) > 0
    labels:
      severity: page
    annotations:
      summary: 'a patient reported that a sign-in to their account was not theirs'
      description: >-
        The report is the auth.session.disowned row on the hash chain, under
        the patient id. Treat it as a presumed personal-data breach: open the
        incident record now, because the KVKK 72-hour clock has started.
      runbook: docs/runbooks/sms-abuse.md#a-patient-says-a-sign-in-was-not-theirs
