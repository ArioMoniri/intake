# Loki — obs profile (INT-023), single binary, filesystem storage, no auth
# (the port binds loopback on the host; nothing else can reach it).
# structured metadata is on because logs arrive over Loki's native OTLP
# endpoint from the collector — AFTER the transform/redact processor, so
# this store only ever sees redacted lines (inv. 6).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 168h # dev tier: one week, then gone
