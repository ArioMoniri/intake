# Prometheus — obs profile (INT-023). Evaluates the INT-021 SLO burn-rate
# rules (mounted read-only from infra/observability/prometheus-rules.yaml,
# which is generated from docs/slo/ and drift-gated by
# tests/observability/test_slo_generator.py) over series scraped from the
# OTel collector. Loopback-only from the host; service names are the
# compose-network DNS names.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/prometheus-rules.yaml
  # INT-190 budget alerts, generated from infra/costs/unit-prices.yaml and
  # drift-gated by tests/observability/test_cost_rules.py
  - /etc/prometheus/rules/cost-rules.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: otel-collector
    # the collector's own internals — queue depth, dropped items, uptime
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: intake-services
    # app metrics exported by the collector's prometheus exporter; the
    # service label is set by the emitting service (metrics_catalog.yaml)
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
