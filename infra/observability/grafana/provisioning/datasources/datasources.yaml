# Grafana datasources — obs profile (INT-023). The uid values are load-
# bearing: api-slo-dashboard.json references uid "prometheus" and
# tests/observability/test_obs_compose.py cross-checks every dashboard
# datasource uid against this file.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
