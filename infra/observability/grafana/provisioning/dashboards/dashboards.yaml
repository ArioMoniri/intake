# Grafana dashboard provider — obs profile (INT-023). Dashboards are code:
# infra/observability/grafana/dashboards/ — one generated golden-signal
# dashboard per docs/slo file (INT-021) — is mounted read-only into
# /var/lib/grafana/dashboards, so every SLO's dashboard appears without any
# click-ops and cannot be edited away in the UI.
apiVersion: 1

providers:
  - name: intake-dashboards
    folder: INTAKE
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
