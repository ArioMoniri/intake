# Grafana dashboard provider — obs profile (INT-023). Dashboards are code:
# the json files under infra/observability/grafana/ are mounted read-only
# into /var/lib/grafana/dashboards, so the INT-021 api-slo dashboard appears
# without any click-ops and cannot be edited away in the UI.
apiVersion: 1

providers:
  - name: intake-dashboards
    folder: INTAKE
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
