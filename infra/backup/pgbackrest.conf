# INT-202 — pgBackRest configuration for the production host's primary
# (infra/staging/compose.yaml, service `postgres`; files/10 §3 "Backups & DR";
# CLAUDE.md invariants 6 and 14; threat-model row `backups`).
#
# What this file may contain: option names, algorithms and paths. What it may
# never contain: a passphrase or a key. pgBackRest reads every option from the
# environment as PGBACKREST_<OPTION>, so the repository passphrase arrives as
# PGBACKREST_REPO1_CIPHER_PASS — a host-generated secret in the root-only env
# file (infra/staging/init.sh), passed to the postgres container and no other.
# intake_platform.backup.config refuses a secret option in this file.
#
# Repository 1 is local POSIX storage on its own named volume
# (`pgbackrest-repo`). An earlier version pointed an S3 repository at the
# in-network object store over plain HTTP with TLS verification off:
# pgBackRest's S3 driver speaks only TLS (pgbackrest/pgbackrest#1590), so that
# repository could never have been written. The config loader now refuses
# `*-storage-verify-tls=n` outright.
#
# Encryption at rest is the repository's own: every file in it — manifests,
# backups and WAL — is aes-256-cbc ciphertext under a passphrase that is not
# a field-level data key (files/10 §3, "encrypted with separate keys").
#
# The second location (files/10 §3, "a second location in Türkiye") is
# repository 2, added through /etc/pgbackrest/conf.d on the host once HB-I8(b)
# names the site, with its own passphrase. Nothing here names a site.
#
# Retention: time-based, and DELIBERATELY WITHOUT A VALUE. files/10 §3 states
# RPO 15 min and RTO 4 h and no retention; files/06 §3's matrix has no row for
# backup copies (HB-I8(a)). With no repo1-retention-full, pgBackRest expires
# nothing — it loses no data, which is the fail-closed direction. When the
# owner answers, `infra/staging/backup.sh set-retention <days>` writes the
# value into conf.d after checking it against the ceiling files/06 §1 implies
# (intake_platform.backup.status.RETENTION_CEILING_DAYS).

[global]
repo1-type=posix
repo1-path=/var/lib/pgbackrest

# Encryption at rest for the whole repository — manifests, backups and WAL.
repo1-cipher-type=aes-256-cbc

repo1-retention-full-type=time

repo1-bundle=y
repo1-block=y
compress-type=zst
process-max=2
start-fast=y

# PITR: WAL is pushed continuously and asynchronously, off the checkpointer's
# critical path. archive-push-queue-max is intentionally unset — when the
# repository is unwritable the primary keeps its WAL rather than dropping it,
# and a filling disk is a louder, safer failure than a hole in the archive.
archive-async=y
spool-path=/var/spool/pgbackrest

# The async archiver logs on every segment; `detail` in a long-lived
# container's writable layer grows without bound. Commands still log to the
# console, which the host scripts capture.
log-level-console=info
log-level-file=warn
log-path=/var/log/pgbackrest

[intake]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
# The cluster's superuser is POSTGRES_USER=intake (compose.yaml); there is no
# `postgres` role. pgBackRest connects over the unix socket.
pg1-user=intake
