# INT-202 — pgBackRest repository configuration (files/10 §3 "Backups & DR";
# CLAUDE.md invariants 6 and 14; threat-model row `backups`).
#
# What this file is allowed to contain: option names, algorithms, paths and
# non-secret endpoints. What it may never contain: a passphrase, an access key
# or a secret key. pgBackRest reads every option from the environment as
# PGBACKREST_<OPTION> with dashes as underscores, so the three secrets arrive
# as PGBACKREST_REPO1_CIPHER_PASS, PGBACKREST_REPO1_S3_KEY and
# PGBACKREST_REPO1_S3_KEY_SECRET, injected from OpenBao by the caller. There
# is no default for any of them and no file they can be read from.
#
# Encryption at rest is the repository's own, not the volume's: files/10 §3
# requires the archive encrypted "with separate keys" from the field-level
# data keys, so a stolen backup is inert even where the volume is readable.
#
# Retention: DELIBERATELY NOT SET HERE, and the drill refuses to run until a
# human supplies it (files/HUMAN_BLOCKERS.md HB-I8). files/10 §3 and the
# INT-202 acceptance state RPO 15 min and RTO 4 h; neither states how many
# full backups to keep, and `06 §3`'s retention matrix has no row for backup
# copies either. pgBackRest with no repo1-retention-full expires nothing,
# which loses no data — the fail-closed direction — while
# scripts/backup/restore_drill.sh refuses to expire or drill without an
# explicit PGBACKREST_REPO1_RETENTION_FULL. A guessed window would silently
# become the answer to a KVKK-7 question nobody asked.

[global]
repo1-type=s3
repo1-path=/intake
repo1-s3-bucket=intake-pgbackrest
repo1-s3-endpoint=minio
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
repo1-storage-port=9000
repo1-storage-verify-tls=n

# Encryption at rest for the whole repository — manifests, backups and WAL.
repo1-cipher-type=aes-256-cbc

repo1-bundle=y
repo1-block=y
compress-type=zst
process-max=2
start-fast=y

# PITR: WAL is pushed continuously and asynchronously off the checkpointer's
# critical path. archive-push-queue-max is intentionally unset — when the
# repository is unreachable the primary stalls rather than dropping WAL, and
# a stalled primary is a louder, safer failure than a hole in the archive.
archive-async=y
spool-path=/var/spool/pgbackrest

log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[intake]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
