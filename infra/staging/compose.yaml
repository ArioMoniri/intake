# INT-345: the staging backend. API, Postgres, Redis, OpenBao, an object
# store and a TLS proxy run on ONE Linux host with Docker. Nothing runs on the
# developer laptop.
#
# SYNTHETIC PATIENTS ONLY. The AWS host is in us-east-1. No real patient data
# may reach it until an in-country host exists (HB-I5, HB-L11). Every response
# carries X-Intake-Environment: staging-synthetic-only (see Caddyfile).
#
# The API boots in a non-dev posture:
#   - INTAKE_ENV=staging.
#   - The KEK mode is transit: OpenBao Transit, in server mode on file storage.
#   - No dev gate is set anywhere in this tier.
#   - INT-352: the OTP tier gets its host-generated tokenization key, and the
#     App Attest keys the operator sets. Those have no default, so an empty
#     one reaches the API empty, which it reads as unset: with no Apple team
#     id every iOS attestation is refused and no code is sent. The SMS vendor
#     (Netgsm, INT-528) is read from OpenBao, never from here, and deploy.sh
#     refuses a team id the API's token cannot pair with that document.
#   - Every credential the API requires outside dev (INT-325: the three DB
#     URLs and the object store's root pair) is a required interpolation of
#     a host-generated secret. None has a default.
#   - INT-352 (audit F18): all three /version stamps are required. git_sha
#     and built_at are build args, and sbom_digest is the sha256 of the
#     image's SBOM, which the host scripts write outside the image.
#
# The object store's image is OBJECT_STORE_IMAGE, which lib.sh sets and
# exports: the one the owner chose on 2026-09-26 (owner decision D1), pinned
# by digest, and recorded with its licence by INT-347 (#550). deploy.sh
# refuses an empty or unpinned value before anything runs.
#
# Secrets come only from the root-only env file that init.sh generates on the
# host (/etc/intake-staging/.env, mode 0600). Every compose call goes through
# lib.sh, which passes that file together with -p intake-staging. Only caddy
# publishes ports, and only 80 and 443.
#
# Images are pinned by digest. Digests were resolved from the registries' v2
# APIs on 26 Sep 2026 (pgvector on 27 Sep 2026). Licences:
#   postgres    PostgreSQL Licence; the pgvector extension is PostgreSQL
#               Licence too, read from the raw LICENSE blob at tag v0.8.6
#               (docs/evidence/INT-421.md)
#   redis 7.4   RSALv2/SSPLv1. Internal self-hosting is permitted, as recorded
#               in observability/registry.yaml.
#   openbao     MPL-2.0
#   minio       AGPL-3.0, verified from the raw LICENSE blob (INT-347)
#   caddy       Apache-2.0
#   squid       GPL-2.0-or-later (ubuntu/squid; INT-018 recorded the licence in
#               observability/registry.yaml; the digest below was resolved
#               from Docker Hub's v2 API on 3 Oct 2026, INT-442)
name: intake-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: intake-staging/api:${INTAKE_GIT_SHA:?set by deploy.sh}
    build:
      context: ../..
      dockerfile: infra/staging/Dockerfile.api
      args:
        GIT_SHA: ${INTAKE_GIT_SHA:?set by deploy.sh}
        BUILT_AT: ${INTAKE_BUILT_AT:?set by deploy.sh}
    environment:
      INTAKE_ENV: staging
      # INT-352 (audit F18): /version's sbom_digest, the sha256 of the SBOM
      # that deploy.sh has syft write of this image into the host's release
      # directory, never into the image. git_sha and built_at come in as the
      # build args above. Required, no default: without it compose starts no
      # api container, so /version cannot report "dev" for it here.
      INTAKE_SBOM_DIGEST: ${INTAKE_SBOM_DIGEST:?set by deploy.sh from the release SBOM}
      INTAKE_API_KEK_MODE: transit
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:?run init.sh}
      INTAKE_API_DB_URL: postgresql+psycopg://app_rw:${PG_APP_RW_PASSWORD:?run init.sh}@postgres:5432/intake
      INTAKE_API_AUDIT_DB_URL: postgresql+psycopg://svc_audit_writer:${PG_AUDIT_WRITER_PASSWORD:?run init.sh}@postgres:5432/intake
      INTAKE_API_BOOTSTRAP_DB_URL: postgresql+psycopg://intake:${POSTGRES_PASSWORD:?run init.sh}@postgres:5432/intake
      INTAKE_REDIS_URL: redis://:${REDIS_PASSWORD:?run init.sh}@redis:6379/0
      # INT-187: the deploy freeze. The console writes it here and deploy.sh's
      # release gate reads it, in a one-off api container, before it restarts
      # anything; unset, the gate refuses every deploy.
      INTAKE_RELEASE_FREEZE_REDIS_URL: redis://:${REDIS_PASSWORD:?run init.sh}@redis:6379/0
      # INT-428 (ADR-035): the model-lane control the console's Model lanes
      # module writes and every routed gateway reads. The deployment's data
      # class is NOT set here: the synthetic image bakes it, so no compose or
      # env edit can turn this host into something else.
      INTAKE_MODEL_LANES_REDIS_URL: redis://:${REDIS_PASSWORD:?run init.sh}@redis:6379/0
      # INT-442 (ADR-035): the hosted lanes' one route out, the egress-proxy
      # service below (the OTP tier's SMS has its own, sms-egress, ADR-042).
      # Read only through intake_platform.model_lanes.guard.
      # egress_proxy_url, which refuses the boot if this is set in a
      # deployment that is not synthetic. It is never set in the PHI
      # deployment (tests/infra/test_staging_egress.py pins that).
      INTAKE_EGRESS_PROXY_URL: http://egress-proxy:3128
      # INT-443 (ADR-035): ElevenLabs is this synthetic host's default TTS for
      # scripted clips. Honoured only because the image bakes the synthetic
      # data class; the vendor is reached only once its allow-list row exists
      # and its key is in OpenBao (secret/model-lanes/providers/elevenlabs).
      INTAKE_HOSTED_TTS: elevenlabs
      INTAKE_HOSTED_TTS_CACHE_DIR: /var/lib/intake/george-clips
      # The object store: the minio service below, over the internal backend
      # network. The API creates its buckets itself on first use, the audit
      # bucket with object lock, so nothing here pre-creates one.
      MINIO_ENDPOINT: minio:9000
      # The store's root pair. Outside dev the API refuses to boot without it
      # (INT-325), and it has no default here.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run init.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run init.sh}
      # INT-352: the OTP tier's phone-tokenization key, generated by init.sh.
      INTAKE_TOKENIZATION_KEY: ${INTAKE_TOKENIZATION_KEY:?run init.sh}
      # Operator-set, no default: empty reaches the API empty, which it reads
      # as unset and fails closed on (docs/runbooks/staging.md, "App Attest
      # and SMS"). The SMS vendor is not an environment value: the API reads
      # Netgsm's credentials from OpenBao (secret/api/netgsm, INT-528).
      INTAKE_APP_ATTEST_TEAM_ID: ${INTAKE_APP_ATTEST_TEAM_ID}
      INTAKE_APP_ATTEST_BUNDLE_ID: ${INTAKE_APP_ATTEST_BUNDLE_ID}
      INTAKE_APP_ATTEST_ENVIRONMENT: ${INTAKE_APP_ATTEST_ENVIRONMENT}
      # Owner patch (INT-528, INT-358): the runtime half of the PHI egress
      # gate, for the allow-list's one phi_path row (Netgsm OTP SMS). Without
      # it that row refuses, and the OTP tier answers 503.
      INTAKE_ALLOW_PHI_EGRESS: explicit-yes
      # ADR-042 (INT-528): the SMS-only forward proxy, which the Netgsm client
      # alone rides. intake_platform.egress admits exactly this URL for the
      # SMS purpose and refuses every other personal-data proxy (INT-203).
      INTAKE_SMS_EGRESS_PROXY_URL: http://sms-egress:3128
      # INT-583 (D35), on ADR-042's pattern: the push-only forward proxy, which
      # the APNs client alone rides for the new-device sign-in notice.
      # intake_platform.egress admits exactly this URL for the push purpose;
      # without it, on this host, the push channel stays off (no_route).
      INTAKE_PUSH_EGRESS_PROXY_URL: http://push-egress:3128
      # INT-465: this host serves synthetic patients only, so its triage tenant
      # is synthetic. Its red rule set is base.life_threat, signed with the
      # synthetic-only test key (owner decision, 3 Oct 2026, with D18; the
      # signer is redset_signer.sh). Only the signed active rules are served.
      # The API refuses a synthetic tenant outside dev and staging, and every
      # other tenant rejects this signature.
      INTAKE_API_TRIAGE_TENANT_KIND: synthetic
      # The host the signature names (review round 2). Declared, not attested:
      # the same compose on another host would claim this id, which is why the
      # API also refuses a synthetic tenant outside dev and staging.
      INTAKE_API_TRIAGE_DEPLOYMENT: i-0e489e48739f5de98
      INTAKE_API_TRIAGE_RULES: files/protocols/base.life_threat.yaml
      INTAKE_API_TRIAGE_SIGNATURE: packages/protocols/signing/red_rule_set.synthetic.json
      # INT-475: a RED the hop fires, and a patient's on-site answer, reach the
      # clinic Safety inbox here — the same store the voice runtime writes and
      # the console reads (INT-406). Unset, every hop RED pages
      # RedInboxRouteFailed and the ON_SITE copy "Görevlilere haber verildi."
      # would be untrue.
      INTAKE_SAFETY_INBOX_REDIS_URL: redis://:${REDIS_PASSWORD:?run init.sh}@redis:6379/0
      # INT-421: the admin console (INT-180). The API verifies every console
      # bearer against the realm's issuer, the `api` audience and a key set
      # mirrored onto the host by deploy.sh, so no request depends on Keycloak
      # answering.
      INTAKE_ADMIN_OIDC_ISSUER: https://auth.${STAGING_HOSTNAME:?run init.sh}/realms/intake
      INTAKE_ADMIN_OIDC_AUDIENCE: api
      INTAKE_ADMIN_OIDC_JWKS_PATH: /run/intake/keycloak-jwks.json
      # Owner decision D19 (files/00_STATE.md §3, 2 Oct 2026): "dont make admin
      # access ip restricted". This is an explicit allow-all, because an empty
      # list would admit nobody. The gate is the Keycloak login: a password
      # plus a second factor (the INT-365 staff browser flow), checked again
      # by the API (amr).
      INTAKE_ADMIN_IP_ALLOWLIST: "0.0.0.0/0,::/0"
      # the console's voice kill switch (INT-182), in the deployment's Redis
      INTAKE_VOICE_CONTROL_REDIS_URL: redis://:${REDIS_PASSWORD:?run init.sh}@redis:6379/0
      # INT-560: the console's registry page. The probes service below writes
      # its last sweep to the probe-results volume, mounted here read-only, and
      # this host's inventory says what the host runs and needs. Unset, every
      # row read no_result and "evet" meant "some host of ours".
      INTAKE_PROBE_RESULTS_PATH: /var/lib/intake/probe-results/sweep.json
      INTAKE_HOST_INVENTORY_PATH: /app/infra/staging/inventory.yaml
    volumes:
      # written by deploy.sh (mirror_keycloak_jwks) before the api starts
      - /etc/intake-staging/keycloak-jwks.json:/run/intake/keycloak-jwks.json:ro
      # INT-443: the George clip cache survives redeploys, so a pre-baked clip
      # is served without a vendor call for as long as its profile version stands
      - george-clips:/var/lib/intake/george-clips
      # INT-560: the probes service's sweep, read-only here
      - probe-results:/var/lib/intake/probe-results:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
      minio:
        condition: service_healthy
      # started, not healthy: a proxy that is down fails its own calls closed
      # (the hosted lanes', or the OTP tier's SMS), and nothing else in the API
      # needs either
      egress-proxy:
        condition: service_started
      sms-egress:
        condition: service_started
      push-egress:
        condition: service_started
    # every network is internal: the API has no route to the internet. It has
    # three ways out, each to one default-deny proxy: `outbound`, to the egress
    # proxy, which answers only for the allow-list's hosted-model rows
    # (INT-442); `sms-out`, to the SMS-only proxy, which answers only for the
    # allow-list's SMS row (ADR-042, INT-528); and `push-out`, to the push-only
    # proxy, which answers only for the allow-list's APNs rows (INT-583).
    networks: [backend, edge, outbound, sms-out, push-out]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
    restart: unless-stopped
    logging: *logging

  postgres:
    # INT-421: pgvector, because migration 0014 (INT-123) runs CREATE EXTENSION
    # vector and the plain postgres image has no vector.control, so main could
    # not migrate here. 0.8.6-pg16-trixie carries the same server package as
    # the image it replaces (PG_VERSION 16.15-1.pgdg13+2, Debian trixie), so
    # the existing data volume and its collations are unchanged.
    image: pgvector/pgvector:0.8.6-pg16-trixie@sha256:c8483555ce48101872f888c1df8a895ff689d6c7c7a5f7ac266475f9dfe89e0b
    environment:
      POSTGRES_USER: intake
      POSTGRES_DB: intake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run init.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "intake", "-d", "intake"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # The password reaches redis-server on stdin, so it never appears in any
    # process's argv, which the host's `ps` shows to every user. redis-cli
    # reads the same variable for the healthcheck.
    #
    # INT-560: `intake-probe` is the probes service's user. It may run PING
    # and nothing else: no key, no channel, no other command. Its password
    # reaches redis-server the same way, on stdin.
    user: redis
    command:
      - sh
      - -c
      - |
        exec redis-server - <<EOF
        requirepass $$REDISCLI_AUTH
        user intake-probe on >$$REDIS_PROBE_PASSWORD resetkeys resetchannels -@all +ping
        appendonly yes
        EOF
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?run init.sh}
      REDIS_PROBE_PASSWORD: ${REDIS_PROBE_PASSWORD:?run init.sh}
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  openbao:
    image: openbao/openbao:2.6.3@sha256:a60afafda36337abe833c4a63894bf1095098f29abea4091e7e555a33dd52889
    # The image's default CMD starts a dev server, and its entrypoint's
    # `server` branch appends dev flags. This command starts with `bao`, so
    # the entrypoint runs it unchanged, as the image's non-root user.
    command: ["bao", "server", "-config=/openbao/config/openbao.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - openbao-data:/openbao/file
      - ./openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
    # OpenBao 2.6 no longer locks its memory, so swap is kept off or
    # encrypted on the host instead (lib.sh require_no_unencrypted_swap, run
    # by init.sh and deploy.sh before this service starts). The memlock
    # rlimit and IPC_LOCK stay only so a binary that carries the file
    # capability still starts.
    ulimits:
      memlock: -1
    cap_add: [IPC_LOCK]
    networks: [backend]
    healthcheck:
      # 200 only when initialised, unsealed and active, so the API waits for unseal
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  minio:
    # S3-compatible store for the documents and the WORM audit copies. The
    # image is lib.sh's OBJECT_STORE_IMAGE (see the header). Its entrypoint
    # prefixes `minio`, so this command runs `minio server /data`.
    image: ${OBJECT_STORE_IMAGE:?set by lib.sh}
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run init.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run init.sh}
      # no web console: nothing on this host administers the store by hand
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data
    # internal only, and no published port: the api is its only client
    networks: [backend]
    healthcheck:
      # the image bundles the mc client; `mc ready local` is its readiness check
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  keycloak:
    # INT-421: staff identity for the admin console. 26.7.4 pinned by the
    # multi-arch index digest that INT-390 recorded (Apache-2.0). `start`,
    # never `start-dev`. TLS ends at Caddy, so Keycloak serves plain HTTP on
    # the internal edge network and trusts the X-Forwarded-* headers Caddy
    # sets. The realm is imported once, on first start: realm `intake`, no
    # users, and a password plus a second factor (the INT-365 staff browser
    # flow). The operator creates staff with kcadm.sh over SSM
    # (docs/release/production-checklist.md). The bootstrap admin and the
    # client secret are host-generated, and the master realm and the admin
    # console are not routed publicly (Caddyfile).
    #
    # INT-378: the image is INT-390's pin plus the WebAuthn session-notes
    # provider (Dockerfile.keycloak). The jar is built from source and refused
    # unless it matches infra/keycloak/providers/webauthn-session-notes.sha256.
    # Without it no staff token carries aaguid and credential_id, and the API's
    # admin gate refuses every one. The realm on the host was imported before the
    # provider existed, and an import never re-runs, so deploy.sh switches the
    # live realm's WebAuthn step too (ensure_staff_webauthn_notes).
    image: intake-staging/keycloak:${INTAKE_GIT_SHA:?set by deploy.sh}
    build:
      context: ../..
      dockerfile: infra/staging/Dockerfile.keycloak
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run init.sh}
      KC_HOSTNAME: https://auth.${STAGING_HOSTNAME:?run init.sh}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: intake-bootstrap
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run init.sh}
      # read by the realm import's ${...} substitution, and only there
      INTAKE_ADMIN_WEB_CLIENT_SECRET: ${INTAKE_ADMIN_WEB_CLIENT_SECRET:?run init.sh}
      STAGING_HOSTNAME: ${STAGING_HOSTNAME:?run init.sh}
    volumes:
      # since 26.2.0 the import file must be named after the realm inside it
      - ./keycloak/intake-realm.json:/opt/keycloak/data/import/intake-realm.json:ro
    networks: [backend, edge]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # the image has bash but no curl or wget, so this is a builtin probe of
      # the management port's readiness endpoint
      test:
        [
          "CMD",
          "/bin/bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1:9000\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ \"$$line\" == *'200'* ]]",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  oauth2-proxy:
    # INT-421: the console's login gate (oauth2-proxy/alpha.yaml). MIT, read
    # from the raw LICENSE blob at tag v7.15.4 (docs/evidence/INT-421.md).
    # Pinned by the index digest from quay.io's v2 API, recomputed from the
    # manifest bytes.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
    command: ["--alpha-config=/etc/oauth2-proxy/alpha.yaml"]
    environment:
      INTAKE_ADMIN_WEB_CLIENT_SECRET: ${INTAKE_ADMIN_WEB_CLIENT_SECRET:?run init.sh}
      STAGING_HOSTNAME: ${STAGING_HOSTNAME:?run init.sh}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?run init.sh}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_REDIRECT_URL: https://admin.${STAGING_HOSTNAME:?run init.sh}/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # the console's liveness answer (files/08 §6) is the one unauthenticated path
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: GET=^/healthz$$
      # INT-485, invariant 6: the request and auth logs name the signed-in staff
      # email and the client IP on every console request, so neither is
      # written; start-up and error lines still are.
      OAUTH2_PROXY_REQUEST_LOGGING: "false"
      OAUTH2_PROXY_AUTH_LOGGING: "false"
    volumes:
      - ./oauth2-proxy/alpha.yaml:/etc/oauth2-proxy/alpha.yaml:ro
    networks: [edge]
    depends_on:
      admin-web:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  admin-web:
    # INT-421: the admin console (apps/admin-web). It renders only what the
    # API's /admin routes return for the caller's own bearer. It holds no
    # secret, and it reaches nothing but the API.
    image: intake-staging/admin-web:${INTAKE_GIT_SHA:?set by deploy.sh}
    build:
      context: ../..
      dockerfile: infra/staging/Dockerfile.admin-web
    environment:
      INTAKE_ADMIN_API_BASE: http://api:8000
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp, /app/apps/admin-web/.next/cache]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  # INT-442 (ADR-035): the synthetic deployment's forward proxy. Default deny:
  # its config is rendered from infra/security/egress-allowlist.yaml's
  # hosted_model_inference rows (scripts/security/render_egress_proxy_conf.py
  # --profile synthetic), so it admits exactly the vendor hosts the in-process
  # guard admits and nothing else. With no such row it admits nothing. It runs
  # as the image's unprivileged `proxy` user (uid 13) from the start, so it
  # needs no capability to drop privileges and can open /dev/stdout for the
  # CONNECT log (host:port only, never a path or a query).
  egress-proxy:
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    user: "13:13"
    volumes:
      - ./egress/squid.conf:/etc/squid/squid.conf:ro
    # outbound: the API's only way to it; vendor: its only way off the host
    networks: [outbound, vendor]
    read_only: true
    tmpfs:
      - /tmp:uid=13,gid=13
      - /run:uid=13,gid=13
      - /var/spool/squid:uid=13,gid=13
      - /var/log/squid:uid=13,gid=13
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
    healthcheck:
      # the listener answers; `squid -k check` needs a pid file this config
      # does not write
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    logging: *logging

  # INT-560: the synthetic probes (services/probes) on this host. The api's
  # own image, one SBOM for both, running the probes app instead: /healthz,
  # /readyz, /metrics and /version through the shared contract (invariant 15;
  # the image's HEALTHCHECK dials its /healthz on 8000), plus a sweep every
  # 60 s of what inventory.yaml says this host runs, dialling each component
  # by its compose name. The sweep lands in the probe-results volume, which
  # the api mounts read-only for the console's registry page.
  #
  # It joins the two internal networks its targets sit on and no other: no
  # route off the host, no leg on `outbound`, which is the API's alone
  # (INT-442), and none on `sms-out`, which ADR-042 keeps to the API and the
  # SMS proxy — so the two proxies are the deployed components it does not
  # probe, and the page says so. Its credentials are its own and minimal: a
  # Postgres role with LOGIN and CONNECT only (lib.sh ensure_probe_role) and
  # the Redis user above, which may PING. It publishes no port.
  probes:
    image: intake-staging/api:${INTAKE_GIT_SHA:?set by deploy.sh}
    command:
      [
        "uvicorn",
        "intake_probes.app:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--no-server-header",
      ]
    environment:
      # /version names the release like the api's does: the same image
      INTAKE_SBOM_DIGEST: ${INTAKE_SBOM_DIGEST:?set by deploy.sh from the release SBOM}
      INTAKE_HOST_INVENTORY_PATH: /app/infra/staging/inventory.yaml
      INTAKE_PROBE_RESULTS_PATH: /var/lib/intake/probe-results/sweep.json
      INTAKE_PROBE_POSTGRES_PASSWORD: ${PG_PROBE_PASSWORD:?run init.sh}
      INTAKE_PROBE_REDIS_PASSWORD: ${REDIS_PROBE_PASSWORD:?run init.sh}
      # the edge's certificate is read with the public name it is issued for
      INTAKE_PROBE_TLS_SERVER_NAME: ${STAGING_HOSTNAME:?run init.sh}
    volumes:
      - probe-results:/var/lib/intake/probe-results
    networks: [backend, edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
    restart: unless-stopped
    logging: *logging

  # ADR-042 (INT-528): the SMS vendor's own forward proxy. It admits CONNECT to
  # the allow-list's SMS host on 443 and nothing else (./sms-egress/squid.conf,
  # GENERATED by scripts/security/render_sms_egress_conf.py), closes the
  # rebinding window itself and refuses the denied ranges at connect. TLS runs
  # end to end, so it sees no request content, and it logs host:port only. It
  # is the same digest-pinned squid as egress-proxy above, run the same way as
  # the image's unprivileged `proxy` user (uid 13), on networks of its own:
  # neither proxy can reach the other's network, so neither carries the
  # other's purpose (tests/infra/test_staging_sms_egress.py).
  sms-egress:
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    user: "13:13"
    volumes:
      - ./sms-egress/squid.conf:/etc/squid/squid.conf:ro
    # sms-out: the API's only way to it; sms-wan: its only way off the host
    networks: [sms-out, sms-wan]
    read_only: true
    tmpfs:
      - /tmp:uid=13,gid=13
      - /run:uid=13,gid=13
      - /var/spool/squid:uid=13,gid=13
      - /var/log/squid:uid=13,gid=13
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
    healthcheck:
      # the listener answers; sending traffic through the boundary is not a probe
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    logging: *logging

  # INT-583 (D35), on ADR-042's pattern: the new-device sign-in notice's own
  # forward proxy. It admits CONNECT to the allow-list's APNs hosts on 443 and
  # nothing else (./push-egress/squid.conf, GENERATED by
  # scripts/security/render_push_egress_conf.py; until the owner applies the
  # APNs rows it admits nothing at all), closes the rebinding window itself and
  # refuses the denied ranges at connect. TLS and HTTP/2 run end to end, so it
  # sees no request content (not the device token, not the notice), and it logs
  # host:port only. The same digest-pinned squid, run the same way, on networks
  # of its own: no other proxy can reach them, so none carries another's
  # purpose (tests/infra/test_staging_push_egress.py).
  push-egress:
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    user: "13:13"
    volumes:
      - ./push-egress/squid.conf:/etc/squid/squid.conf:ro
    # push-out: the API's only way to it; push-wan: its only way off the host
    networks: [push-out, push-wan]
    read_only: true
    tmpfs:
      - /tmp:uid=13,gid=13
      - /run:uid=13,gid=13
      - /var/spool/squid:uid=13,gid=13
      - /var/log/squid:uid=13,gid=13
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
    healthcheck:
      # the listener answers; sending traffic through the boundary is not a probe
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    environment:
      STAGING_HOSTNAME: ${STAGING_HOSTNAME:?run init.sh}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # INT-580 (D34): the apple-app-site-association file deploy.sh renders
      # (write_aasa); empty without an Apple team id, so the route answers 404
      - /etc/intake-staging/well-known:/srv/well-known:ro
      - caddy-data:/data
      - caddy-config:/config
    # public: the published ports and ACME egress; edge: the only way to the API
    networks: [public, edge]
    depends_on:
      api:
        condition: service_started
      keycloak:
        condition: service_started
      oauth2-proxy:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

networks:
  public: {}
  edge:
    internal: true
  backend:
    internal: true
  # ADR-042: the API's SMS leg, shared by the API and the SMS proxy alone
  sms-out:
    internal: true
  # ADR-042: the SMS proxy's only way off the host
  sms-wan: {}
  # INT-583: the API's push leg, shared by the API and the push proxy alone
  push-out:
    internal: true
  # INT-583: the push proxy's only way off the host
  push-wan: {}
  # INT-442: the API and the egress proxy, nothing else
  outbound:
    internal: true
  # the egress proxy's route off the host, and nothing else on it
  vendor: {}

volumes:
  pgdata: {}
  redis-data: {}
  openbao-data: {}
  minio-data: {}
  caddy-data: {}
  caddy-config: {}
  george-clips: {}
  # INT-560: the probes service writes its sweep here; the api reads it
  probe-results: {}
