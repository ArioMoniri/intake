# INT-345: the staging backend. API, Postgres, Redis, OpenBao, an object
# store and a TLS proxy run on ONE Linux host with Docker. Nothing runs on the
# developer laptop.
#
# SYNTHETIC PATIENTS ONLY. The AWS host is in us-east-1. No real patient data
# may reach it until an in-country host exists (HB-I5, HB-L11). Every response
# carries X-Intake-Environment: staging-synthetic-only (see Caddyfile).
#
# The API boots in a non-dev posture:
#   - INTAKE_ENV=staging.
#   - The KEK mode is transit: OpenBao Transit, in server mode on file storage.
#   - No dev gate is set anywhere in this tier.
#   - INT-352: the OTP tier gets its host-generated tokenization key, and the
#     App Attest and SMS keys the operator sets. Those have no default, so an
#     empty one reaches the API empty, which it reads as unset: with no Apple
#     team id every iOS attestation is refused and no code is sent. deploy.sh
#     refuses a team id without all three SMS keys, which would otherwise
#     reach a delivery adapter that answers "sent" and sends nothing.
#   - Every credential the API requires outside dev (INT-325: the three DB
#     URLs and the object store's root pair) is a required interpolation of
#     a host-generated secret. None has a default.
#   - INT-352 (audit F18): all three /version stamps are required. git_sha
#     and built_at are build args, and sbom_digest is the sha256 of the
#     image's SBOM, which the host scripts write outside the image.
#
# The object store's image is OBJECT_STORE_IMAGE, which lib.sh sets and
# exports: the one the owner chose on 2026-09-26 (owner decision D1), pinned
# by digest, and recorded with its licence by INT-347 (#550). deploy.sh
# refuses an empty or unpinned value before anything runs.
#
# Secrets come only from the root-only env file that init.sh generates on the
# host (/etc/intake-staging/.env, mode 0600). Every compose call goes through
# lib.sh, which passes that file together with -p intake-staging. Only caddy
# publishes ports, and only 80 and 443.
#
# Images are pinned by digest. Digests were resolved from the registries' v2
# APIs on 26 Sep 2026 (pgvector on 27 Sep 2026). Licences:
#   postgres    PostgreSQL Licence; the pgvector extension is PostgreSQL
#               Licence too, read from the raw LICENSE blob at tag v0.8.6
#               (docs/evidence/INT-421.md)
#   redis 7.4   RSALv2/SSPLv1. Internal self-hosting is permitted, as recorded
#               in observability/registry.yaml.
#   openbao     MPL-2.0
#   minio       AGPL-3.0, verified from the raw LICENSE blob (INT-347)
#   caddy       Apache-2.0; since INT-515 built by Dockerfile.caddy from the
#               same pinned image plus caddy-l4 v0.1.2 (Apache-2.0, raw
#               LICENSE blob read 16 Oct 2026)
#   livekit     Apache-2.0, read from the raw LICENSE blob at the commit the
#               v1.13.10 tag names; the digest was resolved from Docker Hub's
#               v2 API on 16 Oct 2026 (INT-515, observability/registry.yaml
#               row livekit-server). The server only: LiveKit's turn-detector
#               model is proprietary and OUT (files/00_STATE.md §3).
#
# INT-515: the voice tier. `livekit` is the SFU with its embedded TURN, and
# `voice-runtime` is services/voice-runtime. Neither publishes a port. Media
# reaches the SFU only as TURN over TLS on 443, which Caddy's layer-4 wrapper
# hands to it (Caddyfile); signalling is rtc.<host>. Raw audio has nowhere to
# land: no volume on either service, read-only roots, small noexec tmpfs,
# core dumps off, and the runtime locks its memory (invariant 3). The `media`
# network is internal and its subnet is fixed, because the SFU's TURN relay
# may reach exactly one peer, the SFU's own address, and only Caddy's address
# may state a client's (infra/staging/livekit/livekit.yaml).
name: intake-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: intake-staging/api:${INTAKE_GIT_SHA:?set by deploy.sh}
    build:
      context: ../..
      dockerfile: infra/staging/Dockerfile.api
      args:
        GIT_SHA: ${INTAKE_GIT_SHA:?set by deploy.sh}
        BUILT_AT: ${INTAKE_BUILT_AT:?set by deploy.sh}
    environment:
      INTAKE_ENV: staging
      # INT-352 (audit F18): /version's sbom_digest, the sha256 of the SBOM
      # that deploy.sh has syft write of this image into the host's release
      # directory, never into the image. git_sha and built_at come in as the
      # build args above. Required, no default: without it compose starts no
      # api container, so /version cannot report "dev" for it here.
      INTAKE_SBOM_DIGEST: ${INTAKE_SBOM_DIGEST:?set by deploy.sh from the release SBOM}
      INTAKE_API_KEK_MODE: transit
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:?run init.sh}
      INTAKE_API_DB_URL: postgresql+psycopg://app_rw:${PG_APP_RW_PASSWORD:?run init.sh}@postgres:5432/intake
      INTAKE_API_AUDIT_DB_URL: postgresql+psycopg://svc_audit_writer:${PG_AUDIT_WRITER_PASSWORD:?run init.sh}@postgres:5432/intake
      INTAKE_API_BOOTSTRAP_DB_URL: postgresql+psycopg://intake:${POSTGRES_PASSWORD:?run init.sh}@postgres:5432/intake
      INTAKE_REDIS_URL: redis://:${REDIS_PASSWORD:?run init.sh}@redis:6379/0
      # INT-187: the deploy freeze. The console writes it here and deploy.sh's
      # release gate reads it, in a one-off api container, before it restarts
      # anything; unset, the gate refuses every deploy.
      INTAKE_RELEASE_FREEZE_REDIS_URL: redis://:${REDIS_PASSWORD:?run init.sh}@redis:6379/0
      # The object store: the minio service below, over the internal backend
      # network. The API creates its buckets itself on first use, the audit
      # bucket with object lock, so nothing here pre-creates one.
      MINIO_ENDPOINT: minio:9000
      # The store's root pair. Outside dev the API refuses to boot without it
      # (INT-325), and it has no default here.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run init.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run init.sh}
      # INT-352: the OTP tier's phone-tokenization key, generated by init.sh.
      INTAKE_TOKENIZATION_KEY: ${INTAKE_TOKENIZATION_KEY:?run init.sh}
      # Operator-set, no default: empty reaches the API empty, which it reads
      # as unset and fails closed on (docs/runbooks/staging.md, "App Attest
      # and SMS").
      INTAKE_APP_ATTEST_TEAM_ID: ${INTAKE_APP_ATTEST_TEAM_ID}
      INTAKE_APP_ATTEST_BUNDLE_ID: ${INTAKE_APP_ATTEST_BUNDLE_ID}
      INTAKE_APP_ATTEST_ENVIRONMENT: ${INTAKE_APP_ATTEST_ENVIRONMENT}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_FROM: ${TWILIO_FROM}
      # INT-421: the admin console (INT-180). The API verifies every console
      # bearer against the realm's issuer, the `api` audience and a key set
      # mirrored onto the host by deploy.sh, so no request depends on Keycloak
      # answering.
      INTAKE_ADMIN_OIDC_ISSUER: https://auth.${STAGING_HOSTNAME:?run init.sh}/realms/intake
      INTAKE_ADMIN_OIDC_AUDIENCE: api
      INTAKE_ADMIN_OIDC_JWKS_PATH: /run/intake/keycloak-jwks.json
      # Owner decision D19 (files/00_STATE.md §3, 2 Oct 2026): "dont make admin
      # access ip restricted". This is an explicit allow-all, because an empty
      # list would admit nobody. The gate is the Keycloak login: a password
      # plus a second factor (the INT-365 staff browser flow), checked again
      # by the API (amr).
      INTAKE_ADMIN_IP_ALLOWLIST: "0.0.0.0/0,::/0"
      # the console's voice kill switch (INT-182), in the deployment's Redis
      INTAKE_VOICE_CONTROL_REDIS_URL: redis://:${REDIS_PASSWORD:?run init.sh}@redis:6379/0
      # INT-515: the clinic Safety inbox the voice runtime writes every RED to
      # (INT-406), which the console's Safety queue and a RED visit's move read
      INTAKE_SAFETY_INBOX_REDIS_URL: redis://:${REDIS_PASSWORD:?run init.sh}@redis:6379/0
      # INT-515: the patient's room token (POST /v1/visits/{id}/voice-token).
      # The SFU's public signalling origin, and the key pair it verifies.
      INTAKE_LIVEKIT_PUBLIC_URL: wss://rtc.${STAGING_HOSTNAME:?run init.sh}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?run init.sh}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?run init.sh}
    volumes:
      # written by deploy.sh (mirror_keycloak_jwks) before the api starts
      - /etc/intake-staging/keycloak-jwks.json:/run/intake/keycloak-jwks.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
      minio:
        condition: service_healthy
    # both networks are internal: the API has no route to the internet
    networks: [backend, edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
    restart: unless-stopped
    logging: *logging

  postgres:
    # INT-421: pgvector, because migration 0014 (INT-123) runs CREATE EXTENSION
    # vector and the plain postgres image has no vector.control, so main could
    # not migrate here. 0.8.6-pg16-trixie carries the same server package as
    # the image it replaces (PG_VERSION 16.15-1.pgdg13+2, Debian trixie), so
    # the existing data volume and its collations are unchanged.
    image: pgvector/pgvector:0.8.6-pg16-trixie@sha256:c8483555ce48101872f888c1df8a895ff689d6c7c7a5f7ac266475f9dfe89e0b
    environment:
      POSTGRES_USER: intake
      POSTGRES_DB: intake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run init.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "intake", "-d", "intake"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # The password reaches redis-server on stdin, so it never appears in any
    # process's argv, which the host's `ps` shows to every user. redis-cli
    # reads the same variable for the healthcheck.
    user: redis
    command:
      - sh
      - -c
      - |
        exec redis-server - <<EOF
        requirepass $$REDISCLI_AUTH
        appendonly yes
        EOF
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?run init.sh}
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  openbao:
    image: openbao/openbao:2.6.3@sha256:a60afafda36337abe833c4a63894bf1095098f29abea4091e7e555a33dd52889
    # The image's default CMD starts a dev server, and its entrypoint's
    # `server` branch appends dev flags. This command starts with `bao`, so
    # the entrypoint runs it unchanged, as the image's non-root user.
    command: ["bao", "server", "-config=/openbao/config/openbao.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - openbao-data:/openbao/file
      - ./openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
    # OpenBao 2.6 no longer locks its memory, so swap is kept off or
    # encrypted on the host instead (lib.sh require_no_unencrypted_swap, run
    # by init.sh and deploy.sh before this service starts). The memlock
    # rlimit and IPC_LOCK stay only so a binary that carries the file
    # capability still starts.
    ulimits:
      memlock: -1
    cap_add: [IPC_LOCK]
    networks: [backend]
    healthcheck:
      # 200 only when initialised, unsealed and active, so the API waits for unseal
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  minio:
    # S3-compatible store for the documents and the WORM audit copies. The
    # image is lib.sh's OBJECT_STORE_IMAGE (see the header). Its entrypoint
    # prefixes `minio`, so this command runs `minio server /data`.
    image: ${OBJECT_STORE_IMAGE:?set by lib.sh}
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run init.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run init.sh}
      # no web console: nothing on this host administers the store by hand
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data
    # internal only, and no published port: the api is its only client
    networks: [backend]
    healthcheck:
      # the image bundles the mc client; `mc ready local` is its readiness check
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  keycloak:
    # INT-421: staff identity for the admin console. 26.7.4 pinned by the
    # multi-arch index digest that INT-390 recorded (Apache-2.0). `start`,
    # never `start-dev`. TLS ends at Caddy, so Keycloak serves plain HTTP on
    # the internal edge network and trusts the X-Forwarded-* headers Caddy
    # sets. The realm is imported once, on first start: realm `intake`, no
    # users, and a password plus a second factor (the INT-365 staff browser
    # flow). The operator creates staff with kcadm.sh over SSM
    # (docs/release/production-checklist.md). The bootstrap admin and the
    # client secret are host-generated, and the master realm and the admin
    # console are not routed publicly (Caddyfile).
    #
    # INT-378: the image is INT-390's pin plus the WebAuthn session-notes
    # provider (Dockerfile.keycloak). The jar is built from source and refused
    # unless it matches infra/keycloak/providers/webauthn-session-notes.sha256.
    # Without it no staff token carries aaguid and credential_id, and the API's
    # admin gate refuses every one. The realm on the host was imported before the
    # provider existed, and an import never re-runs, so deploy.sh switches the
    # live realm's WebAuthn step too (ensure_staff_webauthn_notes).
    image: intake-staging/keycloak:${INTAKE_GIT_SHA:?set by deploy.sh}
    build:
      context: ../..
      dockerfile: infra/staging/Dockerfile.keycloak
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run init.sh}
      KC_HOSTNAME: https://auth.${STAGING_HOSTNAME:?run init.sh}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: intake-bootstrap
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run init.sh}
      # read by the realm import's ${...} substitution, and only there
      INTAKE_ADMIN_WEB_CLIENT_SECRET: ${INTAKE_ADMIN_WEB_CLIENT_SECRET:?run init.sh}
      STAGING_HOSTNAME: ${STAGING_HOSTNAME:?run init.sh}
    volumes:
      # since 26.2.0 the import file must be named after the realm inside it
      - ./keycloak/intake-realm.json:/opt/keycloak/data/import/intake-realm.json:ro
    networks: [backend, edge]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # the image has bash but no curl or wget, so this is a builtin probe of
      # the management port's readiness endpoint
      test:
        [
          "CMD",
          "/bin/bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1:9000\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ \"$$line\" == *'200'* ]]",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  oauth2-proxy:
    # INT-421: the console's login gate (oauth2-proxy/alpha.yaml). MIT, read
    # from the raw LICENSE blob at tag v7.15.4 (docs/evidence/INT-421.md).
    # Pinned by the index digest from quay.io's v2 API, recomputed from the
    # manifest bytes.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
    command: ["--alpha-config=/etc/oauth2-proxy/alpha.yaml"]
    environment:
      INTAKE_ADMIN_WEB_CLIENT_SECRET: ${INTAKE_ADMIN_WEB_CLIENT_SECRET:?run init.sh}
      STAGING_HOSTNAME: ${STAGING_HOSTNAME:?run init.sh}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?run init.sh}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_REDIRECT_URL: https://admin.${STAGING_HOSTNAME:?run init.sh}/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # the console's liveness answer (files/08 §6) is the one unauthenticated path
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: GET=^/healthz$$
    volumes:
      - ./oauth2-proxy/alpha.yaml:/etc/oauth2-proxy/alpha.yaml:ro
    networks: [edge]
    depends_on:
      admin-web:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  admin-web:
    # INT-421: the admin console (apps/admin-web). It renders only what the
    # API's /admin routes return for the caller's own bearer. It holds no
    # secret, and it reaches nothing but the API.
    image: intake-staging/admin-web:${INTAKE_GIT_SHA:?set by deploy.sh}
    build:
      context: ../..
      dockerfile: infra/staging/Dockerfile.admin-web
    environment:
      INTAKE_ADMIN_API_BASE: http://api:8000
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp, /app/apps/admin-web/.next/cache]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  # INT-515: the voice runtime (services/voice-runtime). No port, no volume,
  # no edge route: its callers are on the internal networks only. It reads the
  # kill switch and writes the Safety inbox in Redis, reaches the SFU's server
  # API on the media network, and takes its lanes from the lane registry
  # (INT-428), which reports why a lane is not ready until those lanes exist
  # here. Raw audio has nowhere to land: a read-only root, a small noexec
  # tmpfs, no core dumps, and an unlimited memlock limit so the process can
  # lock every page it has (serve.app_from_env; invariant 3). Hosted lanes
  # reach their vendors only through INT-442's egress proxy, and attaching
  # this service to that route is the owner's change (owner-515-egress.patch),
  # never this file's.
  voice-runtime:
    image: intake-staging/voice-runtime:${INTAKE_GIT_SHA:?set by deploy.sh}
    build:
      context: ../..
      dockerfile: infra/staging/Dockerfile.voice-runtime
      args:
        GIT_SHA: ${INTAKE_GIT_SHA:?set by deploy.sh}
        BUILT_AT: ${INTAKE_BUILT_AT:?set by deploy.sh}
    environment:
      INTAKE_ENV: staging
      # its own image's SBOM, written by deploy.sh (stamp_voice_runtime_sbom)
      INTAKE_SBOM_DIGEST: ${INTAKE_VOICE_RUNTIME_SBOM_DIGEST:?set by deploy.sh from the release SBOM}
      INTAKE_VOICE_CONTROL_REDIS_URL: redis://:${REDIS_PASSWORD:?run init.sh}@redis:6379/0
      INTAKE_SAFETY_INBOX_REDIS_URL: redis://:${REDIS_PASSWORD:?run init.sh}@redis:6379/0
      # the lane registry's control store (INT-428), read by intake_platform.
      # model_lanes once that package is in the image
      INTAKE_MODEL_LANES_REDIS_URL: redis://:${REDIS_PASSWORD:?run init.sh}@redis:6379/0
      INTAKE_LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?run init.sh}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?run init.sh}
    networks: [backend, media]
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
      memlock: -1
    restart: unless-stopped
    logging: *logging

  # INT-515: the SFU and its embedded TURN, pinned by digest, as an
  # unprivileged user with nothing writable. Its config is committed
  # (livekit/livekit.yaml); its key pair and TURN domain come from here.
  livekit:
    image: livekit/livekit-server:v1.13.10@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
    command: ["--config", "/etc/livekit/livekit.yaml"]
    user: "65534:65534"
    environment:
      # "<key>: <secret>", the form livekit-server reads; host-generated
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?run init.sh}: ${LIVEKIT_API_SECRET:?run init.sh}"
      # the name Caddy terminates TURN/TLS for; LiveKit advertises turns:<it>:443
      LIVEKIT_TURN_DOMAIN: turn.${STAGING_HOSTNAME:?run init.sh}
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    networks:
      media:
        ipv4_address: 10.47.115.10
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,size=8m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
    healthcheck:
      # busybox wget, in the alpine-based image; / answers "OK"
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  caddy:
    # INT-515: the INT-345 image plus the layer-4 module (Dockerfile.caddy),
    # so TURN over TLS shares 443 with HTTPS
    image: intake-staging/caddy:${INTAKE_GIT_SHA:?set by deploy.sh}
    build:
      context: ../..
      dockerfile: infra/staging/Dockerfile.caddy
    environment:
      STAGING_HOSTNAME: ${STAGING_HOSTNAME:?run init.sh}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # public: the published ports and ACME egress; edge: the only way to the
    # API; media (INT-515): the SFU's signalling and TURN ports, from the one
    # address the SFU trusts to state a client's address
    networks:
      public: {}
      edge: {}
      media:
        ipv4_address: 10.47.115.20
    depends_on:
      api:
        condition: service_started
      keycloak:
        condition: service_started
      oauth2-proxy:
        condition: service_started
      livekit:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

networks:
  public: {}
  edge:
    internal: true
  backend:
    internal: true
  # INT-515: the SFU, Caddy and the voice runtime. Internal, and on a fixed
  # subnet so the SFU's and Caddy's addresses can be named in livekit.yaml;
  # anything else attached is addressed from the upper half only.
  media:
    internal: true
    ipam:
      config:
        - subnet: 10.47.115.0/24
          ip_range: 10.47.115.128/25

volumes:
  pgdata: {}
  redis-data: {}
  openbao-data: {}
  minio-data: {}
  caddy-data: {}
  caddy-config: {}
