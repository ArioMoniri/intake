# INT-345: the staging backend. API, Postgres, Redis, OpenBao, an object
# store and a TLS proxy run on ONE Linux host with Docker. Nothing runs on the
# developer laptop.
#
# SYNTHETIC PATIENTS ONLY. The AWS host is in us-east-1. No real patient data
# may reach it until an in-country host exists (HB-I5, HB-L11). Every response
# carries X-Intake-Environment: staging-synthetic-only (see Caddyfile).
#
# The API boots in a non-dev posture:
#   - INTAKE_ENV=staging.
#   - The KEK mode is transit: OpenBao Transit, in server mode on file storage.
#   - No dev gate is set anywhere in this tier.
#   - INT-352: the OTP tier gets its host-generated tokenization key, and the
#     App Attest and SMS keys the operator sets. Those have no default, so an
#     empty one reaches the API empty, which it reads as unset: with no Apple
#     team id every iOS attestation is refused and no code is sent. deploy.sh
#     refuses a team id without all three SMS keys, which would otherwise
#     reach a delivery adapter that answers "sent" and sends nothing.
#   - Every credential the API requires outside dev (INT-325: the three DB
#     URLs and the object store's root pair) is a required interpolation of
#     a host-generated secret. None has a default.
#
# The object store's image is OBJECT_STORE_IMAGE, which lib.sh sets and
# exports: the one the owner chose on 2026-09-26 (owner decision D1), pinned
# by digest, and recorded with its licence by INT-347 (#550). deploy.sh
# refuses an empty or unpinned value before anything runs.
#
# Secrets come only from the root-only env file that init.sh generates on the
# host (/etc/intake-staging/.env, mode 0600). Every compose call goes through
# lib.sh, which passes that file together with -p intake-staging. Only caddy
# publishes ports, and only 80 and 443.
#
# Images are pinned by digest. Digests were resolved from the registries' v2
# APIs on 26 Sep 2026. Licences:
#   postgres    PostgreSQL Licence
#   redis 7.4   RSALv2/SSPLv1. Internal self-hosting is permitted, as recorded
#               in observability/registry.yaml.
#   openbao     MPL-2.0
#   minio       AGPL-3.0, verified from the raw LICENSE blob (INT-347)
#   caddy       Apache-2.0
name: intake-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: intake-staging/api:${INTAKE_GIT_SHA:?set by deploy.sh}
    build:
      context: ../..
      dockerfile: infra/staging/Dockerfile.api
      args:
        GIT_SHA: ${INTAKE_GIT_SHA:?set by deploy.sh}
        BUILT_AT: ${INTAKE_BUILT_AT:?set by deploy.sh}
    environment:
      INTAKE_ENV: staging
      INTAKE_API_KEK_MODE: transit
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:?run init.sh}
      INTAKE_API_DB_URL: postgresql+psycopg://app_rw:${PG_APP_RW_PASSWORD:?run init.sh}@postgres:5432/intake
      INTAKE_API_AUDIT_DB_URL: postgresql+psycopg://svc_audit_writer:${PG_AUDIT_WRITER_PASSWORD:?run init.sh}@postgres:5432/intake
      INTAKE_API_BOOTSTRAP_DB_URL: postgresql+psycopg://intake:${POSTGRES_PASSWORD:?run init.sh}@postgres:5432/intake
      INTAKE_REDIS_URL: redis://:${REDIS_PASSWORD:?run init.sh}@redis:6379/0
      # The object store: the minio service below, over the internal backend
      # network. The API creates its buckets itself on first use, the audit
      # bucket with object lock, so nothing here pre-creates one.
      MINIO_ENDPOINT: minio:9000
      # The store's root pair. Outside dev the API refuses to boot without it
      # (INT-325), and it has no default here.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run init.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run init.sh}
      # INT-352: the OTP tier's phone-tokenization key, generated by init.sh.
      INTAKE_TOKENIZATION_KEY: ${INTAKE_TOKENIZATION_KEY:?run init.sh}
      # Operator-set, no default: empty reaches the API empty, which it reads
      # as unset and fails closed on (docs/runbooks/staging.md, "App Attest
      # and SMS").
      INTAKE_APP_ATTEST_TEAM_ID: ${INTAKE_APP_ATTEST_TEAM_ID}
      INTAKE_APP_ATTEST_BUNDLE_ID: ${INTAKE_APP_ATTEST_BUNDLE_ID}
      INTAKE_APP_ATTEST_ENVIRONMENT: ${INTAKE_APP_ATTEST_ENVIRONMENT}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_FROM: ${TWILIO_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
      minio:
        condition: service_healthy
    # both networks are internal: the API has no route to the internet
    networks: [backend, edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:16.15-trixie@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_USER: intake
      POSTGRES_DB: intake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run init.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "intake", "-d", "intake"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # The password reaches redis-server on stdin, so it never appears in any
    # process's argv, which the host's `ps` shows to every user. redis-cli
    # reads the same variable for the healthcheck.
    user: redis
    command:
      - sh
      - -c
      - |
        exec redis-server - <<EOF
        requirepass $$REDISCLI_AUTH
        appendonly yes
        EOF
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?run init.sh}
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  openbao:
    image: openbao/openbao:2.6.3@sha256:a60afafda36337abe833c4a63894bf1095098f29abea4091e7e555a33dd52889
    # The image's default CMD starts a dev server, and its entrypoint's
    # `server` branch appends dev flags. This command starts with `bao`, so
    # the entrypoint runs it unchanged, as the image's non-root user.
    command: ["bao", "server", "-config=/openbao/config/openbao.hcl"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - openbao-data:/openbao/file
      - ./openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
    # OpenBao 2.6 no longer locks its memory, so swap is kept off or
    # encrypted on the host instead (lib.sh require_no_unencrypted_swap, run
    # by init.sh and deploy.sh before this service starts). The memlock
    # rlimit and IPC_LOCK stay only so a binary that carries the file
    # capability still starts.
    ulimits:
      memlock: -1
    cap_add: [IPC_LOCK]
    networks: [backend]
    healthcheck:
      # 200 only when initialised, unsealed and active, so the API waits for unseal
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  minio:
    # S3-compatible store for the documents and the WORM audit copies. The
    # image is lib.sh's OBJECT_STORE_IMAGE (see the header). Its entrypoint
    # prefixes `minio`, so this command runs `minio server /data`.
    image: ${OBJECT_STORE_IMAGE:?set by lib.sh}
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run init.sh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run init.sh}
      # no web console: nothing on this host administers the store by hand
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data
    # internal only, and no published port: the api is its only client
    networks: [backend]
    healthcheck:
      # the image bundles the mc client; `mc ready local` is its readiness check
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    environment:
      STAGING_HOSTNAME: ${STAGING_HOSTNAME:?run init.sh}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # public: the published ports and ACME egress; edge: the only way to the API
    networks: [public, edge]
    depends_on:
      api:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

networks:
  public: {}
  edge:
    internal: true
  backend:
    internal: true

volumes:
  pgdata: {}
  redis-data: {}
  openbao-data: {}
  minio-data: {}
  caddy-data: {}
  caddy-config: {}
