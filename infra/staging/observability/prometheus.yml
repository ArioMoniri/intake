# INT-481 — Prometheus on the synthetic staging host (compose.obs.yaml).
#
# SYNTHETIC PATIENTS ONLY (HB-I5, HB-L11). Internal networks only: nothing here
# is published, and nothing here reaches the internet.
#
# What is scraped, every 30 s:
#   api         the API's /metrics (INT-021 http_* and every catalogued family)
#   node        node-exporter: host CPU, memory, root-disk and load, plus the
#               deploy markers deploy.sh writes as a textfile
#   blackbox    synthetic HTTP probes of every staging service's own health
#               endpoint, over the internal networks
#   prometheus  this server's own storage figures (size against the cap)
#
# Invariant 6, at ingestion. Every job ends with ONE `labelkeep` whose regex is
# exactly intake_platform.observability.labels.ALLOWED_LABEL_KEYS: a label key
# nobody reviewed is dropped before it is stored, whatever a service or an
# exporter sends. Every exporter job also keeps only the families
# observability/metrics_catalog.yaml lists for it (invariant 13). The two
# node-exporter memory families are renamed to lower case first, because the
# catalogue's names are lower case. tests/observability/test_metric_labels.py
# and tests/infra/test_staging_obs_tier.py hold all of this to the catalogue.
#
# Every job also caps samples, labels and label values per scrape: a value that
# grew without bound would fail the scrape rather than fill the store.
#
# The rule files are the committed ones (infra/observability/, generated from
# docs/slo and infra/costs, plus the security and safety rules) and this
# host's own rules (staging-rules.yaml).
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/prometheus-rules.yaml
  - /etc/prometheus/rules/cost-rules.yaml
  - /etc/prometheus/rules/security-rules.yaml
  - /etc/prometheus/rules/safety-rules.yaml
  - /etc/prometheus/rules/staging-rules.yaml

scrape_configs:
  - job_name: api
    sample_limit: 50000
    label_limit: 12
    label_name_length_limit: 64
    label_value_length_limit: 128
    static_configs:
      - targets: ["api:8000"]
    metric_relabel_configs:
      - &labelkeep
        action: labelkeep
        regex: "__name__|action|actor|adapter|age_band|agreement|alertname|alertstate|asn|blocker|branch|budget_id|cache|change|channel|class|code|complete|component|conclusion|control|cpu|data_class|direction|document_type|endpoint|event|experiment|field|from_component|from_state|gate|gateway|generation|gpu_index|group|guardrail|head_sha|host_id|implementation|instance|instrument|job|key|kind|lane|le|level|locale|major|member|message_class|method|minor|mode|new_level|outcome|pack|patchlevel|period|phase|pr|privileged|profile|provider|quantile|queue|reason|reason_class|result|route|rule|run_number|scope|section|service|severity|signal|slo|source|spec|stage|state|status|step|stream|subject_count|tag|target|tenant|to|to_component|to_state|tool|trigger|type|under_grant|vendor|version|view|violation|vital|voice|window|workflow"

  - job_name: node
    sample_limit: 2000
    label_limit: 8
    label_name_length_limit: 64
    label_value_length_limit: 128
    static_configs:
      - targets: ["node-exporter:9100"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: node_memory_MemTotal_bytes
        target_label: __name__
        replacement: node_memory_memtotal_bytes
      - source_labels: [__name__]
        regex: node_memory_MemAvailable_bytes
        target_label: __name__
        replacement: node_memory_memavailable_bytes
      - source_labels: [__name__]
        action: keep
        regex: "node_cpu_seconds_total|node_memory_memtotal_bytes|node_memory_memavailable_bytes|node_filesystem_size_bytes|node_filesystem_avail_bytes|node_load1|node_load15|node_textfile_scrape_error|deploy_event_timestamp_seconds"
      - *labelkeep

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    sample_limit: 500
    label_limit: 8
    label_name_length_limit: 64
    label_value_length_limit: 128
    # One target per probed endpoint, each named by its `component` id. The
    # target URL becomes the probe's parameter and never a label: `instance`
    # is rewritten to the component id.
    static_configs:
      - targets: ["http://api:8000/readyz"]
        labels: {component: api}
      - targets: ["http://admin-web:3000/healthz"]
        labels: {component: admin-web}
      - targets: ["http://oauth2-proxy:4180/ping"]
        labels: {component: admin-login}
      - targets: ["http://keycloak:9000/health/ready"]
        labels: {component: keycloak}
      - targets: ["http://oauth2-proxy-grafana:4180/ping"]
        labels: {component: grafana-login}
      - targets: ["http://grafana:3000/api/health"]
        labels: {component: grafana}
      - targets: ["http://alertmanager:9093/-/ready"]
        labels: {component: alertmanager}
      - targets: ["http://prometheus:9090/-/ready"]
        labels: {component: prometheus}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [component]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: "probe_success|probe_duration_seconds|probe_http_status_code"
      - *labelkeep

  - job_name: prometheus
    sample_limit: 5000
    label_limit: 8
    label_name_length_limit: 64
    label_value_length_limit: 128
    static_configs:
      - targets: ["localhost:9090"]
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: "prometheus_tsdb_storage_blocks_bytes|prometheus_tsdb_head_series|prometheus_tsdb_retention_limit_bytes|prometheus_config_last_reload_successful"
      - *labelkeep
