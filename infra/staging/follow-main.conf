# INT-511 — the synthetic host follows main (docs/runbooks/staging.md,
# "Following main"). scripts/ci/staging_follow_lib.py reads this file as
# KEY=value lines and refuses anything else. Nothing sources it, so nothing in
# it runs. It holds no secret.
#
# FOLLOW_TRIGGER is which event deploys:
#   nightly      the scheduled run deploys main's head once a night
#   green_merge  each push to main deploys once every check on it is green
# A person (make staging-follow-main, or "Run workflow") deploys under either.
#
# The owner picks the trigger. Until the owner does, it is nightly and
# FOLLOW_TRIGGER_DECIDED_BY says it is the default. Moving it to green_merge
# needs FOLLOW_TRIGGER_DECIDED_BY=owner:<YYYY-MM-DD>, or the job refuses to
# start: change both lines in the same commit.
FOLLOW_TRIGGER=nightly
FOLLOW_TRIGGER_DECIDED_BY=default-pending-owner
# UTC, five fields. The staged workflow's schedule must equal it (tested).
FOLLOW_NIGHTLY_CRON=17 2 * * *
# The commit status that carries the smoke verdict
FOLLOW_STATUS_CONTEXT=staging-smoke
# The synthetic host: simulated patients only (HB-I5, HB-L11). These are the
# values docs/release/production-checklist.md names.
STAGING_INSTANCE=i-0e489e48739f5de98
STAGING_REGION=us-east-1
STAGING_BUCKET=onvizit-deploy-artefacts-235229001983
STAGING_HOSTNAME=3-211-2-143.sslip.io
