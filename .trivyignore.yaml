# Trivy ignore file — INT-019 (invariant 14: gates are not weakened; a row here
# must name something provably inapplicable, never a risk we have decided to
# accept quietly).
#
# Scoped by PURL, never by bare CVE id: a bare `id:` row would suppress the
# advisory for every package in the tree forever, including a real dependency
# that acquires it later. tests/ci/test_security_gates.py pins that shape —
# every row must carry a purls list — so this file cannot quietly become a
# global mute.

vulnerabilities:
  - id: CVE-2026-33310
    purls:
      - "pkg:pypi/intake@0.1.0"
    statement: >
      NAME COLLISION WITH NOTHING, not a vulnerability we are accepting.
      CVE-2026-33310 is a shell() expansion command injection in the PyData
      `intake` data-catalog project on PyPI. What trivy matched is not that
      project and is not a package at all: uv.lock records
      `intake 0.1.0` as `source = { virtual = "." }` — this repository's own
      workspace root, declared `[tool.uv] package = false` with no
      `[build-system]`, so it is never built, never published and never
      resolved from PyPI. It ships zero source files; `shell()` appears
      nowhere in the tree.

      Observed rather than assumed: `trivy fs --scanners vuln --severity
      CRITICAL,HIGH` on 3 Sep 2026 reported exactly this one finding against
      uv.lock and nothing else, and reported it again with this row removed
      (docs/evidence/INT-019.md).

      ⚠️ A first-party distribution sharing a name with a public PyPI project
      is a dependency-confusion surface in its own right, and suppressing the
      advisory does not remove it. The durable fix is to rename the workspace
      root; that touches uv.lock, which every open branch is also editing, so
      it is recorded for the owner rather than done inside INT-019.

  - id: CVE-2026-85393
    purls:
      - "pkg:npm/node-forge@1.4.0"
    # Time-boxed. trivy stops honouring this row after this date, so the
    # vulnerabilities gate turns red again unless node-forge has shipped a fix
    # by then or the dependency is gone (INT-429).
    expired_at: 2026-11-01
    statement: >
      OWNER-APPROVED, TIME-BOXED EXCEPTION, not a quiet acceptance. The owner
      approved it on 2 Oct 2026 ("i approve node-forge ignore", relayed in the
      INT-429 session). CVE-2026-85393 is an RSA PKCS#1 v1.5 signature
      forgery in node-forge, and trivy lists no fixed version: 1.4.0 is the
      newest release on npm.

      How it is reached: node-forge 1.4.0 is in pnpm-lock.yaml only as a
      dependency of @expo/cli 57.0.19 and @expo/code-signing-certificates
      0.0.6. Both are Node developer tooling. @expo/cli loads it from two
      modules only. utils/codesigning.js signs development manifests in the
      `expo start` dev server and is also reached from the `expo logout`
      command. run/ios/codeSigning/Security.js reads the developer's own
      keychain certificates for `expo run:ios` on a device. Neither module
      runs during `expo export`, and no app source imports node-forge. The
      production iOS and Android `expo export` bundles carry no node-forge
      code; the measured check is recorded in docs/evidence/INT-429.md.

      This row expires after 30 days. Removing it sooner is always correct.

  - id: CVE-2026-93687
    purls:
      - "pkg:npm/braces@3.0.3"
    # Time-boxed, same expiry as the matching osv-scanner.toml entry
    # (GHSA-vfj7-8cjw-p6xm). trivy stops honouring this row after this date.
    expired_at: 2026-11-02
    statement: >
      OWNER-APPROVED, TIME-BOXED EXCEPTION, not a quiet acceptance. The owner
      approved it in chat on 3 Oct 2026 ("approve for the two osv
      exceptions", then "patch" for this trivy row). This is the same braces
      3.0.3 advisory as the osv entry: stack-exhaustion denial of service
      through deeply nested patterns. No fixed release exists, and the
      newest micromatch still needs ^3.0.3.

      How it is reached: braces 3.0.3 is in pnpm-lock.yaml only under
      micromatch 4.0.8, under metro-file-map 0.84.5, Metro's build-time file
      crawler. It expands glob patterns from the repository's own build
      configuration, never patient input. It is not in either production
      `expo export` bundle, and no server runtime image installs npm packages
      (docs/evidence/INT-426.md). Removing this row sooner is always correct.
