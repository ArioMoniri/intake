[project]
name = "intake-learning"
version = "0.1.0"
description = "INTAKE Loop 2: Inspector -> Architect over de-identified aggregates, emitting signed proposals and never applying one (INT-172)"
requires-python = ">=3.12"
# Deliberately short, and the shortness is the control. There is no HTTP
# client, no git client, no secrets client and no `packages/protocols`: the
# proposal_scope gate asserts the pipeline's import closure reaches none of
# them, which is what makes files/09 §7's "sandboxed job ... no egress" a
# property of the source rather than of a container policy.
dependencies = [
    "fastapi>=0.115",
    "intake-platform",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
intake-platform = { workspace = true }

[tool.intake]
health = "intake_learning.app:create_app"
probe = "learning.http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intake_learning"]
