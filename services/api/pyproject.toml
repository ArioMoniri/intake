[project]
name = "intake-api"
version = "0.1.0"
description = "Patient/clinician JSON API — dev-tier slice (INT-197): dev-bearer auth over two synthetic accounts, visits, notes, documents on the INT-030 schema; real OIDC auth is INT-131"
requires-python = ">=3.12"
dependencies = [
    "cbor2>=6.1.4",
    "fastapi>=0.115",
    "intake-clinical-schemas",
    "intake-connectors",
    "intake-metrics",
    "intake-platform",
    "intake-probes",
    "intake-protocols",
    # ADR-028 (on-demand variant): the dev George clip route reuses the
    # ElevenLabs clip-gen adapter + numeral guard rather than duplicating a
    # security-sensitive vendor adapter (services/api/.../dev_voice.py).
    "intake-voice-clips",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "sqlalchemy[asyncio]>=2.0.36",
]

[tool.uv.sources]
intake-clinical-schemas = { workspace = true }
intake-connectors = { workspace = true }
# INT-241: the admin Experience surface renders the rollups services/metrics
# owns. Declared rather than duplicated — a second k-anonymity floor is a
# floor that gets lowered by accident (files/08 §0c F9).
intake-metrics = { workspace = true }
intake-platform = { workspace = true }
# INT-183: the models module READS observability/registry.yaml and calls the
# INT-022 release gate rather than reimplementing either. A second
# implementation of a gate is a gate that disagrees with itself on the day
# it matters (invariant 13).
intake-probes = { workspace = true }
intake-protocols = { workspace = true }
intake-voice-clips = { workspace = true }

[tool.intake]
health = "intake_api.app:create_app"
probe = "api.http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intake_api"]
