[project]
name = "intake-api"
version = "0.1.0"
description = "Patient/clinician JSON API — dev-tier slice (INT-197): dev-bearer auth over two synthetic accounts, visits, notes, documents on the INT-030 schema; real OIDC auth is INT-131"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "intake-clinical-schemas",
    "intake-metrics",
    "intake-platform",
    "intake-protocols",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "sqlalchemy[asyncio]>=2.0.36",
]

[tool.uv.sources]
intake-clinical-schemas = { workspace = true }
# INT-241: the admin Experience surface renders the rollups services/metrics
# owns. Declared rather than duplicated — a second k-anonymity floor is a
# floor that gets lowered by accident (files/08 §0c F9).
intake-metrics = { workspace = true }
intake-platform = { workspace = true }
intake-protocols = { workspace = true }

[tool.intake]
health = "intake_api.app:create_app"
probe = "api.http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intake_api"]
