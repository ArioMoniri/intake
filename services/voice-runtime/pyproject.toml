[project]
name = "intake-voice-runtime"
version = "0.1.0"
description = "Layer A — the realtime Talker: six tools, streaming PolicyGuard, safe insertion window, clip player (INT-091; ADR-009, files/03 §4)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "intake-clinical-schemas",
    "intake-platform",
    "intake-protocols",
    "prometheus-client>=0.20",
    "pydantic>=2.8",
]

[tool.uv.sources]
intake-clinical-schemas = { workspace = true }
intake-platform = { workspace = true }
intake-protocols = { workspace = true }

[tool.intake]
health = "intake_voice_runtime.app:create_app"
probe = "voice-runtime.http"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intake_voice_runtime"]
