# docs/slo/probes.yaml — SLOs for services/probes (INT-022; invariant 15).
#
# Same conventions as docs/slo/api.yaml (schema: intake_platform.slo.SLOFile).
# The probes service exposes the shared http middleware (mounted by the INT-021
# close-out — until then nothing served this SLI), so its SLI rides the
# catalogued http_requests_total family. Its burn-rate rules and its
# golden-signal dashboard are generated from this file (INT-021 close-out:
# infra/observability/prometheus-rules.yaml and
# infra/observability/grafana/dashboards/, both drift-gated).
service: probes
owner: platform
slos:
  - name: availability
    sli: >-
      sum(rate(http_requests_total{service="probes",status=~"5.."}[5m]))
      /
      sum(rate(http_requests_total{service="probes"}[5m]))
    objective: 99.5
    window: 28d
    burn_rate_alerts:
      fast:
        factor: 14.4
        long_window: 1h
        short_window: 5m
        for_duration: 2m
        severity: page
      slow:
        factor: 6.0
        long_window: 6h
        short_window: 30m
        for_duration: 15m
        severity: page
      ticket:
        factor: 1.0
        long_window: 3d
        short_window: 6h
        for_duration: 1h
        severity: ticket
