# ----------------------------------------------------------------- device audit

device_audit:
  owner: owner
  status: pending
  purpose: >-
    Each Not Evaluated row turns on something only a device can show: what a
    screen reader announces, where focus goes, or what a keyboard reaches. Each
    item below is a scripted walkthrough, run on a release build on a physical
    iPhone with VoiceOver and a physical Android phone with TalkBack unless the
    item says otherwise. For each item, record the device, OS version, build,
    date and what was observed. Then set the rows it decides to the status the
    observation supports, and re-render. Items also list the Supports rows they
    confirm; an observation that contradicts one of those changes it too.
  items:
    DA-01:
      title: Reading order and arrival on each screen
      platforms: [iPhone with VoiceOver, Android phone with TalkBack]
      decides: ["1.3.2", "2.4.2"]
      confirms: ["1.3.1", "1.3.3"]
      steps: >-
        On every screen in the route tree, swipe from the first element to the
        last. Record whether the order matches the visual and logical order,
        especially on the dialogue screen (transcript, section strip, CTA stack,
        composer). Navigate into every screen and record the first thing
        announced: the navigator title, or the in-body heading on the intake
        and review flows. Open the headings rotor on three screens and record
        what it lists. On the three screens whose copy says "aşağıdaki", confirm
        that the content referred to follows in reading order.
    DA-02:
      title: Keyboard, Switch Control and a visible focus
      platforms:
        - iPhone with Full Keyboard Access and Switch Control
        - Android phone with a hardware keyboard and Switch Access
      decides: ["2.1.1", "2.1.2", "2.4.7"]
      confirms: ["4.1.2"]
      steps: >-
        With an external keyboard, then with switch access, reach and activate
        every control on every screen. Include the section sheet, the consent
        switch's custom action, the OTP boxes and the dialogue composer. Record
        any control that cannot be reached or activated, any place focus cannot
        leave, and whether the focus indicator is visible on each control in
        both colour schemes.
    DA-03:
      title: Focus order and the section sheet
      platforms: [iPhone with VoiceOver, Android phone with TalkBack]
      decides: ["2.4.3"]
      steps: >-
        In the dialogue, open and close the section sheet. Record where focus
        lands on open and on close. Move through the phone, OTP and new-visit
        forms and record the focus order, including the jump the OTP screen makes
        after each digit.
    DA-04:
      title: Changes of context on focus and on input
      platforms: [iPhone with VoiceOver, Android phone with TalkBack]
      decides: ["3.2.1", "3.2.2"]
      steps: >-
        Enter a code on the OTP screen and record what is announced when focus
        advances after each digit, and whether the patient can tell where they
        are. Move focus across every control on the new-visit and review screens
        without activating anything, and record any change of screen, sheet or
        content.
    DA-05:
      title: Largest text, reflow and landscape
      platforms: [iPhone, Android phone]
      decides: ["1.4.10"]
      confirms: ["1.3.4", "1.4.4"]
      steps: >-
        Set the OS text size to its largest accessibility size, then, separately,
        choose the app's largest text-size step. On every screen, record clipped
        or overlapping text, controls pushed off screen, and any need to scroll in
        two directions. Then hold the phone in landscape (INT-360) and walk every
        screen again with both text settings, on a 6.1-inch phone and on the
        smallest phone available. Take a screenshot of each screen. Include the
        sign-in screens, the tab screens, the intake's typed steps, the
        dialogue with the keyboard up in the composer and on a typed text
        answer, the section sheet, and the review screen. Include the kiosk
        warning and staff bar once kiosk mode can be armed. Record any screen
        that stays in portrait when the phone turns, any control the keyboard
        hides while its field has focus, and anything under the notch.
    DA-06:
      title: Focus under the glass bars
      platforms:
        - iPhone with Full Keyboard Access
        - Android phone with a hardware keyboard
      decides: ["2.4.11"]
      steps: >-
        With keyboard focus, move through the review screen and the dialogue.
        Record any focused control that is entirely hidden behind the glass bar.
    DA-07:
      title: One-time code entry
      platforms: [iPhone, Android phone]
      decides: []
      confirms: ["3.3.8"]
      steps: >-
        With a real SMS code on each platform: (a) with focus in the first box,
        take the keyboard's code suggestion (iOS "From Messages", or Android's SMS
        suggestion if one appears); (b) copy the code from the messages app and
        paste it into the first box. Record what each of the six boxes holds
        after each attempt.
    DA-08:
      title: Announcements and the platform accessibility tree
      platforms:
        - iPhone with VoiceOver and Xcode Accessibility Inspector
        - Android phone with TalkBack and Accessibility Scanner
      decides:
        - EN 11.5.2.9
        - EN 11.5.2.13
        - EN 11.5.2.14
        - EN 11.5.2.15
        - EN 11.5.2.16
        - EN 11.5.2.17
      confirms: ["2.2.1", "3.1.1", "3.3.1", "4.1.2", "4.1.3"]
      steps: >-
        Trigger every error and status line on both platforms, and record whether
        each is spoken once, errors with "Hata" first: every line in the table in
        `docs/evidence/INT-362.md` (the four screens' errors, the Doctor Link
        error, the record card's notices, the kiosk PIN lines and the write
        failures among them), the dialogue's listening, speaking and transcribing
        states, and the records upload, scan and reading lines. Send a note,
        and with the device offline change a consent and a notification
        setting. Record that each outcome line is spoken once when it happens
        (the notification line with "Hata" first) and is not spoken when its
        screen is opened again or while the change is still on its way. Once
        kiosk mode can be armed (the dev build, HB-A3), leave an armed session
        untouched for 40 seconds. Record whether the idle warning is spoken in
        full, whether focus lands on its "Devam edin" button, and whether one
        double-tap keeps the session. Set
        the app language differently from the device language and record whether
        each reader uses the right voice. Inspect the running app with the
        platform inspector for the section sheet, the consent list and the intake
        chips. Record the parent-child structure exposed, whether focus and
        selection changes are reported, whether state and value changes are
        notified, and whether assistive technology can set them.

