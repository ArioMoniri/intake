# docs/compliance/accessibility-conformance.yaml — the source of record for the
# accessibility conformance report (INT-226).
#
# Rendered by scripts/compliance/render_a11y_report.py into
# docs/compliance/accessibility-conformance-report.md. Edit this file, re-render,
# and commit both. tests/legal/test_a11y_report.py fails when they drift.
#
# Rules the gate enforces, so a row cannot say more than its evidence:
#   - every WCAG 2.2 Level A and AA success criterion appears exactly once;
#   - every row except Not Evaluated cites at least one automated test
#     (`tests`, as `<path>::<exact it/test title>`, in a vitest file CI runs) or
#     one recorded manual check (`manual`, an id under `manual_checks`);
#   - a cited title must name exactly one test in that file;
#   - Partially Supports and Does Not Support carry a `finding`;
#   - Not Evaluated means a device audit item `decides` the row, and a row a
#     device audit item decides cannot carry any other status;
#   - a contrast pair listed under `contrast` is measured from
#     apps/mobile/src/lib/theme.ts at render time, and the row's status must
#     agree with the measurement;
#   - a Partially Supports or Does Not Support row cannot lean on an issue
#     that docs/backlog/issues.yaml marks `done` (an INT id its finding or
#     remarks name, or an issue whose title opens `WCAG <sc>:`). Re-assess the
#     row, or record `still_open_because:` with what the fix left open; the
#     report prints that reason in the row (INT-387).
#
# Status vocabulary: Supports · Partially Supports · Does Not Support ·
# Not Applicable · Not Evaluated. The first four are the ITI VPAT terms.
# Not Evaluated is used for Level A and AA rows here, which a VPAT reserves for
# AAA, because the alternative would be a Supports this report cannot back.

report:
  product_short: Vizite mobile (`apps/mobile`)
  product: Vizite — patient pre-visit intake, mobile application (`apps/mobile`)
  platforms: >-
    iOS and Android from one Expo / React Native code base, phone form factor
    (`supportsTablet: false`)
  assessed_on: 2026-09-27
  tree: >-
    `origin/main` at `066fb8a5`, re-assessed on branch `int-226-a11y-conformance`.
    INT-387 re-assessed 3.3.1, 3.3.8 and 4.1.3, and the 3.2.2 remark, against
    `origin/main` at `c489289e`, on branch `int-387-conformance-refresh`.
    INT-397 re-assessed 4.1.3 on branch `int-397-status-lines`, built on
    `int-387-conformance-refresh` at `76d98388`. INT-422 re-assessed 1.4.3
    and 1.4.11 on branch `int-422-design-system-refresh`, against the palette
    it introduced
  assessed_by: >-
    INT-226 engineering pass: automated source assertions, code inspection and
    palette arithmetic. Rows re-assessed since, by the same method: 1.3.4 and
    1.4.10 (INT-360), 2.2.1 (INT-363), 3.3.1, 3.3.8, 4.1.3 and the 3.2.2
    remark (INT-387), 4.1.3 again (INT-397), and 1.4.3 and 1.4.11 (INT-422)
  standards: >-
    WCAG 2.2 (W3C Recommendation, 5 October 2023), Level A and AA. EN 301 549
    V3.2.1 (2021-03), clauses 5, 11 and 12 as they apply to a mobile application.
    The Ministry's "Erişilebilirlik Kontrol Listesi — A Seviyesi" through the BK
    numbers on the Level A rows (Cumhurbaşkanlığı Genelgesi 2025/10, RG 32933;
    HUMAN_BLOCKERS.md HB-L9).
  method: >-
    Automated: vitest suites under `apps/mobile` that read the source and assert
    the accessibility properties each screen declares. Each citation names one
    test, and CI runs every one of them in `make check-ts`. Manual: code reading
    and repository searches, each recorded in §6 with its date, the command or
    file read, and what it found. Contrast: computed from the palette in
    `apps/mobile/src/lib/theme.ts` with the WCAG 2.x relative-luminance formula
    each time this report is rendered.
  not_done: >-
    No VoiceOver, TalkBack, Switch Control, Voice Control, external-keyboard or
    braille session. No run on hardware at the largest text size. No testing
    with disabled users. The device audit in §5 covers the first two, and the
    owner performs it.
  reading_notes:
    - >-
      **This report states tested results. It is not a declaration of
      conformance.** Every status is backed by at least one named automated test
      or one dated manual check, and the evidence column names them. No row rests
      on a device screen-reader run, because none has been performed.
    - >-
      **What the automated evidence can and cannot prove.** React Native has no
      DOM, so no axe-style engine can run: the accessibility tree is built by the
      OS at runtime, on a device. The tests prove that the source declares what
      that tree is built from: roles, names, states, languages, announcements,
      target sizes and the motion policy. A Supports row therefore means the
      mechanism is present, asserted and read. Nobody has yet heard it through a
      screen reader. The device audit (§5) confirms or overturns these rows.
    - >-
      **The BK numbers are derived, not transcribed** (HB-L9). WCAG 2.2 Level A
      has exactly 31 criteria, and the Ministry checklist has 31 Başarı Kriteri
      mapped 1:1, so the correspondence is forced. The order follows canonical
      WCAG numbering. Check each number against the Ministry's published
      checklist before citing it in an İnceleme Komisyonu submission.
    - >-
      **Scope.** Every screen of `apps/mobile`. Kiosk mode is built but cannot
      activate in the current runtime (`readKioskProvisioning` returns null until
      the dev-build native layer exists), so it is out of scope except where a
      row names it. The RED emergency delivery route still has no user
      interface: on 2026-09-26, `grep -rn lib/livekit apps/mobile/src/app
      apps/mobile/src/components` returned nothing. Nothing on that route is
      assessed. `docs/compliance/accessibility-conformance.md` §4 lists the
      requirements the issue that builds it must carry. `apps/clinician-web` and
      `apps/admin-web` (EN 301 549 clause 9) are not assessed.
    - >-
      **Relation to INT-144's report.** `docs/compliance/accessibility-conformance.md`
      (29 August 2026) remains the narrative assessment, and rows here cite its
      sections. Where the two differ, this report is the status of record.
      Re-assessment changed these rows: 1.3.4 (unverified, then Does Not
      Support because the app config locked portrait, and Supports since INT-360
      removed the lock); 3.3.1 (supported, then Partially Supports because
      error lines added since were silent under VoiceOver, and Supports since
      INT-362 routed every error line through one announcer); 3.3.8 (not
      assessed before, then Does Not Support, and Supports since INT-361 let a
      delivered code fill the boxes); 4.1.3 (not assessed before, then
      Partially Supports because INT-362 closed the three lines INT-226 named
      and three others stayed silent, and Supports since INT-397 announced
      those three when they happen); 3.1.2 (unverified, now Partially Supports); 1.3.5
      (partial, now Supports, on a recorded field inventory); 1.4.12 and 2.4.5
      (supported by inspection, now Not Applicable, with the reason in each
      row). Two of INT-144's supporting statements did not hold on 26
      September: the OTP autofill mitigation named under BK26 (MC-16), which
      the source carries since INT-361 and DA-07 confirms on a device, and
      "exactly one timer in the whole app" under BK13,
      which is true of screens and components only (MC-08).
  status_meanings:
    Supports: >-
      Met as far as the cited evidence reaches, with no known failure. Not yet
      heard through a screen reader on a device.
    Partially Supports: >-
      Part of the app meets the criterion and a named part does not. The finding
      says which part.
    Does Not Support: >-
      The app, or its only path through the function concerned, fails the
      criterion. The finding says how.
    Not Applicable: The app contains nothing the criterion governs. The evidence shows the absence.
    Not Evaluated: >-
      The criterion turns on runtime behaviour that only a device run can decide.
      The row names the device audit item that decides it. It is neither a pass
      nor a failure.
  en_clause_11_note: >-
    EN 301 549 V3.2.1 clauses 11.1 to 11.4 apply WCAG 2.1 Level A and AA to
    non-web software under the same numbers with an `11.` prefix, so each row
    below carries the status of the WCAG row it restates. Vizite is open
    functionality (it works through the platform screen readers), so the
    "closed functionality" variants of those clauses do not apply. The standard
    declares some of these clauses void for non-web software. They are not
    marked here, because the standard's text is not in this repository and a
    void clause can only remove an obligation this report already assesses. The
    six criteria new in WCAG 2.2 have no clause in V3.2.1 and appear only in §1
    and §2. Clauses addressed to platform software or assistive technology
    (11.5.2.1, 11.5.2.2, 11.5.2.4, 11.6.1) do not apply to an application and
    are not tabulated.

# ----------------------------------------------------------------- WCAG 2.2

wcag:
  - sc: "1.1.1"
    name: Non-text Content
    level: A
    bk: BK1
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every Pressable declares accessibilityLabel"
      - "apps/mobile/e2e/a11y.spec.ts::the send button is icon-only, so its name and disabled state are explicit"
      - "apps/mobile/e2e/a11y.spec.ts::the intake progress is one progressbar whose value is spoken, not a hue"
      - "apps/mobile/e2e/a11y.spec.ts::the prep gauge reports a value, not only a rendered arc"
    manual: [MC-01]
    remarks: >-
      Glyphs sit inside a named control or are hidden as decoration. The one
      graphical data display, the preparation gauge, exposes a progress value.
      The app renders no image content (MC-01).

  - sc: "1.2.1"
    name: Audio-only and Video-only (Prerecorded)
    level: A
    bk: BK2
    status: Supports
    tests:
      - "apps/mobile/e2e/askAhead.spec.ts::builds the bubble body from the catalog, never from the playback flag"
      - "apps/mobile/e2e/askAhead.spec.ts::keeps every {body} out of a playback-gated expression"
    manual: [MC-02]
    remarks: >-
      The agent's speech is pre-synthesised audio. The same question text renders
      in the transcript without waiting for playback, so audio is never the only
      carrier. There is no video.

  - sc: "1.2.2"
    name: Captions (Prerecorded)
    level: A
    bk: BK3
    status: Not Applicable
    manual: [MC-02]
    remarks: No synchronised media. The app has no video and no audio paired with moving images.

  - sc: "1.2.3"
    name: Audio Description or Media Alternative (Prerecorded)
    level: A
    bk: BK4
    status: Not Applicable
    manual: [MC-02]
    remarks: No synchronised media, for the same reason as 1.2.2.

  - sc: "1.3.1"
    name: Info and Relationships
    level: A
    bk: BK5
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every screen that renders a hero line marks one as a heading"
      - "apps/mobile/e2e/a11y.spec.ts::AppText carries the heading semantic itself, so screens cannot spell it wrong"
      - "apps/mobile/e2e/a11y.spec.ts::guidance blocks title their own section"
      - "apps/mobile/e2e/a11y.spec.ts::every TextInput declares accessibilityLabel"
      - "apps/mobile/e2e/a11y.spec.ts::the transcript itself is a named region"
      - "apps/mobile/e2e/appearance.spec.ts::the container declares the group and its name"
    remarks: >-
      Headings, groups and form labels are declared. React Native's header role
      has no level, so a screen's title and its section titles present as one
      flat list of headings. That is a platform limit, recorded here rather than
      claimed away (INT-144 report §6.2).

  - sc: "1.3.2"
    name: Meaningful Sequence
    level: A
    bk: BK6
    status: Not Evaluated
    remarks: >-
      Reading order follows render order. Only the bottom chrome is positioned,
      and it renders last. Whether VoiceOver and TalkBack traverse the dialogue's
      four stacked regions in that order is for DA-01 to decide.

  - sc: "1.3.3"
    name: Sensory Characteristics
    level: A
    bk: BK7
    status: Supports
    manual: [MC-03]
    remarks: >-
      No instruction relies on shape, colour, size or position alone. Three
      strings refer to content "aşağıdaki" (below) that follows in reading
      order. DA-01 confirms that order.

  - sc: "1.4.1"
    name: Use of Color
    level: A
    bk: BK8
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::the intake progress is one progressbar whose value is spoken, not a hue"
      - "apps/mobile/e2e/a11y.spec.ts::the status ladder speaks which rungs are reached"
      - "apps/mobile/e2e/a11y.spec.ts::an error is never carried by colour alone"
      - "apps/mobile/e2e/appearance.spec.ts::the active item is still not carried by colour alone once the label is gone"
      - "apps/mobile/e2e/appearance.spec.ts::the knob moves as well as recolouring — state is never hue alone"
      - "apps/mobile/e2e/appearance.spec.ts::selection is marked by more than a fill once the rows stack"
    remarks: Progress, status, selection, switch state and errors each carry a word, a shape or an announcement beside the colour.

  - sc: "1.4.2"
    name: Audio Control
    level: A
    bk: BK9
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::the agent's words stay in the agent bubble's name while it is speaking"
      - "apps/mobile/e2e/intakeMode.spec.ts::the mode chooser is wired before the questions and records the choice"
    remarks: >-
      The agent's speech plays automatically and often runs longer than three
      seconds. Tapping the speaking bubble pauses it (barge-in). The bubble keeps
      the spoken words as its name and carries the affordance as a hint. The
      typed mode, offered before the first question, is the standing alternative
      for a patient who cannot use audio.

  - sc: "2.1.1"
    name: Keyboard
    level: A
    bk: BK10
    status: Not Evaluated
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every Pressable declares accessibilityRole"
    remarks: >-
      Every control is a Pressable with a declared role, which is the
      precondition for keyboard and Switch Control operation. Whether each
      control is actually reached and activated is for DA-02 to decide.

  - sc: "2.1.2"
    name: No Keyboard Trap
    level: A
    bk: BK11
    status: Not Evaluated
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::the flag sits on the sheet, not on <Modal>, where RN would drop it"
    remarks: >-
      The section sheet declares itself modal on the sheet container, the only
      placement React Native honours. It neither moves focus in on open nor
      restores it on close. Whether that traps a keyboard or Switch Control user
      is for DA-02 to decide.

  - sc: "2.1.4"
    name: Character Key Shortcuts
    level: A
    bk: BK12
    status: Not Applicable
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::BK12 / SC 2.1.4 — no character key shortcuts exist"
    remarks: The app defines no single-character shortcut.

  - sc: "2.2.1"
    name: Timing Adjustable
    level: A
    bk: BK13
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::BK13 / SC 2.2.1 — every timer under src, lib included, limits nothing or warns before it acts"
      - "apps/mobile/e2e/a11y.spec.ts::a timer planted outside a screen, or a time limit that skips the warning, is caught — the near-miss control"
      - "apps/mobile/e2e/a11y.spec.ts::the kiosk warning gives at least 20 seconds to extend, and the wipe still falls at 60 s"
      - "apps/mobile/src/lib/kiosk/kioskState.test.ts::with no action the wipe falls at T — the old 60 s — and only after the warning"
      - "apps/mobile/src/lib/kiosk/kioskState.test.ts::one action — extend — returns to active and restarts the full timeout"
      - "apps/mobile/src/lib/kiosk/kioskState.test.ts::can be extended again and again — ten times and more, never wiping"
      - "apps/mobile/e2e/kiosk.spec.ts::offers one action that extends, and moves the screen reader's focus onto it"
    manual: [MC-08]
    remarks: >-
      In the phone app the only time limit a patient meets is the OTP resend
      cooldown. It is a server rate limit and takes nothing away when it runs
      out. Kiosk mode's 60-second idle wipe is a time limit, and since INT-363
      it meets the criterion's Extend option. After 40 seconds without a touch
      it shows a warning, announces it assertively and moves screen-reader focus
      to its one action, "Devam edin". The patient then has 20 seconds. That
      action, or any touch, restarts the full minute, as often as needed. With
      no answer, the same wipe as before runs. The automated check now reads
      every script under `src`, `src/lib` included. Every timer must either be
      recorded as limiting nothing (request deadlines, retry delays, the
      barge-in meter) or run through a warning. MC-08 is the manual pass that
      found the kiosk gap. DA-08 confirms on a device that the warning is heard
      and focus lands on the button. Kiosk mode cannot activate today.

  - sc: "2.2.2"
    name: Pause, Stop, Hide
    level: A
    bk: BK14
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every looping animation, core or Reanimated, is gated on the app's reduce-motion hook"
      - "apps/mobile/src/lib/a11y/motion.test.ts::stops looping decoration — SC 2.2.2, the listening pulse"
      - "apps/mobile/e2e/motion.spec.ts::the root mounts ReducedMotionConfig from the app policy"
      - "apps/mobile/e2e/appearance.spec.ts::useReducedMotion folds the stored override in"
    remarks: >-
      The one looping animation, the listening pulse, stops when the OS asks or
      when the patient uses the app's own motion switch. Transitions and
      programmatic scrolling collapse to zero under the same policy. Nothing
      auto-updates, scrolls as a marquee or rotates as a carousel.

  - sc: "2.3.1"
    name: Three Flashes or Below Threshold
    level: A
    bk: BK15
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every loop period comes from motion.loop, and every half-period exceeds 167 ms"
    remarks: The listening pulse is an opacity fade at about 0.7 Hz, and nothing else repeats.

  - sc: "2.4.1"
    name: Bypass Blocks
    level: A
    bk: BK16
    status: Not Applicable
    manual: [MC-09]
    remarks: >-
      No screen repeats a block of content that another screen carries. The tab
      rail is the navigation itself and is rendered once, by the tabs layout.
      WCAG2ICT reads this criterion, for non-web software, as applying to a set
      of software programs. Vizite is one program.

  - sc: "2.4.2"
    name: Page Titled
    level: A
    bk: BK17
    status: Not Evaluated
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every screen that renders a hero line marks one as a heading"
    remarks: >-
      Pushed screens set a navigator title. The intake and review flows carry
      their title as an in-body heading. Whether a screen reader announces that
      heading on arrival is for DA-01 to decide.

  - sc: "2.4.3"
    name: Focus Order
    level: A
    bk: BK18
    status: Not Evaluated
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::the flag sits on the sheet, not on <Modal>, where RN would drop it"
    remarks: >-
      The OTP screen moves focus after every digit. The section sheet neither
      takes focus on open nor restores it on close. Both are for DA-03 to decide.

  - sc: "2.4.4"
    name: Link Purpose (In Context)
    level: A
    bk: BK19
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every Pressable declares accessibilityLabel"
      - "apps/mobile/e2e/a11y.spec.ts::no accessibilityLabel is a bare source string"
      - "apps/mobile/src/lib/a11y/labels.test.ts::puts the VISIBLE label first so voice control can reach the control"
    remarks: >-
      Every Pressable declares its name. Names that repeat on one screen (the
      review screen's share switches, a consent row and its switch, visit cards)
      are composed with their context.

  - sc: "2.5.1"
    name: Pointer Gestures
    level: A
    bk: BK20
    status: Not Applicable
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::BK20 / SC 2.5.1 — no path-based or multipoint gesture is required"
    remarks: Every action is a single tap. Scrolling is the platform's own.

  - sc: "2.5.2"
    name: Pointer Cancellation
    level: A
    bk: BK21
    status: Supports
    tests:
      - "apps/mobile/e2e/motion.spec.ts::no Pressable narrows the platform's press-retention default"
    manual: [MC-11]
    remarks: >-
      Every control is React Native's Pressable. It fires on release and aborts
      when the pointer leaves the target first. No handler acts on the down
      event.

  - sc: "2.5.3"
    name: Label in Name
    level: A
    bk: BK22
    status: Supports
    tests:
      - "apps/mobile/src/lib/a11y/labels.test.ts::puts the VISIBLE label first so voice control can reach the control"
      - "apps/mobile/e2e/a11y.spec.ts::no accessible name is assembled with an ad-hoc separator"
      - "apps/mobile/e2e/a11y.spec.ts::a bubble's name ends in the words the bubble actually shows"
    remarks: >-
      A composed name always starts with the control's visible words, so a
      Voice Control user who says them reaches the control.

  - sc: "2.5.4"
    name: Motion Actuation
    level: A
    bk: BK23
    status: Not Applicable
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::BK23 / SC 2.5.4 — nothing is actuated by moving the device"
    remarks: No feature is operated by moving the device.

  - sc: "3.1.1"
    name: Language of Page
    level: A
    bk: BK24
    status: Partially Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every line carries a BCP-47 tag matching the active catalog"
      - "apps/mobile/e2e/a11y.spec.ts::no screen renders a bare react-native Text, bypassing that declaration"
    finding: >-
      `accessibilityLanguage` is iOS-only in React Native. Android exposes no
      per-element language, and TalkBack speaks in its own locale. When the app
      language differs from the device language, TalkBack reads Turkish with a
      foreign voice, or the reverse.
    remarks: On iOS every line of text declares `tr-TR` or `en-GB` from the active catalog.

  - sc: "3.2.1"
    name: On Focus
    level: A
    bk: BK25
    status: Not Evaluated
    remarks: >-
      No handler changes context on focus. `autoFocus` on the first OTP box sets
      the starting position and changes nothing else. DA-04 decides.

  - sc: "3.2.2"
    name: On Input
    level: A
    bk: BK26
    status: Not Evaluated
    tests:
      - "apps/mobile/src/lib/auth/phone.test.ts::typing one digit is unchanged: this box only, then the next box"
      - "apps/mobile/src/lib/auth/phone.test.ts::a whole code pasted into the first box fills all six"
    manual: [MC-16]
    remarks: >-
      The OTP screen moves focus to the next box after each typed digit and
      does not tell the patient. Whether a screen-reader user meets that as an
      unexpected change of context is for DA-04 to decide. INT-144 named
      `textContentType="oneTimeCode"` as the mitigation. On 26 September it did
      not hold, because a delivered code could not fill the six boxes (MC-16).
      Since INT-361 a pasted or suggested code fills all six at once (3.3.8), so
      a patient who takes the code that way meets no box-by-box focus move. A
      patient who types it still does.

  - sc: "3.2.6"
    name: Consistent Help
    level: A
    bk: BK27
    wcag22_new: true
    status: Not Applicable
    manual: [MC-12]
    remarks: >-
      No screen offers a help mechanism. If one is added, it must sit in the
      same relative place on every screen that carries it.

  - sc: "3.3.1"
    name: Error Identification
    level: A
    bk: BK28
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::%s announces its error on BOTH platforms"
      - "apps/mobile/e2e/a11y.spec.ts::the discovery walks the tree and reaches every line the INT-226 report named"
      - "apps/mobile/e2e/a11y.spec.ts::a newly added unannounced error line is caught — the near-miss control"
      - "apps/mobile/e2e/a11y.spec.ts::the announcer puts both halves on every line: Android's live region and iOS's announcement"
      - "apps/mobile/e2e/a11y.spec.ts::AppText maps `live` onto the platform's own announcement props"
      - "apps/mobile/e2e/a11y.spec.ts::an error is never carried by colour alone"
      - "apps/mobile/src/lib/a11y/announce.test.ts::an error is spoken with the error word first; the visible copy is not touched"
      - "apps/mobile/src/lib/a11y/announce.test.ts::iOS gets the words, and an error interrupts what is being read"
    remarks: >-
      Every error is described in text on screen, and since INT-362 every
      error line goes through one announcer (`components/Announced.tsx`). It
      sets the Android live region and posts the iOS announcement, and speaks
      "Hata" before the message without changing the visible words. That
      covers the phone, OTP, new-visit and records screens, the Doctor Link
      error and the record card's "not saved" notice that INT-226 found silent
      under VoiceOver, the kiosk PIN lines, and the data, learned-fact and
      share write failures. The automated check no longer lists screens by
      hand. It walks every `.tsx` under `src` and fails on a line in the error
      colour, with failure copy or with a hand-made live region that sits
      outside the announcer. DA-08 confirms that each error is spoken once, on
      both platforms.

  - sc: "3.3.2"
    name: Labels or Instructions
    level: A
    bk: BK29
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every TextInput declares accessibilityLabel"
      - "apps/mobile/e2e/a11y.spec.ts::the composer is reachable and described"
      - "apps/mobile/e2e/a11y.spec.ts::no accessibilityHint is a bare source string"
      - "apps/mobile/e2e/auth.spec.ts::phone entry states why the number is asked (02 §8.2) from tr keys"
    remarks: >-
      Every field keeps a visible label and has an accessible name. Format and
      purpose lines are also the field's hint.

  - sc: "3.3.7"
    name: Redundant Entry
    level: A
    bk: BK30
    wcag22_new: true
    status: Supports
    tests:
      - "apps/mobile/e2e/typed_intake.spec.ts::resumes through the pack layer, so the rule is unit-testable"
    manual: [MC-15]
    remarks: >-
      Nothing is asked twice in one process. The intake resumes at the first
      unanswered question. The phone number carries from the phone screen to the
      OTP screen. The MHRS SMS paste fills the new-visit form.

  - sc: "4.1.2"
    name: Name, Role, Value
    level: A
    bk: BK31
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every Pressable declares accessibilityRole"
      - "apps/mobile/e2e/a11y.spec.ts::every Pressable declares accessibilityLabel"
      - "apps/mobile/e2e/a11y.spec.ts::a switch or checkbox declares its state, not just its role"
      - "apps/mobile/e2e/a11y.spec.ts::a single-choice turn offers radios, not checkboxes"
      - "apps/mobile/e2e/a11y.spec.ts::ListRow forwards a secondary action for its trailing control"
      - "apps/mobile/e2e/a11y.spec.ts::the consent switch — the withdrawal path — uses it"
      - "apps/mobile/e2e/appearance.spec.ts::each option is a radio that says whether it is the chosen one"
      - "apps/mobile/e2e/appearance.spec.ts::declares the platform role and the value"
    remarks: >-
      Every interactive element declares a role and a name, and every switch,
      checkbox and radio declares its state. The consent switch nested in a
      pressable row is reachable through a custom action.

  - sc: "1.2.4"
    name: Captions (Live)
    level: AA
    status: Not Applicable
    manual: [MC-02]
    remarks: No live synchronised media. The voice intake is audio with a live text transcript, not video.

  - sc: "1.2.5"
    name: Audio Description (Prerecorded)
    level: AA
    status: Not Applicable
    manual: [MC-02]
    remarks: No prerecorded video.

  - sc: "1.3.4"
    name: Orientation
    level: AA
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::SC 1.3.4 — app.json follows the device in every build profile"
      - "apps/mobile/e2e/a11y.spec.ts::SC 1.3.4 — every orientation lock in the app is registered as essential, with its reason"
      - "apps/mobile/e2e/a11y.spec.ts::a planted lock that is not registered is caught — the near-miss control"
      - "apps/mobile/e2e/a11y.spec.ts::every Modal rotates with the device — iOS presents one portrait-only unless told otherwise"
      - "apps/mobile/src/lib/a11y/orientation.test.ts::lists every orientation the app declares, both landscapes included"
      - "apps/mobile/e2e/a11y.spec.ts::no layout decides a height the landscape window cannot hold"
      - "apps/mobile/e2e/a11y.spec.ts::every scroller that holds a text field keeps it above the keyboard"
      - "apps/mobile/e2e/a11y.spec.ts::the dialogue's bottom stack pins to the keyboard's edge and never outgrows its frame"
    manual: [MC-04]
    # SC 1.3.4's exception: a screen may keep one orientation only where that
    # orientation is essential. Each entry is {lock: "<file> › <kind>", reason}
    # and the report names it; apps/mobile/e2e/a11y.spec.ts fails on a lock in
    # the app that this list does not hold, and on an entry whose lock is gone.
    essential_locks: []
    remarks: >-
      Since INT-360, `apps/mobile/app.json` sets `"orientation": "default"` in
      every build profile. iOS declares all four orientations, and Android
      follows the device. The automated check reads every script under `src`,
      the config plugins, `app.json` and `app.config.ts`. It looks for every
      way the app could lock a screen: an orientation setting, the orientation
      API, a native orientation key, or a `<Modal>` that does not rotate. React
      Native shows a Modal portrait-only on an iPhone unless the Modal lists its
      orientations. The section sheet was such a Modal, and it now lists all
      four. A lock the check finds must be listed here as essential, with its
      reason. None is: the records camera is the system's own capture screen,
      and a photo's upright travels in its EXIF tag. MC-04 is the manual pass
      that found the app-config lock. The source is checked for landscape
      layouts at the largest text size: no fixed or percentage height the
      window cannot hold, no size read from the long side, side safe areas, and
      no field left under the keyboard. DA-05 confirms each screen on hardware.

  - sc: "1.3.5"
    name: Identify Input Purpose
    level: AA
    status: Supports
    manual: [MC-05]
    remarks: >-
      Only one field collects information about the patient from the WCAG
      input-purpose list: the phone number. It declares `autoComplete="tel"` and
      `textContentType="telephoneNumber"`.

  - sc: "1.4.3"
    name: Contrast (Minimum)
    level: AA
    status: Supports
    tests:
      - "apps/mobile/src/lib/theme.test.ts::$name: every text pair meets WCAG AA (4.5:1)"
      - "apps/mobile/src/lib/theme.test.ts::the known sub-AA pairs of the old palette are closed"
    remarks: >-
      Since INT-422 every text colour the app sets meets 4.5 : 1 on every ground
      it is set on, in light, dark and the OS Increase Contrast mode, and
      clinical text meets 7 : 1. The two pairs INT-144 found below the floor
      (`inkFaint` on the light grounds, the light "Dosyaya eklendi" chip) are
      closed; §4 measures them from the palette. DA-05 confirms on hardware.

  - sc: "1.4.4"
    name: Resize Text
    level: AA
    status: Supports
    tests:
      - "apps/mobile/src/lib/theme.test.ts::follows the user's scale up to 2.0 and no further (02 §8.2)"
      - "apps/mobile/e2e/a11y.spec.ts::a TextInput that applies scaledSize disables the OS multiplier"
      - "apps/mobile/e2e/appearance.spec.ts::nothing in the app can truncate a string"
      - "apps/mobile/e2e/overflow.spec.ts::no module renders a Screen it cannot move"
      - "apps/mobile/src/lib/prefs/appearance.test.ts::a tie resolves to the LARGER step — accessibility never rounds down"
    remarks: >-
      Text follows the OS size, or the app's own text-size step, up to 200 %
      through one clamp. No string can be truncated and every screen scrolls.
      DA-05 confirms the layouts on hardware.

  - sc: "1.4.5"
    name: Images of Text
    level: AA
    status: Supports
    manual: [MC-01]
    remarks: All type is live text. The app renders no image content.

  - sc: "1.4.10"
    name: Reflow
    level: AA
    status: Not Evaluated
    tests:
      - "apps/mobile/e2e/overflow.spec.ts::no module renders a Screen it cannot move"
      - "apps/mobile/e2e/appearance.spec.ts::nothing in the app can truncate a string"
      - "apps/mobile/e2e/a11y.spec.ts::no layout decides a height the landscape window cannot hold"
    remarks: >-
      Layouts are flex-based, with no fixed-width content, and every screen
      scrolls vertically. No scroller runs sideways. Since INT-360 the app
      turns with the phone (1.3.4), so a patient also meets these layouts in a
      landscape window 320 to 390 pt tall. DA-05 decides, in both orientations.

  - sc: "1.4.11"
    name: Non-text Contrast
    level: AA
    status: Supports
    tests:
      - "apps/mobile/src/lib/theme.test.ts::$name: control boundaries and fills meet SC 1.4.11 (3:1)"
    manual: [MC-24]
    remarks: >-
      MC-24 recorded the gap before INT-422: an unselected chip's only boundary
      was a hairline below 3 : 1. INT-422 split that token in two. The `border`
      that outlines inputs and unselected chips now measures 3 : 1 or more on
      both grounds in every scheme and contrast mode (§4), and decorative row
      hairlines take a separate `separator` token.

  - sc: "1.4.12"
    name: Text Spacing
    level: AA
    status: Not Applicable
    manual: [MC-06]
    remarks: >-
      The criterion is scoped to content implemented in markup languages that
      support the text-style properties. The app renders native views and no
      WebView or HTML. INT-144 recorded this row as supported by inspection.
      Reading roles keep a 1.4× line height regardless.

  - sc: "1.4.13"
    name: Content on Hover or Focus
    level: AA
    status: Not Applicable
    manual: [MC-07]
    remarks: Nothing appears on hover or focus.

  - sc: "2.4.5"
    name: Multiple Ways
    level: AA
    status: Not Applicable
    manual: [MC-10]
    remarks: >-
      WCAG2ICT reads this criterion, for non-web software, as applying to a set
      of software programs. Vizite is one program. Read instead as a set of web
      pages, a visit is reachable two ways (Bugün and Vizitlerim), but each
      Profilim sub-screen only one way. INT-144's third route, through
      Kayıtlarım, does not navigate to a visit.

  - sc: "2.4.6"
    name: Headings and Labels
    level: AA
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every screen that renders a hero line marks one as a heading"
      - "apps/mobile/e2e/a11y.spec.ts::no accessibilityLabel is a bare source string"
      - "apps/mobile/e2e/nav.spec.ts::labels come from i18n, never literals (rail renders t(labelKey))"
      - "apps/mobile/e2e/a11y.spec.ts::every a11y.* key referenced in a screen exists in both catalogs"
    remarks: Every heading and label comes from the Turkish-first catalogue and names what it heads or labels.

  - sc: "2.4.7"
    name: Focus Visible
    level: AA
    status: Not Evaluated
    remarks: >-
      Keyboard and Switch Control focus is drawn by the OS. The app draws no
      focus style of its own. DA-02 decides.

  - sc: "2.4.11"
    name: Focus Not Obscured (Minimum)
    level: AA
    wcag22_new: true
    status: Not Evaluated
    tests:
      - "apps/mobile/e2e/overflow.spec.ts::every bar reports its height to the screen that scrolls under it"
    remarks: >-
      The dialogue and review screens pin a glass bar over the bottom of a
      scroller. Scrolled content is padded clear of it. Whether a focused control
      can end up behind the bar is for DA-06 to decide.

  - sc: "2.5.7"
    name: Dragging Movements
    level: AA
    wcag22_new: true
    status: Not Applicable
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::BK20 / SC 2.5.1 — no path-based or multipoint gesture is required"
    remarks: Nothing in the app is dragged.

  - sc: "2.5.8"
    name: Target Size (Minimum)
    level: AA
    wcag22_new: true
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::no Pressable relies on its content happening to be tall enough"
      - "apps/mobile/e2e/a11y.spec.ts::slop is vertical only — horizontal slop would swallow the next chip"
      - "apps/mobile/e2e/a11y.spec.ts::slop sizes are computed from the laid-out height, not guessed"
      - "apps/mobile/src/lib/a11y/target.test.ts::is 44 — above SC 2.5.8's 24 and at the platform guideline"
      - "apps/mobile/e2e/appearance.spec.ts::the collapsed item still reaches the target floor"
      - "apps/mobile/e2e/appearance.spec.ts::rows reach the target floor by box, never by slop"
    manual: [MC-25]
    remarks: >-
      The app's floor is 44 pt, above the criterion's 24. Height is asserted for
      every Pressable. Width is not asserted by the suite; MC-25 records the
      widths of the controls that carry no text.

  - sc: "3.1.2"
    name: Language of Parts
    level: AA
    status: Partially Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every line carries a BCP-47 tag matching the active catalog"
    manual: [MC-18]
    finding: >-
      In the English locale, Turkish taxonomy names (branch names from
      `branch.nameTr`) render untranslated. They are tagged `en-GB` with the rest
      of their line, so an English voice reads Turkish words.
    remarks: In the Turkish locale, catalogue and taxonomy text are both Turkish.

  - sc: "3.2.3"
    name: Consistent Navigation
    level: AA
    status: Supports
    tests:
      - "apps/mobile/e2e/nav.spec.ts::has no routes beyond the map (no stealth surfaces)"
      - "apps/mobile/e2e/nav.spec.ts::registers the %s screen"
      - "apps/mobile/e2e/nav.spec.ts::labels come from i18n, never literals (rail renders t(labelKey))"
    remarks: One tab rail, in one order, on every tabbed screen. The route tree is asserted to be exactly the navigation map.

  - sc: "3.2.4"
    name: Consistent Identification
    level: AA
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::the composition helpers are what the screens actually use"
      - "apps/mobile/e2e/a11y.spec.ts::no accessibilityLabel is a bare source string"
    remarks: Controls with the same function take their names from the same catalogue keys through the same helpers.

  - sc: "3.3.3"
    name: Error Suggestion
    level: AA
    status: Supports
    manual: [MC-13]
    remarks: >-
      Every error names the correction or the next step. The generic auth errors
      are generic by security design (files/02 §8.2).

  - sc: "3.3.4"
    name: Error Prevention (Legal, Financial, Data)
    level: AA
    status: Supports
    tests:
      - "apps/mobile/e2e/review_send.spec.ts::gives every section a switch that names the section it governs"
      - "apps/mobile/src/lib/dsar/requests.test.ts::is withdrawable while the grace is running"
      - "apps/mobile/e2e/consent.spec.ts::withdrawing voice drags lane:affect down in the same pass; linguistic survives"
    manual: [MC-14]
    remarks: >-
      The note is sent only from the review screen, after the whole note and its
      per-section share scope are shown (checked). Erasure takes two taps and can
      be withdrawn during its grace period (reversible). A consent withdrawal can
      be granted again.

  - sc: "3.3.8"
    name: Accessible Authentication (Minimum)
    level: AA
    wcag22_new: true
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::the six boxes are one TextInput rendered once per register"
      - "apps/mobile/e2e/a11y.spec.ts::every box asks the OS for the one-time code on each platform"
      - "apps/mobile/e2e/a11y.spec.ts::no field cap cuts a pasted or autofilled code down to its first digit"
      - "apps/mobile/e2e/a11y.spec.ts::every box hands its whole new text to the shared distributor"
      - "apps/mobile/e2e/auth.spec.ts::the OTP entry is one masked field per register, six registers"
      - "apps/mobile/src/lib/auth/phone.test.ts::a whole code pasted into the first box fills all six"
      - "apps/mobile/src/lib/auth/phone.test.ts::a whole code pasted into box %i still fills all six from the first"
      - "apps/mobile/src/lib/auth/phone.test.ts::a code pasted beside the digit a box already shows fills all six"
      - "apps/mobile/src/lib/auth/phone.test.ts::more than six digits keeps the first six"
    remarks: >-
      Sign-in asks for a six-digit SMS code, a cognitive function test, and
      since INT-361 a mechanism completes it: the patient does not have to
      transcribe the code. A code pasted into any box, or handed over by the
      OS, fills all six boxes (`enterOtp`), with the rest of a copied message
      dropped. Every box declares `textContentType="oneTimeCode"` for the iOS
      "From Messages" suggestion, and `autoComplete` `sms-otp` for Android's
      SMS-code autofill and `one-time-code` for the web. No field cap cuts a
      code short. Whether each platform offers its suggestion is for DA-07 to
      confirm on hardware. INT-144 did not assess this criterion. INT-226
      rated it Does Not Support (MC-16) before INT-361.

  - sc: "4.1.3"
    name: Status Messages
    level: AA
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::listening / speaking / transcribing are announced, not just animated"
      - "apps/mobile/e2e/a11y.spec.ts::the turn state is announced ONCE — not by a hook and a live region both"
      - "apps/mobile/src/lib/a11y/announce.test.ts::says the same message once, not on every re-render"
      - "apps/mobile/e2e/a11y.spec.ts::%s announces its error on BOTH platforms"
      - "apps/mobile/e2e/a11y.spec.ts::no live region is declared anywhere but the announcer"
      - "apps/mobile/e2e/a11y.spec.ts::every announced line states its tone, and the announcer — not the call site — picks the politeness"
      - "apps/mobile/e2e/a11y.spec.ts::the announcer puts both halves on every line: Android's live region and iOS's announcement"
      - "apps/mobile/src/lib/a11y/announce.test.ts::iOS queues a status behind current speech"
      - "apps/mobile/src/lib/a11y/announce.test.ts::announces once per change — never for an unchanged or an empty message"
      - "apps/mobile/e2e/a11y.spec.ts::the three outcome lines MC-26 named are found by the walk, and each is announced only as news"
      - "apps/mobile/e2e/a11y.spec.ts::an outcome line announced on arrival, or not at all, is caught — the near-miss control (INT-397)"
      - "apps/mobile/e2e/a11y.spec.ts::a line's news is always a transition from useNews — no line is muted with a literal"
      - "apps/mobile/e2e/a11y.spec.ts::a line that is not news is shown without either half, and turning into news makes it anew (INT-397)"
      - "apps/mobile/src/lib/a11y/announce.test.ts::a line found standing on arrival is not news — a revisit is silent"
      - "apps/mobile/src/lib/a11y/announce.test.ts::the outcome arriving in front of the patient is news — just sent, just queued"
      - "apps/mobile/src/lib/a11y/announce.test.ts::an outcome that arrives behind another screen is not news, then or when the screen returns"
      - "apps/mobile/src/lib/a11y/announce.test.ts::announces once per change: each new failure is news again, a standing one is not"
      - "apps/mobile/src/lib/notifications/store.test.ts::while the server has not answered, the save is saving — never failed"
      - "apps/mobile/src/lib/notifications/store.test.ts::each retry passes through saving, so every failure is its own change"
      - "apps/mobile/src/lib/consent/store.test.ts::a change the server takes at once is sending, then clear — never held"
      - "apps/mobile/src/lib/consent/store.test.ts::a retry that fails again is not a new transition"
    manual: [MC-17, MC-26]
    remarks: >-
      The dialogue's turn state and every line the automated check discovers
      are announced on both platforms without moving focus: errors
      assertively, statuses politely and once per change. That includes the
      records screen's notices, the record-reading line, the voice check, the
      health section's lines and the kiosk warning. Since INT-397 it also
      includes the three lines that state how the patient's own action stands
      and stay on screen afterwards: the notification settings' "not saved
      yet" line, the "your note was sent" line on the review screen and the
      visit detail, and the consent screens' queued-change note. Each is
      announced when its store moves into that state while the screen is in
      front (a save fails, the note is sent, a consent change cannot reach the
      server), and is shown without an announcement when the patient comes
      back to it. The notification store now tells a save in flight from a
      failed one, so only a failure is announced, as an error. MC-17 and MC-26
      are the manual passes that found the gaps; the tests cited here
      supersede them. DA-08 confirms each line on a device. INT-144 did not
      assess this criterion.

# ----------------------------------------------------------------- EN 301 549

en301549:
  - clause: "5.2"
    name: Activation of accessibility features
    status: Supports
    tests:
      - "apps/mobile/e2e/appearance.spec.ts::has a route, registered in the tabs layout"
      - "apps/mobile/e2e/appearance.spec.ts::the container declares the group and its name"
      - "apps/mobile/e2e/appearance.spec.ts::declares the platform role and the value"
    remarks: >-
      The app's own accessibility features, the text-size, colour-scheme and
      motion controls on Profilim › Görünüm, are ordinary named controls that a
      screen reader reaches. The OS settings apply without any activation in the
      app.

  - clause: "5.3"
    name: Biometrics
    status: Supports
    tests:
      - "apps/mobile/e2e/auth.spec.ts::capability-detected: no hardware or no enrolment degrades gracefully"
    manual: [MC-19]
    remarks: >-
      The biometric gate never relies on a biometric alone. The platform prompt
      keeps its device-passcode fallback, and a device with no enrolled factor
      passes through.

  - clause: "5.9"
    name: Simultaneous user actions
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::BK20 / SC 2.5.1 — no path-based or multipoint gesture is required"
    remarks: No mode of operation requires more than one action at a time.

  - clause: "11.4.1.1"
    name: Parsing
    status: Not Applicable
    manual: [MC-06]
    remarks: >-
      Removed from WCAG 2.2 as obsolete, and still present in EN 301 549 V3.2.1.
      The app exposes native views to assistive technology and gives it no
      markup to parse.

  - clause: "11.5.1"
    name: Closed functionality
    status: Not Applicable
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every Pressable declares accessibilityRole"
    remarks: The app is open functionality. It works through the platform screen readers and does not replace them.

  - clause: "11.5.2.3"
    name: Use of accessibility services
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every Pressable declares accessibilityRole"
      - "apps/mobile/e2e/a11y.spec.ts::AppText maps `live` onto the platform's own announcement props"
      - "apps/mobile/e2e/a11y.spec.ts::every line carries a BCP-47 tag matching the active catalog"
    remarks: >-
      Roles, names, states, languages and announcements go through React Native's
      mapping onto UIAccessibility and AccessibilityNodeInfo. The app builds no
      accessibility layer of its own.

  - clause: "11.5.2.5"
    name: Object information
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every Pressable declares accessibilityRole"
      - "apps/mobile/e2e/a11y.spec.ts::every Pressable declares accessibilityLabel"
      - "apps/mobile/e2e/a11y.spec.ts::a switch or checkbox declares its state, not just its role"
    remarks: Role, name and state are declared for every user-interface element.

  - clause: "11.5.2.6"
    name: Row, column, and headers
    status: Not Applicable
    manual: [MC-21]
    remarks: The app presents no data table.

  - clause: "11.5.2.7"
    name: Values
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::the prep gauge reports a value, not only a rendered arc"
      - "apps/mobile/e2e/appearance.spec.ts::declares the platform role and the value"
      - "apps/mobile/e2e/a11y.spec.ts::a switch or checkbox declares its state, not just its role"
    remarks: The gauge exposes its value, and every switch, checkbox and radio exposes its state.

  - clause: "11.5.2.8"
    name: Label relationships
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::every TextInput declares accessibilityLabel"
      - "apps/mobile/e2e/a11y.spec.ts::the composer is reachable and described"
    remarks: Each field's label is its accessible name, and its visible instruction lines are its hint.

  - clause: "11.5.2.9"
    name: Parent-child relationships
    status: Not Evaluated
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::the transcript itself is a named region"
    remarks: >-
      Groups are declared: the status ladder as a list, and radio groups. DA-08
      inspects how the platform tree exposes the nesting.

  - clause: "11.5.2.10"
    name: Text
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::no screen renders a bare react-native Text, bypassing that declaration"
    remarks: All text is a platform text node rendered through one component, which assistive technology can read.

  - clause: "11.5.2.11"
    name: List of available actions
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::ListRow forwards a secondary action for its trailing control"
    remarks: A row with a nested control lists that control's action to assistive technology.

  - clause: "11.5.2.12"
    name: Execution of available actions
    status: Supports
    tests:
      - "apps/mobile/e2e/a11y.spec.ts::ListRow forwards a secondary action for its trailing control"
      - "apps/mobile/e2e/a11y.spec.ts::the consent switch — the withdrawal path — uses it"
