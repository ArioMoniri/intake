    - "the fix is structural and not a font shrink: the row wraps, its chips shrink, and it changes form at the app's one large-text threshold - and a near-miss control re-measures the row exactly as photographed in the SMALLEST role the type scale has and shows a control still leaving the screen, so shrinking type alone is proved not to satisfy the test"
    - "the horizontal axis is swept the way INT-284 swept the vertical one: a tree-wide test catches a row that pins an item to the far end (space-between, or an auto margin) in a container that cannot break a line, every such row in the tree is fixed with the one-token remedy INT-284 already used, and the allow-list ships empty and may only shrink"
    - "the caption 'N soru yanitlandi' is likewise not clipped by the progress dot rail at any text size: the rail owns a box that wraps and shrinks, the counter shrinks not at all, and the counter is measured to fit the narrowest phone at the largest step in both catalogues"
    - "the chips reach the touch floor by BOX rather than by vertical slop, because a row that can stack them four points apart is the case lib/a11y/target.ts already refuses horizontally"
    - "no new string, no copy change, no placeholder, no skipped test; make check and make safety are green"
  tests:
    - apps/mobile/e2e/modeBar.spec.ts
    - apps/mobile/e2e/overflow.spec.ts
