  # at middle and no emotions", after an earlier "tts is so awkward". Three
  # defects in one sentence about one surface — the spoken turn — so one issue.
  # The first is a safety property and the rest of the row is subordinate to it.
  title: 'The patient cannot interrupt by speaking: voice barge-in, a measured
