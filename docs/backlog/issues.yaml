- id: INT-407
  epic: E02-data
  phase: P1
  title: "Visit lifecycle state machine (02 §2b): a RED visit cannot silently move"
  # GitHub #684. Found by INT-406 (PR #683): files/02 §2b's lifecycle had no
  # backlog row and nothing moved a visit, so `SafetyInbox.visit_transition`
  # had no caller; the id was allocated by the coordinator. Built on #683's
