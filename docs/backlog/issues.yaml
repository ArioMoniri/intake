  # audited on the DSAR path); the key keeps NO ACTION as the fail-closed
  # backstop. No migration.
  acceptance:
    - "every session-deletion path (DSAR erasure, retention clinical_record, test cleanup) removes the session's previsit_outputs in the same transaction, first, before the session row; the DSAR erasure crypto-shreds each output and audits it as previsit_output:<id>; the mechanism (explicit removal, the foreign key kept NO ACTION, no cascade) follows files/06 §3 and the crypto-shred design and is recorded in the evidence"
    - "every foreign key to sessions.id declares what a session deletion does to it, read from the model metadata, with near-miss controls for an undeclared table and for a cascade on previsit_outputs; both executors run with foreign keys enforced; an integration test deletes a session that has an output (red on main); the check-integration teardown is fixed; one alembic head"
  tests: [tests/data/test_session_delete_contract.py, tests/legal/test_dsar_flows.py, tests/api/test_api_postgres.py, tests/integration/test_session_erasure.py]
