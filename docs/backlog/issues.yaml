  depends_on: [INT-036, INT-037, INT-150, INT-392]
  labels: [area:data, risk:legal]
  status: done
  evidence: docs/evidence/INT-393.md
  # Found by INT-392 (GitHub #649; INT-392 evidence §8): INT-150's migration
  # 0012 added doctor_links.share_id -> shares.id with no ON DELETE rule, and
  # neither the DSAR erasure nor the retention clinical_record executor removed
  # Doctor Links before deleting the subject's shares, so erasing a patient who
