    and a resource layer that refuses an incomplete one'
  depends_on: []
  labels:
  - area:platform
  - area:i18n
  status: done
  acceptance:
  - 'a session carries exactly one locale, fixed at the start and changed only
    by an explicit act: the locale is a session field rather than a per-string
    lookup, so no turn can be assembled from two languages, and the value is
    recorded on the session so the note, the audit entry and every metric label
    agree on which language the patient was actually asked in'
  - 'the language is chosen by the patient, never inferred from speech: a
    detector that is wrong delivers a red-flag script in a language the patient
    cannot read, and a failed escalation is the one failure this product may not
    have - so detection may at most OFFER a switch the patient confirms, and the
    offer is unreachable while a red-flag script is in flight'
  - 'a locale is offered only when it is complete, and completeness is a build
    property rather than a runtime hope: the `tr` lint generalises to every
    ENABLED locale (invariant 5 unchanged - `tr` remains required and remains
    the source of truth), a key missing from an enabled locale fails the build,
    and a locale that is not complete is simply absent from the chooser rather
    than falling back'
  - 'there is no per-string fallback, and a test asserts its absence over the
    whole tree: a sentence half in Arabic and half in Turkish is worse than a
    sentence in Turkish, and a fallback chain is how that happens - so the
    resolver has no fallback parameter, takes no default, and raises on a miss'
  - 'the chooser offers a locale only when the pack that will be served carries
    signed content for it: an enabled locale with a complete UI catalogue but no
    clinician-signed clinical text may render the app and may not run an intake,
    and the two conditions are separate fields rather than one flag'
  - 'no locale is enabled by this issue except `tr`: the mechanism ships with
    exactly one locale registered and the registry empty of others, because
    which languages to support is a product decision (HB-O6) and what they say
    is a clinical one (HB-C19) - the gate is wired, fails closed, and the
    content is left empty'
