- id: INT-262
  epic: E15-research
  phase: P2
  title: "Research extracts: differencing gate across the register (a second extract over an overlapping window re-identifies)"
  depends_on: [INT-230]
  labels: [area:research, risk:legal, approval:human-legal]
  status: done
  evidence: docs/evidence/INT-262.md
  # Raised by INT-230, which states the gap in its own evidence rather than
  # leaving it unrecorded. INT-230's k gate holds for ONE extract: every
  # quasi-identifier combination carries at least k subjects. It does not
  # compare a new request against the extracts already in the register, so an
  # investigator who takes the same spec over 2026-W01..W12 and then over
  # 2026-W01..W11 differences the two and recovers the twelfth week's cells —
  # at any k. The register already holds what a gate would need (study, spec,
  # window, subjects, k, content hash); what it does not hold is the POLICY,
  # and the honest reason this is a separate issue is that the policy has a
  # parameter no agent may pick: how much window overlap, and how many
  # requests, a study may make. That is an ethics-committee decision.
  acceptance:
    - "the export gate reads the register for prior extracts of the same study+spec and refuses an overlapping window unless the study's registry row states an explicit query budget; the budget has no default and an absent one fails closed; golden test differences two extracts and proves the second is refused"
  tests: [tests/research/test_differencing_gate.py]
  legal: "KVKK-16,KSVY-16,ETİK"
  sec_row: "learning-loops"
