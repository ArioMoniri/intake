  sec_row: "records"
- id: INT-312
  epic: E01-platform
  phase: P0
  # Found by INT-102's adversarial suite, which asserted the gap rather than
  # pre-normalising its own input to make itself pass. Both redaction tiers -
  # intake_platform.deid._TCKN and redaction._TCKN_CANDIDATE - are
  # \b[1-9]\d{10}\b, a CONTIGUOUS eleven-digit run. An identifier said aloud
  # does not arrive that way. The forms are committed as SPOKEN_TCKN_FORMS in
  # tests/safety/adversarial_corpus.py; INT-102 stays todo because of this line.
  title: 'A TCKN said aloud is not masked: the redactors match a contiguous
    eleven-digit run and speech arrives as groups or as words'
  depends_on:
  - INT-102
  labels:
  - area:security
  - area:platform
  - area:voice
  status: done
  evidence: docs/evidence/INT-312.md
  acceptance:
  - 'the redactors see what speech actually produces: digit groups (a spaced or
    hyphenated eleven-digit run), Turkish digit words, and the mixtures a
    recogniser emits mid-utterance - with the committed SPOKEN_TCKN_FORMS
    corpus as the input rather than a normalised copy of it'
  - 'the checksum stays the discriminator, so this remains a TCKN redactor and
    does not become a number shredder: a checksum-FAILING eleven-digit
    accession number still survives untouched, which is INT-102''s existing
    near-miss control and must keep passing unchanged'
  - 'the normalisation happens where it can see the whole utterance and cannot
    reach the note: it is a redaction concern, not an ASR feature, and nothing
    added here may put identifier handling on the speech critical path
    (invariant 9) or retain audio (invariant 3)'
  - 'the two controls that hold the line today are not weakened: deidentify_for_egress
    still fails closed ENTIRELY without the NER tier, and LlmSpan still has no
    field a transcript could occupy - both asserted before and after'
  - 'any leak-rate figure lives only in docs/evidence/ with a date and the named
    corpus, described as a measurement of that corpus on that day (invariant 20)'
  # The RT-13 cases have always lived in test_adversarial_rt12_14.py, not
  # rt09_14; the field is corrected to the files that actually carry them.
  tests:
  - tests/safety/test_adversarial_rt12_14.py
  - tests/platform/test_spoken_identifiers.py
  sec_row: "identifiers"
- id: INT-314
  epic: E03-protocols
  phase: P1
  # Reported by INT-297, which migrated five `*_tr` fields to per-locale maps and
  # found four more that are SPOKEN and outside that set: confirm_tr, action_tr,
  # do_nots_tr, ask_one_tr. So invariant 10's "red-flag action scripts are spoken
  # verbatim from the locale's own entry" is only partially per-locale today.
  # It is fail-closed rather than ignored: `selectable_locales` clamps any pack
  # carrying one of the four to `tr`, and the clamp lifts by itself once they
  # migrate. `action_tr` is the field that closes it.
  title: 'Four spoken fields are still Turkish-only, so a red-flag action script
    cannot yet be per-locale'
  depends_on:
  - INT-297
  labels:
  - area:protocols
  - area:i18n
  - area:safety
  status: todo
  acceptance:
  - '`confirm_tr`, `action_tr`, `do_nots_tr` and `ask_one_tr` become per-locale
    maps on the same schema as the five INT-297 migrated, with `tr` required, so
    invariant 10 holds for the WHOLE of a red-flag script rather than for its
    question half'
  - 'the byte-identity discipline is repeated, not assumed: the pre- and
    post-migration trees compile to identical served bundles for `tr`, authored
    string AND `expand_tr` expansion, using the same comparator INT-297
    committed - a refactor that changes one Turkish RED sentence is the most
    dangerous edit in this repository'
  - 'the `selectable_locales` clamp is REMOVED by this issue rather than left
    dormant, and a test asserts a pack carrying all four in a second locale is
    now selectable - a clamp that outlives its reason is a silent restriction
    nobody can see'
  - 'invariant 21 is untouched: RED stays route x register x location with no
    permitted default, and nothing here lets a locale change which action
    resolves for a location'
  tests:
  - tests/protocols/test_locale_maps.py
  sec_row: "protocol-registry"
- id: INT-315
  epic: E13-infra
  phase: P1
  # Found by INT-180, and found the honest way: two restore-drill PHI-safety
  # tests failed on its branch, it was told they might mean a widened guard, and
  # it established they did not - the cause was a .cache SYMLINK the
  # coordinator's interruption-recovery saves had committed. Removing the
  # symlink passes 5/5; restoring it reproduces. But the guard is still wrong.
  title: 'assert_restore_target_outside_workspace resolves the target and not the
    workspace, so a symlinked directory INSIDE the repo reads as outside'
  depends_on: []
  labels:
  - area:infra
  - area:security
  status: todo
  acceptance:
  - 'the workspace side is resolved too: a directory that git can see inside the
    repository must be refused as a restore target even when it is reached
    through a symlink whose `Path.resolve()` lands elsewhere - today only the
    target is resolved, so the comparison is between a real path and a symbolic
    one and it silently answers "outside"'
  - 'the case that produced it is the regression test: a symlinked `.cache`
    directory inside the worktree, which is exactly what this repository''s
    own fresh-worktree deid-model workflow creates, so the fixture is the real
    workflow rather than an invented one'
  - 'the near-miss control passes unchanged: a genuinely external target is
    still accepted, and a relative path that escapes upward is still refused -
    a fix that refuses everything would pass the first clause and destroy the
    drill'
  - 'no restore ever writes patient data inside the repository, which is what
    this guard exists for and what the symlink quietly permitted'
  tests:
  - tests/infra/test_restore_drill.py
  sec_row: "backups"
