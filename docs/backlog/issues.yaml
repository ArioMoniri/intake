  # NOTE 29 Aug 2026 — one deviation, stated rather than papered over. The
  # acceptance says "anonymisation validated on corpus". Anonymisation is not
  # what this pipeline can produce: the subject key is a keyed HMAC pseudonym,
  # re-derivable by whoever holds the tokenization key, so it is personal data
  # under KVKK and KSVY m.16(1)'s anonymisation route is unavailable. What is
  # delivered instead, and validated on the INT-015 corpus, is an EXCLUSION
  # rule — no corpus sentence and no bare corpus identifier can become an
  # export value — with the artefact named PseudonymisedExtract throughout and
  # a test forbidding the word "anonym" in any public name. The pipeline rides
  # files/06 §75's other route ("All research consented (`research`) or
  # anonymised per KSVY-16"): consent plus a recorded ethics id. Which limb of
  # m.16 that actually is, is HB-L26 (counsel).
