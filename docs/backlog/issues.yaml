- id: INT-308
  epic: E01-platform
  phase: P1
  # Reported by INT-263 while replacing the fixed OTP window with a rolling one.
  # files/10 §2 names "carrier/geo sanity checks against SMS pumping" in the same
  # sentence as the request budgets, and no code implements it. INT-263 marked it
