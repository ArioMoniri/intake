- id: INT-294
  epic: E08-mobile
  phase: P0
  # Measured on the host against the live dev daemons, 2 Sep 2026
  # (docs/evidence/INT-293.md). selectTtsLane walks every (tier, host) pair
  # before the first syllable is synthesised:
  #   voxcpm2 127.0.0.1:8805    over_budget   1721 ms  (healthy, cannot speak)
  #   voxcpm2 172.20.10.3:8805  unhealthy     1505 ms  (host not reachable)
  #   freya   127.0.0.1:8803    ok             798 ms  <- winner
  #   TOTAL 4024 ms  vs  clipDeadlineMs(1 sentence) = 4048 ms
  # It wins by 24 ms on the host and loses about as often inside RN. When it
  # loses, stream.ts:267 latches voiceMuted = voiceMuted || speech_unavailable
  # and never clears it, so one slow first turn mutes the WHOLE visit with a
  # healthy Freya (0.8 s) sitting idle. Both outcomes were observed on the
  # same config within one hour.
  #
  # Two independent causes each waste a full budget: a first tier that is
  # health-green and cannot speak (INT-249 already recorded this about VoxCPM2
  # on CPU), and a configured host that is unreachable and costs the full
  # 1500 ms health cap. Meanwhile `make voice-doctor` reports "voice: UP -
  # every configured lane answered", because voice_doctor.py only did
  # GET /health - the exact criterion INT-249 proved insufficient one level
  # down.
  title: "TTS lane admission consumes the clip deadline, and the resulting mute latches for the session"
  depends_on: [INT-243, INT-249, INT-261]
  labels: [area:mobile, area:voice]
  status: done
  evidence: docs/evidence/INT-294.md
  acceptance:
    - "the race is reproduced before it is fixed: a fake-clock test walks the real ladder shape (a first tier that trips the budget, an unreachable host, a fast third) and asserts admission fits the turn's OWN budget - elapsedMs <= TURN_ROUND_TRIP_BUDGET_MS - with enough of clipDeadlineMs left over for one synthesis, recorded red in the evidence with the measured per-leg figures. This line originally asked for the total to EXCEED clipDeadlineMs, and the measurement contradicts that: 4024 ms against a 4048 ms deadline comes in 24 ms UNDER it. A test written to the original phrasing would have failed on a correct build and passed on the defect, so the line is restated to the property actually asserted rather than the status being claimed against it"
    - "admission is bounded independently of the clip it precedes: lane selection can no longer consume the patient's whole clip deadline, and a test asserts the FIRST turn still gets a voice when a healthy fast tier exists anywhere on the ladder"
    - "an unreachable configured host cannot cost a full health cap on every session: a host that fails once is not re-probed for the rest of the session, asserted by counting fetches"
    - "voiceMuted stops being permanent: a session muted by a transient admission failure recovers when a later turn's lane admits, with a test asserting the caption clears - and a test asserting it does NOT flap mid-turn"
    - "the ladder's intent is untouched: VoxCPM2 still wins whenever it is genuinely fast, asserted by a test where tier one answers inside the budget"
    - "make voice-doctor answers the question it claims to: every TTS lane is asked to SPEAK the same probe the app uses and is timed against the same committed budget, a lane that is health-green and over budget is reported as such rather than UP, and the exit code reflects it. A near-miss control: a lane that is healthy and fast is still reported UP"
    - "no placeholder, no skipped test; make check is green"
  tests:
    - apps/mobile/src/lib/dialogue/ttsLane.test.ts
    - apps/mobile/src/lib/dialogue/stream.test.ts
    - tests/mobile/test_voice_doctor.py
