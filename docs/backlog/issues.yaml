    - "the two hypotheses are separated in the evidence rather than assumed: a test with FULLY diacritised input proves whether the write path works at all, and the answer decides whether this is a normalisation bug or a missing write - both are stated with their recorded runs"
    - "Turkish normalisation is exercised in both directions on the real option vocabulary: every option label in questions.ts and baseLayer.ts round-trips through the matcher from its diacritic-free form, with the Turkish dotted/dotless i pair asserted explicitly and NOT via a naive lowercase"
    - "an answer the extractor cannot map is never silently swallowed: the turn re-asks or says it did not understand, and a test asserts that an unmappable utterance does NOT advance the question index"
    - "the note-section counter is truthful: a test asserts that N answered dialogue turns produce N filled sections for slot-bearing questions, so 'Not olusuyor 0 / 10 bolum' cannot read 0 after a real answer"
    - "askIf gates evaluate identically on both surfaces: the same answer sequence through the dialogue and through the typed steps yields the SAME asked-set, asserted for duration=today and duration=month"
    - "the tidy hand-over carries what was already answered: 'Yazarak devam edin' after N dialogue answers lands on question N+1 with the earlier answers present, not at '0 soru yanitlandi'"
    - "no placeholder, no skipped test; make check is green"
