  # to mint an id blind because ids were moving mid-iteration. This is that id.
  title: 'carrier/geo sanity checks against SMS pumping are named in the security
    spec and implemented nowhere'
  depends_on:
  - INT-263
  labels:
  - area:security
  - area:platform
  status: awaiting-human
  evidence: docs/evidence/INT-308.md
  acceptance:
  - 'the control exists or the sentence stops claiming it: either a carrier/geo
    check runs on the OTP request path, or files/10 §2 is rewritten to say the
    budgets are the whole of what stands against SMS pumping - a spec that names
    a control nobody built is worse than a spec that admits the gap, because it
    is read as coverage'
  - 'if built, it fails OPEN on lookup failure and CLOSED on a positive signal:
    a carrier lookup that times out must not lock a legitimate patient out of
    their own intake, and the asymmetry is asserted by two tests'
  - 'no new personal data is stored to achieve it: a carrier or country
    derivation is a fact about a person, so anything persisted carries the
