- id: INT-313
  epic: E07-records
  phase: P0
  # Reported by INT-138: the confirm cards, the provenance panel and the
  # extraction reader are all built and all unreachable, because nothing
  # publishes a document extraction to the app. noExtractionFeed is the only
  # production ExtractionSource - one, asserted - and it acknowledges no
  # decision, so under the no-optimistic-write rule no card can ever show as
  # confirmed. INT-124 owns the producer; the TRANSPORT between it and the
  # phone is owned by nobody, which is why INT-138 stays todo.
  title: 'Nothing carries an extraction to the phone: the confirm-card transport
    is owned by no issue'
  depends_on:
  - INT-121
  - INT-138
  labels:
  - area:records
  - area:api
  status: todo
  acceptance:
  - 'a route publishes extracted items for a document the patient owns, scoped
    by consent and audited on every read like every other clinical read
    (invariant 4) - and it carries the SourceBox coordinates the provenance
    panel renders, because a value without its box is exactly what INT-121
    refuses to emit'
  - 'a route accepts a verdict and returns the confirmed item: confirm_record_item
    takes no `by=` and reads the actor off the closed vocabulary, so the route
    must not reintroduce a parameter that lets a caller assert who confirmed
    (invariant 12)'
  - 'the unit_conflict flag survives the transport intact and is not tidied into
    a corrected value on the way - the guard exists because a silently converted
    magnitude is the failure, and a transport that normalises defeats it
    (invariant 22)'
  - 'nothing in the payload is instruction-shaped: extracted text crosses the
    data boundary as data, through the one fence in intake_platform.data_boundary
