- id: INT-293
  epic: E08-mobile
  phase: P0
  # Found by driving the real app on the simulator end to end, 2 Sep 2026
  # (docs/evidence/INT-293.md). On the DIALOGUE surface I answered three
  # consecutive questions through the composer. The conversation advanced
  # correctly every time and the note never moved: "Not olusuyor 0 / 10 bolum"
  # after three answers, and every section still "Henuz yanitlanmadi" -
  # including Baslangic, read immediately after answering "Nasil basladi?".
  # Handing over to typed steps then started at "0 soru yanitlandi", so no
  # prefill carried either. The `today` branch that fires reliably in the typed
  # flow did not fire here.
  #
  # HONEST CAVEAT, and it is the first thing to test: my typed Turkish had no
  # diacritics ("Bugun basladi", not "Bugun basladi" with them) because the
  # driving tool cannot type them. So this may be an extraction-normalisation
  # failure rather than a missing write path. It does not change the severity.
  # Diacritic-free Turkish is what people actually type, the answer is silently
  # discarded, the agent moves on as though it understood, and the note the
  # clinician receives is empty. A patient who completes the whole voice intake
  # arrives at the visit with nothing.
