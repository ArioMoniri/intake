  depends_on: [INT-036, INT-037, INT-317]
  labels: [area:data, risk:legal]
  status: done
  evidence: docs/evidence/INT-392.md
  # Found on main's check-integration (GitHub #647): INT-317's migration 0013
  # added previsit_outputs.session_id -> sessions.id with no ON DELETE rule,
  # and no path removed the output first, so the DSAR erasure, the retention
  # executor and the test_api_postgres teardown all hit ForeignKeyViolation.
