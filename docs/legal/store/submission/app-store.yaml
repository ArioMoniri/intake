# The served App Store answers that are not listing copy: the category, the
# age-rating questionnaire, the content-rights answer and the App Review notes.
# eas_metadata.load_submission reads it; `make store-config` puts the EAS part into
# apps/mobile/store.config.json, and scripts/store/asc_listing.py writes the rest
# (advisory_asc, content_rights) to the App Store Connect draft.
#
# Promoted on 2026-10-16 by INT-495 (GitHub #846) from the draft of #828, which the
# legal lane approved. Under the owner's rule of 3 Oct 2026, legal sign-offs go to a
# sourced legal agent and a verifier, in synthetic scope; a licensed Turkish lawyer
# countersigns before any real patient.
#
# Submitting for review still waits on HB-L21 (a) and (e) and on every condition in
# docs/legal/drafts/store/app-review-notes.draft.md §1.
#
# `advisory` uses the EAS schema's keys; `advisory_asc` answers the keys the live
# App Store Connect API asks beyond them (read 2026-10-16; ageRatingOverrideV2 read
# 2026-10-29 for the INT-502 legal review, B8: the top age band while no guardian
# flow exists). Every answer cites its
# source. Answers that carry a `note` are judgements for the legal lane. The
# reviewer contact and sign-in are never written here; the owner enters them in App
# Store Connect. The privacy-policy link, support URL and copyright stay null until
# HB-L27 and HB-L21(e) answer them.
