# INT-502 legal review B5 and re-check R1/R2: while this is set, the notes reach
# neither store.config.json nor App Store Connect. Removing it is a legal-lane edit,
# made only when every owner below has made the notes true of the review build.
review_notes_hold: "INT-117 Stage A (static 112 notice; no patient-facing RED on the review host), INT-488 reviewer sign-in, INT-587 delivery, INT-440/INT-454 release voice (voice intake, Microphone), a malware scanner on the review host (Camera: upload fails closed, docs/runbooks/staging.md)"
review_notes: |-
  Önvizit is a pre-visit intake app. Before a medical visit, the user describes their complaints by voice or by typing, one question at a time. The app turns the answers into a structured note, shows it to the user, and sends it only to the clinician the user chooses.

  What the app does not do: it does not diagnose, it does not recommend treatment, and it does not tell the user how urgent a complaint is. It makes no claim about how well it measures anything.

  Emergencies: Önvizit is not an emergency service. The app shows a fixed notice telling the user to call 112, the emergency number in Türkiye, or to go to the nearest emergency department.

  Apple Health: with the user's permission, the app reads step count, resting heart rate and sleep. It only reads and never writes to Apple Health. The data stays on the device unless the user adds a summary to their note, and it is never used for advertising.

  Microphone: used only during a voice intake, to turn the answer into text. Audio is never written to disk, to a database or to logs.

  Camera: used only to photograph the user's own medical report so that it can be uploaded.

  Account deletion: Profile > Your data lets the user request deletion of their account and data.

  Test environment and sign-in: this build connects to a test environment that holds simulated patients only. No real patient data is present. The reviewer account is a simulated patient, and its sign-in details are in the App Review Information section of this submission.
