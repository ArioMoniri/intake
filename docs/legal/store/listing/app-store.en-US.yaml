# The served App Store listing for Önvizit, English. intake_platform.store.listing
# loads it hash-bound to its bytes, and `make store-config` renders
# apps/mobile/store.config.json from it.
#
# Promoted on 2026-10-16 by INT-495 (GitHub #846) from the draft of #828, which the
# legal lane approved. Under the owner's rule of 3 Oct 2026, legal sign-offs go to a
# sourced legal agent and a verifier, in synthetic scope; a licensed Turkish lawyer
# countersigns before any real patient.
#
# Submitting for review still waits on HB-L21 (a) and (e) and on every condition in
# docs/legal/drafts/store/app-review-notes.draft.md §1.
#
# Every line of `fields` cites its source under `sources`.
provenance:
  issue: INT-482
  store: app-store
  locale: en-US
  status: served — legal lane approved (#828), promoted by INT-495
  prepared_on: "2026-10-04"
fields:
  title: Önvizit
  subtitle: "Your note before the visit"
  promoText: "What you tell us reaches your doctor before the visit."
  keywords: "doctor,visit,clinic,hospital,complaints,health,pre-visit,note,reports,lab results,voice note"
  description: |-
    Önvizit is made for describing your complaints before a medical visit.
    From what you say, a structured pre-visit note is prepared for your doctor.
    The note is organised with the help of AI and shown to you before it is sent.

    • You can speak or type your answers.
    • Only one question is asked at a time.
    • You can read and edit your note before you send it.
    • What gets shared is your decision.
    • You can stop a share at any time.
    • You can upload your own reports and lab results.
    • If you wish, you can also add step, sleep and resting heart rate summaries from your phone.

    Your voice is turned into text; the audio is not written to your phone or to our servers.

    Önvizit does not diagnose and does not recommend treatment.
    What you tell it does not replace a doctor's assessment.
    Önvizit is not an emergency service.
    In an emergency, call 112 or go to the nearest emergency department.
sources:
