# The served App Store listing for Önvizit, Turkish. The Turkish text governs
# (805 s. Kanun). intake_platform.store.listing loads it hash-bound to its bytes, and
# `make store-config` renders apps/mobile/store.config.json from it.
#
# Promoted on 2026-10-16 by INT-495 (GitHub #846) from the draft of #828, which the
# legal lane approved. Under the owner's rule of 3 Oct 2026, legal sign-offs go to a
# sourced legal agent and a verifier, in synthetic scope; a licensed Turkish lawyer
# countersigns before any real patient.
#
# Submitting for review still waits on HB-L21 (a) and (e) and on every condition in
# docs/legal/drafts/store/app-review-notes.draft.md §1.
#
# Every line of `fields` cites its source under `sources`.
provenance:
  issue: INT-482
  store: app-store
  locale: tr
  status: served — legal lane approved (#828), promoted by INT-495
  prepared_on: "2026-10-04"
fields:
  title: Önvizit
  subtitle: "Muayeneden önce ön notunuz"
  promoText: "Muayeneden önce, anlattıklarınız hekiminize ulaşsın."
  keywords: "muayene,hekim,doktor,hastane,poliklinik,şikâyet,sağlık,ön not,rapor,tahlil,sesli not"
  description: |-
    Önvizit, muayeneden önce şikâyetlerinizi anlatmanız için hazırlandı.
    Anlattıklarınızdan hekiminiz için düzenli bir ön not hazırlanır.
    Not, yapay zekâ desteğiyle düzenlenir ve gönderilmeden önce size gösterilir.

    • Şikâyetinizi sesli ya da yazılı olarak anlatabilirsiniz.
    • Her seferinde yalnızca bir soru sorulur.
    • Notunuzu göndermeden önce okuyabilir ve düzenleyebilirsiniz.
    • Neyin paylaşılacağına siz karar verirsiniz.
    • Bir paylaşımı dilediğiniz an durdurabilirsiniz.
    • Raporlarınızı ve tahlil sonuçlarınızı yükleyebilirsiniz.
    • İsterseniz telefonunuzdaki adım, uyku ve dinlenme nabzı özetlerini de ekleyebilirsiniz.

    Sesiniz yazıya dökülür; ses kaydı telefonunuza ya da sunucularımıza yazılmaz.

    Önvizit tanı koymaz ve tedavi önermez.
    Anlattıklarınız hekim değerlendirmesinin yerine geçmez.
    Önvizit bir acil durum hizmeti değildir.
    Acil bir durum yaşıyorsanız 112'yi arayın veya en yakın acil servise başvurun.
sources:
  title: "docs/backlog/issues.yaml — INT-421 acceptance names the Önvizit identity; the store name is GitHub #825"
  subtitle: "apps/mobile/src/lib/i18n/tr.ts welcome.body (\"ön not\")"
  promoText: "apps/mobile/src/lib/i18n/tr.ts app.tagline, verbatim"
  keywords: "apps/mobile/src/lib/i18n/tr.ts — each keyword names what the app is used for (welcome.body, review.title, records.title)"
  description:
    - text: "Önvizit, muayeneden önce şikâyetlerinizi anlatmanız için hazırlandı."
      source: "apps/mobile/src/lib/i18n/tr.ts welcome.body (\"muayeneden önce şikâyetlerinizi … toplar\")"
    - text: "Anlattıklarınızdan hekiminiz için düzenli bir ön not hazırlanır."
      source: "apps/mobile/src/lib/i18n/tr.ts welcome.body (\"hekiminize düzenli bir ön not iletir\")"
    - text: "Not, yapay zekâ desteğiyle düzenlenir ve gönderilmeden önce size gösterilir."
      source: "files/06_COMPLIANCE_TR.md §7 note footer (\"yapay zekâ desteğiyle yapılandırılmıştır\"); apps/mobile/src/app/(tabs)/visits/[visitId]/review.tsx"
    - text: "Şikâyetinizi sesli ya da yazılı olarak anlatabilirsiniz."
      source: "apps/mobile/src/lib/i18n/tr.ts welcome.body (\"sesli ya da yazılı\")"
    - text: "Her seferinde yalnızca bir soru sorulur."
      source: "CLAUDE.md invariant 2 (one question per turn); files/03_ARCHITECTURE.md §4.2"
    - text: "Notunuzu göndermeden önce okuyabilir ve düzenleyebilirsiniz."
      source: "apps/mobile/src/lib/i18n/tr.ts review.title, review.edit, review.send"
    - text: "Neyin paylaşılacağına siz karar verirsiniz."
      source: "apps/mobile/src/lib/i18n/tr.ts review.intro, second sentence verbatim"
    - text: "Bir paylaşımı dilediğiniz an durdurabilirsiniz."
      source: "apps/mobile/src/lib/i18n/tr.ts shares.guide.body (\"Dilediğiniz an durdurabilirsiniz.\")"
    - text: "Raporlarınızı ve tahlil sonuçlarınızı yükleyebilirsiniz."
      source: "apps/mobile/src/app/(tabs)/records.tsx; apps/mobile/src/lib/i18n/tr.ts records.upload, records.guide.title"
    - text: "İsterseniz telefonunuzdaki adım, uyku ve dinlenme nabzı özetlerini de ekleyebilirsiniz."
      source: "apps/mobile/src/lib/health/healthKitConnector.ts (steps, resting heart rate, sleep; read-only); apps/mobile/src/lib/i18n/tr.ts health.rhr.label"
    - text: "Sesiniz yazıya dökülür; ses kaydı telefonunuza ya da sunucularımıza yazılmaz."
      source: "CLAUDE.md invariant 3; tests/voice/test_audio_retention_guard.py"
    - text: "Önvizit tanı koymaz ve tedavi önermez."
      source: "apps/mobile/src/lib/i18n/tr.ts app.disclaimer; files/06_COMPLIANCE_TR.md §0.4"
    - text: "Anlattıklarınız hekim değerlendirmesinin yerine geçmez."
      source: "apps/mobile/src/lib/i18n/tr.ts app.disclaimer, second sentence verbatim"
    - text: "Önvizit bir acil durum hizmeti değildir."
      source: "files/06_COMPLIANCE_TR.md §0.3 Stage A (no automated patient-facing urgency advice)"
    - text: "Acil bir durum yaşıyorsanız 112'yi arayın veya en yakın acil servise başvurun."
      source: "files/06_COMPLIANCE_TR.md §7 static safety line, verbatim"
