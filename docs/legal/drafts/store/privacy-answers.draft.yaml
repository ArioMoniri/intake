# TASLAK — hukuk danışmanı onayı gerektirir / DRAFT — requires counsel sign-off; not in force
#
# INT-482 (GitHub #825) — the App Privacy and Data safety answers, in our own
# words, one row per data-inventory fact (invariant 18). GENERATED: do not edit.
# tests/legal/test_store_privacy_answers.py fails when this file differs from
#   uv run python -m intake_platform.store.answers
# so regenerate it with that command (output below this header) after any
# change to a column annotation or an off-schema flow.
#
# What the sheet does not do: name a vendor data type. Apple's App Privacy types
# and Google Play's Data safety categories are applied by
# intake_platform.store.declaration from a committed snapshot of each form
# (HB-A12). Read the caveats first; the synthetic-scope one binds every row.
provenance:
  issue: INT-482
  status: pending legal-lane review
  derived_from: intake_platform.store.facts.data_facts
  regenerate: uv run python -m intake_platform.store.answers
caveats:
- id: synthetic_scope
  text: Until an in-country host or counsel's cross-border decision exists (HB-I5, HB-L11),
    the production host receives simulated patients only (docs/release/production-checklist.md).
    These answers describe the product as built. They do not say that real patient data is
    processed today, and no public release may go live while that scope holds.
- id: vendor_vocabulary
  text: No vendor data type is named here. A row becomes an App Privacy type or a Data safety
    category only through intake_platform.store.declaration and a committed snapshot of the
    vendor's form (HB-A12).
- id: seller_identity
  text: The seller's legal entity, privacy-policy URL and support contact are owed by HB-L21(e);
    the privacy policy itself is the unsigned gizlilik document (HB-L27).
product:
- id: tracking
  answer: 'none: the app asks for no tracking authorisation and links no tracking-transparency
    module'
  sources:
  - apps/mobile/app.json
  - apps/mobile/package.json
- id: advertising
  answer: 'none: no inventory purpose is advertising or marketing'
  sources:
  - packages/intake_platform/src/intake_platform/store/facts.py
- id: encryption_in_transit
  answer: 'yes: the production build talks to the API over https only'
  sources:
  - apps/mobile/eas.json
- id: deletion
  answer: 'yes: the patient requests deletion in the app (Profilim, Verileriniz); the server
    runs it after a grace period, then crypto-shreds'
  sources:
  - apps/mobile/src/lib/dsar/requests.ts
  - services/api/src/intake_api/dsar/router.py
- id: health_platform
  answer: Apple Health and Health Connect data is read only and never written back; it stays
    on the handset unless the patient adds a summary to the note
  sources:
  - apps/mobile/src/lib/health/healthKitConnector.ts
