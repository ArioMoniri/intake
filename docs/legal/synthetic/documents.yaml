    ask: "Owner and counsel: name INTAKE's legal entity and its contact points; and, through INT-535 (GitHub #902), record the Netgsm DPA, the KVKK m.9 ground for the us-east-1 leg and the phone-entry notice, so the app-channel notice can name the controller, every recipient and the transfer truthfully."
