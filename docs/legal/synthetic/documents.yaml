# docs/legal/synthetic/documents.yaml — the SYNTHETIC-SCOPE legal index (INT-529).
#
# SYNTHETIC TENANTS ONLY. Owner decision, 16 Oct 2026, relayed: "for third do
# recommended" — yes to the INT-498 audit's proposal P6. The legal lane (D25,
# GitHub #800: a sourced legal-author agent, then an independent
# legal-reviewer agent) authors these texts for the synthetic host, where every
# patient is invented. They are not legal texts for a real person: a licensed
# Turkish lawyer countersigns before any real patient (HB-L27, G3), and the
# real-tenant index docs/legal/documents.yaml stays empty and untouched.
#
# HOW THIS INDEX IS READ — intake_platform.legal.synthetic.SyntheticLegalIndex
#   - only when INTAKE_DEPLOYMENT_DATA_CLASS=synthetic is baked into the image
#     (infra/staging/Dockerfile.api); a real_phi boot refuses this tree and a
#     synthetic boot refuses the real one (intake_api.settings);
#   - ids are the INT-210 aydınlatma and açık rıza ids; each file path comes
#     from REQUIRED_DOCUMENTS, never from this file;
#   - each row binds {version, sha256}: the bytes must hash to sha256 and the
#     file's consent_text_version must equal version, or nothing serves;
#   - every served body carries "Sentetik test metni" on its first line;
#   - `grounds` names the declared values each text states: retention classes
#     from packages/intake_platform/src/intake_platform/retention/
#     retention_policy.yaml (status: sourced, or a non_persisted row), and
#     recipients, categories and bases as constants of
#     intake_platform.db.inventory. tests/legal/test_synthetic_legal_index.py
#     checks every name resolves and none is an awaiting-human value.
#
# AWAITING-HUMAN — an id below is unbuilt because a value it must state is not
# declared anywhere in the repository. It refuses as missing and names the
# gap. Retention periods, recipients and new data categories are the owner's
# to decide (CLAUDE.md, "When to stop and ask the human"); none is guessed.
# docs/evidence/INT-529.md §4 is the table, docs/backlog/blockers.md the ask.

