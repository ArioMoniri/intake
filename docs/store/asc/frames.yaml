# INT-502 (GitHub #856): how the Önvizit App Store screenshots and the product page
# header are made. It covers which screens are captured, how each frame is laid out,
# and which sizes are rendered.
#
#   capture  scripts/store/capture_frames.py drives the iPhone 17 Pro Max simulator
#            (iOS 26.5) and saves one PNG per frame at its native 1320×2868 into
#            docs/store/asc/captures/<locale>/, with provenance.yaml beside them.
#   render   scripts/store/render_frames.py lays each capture into a frame
#            (scripts/store/frame_plan.py) and paints it with CoreGraphics
#            (scripts/store/paint.swift). It writes every target size and checks each
#            file with scripts/store/asc_assets.py. It reads captions only from the
#            served copy; --preview takes a caption file by path and writes outside
#            the repository.
#   upload   INT-495's writer (scripts/store/asc_listing.py), after the owner's yes.
#
# The design is the app's own. The colours are tokens of apps/mobile/src/lib/theme.ts,
# and the two faces are the app's own OFL fonts. The phone frame is drawn here, not
# taken from anyone's device artwork. There is no third-party logo, stock image or
# generated imagery. Everything inside the phone is a capture of the real app.
spec_version: 1

capture:
  device: "iPhone 17 Pro Max"
  runtime: "iOS 26.5"
  size: [1320, 2868]
  # The simulator's own screen mask (xcrun simctl io screenshot --mask=alpha): the
  # device's real corners and island come out transparent, so the drawn phone body
  # shows through them and the frame never draws an island of its own.
  mask: alpha
  # The status bar every capture carries (xcrun simctl status_bar override).
  status_bar: {time: "09:41", battery: 100, cellular_bars: 4, wifi_bars: 3}
  # What the store build does, set before the first shot and recorded in
  # provenance.yaml: voice consent off, and a visit starts typed (Görünüm,
  # appearance.start). Voice intake is __DEV__-only in a store build.
  app_state: {voice: "off", start_mode: "typed"}
  locales:
    tr: {apple_language: "tr", apple_locale: "tr_TR"}
    en-US: {apple_language: "en", apple_locale: "en_US"}

# Fonts: the app's own faces (apps/mobile/src/lib/theme.ts `fonts`), read from the
# app's installed packages and pinned by sha256. Licence: the raw LICENSE_FONT file
# of each package, read 2026-10-29. "This Font Software is licensed under the SIL
# Open Font License, Version 1.1."
fonts:
  display:
    package: "@expo-google-fonts/newsreader"
    version: "0.4.1"
    file: "500Medium/Newsreader_500Medium.ttf"
    licence: "OFL-1.1"
    sha256: "64dadba9c887b4c871dfdc7d3146ae1e288cc26940baeacf9a313a30fd06e2d9"
  label:
    package: "@expo-google-fonts/inter"
    version: "0.4.2"
    file: "600SemiBold/Inter_600SemiBold.ttf"
    licence: "OFL-1.1"
    sha256: "f30e9d2574c3bec5144347ff965f9841c8f06857f0b7383000f8c9489a161841"

# Tokens of apps/mobile/src/lib/theme.ts, by name there.
theme:
  light:
    ground: "#FAF8F4"    # palette.light.background
    ink: "#1C1B18"       # palette.light.ink
    accent: "#0F7B6C"    # palette.light.primary
    body: "#1C1B18"      # palette.light.ink: the phone body
    rim: "#5C594F"       # palette.light.inkSoft
    shadow: {color: "#1C1B18", opacity: 0.07, radius: 18, offset_y: 8}  # shadows.light
  dark:
    ground: "#0F0E0C"    # palette.dark.background
    ink: "#F2F0EA"       # palette.dark.ink
    accent: "#4FA79A"    # palette.dark.primary
    body: "#211F1B"      # palette.dark.surface
    rim: "#353128"       # palette.dark.border
    shadow: null         # shadows.dark: no shadow on the dark ground

# Fractions. W and H are the canvas width and height. The tests hold the margins,
# the even sides, the readable sizes and the capture's own aspect.
layout:
  frame:
    text_top: 0.056          # of H
    side: 0.08               # of W: the least side margin, for text and phone
    eyebrow_size: 0.038      # of W
    headline_size: 0.088     # of W
    headline_leading: 1.08
    headline_lines: 2        # the block always holds two lines
    eyebrow_gap: 0.010       # of H
    phone_gap: 0.026         # of H
    bottom: 0.040            # of H
    bezel: 0.022             # of the phone's width
    screen_radius: 0.125     # of the screen's width
    pt_width: 440            # the capture device's width in points, for the shadow
  header:
    text_top: 0.090          # of H
    eyebrow_size: 0.034      # of H
    headline_size: 0.068     # of H
    eyebrow_gap: 0.012       # of H
    phone_gap: 0.045         # of H
    bottom: 0.070            # of H
    gutter: 0.040            # of W, between phones
    phones: [bugun, tek-soru, not]

# Every size a frame is rendered at, by its docs/store/asc/assets.yaml slot.
targets:
  - {slot: iphone-large, size: [1320, 2868], label: "6.9 inch, large Dynamic Island"}
  - {slot: iphone-faceid-large, size: [1284, 2778], label: "6.5 inch, large Face ID"}
  - {slot: iphone-medium, size: [1206, 2622], label: "6.3 inch, medium Dynamic Island (required)"}
header:
  slot: product-page-header
  size: [3840, 1646]
  caption: header

# Never in any capture. scripts/store/capture_frames.py prints this before each shot.
must_not_show:
  - "a development, demo, test, mock or sample label, account or banner (deneme hastası, Deneme hesabıyla girin, örnek)"
  - "the synthetic-text notice of a consent text (Sentetik test metni)"
  - "a phone number, a one-time code, a share code or a share key"
  - "a real person's or doctor's name, or a hospital's or clinic's proper name, real or invented: the new-visit form requires a hospital, so it holds the generic facility type Aile sağlığı merkezi"
  - "a synthetic or sample marker inside content (Sentetik Hastane, Örnek Hastanesi)"
  - "a third-party logo or brand"
  - "a RED, emergency or 112 screen"
  - "development-client chrome: the dev menu, a LogBox toast, the voice diagnostic banner"
  - "the keyboard, a text caret or a half-finished animation"
  - "a surface the store build does not have (voice intake is __DEV__-only on main today)"
  - "a voice or emotion affordance (Sesli görüşme rows, Ses tonundan duygu ipuçları, Yazıdan dil ipuçları, Konuşarak, a microphone button) or an emergency-flag sentence (Acil bir işarette …)"

# The journey, in order. route is the expo-router path; {visit} is one simulated
# visit's id. file is the screen it renders, and the tests check that it exists.
frames:
  - id: bugun
    route: "/today"
    file: "apps/mobile/src/app/(tabs)/today.tsx"
    appearance: light
    state: "the next simulated visit after one typed answer, its card offering Devam edin (never the ≈3 dk estimate)"
  - id: konusma
    route: "/visits/{visit}/intake"
    file: "apps/mobile/src/app/(tabs)/visits/[visitId]/intake.tsx"
    appearance: light
    state: "the typed step (StepFlow): the open question with a simulated patient's own words typed in"
    waits_for: "INT-588 (#989): intake.open.hint still offers speaking in a no-voice build"
  - id: tek-soru
    route: "/visits/{visit}/intake"
    file: "apps/mobile/src/app/(tabs)/visits/[visitId]/intake.tsx"
    appearance: light
    state: "a closed-choice question from the served pack, before it is answered (a single choice advances on tap)"
  - id: not
    route: "/visits/{visit}/review"
    file: "apps/mobile/src/app/(tabs)/visits/[visitId]/review.tsx"
    appearance: light
    state: "the note before sending, sections marked Paylaşılıyor and one Paylaşılmıyor"
    waits_for: "INT-587 (#988): its pixels show Hekiminize gönderin and Kime gidiyor, a delivery that does not work yet; the header, which shows this frame, waits too"
  - id: verileriniz
    route: "/me/data"
    file: "apps/mobile/src/app/(tabs)/me/data.tsx"
    appearance: light
    state: "the data screen with the request to erase the record, nothing requested yet"
  - id: izinler
    route: "/me/consents"
    file: "apps/mobile/src/app/(tabs)/me/consents/index.tsx"
    appearance: light
    state: "the consent list with core on and every optional purpose off"
    scroll: "İzinleriniz scrolled so that neither the core footer nor the Sesli görüşme group is in frame; any learning row shown keeps its footer"
    drop_if: "no scroll position achieves the scroll state (legal review B7)"
    dropped: "2026-10-31, build 7 (690a16bb): scrolled to the end of the list, the Sesli görüşme group's last rows (Ses tonundan duygu ipuçları, Yazıdan dil ipuçları) and its footer stay in frame, so no scroll position achieves the B7 state"
  - id: gorunum
    route: "/me/appearance"
    file: "apps/mobile/src/app/(tabs)/me/appearance.tsx"
    appearance: dark
    state: "the text-size ladder with one step chosen, clear of the tab rail"
    scroll: "scrolled so that appearance.start is not in frame (legal review B7: crop clear of appearance.start)"
    drop_if: "no scroll position achieves the scroll state (legal review B7)"
