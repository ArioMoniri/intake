# Gitleaks config — extends the default ruleset; entries here are narrowly
# scoped false positives, never secret classes. (Invariant 14: gates are not
# weakened — an allowlist row must name a public, non-secret pattern.)
[extend]
useDefault = true

# ONE global table, `[allowlist]`, on purpose (INT-426). CI pins gitleaks
# 8.24.3 (security.yml's gitleaks-action v2.3.9; infra/ci/Dockerfile.runner),
# and 8.24.3 reads only this form. The plural `[[allowlists]]` arrived in
# 8.25.0, and 8.24.3 skips it without a word. On 2 Oct 2026, with the rows in
# that form, the full-history scan on main reported 6 findings under 8.24.3
# and 2 under 8.30.1. tests/ci/test_gitleaks_pin_compat.py pins the table name
# and the exact row set. The rows below are unchanged; the regexes are OR-ed,
# exactly as three separate tables were.
#
# Every row is matched against the CAPTURED SECRET (gitleaks' default
# regexTarget). The two INT-019 rows are ANCHORED end to end, which is the
# only scoping that provably cannot silence anything else. `paths` is
# deliberately NOT used: a path allowlist exempts the whole file, so a real
# key pasted into that same file would stop being a finding.
# scripts/ci/gate_selftest.sh plants exactly that in each of the two files
# these rows name and asserts gitleaks still rejects it, and
# tests/ci/test_security_gates.py asserts that near-miss is still there.
[allowlist]
description = "public artefact ids, env-var references and prose that pattern-match secret heuristics"
regexes = [
  # actions/cache keys naming the pinned deid model artefact + sha fragment —
  # the sha is public (it is IN the Makefile pin); nothing here grants access.
  '''deid-tr-ner-v1-[0-9a-f]{8}''',
  # A credential that is an env-var REFERENCE, not a literal. gitleaks'
  # `curl-auth-user` rule matches any `-u name:value` without asking whether
  # the value is a literal. In infra/docker-compose.siem.yml the value is a
  # compose-escaped variable reference, `curl -sk -u admin:$${INDEXER_PASSWORD}`,
  # so the file holds no credential at all; the real one comes from OpenBao
  # (invariant 14). Anchored, so `admin:Sup3rS3cret` on the same flag still fails.
  '''^[A-Za-z0-9_.-]+:\$\$?\{[A-Za-z_][A-Za-z0-9_]*\}$''',
  # A product name in prose, matched by generic-api-key. The captured 'secret'
  # is the literal string `WAF/CrowdSec`: two security product names in the
  # monitoring-signals sentence of files/10 §7 ("token reuse detections,
  # WAF/CrowdSec blocks, admin actions…"). Anchored to that exact string, so
  # any other high-entropy run in the same file still fails.
  '''^WAF/CrowdSec$''',
]
