      - "`gate:` (this file, per the authoring brief) vs `when:` (12 §2.4 and the
         DENY_SUFFIXES list in 12 §3.2). One name must give. If `gate` wins, the deny-list
         suffix must change too, or an overlay could reach the predicate."
      - "Whether `action` keyed by location lives on the rule or on a shared action
         library. Four exemplars already repeat the UNKNOWN branch verbatim; thirty-four
         will repeat it thirty-four times, and a copy-paste divergence in the one-question
         branch is a silent safety bug."
      - "`show_112: false` under ON_SITE is currently a per-action flag. It would be safer
         as a compiler-enforced invariant — `on_site_action_never_offers_112` — so that an
         author cannot set it true at all."

