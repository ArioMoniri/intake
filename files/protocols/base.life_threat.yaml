    items:
      - "`evidence:` (this file) vs `source:` (04 §8.1 rule 3, 12 §2.5). Same field, two
         names. The CI gate is literally called `every_red_rule_has_a_source_block`, so if
         `evidence` wins the gate name has to move with it or it will silently pass by
