      - "Item 4 (`show_112` under ON_SITE) — INT-040/INT-254. It is now BOTH: still a
         per-action flag on disk, and a model validator on RedFlagAction that refuses
         `show_112: true` under ON_SITE outright, plus a compiler refusal
         (RefusalCode.ON_SITE_OFFERS_112). An author cannot set it true. NOT closed by
