         `source` are canonical in code, in the deny-list and in every gate name; THIS FILE
         keeps `gate:` and `evidence:` and the loader normalises them, so the exemplars stay
         as the clinician will read them. The risk the item named is closed: one RedFlagRule
         type serves both documents, so `every_red_rule_has_a_source_block` sees these rules
